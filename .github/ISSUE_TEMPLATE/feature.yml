name: Feature request
description: An idea that would make GroupToDo more useful
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the open issues first. If someone already asked for it, add a 👍 there instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it now?
      description: A workaround, another app, or not at all.
