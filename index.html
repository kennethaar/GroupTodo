<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>GroupTodo</title>
<style>
/* ============================================================
   00_TOKENS
   ============================================================ */
:root{
  --bg:#0f1115; --bg2:#161920; --bg3:#1d212b; --bg4:#252a36;
  --fg:#e6e9ef; --fg2:#a4acbd; --fg3:#6d7689;
  --border:#252a36; --border2:#333a4a;
  --accent:#6aa3ff; --accent2:#2f6fd0; --accent-fg:#06101f;
  --todo:#6aa3ff; --doing:#c792ea; --wait:#e0b050; --done:#4fbf7b; --cancel:#6d7689;
  --late:#ff6b6b; --today:#e0b050; --ok:#4fbf7b; --warn:#e0b050; --danger:#ff6b6b;
  --ctx:#5ecfc0; --proj:#ff9f6b; --zet:#c792ea;
  --radius:10px; --radius-sm:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#fbfbfd; --bg2:#ffffff; --bg3:#f1f3f7; --bg4:#e6e9f0;
  --fg:#1b1f27; --fg2:#525b6d; --fg3:#858ea0;
  --border:#e2e6ee; --border2:#cfd5e1;
  --accent:#2f6fd0; --accent2:#2f6fd0; --accent-fg:#ffffff;
  --todo:#2f6fd0; --doing:#8b5cd6; --wait:#b57f12; --done:#1f9254; --cancel:#858ea0;
  --late:#d33; --today:#b57f12;
  --ctx:#0f8d7d; --proj:#c25b1e; --zet:#8b5cd6;
  --shadow:0 8px 32px rgba(20,30,60,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   05_LAYOUT
   ============================================================ */
#app{display:grid;grid-template-columns:248px 1fr;height:100dvh;overflow:hidden}
#sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 96px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* ---------- sidebar ---------- */
.brand{
  display:flex;align-items:center;gap:9px;padding:14px 16px 10px;
  font-weight:650;letter-spacing:-.2px;
}
.brand .logo{
  width:24px;height:24px;border-radius:7px;background:linear-gradient(140deg,var(--accent),var(--zet));
  display:grid;place-items:center;font-size:13px;color:#fff;flex:none;
}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--fg3);letter-spacing:0}
.nav{flex:1;overflow-y:auto;padding:4px 8px 12px}
.nav-group{margin-top:10px}
.nav-group>h3{
  margin:0;padding:6px 8px 4px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.9px;color:var(--fg3);
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;
  border-radius:var(--radius-sm);color:var(--fg2);font-size:13.5px;text-align:left;
}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--bg4);color:var(--fg);font-weight:550}
.nav-item .ic{width:17px;text-align:center;flex:none;font-size:13px;opacity:.95}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg3);
  background:var(--bg3);border-radius:20px;padding:1px 6px;min-width:20px;text-align:center;
}
.nav-item.active .cnt{background:var(--bg2)}
.nav-item .cnt.hot{background:rgba(255,107,107,.18);color:var(--late)}
.nav-item .key{font-family:var(--mono);font-size:10px;color:var(--fg3);opacity:.6}
.vaultbar{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}
.vaultbar .row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg3);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)}
.dot.sync{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;gap:10px;padding:12px 20px 10px;
  border-bottom:1px solid var(--border);background:var(--bg);flex:none;
}
header.top .burger{display:none}
.h-title{font-size:19px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;min-width:0}
.h-title .sub{font-size:12px;font-weight:400;color:var(--fg3)}
.h-sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--radius-sm);
  background:var(--bg3);color:var(--fg2);font-size:13px;border:1px solid transparent;white-space:nowrap;
}
.btn:hover{background:var(--bg4);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:550}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.ghost{background:none;border:1px solid var(--border2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.6}

/* ============================================================
   10_NUDGES
   ============================================================ */
.nudgebar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.nudge{
  display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border);font-size:12.5px;color:var(--fg2);
}
.nudge:hover{border-color:var(--border2);color:var(--fg)}
.nudge b{font-variant-numeric:tabular-nums;color:var(--fg)}
.nudge.warn{background:rgba(224,176,80,.12);border-color:rgba(224,176,80,.3);color:var(--warn)}
.nudge.warn b{color:var(--warn)}
.nudge.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.32);color:var(--late)}
.nudge.danger b{color:var(--late)}
.nudge.ok{background:rgba(79,191,123,.1);border-color:rgba(79,191,123,.28);color:var(--ok)}

.hero{
  margin:14px 0 6px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);
}
.hero h2{margin:0 0 3px;font-size:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--fg3);font-weight:600}
.hero p{margin:0 0 12px;color:var(--fg2);font-size:13.5px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   15_TASK ROWS
   ============================================================ */
.section{margin:20px 0 0}
.section>h3{
  display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 2px;
  font-size:12px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);
}
.section>h3 .n{background:var(--bg3);border-radius:20px;padding:0 7px;font-size:11px;color:var(--fg2)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.empty{padding:16px;color:var(--fg3);font-size:13px;text-align:center}

.task{
  display:flex;align-items:flex-start;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--border);position:relative;
}
.task:last-child{border-bottom:none}
.task:hover{background:var(--bg3)}
.task.sel{background:var(--bg4)}
.chk{
  width:19px;height:19px;border-radius:50%;border:1.6px solid var(--fg3);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s;
}
.chk:hover{border-color:var(--done);color:var(--fg3)}
.task[data-state="DONE"] .chk{background:var(--done);border-color:var(--done);color:#06210f}
.task[data-state="CANCELLED"] .chk{background:var(--cancel);border-color:var(--cancel);color:#fff}
.task[data-state="WAIT"] .chk{border-color:var(--wait);color:var(--wait)}
.task[data-state="DOING"] .chk{border-color:var(--doing);color:var(--doing)}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;word-wrap:break-word;overflow-wrap:anywhere}
.task[data-state="DONE"] .t-title,.task[data-state="CANCELLED"] .t-title{color:var(--fg3);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:20px;
  background:var(--bg3);color:var(--fg3);border:1px solid transparent;white-space:nowrap;
}
.chip.ctx{color:var(--ctx);background:rgba(94,207,192,.11)}
.chip.proj{color:var(--proj);background:rgba(255,159,107,.11)}
.chip.late{color:var(--late);background:rgba(255,107,107,.13)}
.chip.today{color:var(--today);background:rgba(224,176,80,.13)}
.chip.miss{color:var(--warn);background:rgba(224,176,80,.1);border-color:rgba(224,176,80,.3)}
.chip.age{font-family:var(--mono);font-size:10.5px}
.chip.st{font-family:var(--mono);font-size:10px;letter-spacing:.5px}
.chip.b{cursor:pointer}
.chip.b:hover{border-color:var(--border2);color:var(--fg2)}
.t-act{display:flex;gap:2px;opacity:0;flex:none;transition:.12s}
.task:hover .t-act,.task.sel .t-act{opacity:1}
.iconbtn{
  width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--fg3);font-size:13px;
}
.iconbtn:hover{background:var(--bg4);color:var(--fg)}
@media (hover:none){.t-act{opacity:1}}

/* ---------- outliner ---------- */
.outline{padding:10px 12px}
.blk{padding-left:18px;position:relative}
.blk>.line{display:flex;align-items:flex-start;gap:7px;padding:2px 0;border-radius:4px}
.blk>.line:hover{background:var(--bg3)}
.bullet{
  position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--fg3);flex:none;cursor:pointer;
}
.blk.has-kids>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk.collapsed>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk .txt{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:anywhere;font-size:14px;padding:1px 0}
.blk .txt[contenteditable]{outline:none}
.blk .props{font-family:var(--mono);font-size:11px;color:var(--fg3);padding-left:0;margin:1px 0 2px}
.blk .bodyline{font-size:13px;color:var(--fg2);white-space:pre-wrap}
.state{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:1px 5px;border-radius:4px;flex:none;margin-top:2px;cursor:pointer;
}
.state.TODO{background:rgba(106,163,255,.16);color:var(--todo)}
.state.DOING{background:rgba(199,146,234,.16);color:var(--doing)}
.state.WAIT{background:rgba(224,176,80,.16);color:var(--wait)}
.state.DONE{background:rgba(79,191,123,.14);color:var(--done)}
.state.CANCELLED{background:var(--bg4);color:var(--cancel)}
.tag{color:var(--ctx);cursor:pointer}
.tag:hover{text-decoration:underline}
.wikilink{color:var(--accent);cursor:pointer}
.wikilink:hover{text-decoration:underline}
.wikilink.ctx{color:var(--ctx)} .wikilink.zet{color:var(--zet)} .wikilink.proj{color:var(--proj)}
code{font-family:var(--mono);font-size:.9em;background:var(--bg3);padding:1px 4px;border-radius:4px}

/* ---------- project/page list ---------- */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--bg3)}
.prow .st{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:11px;font-weight:700;
}
.st-1{background:rgba(106,163,255,.16);color:var(--todo)}
.st-3{background:rgba(224,176,80,.16);color:var(--wait)}
.st-2{background:var(--bg4);color:var(--fg3)}
.st-0{background:rgba(79,191,123,.14);color:var(--done)}
.st-_{background:var(--bg4);color:var(--cancel)}
.prow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:11.5px;color:var(--fg3)}

/* ============================================================
   20_MODALS
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.scrim.center{align-items:center}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:14px 14px 0 0;
  width:min(640px,100%);max-height:86dvh;display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;
}
.scrim.center .modal{border-radius:14px}
.modal header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex:none;
}
.modal header h2{margin:0;font-size:15px;font-weight:650}
.modal header .hint{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
.modal .body{overflow-y:auto;padding:10px 0;flex:1}
.modal .foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex:none}
.pick{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 16px;text-align:left;font-size:14px;color:var(--fg2);
}
.pick:hover,.pick.cur{background:var(--bg3);color:var(--fg)}
.pick .k{
  font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;flex:none;
  background:var(--bg4);color:var(--fg3);display:grid;place-items:center;
}
.pick:hover .k,.pick.cur .k{background:var(--accent);color:var(--accent-fg)}
.pick .d{margin-left:auto;font-size:11.5px;color:var(--fg3)}
.filterbox{padding:0 16px 8px}
.filterbox input,.field input,.field textarea,.field select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:14px;outline:none;
}
.filterbox input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field{padding:8px 16px}
.field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);margin-bottom:5px}
.field textarea{resize:vertical;min-height:70px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:6px 11px;border-radius:var(--radius-sm);background:var(--bg3);font-size:12.5px;
  font-family:var(--mono);color:var(--fg3);border:1px solid transparent;
}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
.seg button:hover{border-color:var(--border2)}

/* review / dashboards */
.dash-sec{border-bottom:1px solid var(--border)}
.dash-sec:last-child{border-bottom:none}
.dash-sec>h4{
  margin:0;padding:11px 16px 5px;font-size:12.5px;font-weight:650;display:flex;gap:8px;align-items:center;
}
.dash-sec>h4 .n{font-size:11px;background:var(--bg4);border-radius:20px;padding:0 7px;color:var(--fg3)}
.dash-sec>h4 .n.z{background:rgba(79,191,123,.15);color:var(--ok)}
.dash-item{display:flex;gap:9px;align-items:flex-start;padding:6px 16px;font-size:13px;color:var(--fg2);width:100%;text-align:left}
.dash-item:hover{background:var(--bg3);color:var(--fg)}
.dash-item .p{font-size:11px;color:var(--fg3);font-family:var(--mono)}
.dash-item .fix{margin-left:auto;font-size:11px;color:var(--accent);flex:none}
.checkline{display:flex;gap:10px;align-items:center;padding:8px 16px;font-size:13.5px}
.checkline input{width:17px;height:17px;accent-color:var(--accent)}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,94vw)}
.toast{
  background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;
  font-size:13px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;
}
.toast.warn{border-color:rgba(224,176,80,.5)} .toast.err{border-color:rgba(255,107,107,.5)}
.toast .x{margin-left:auto;color:var(--fg3)}

/* keyboard chord hud */
#chord{
  position:fixed;left:12px;bottom:12px;z-index:210;background:var(--bg4);border:1px solid var(--border2);
  border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:12px;box-shadow:var(--shadow);
}

/* ============================================================
   25_RESPONSIVE
   ============================================================ */
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #sidebar{
    position:fixed;inset:0 auto 0 0;width:270px;z-index:70;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:var(--shadow);
  }
  body.nav-open #sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65}
  header.top .burger{display:grid}
  .wrap{padding:0 14px}
  .modal{max-height:92dvh}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">&#9715;</div>
      <div><div>GroupTodo</div><small id="vaultName">no vault</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="vaultbar">
      <div class="row"><span class="dot" id="syncDot"></span><span id="syncTxt">local only</span></div>
      <button class="btn sm" id="btnVault">&#9187; Vault &amp; sync</button>
    </div>
  </aside>

  <div id="main">
    <header class="top">
      <button class="iconbtn burger" id="burger">&#9776;</button>
      <div class="h-title"><span id="hTitle">Today</span><span class="sub" id="hSub"></span></div>
      <div class="h-sp"></div>
      <button class="btn sm ghost" id="btnSearch" title="Search (/)">&#8981;</button>
      <button class="btn sm ghost" id="btnTheme" title="Theme">&#9689;</button>
      <button class="btn primary sm" id="btnCapture">&#65291; Capture <kbd>c</kbd></button>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ============================================================
   00_BOOTSTRAP -- utilities
   Port of: init.lua 00_BOOTSTRAP
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "data") for (const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trim = s => String(s ?? "").replace(/^\s+|\s+$/g, "");
const join = (...p) => p.filter(Boolean).join("/").replace(/\/{2,}/g, "/");
const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

function notify(msg, level="info") {
  const t = el("div", {class:"toast " + (level==="warn"?"warn":level==="error"?"err":"")},
    el("span", {}, msg),
    el("button", {class:"x", onclick:e=>e.target.closest(".toast").remove()}, "✕"));
  $("#toasts").append(t);
  setTimeout(() => t.remove(), level === "info" ? 3800 : 9000);
}

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
const todayISO = () => isoOf(new Date());
const parseISO = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : null;
};
const shiftISO = (iso, days) => { const d = parseISO(iso) || new Date(); d.setDate(d.getDate()+days); return isoOf(d); };
function dateDiffDays(d1, d2) {           // d2 - d1, in days
  const a = parseISO(d1), b = parseISO(d2);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function humanDate(iso) {
  const d = parseISO(iso); if (!d) return iso || "";
  const t = todayISO();
  if (iso === t) return "Today";
  if (iso === shiftISO(t, 1)) return "Tomorrow";
  if (iso === shiftISO(t, -1)) return "Yesterday";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined,
    {weekday:"short", day:"numeric", month:"short", year: sameYear ? undefined : "numeric"});
}
function isoWeek(iso) {
  const d = parseISO(iso); if (!d) return null;
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const week1 = new Date(t.getFullYear(), 0, 4);
  const w = 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return [w, t.getFullYear()];
}

/* ============================================================
   05_CONFIG_SCHEMA
   Port of: init.lua 05_CONFIG_SCHEMA
   Same vault shape as the Neovim config, with .md instead of .org:
     journals/YYYY-MM-DD.md
     pages/{_,0,1,2,3}/   project status directories
     pages/{c,p,o,z}/     contexts, people, orgs, zettel
     pages/{templates,verbs}/
   ============================================================ */
const JOURNALS = "journals";
const PAGES    = "pages";
const DIRS = {
  journals : JOURNALS,
  pages    : PAGES,
  cancelled: join(PAGES, "_"),
  completed: join(PAGES, "0"),
  active   : join(PAGES, "1"),
  someday  : join(PAGES, "2"),
  waiting  : join(PAGES, "3"),
  orgs     : join(PAGES, "o"),
  people   : join(PAGES, "p"),
  contexts : join(PAGES, "c"),
  templates: join(PAGES, "templates"),
  verbs    : join(PAGES, "verbs"),
  zettel   : join(PAGES, "z"),
};
const TODO_STATES  = ["TODO", "DOING", "WAIT", "DONE", "CANCELLED"];
const OPEN_STATES  = {TODO:true, DOING:true, WAIT:true};
const STATE_ALIAS  = {WAITING:"WAIT", CANCELED:"CANCELLED", NOW:"DOING", LATER:"TODO"};
const STATUS_DIRS  = {"_":DIRS.cancelled, "0":DIRS.completed, "1":DIRS.active, "2":DIRS.someday, "3":DIRS.waiting};
const STATUS_TEXT  = {
  "_": "_ = cancelled",
  "0": "0 = completed",
  "1": "1 = active",
  "2": "2 = someday maybe",
  "3": "3 = waiting for 3rd party",
};
const STATUS_LABEL = {"_":"Cancelled", "0":"Completed", "1":"Active", "2":"Someday/Maybe", "3":"Waiting for"};
const PREFIX_DIR   = {p:DIRS.people, c:DIRS.contexts, o:DIRS.orgs, z:DIRS.zettel};

/* Tunables -- the GTD nudge thresholds (inline constants in init.lua). */
const CFG = {
  surfaceCount     : 3,      // oldest TODOs surfaced per context
  weedCount        : 3,      // stalest projects in morning weeding
  staleProjectDays : 180,    // "older than 6 months" warning
  reviewEveryDays  : 7,      // weekly review cadence
  waitFollowUpDays : 14,     // nudge to chase a WAIT item
  idleNudgeMinutes : 30,     // 30+ min idle -> nudge
  agendaDays       : 14,
  journalScanDays  : 365,
  contextPrompts   : [[12, 0, "lunchtime"], [17, 0, "after work"]],
};

const journalPath = (date) => join(JOURNALS, (date || todayISO()) + ".md");
const todayStamp  = () => "[[" + todayISO() + "]]";

function slugify(title) {
  const s = trim(title || "Untitled")
    .replace(/[\u0000-\u001f/\\:*?"<>|]/g, "-")
    .replace(/\s+/g, " ");
  return s === "" ? "Untitled" : s;
}

/* ============================================================
   10_MARKDOWN -- parse / serialize
   The org outline (*, **, ***) becomes a markdown bullet outline.
   Org "#+key: value"  ->  "key:: value" page properties.
   Org "Added: [[d]]"  ->  "Added:: [[d]]" block property.
   ============================================================ */
const PROP_RE   = /^([A-Za-z][\w-]*)::\s*(.*)$/;
const BULLET_RE = /^(\s*)[-*+]\s+(.*)$/;

function indentLevel(ws) {
  let n = 0;
  for (const ch of ws) n += ch === "\t" ? 2 : 1;
  return Math.floor(n / 2);
}

function splitState(text) {
  const m = /^([A-Z]{3,9})(\s+|$)/.exec(text || "");
  if (!m) return [null, text || ""];
  const raw = m[1];
  const st = STATE_ALIAS[raw] || (TODO_STATES.includes(raw) ? raw : null);
  if (!st) return [null, text || ""];
  return [st, (text || "").slice(m[0].length)];
}

function newBlock(patch = {}) {
  return Object.assign({
    id: uid(), state: null, title: "", props: {}, body: [],
    children: [], collapsed: false,
  }, patch);
}

/* Parse a markdown page into {props, blocks}. */
function parsePage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const root = {level: -1, children: page.blocks};
  const stack = [root];
  let cur = null, curIndent = 0, seenBullet = false;

  for (const line of lines) {
    const bm = BULLET_RE.exec(line);
    if (bm) {
      seenBullet = true;
      const level = indentLevel(bm[1]);
      const [state, title] = splitState(bm[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      const parent = stack[stack.length-1];
      (parent.children || (parent.children = [])).push(blk);
      blk.level = level;
      stack.push(blk);
      cur = blk; curIndent = bm[1].length;
      continue;
    }
    if (!seenBullet) {
      const pm = PROP_RE.exec(trim(line));
      if (pm) { page.props[pm[1].toLowerCase()] = trim(pm[2]); continue; }
      if (trim(line) === "") continue;
      // Stray prose before the first bullet: keep it as a leading block.
      const blk = newBlock({title: trim(line)});
      page.blocks.push(blk); blk.level = 0;
      stack.length = 1; stack.push(blk); cur = blk; curIndent = 0; seenBullet = true;
      continue;
    }
    if (!cur) continue;
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    const pm = PROP_RE.exec(trim(line));
    if (pm) { cur.props[pm[1]] = trim(pm[2]); continue; }
    const lead = /^\s*/.exec(line)[0].length;
    cur.body.push(line.slice(Math.min(lead, curIndent + 2)).replace(/\s+$/, ""));
  }
  // drop trailing blank body lines
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

function serializePage(page) {
  const out = [];
  const props = page.props || {};
  const keys = Object.keys(props);
  if (keys.length) {
    for (const k of keys) out.push(k + ":: " + props[k]);
    out.push("");
  }
  const emit = (blocks, level) => {
    for (const b of blocks) {
      const pad = "  ".repeat(level);
      out.push((pad + "- " + (b.state ? b.state + " " : "") + b.title).replace(/\s+$/, ""));
      for (const [k, v] of Object.entries(b.props || {})) out.push(pad + "  " + k + ":: " + v);
      for (const l of b.body || []) out.push(l === "" ? "" : pad + "  " + l);
      if (b.children && b.children.length) emit(b.children, level + 1);
    }
  };
  emit(page.blocks || [], 0);
  return out.join("\n").replace(/\n+$/, "") + "\n";
}

function walkBlocks(blocks, fn, parent = null) {
  for (const b of blocks || []) {
    if (fn(b, parent) === false) continue;
    walkBlocks(b.children, fn, b);
  }
}
function flattenBlocks(blocks, out = [], parent = null, depth = 0) {
  for (const b of blocks || []) {
    b._parent = parent; b._depth = depth;
    out.push(b);
    flattenBlocks(b.children, out, b, depth + 1);
  }
  return out;
}
</script>
<script>
/* ============================================================
   15_STORAGE -- three interchangeable backends
     fs   : File System Access API, writes real .md files (desktop Chrome/Edge)
     http : tiny PUT/GET server (serve.py) -- for Termux / phone / any device
     idb  : IndexedDB, browser-local, with markdown bundle export/import
   Port of: init.lua read_file/write_file/append_file + autosave timer
   ============================================================ */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("grouptodo", 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      if (!db.objectStoreNames.contains("kv"))    db.createObjectStore("kv");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get : (s, k)    => tx(s, "readonly",  st => st.get(k)),
    set : (s, k, v) => tx(s, "readwrite", st => st.put(v, k)),
    del : (s, k)    => tx(s, "readwrite", st => st.delete(k)),
    keys: (s)       => tx(s, "readonly",  st => st.getAllKeys()),
    all : (s)       => tx(s, "readonly",  st => st.getAll()),
  };
})();

const Backends = {
  /* ---------- IndexedDB (always available) ---------- */
  idb() {
    return {
      kind: "idb", label: "browser storage", writable: true,
      async list() {
        const keys = await IDB.keys("files"), vals = await IDB.all("files");
        const out = new Map();
        keys.forEach((k, i) => out.set(k, vals[i]));
        return out;
      },
      async write(path, text) { await IDB.set("files", path, text); },
      async remove(path)      { await IDB.del("files", path); },
    };
  },

  /* ---------- File System Access API ---------- */
  fs(rootHandle) {
    const dirCache = new Map([["", rootHandle]]);
    async function dirFor(path, create=false) {
      if (dirCache.has(path)) return dirCache.get(path);
      const parts = path.split("/").filter(Boolean);
      let h = rootHandle, sofar = "";
      for (const p of parts) {
        sofar = sofar ? sofar + "/" + p : p;
        if (dirCache.has(sofar)) { h = dirCache.get(sofar); continue; }
        h = await h.getDirectoryHandle(p, {create});
        dirCache.set(sofar, h);
      }
      return h;
    }
    return {
      kind: "fs", label: rootHandle.name, writable: true, handle: rootHandle,
      async list() {
        const out = new Map();
        const walk = async (dir, prefix) => {
          for await (const [name, h] of dir.entries()) {
            if (name.startsWith(".")) continue;
            const p = prefix ? prefix + "/" + name : name;
            if (h.kind === "directory") { dirCache.set(p, h); await walk(h, p); }
            else if (/\.(md|org)$/i.test(name)) out.set(p, await (await h.getFile()).text());
          }
        };
        await walk(rootHandle, "");
        return out;
      },
      async write(path, text) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"), true);
        const fh = await dir.getFileHandle(path.split("/").pop(), {create: true});
        const w = await fh.createWritable();
        await w.write(text); await w.close();
      },
      async remove(path) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"));
        await dir.removeEntry(path.split("/").pop());
      },
    };
  },

  /* ---------- HTTP sync server (serve.py) ---------- */
  http(base) {
    const u = (p, q) => base.replace(/\/$/, "") + p + (q ? "?path=" + encodeURIComponent(q) : "");
    return {
      kind: "http", label: base.replace(/^https?:\/\//, "") || "server", writable: true,
      async list() {
        const r = await fetch(u("/api/list"));
        if (!r.ok) throw new Error("list failed: " + r.status);
        const paths = await r.json();
        const out = new Map();
        await Promise.all(paths.map(async p => {
          const f = await fetch(u("/api/file", p));
          if (f.ok) out.set(p, await f.text());
        }));
        return out;
      },
      async write(path, text) {
        const r = await fetch(u("/api/file", path), {
          method: "PUT", headers: {"Content-Type": "text/plain; charset=utf-8"}, body: text,
        });
        if (!r.ok) throw new Error("write failed: " + r.status);
      },
      async remove(path) { await fetch(u("/api/file", path), {method: "DELETE"}); },
    };
  },
};

/* ============================================================
   20_VAULT -- in-memory model over the backend
   ============================================================ */
const V = {
  backend : null,
  pages   : new Map(),   // path -> {props, blocks}
  raw     : new Map(),   // path -> original text (for .org files kept verbatim)
  dirty   : new Set(),
  removed : new Set(),
  loaded  : false,
  syncing : false,
  error   : null,
};

function setSync(state, text) {
  const dot = $("#syncDot"), txt = $("#syncTxt");
  if (!dot) return;
  dot.className = "dot " + state;
  txt.textContent = text;
}

function pagePaths() { return Array.from(V.pages.keys()); }
function getPage(path) { return V.pages.get(path); }

function putPage(path, page, {silent = false} = {}) {
  V.pages.set(path, page);
  V.removed.delete(path);
  if (!silent) { V.dirty.add(path); scheduleFlush(); }
  return page;
}
function touch(path) { V.dirty.add(path); scheduleFlush(); }

function removePage(path) {
  V.pages.delete(path);
  V.dirty.delete(path);
  V.removed.add(path);
  scheduleFlush();
}

let flushTimer = null;
function scheduleFlush() {
  clearTimeout(flushTimer);
  setSync("warn", "unsaved");
  flushTimer = setTimeout(flush, 450);
}

async function flush() {
  if (!V.backend || V.syncing) return;
  if (!V.dirty.size && !V.removed.size) { setSync("ok", V.backend.label); return; }
  V.syncing = true;
  setSync("sync", "saving...");
  const dirty = Array.from(V.dirty); V.dirty.clear();
  const gone  = Array.from(V.removed); V.removed.clear();
  try {
    for (const p of dirty) {
      const page = V.pages.get(p);
      if (page) await V.backend.write(p, serializePage(page));
    }
    for (const p of gone) await V.backend.remove(p).catch(() => {});
    setSync("ok", V.backend.label);
    V.error = null;
  } catch (e) {
    dirty.forEach(p => V.dirty.add(p));
    V.error = e;
    setSync("err", "save failed");
    notify("Save failed: " + e.message, "error");
  } finally {
    V.syncing = false;
    if (V.dirty.size || V.removed.size) scheduleFlush();
  }
}
window.addEventListener("beforeunload", e => {
  if (V.dirty.size) { flush(); e.preventDefault(); e.returnValue = ""; }
});

async function loadFromBackend(backend) {
  setSync("sync", "loading...");
  const files = await backend.list();
  V.backend = backend;
  V.pages.clear(); V.raw.clear(); V.dirty.clear(); V.removed.clear();
  for (const [path, text] of files) {
    if (/\.org$/i.test(path)) { V.raw.set(path, text); continue; }
    V.pages.set(path, parsePage(text));
  }
  V.loaded = true;
  $("#vaultName").textContent = backend.label;
  setSync("ok", backend.label);
  if (V.raw.size) {
    notify(V.raw.size + " .org files found -- open Vault → Import .org to convert them.", "warn");
  }
}

/* ============================================================
   25_PAGE_CLASSIFY
   Port of: init.lua 35_NODE_CLASSIFY
   ============================================================ */
const isJournalPath = p => p.startsWith(JOURNALS + "/");
const isPagePath    = p => p.startsWith(PAGES + "/");

function statusDirOf(path) {
  const m = new RegExp("^" + PAGES + "/([_0123])/").exec(path || "");
  return m ? m[1] : null;
}
function pageKind(path) {
  if (isJournalPath(path)) return "journal";
  if (statusDirOf(path)) return "project";
  if (path.startsWith(DIRS.contexts  + "/")) return "context";
  if (path.startsWith(DIRS.people    + "/")) return "person";
  if (path.startsWith(DIRS.orgs      + "/")) return "org";
  if (path.startsWith(DIRS.zettel    + "/")) return "zettel";
  if (path.startsWith(DIRS.templates + "/")) return "template";
  if (path.startsWith(DIRS.verbs     + "/")) return "verb";
  return "page";
}
const baseName  = p => (p || "").split("/").pop().replace(/\.md$/i, "");
const pageTitle = p => (getPage(p)?.props?.title) || baseName(p);

/* Short reference used in links: "1/Fix sink", "c/phone", "2026-09-17" */
function pageRef(path) {
  const sd = statusDirOf(path);
  if (sd) return sd + "/" + baseName(path);
  for (const [pfx, dir] of Object.entries(PREFIX_DIR)) {
    if (path.startsWith(dir + "/")) return pfx + "/" + baseName(path);
  }
  if (isJournalPath(path)) return baseName(path);
  return baseName(path);
}

function allPages(filter) {
  const out = [];
  for (const path of V.pages.keys()) if (!filter || filter(path)) out.push(path);
  return out.sort();
}
const projectsIn = code => allPages(p => statusDirOf(p) === code);

/* Journal files from the last N days that actually exist. */
function recentJournals(days = CFG.journalScanDays) {
  const out = [];
  for (let i = 0; i < days; i++) {
    const p = journalPath(shiftISO(todayISO(), -i));
    if (V.pages.has(p)) out.push(p);
  }
  return out;
}

/* ============================================================
   30_LINKS
   Port of: init.lua 110_WIKI_LINK_OVERRIDE
   ============================================================ */
const LINK_RE = /\[\[([^\]]+)\]\]/g;

function linksIn(text) {
  const out = []; let m;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(text || ""))) out.push(trim(m[1]));
  return out;
}
const contextOf = text => {
  const m = /\[\[c\/([^\]]+)\]\]/.exec(text || "");
  return m ? trim(m[1]) : null;
};
const hasContextLink = text => /\[\[c\/[^\]]+\]\]/.test(text || "");

/* target -> vault path (creating nothing) */
function resolveWikiPath(target) {
  target = trim(target).replace(/\.md$/i, "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return journalPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  if (m) {
    const [, pfx, rest] = m;
    if (STATUS_DIRS[pfx]) return join(STATUS_DIRS[pfx], rest + ".md");
    if (PREFIX_DIR[pfx])  return join(PREFIX_DIR[pfx], rest + ".md");
  }
  return join(PAGES, target + ".md");
}

/* Find an existing page for a link target, searching every root like init.lua did. */
function findExistingPage(target) {
  target = trim(target).replace(/\.md$/i, "");
  const direct = resolveWikiPath(target);
  if (V.pages.has(direct)) return direct;
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return null;
  const slug = slugify(target.includes("/") ? target.split("/").pop() : target);
  const roots = [PAGES, DIRS.active, DIRS.someday, DIRS.waiting, DIRS.completed,
                 DIRS.cancelled, DIRS.people, DIRS.contexts, DIRS.orgs, DIRS.zettel];
  for (const r of roots) {
    const p = join(r, slug + ".md");
    if (V.pages.has(p)) return p;
  }
  return null;
}

/* ============================================================
   35_TEMPLATES
   Port of: init.lua 20_TEMPLATE_RESOLVER -- date cascade lookup:
   2026-09-17 > 2026-W38 > 2026-Q3 > 2026-H2 > 2026-09 > 09-17 > 2026 > 09 > kind
   ============================================================ */
function templateCandidates(date, kind) {
  const list = [];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || "");
  if (m) {
    const [, y, mo, d] = m;
    const w = isoWeek(date);
    list.push(date);
    if (w) list.push(`${w[1]}-W${pad2(w[0])}`);
    list.push(`${y}-Q${Math.ceil(+mo / 3)}`, `${y}-H${+mo <= 6 ? 1 : 2}`, `${y}-${mo}`, `${mo}-${d}`, y, mo);
  }
  if (kind) list.push(kind);
  return list;
}
function readTemplate(name) {
  const p = join(DIRS.templates, name + ".md");
  return V.pages.has(p) ? p : null;
}
function resolveTemplate({date, kind}) {
  const cands = templateCandidates(date, kind);
  if (kind === "journals" || (date && !kind)) cands.push("journals");
  if (kind && kind !== "journals") cands.push(kind, "pages");
  for (const name of cands) {
    const p = readTemplate(name);
    if (p) return {path: p, name};
  }
  return null;
}
function expandVars(text, vars) {
  return String(text).replace(/%(\w+)%/g, (all, k) => (k in vars ? vars[k] : all));
}
/* Deep-copy a template page, expanding %vars%. */
function instantiateTemplate(tplPath, vars) {
  const src = getPage(tplPath);
  const clone = {props: {}, blocks: []};
  for (const [k, v] of Object.entries(src.props || {})) clone.props[k] = expandVars(v, vars);
  const copy = bs => (bs || []).map(b => newBlock({
    state: b.state,
    title: expandVars(b.title, vars),
    props: Object.fromEntries(Object.entries(b.props || {}).map(([k, v]) => [k, expandVars(v, vars)])),
    body : (b.body || []).map(l => expandVars(l, vars)),
    children: copy(b.children),
  }));
  clone.blocks = copy(src.blocks);
  return clone;
}

/* ============================================================
   40_VERBS -- the Phys-Viz rule
   Port of: init.lua 50_VERB_SYSTEM
   pages/verbs/<lang>/<canonical>.md holds lines "synonym = canonical".
   A next action must START with a physical, visible verb.
   ============================================================ */
let VERB_LOOKUP = {};      // synonym -> canonical
let VERB_CANON  = {};      // canonical -> {lang, path, synonyms[]}

function scanVerbs() {
  VERB_LOOKUP = {}; VERB_CANON = {};
  for (const path of V.pages.keys()) {
    if (!path.startsWith(DIRS.verbs + "/")) continue;
    const rest = path.slice(DIRS.verbs.length + 1).split("/");
    if (rest.length < 2) continue;
    const lang = rest[0];
    const canonical = baseName(path).toLowerCase();
    const synonyms = [];
    const page = getPage(path);
    const scan = txt => {
      const m = /^\s*([\p{L}\p{M}\-_ ]+?)\s*=\s*([\p{L}\p{M}\-_ ]+?)\s*$/u.exec(txt || "");
      if (!m) return;
      const syn = m[1].toLowerCase();
      synonyms.push(syn);
      VERB_LOOKUP[syn] = canonical;
    };
    walkBlocks(page.blocks, b => { scan(b.title); (b.body || []).forEach(scan); });
    VERB_LOOKUP[canonical] = canonical;
    VERB_CANON[canonical] = {lang, path, synonyms};
  }
}

function startsWithVerb(title) {
  const m = /^\s*([\p{L}\p{M}\-]+)/u.exec(title || "");
  if (!m) return false;
  return !!VERB_LOOKUP[m[1].toLowerCase()];
}
function verbList() {
  return Object.keys(VERB_CANON).sort().map(c => ({canonical: c, lang: VERB_CANON[c].lang}));
}

/* ============================================================
   45_ORG_IMPORT -- convert an existing .org vault to markdown
   ============================================================ */
function orgToPage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const stack = [{level: 0, children: page.blocks}];
  let cur = null, inProps = false;

  for (const line of lines) {
    let m = /^#\+([\w-]+):\s*(.*)$/.exec(line);
    if (m && !cur) { page.props[m[1].toLowerCase()] = trim(m[2]); continue; }
    m = /^(\*+)\s+(.*)$/.exec(line);
    if (m) {
      const level = m[1].length;
      const [state, title] = splitState(m[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      stack[stack.length-1].children.push(blk);
      blk.level = level; blk.children = blk.children || [];
      stack.push(blk);
      cur = blk; inProps = false;
      continue;
    }
    if (!cur) continue;
    if (/^\s*:PROPERTIES:\s*$/.test(line)) { inProps = true; continue; }
    if (/^\s*:END:\s*$/.test(line))        { inProps = false; continue; }
    if (inProps) {
      const pm = /^\s*:([\w-]+):\s*(.*)$/.exec(line);
      if (pm) cur.props[pm[1].toLowerCase()] = trim(pm[2]);
      continue;
    }
    // "Added: [[2026-09-15]] - [[2026-09-17]] = 2 days"  ->  property
    const am = /^\s*(Added|CLOSED|SCHEDULED|DEADLINE):\s*(.*)$/i.exec(line);
    if (am) { cur.props[am[1].replace(/^./, c => c.toUpperCase())] = trim(am[2]); continue; }
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    cur.body.push(trim(line));
  }
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

function importOrgFiles() {
  let n = 0;
  for (const [path, text] of Array.from(V.raw)) {
    const mdPath = path.replace(/\.org$/i, ".md");
    if (V.pages.has(mdPath)) continue;
    putPage(mdPath, orgToPage(text));
    V.raw.delete(path);
    n++;
  }
  scanVerbs();
  notify(n ? `Converted ${n} .org files to markdown (originals untouched).` : "Nothing to import.");
  render();
}

<script>
/* ============================================================
   50_BLOCK_HELPERS
   ============================================================ */
const dateIn = s => (/(\d{4}-\d{2}-\d{2})/.exec(s || "") || [])[1] || null;

function blockProp(b, key) {
  if (!b || !b.props) return null;
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  return k ? b.props[k] : null;
}
function setBlockProp(b, key, val) {
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  b.props[k || key] = val;
}
const addedDate = b => dateIn(blockProp(b, "Added"));
const blockAge  = b => { const a = addedDate(b); return a ? dateDiffDays(a, todayISO()) : null; };
function dueDate(b) {
  return dateIn(blockProp(b, "SCHEDULED")) || dateIn(blockProp(b, "DEADLINE")) || dateIn(blockProp(b, "due"));
}
/* Locate a block anywhere in the vault by id. */
function findBlock(id) {
  for (const [path, page] of V.pages) {
    let found = null;
    walkBlocks(page.blocks, b => { if (b.id === id) found = b; });
    if (found) return {path, page, block: found};
  }
  return null;
}
function blockPagePath(block) {
  for (const [path, page] of V.pages) {
    let hit = false;
    walkBlocks(page.blocks, b => { if (b === block) hit = true; });
    if (hit) return path;
  }
  return null;
}
function removeBlockFrom(page, block) {
  const rec = list => {
    const i = list.indexOf(block);
    if (i >= 0) { list.splice(i, 1); return true; }
    return list.some(b => rec(b.children || []));
  };
  return rec(page.blocks);
}
function hasOpenDescendant(block) {
  let open = false;
  walkBlocks(block.children, b => { if (OPEN_STATES[b.state]) open = true; });
  return open;
}

/* ============================================================
   55_JOURNAL_LIFECYCLE
   Port of: init.lua 45_JOURNAL_LIFECYCLE
   ============================================================ */
function ensureJournal(date) {
  date = date || todayISO();
  const path = journalPath(date);
  if (V.pages.has(path)) return path;
  const tpl = resolveTemplate({date, kind: "journals"});
  const page = tpl
    ? instantiateTemplate(tpl.path, {title: date, date, created: "[[" + date + "]]"})
    : {props: {title: date, created: "[[" + date + "]]"}, blocks: []};
  putPage(path, page);
  if (tpl) notify("Journal created from template: " + tpl.name);
  return path;
}

/* ============================================================
   60_STATE_MACHINE
   Port of: init.lua set_org_state
     -> TODO : stamp "Added", then nudge for a context if missing
     -> DONE : close out the Added line with an end date + elapsed days,
               then check whether the project just ran out of next actions
   ============================================================ */
function setBlockState(path, block, state, opts = {}) {
  const prev = block.state;
  block.state = state;

  if (state === "TODO" || state === "DOING") {
    if (path !== journalPath() && !addedDate(block)) {
      setBlockProp(block, "Added", "[[" + todayISO() + "]]");
    }
  } else if (state === "DONE" || state === "CANCELLED") {
    const added = addedDate(block);
    const end = todayISO();
    if (added) {
      const raw = blockProp(block, "Added") || "";
      if (!/\]\]\s*-\s*\[\[/.test(raw)) {
        const days = dateDiffDays(added, end) ?? 0;
        setBlockProp(block, "Added", raw + " - [[" + end + "]] = " + days + " days");
      }
    } else if (!blockProp(block, "CLOSED")) {
      setBlockProp(block, "CLOSED", "[[" + end + "]]");
    }
  }
  touch(path);

  if ((state === "TODO" || state === "DOING") && !opts.skipContext && !hasContextLink(block.title)) {
    promptAndInsertContext(path, block);
    return;
  }
  if (state === "DONE" || state === "CANCELLED") {
    if (prev !== state) noteTodoTouched();
    checkProjectCompletion(path);
  }
  render();
}

function cycleState(path, block) {
  const order = ["TODO", "DOING", "WAIT", "DONE"];
  const i = order.indexOf(block.state);
  setBlockState(path, block, order[(i + 1) % order.length]);
}

/* ============================================================
   65_GTD_SCANNERS
   Port of: init.lua 55_GTD_SCANNERS + 57_STALENESS_SCAN
   ============================================================ */
const GROUPS = ["LATE", "TODAY", "PROJECT", "LINKED", "WAITING", "JOURNAL"];
const GROUP_META = {
  LATE   : {label: "Overdue",         cls: "late"},
  TODAY  : {label: "Due today",       cls: "today"},
  PROJECT: {label: "Project actions", cls: "proj"},
  LINKED  : {label: "Journal, linked to a project", cls: "ctx"},
  WAITING: {label: "Waiting for",     cls: "wait"},
  JOURNAL: {label: "Loose journal actions", cls: ""},
};

/* The block itself, or its nearest ancestor, linking to a project page: [[1/Fix sink]] */
function nearestProjectAncestor(block) {
  let p = block;
  while (p) {
    const m = /\[\[([_0123])\/([^\]]+)\]\]/.exec(p.title || "");
    if (m) return {statusDir: m[1], title: trim(m[2]), ref: m[1] + "/" + trim(m[2])};
    p = p._parent;
  }
  return null;
}

/* Open leaf actions: an open item with no open children is the actionable one. */
function leafActions() {
  const out = [];
  const paths = [...projectsIn("1"), ...projectsIn("3"), ...recentJournals()];
  for (const path of paths) {
    const page = getPage(path); if (!page) continue;
    const journal = isJournalPath(path);
    const flat = flattenBlocks(page.blocks);
    for (const b of flat) {
      if (!OPEN_STATES[b.state] || hasOpenDescendant(b)) continue;
      const linked = journal ? nearestProjectAncestor(b) : null;
      let group = "JOURNAL", project = null, projectStatusDir = null, projectPath = null;
      if (!journal) {
        group = b.state === "WAIT" ? "WAITING" : "PROJECT";
        project = pageTitle(path);
        projectStatusDir = statusDirOf(path);
        projectPath = path;
      } else if (linked) {
        group = b.state === "WAIT" ? "WAITING" : "LINKED";
        project = linked.title;
        projectStatusDir = linked.statusDir;
        projectPath = findExistingPage(linked.ref);
      } else if (b.state === "WAIT") {
        group = "WAITING";
      }
      const due = dueDate(b);
      if (due) {
        if (due < todayISO()) group = "LATE";
        else if (due === todayISO()) group = "TODAY";
      }
      out.push({
        path, block: b, state: b.state, title: b.title,
        project, projectPath, projectStatusDir, group, due,
        context: contextOf(b.title),
        missingContext: !hasContextLink(b.title),
        missingVerb: !startsWithVerb(b.title),
        // Journal items carry no Added:: stamp (the filename is the date),
        // so fall back to the journal's own date to keep "oldest first" honest.
        added: addedDate(b) || (journal ? baseName(path) : null),
        age: blockAge(b) ?? (journal ? dateDiffDays(baseName(path), todayISO()) : null),
      });
    }
  }
  return out;
}

/* Active projects with nothing actionable left -- the classic GTD trap. */
function stuckActiveProjects() {
  const linkedFromJournal = new Set();
  for (const a of leafActions()) {
    if (a.group === "LINKED" && a.project) linkedFromJournal.add(a.project.toLowerCase());
  }
  const stuck = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const flat = flattenBlocks(page.blocks);
    let leafTodo = false, waiting = false, parentTodos = false;
    for (const b of flat) {
      if (b.state === "TODO" || b.state === "DOING") {
        if (hasOpenDescendant(b)) parentTodos = true; else leafTodo = true;
      } else if (b.state === "WAIT" && !hasOpenDescendant(b)) waiting = true;
    }
    const fromJournal = linkedFromJournal.has(pageTitle(path).toLowerCase())
                     || linkedFromJournal.has(baseName(path).toLowerCase());
    if (!leafTodo && !waiting && !fromJournal) {
      stuck.push({path, reason: parentTodos ? "Has parent TODOs but no actionable task" : "No next action"});
    }
  }
  return stuck;
}

/* Stalest active projects. Missing context beats missing verb beats plain age. */
function stalestActiveProjects(n = CFG.weedCount) {
  const rows = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const todos = [];
    let noContext = false, noVerb = false, anyTodo = false;
    for (const b of flattenBlocks(page.blocks)) {
      if (!OPEN_STATES[b.state]) continue;
      anyTodo = true;
      const ctx = contextOf(b.title);
      const missingVerb = !startsWithVerb(b.title);
      if (!ctx) noContext = true;
      if (missingVerb) noVerb = true;
      todos.push({path, block: b, state: b.state, title: b.title,
                  context: ctx, missingContext: !ctx, missingVerb});
    }
    const createdDate = dateIn(page.props?.created);
    const reviewedDate = dateIn(page.props?.reviewed);
    const ageDays = createdDate ? dateDiffDays(createdDate, todayISO()) : null;
    const idleDays = reviewedDate ? dateDiffDays(reviewedDate, todayISO())
                   : (ageDays ?? 3650);
    let bias = 0;
    if (!anyTodo)  bias += 1500;
    if (noContext) bias += 1000;
    if (noVerb)    bias += 500;
    rows.push({path, title: pageTitle(path), todos, anyTodo, noContext, noVerb,
               ageDays, createdDate, reviewedDate, idleDays, score: bias + (idleDays || 0)});
  }
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, n);
}

/* The heart of the nudge loop: 3 oldest open actions in the chosen context. */
function oldestTodosForContext(context, n = CFG.surfaceCount) {
  const matches = leafActions().filter(a => {
    if (a.context !== context) return false;
    if (!OPEN_STATES[a.state]) return false;
    // standalone, or under an active / waiting project -- never 0, 2 or _
    return a.projectStatusDir == null || a.projectStatusDir === "1" || a.projectStatusDir === "3";
  });
  matches.sort((x, y) => (x.added || "9999-99-99").localeCompare(y.added || "9999-99-99"));
  return matches.slice(0, n);
}

function contextList() {
  const set = new Set();
  for (const path of allPages(p => p.startsWith(DIRS.contexts + "/"))) {
    set.add(path.slice(DIRS.contexts.length + 1).replace(/\.md$/i, ""));
  }
  for (const a of leafActions()) if (a.context) set.add(a.context);
  return Array.from(set).sort();
}

function agendaScan(days = CFG.agendaDays) {
  const cutoff = shiftISO(todayISO(), days);
  const byDate = new Map();
  for (const a of leafActions()) {
    if (!a.due || a.due > cutoff) continue;
    if (!byDate.has(a.due)) byDate.set(a.due, []);
    byDate.get(a.due).push(a);
  }
  return Array.from(byDate.entries()).sort((x, y) => x[0].localeCompare(y[0]));
}

/* Port of: init.lua 70_HEALTH_CHECKS */
function healthScan() {
  const issues = [];
  for (const path of [...projectsIn("1"), ...projectsIn("2"), ...projectsIn("3")]) {
    const page = getPage(path);
    if (!page.props?.title) issues.push({path, type: "missing-title", text: "No title:: property"});
    if (statusDirOf(path) === "3" && !(page.props?.waiting_since || page.props?.["waiting-since"]))
      issues.push({path, type: "missing-waiting_since", text: "Waiting project without waiting_since"});
  }
  for (const [path, page] of V.pages) {
    if (pageKind(path) === "template") continue;
    const check = (text, blk) => {
      for (const target of linksIn(text)) {
        const t = target.split("][")[0];
        if (/^\d{4}-\d{2}-\d{2}$/.test(t)) continue;
        if (!/^[_0123pcoz]\//.test(t)) continue;
        if (!findExistingPage(t)) issues.push({path, block: blk, type: "broken-link", text: "Broken link: [[" + t + "]]"});
      }
    };
    walkBlocks(page.blocks, b => { check(b.title, b); (b.body || []).forEach(l => check(l, b)); });
  }
  return issues;
}

/* Port of: init.lua 60_GRAPH_QUERIES */
function backlinksTo(path) {
  const ref = pageRef(path).toLowerCase();
  const name = baseName(path).toLowerCase();
  const hits = [];
  for (const [p, page] of V.pages) {
    if (p === path) continue;
    walkBlocks(page.blocks, b => {
      const text = [b.title, ...(b.body || [])].join("\n");
      for (const target of linksIn(text)) {
        const t = target.split("][")[0].toLowerCase().replace(/\.md$/, "");
        if (t === ref || t === name) { hits.push({path: p, block: b}); return; }
      }
    });
  }
  return hits;
}

/* Port of: init.lua find_duplicate_projects */
function duplicateProjects() {
  const bySlug = new Map();
  for (const path of allPages(p => statusDirOf(p))) {
    const slug = baseName(path).toLowerCase();
    if (!bySlug.has(slug)) bySlug.set(slug, []);
    bySlug.get(slug).push(path);
  }
  return Array.from(bySlug.entries())
    .filter(([, l]) => l.length > 1)
    .map(([slug, paths]) => ({slug, paths: paths.sort()}))
    .sort((a, b) => b.paths.length - a.paths.length || a.slug.localeCompare(b.slug));
}

function openTodoCount(path) {
  const page = getPage(path); if (!page) return 0;
  return flattenBlocks(page.blocks).filter(b => OPEN_STATES[b.state]).length;
}

/* ============================================================
   70_PAGE_MUTATIONS
   Port of: init.lua 65_PROJECT_STATUS_MOVE + 75_REFILE_AND_TELEPORT
   ============================================================ */
function rewriteLinksEverywhere(oldRef, newRef) {
  if (oldRef === newRef) return 0;
  let changed = 0;
  const re = new RegExp("\\[\\[" + oldRef.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\]\\]|\\]\\[)", "g");
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = s => { const n = s.replace(re, "[[" + newRef + "$1"); if (n !== s) hit = true; return n; };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) { touch(path); changed++; }
  }
  return changed;
}

function moveFile(oldPath, newPath) {
  if (oldPath === newPath) return true;
  if (V.pages.has(newPath)) { notify("Target already exists: " + newPath, "error"); return false; }
  const page = getPage(oldPath);
  const oldRef = pageRef(oldPath), oldBase = baseName(oldPath);
  V.pages.delete(oldPath);
  V.dirty.delete(oldPath);
  V.removed.add(oldPath);
  putPage(newPath, page);
  const newRef = pageRef(newPath);
  let n = rewriteLinksEverywhere(oldRef, newRef);
  if (oldBase !== baseName(newPath) || oldRef !== oldBase) n += rewriteLinksEverywhere(oldBase, newRef);
  if (n) notify("Link update: " + n + " pages updated.");
  return true;
}

function setProjectStatus(path, code) {
  if (!STATUS_DIRS[code]) return;
  const page = getPage(path);
  page.props.status = STATUS_TEXT[code];
  page.props.reviewed = todayStamp();
  if (code === "0") page.props.completed = todayStamp();
  if (code === "_") page.props.cancelled = todayStamp();
  if (code === "3") page.props.waiting_since = todayStamp();
  const newPath = join(STATUS_DIRS[code], baseName(path) + ".md");
  touch(path);
  if (newPath !== path && moveFile(path, newPath)) {
    notify("Moved to " + STATUS_TEXT[code]);
    if (state.view === "page" && state.pagePath === path) state.pagePath = newPath;
  } else {
    notify("Status: " + STATUS_TEXT[code]);
  }
  render();
}

function projectTemplateLines(title, code = "1") {
  const st = code === "3" ? "WAIT" : code === "0" ? "DONE" : code === "_" ? "CANCELLED" : "TODO";
  const tpl = resolveTemplate({kind: code});
  if (tpl) {
    return instantiateTemplate(tpl.path, {
      title, status: STATUS_TEXT[code], created: todayStamp(), reviewed: todayStamp(), state: st,
    });
  }
  const props = {title, status: STATUS_TEXT[code], created: todayStamp(), reviewed: todayStamp()};
  if (code === "3") { props.waiting_for = ""; props.waiting_since = todayStamp(); }
  if (code === "0") props.completed = todayStamp();
  if (code === "_") props.cancelled = todayStamp();
  return {props, blocks: [newBlock({state: st, title, props: {Added: todayStamp()}})]};
}

function createProjectPage(title, blocks) {
  const clean = slugify(title);
  const path = join(DIRS.active, clean + ".md");
  if (V.pages.has(path)) return path;
  const page = projectTemplateLines(clean, "1");
  if (blocks && blocks.length) page.blocks = blocks;
  putPage(path, page);
  return path;
}

function zettelTemplate(title) {
  return {
    props: {title, created: todayStamp()},
    blocks: [
      newBlock({title}),
      newBlock({title: "Relates to"}),
      newBlock({title: "Contradicts"}),
      newBlock({title: "Informs"}),
    ],
  };
}
function createZettel(title) {
  const clean = slugify(title);
  const path = join(DIRS.zettel, clean + ".md");
  if (!V.pages.has(path)) putPage(path, zettelTemplate(clean));
  return path;
}

function pageTemplateFor(kind, title) {
  if (kind === "z") return zettelTemplate(title);
  if (STATUS_DIRS[kind]) return projectTemplateLines(title, kind);
  const tpl = resolveTemplate({kind});
  if (tpl) return instantiateTemplate(tpl.path, {title, created: todayStamp(), kind});
  const props = {title, created: todayStamp()};
  if (["p", "c", "o"].includes(kind)) props.type = {p: "person", c: "context", o: "org"}[kind];
  return {props, blocks: [newBlock({title: ""})]};
}

/* Follow [[target]] -- creating the page if it does not exist yet. */
function followLink(target) {
  target = trim(target).split("][")[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) { openPage(ensureJournal(target)); return; }
  const existing = findExistingPage(target);
  if (existing) { openPage(existing); return; }
  const path = resolveWikiPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  const kind = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[1] : "page";
  const title = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[2] : target;
  putPage(path, pageTemplateFor(kind, title));
  notify("Created page: " + path);
  scanVerbs();
  openPage(path);
}

/* Port of: init.lua refile_current_task -- move a subtree to a project,
   leaving a DONE breadcrumb behind when it came from a journal. */
function refileBlock(fromPath, block, toPath) {
  const from = getPage(fromPath), to = getPage(toPath);
  if (!from || !to) return;
  removeBlockFrom(from, block);
  to.blocks.push(block);
  if (isJournalPath(fromPath)) {
    from.blocks.push(newBlock({
      state: "DONE",
      title: "Refiled: " + block.title + " -> [[" + pageRef(toPath) + "]]",
      props: {CLOSED: todayStamp()},
    }));
  }
  touch(fromPath); touch(toPath);
  notify("Refiled to " + pageTitle(toPath));
  render();
}

function addNextActionTo(path, text) {
  const page = getPage(path); if (!page) return null;
  const blk = newBlock({state: "TODO", title: text, props: {Added: "[[" + todayISO() + "]]"}});
  page.blocks.push(blk);
  touch(path);
  return blk;
}

function updateReviewed(path) {
  const page = getPage(path); if (!page) return;
  page.props.reviewed = todayStamp();
  touch(path);
  notify("Reviewed date updated");
}

function mergePages(sourcePath, targetPath) {
  const src = getPage(sourcePath), tgt = getPage(targetPath);
  if (!src || !tgt) return;
  tgt.blocks.push(...src.blocks);
  touch(targetPath);
  removePage(sourcePath);
  notify("Merged " + baseName(sourcePath) + " into " + baseName(targetPath));
}
