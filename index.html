/* ---------- first run and migration ---------- */
/* Is this page being served by serve.py? If so, that is where files belong, and
   a space sitting in browser storage instead would mean nothing the person
   creates ever appears in their folder. */
let SERVER_BASE = null;
async function detectServer() {
  if (SERVER_BASE !== null) return SERVER_BASE;
  SERVER_BASE = "";
  if (CAP.served) {
    try {
      const r = await fetch("./api/ping", {cache: "no-store"});
      if (r.ok) SERVER_BASE = location.origin + location.pathname.replace(/\/[^/]*$/, "");
    } catch (_) {}
  }
  return SERVER_BASE;
}

async function initSpaces() {
  await Spaces.load();
  await detectServer();
  if (Spaces.list.length) return;

  // An existing single vault from before spaces existed becomes one space.
  let legacy = null;
  try { legacy = await IDB.get("kv", "dirHandle"); } catch (_) {}
  let server = null;
  server = safeLS.get("gtd.server");
  if (!server) server = SERVER_BASE;        // served by serve.py: that is the vault

  if (legacy) {
    await IDB.set("kv", "dir:Personal", legacy).catch(() => {});
    await Spaces.add({name: "Personal", kind: "fs", label: legacy.name});
  } else if (server) {
    await Spaces.add({name: "Personal", kind: "http", server});
  } else {
    // Nothing to migrate yet: a placeholder the spaces wizard may replace.
    await Spaces.add({name: "Personal", kind: "local", legacyFlat: true, placeholder: true});
  }
}

const isJournalPath = p => p.startsWith(JOURNALS + "/");
const isPagePath    = p => p.startsWith(PAGES + "/");

  return m ? m[1] : null;
}
function pageKind(path) {
  if (isJournalPath(path)) return "journal";
  if (isHorizonPage(path)) return "horizon";

  if (path.startsWith(DIRS.templates + "/")) return "template";
  if (path.startsWith(DIRS.verbs     + "/")) return "verb";

}
const baseName  = p => (p || "").split("/").pop().replace(/\.md$/i, "");
const pageTitle = p => (getPage(p)?.props?.title) || baseName(p);

/* Short reference used in links: "1/Fix sink", "c/phone", "2026-09-17" */
function pageRef(path) {
  const sd = statusDirOf(path);
  if (sd) return sd + "/" + baseName(path);
  for (const [pfx, dir] of Object.entries(PREFIX_DIR)) {
    if (path.startsWith(dir + "/")) return pfx + "/" + baseName(path);
  }
  if (isJournalPath(path)) return baseName(path);
  return baseName(path);
}

function allPages(filter) {
  const out = [];
  for (const path of V.pages.keys()) if (!filter || filter(path)) out.push(path);
  return out.sort();
}
const projectsIn = code => allPages(p => statusDirOf(p) === code && !isHorizonPage(p));
/* Same list, but across every visible space and carrying which space each is in. */

  acrossSpaces(() => projectsIn(code).map(path => ({path, space: V.space})));

/* Journal files from the last N days that actually exist. */

/* ============================================================
   30_LINKS
   Port of: init.lua 110_WIKI_LINK_OVERRIDE
   ============================================================ */
const LINK_RE = /\[\[([^\]]+)\]\]/g;
const LINK_PREFIXES = new Set(Object.keys(STATUS_DIRS).concat(Object.keys(PREFIX_DIR)));

function linksIn(text) {
  const out = []; let m;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(text || ""))) out.push(trim(m[1]));
  return out;
}
const contextOf = text => {
  const m = /\[\[c\/([^\]]+)\]\]/.exec(text || "");
  return m ? trim(m[1]) : null;
};
const hasContextLink = text => /\[\[c\/[^\]]+\]\]/.test(text || "");

/* target -> vault path (creating nothing) */
function resolveWikiPath(target) {
  target = trim(target).replace(/\.md$/i, "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return journalPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  if (m) {
    const [, pfx, rest] = m;
    if (STATUS_DIRS[pfx]) return join(STATUS_DIRS[pfx], rest + ".md");
    if (PREFIX_DIR[pfx])  return join(PREFIX_DIR[pfx], rest + ".md");
  }
  return join(PAGES, target + ".md");
}

/* Find an existing page for a link target, searching every root like init.lua did. */
function findExistingPage(target) {
  target = trim(target).replace(/\.md$/i, "");
  const direct = resolveWikiPath(target);
  if (V.pages.has(direct)) return direct;
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return null;
  const slug = slugify(target.includes("/") ? target.split("/").pop() : target);
  const roots = [PAGES, DIRS.active, DIRS.someday, DIRS.waiting, DIRS.completed,
                 DIRS.cancelled, DIRS.people, DIRS.contexts, DIRS.orgs, DIRS.zettel];
  for (const r of roots) {
    const p = join(r, slug + ".md");
    if (V.pages.has(p)) return p;
  }
  return null;
}

/* ============================================================
   35_TEMPLATES
   Port of: init.lua 20_TEMPLATE_RESOLVER -- date cascade lookup:
   2026-09-17 > 2026-W38 > 2026-Q3 > 2026-H2 > 2026-09 > 09-17 > 2026 > 09 > kind
   ============================================================ */
function templateCandidates(date, kind) {
  const list = [];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || "");
  if (m) {
    const [, y, mo, d] = m;
    const w = isoWeek(date);
    list.push(date);
    if (w) list.push(`${w[1]}-W${pad2(w[0])}`);
    list.push(`${y}-Q${Math.ceil(+mo / 3)}`, `${y}-H${+mo <= 6 ? 1 : 2}`, `${y}-${mo}`, `${mo}-${d}`, y, mo);
  }
  if (kind) list.push(kind);
  return list;
}
function readTemplate(name) {
  const p = join(DIRS.templates, name + ".md");
  return V.pages.has(p) ? p : null;
}
function resolveTemplate({date, kind}) {
  const cands = templateCandidates(date, kind);
  if (kind === "journals" || (date && !kind)) cands.push("journals");
  if (kind && kind !== "journals") cands.push(kind, "pages");
  for (const name of cands) {
    const p = readTemplate(name);
    if (p) return {path: p, name};
  }
  return null;
}
function expandVars(text, vars) {
  return String(text).replace(/%(\w+)%/g, (all, k) => (k in vars ? vars[k] : all));
}
/* Deep-copy a template page, expanding %vars%. */
function instantiateTemplate(tplPath, vars) {
  const src = getPage(tplPath);
  const clone = {props: {}, blocks: []};
  for (const [k, v] of Object.entries(src.props || {})) clone.props[k] = expandVars(v, vars);
  const copy = bs => (bs || []).map(b => newBlock({
    state: b.state,
    title: expandVars(b.title, vars),
    props: Object.fromEntries(Object.entries(b.props || {}).map(([k, v]) => [k, expandVars(v, vars)])),
    body : (b.body || []).map(l => expandVars(l, vars)),
    children: copy(b.children),
  }));
  clone.blocks = copy(src.blocks);
  return clone;
}

/* ============================================================
   40_VERBS -- the Phys-Viz rule
   Port of: init.lua 50_VERB_SYSTEM
   pages/verbs/<lang>/<canonical>.md holds lines "synonym = canonical".
   A next action must START with a physical, visible verb.
   ============================================================ */
let VERB_LOOKUP = {};      // synonym -> canonical
let VERB_CANON  = {};      // canonical -> {lang, path, synonyms[]}

function scanVerbs() {
  VERB_LOOKUP = {}; VERB_CANON = {};
  for (const path of V.pages.keys()) {
    if (!path.startsWith(DIRS.verbs + "/")) continue;
    const rest = path.slice(DIRS.verbs.length + 1).split("/");
    if (rest.length < 2) continue;
    const lang = rest[0];
    const canonical = baseName(path).toLowerCase();
    const synonyms = [];
    const page = getPage(path);
    const scan = txt => {
      const m = /^\s*([\p{L}\p{M}\-_ ]+?)\s*=\s*([\p{L}\p{M}\-_ ]+?)\s*$/u.exec(txt || "");
      if (!m) return;
      const syn = m[1].toLowerCase();
      synonyms.push(syn);
      VERB_LOOKUP[syn] = canonical;
    };
    walkBlocks(page.blocks, b => { scan(b.title); (b.body || []).forEach(scan); });
    VERB_LOOKUP[canonical] = canonical;
    VERB_CANON[canonical] = {lang, path, synonyms};
  }
}

function startsWithVerb(title) {
  const m = /^\s*([\p{L}\p{M}\-]+)/u.exec(title || "");
  if (!m) return false;
  return !!VERB_LOOKUP[m[1].toLowerCase()];
}
function verbList() {
  return Object.keys(VERB_CANON).sort().map(c => ({canonical: c, lang: VERB_CANON[c].lang}));
}

/* ============================================================
   45_ORG_IMPORT -- convert an existing .org vault to markdown
   ============================================================ */
function orgToPage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const stack = [{level: 0, children: page.blocks}];
  let cur = null, inProps = false;

  for (const line of lines) {
    let m = /^#\+([\w-]+):\s*(.*)$/.exec(line);
    if (m && !cur) { page.props[m[1].toLowerCase()] = trim(m[2]); continue; }
    m = /^(\*+)\s+(.*)$/.exec(line);
    if (m) {
      const level = m[1].length;
      const [state, title] = splitState(m[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      stack[stack.length-1].children.push(blk);
      blk.level = level; blk.children = blk.children || [];
      stack.push(blk);
      cur = blk; inProps = false;
      continue;
    }
    if (!cur) continue;
    if (/^\s*:PROPERTIES:\s*$/.test(line)) { inProps = true; continue; }
    if (/^\s*:END:\s*$/.test(line))        { inProps = false; continue; }
    if (inProps) {
      const pm = /^\s*:([\w-]+):\s*(.*)$/.exec(line);
      if (pm) cur.props[pm[1].toLowerCase()] = trim(pm[2]);
      continue;
    }
    // "Added: [[2026-09-15]] - [[2026-09-17]] = 2 days"  ->  property
    const am = /^\s*(Added|CLOSED|SCHEDULED|DEADLINE):\s*(.*)$/i.exec(line);
    if (am) { cur.props[am[1].replace(/^./, c => c.toUpperCase())] = trim(am[2]); continue; }
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    cur.body.push(trim(line));
  }
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

function importOrgFiles() {
  let n = 0;
  for (const [path, text] of Array.from(V.raw)) {
    const mdPath = path.replace(/\.org$/i, ".md");
    if (V.pages.has(mdPath)) continue;
    putPage(mdPath, orgToPage(text));
    V.raw.delete(path);
    n++;
  }
  scanVerbs();
  notify(n ? `Converted ${n} .org files to markdown (originals untouched).` : "Nothing to import.");
  render();
}

<script>
/* ============================================================
   50_BLOCK_HELPERS
   ============================================================ */
const dateIn = s => (/(\d{4}-\d{2}-\d{2})/.exec(s || "") || [])[1] || null;

function blockProp(b, key) {
  if (!b || !b.props) return null;
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  return k ? b.props[k] : null;
}
function setBlockProp(b, key, val) {
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  b.props[k || key] = val;
}
const addedDate = b => dateIn(blockProp(b, "Added"));
const blockAge  = b => { const a = addedDate(b); return a ? dateDiffDays(a, todayISO()) : null; };
function dueDate(b) {
  return dateIn(blockProp(b, "SCHEDULED")) || dateIn(blockProp(b, "DEADLINE")) || dateIn(blockProp(b, "due"));
}
/* Locate a block anywhere in the vault by id. */
function findBlock(id) {
  for (const [path, page] of V.pages) {
    let found = null;
    walkBlocks(page.blocks, b => { if (b.id === id) found = b; });
    if (found) return {path, page, block: found};
  }
  return null;
}
function blockPagePath(block) {
  for (const [path, page] of V.pages) {
    let hit = false;
    walkBlocks(page.blocks, b => { if (b === block) hit = true; });
    if (hit) return path;
  }
  return null;
}
function removeBlockFrom(page, block) {
  const rec = list => {
    const i = list.indexOf(block);
    if (i >= 0) { list.splice(i, 1); return true; }
    return list.some(b => rec(b.children || []));
  };
  return rec(page.blocks);
}
function hasOpenDescendant(block) {
  let open = false;
  walkBlocks(block.children, b => { if (OPEN_STATES[b.state]) open = true; });
  return open;
}

/* ============================================================
   55_JOURNAL_LIFECYCLE
   Port of: init.lua 45_JOURNAL_LIFECYCLE

function ensureJournal(date) {
  date = date || todayISO();
  const path = journalPath(date);
  if (V.pages.has(path)) return path;
  const tpl = resolveTemplate({date, kind: "journals"});
  const page = tpl
    ? instantiateTemplate(tpl.path, {title: date, date, created: "[[" + date + "]]"})
    : {props: {title: date, created: "[[" + date + "]]"}, blocks: []};

/* ============================================================
   60_STATE_MACHINE
   Port of: init.lua set_org_state
     -> TODO : stamp "Added", then nudge for a context if missing
     -> DONE : close out the Added line with an end date + elapsed days,
               then check whether the project just ran out of next actions
   ============================================================ */
/* Dropping the state strips the task's dates out of the markdown, which is right
   for a note but unforgiving if the cycle went one click too far. The stripped
   properties are held here, in memory only, long enough to click back. */
const DEMOTED = new WeakMap();
const TASK_PROPS = /^(added|closed|done_by|scheduled|deadline)$/i;
const CLOSED_PROPS = /^(closed|done_by)$/i;

function setBlockState(path, block, state, opts = {}) {
  const prev = block.state;
  block.state = state;

  if (!state) {
    // No longer a task: drop the bookkeeping that only a task has, so the
    // markdown reads as the plain note it now is -- but remember it briefly.
    const kept = {};
    for (const k of Object.keys(block.props || {})) {
      if (TASK_PROPS.test(k)) { kept[k] = block.props[k]; delete block.props[k]; }
    }
    if (Object.keys(kept).length) DEMOTED.set(block, {props: kept, at: Date.now()});
    touch(path);
    render();
    return;
  }

  if (!prev) {
    // Becoming a task again. If that happened within the grace period, put the
    // original dates back rather than stamping today's.
    const stash = DEMOTED.get(block);
    if (stash && Date.now() - stash.at < CFG.undoStateMinutes * 60000) {
      const closing = state === "DONE" || state === "CANCELLED";
      let restored = 0;
      for (const [k, v] of Object.entries(stash.props)) {
        if (!closing && CLOSED_PROPS.test(k)) continue;   // a TODO has not been closed by anyone
        if (block.props[k] == null) { block.props[k] = v; restored++; }
      }
      DEMOTED.delete(block);
      if (restored) notify("Back to a task, with its original dates.");
    }
  }

  if (OPEN_STATES[state]) {
    // Re-opening something: it is no longer closed, so the closing stamps go.
    // (This also catches a plain un-tick, which used to leave a TODO claiming
    // it had been finished.)
    const raw = blockProp(block, "Added");
    if (raw) {
      const reopened = raw.replace(/\s*-\s*\[\[\d{4}-\d{2}-\d{2}\]\]\s*=\s*-?\d+\s*days?\s*$/, "");
      if (reopened !== raw) setBlockProp(block, "Added", trim(reopened));
    }
    for (const k of Object.keys(block.props || {})) {
      if (CLOSED_PROPS.test(k)) delete block.props[k];
    }
  }

  if (state === "TODO" || state === "DOING") {
    if (path !== journalPath() && !addedDate(block)) {
      setBlockProp(block, "Added", "[[" + todayISO() + "]]");
      stampAuthor(block);
    }
  } else if (state === "DONE" || state === "CANCELLED") {
    coachMark("tick");
    const me = stampName();
    if (me) setBlockProp(block, "done_by", me + " " + nowStamp());
    const added = addedDate(block);
    const end = todayISO();
    if (added) {
      const raw = blockProp(block, "Added") || "";
      if (!/\]\]\s*-\s*\[\[/.test(raw)) {
        const days = dateDiffDays(added, end) ?? 0;
        setBlockProp(block, "Added", raw + " - [[" + end + "]] = " + days + " days");
      }
    } else if (!blockProp(block, "CLOSED")) {
      setBlockProp(block, "CLOSED", "[[" + end + "]]");
    }
  }
  touch(path);

  if ((state === "TODO" || state === "DOING") && !opts.skipContext
      && !gtdQuiet() && !hasContextLink(block.title)) {
    promptAndInsertContext(path, block);
    return;
  }
  if (state === "DONE" || state === "CANCELLED") {
    if (prev !== state) noteTodoTouched();
    checkProjectCompletion(path);
  }
  render();
}

/* In the outliner the cycle comes back round to "not a task at all", so anything
   made a todo by accident -- or a line that stopped being one -- can be turned
   back into an ordinary note without retyping it. On a to-do list row there is
   nowhere for a plain note to live, so {keepTask} stops at DONE and wraps to
   TODO; the action panel still has the explicit way out. */
function cycleState(path, block, opts = {}) {
  const order = opts.keepTask ? ["TODO", "DOING", "WAIT", "DONE"]
                              : ["TODO", "DOING", "WAIT", "DONE", null];
  const i = order.indexOf(block.state ?? null);
  setBlockState(path, block, order[(i + 1) % order.length]);
}

const GROUPS = ["LATE", "TODAY", "PROJECT", "LINKED", "WAITING", "JOURNAL"];
const GROUP_META = {
  LATE   : {label: "Overdue",         cls: "late"},
  TODAY  : {label: "Due today",       cls: "today"},
  PROJECT: {label: "Project actions", cls: "proj"},
  LINKED  : {label: "Journal, linked to a project", cls: "ctx"},
  WAITING: {label: "Waiting for",     cls: "wait"},
  JOURNAL: {label: "Loose journal actions", cls: ""},
};

/* The block itself, or its nearest ancestor, linking to a project page: [[1/Fix sink]] */
function nearestProjectAncestor(block) {
  let p = block;
  while (p) {
    const m = /\[\[([_0123])\/([^\]]+)\]\]/.exec(p.title || "");
    if (m) return {statusDir: m[1], title: trim(m[2]), ref: m[1] + "/" + trim(m[2])};
    p = p._parent;
  }
  return null;
}

/* Open leaf actions: an open item with no open children is the actionable one.
   With several spaces shown, this runs once per space and tags each result. */
function leafActions() { return acrossSpaces(leafActionsHere); }

function leafActionsHere() {
  const out = [];
  const paths = [...projectsIn("1"), ...projectsIn("3"), ...recentJournals()];
  for (const path of paths) {
    const page = getPage(path); if (!page) continue;
    const journal = isJournalPath(path);
    const flat = flattenBlocks(page.blocks);
    for (const b of flat) {
      if (!OPEN_STATES[b.state] || hasOpenDescendant(b)) continue;
      const linked = journal ? nearestProjectAncestor(b) : null;
      let group = "JOURNAL", project = null, projectStatusDir = null, projectPath = null;
      if (!journal) {
        group = b.state === "WAIT" ? "WAITING" : "PROJECT";
        project = pageTitle(path);
        projectStatusDir = statusDirOf(path);
        projectPath = path;
      } else if (linked) {
        group = b.state === "WAIT" ? "WAITING" : "LINKED";
        project = linked.title;
        projectStatusDir = linked.statusDir;
        projectPath = findExistingPage(linked.ref);
      } else if (b.state === "WAIT") {
        group = "WAITING";
      }
      const due = dueDate(b);
      if (due) {
        if (due < todayISO()) group = "LATE";
        else if (due === todayISO()) group = "TODAY";
      }
      out.push({
        path, block: b, state: b.state, title: b.title,
        project, projectPath, projectStatusDir, group, due,
        context: contextOf(b.title),
        missingContext: !hasContextLink(b.title),
        missingVerb: !startsWithVerb(b.title),
        // Journal items carry no Added:: stamp (the filename is the date),
        // so fall back to the journal's own date to keep "oldest first" honest.
        by: blockProp(b, "by"), doneBy: blockProp(b, "done_by"),
        added: addedDate(b) || (journal ? baseName(path) : null),
        age: blockAge(b) ?? (journal ? dateDiffDays(baseName(path), todayISO()) : null),
      });
    }
  }
  return out;
}

/* Active projects with nothing actionable left -- the classic GTD trap. */
function stuckActiveProjects() {
  const linkedFromJournal = new Set();
  for (const a of leafActions()) {
    if (a.group === "LINKED" && a.project) linkedFromJournal.add(a.project.toLowerCase());
  }
  const stuck = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const flat = flattenBlocks(page.blocks);
    let leafTodo = false, waiting = false, parentTodos = false;
    for (const b of flat) {
      if (b.state === "TODO" || b.state === "DOING") {
        if (hasOpenDescendant(b)) parentTodos = true; else leafTodo = true;
      } else if (b.state === "WAIT" && !hasOpenDescendant(b)) waiting = true;
    }
    const fromJournal = linkedFromJournal.has(pageTitle(path).toLowerCase())
                     || linkedFromJournal.has(baseName(path).toLowerCase());
    if (!leafTodo && !waiting && !fromJournal) {
      stuck.push({path, reason: parentTodos ? "Has parent TODOs but no actionable task" : "No next action"});
    }
  }
  return stuck;
}

/* Stalest active projects. Missing context beats missing verb beats plain age. */
function stalestActiveProjects(n = CFG.weedCount) {
  const rows = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const todos = [];
    let noContext = false, noVerb = false, anyTodo = false;
    for (const b of flattenBlocks(page.blocks)) {
      if (!OPEN_STATES[b.state]) continue;
      anyTodo = true;
      const ctx = contextOf(b.title);
      const missingVerb = !startsWithVerb(b.title);
      if (!ctx) noContext = true;
      if (missingVerb) noVerb = true;
      todos.push({path, block: b, state: b.state, title: b.title,
                  context: ctx, missingContext: !ctx, missingVerb});
    }
    const createdDate = dateIn(page.props?.created);
    const reviewedDate = dateIn(page.props?.reviewed);
    const ageDays = createdDate ? dateDiffDays(createdDate, todayISO()) : null;
    const idleDays = reviewedDate ? dateDiffDays(reviewedDate, todayISO())
                   : (ageDays ?? 3650);
    let bias = 0;
    if (!anyTodo)  bias += 1500;
    if (noContext) bias += 1000;
    if (noVerb)    bias += 500;
    rows.push({path, title: pageTitle(path), todos, anyTodo, noContext, noVerb,
               ageDays, createdDate, reviewedDate, idleDays, score: bias + (idleDays || 0)});
  }
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, n);
}

/* The heart of the nudge loop: 3 oldest open actions in the chosen context. */
function oldestTodosForContext(context, n = CFG.surfaceCount) {
  const matches = leafActions().filter(a => {
    if (a.context !== context) return false;
    if (!OPEN_STATES[a.state]) return false;
    // standalone, or under an active / waiting project -- never 0, 2 or _
    return a.projectStatusDir == null || a.projectStatusDir === "1" || a.projectStatusDir === "3";
  });
  matches.sort((x, y) => (x.added || "9999-99-99").localeCompare(y.added || "9999-99-99"));
  return matches.slice(0, n);
}

function contextList() {
  const set = new Set();
  for (const path of allPages(p => p.startsWith(DIRS.contexts + "/"))) {
    set.add(path.slice(DIRS.contexts.length + 1).replace(/\.md$/i, ""));
  }
  for (const a of leafActions()) if (a.context) set.add(a.context);
  return Array.from(set).sort();
}

function agendaScan(days = CFG.agendaDays) {
  const cutoff = shiftISO(todayISO(), days);
  const byDate = new Map();
  for (const a of leafActions()) {
    if (!a.due || a.due > cutoff) continue;
    if (!byDate.has(a.due)) byDate.set(a.due, []);
    byDate.get(a.due).push(a);
  }
  return Array.from(byDate.entries()).sort((x, y) => x[0].localeCompare(y[0]));
}

/* Port of: init.lua 70_HEALTH_CHECKS */
function healthScan() {
  const issues = [];
  for (const path of [...projectsIn("1"), ...projectsIn("2"), ...projectsIn("3")]) {
    const page = getPage(path);
    if (!page.props?.title) issues.push({path, type: "missing-title", text: "No title:: property"});
    if (statusDirOf(path) === "3" && !(page.props?.waiting_since || page.props?.["waiting-since"]))
      issues.push({path, type: "missing-waiting_since", text: "Waiting project without waiting_since"});
  }
  for (const [path, page] of V.pages) {
    if (pageKind(path) === "template") continue;
    const check = (text, blk) => {
      for (const target of linksIn(text)) {
        const t = target.split("][")[0];
        if (/^\d{4}-\d{2}-\d{2}$/.test(t)) continue;
        if (!LINK_PREFIXES.has((/^([^/]+)\//.exec(t) || [])[1])) continue;
        if (!findExistingPage(t)) issues.push({path, block: blk, type: "broken-link", text: "Broken link: [[" + t + "]]"});
      }
    };
    walkBlocks(page.blocks, b => { check(b.title, b); (b.body || []).forEach(l => check(l, b)); });
  }
  return issues;
}

/* Port of: init.lua 60_GRAPH_QUERIES */
function backlinksTo(path) {
  const ref = pageRef(path).toLowerCase();
  const name = baseName(path).toLowerCase();
  const hits = [];
  for (const [p, page] of V.pages) {
    if (p === path) continue;
    walkBlocks(page.blocks, b => {
      const text = [b.title, ...(b.body || [])].join("\n");
      for (const target of linksIn(text)) {
        const t = target.split("][")[0].toLowerCase().replace(/\.md$/, "");
        if (t === ref || t === name) { hits.push({path: p, block: b}); return; }
      }
    });
  }
  return hits;
}

/* Port of: init.lua find_duplicate_projects */
function duplicateProjects() {
  const bySlug = new Map();
  for (const path of allPages(p => statusDirOf(p) && !isHorizonPage(p))) {
    const slug = baseName(path).toLowerCase();
    if (!bySlug.has(slug)) bySlug.set(slug, []);
    bySlug.get(slug).push(path);
  }
  return Array.from(bySlug.entries())
    .filter(([, l]) => l.length > 1)
    .map(([slug, paths]) => ({slug, paths: paths.sort()}))
    .sort((a, b) => b.paths.length - a.paths.length || a.slug.localeCompare(b.slug));
}

function openTodoCount(path) {
  const page = getPage(path); if (!page) return 0;
  return flattenBlocks(page.blocks).filter(b => OPEN_STATES[b.state]).length;
}

/* ============================================================
   70_PAGE_MUTATIONS
   Port of: init.lua 65_PROJECT_STATUS_MOVE + 75_REFILE_AND_TELEPORT
   ============================================================ */
function rewriteLinksEverywhere(oldRef, newRef) {
  if (oldRef === newRef) return 0;
  let changed = 0;
  const re = new RegExp("\\[\\[" + oldRef.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\]\\]|\\]\\[)", "g");
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = s => { const n = s.replace(re, "[[" + newRef + "$1"); if (n !== s) hit = true; return n; };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) { touch(path); changed++; }
  }
  return changed;
}

function moveFile(oldPath, newPath) {
  if (oldPath === newPath) return true;
  if (V.pages.has(newPath)) { notify("Target already exists: " + newPath, "error"); return false; }
  const page = getPage(oldPath);
  const oldRef = pageRef(oldPath), oldBase = baseName(oldPath);
  V.pages.delete(oldPath);
  V.dirty.delete(oldPath);
  V.removed.add(oldPath);
  putPage(newPath, page);
  const newRef = pageRef(newPath);
  let n = rewriteLinksEverywhere(oldRef, newRef);
  if (oldBase !== baseName(newPath) || oldRef !== oldBase) n += rewriteLinksEverywhere(oldBase, newRef);
  if (n) notify("Link update: " + n + " pages updated.");
  return true;
}

function setProjectStatus(path, code) {
  if (!STATUS_DIRS[code]) return;
  const page = getPage(path);
  page.props.status = STATUS_TEXT[code];
  page.props.reviewed = todayStamp();
  if (code === "0") page.props.completed = todayStamp();
  if (code === "_") page.props.cancelled = todayStamp();
  if (code === "3") page.props.waiting_since = todayStamp();
  const newPath = join(STATUS_DIRS[code], baseName(path) + ".md");
  touch(path);
  if (newPath !== path && moveFile(path, newPath)) {
    notify("Moved to " + STATUS_TEXT[code]);
    if (state.view === "page" && state.pagePath === path) state.pagePath = newPath;
  } else {
    notify("Status: " + STATUS_TEXT[code]);
  }
  render();
}

/* ============================================================
   71_HORIZONS_OF_FOCUS
   David Allen's six altitudes. Control (what's on your plate) is only half
   the model; perspective is the other half, and it is the half every todo
   app drops. Nothing here is invented for you -- the app ships with no
   areas, no goals and no contexts, because borrowed ones are worse than none.

     Horizon 5  50,000 ft   Purpose and principles   why you are here
     Horizon 4  40,000 ft   Vision                   3-5 years out
     Horizon 3  30,000 ft   Goals and objectives     1-2 years
     Horizon 2  20,000 ft   Areas of focus           ongoing, never "done"
     Horizon 1  10,000 ft   Projects                 outcomes inside a year
     Ground      runway     Next actions             the very next physical move
   ============================================================ */
/* Underscore-prefixed so it sorts to the top of pages/ next to the other
   system pages, rather than mixing in with real content. */
/* Each horizon is its own page under pages/_/ -- pages/_/Purpose.md,
   pages/_/Vision.md -- so they read and link like anything else: [[_/Purpose]].

   Note that pages/_/ is also where cancelled projects go. A horizon page is
   marked type:: horizon, and every project listing filters those out, so the
   two never mix in the UI even though they share a drawer. */
const DIR_HORIZONS    = join(PAGES, "_");
const HORIZONS_LEGACY = [join(PAGES, "_horizon.md"), join(PAGES, "Horizons.md")];

const HORIZONS = [
  {key: "purpose", h: "Horizon 5", alt: "50,000 ft", name: "Purpose & principles",
   page: "Purpose", level: "5",
   ask: "Why does this life or this work exist? What standards do you hold yourself to?"},
  {key: "vision",  h: "Horizon 4", alt: "40,000 ft", name: "Vision",
   page: "Vision", level: "4",
   ask: "Three to five years out, what does wild success look like?"},
  {key: "goals",   h: "Horizon 3", alt: "30,000 ft", name: "Goals & objectives",
   ask: "What do you want to be true in the next one to two years?"},
  {key: "areas",   h: "Horizon 2", alt: "20,000 ft", name: "Areas of focus",
   ask: "Which parts of your life and work must stay healthy? These never finish."},
  {key: "projects",h: "Horizon 1", alt: "10,000 ft", name: "Projects",
   ask: "What outcomes are you committed to finishing within a year?"},
  {key: "ground",  h: "Ground",    alt: "runway",    name: "Next actions",
   ask: "What is the very next physical, visible move?"},
];
const HORIZON_BY_KEY = Object.fromEntries(HORIZONS.map(h => [h.key, h]));

const horizonPath = key => join(DIR_HORIZONS, (HORIZON_BY_KEY[key]?.page || key) + ".md");
const isHorizonPage = path =>
  path.startsWith(DIR_HORIZONS + "/") && trim(getPage(path)?.props?.type || "") === "horizon";

function horizonPage(key, create) {
  const path = horizonPath(key);
  if (!V.pages.has(path) && create) {
    const h = HORIZON_BY_KEY[key];
    putPage(path, {
      props: {title: h?.page || key, type: "horizon", horizon: h?.level || "",
              created: todayStamp()},
      blocks: [],
    });
  }
  return V.pages.has(path) ? getPage(path) : null;
}

function getHorizon(key) {
  const page = horizonPage(key, false);
  if (!page) return [];
  return (page.blocks || []).map(b => b.title).filter(t => trim(t));
}

function setHorizon(key, lines) {
  const page = horizonPage(key, true);
  page.blocks = lines.filter(l => trim(l)).map(l => newBlock({title: trim(l)}));
  touch(horizonPath(key));
}

/* An older vault kept purpose and vision as sections of one page. Split them. */
function migrateHorizons() {
  for (const legacy of HORIZONS_LEGACY) {
    if (!V.pages.has(legacy)) continue;
    const page = getPage(legacy);
    const headings = {purpose: "Purpose & principles", vision: "Vision (3-5 years)"};
    for (const [key, head] of Object.entries(headings)) {
      const blk = (page.blocks || []).find(b => trim(b.title) === head);
      const lines = blk ? (blk.children || []).map(c => c.title).filter(t => trim(t)) : [];
      if (lines.length && !getHorizon(key).length) setHorizon(key, lines);
    }
    removePage(legacy);
  }
}

/* ============================================================
   74_PROJECT_OUTCOME
   "What would done look like?" A project named Website is a noun nobody
   can finish. A project named Website live and taking bookings is a
   finish line. Stored as outcome:: so it stays greppable markdown.
   ============================================================ */
const OUTCOME_PLACEHOLDER = /what does done look like|what has to be true/i;

function outcomeOf(path) {
  const page = getPage(path); if (!page) return null;
  const prop = trim(page.props?.outcome || "");
  if (prop && !OUTCOME_PLACEHOLDER.test(prop)) return prop;
  // older pages wrote it as a leading "Outcome: ..." block
  for (const b of page.blocks || []) {
    const m = /^outcome:\s*(.+)$/i.exec(trim(b.title));
    if (m && !OUTCOME_PLACEHOLDER.test(m[1])) return trim(m[1]);
  }
  return null;
}
function setOutcome(path, text) {
  const page = getPage(path); if (!page) return;
  page.props.outcome = trim(text);
  // drop a stale placeholder block so the page does not say it twice
  page.blocks = (page.blocks || []).filter(b => !(/^outcome:/i.test(trim(b.title)) && OUTCOME_PLACEHOLDER.test(b.title)));
  touch(path);
}
/* Active and waiting projects with no finish line stated. */
const projectsWithoutOutcome = () =>
  allPages(p => ["1", "3"].includes(statusDirOf(p))).filter(p => !outcomeOf(p));

function openOutcomePrompt(path, then) {

    label: 'Write it as if it already happened — "Sink repaired, no drip"',
    value: outcomeOf(path) || "",
    cta: "Save outcome",

  });
}

/* ============================================================
   73_CHECKLISTS -- the MS To Do half: a reusable list you run again
   and again (weekly shop, trip packing, release steps).
   ============================================================ */
function checklistTemplate(title, kind, cadence) {
  const props = {title, type: "checklist", created: todayStamp()};
  if (kind === "project") {
    props.kind = "project";
    props.outcome = "%name% complete";
  }
  /* cadence:: is what separates a routine from a plain checklist. It is a word,
     not a schedule -- nothing fires on a timer here, and a to-do app that nags
     you about a recurrence you set months ago is the thing people flee. */
  if (kind === "routine") props.cadence = cadence || "as needed";
  return {
    props,
    blocks: kind === "project"
      ? [newBlock({title: "First step for %name%"})]
      : [newBlock({title: "First step"})],
  };
}

/* A checklist marked kind:: project is a PROJECT TEMPLATE: running it spins up
   a whole new project with these steps as its actions. "Onboard new insurance
   customer" run twice gives two independent projects, each with the same
   choreography. %name% in a step or in the outcome is replaced by the name you
   give that run. */
const isProjectTemplate = path => trim(getPage(path)?.props?.kind || "") === "project";

function setChecklistKind(path, kind) {
  const page = getPage(path); if (!page) return;
  if (kind === "project") page.props.kind = "project"; else delete page.props.kind;
  touch(path);
}

function runChecklistAsProject(listPath, name, opts = {}) {
  const list = getPage(listPath); if (!list) return null;
  const vars = {name, project: name, date: todayISO()};
  const projectPath = createProjectPage(name);

  const outcomeTpl = trim(list.props?.outcome || "");
  const outcome = trim(opts.outcome || (outcomeTpl ? expandVars(outcomeTpl, vars) : ""));
  if (outcome) setOutcome(projectPath, outcome);

  const areaM = /\[\[a\/([^\]]+)\]\]/.exec(list.props?.area || "");
  if (areaM) setAreaOfProject(projectPath, trim(areaM[1]));
  const goalM = /\[\[g\/([^\]]+)\]\]/.exec(list.props?.goal || "");
  if (goalM) setGoalOfProject(projectPath, trim(goalM[1]));

  const page = getPage(projectPath);
  page.props.from = "[[8/" + baseName(listPath) + "]]";
  const ctx = opts.context || state.context;
  let n = 0;
  const copy = blocks => (blocks || []).map(b => {
    n++;
    const title = expandVars(b.title, vars);
    return stampAuthor(newBlock({
      state: "TODO",
      title: title + (ctx && !hasContextLink(title) ? " [[c/" + ctx + "]]" : ""),
      props: {Added: "[[" + todayISO() + "]]"},
      children: copy(b.children),
    }));
  });
  page.blocks.push(...copy(list.blocks));
  touch(projectPath);
  return {path: projectPath, steps: n};
}
function createChecklist(title, kind, cadence) {
  const clean = slugify(title);
  const path = join(DIRS.lists, clean + ".md");
  if (!V.pages.has(path)) putPage(path, checklistTemplate(clean, kind, cadence));
  return path;
}
const checklistPages = () => allPages(p => pageKind(p) === "checklist");
const isRoutine = path => !!trim(getPage(path)?.props?.cadence || "");
const cadenceOf = path => trim(getPage(path)?.props?.cadence || "");

/* Three things live in this folder and they are not the same thing:

     a project   finishes  -- "Move house", ticked off once and gone
     a routine   returns   -- "Weekly accounts", never finished, only due again
     a template  breeds    -- "Onboard customer", one new project per run

   Filing a routine as a project is the commonest way a GTD list goes bad: it
   sits in Active looking undone forever, and everything around it starts to
   feel undone too. So the words are asked for at the moment of naming, where
   changing your mind is free. */
const ROUTINE_WORDS = /\b(daily|weekly|fortnightly|monthly|quarterly|yearly|annual(?:ly)?|routine|recurring|upkeep|maintenance|housekeeping|habit|stand-?up|check-?ins?|every (?:day|week|month|morning|evening|monday|tuesday|wednesday|thursday|friday|saturday|sunday)|each (?:day|week|month|morning))\b/i;
function cadenceFrom(name) {
  const m = /\b(daily|weekly|fortnightly|monthly|quarterly|yearly|annual(?:ly)?)\b/i.exec(name || "");
  if (!m) return "as needed";
  return m[1].toLowerCase().replace(/^annually$/, "annual");
}

/* Copy a checklist's items into a target page as fresh open actions. */
function runChecklist(listPath, targetPath, context) {
  const list = getPage(listPath), target = getPage(targetPath);
  if (!list || !target) return 0;
  const ctx = context || state.context;
  let n = 0;
  const parent = newBlock({
    title: pageTitle(listPath) + " [[8/" + baseName(listPath) + "]]",
    props: {Added: "[[" + todayISO() + "]]"},
  });
  const copy = blocks => (blocks || []).map(b => {
    n++;
    return stampAuthor(newBlock({
      state: "TODO",
      title: b.title + (ctx && !hasContextLink(b.title) ? " [[c/" + ctx + "]]" : ""),
      props: {Added: "[[" + todayISO() + "]]"},
      children: copy(b.children),
    }));
  });
  parent.children = copy(list.blocks);
  target.blocks.push(parent);
  touch(targetPath);
  return n;
}

function pageTemplateFor(kind, title) {
  if (kind === "z") return zettelTemplate(title);
  if (kind === "a") return areaTemplate(title);
  if (kind === "g") return goalTemplate(title);
  if (kind === "k") return checklistTemplate(title);
  if (STATUS_DIRS[kind]) return projectTemplateLines(title, kind);
  const tpl = resolveTemplate({kind});
  if (tpl) return instantiateTemplate(tpl.path, {title, created: todayStamp(), kind});
  const props = {title, created: todayStamp()};
  if (["p", "c", "o"].includes(kind)) props.type = {p: "person", c: "context", o: "org"}[kind];
  return {props, blocks: [newBlock({title: ""})]};
}

/* Follow [[target]] -- creating the page if it does not exist yet. */
function followLink(target) {
  target = trim(target).split("][")[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) { openPage(ensureJournal(target)); return; }
  const existing = findExistingPage(target);
  if (existing) { openPage(existing); return; }
  const path = resolveWikiPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  const kind = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[1] : "page";
  const title = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[2] : target;
  putPage(path, pageTemplateFor(kind, title));
  notify("Created page: " + path);
  scanVerbs();
  openPage(path);
}

/* Port of: init.lua refile_current_task -- move a subtree to a project,
   leaving a DONE breadcrumb behind when it came from a journal. */
function refileBlock(fromPath, block, toPath) {
  const from = getPage(fromPath), to = getPage(toPath);
  if (!from || !to) return;
  removeBlockFrom(from, block);
  to.blocks.push(block);
  if (isJournalPath(fromPath)) {
    from.blocks.push(newBlock({
      state: "DONE",
      title: "Refiled: " + block.title + " -> [[" + pageRef(toPath) + "]]",
      props: {CLOSED: todayStamp()},
    }));
  }
  touch(fromPath); touch(toPath);
  notify("Refiled to " + pageTitle(toPath));
  render();
}

function addNextActionTo(path, text) {
  const page = getPage(path); if (!page) return null;
  const blk = stampAuthor(newBlock({state: "TODO", title: text, props: {Added: "[[" + todayISO() + "]]"}}));
  page.blocks.push(blk);
  touch(path);
  return blk;
}

function updateReviewed(path) {
  const page = getPage(path); if (!page) return;
  page.props.reviewed = todayStamp();
  touch(path);
  notify("Reviewed date updated");
}

function mergePages(sourcePath, targetPath) {
  const src = getPage(sourcePath), tgt = getPage(targetPath);
  if (!src || !tgt) return;
  tgt.blocks.push(...src.blocks);
  touch(targetPath);
  removePage(sourcePath);
  notify("Merged " + baseName(sourcePath) + " into " + baseName(targetPath));
}

<script>
/* ============================================================
   75_SETTINGS -- kept in markdown too (pages/GTD.md)

const SETTINGS_PATH = join(PAGES, "GTD.md");
function settingsPage() {
  if (!V.pages.has(SETTINGS_PATH)) {
    putPage(SETTINGS_PATH, {
      props: {title: "GTD", type: "settings", created: todayStamp(), started: todayISO()},

/* ============================================================
   76_IDENTITY
   A shared space means several people editing the same markdown. Changes
   therefore carry a name and a time, written into the files themselves so
   they survive sync, git and any editor -- not held in some private database.

   The name lives on this device (and can differ per space: your full name at
   work, something shorter at home). With no name set, nothing is stamped, so
   a vault you use alone stays clean.
   ============================================================ */
function whoAmI() {
  return trim(PREF.get("identity:" + (Spaces.active || ""), "") || PREF.get("identity", "") || "");
}
function setIdentity(name, space) {
  const clean = trim(name).slice(0, 60);
  if (space) PREF.set("identity:" + space, clean);
  else PREF.set("identity", clean);
}

/* Stamp authorship on something the person just created. */
function stampAuthor(block) {
  const me = stampName();
  if (me && block && block.props && !block.props.by) block.props.by = me;
  return block;
}

const getSetting = k => settingsPage().props[k] || null;

/* The weekly review is only "due" once a week of actually using the thing has
   passed. Day one should not open with a red chip about a review you could not
   possibly have done yet. */
function reviewBaseline() {
  const last = dateIn(getSetting("last_review"));
  if (last) return last;
  return dateIn(getSetting("started")) || todayISO();
}
const daysSinceReview = () => dateDiffDays(reviewBaseline(), todayISO()) ?? 0;
const reviewDue = () => daysSinceReview() >= CFG.reviewEveryDays;
function setSetting(k, v) { settingsPage().props[k] = v; touch(SETTINGS_PATH); }

/* ============================================================
   80_NUDGE_ENGINE
   Every GTD nudge the Neovim config fired, as a always-visible strip.
   ============================================================ */
/* GTD's own vocabulary is the steepest thing here. In simple mode the nudges
   say what they mean, and the method-purist ones stay quiet until there is
   enough on the list for them to be about something. */
/* One rule, used by the nudge bar, the row chips and the context prompt: a
   newcomer with a handful of tasks is not told off about method. */
let QUIET_CACHE = null;
/* Weeding ranks the stalest of many projects. With a handful of each it has
   nothing to say, so it is never suggested -- though g w still opens it for
   anyone who wants to look. */
function weedingWorthIt() {
  const projects = projectsIn("1").length;
  if (projects < CFG.weedMinProjects) return false;
  return leafActions().filter(a => OPEN_STATES[a.state]).length >= CFG.weedMinTodos;
}

function gtdQuiet() {
  if (!isSimple()) return false;
  if (QUIET_CACHE === null) {
    QUIET_CACHE = leafActions().filter(a => OPEN_STATES[a.state]).length < CFG.quietUntilTasks;
  }
  return QUIET_CACHE;
}

const NUDGE_PLAIN = {
  stuck  : "projects with nothing to do next",
  loose  : "tasks not attached to anything",
  verb   : "tasks that don't say what to actually do",
  ctx    : "tasks with no place to do them",
  outcome: "projects with no finish line",
  area   : "projects not under an area",
  goal   : "goals nobody is working on",
  wait   : "people to chase",
  late   : "overdue",
  stale  : "projects older than 6 months",
};
const DEEP_NUDGES = ["verb", "ctx", "area", "goal", "loose", "outcome"];

/* Why each one is here, in the person's own interest rather than the method's.
   Kept out of the way -- a chip says what is true, this says why anyone should
   care, and only when asked. Where the research is strong it is named; where it
   is folklore it is written as an opinion, because a nudge that oversells itself
   is just advertising. */
const NUDGE_WHY = {
  late:
    "A date you sail past teaches you to stop believing your own list, and a list you " +
    "do not believe stops getting opened. Moving the date on purpose keeps it honest; " +
    "letting it rot does not.",
  stuck:
    "A project with no next step is the one thing your head refuses to let go of, " +
    "because there is nothing to let go of it to. One concrete next action is what " +
    "makes it quiet.",
  loose:
    "A task with no home survives a day and rots over a month: nothing brings it back " +
    "to you at the moment it would have mattered.",
  verb:
    "\u201cSort out the insurance\u201d is a decision you have to make again every time you " +
    "read it. \u201cCall Storebrand\u201d is something your hands can start. This is the " +
    "best-evidenced habit in the whole system: people who write down the specific " +
    "action, and when and where they will do it, follow through markedly more often " +
    "than people who only intend to \u2014 psychologists call them implementation intentions.",
  ctx:
    "Most of what blocks a task is being in the wrong place, without the thing you " +
    "need in your hand. A context is what lets the list answer the only question you " +
    "ever really ask it: what can I actually do, here, now?",
  outcome:
    "Written as though it already happened \u2014 \u201cSink repaired, no drip\u201d \u2014 a project " +
    "gives you something you can recognise when you get there. Without it projects do " +
    "not finish, they only get older.",
  area:
    "A project under no part of your life is usually one you took on without ever " +
    "deciding to.",
  goal:
    "A goal nobody is working on is a wish. Give it a project or let it go \u2014 both are " +
    "honest; leaving it to sit there is the one option that costs you something.",
  wait:
    "Anything you handed to someone else is invisible by definition. Keeping the list " +
    "is what makes chasing it feel like admin rather than nagging.",
  stale:
    "Old projects do not sit there harmlessly. They make the whole list feel heavy, " +
    "and a heavy list gets avoided.",
  review:
    "The weekly look is what makes everything else trustworthy. Capture, contexts and " +
    "projects are bookkeeping if nobody ever reads them back.",
};

/* A nudge you have quietened. Deliberately per-nudge and time-boxed rather than a
   global off switch: "not now" is almost always what someone means, and a nudge that
   can never come back is a nudge that has to shout the first time. */
const nudgeQuietUntil = id => PREF.get("nudge.quiet." + id, "");
function nudgeQuiet(id) {
  const until = nudgeQuietUntil(id);
  return !!until && todayISO() < until;
}
function quietNudge(id, days) {
  PREF.set("nudge.quiet." + id, shiftISO(todayISO(), days == null ? CFG.nudgeSnoozeDays : days));
}
function unquietAllNudges() {
  for (const id of Object.keys(NUDGE_PLAIN).concat(["review"])) PREF.set("nudge.quiet." + id, "");
}
const anyNudgeQuiet = () =>
  Object.keys(NUDGE_PLAIN).concat(["review"]).some(id => nudgeQuiet(id));

function computeNudges() {
  const acts = leafActions();
  const n = [];
  // Below this, a newcomer is being told off about a list they have barely started.
  const quiet = gtdQuiet();
  const push = (id, level, label, count, act) => {
    if (count <= 0) return;
    if (quiet && DEEP_NUDGES.includes(id)) return;
    if (nudgeQuiet(id)) return;
    n.push({id, level, label: isSimple() ? (NUDGE_PLAIN[id] || label) : label, count, act});
  };

  const overdue = acts.filter(a => a.group === "LATE");
  push("late", "danger", "overdue", overdue.length, () => go("agenda"));

  const stuck = stuckActiveProjects();
  push("stuck", "danger", "projects with no next action", stuck.length, () => openReview(0));

  const loose = acts.filter(a => a.group === "JOURNAL");
  push("loose", "warn", "journal actions not tied to a project", loose.length, () => openReview(2));

  const noVerb = acts.filter(a => a.state === "TODO" && a.missingVerb);
  push("verb", "warn", "actions without a physical verb", noVerb.length, () => openReview(3));

  const noCtx = acts.filter(a => a.state === "TODO" && a.missingContext);
  push("ctx", "warn", "actions without a context", noCtx.length, () => openReview(4));

  const oldWait = acts.filter(a => a.state === "WAIT" && (a.age ?? 0) >= CFG.waitFollowUpDays);
  push("wait", "warn", "waiting items to chase", oldWait.length, () => go("next"));

  const noOutcome = projectsWithoutOutcome();
  push("outcome", "warn", "projects with no stated outcome", noOutcome.length,
       () => noOutcome.length && openOutcomePrompt(noOutcome[0]));

  const orphanProjects = unassignedProjects();
  push("area", "", "projects in no area of focus", orphanProjects.length, () => go("horizons"));

  const idleGoals = goalsWithoutProjects();
  push("goal", "", "goals with no project", idleGoals.length, () => go("horizons"));

  const stale = weedingWorthIt()
    ? stalestActiveProjects(99).filter(p => (p.ageDays ?? 0) > CFG.staleProjectDays) : [];
  push("stale", "", "projects older than 6 months", stale.length, () => openWeeding());

  if (reviewDue() && !nudgeQuiet("review")) {
    const last = dateIn(getSetting("last_review"));
    const since = daysSinceReview();
    n.push({
      id: "review", level: since > CFG.reviewEveryDays * 2 ? "danger" : "warn",
      label: last ? `weekly review, ${since} days since last`
                  : `first weekly review is due \u2014 ${since} days in`,
      count: null, act: () => openReview(0),
    });
  }
  if (!n.length) n.push({id: "clean", level: "ok", label: "system is clean — go do the work", count: null, act: null});
  return n;
}

/* The single most useful thing to do right now. */
function nextBestAction() {
  const acts = leafActions();
  const pick = (title, body, cta, act) => ({title, body, cta, act});
  const overdue = acts.filter(a => a.group === "LATE");
  if (overdue.length) return pick("Overdue", `${overdue.length} action(s) are past their date. Renegotiate or do them.`, "Open agenda", () => go("agenda"));
  if (reviewDue())
    return pick("Weekly review is due", "The review is what makes the rest of the system trustworthy.",
                "Start review", () => openReview(0));
  if (!state.context) return pick("Where are you right now?", "Pick a context and GroupTodo surfaces the three oldest actions you can actually do here.", "Pick context", () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx)));
  const stuck = stuckActiveProjects();
  if (stuck.length) return pick("A project has stalled", `${stuck.length} active project(s) have no next action. Define one or park the project.`, "Unstick", () => openReview(0));
  const surf = oldestTodosForContext(state.context);
  if (surf.length) return pick("Oldest in " + state.context, surf[0].title, "Surface all three", () => surfaceContext(state.context));
  if (weedingWorthIt())
    return pick("Nothing is nagging", "Inbox to the journal, or weed the stalest projects.",
                "Weed projects", () => openWeeding());
  return pick("Nothing is nagging", "Nothing is overdue and nothing is stuck. Add what is on your mind, or stop.",
              "Capture something", () => openCapture());
}

/* ============================================================
   85_INLINE_RENDER
   ============================================================ */
function renderInline(text) {
  let h = esc(text || "");
  h = h.replace(/\[\[([^\]]+)\]\]/g, (all, t) => {
    const raw = trim(t.split("][")[0]);
    const target = esc(raw);
    const pfx = (/^([^/]+)\//.exec(raw) || [])[1];
    const known = pfx === "c" || pfx === "z" || pfx === "p" || pfx === "o" || (pfx && STATUS_DIRS[pfx]);
    let label = trim(t.includes("][") ? t.split("][")[1] : (known ? raw.slice(pfx.length + 1) : raw));
    if (pfx === "c") label = "@" + label;
    const cls = pfx === "c" ? " ctx" : pfx === "z" ? " zet" : (pfx && STATUS_DIRS[pfx]) ? " proj" : "";
    return `<span class="wikilink${cls}" data-link="${target}">${esc(label)}</span>`;
  });
  h = h.replace(/(^|\s)#([\p{L}\p{N}_\-/]+)/gu, (all, sp, t) =>
    `${sp}<span class="tag" data-link="${esc(t)}">#${esc(t)}</span>`);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  h = h.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return h;
}

/* ============================================================
   113_QUICK_ADD -- the MS To Do "+ Add a task" row
   ============================================================ */
function quickAdd(targetPath, opts = {}) {
  const input = el("input", {
    placeholder: opts.placeholder || "Add a task",
    onkeydown: e => {
      if (e.key !== "Enter") return;
      const text = trim(input.value);
      if (!text) return;
      input.value = "";
      const page = getPage(targetPath);
      if (!page) return;
      const ctx = opts.context || state.context;
      const blk = stampAuthor(newBlock({
        state: "TODO",
        title: text + (ctx && !hasContextLink(text) ? " [[c/" + ctx + "]]" : ""),
        props: {Added: "[[" + todayISO() + "]]"},
      }));
      page.blocks.push(blk);
      touch(targetPath);
      noteTodoTouched();
      coachMark("add");
      render();
      // keep typing: re-focus the box that replaced this one
      requestAnimationFrame(() => {
        const next = $(".quickadd input");
        if (next) next.focus();
      });
      if (!startsWithVerb(text)) notify("Tip: start with a verb you could film — Call, Draft, Buy.", "warn");
    },
  });
  return el("div", {class: "quickadd"}, el("span", {}, "+"), input);
}

/* ============================================================
   113b_FIRST_RUN COACH
   Three steps that tick themselves off as you do them, in the page rather
   than in front of it. Teaching by doing beats a wall of modals, and it
   disappears for good once the third one is done.
   ============================================================ */
const coachOn = () => PREF.get("coach", "") === "1";
function coachMark(step) {
  if (!coachOn()) return;
  PREF.set("coach." + step, "1");
}
const coachDone = step => PREF.get("coach." + step, "") === "1";

function coachSteps() {
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");
  const steps = [
    {k: "add",  done: coachDone("add"),  label: "Add your first task",
     hint: "type it in the box above and press enter",
     why: "Getting it out of your head and into something you trust is the whole point. " +
          "Nothing else here is worth anything until that part is dull."},
    {k: "tick", done: coachDone("tick"), label: "Tick it off",
     hint: "click the circle on the left",
     why: "One thing crossed off proves the list answers back. A list that never visibly " +
          "moves is one you quietly stop opening."},
  ];
  /* The project step waits until something has actually been added and closed.
     Handing somebody a filing system while their screen is still empty is how
     every other to-do app loses them inside a minute. */
  if (coachDone("add") && coachDone("tick")) {
    steps.push({k: "project", done: projectsIn("1").length > 0, optional: true,
      label: "Give a bigger job a project", cta: "Make one",
      hint: "anything that needs more than one step",
      why: "A task is one move; a project is the handful of moves that finish something, " +
           "with a line saying what done looks like. Keeping them apart is what stops " +
           "\u201cmove house\u201d sitting on the same list as \u201cbuy milk\u201d and making both feel heavy.",
      act: () => newProjectPrompt()});
  }
  steps.push({k: "home", done: onDisk, label: "Give your tasks a home", cta: "Choose",
    hint: onDisk ? "" : "right now they live in this browser only",
    why: "A folder of plain .md files you picked yourself means nothing can hold your work " +
         "hostage \u2014 not this app, not a company, not a browser clearing its storage.",
    act: () => openSpaceStorageSetup()});
  return steps;
}

function coachStrip() {
  if (!coachOn()) return null;
  const steps = coachSteps();
  const needed = steps.filter(st => !st.optional);
  /* Finished when the three that matter are done. The project step is an
     invitation and never a gate -- somebody whose life genuinely is a flat list
     of errands should not be held in onboarding for declining to file them. */
  if (needed.every(st => st.done)) { PREF.set("coach", "0"); return null; }

  const box = el("div", {class: "coach"});
  box.append(el("div", {class: "coach-head"},
    el("b", {}, "Getting started"),
    el("span", {style: "color:var(--fg3);font-size:12px"},
      needed.filter(st => st.done).length + " of " + needed.length),
    el("button", {class: "iconbtn", title: "Hide this for good",
      onclick: () => { PREF.set("coach", "0"); render(); }}, "\u2715")));
  // Only the step you are actually on explains itself. Three reasons at once is
  // a leaflet, and nobody reads the leaflet.
  const current = steps.find(st => !st.done);
  for (const st of steps) {
    box.append(el("div", {class: "coach-step" + (st.done ? " done" : "")},
      el("span", {class: "coach-dot"}, st.done ? "\u2713" : ""),
      el("div", {},
        el("div", {}, st.label,
          st.optional ? el("span", {class: "chip", style: "margin-left:6px"}, "optional") : null),
        st.hint ? el("div", {style: "color:var(--fg3);font-size:12px"}, st.hint) : null,
        (st === current && st.why) ? el("div", {class: "coach-why"}, st.why) : null),
      (!st.done && st.act) ? el("button", {class: "btn sm ghost", style: "margin-left:auto",
        onclick: st.act}, st.cta || "Choose") : null));
  }
  return box;
}

/* ============================================================
   113c_SUGGESTIONS
   One card at a time, only once the list itself has earned it, and every one of
   them dismissible for good. These are the things a person standing behind you
   would say -- "that is a lot of tasks, want to thin them out?" -- rather than
   anything the method demands. Simple mode only: the advanced door is for people
   who came here already knowing how they want to work.
   ============================================================ */
const tipOff = id => PREF.get("tip.off." + id, "") === "1";
function tipQuiet(id) {
  const until = PREF.get("tip.quiet." + id, "");
  return !!until && todayISO() < until;
}

function tipList() {
  const open = leafActions().filter(a => OPEN_STATES[a.state]);
  const projects = projectsIn("1");
  const perProject = new Map();
  for (const a of open) {
    if (!a.projectPath) continue;
    perProject.set(a.projectPath, (perProject.get(a.projectPath) || 0) + 1);
  }
  let fattest = null;
  for (const [path, n] of perProject) if (!fattest || n > fattest.n) fattest = {path, n};
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");

  return [
    {
      id: "project",
      live: open.length >= CFG.tipMinTasks && !projects.length,
      title: "Some of these belong together",
      body: open.length + " open tasks and no project yet. A project is just a page holding " +
            "the steps for one job, with a line saying what done looks like.",
      why: "Your head keeps bringing back anything unfinished that has no agreed next step. " +
           "Writing the steps down once, somewhere you will actually look again, is what stops " +
           "the reminding \u2014 and it is the single habit the rest of this hangs on.",
      cta: "Make a project", act: () => newProjectPrompt(),
    },
    {
      // Only when weeding has something to rank. Offering to weed five projects
      // and then opening a screen that says there is nothing to weed is worse
      // than saying nothing at all.
      id: "weed",
      live: open.length >= CFG.busyTasks && weedingWorthIt(),
      title: "That is a lot on the list",
      body: open.length + " open tasks across " + projects.length + " active project" +
            (projects.length === 1 ? "" : "s") + ". Weeding takes the stalest few and asks one " +
            "question of each: is this still real? Five minutes, and nothing goes without you.",
      why: "A list long enough to read as a wall stops being a tool and becomes a thing to " +
           "avoid. Making it shorter is usually worth more than working harder down it.",
      cta: "Weed the stalest", act: () => openWeeding(),
    },
    {
      // The same pile, but flat: plenty of tasks and barely any projects, so
      // there is nothing to rank and the useful move is grouping, not pruning.
      id: "pile",
      live: open.length >= CFG.busyTasks && !weedingWorthIt(),
      title: "That is a lot on one pile",
      body: open.length + " open tasks, " + open.filter(a => a.group === "JOURNAL").length +
            " of them sitting loose in your days rather than under anything. Going through " +
            "them once and grouping the ones that belong together is usually an hour you " +
            "get back later.",
      why: "A flat list has no shape, so every time you look for the next thing you pay for " +
           "the whole list. Grouping is not filing for its own sake \u2014 it is what lets you " +
           "look at a tenth of it and still be sure.",
      cta: "Sort the loose ones", act: () => openReview(2),
    },
    {
      id: "split",
      live: !!fattest && fattest.n >= CFG.busyProjectTodos,
      title: fattest ? pageTitle(fattest.path) + " is carrying " + fattest.n + " tasks" : "",
      body: "That is usually two or three jobs wearing one name. Split it and each half gets a " +
            "finish line it can actually reach.",
      why: "A project that never empties reads as a chore list with your name on it. Two that " +
           "can be finished give you somewhere to stop.",
      cta: "Open it", act: () => fattest && openPage(fattest.path),
    },
    {
      id: "name",
      live: onDisk && !whoAmI(),
      title: "Put your name on your changes",
      body: "This space lives somewhere another person can open. With a name set, what you add " +
            "is stamped by:: you and what you close done_by:: you.",
      why: "In a shared list, unsigned work slides into being nobody's work: two people redo the " +
           "same thing, and neither can tell who already asked.",
      cta: "Set a name",
      act: () => promptInput({
        title: "Your name", value: whoAmI(), cta: "Save",
        label: "Shown beside what you add in " + (Spaces.active || "this space"),
        onSave: n => {
          setIdentity(n, Spaces.active);
          notify("Changes here will be signed " + trim(n) + ".");
          render();
        },
      }),
    },
  ];
}

function tipCard() {
  if (coachOn()) return null;             // one teacher at a time
  const tip = tipList().find(t => t.live && !tipOff(t.id) && !tipQuiet(t.id));
  if (!tip) return null;
  const box = el("div", {class: "coach tip"});
  box.append(el("div", {class: "coach-head"},
    el("b", {}, tip.title),
    el("button", {class: "iconbtn", title: "Do not suggest this again",
      onclick: () => { PREF.set("tip.off." + tip.id, "1"); render(); }}, "\u2715")));
  box.append(el("div", {style: "font-size:13.5px;color:var(--fg2);line-height:1.55"}, tip.body));
  box.append(el("div", {class: "coach-why"}, tip.why));
  box.append(el("div", {style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"},
    el("button", {class: "btn sm primary", onclick: tip.act}, tip.cta),
    el("button", {class: "btn sm ghost", onclick: () => {
      PREF.set("tip.quiet." + tip.id, shiftISO(todayISO(), CFG.tipSnoozeDays));
      render();
    }}, "not now")));
  return box;
}

/* ============================================================
   143_HORIZONS_WIZARD
   Runs on the first visit to Horizons. Climbs from the most concrete
   altitude to the most abstract, which is the order people can actually
   answer in -- Allen's own advice is to implement bottom-up even though
   you review top-down. Every step is skippable and nothing is written
   until the last one.
   ============================================================ */
const AREA_EXAMPLES = [
  "Health", "Finances", "Family", "Home", "Career", "Team",
  "Clients", "Learning", "Friendships", "Admin",
];

const WIZ = {step: 0, areas: "", goals: "", vision: "", purpose: ""};

function wizField(key, placeholder, rows = 6) {
  const ta = el("textarea", {placeholder, style: "min-height:" + (rows * 22) + "px"});
  ta.value = WIZ[key];
  ta.addEventListener("input", () => { WIZ[key] = ta.value; });
  return ta;
}

function wizChips(key, options) {
  const box = el("div", {class: "seg", style: "margin-top:8px"});
  for (const o of options) {
    box.append(el("button", {
      onclick: e => {
        const lines = WIZ[key].split("\n").map(trim).filter(Boolean);
        const i = lines.indexOf(o);
        if (i >= 0) lines.splice(i, 1); else lines.push(o);
        WIZ[key] = lines.join("\n");
        e.target.classList.toggle("on");
        const ta = $(".modal textarea");
        if (ta) ta.value = WIZ[key];
      },
      class: WIZ[key].split("\n").map(trim).includes(o) ? "on" : "",
    }, o));
  }
  return box;
}

const WIZ_STEPS = [
  {
    title: "Horizons of focus",
    render: () => el("div", {class: "field"},
      el("label", {}, "Six altitudes"),
      el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.75"},
        "Todo apps live on the runway. GTD says the runway only makes sense if you " +
        "can see what it serves. This takes a few minutes and you can skip any step."),
      el("div", {style: "font-family:var(--mono);font-size:12px;line-height:2;color:var(--fg3);margin-top:10px"},
        HORIZONS.map(h => el("div", {},
          el("span", {style: "color:var(--accent)"}, h.alt.padEnd(11)),
          h.h + " · " + h.name)))),
    cta: "Start",
  },
  {
    key: "areas",
    title: "Horizon 2 · Areas of focus",
    render: () => el("div", {class: "field"},
      el("label", {}, "Which parts of your life and work must stay healthy?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "These never get finished — you just keep them in good shape. Most people " +
        "land on somewhere between four and twelve. One per line, in your own words."),
      wizField("areas", "Health\nFinances\nTeam\nHome"),
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:8px"}, "Tap any that fit:"),
      wizChips("areas", AREA_EXAMPLES)),
  },
  {
    key: "goals",
    title: "Horizon 3 · Goals & objectives",
    render: () => el("div", {class: "field"},
      el("label", {}, "What do you want to be true in one to two years?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "Concrete enough to know when you got there. One per line. You can hang each " +
        "one under an area afterwards."),
      wizField("goals", "Debt cleared\nShipped the new product\nRunning a half marathon")),
  },
  {
    key: "vision",
    title: "Horizon 4 · Vision",
    render: () => el("div", {class: "field"},
      el("label", {}, "Three to five years out, what does wild success look like?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "Prose is fine. Write it in the present tense, as though you are already there."),
      wizField("vision", "The work funds the life, not the other way round...")),
  },
  {
    key: "purpose",
    title: "Horizon 5 · Purpose & principles",
    render: () => el("div", {class: "field"},
      el("label", {}, "Why are you doing any of this, and what will you not trade away?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "Purpose is the why. Principles are the standards that hold even when it costs you."),
      wizField("purpose", "I am here to...\nI will not...")),
  },
];

function applyWizard() {
  const lines = v => v.split("\n").map(trim).filter(Boolean);
  const areas = lines(WIZ.areas);
  const goals = lines(WIZ.goals);
  for (const a of areas) createArea(a);
  for (const g of goals) createGoal(g);
  if (trim(WIZ.vision))  setHorizon("vision",  lines(WIZ.vision));
  if (trim(WIZ.purpose)) setHorizon("purpose", lines(WIZ.purpose));
  setSetting("horizons_done", todayISO());
  const made = [];
  if (areas.length) made.push(areas.length + " areas");
  if (goals.length) made.push(goals.length + " goals");
  if (trim(WIZ.vision)) made.push("a vision");
  if (trim(WIZ.purpose)) made.push("a purpose");
  notify(made.length ? "Created " + made.join(", ") + "." : "Nothing created — run it again any time.");
  render();
}

function openHorizonsWizard(step = 0) {
  setSetting("horizons_seen", todayISO());
  WIZ.step = Math.max(0, Math.min(step, WIZ_STEPS.length));
  if (WIZ.step === WIZ_STEPS.length) { closeModal(); applyWizard(); return; }
  const s = WIZ_STEPS[WIZ.step];
  const last = WIZ.step === WIZ_STEPS.length - 1;
  modal({
    center: true,
    title: s.title,
    hint: WIZ.step ? "step " + WIZ.step + " of " + (WIZ_STEPS.length - 1) : "",
    body: s.render(),
    foot: [
      WIZ.step > 0 ? el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(WIZ.step - 1)}, "Back") : null,
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: () => { closeModal(); setSetting("horizons_seen", todayISO()); }}, "Later"),
      s.key ? el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(WIZ.step + 1)}, "Skip") : null,
      el("button", {class: "btn primary", onclick: () => openHorizonsWizard(WIZ.step + 1)},
        s.cta || (last ? "Finish" : "Next")),
    ],
  });
}

/* ============================================================
   144_CONTEXTS_WIZARD
   Same principle: your contexts, not mine. Examples are offered as
   suggestions you tap, never written behind your back.
   ============================================================ */
const CONTEXT_EXAMPLES = [
  "phone", "computer", "errand", "home", "office", "anywhere",
  "deep-work", "waiting", "agenda", "offline",
];
const CTXWIZ = {picked: ""};

function openContextsWizard(onDone) {
  CTXWIZ.picked = "";
  const ta = el("textarea", {placeholder: "phone\ncomputer\nerrand", style: "min-height:110px"});
  ta.addEventListener("input", () => { CTXWIZ.picked = ta.value; });
  const chips = el("div", {class: "seg", style: "margin-top:8px"});
  for (const o of CONTEXT_EXAMPLES) {
    chips.append(el("button", {
      onclick: e => {
        const lines = CTXWIZ.picked.split("\n").map(trim).filter(Boolean);
        const i = lines.indexOf(o);
        if (i >= 0) lines.splice(i, 1); else lines.push(o);
        CTXWIZ.picked = lines.join("\n");
        ta.value = CTXWIZ.picked;
        e.target.classList.toggle("on");
      },
    }, "@" + o));
  }
  modal({
    center: true, title: "Set up your contexts",
    body: el("div", {class: "field"},
      el("label", {}, "Where, or with what, can work actually happen?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "A context is the thing an action needs: a phone in your hand, a shop you are " +
        "standing in, two uninterrupted hours. Picking one is what lets GroupTodo show " +
        "the three oldest things you could do right now. Yours should match your real life — " +
        "these are only suggestions."),
      ta, chips),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Later"),
      el("button", {class: "btn primary", onclick: () => {
        const names = CTXWIZ.picked.split("\n").map(trim).filter(Boolean);
        closeModal();
        for (const n of names) {
          const clean = slugify(n.replace(/^@/, ""));
          const p = join(DIRS.contexts, clean + ".md");
          if (!V.pages.has(p)) putPage(p, pageTemplateFor("c", clean));
        }
        setSetting("contexts_done", todayISO());
        notify(names.length ? "Created " + names.length + " contexts." : "No contexts created.");
        render();
        if (onDone && names.length) onDone(slugify(names[0].replace(/^@/, "")));
      }}, "Create"),
    ],
  });
}
