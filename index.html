/* ============================================================
   149b_SPACE_ATTRIBUTION SWITCH
   Some spaces should not record who did what at all -- and that has to hold
   for everyone sharing them, so it lives in the space's own settings rather
   than on one device.
   ============================================================ */
const attributionOff = () => trim(getSetting("no_attribution") || "") === "true";

/* The name to stamp with: empty when the space says not to. */
const stampName = () => (attributionOff() ? "" : whoAmI());

function countStamps() {
  let n = 0;
  for (const [, page] of V.pages) {
    if (page.props && page.props.updated_by) n++;
    walkBlocks(page.blocks, b => { if (b.props && (b.props.by || b.props.done_by)) n++; });
  }
  return n;
}

function clearExistingStamps() {
  let n = 0;
  for (const [path, page] of V.pages) {
    let hit = false;
    if (page.props && page.props.updated_by) { delete page.props.updated_by; hit = true; n++; }
    walkBlocks(page.blocks, b => {
      if (!b.props) return;
      if (b.props.by)      { delete b.props.by; hit = true; n++; }
      if (b.props.done_by) { delete b.props.done_by; hit = true; n++; }
    });
    if (hit) touch(path);
  }
  notify(n ? "Removed " + n + " attribution stamp(s) from " + Spaces.active + "."
           : "No stamps to remove.");
  render();
  return n;
}

/* ============================================================
   150_VAULT DIALOG -- connect a folder, a server, or export markdown
   ============================================================ */
/* ============================================================
   148_SERVERLESS_SYNC
   Multi-device sync with no server and no account: the whole vault travels
   as ONE markdown file that you keep in iCloud Drive, OneDrive, Dropbox,
   Google Drive, Syncthing -- whatever already syncs on your devices.

   Each page carries updated:: so a merge can pick the newer side per page
   instead of overwriting the vault wholesale. Deletes travel as tombstones.
   A page edited on both sides since the last sync is never silently lost:
   the loser is kept beside it as a conflict copy.

   Desktop Chrome/Edge can link the file once and re-sync with one click.
   Everywhere else -- iOS Safari included -- the same file round-trips
   through the ordinary Save / Open dialogs, which every browser has.
   ============================================================ */

/* One file per space, so exporting Work never lands on top of Private's file
   in the same synced folder. */
const bundleName = () => "grouptodo-" +
  String(Spaces.active || "vault").toLowerCase().replace(/[^\w-]+/g, "-") + ".md";

/* ---------- tombstones (deletes that survive a merge) ---------- */
function tombstones() {
  const raw = getSetting("deleted") || "";
  const out = new Map();
  for (const part of raw.split(";")) {
    const [p, t] = part.split("@");
    if (p && t) out.set(trim(p), trim(t));
  }
  return out;
}
function writeTombstones(map) {
  const parts = Array.from(map.entries()).map(([p, t]) => p + "@" + t);
  settingsPage().props.deleted = parts.join(";");
  V.dirty.add(SETTINGS_PATH);
  scheduleFlush();
}
function addTombstone(path) {
  if (path === SETTINGS_PATH) return;
  const t = tombstones();
  t.set(path, nowStamp());
  writeTombstones(t);
}

/* ---------- bundle format ---------- */
function bundleMarkdown() {
  const out = [
    "<!-- GroupTodo vault bundle. Plain markdown: every page is fenced below,",
    "     and you can edit it in any text editor. Keep this file in a folder",
    "     your devices already sync. -->",
    "<!-- gtd:bundle v1 " + nowStamp() + " -->",
    "",
  ];
  for (const path of Array.from(V.pages.keys()).sort()) {
    out.push("<!-- gtd:file " + path + " -->");
    out.push(serializePage(getPage(path)).replace(/\n$/, ""));
    out.push("<!-- gtd:endfile -->", "");
  }
  return out.join("\n");
}

function parseBundle(text) {
  const files = new Map();
  const re = /<!--\s*gtd:file\s+(.+?)\s*-->\n([\s\S]*?)\n?<!--\s*gtd:endfile\s*-->/g;
  let m;
  while ((m = re.exec(text))) files.set(trim(m[1]), m[2]);
  return files;
}

/* ---------- the merge ---------- */
function conflictPath(path) {
  const stamp = todayISO() + "-" + String(Date.now()).slice(-4);
  return path.replace(/\.md$/i, "") + " (conflict " + stamp + ").md";
}

/* Settings must union rather than overwrite, or each sync would drop the
   other device's tombstones and we would resurrect deleted pages. */
function mergeSettings(incoming) {
  const mine = tombstones();
  const theirs = new Map();
  for (const part of (incoming.props?.deleted || "").split(";")) {
    const [p, t] = part.split("@");
    if (p && t) theirs.set(trim(p), trim(t));
  }
  for (const [p, t] of theirs) if (!mine.has(p) || mine.get(p) < t) mine.set(p, t);
  const local = settingsPage();
  for (const [k, v] of Object.entries(incoming.props || {})) {
    if (k === "deleted" || k === "updated") continue;
    if ((incoming.props.updated || "") > (local.props.updated || "")) local.props[k] = v;
  }
  writeTombstones(mine);
}

/* ---------- block-level merge ----------
   Whole-page last-write-wins loses work: two devices appending to the same
   day's journal is the normal case, not an edge case. So when a page changed
   on BOTH sides since the last sync, merge its blocks instead of picking a
   winner. Blocks are matched on their text, so an append on either side
   survives and a checked-off task propagates. */
const blockSig = b => trim(b.title || "").toLowerCase();

function mergeBlockLists(local, incoming, preferIncoming) {
  const pool = new Map();
  for (const b of incoming) {
    const k = blockSig(b);
    if (!pool.has(k)) pool.set(k, []);
    pool.get(k).push(b);
  }
  const taken = new Set();
  const out = [];
  for (const lb of local) {
    const bucket = pool.get(blockSig(lb));
    const ib = bucket && bucket.length ? bucket.shift() : null;
    if (!ib) { out.push(lb); continue; }
    taken.add(ib);
    const winner = preferIncoming ? ib : lb;
    const loser  = preferIncoming ? lb : ib;
    winner.props = Object.assign({}, loser.props || {}, winner.props || {});
    winner.children = mergeBlockLists(lb.children || [], ib.children || [], preferIncoming);
    out.push(winner);
  }
  for (const ib of incoming) if (!taken.has(ib)) out.push(ib);
  return out;
}

function mergePageContents(local, incoming, preferIncoming) {
  const props = preferIncoming
    ? Object.assign({}, local.props || {}, incoming.props || {})
    : Object.assign({}, incoming.props || {}, local.props || {});
  return {props, blocks: mergeBlockLists(local.blocks || [], incoming.blocks || [], preferIncoming)};
}

function mergeBundle(files) {
  const lastSync = getSetting("last_sync") || "";
  const tomb = tombstones();
  const report = {added: 0, updated: 0, merged: 0, kept: 0, conflicts: 0, deleted: 0};

  for (const [path, text] of files) {
    const incoming = parsePage(text);

    if (path === SETTINGS_PATH) { mergeSettings(incoming); continue; }

    // A delete on this device beats an older copy arriving from the other one.
    const tombAt = tomb.get(path);
    if (tombAt && tombAt >= (incoming.props?.updated || "")) { report.deleted++; continue; }

    const local = V.pages.get(path);
    if (!local) { putPage(path, incoming); report.added++; continue; }

    const li = local.props?.updated || "";
    const ii = incoming.props?.updated || "";
    const localChanged    = !lastSync || li > lastSync;
    const incomingChanged = !lastSync || ii > lastSync;

    if (ii <= li && !incomingChanged) { report.kept++; continue; }

    if (localChanged && incomingChanged && serializePage(local) !== serializePage(incoming)) {
      putPage(path, mergePageContents(local, incoming, ii > li));
      report.merged++;
    } else if (ii > li) {
      putPage(path, incoming);
      report.updated++;
    } else {
      report.kept++;
    }
  }

  // Tombstones from the other device remove pages still present here.
  for (const [path, at] of tombstones()) {
    const local = V.pages.get(path);
    if (local && (local.props?.updated || "") <= at) {
      V.pages.delete(path);
      V.dirty.delete(path);
      V.removed.add(path);
      report.deleted++;
    }
  }

  setSetting("last_sync", nowStamp());
  scanVerbs();
  return report;
}

function syncSummary(r) {
  const bits = [];
  if (r.added)     bits.push(r.added + " new");
  if (r.updated)   bits.push(r.updated + " updated");
  if (r.merged)    bits.push(r.merged + " merged");
  if (r.deleted)   bits.push(r.deleted + " removed");
  if (r.conflicts) bits.push(r.conflicts + " conflict copies kept");
  if (!bits.length) return "Already up to date.";
  return "Synced: " + bits.join(", ") + ".";
}

/* ---------- moving the bundle in and out ---------- */
async function saveBundleAsDownload() {
  const name = bundleName();
  const how = await sendMarkdownOut(name, bundleMarkdown(),
    {title: (Spaces.active || "GroupTodo") + " vault"});
  if (how === "cancelled") return;
  setSetting("last_sync", nowStamp());
  notify(how === "shared"
    ? "Sent " + name + ". Dropping it in a synced folder is what keeps your devices together."
    : "Saved " + name + ". Put it in a folder you share with the right people.");
}

function openBundleFromFile(onDone) {
  const input = el("input", {
    type: "file", accept: ".md,.markdown,text/markdown,text/plain", style: "display:none",
    onchange: async e => {
      const f = e.target.files[0];
      if (!f) return;
      const text = await f.text();
      const files = parseBundle(text);
      if (!files.size) { notify("That file has no GroupTodo pages in it.", "error"); return; }
      const report = mergeBundle(files);
      notify(syncSummary(report));
      render();
      if (onDone) onDone(report);
      input.remove();
    },
  });
  document.body.append(input);
  input.click();
}

/* ---------- linked vault file (desktop one-click) ---------- */
let LINKED = null;             // FileSystemFileHandle

async function linkedHandle() {
  if (LINKED) return LINKED;
  try {
    const h = await IDB.get("kv", "bundle:" + Spaces.active);
    if (h && (await h.queryPermission({mode: "readwrite"})) === "granted") return (LINKED = h);
  } catch (_) {}
  return null;
}

async function linkVaultFile() {
  if (!CAP.savePicker) { notify("This browser cannot link a file. Use Save / Open instead.", "warn"); return; }
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: bundleName(),
      types: [{description: "Markdown", accept: {"text/markdown": [".md"]}}],
    });
    LINKED = h;
    await IDB.set("kv", "bundle:" + Spaces.active, h).catch(() => {});
    await syncLinked();
  } catch (e) {
    if (e.name !== "AbortError") notify("Could not link file: " + e.message, "error");
  }
}

/* Read the file, merge what is new, write the merged vault back. */
async function syncLinked({quiet = false} = {}) {
  const h = await linkedHandle();
  if (!h) { if (!quiet) notify("No linked vault file yet.", "warn"); return; }
  try {
    if ((await h.queryPermission({mode: "readwrite"})) !== "granted") {
      if (quiet) return;                 // asking needs a click; wait for one
      if ((await h.requestPermission({mode: "readwrite"})) !== "granted") {
        notify("Permission to the vault file was declined.", "warn");
        return;
      }
    }
    setSync("sync", "syncing...");
    const existing = await (await h.getFile()).text().catch(() => "");
    const incoming = parseBundle(existing);
    const report = incoming.size ? mergeBundle(incoming)
                                 : {added: 0, updated: 0, merged: 0, kept: 0, conflicts: 0, deleted: 0};
    await flush();
    const w = await h.createWritable();
    await w.write(bundleMarkdown());
    await w.close();
    setSetting("last_sync", nowStamp());
    setSync("ok", V.backend ? V.backend.label : "synced");
    const changed = report.added + report.updated + report.merged + report.deleted;
    if (!quiet) notify(syncSummary(report) + " Vault file written.");
    else if (changed) notify(syncSummary(report));     // silent unless it brought something in
    render();
  } catch (e) {
    setSync("err", "sync failed");
    if (!quiet) notify("Sync failed: " + e.message, "error");
  }
}

/* ---------- keeping the linked file current without being asked ----------
   The two-device loop is only as good as the moment you remember to press
   Sync, and the press is the part people forget. On a desktop the file handle
   survives restarts, so it can be dropped: merge when the space opens, merge
   when you come back to the tab, and write back once you have stopped typing.

   Three rules keep it from being a nuisance: only when permission is already
   granted -- asking for it needs a click -- never over an edit in progress,
   and quiet unless it actually brought something in from the other device. */
let AUTOSYNC_AT = 0;
let AUTOSYNC_TIMER = null;
const autoSyncOn = () => PREF.get("autosync", "1") === "1";

/* True only when there is real work in progress to protect. The quickadd box
   holds focus for most of a session, so treating any focused field as an edit
   blocked nearly every background sync; what matters is whether anything has
   been typed into it. */
function busyEditing() {
  if (document.querySelector(".modal")) return true;
  const a = document.activeElement;
  if (!a) return false;
  if (a.isContentEditable) return true;
  if (a.tagName === "INPUT" || a.tagName === "TEXTAREA") return !!trim(a.value || "");
  return false;
}

async function autoSyncLinked() {
  if (!autoSyncOn() || !CAP.savePicker) return;   // no durable handle, nothing to sync
  if (busyEditing()) return;
  if (Date.now() - AUTOSYNC_AT < 20000) return;        // never hammer the disk
  let h = null;
  try { h = await linkedHandle(); } catch (_) {}
  if (!h) return;
  try { if ((await h.queryPermission({mode: "readwrite"})) !== "granted") return; }
  catch (_) { return; }
  AUTOSYNC_AT = Date.now();
  await syncLinked({quiet: true});
}

/* Called from touch(): write back a little after the typing stops. */
function scheduleAutoSync() {
  if (!autoSyncOn() || !CAP.savePicker) return;
  clearTimeout(AUTOSYNC_TIMER);
  AUTOSYNC_TIMER = setTimeout(() => autoSyncLinked(), 45000);
}

/* ---------- a server space is shared, so it has to be re-read ----------
   Two devices on one serve.py write to the same vault, but nothing told either
   of them to look again, so each sat on the copy it loaded and the other's work
   only turned up after a reload. Coming back to the app is the moment to check.

   Order matters: send ours up first, and only re-read if that succeeded. The
   server is then authoritative for everything, deletions included, so a plain
   re-read is safe. If the send failed the server is behind us, and overwriting
   our pages with its older ones would be the one unforgivable move -- so we
   leave well alone and try again next time. */
let SERVER_READ_AT = 0;

async function refreshFromServer() {
  const rec = LOADED.get(Spaces.active);
  if (!rec || !rec.backend || rec.backend.kind !== "http") return;
  if (busyEditing() || V.syncing) return;
  if (Date.now() - SERVER_READ_AT < 10000) return;
  SERVER_READ_AT = Date.now();

  if (rec.dirty.size || rec.removed.size) {
    await flush();
    if (V.error) return;                        // server unreachable; keep ours
  }
  try {
    const before = pageSignature(rec);
    await readInto(rec);
    bindActive(rec.name);
    if (pageSignature(rec) !== before) {
      scanVerbs();
      ensureJournal(todayISO());
      render();
      notify("Updated from " + rec.backend.label + ".");
    }
  } catch (_) {
    setSync("warn", "offline");                 // nothing lost: ours is intact
  }
}

/* Cheap "did anything change" check, so a quiet re-read stays quiet. */
function pageSignature(rec) {
  const parts = [];
  for (const path of Array.from(rec.pages.keys()).sort())
    parts.push(path + "@" + (rec.pages.get(path).props?.updated || ""));
  return parts.join("|");
}

function installAutoSync() {
  const onReturn = () => { autoSyncLinked(); refreshFromServer(); };
  window.addEventListener("focus", onReturn);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) onReturn();
  });
}

/* Folders and servers belong to ONE space, which is what keeps Work out of
   Private: each space writes to its own place, chosen separately. */
async function connectFolder() {
  if (!window.showDirectoryPicker) {
    notify("This browser has no folder access. Use a vault file or the sync server instead.", "warn");
    return;
  }
  closeModal();
  await assignSpaceFolder(Spaces.active);
}

async function connectServer(base) {
  const sp = Spaces.get(Spaces.active);
  const taken = Spaces.list.find(x => x.name !== Spaces.active && x.kind === "http" && x.server === trim(base));
  if (taken) {
    notify(`That server already holds ${taken.name}. Give ${sp.name} its own.`, "error");
    return;
  }
  try {
    const b = Backends.http(base);
    await loadFromBackend(b);
    sp.kind = "http"; sp.server = base; delete sp.legacyFlat; delete sp.placeholder;
    await Spaces.save();
    await seedIfEmpty();
    scanVerbs(); closeModal(); render();
    notify(sp.name + " synced with " + b.label);
  } catch (e) {
    notify("Server not reachable: " + e.message, "error");
  }
}

/* One screen, then the app. Everything else -- spaces, folders, horizons,
   contexts -- arrives when it is actually needed. A colleague who just wants a
   todo list should be typing one within seconds of opening the file. */
function openOnboarding() {
  /* The only thing asked for up front, and it is optional. A name is what makes a
     list legible to anybody you later share it with, and asking at the start costs
     one field -- asking on the day two people collide costs the collision. There is
     deliberately nothing else to register: no account, no email and no password,
     because there is nowhere for them to be sent. */
  const nameInput = el("input", {placeholder: "Kenneth", value: whoAmI(), maxlength: "60"});
  const keepName = () => setIdentity(nameInput.value);   // blank is a real answer
  const begin = (mode, after) => {
    keepName();
    PREF.set("onboarded", todayISO());
    PREF.set("mode", mode);
    PREF.set("coach", "1");
    for (const sp of Spaces.list) sp.askedStorage = true;   // asked later, in context
    Spaces.save();
    closeModal();
    setMode(mode);
    if (after) after();
    else requestAnimationFrame(() => { const i = $(".quickadd input"); if (i) i.focus(); });
  };

  modal({
    center: true, title: "GroupTodo",
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.55"},
          "A to-do list that is really just plain text files you own. " +
          "Nothing to sign up for, nothing leaves this device.")),
      el("div", {class: "field"},
        el("label", {}, "Your name, if you like"),
        nameInput,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px;line-height:1.5"},
          "Goes beside what you add, so a list you share later can show who did what. " +
          "Leave it empty and nothing is signed \u2014 there is no account and no password " +
          "either way.")),
      el("button", {class: "pick", onclick: () => begin("simple")},
        el("span", {class: "k"}, "\u2713"),
        el("span", {}, el("b", {}, "Start a new list"), el("br"),
          el("span", {style: "color:var(--fg3);font-size:12.5px"},
            "Straight in. Add your first task."))),
      el("button", {class: "pick", onclick: () => { keepName(); closeModal(); openReceiveVault(); }},
        el("span", {class: "k"}, "\u2193"),
        el("span", {}, el("b", {}, "Open one I was sent"), el("br"),
          el("span", {style: "color:var(--fg3);font-size:12.5px"},
            "A shared folder, or a vault file from a colleague.")))),
    foot: [
      el("button", {class: "btn ghost", onclick: () => begin("advanced", () => openSpacesWizard())},
        "I use Logseq or org-mode"),
    ],
    // The name box can hold the focus, so plain keys have to belong to it first --
    // otherwise typing a name called Kenneth 1 would pick a door.
    onKey: e => {
      if (e.key === "Enter") { begin("simple"); return true; }
      const field = n => /^(INPUT|TEXTAREA)$/.test(n || "");
      if (field(e.target.tagName) || field(document.activeElement?.tagName)) return false;
      if (e.key === "1") { begin("simple"); return true; }
      if (e.key === "2") { keepName(); closeModal(); openReceiveVault(); return true; }
      return false;
    },
  });
}

        el("label", {}, "Attribution in " + (Spaces.active || "this space")),
        (() => {
          const off = attributionOff();
          const box = el("button", {class: "spacetoggle" + (off ? " on" : ""),
            onclick: () => {
              setSetting("no_attribution", off ? "" : "true");
              notify(off ? "Changes in " + Spaces.active + " will be signed again."
                         : "Nothing in " + Spaces.active + " will record who did what.");
              closeModal(); render(); openVaultDialog();
            }}, off ? "\u2713" : "");
          return el("div", {},
            el("div", {style: "display:flex;gap:10px;align-items:flex-start"},
              box,
              el("div", {},
                el("div", {}, "Do not record who did what in this space"),
                el("div", {style: "color:var(--fg3);font-size:12px"},
                  "No by::, done_by:: or updated_by:: is written here, whatever name you set. " +
                  "Stored in the space's own settings, so it holds for everyone sharing it."))),
            off && countStamps() ? el("button", {class: "btn sm ghost", style: "margin-top:8px",
              onclick: () => {
                if (!confirm("Remove " + countStamps() + " existing attribution stamp(s) from " +
                             Spaces.active + "? This rewrites those files and cannot be undone."))
                  return;
                clearExistingStamps(); closeModal(); openVaultDialog();
              }}, "Also remove the " + countStamps() + " stamps already here") : null);
        })()),

      el("div", {class: "field"},
        el("label", {}, "Colour of " + (Spaces.active || "this space")),
        (() => {
          // Applied as you pick: this dialog has no save button of its own.
          const name = Spaces.active;
          const preview = colorPreview(name || "Space", spaceColor(name));
          const picker = colorPicker(spaceColor(name), async c => {
            preview.paint(c);
            if (await Spaces.setColor(name, c)) renderNav();
          });
          return el("div", {}, picker, preview.node,
            el("div", {style: "color:var(--fg3);font-size:12px;margin-top:10px"},
              "Used for this space in the sidebar and on the badge its rows carry when it " +
              "shares the screen with another space. Stored on this device, next to the list " +
              "of spaces \u2014 not in the files, so sharing the space keeps your colours yours."));
        })()),

      el("div", {class: "field"},
        el("label", {}, "Your timezone"),
        (() => {
          const sel = el("select", {});
          let zones = [];
          try { zones = Intl.supportedValuesOf("timeZone") || []; } catch (_) {}
          if (!zones.length) {
            zones = ["UTC", "Europe/Oslo", "Europe/London", "Europe/Berlin", "America/New_York",
                     "America/Los_Angeles", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney"];
          }
          let detected = "UTC";
          try { detected = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (_) {}
          if (!zones.includes(detected)) zones.unshift(detected);
          sel.append(el("option", {value: ""}, "Use this device (" + detected + ")"));
          for (const z of zones) sel.append(el("option", {value: z}, z));
          sel.value = PREF.get("timezone", "") || "";
          sel.addEventListener("change", () => {
            PREF.set("timezone", sel.value);
            notify("Times shown in " + (sel.value || detected) + ". Files stay in UTC.");
            render();

        })(),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Timestamps are written to the files in UTC so colleagues in different offices " +
          "compare cleanly. This only changes what you see \u2014 including which day counts " +
          "as today. Set on this device, for you.")),

      el("div", {class: "field"},
        el("label", {}, "Import"),
        el("div", {style: "display:flex;gap:8px;flex-wrap:wrap"},
          el("button", {class: "btn ghost", onclick: () => fileInput.click()}, "Import .md / .org files"),
          V.raw.size ? el("button", {class: "btn ghost", onclick: () => { importOrgFiles(); closeModal(); }},
            "Convert " + V.raw.size + " .org files") : null),
        fileInput)),
    foot: [
      el("button", {class: "btn ghost", onclick: () => { closeModal(); openShareSpace(); }}, "Share this space"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: closeModal}, "Close"),
    ],
  });
}

async function seedIfEmpty() {
  if (V.pages.size > 0) return;

  for (const [lang, verbs] of Object.entries(SEED_VERBS)) {
    for (const [canonical, syns] of Object.entries(verbs)) {
      putPage(join(DIRS.verbs, lang, canonical + ".md"), {
        props: {title: canonical, type: "verb", lang},
        blocks: [
          newBlock({title: canonical + " = " + canonical}),
          ...syns.map(s => newBlock({title: s + " = " + canonical})),
        ],
      });
    }
  }
  putPage(join(DIRS.templates, "journals.md"), {
    props: {title: "%date%", created: "[[%date%]]"},
    blocks: [newBlock({title: "Captured"}), newBlock({title: "Done today"})],
  });
  putPage(join(DIRS.templates, "1.md"), {
    props: {title: "%title%", status: "%status%", outcome: "",
            created: "%created%", reviewed: "%reviewed%"},
    blocks: [],
  });

  settingsPage();
  setSetting("last_review", "");

  // cadence:: makes this a routine rather than a plain checklist, which is what
  // it actually is -- it comes round again every week and never finishes. It also
  // means the one list everybody starts with demonstrates the distinction.
  putPage(join(DIRS.lists, "Weekly review.md"), {
    props: {title: "Weekly review", type: "checklist", cadence: "weekly", created: todayStamp()},
    blocks: [
      newBlock({title: "Empty the inbox"}),
      newBlock({title: "Review every project for a next action"}),
      newBlock({title: "Chase anything waiting on someone else"}),
      newBlock({title: "Scan the calendar two weeks out"}),
      newBlock({title: "Reread someday/maybe"}),
    ],
  });

  // Verbs, templates and settings belong to every space. The welcome project
  // only makes sense in the first one.
  if (PREF.get("welcomed")) { scanVerbs(); return; }
  PREF.set("welcomed", todayISO());

  // No demo project and no demo journal: the first-run coach teaches this now,
  // and an empty list is less work to understand than someone else's tasks.
  scanVerbs();
}

  "g w": () => openWeeding(),

  "g C": () => notify("Open an action and use “add context”.", "warn"),

let chordBuf = "";
let chordTimer = null;
function showChord(txt) {
  let hud = $("#chord");
  if (!txt) { hud && hud.remove(); return; }
  if (!hud) { hud = el("div", {id: "chord"}); document.body.append(hud); }
  hud.textContent = txt;
}
function resetChord() { chordBuf = ""; showChord(""); clearTimeout(chordTimer); }

document.addEventListener("keydown", e => {
  if (MODAL_KEYS && MODAL_KEYS(e)) { e.preventDefault(); return; }
  if (e.key === "Escape") { resetChord(); closeModal(); return; }
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("#modalRoot").firstChild) return;

  if (chordBuf) {
    const key = chordBuf + " " + e.key;
    resetChord();
    if (CHORDS[key]) { e.preventDefault(); CHORDS[key](); }
    return;
  }
  if ("gfzhw".includes(e.key)) {
    chordBuf = e.key; showChord(e.key + " ...");
    chordTimer = setTimeout(resetChord, 1500);
    e.preventDefault(); return;
  }
  const single = {
    c: () => openCapture(),
    "/": () => go("search"),
    "?": () => openHelp(),
    t: () => go("today"),
  };
  if (single[e.key]) { e.preventDefault(); single[e.key](); }
});

function openHelp() {
  const rows = Object.entries(CHORDS).map(([k, _]) => k);
  modal({
    center: true, title: "Keys",

        el("div", {style: "font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--fg2)"},

      el("div", {class: "field"}, el("label", {}, "Leader chords (same as the Neovim config)"),
        el("div", {style: "font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--fg2)"},
          rows.join("   "))),
      el("div", {class: "field"}, el("label", {}, "In the outline"),
        el("div", {style: "font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--fg2)"},
          "enter  new block", el("br"), "tab / shift-tab  indent", el("br"),
          "ctrl-enter  cycle TODO state", el("br"), "backspace on empty  delete"))),

  });
}

/* ============================================================
   165_TIMERS
   Port of: init.lua nudge_check + schedule_context_reprompt + VimEnter
   ============================================================ */
function morningRoutine() {
  openWeeding(() => openContextPicker("What context are you in this morning?", surfaceContext));
}

function nudgeCheck() {
  if (!state.context) return;
  const idle = (Date.now() - state.lastTodoTouch) / 60000;
  const meetIdle = (Date.now() - state.lastMeetingTouch) / 60000;
  if (idle > CFG.idleNudgeMinutes && meetIdle > CFG.idleNudgeMinutes) {
    notify(`${CFG.idleNudgeMinutes}+ min idle. Pick one of the oldest @${state.context} actions.`, "warn");
    state.lastTodoTouch = Date.now();
  }
}

function scheduleContextPrompts() {
  for (const [h, m, label] of CFG.contextPrompts) {
    const tick = () => {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      let delay = target - now;
      if (delay <= 0) delay += 86400000;
      setTimeout(() => {
        openContextPicker("What context are you in now? (" + label + ")", surfaceContext);
        tick();
      }, delay);
    };
    tick();
  }
}

/* ============================================================
   INSTALLABLE WITHOUT INSTALLING
   Opened from a URL, this is an app: the manifest gives it a home-screen
   icon and its own window, the service worker lets it open with no network,
   and the share sheet carries the vault file to whichever cloud app the
   phone already has. Nothing is installed from a store and no account exists.

   Opened as a downloaded file:// page it is still the same app, minus the
   three things a file:// page is not allowed: a real manifest, a service
   worker, and the share sheet. Those degrade to a blob manifest and plain
   downloads.
   ============================================================ */

/* A manifest from the server when there is one -- only a real URL may declare
   share_target and file_handlers -- and a blob otherwise, so a file:// page
   stays a single document with nothing to fetch. */
function installManifest() {
  if (CAP.served) {
    document.head.append(el("link", {rel: "manifest", href: "./manifest.webmanifest"}));
    document.head.append(el("link", {rel: "icon", href: "./icon.svg", type: "image/svg+xml"}));
    return;
  }
  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'>" +
      "<rect width='192' height='192' rx='44' fill='#6aa3ff'/>" +
      "<path d='M54 99l27 27 57-57' stroke='#06101f' stroke-width='19' fill='none' " +
      "stroke-linecap='round' stroke-linejoin='round'/></svg>");
    const manifest = {
      name: "GroupTodo", short_name: "GroupTodo", start_url: ".", scope: ".",
      display: "standalone", background_color: "#0f1115", theme_color: "#0f1115",
      icons: [{src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable"}],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"}));
    document.head.append(el("link", {rel: "manifest", href: url}));
    document.head.append(el("link", {rel: "icon", href: icon, type: "image/svg+xml"}));
  } catch (_) { /* a browser without Blob URLs still runs fine, just not installable */ }
}

/* ---------- handing a markdown file to the rest of the phone ---------- */
/* No phone browser can write into a folder, so the file has to leave through
   the OS: the share sheet hands it straight to Dropbox, Drive, Nextcloud,
   Syncthing, Signal or mail, which are the sync that GroupTodo does not have.
   Desktops get a download, which is what they wanted anyway. */
const canShareFiles = () => {
  try { return !!(navigator.canShare && navigator.share &&
                  navigator.canShare({files: [new File(["x"], "x.md", {type: "text/markdown"})]})); }
  catch (_) { return false; }
};

function downloadText(name, text) {
  const url = URL.createObjectURL(new Blob([text], {type: "text/markdown"}));
  const a = el("a", {href: url, download: name});
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* Returns "shared" | "saved". Never throws: a refused share becomes a save. */
async function sendMarkdownOut(name, text, {title = name} = {}) {
  if (canShareFiles()) {
    try {
      await navigator.share({files: [new File([text], name, {type: "text/markdown"})], title});
      return "shared";
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      // Some Android builds reject files from a non-user gesture; fall back.
    }
  }
  downloadText(name, text);
  return "saved";
}

/* ---------- taking a markdown file in from the rest of the phone ---------- */
async function mergeIncomingText(text, label) {
  const files = parseBundle(text);
  if (!files.size) {
    notify((label || "That file") + " has no GroupTodo pages in it.", "error");
    return false;
  }
  notify(syncSummary(mergeBundle(files)));
  render();
  return true;
}

/* Shared from another app: the service worker caught the POST and left the
   file in a one-item mailbox for us. */
async function collectSharedFile() {
  if (!CAP.served || !("caches" in window)) return;
  if (!/[?&]shared=1/.test(location.search)) return;
  try {
    const c = await caches.open("grouptodo-inbox");
    const r = await c.match("./shared-vault.md");
    if (r) {
      await mergeIncomingText(await r.text(), "The file you shared");
      await c.delete("./shared-vault.md");
    }
  } catch (_) {}
  try { history.replaceState(null, "", location.pathname); } catch (_) {}
}

/* Opened with GroupTodo from a file manager (manifest file_handlers). */
function installFileHandler() {
  if (!("launchQueue" in window) || typeof LaunchParams === "undefined") return;
  if (!("files" in LaunchParams.prototype)) return;
  window.launchQueue.setConsumer(async params => {
    for (const handle of params.files || []) {
      try {
        const f = await handle.getFile();
        await mergeIncomingText(await f.text(), f.name);
      } catch (_) {}
    }
  });
}

/* Pick the best storage this device actually allows. */
async function pickBackend() {
  let server = null;
  server = safeLS.get("gtd.server");
  if (server) {
    try { const b = Backends.http(server); await b.list(); return b; } catch (_) {}
  }
  if (CAP.served) {
    try {
      const r = await fetch("./api/ping", {cache: "no-store"});
      if (r.ok) return Backends.http(location.origin + location.pathname.replace(/\/[^/]*$/, ""));
    } catch (_) {}
  }
  if (CAP.dirPicker) {
    const handle = await IDB.get("kv", "dirHandle").catch(() => null);
    if (handle) {
      try {
        if ((await handle.queryPermission({mode: "readwrite"})) === "granted") return Backends.fs(handle);
      } catch (_) {}
    }
  }
  if (CAP.idb) return Backends.idb();
  if (CAP.ls)  return Backends.ls();
  return Backends.memory();
}

function afterFirstRun() {
  // Day one should not open with a dashboard of things to weed.
  const started = dateIn(getSetting("started"));
  const fresh = !started || started === todayISO();
  const last = getSetting("last_morning");
  if (!fresh && last !== todayISO() && weedingWorthIt()) {
    setSetting("last_morning", todayISO());
    setTimeout(morningRoutine, 1200);
  }
  if (!isSimple()) {
    notify("Keep fresh: g M morning \u00B7 g x context \u00B7 g d re-surface \u00B7 g r review \u00B7 ? keys");
  } else if (!coachOn()) {
    notify("Tip: press c to capture, / to search, ? for keys.");
  }
}

/* Register the service worker whenever this page came from a host -- a static
   site, a company intranet, or serve.py on the phone itself. After the first
   visit the app opens with no network at all: no server running, plane mode,
   or Android having reclaimed Termux. Nothing happens from a file:// page,
   where service workers are not allowed, and the vault is never cached. */
let SW_READY = false;
function installServiceWorker() {
  if (!CAP.served || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("./sw.js")
    .then(() => navigator.serviceWorker.ready)
    .then(() => { SW_READY = true; })
    .catch(() => { /* a host without sw.js: everything else still works */ });
}

(async function init() {
  await probeStorage();
  installManifest();
  installServiceWorker();
  installFileHandler();
  installAutoSync();
  await initSpaces();

  const shown = storedVisible();
  let wanted = PREF.get("activeSpace");
  if (shown.length && (!wanted || !shown.includes(wanted))) wanted = shown[0];
  const start = (wanted && Spaces.get(wanted)) ? wanted : Spaces.list[0].name;
  try {
    await openSpace(start);
  } catch (e) {
    notify("Could not open space: " + e.message, "warn");
    Spaces.active = start;
    await loadFromBackend(CAP.idb ? Backends.idb() : CAP.ls ? Backends.ls() : Backends.memory());
  }
  await seedIfEmpty();
  scanVerbs();
  ensureJournal(todayISO());
  await ensureVisibleLoaded();
  render();
  await collectSharedFile();

  if (CAP.sandboxed) {
    // SharePoint and Teams will happily let you upload index.html and then show
    // it inside <iframe sandbox srcdoc> with no allow-same-origin. The page
    // runs, so it looks like it worked, but it has an opaque origin: no
    // storage, no folder, not even a download. Nothing typed here survives,
    // so say so before any of it is typed.
    modal({
      center: true,
      title: "Nothing can be saved here",
      body: el("div", {},
        el("div", {class: "field"},
          el("div", {style: "font-size:13.5px"},
            "This page is running inside a locked preview frame, which is what SharePoint " +
            "and Teams do with an uploaded .html file. It has no storage of its own, cannot " +
            "open a folder, and cannot even save a file \u2014 so anything you type here is " +
            "gone the moment you close it.")),
        el("div", {class: "field"},
          el("label", {}, "Either of these works instead"),
          el("div", {style: "font-size:13px;color:var(--fg2)"},
            "\u2022 Download index.html and open it from your own computer. On Chrome or Edge " +
            "that gives you the full app and a real folder of .md files."),
          el("div", {style: "font-size:13px;color:var(--fg2);margin-top:6px"},
            "\u2022 Or put it on a web address and open that. A document library is file " +
            "storage, not a web host.")),
      ),
      foot: [el("button", {class: "btn primary", onclick: closeModal}, "I understand")],
    });
    return;                 // no onboarding: there is nothing here to onboard into
  }
  if (CAP.persist === "memory") {
    notify("This browser will not store anything for this page. Use Vault & sync \u2192 " +
           "Save vault file before you close the tab.", "error");
  }

  setInterval(nudgeCheck, 60000);
  scheduleContextPrompts();

  if (!PREF.get("onboarded")) { openOnboarding(); return; }

  checkFolderConflicts();
  if (spacesNeedingStorage().length) { openSpaceStorageSetup({firstRun: false}); return; }
  afterFirstRun();
})();
</script>
