<script>
/* ============================================================
   75_SETTINGS -- kept in markdown too (pages/GTD.md)
   ============================================================ */
const SETTINGS_PATH = join(PAGES, "GTD.md");
function settingsPage() {
  if (!V.pages.has(SETTINGS_PATH)) {
    putPage(SETTINGS_PATH, {
      props: {title: "GTD", type: "settings", created: todayStamp()},
      blocks: [newBlock({title: "System settings for GroupTodo. Safe to edit by hand."})],
    });
  }
  return getPage(SETTINGS_PATH);
}
const getSetting = k => settingsPage().props[k] || null;
function setSetting(k, v) { settingsPage().props[k] = v; touch(SETTINGS_PATH); }

/* ============================================================
   80_NUDGE_ENGINE
   Every GTD nudge the Neovim config fired, as a always-visible strip.
   ============================================================ */
function computeNudges() {
  const acts = leafActions();
  const n = [];
  const push = (id, level, label, count, act) => { if (count > 0) n.push({id, level, label, count, act}); };

  const overdue = acts.filter(a => a.group === "LATE");
  push("late", "danger", "overdue", overdue.length, () => go("agenda"));

  const stuck = stuckActiveProjects();
  push("stuck", "danger", "projects with no next action", stuck.length, () => openReview(0));

  const loose = acts.filter(a => a.group === "JOURNAL");
  push("loose", "warn", "journal actions not tied to a project", loose.length, () => openReview(1));

  const noVerb = acts.filter(a => a.state === "TODO" && a.missingVerb);
  push("verb", "warn", "actions without a physical verb", noVerb.length, () => openReview(2));

  const noCtx = acts.filter(a => a.state === "TODO" && a.missingContext);
  push("ctx", "warn", "actions without a context", noCtx.length, () => openReview(3));

  const oldWait = acts.filter(a => a.state === "WAIT" && (a.age ?? 0) >= CFG.waitFollowUpDays);
  push("wait", "warn", "waiting items to chase", oldWait.length, () => go("next"));

  const stale = stalestActiveProjects(99).filter(p => (p.ageDays ?? 0) > CFG.staleProjectDays);
  push("stale", "", "projects older than 6 months", stale.length, () => openWeeding());

  const last = dateIn(getSetting("last_review"));
  const since = last ? dateDiffDays(last, todayISO()) : null;
  if (since == null || since >= CFG.reviewEveryDays) {
    n.push({
      id: "review", level: since == null || since > CFG.reviewEveryDays * 2 ? "danger" : "warn",
      label: last ? `weekly review, ${since} days since last` : "no weekly review yet",
      count: null, act: () => openReview(0),
    });
  }
  if (!n.length) n.push({id: "clean", level: "ok", label: "system is clean — go do the work", count: null, act: null});
  return n;
}

/* The single most useful thing to do right now. */
function nextBestAction() {
  const acts = leafActions();
  const pick = (title, body, cta, act) => ({title, body, cta, act});
  const overdue = acts.filter(a => a.group === "LATE");
  if (overdue.length) return pick("Overdue", `${overdue.length} action(s) are past their date. Renegotiate or do them.`, "Open agenda", () => go("agenda"));
  const last = dateIn(getSetting("last_review"));
  if (!last || dateDiffDays(last, todayISO()) >= CFG.reviewEveryDays)
    return pick("Weekly review is due", "The review is what makes the rest of the system trustworthy.", "Start review", () => openReview(0));
  if (!state.context) return pick("Where are you right now?", "Pick a context and GroupTodo surfaces the three oldest actions you can actually do here.", "Pick context", () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx)));
  const stuck = stuckActiveProjects();
  if (stuck.length) return pick("A project has stalled", `${stuck.length} active project(s) have no next action. Define one or park the project.`, "Unstick", () => openReview(0));
  const surf = oldestTodosForContext(state.context);
  if (surf.length) return pick("Oldest in " + state.context, surf[0].title, "Surface all three", () => surfaceContext(state.context));
  return pick("Nothing is nagging", "Inbox to the journal, or weed the stalest projects.", "Weed projects", () => openWeeding());
}

/* ============================================================
   85_INLINE_RENDER
   ============================================================ */
function renderInline(text) {
  let h = esc(text || "");
  h = h.replace(/\[\[([^\]]+)\]\]/g, (all, t) => {
    const raw = trim(t.split("][")[0]);
    const target = esc(raw);
    const pfx = (/^([^/]+)\//.exec(raw) || [])[1];
    const known = pfx === "c" || pfx === "z" || pfx === "p" || pfx === "o" || (pfx && STATUS_DIRS[pfx]);
    let label = trim(t.includes("][") ? t.split("][")[1] : (known ? raw.slice(pfx.length + 1) : raw));
    if (pfx === "c") label = "@" + label;
    const cls = pfx === "c" ? " ctx" : pfx === "z" ? " zet" : (pfx && STATUS_DIRS[pfx]) ? " proj" : "";
    return `<span class="wikilink${cls}" data-link="${target}">${esc(label)}</span>`;
  });
  h = h.replace(/(^|\s)#([\p{L}\p{N}_\-/]+)/gu, (all, sp, t) =>
    `${sp}<span class="tag" data-link="${esc(t)}">#${esc(t)}</span>`);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  h = h.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return h;
}

/* ============================================================
   90_VIEW_STATE
   ============================================================ */
const state = {
  view: "today",
  pagePath: null,
  context: null,        // CURRENT_CONTEXT from init.lua
  statusCode: "1",
  query: "",
  selected: null,       // block id
  surfaced: [],         // ids of the 3 surfaced actions
  lastTodoTouch: Date.now(),
  lastMeetingTouch: Date.now(),
};

function go(view, opts = {}) {
  state.view = view;
  Object.assign(state, opts);
  document.body.classList.remove("nav-open");
  render();
  $("#content").scrollTop = 0;
}
function openPage(path) { go("page", {pagePath: path}); }
const noteTodoTouched = () => { state.lastTodoTouch = Date.now(); };

/* ============================================================
   95_RENDER -- sidebar
   ============================================================ */
const NAV = [
  {group: null, items: [
    {id: "today",  icon: "☀", label: "Today",        key: "f t"},
    {id: "next",   icon: "▸", label: "Next actions", key: "g n"},
    {id: "context",icon: "⌘", label: "Context",      key: "g x"},
    {id: "agenda", icon: "☷", label: "Agenda",       key: "g a"},
  ]},
  {group: "Projects", items: [
    {id: "proj-1", icon: "1", label: "Active",        status: "1"},
    {id: "proj-3", icon: "3", label: "Waiting for",   status: "3"},
    {id: "proj-2", icon: "2", label: "Someday/Maybe", status: "2"},
    {id: "proj-0", icon: "0", label: "Completed",     status: "0"},
    {id: "proj-_", icon: "_", label: "Cancelled",     status: "_"},
  ]},
  {group: "Knowledge", items: [
    {id: "zettel", icon: "◈", label: "Zettel",   key: "z n"},
    {id: "pages",  icon: "☰", label: "All pages"},
    {id: "journal-list", icon: "▤", label: "Journals"},
  ]},
  {group: "Keep fresh", items: [
    {id: "weeding", icon: "✂", label: "Morning weeding", key: "g w"},
    {id: "review",  icon: "✓", label: "Weekly review",   key: "g r"},
    {id: "health",  icon: "⚕", label: "Health check",    key: "h c"},
  ]},
];

function navCount(id) {
  switch (id) {
    case "today":   return openTodoCount(journalPath());
    case "next":    return leafActions().filter(a => a.state !== "WAIT").length;
    case "context": return state.context ? oldestTodosForContext(state.context).length : contextList().length;
    case "agenda":  return agendaScan().reduce((n, [, l]) => n + l.length, 0);
    case "health":  return healthScan().length;
    case "review":  return stuckActiveProjects().length;
    default: {
      const m = /^proj-(.)$/.exec(id);
      if (m) return projectsIn(m[1]).length;
      return null;
    }
  }
}

function renderNav() {
  const nav = $("#nav");
  nav.textContent = "";
  for (const sec of NAV) {
    const box = el("div", {class: "nav-group"});
    if (sec.group) box.append(el("h3", {}, sec.group));
    for (const it of sec.items) {
      const active = it.status ? (state.view === "projects" && state.statusCode === it.status)
                               : state.view === it.id;
      const count = navCount(it.id);
      const hot = (it.id === "health" || it.id === "review") && count > 0;
      box.append(el("button", {
        class: "nav-item" + (active ? " active" : ""),
        onclick: () => it.status ? go("projects", {statusCode: it.status}) : go(it.id),
      },
        el("span", {class: "ic"}, it.icon),
        el("span", {class: "lbl"}, it.label),
        count ? el("span", {class: "cnt" + (hot ? " hot" : "")}, String(count))
              : (it.key ? el("span", {class: "key"}, it.key) : null)
      ));
    }
    nav.append(box);
  }
}

/* ============================================================
   100_RENDER -- shared pieces
   ============================================================ */
function nudgeBar() {
  const bar = el("div", {class: "nudgebar"});
  for (const nd of computeNudges()) {
    bar.append(el("button", {
      class: "nudge " + (nd.level || ""),
      onclick: nd.act || (() => {}),
    }, nd.count != null ? el("b", {}, String(nd.count)) : null, nd.label));
  }
  return bar;
}

function heroCard() {
  const nb = nextBestAction();
  return el("div", {class: "hero"},
    el("h2", {}, "Next best move"),
    el("div", {style: "font-size:16px;font-weight:600;margin-bottom:2px"}, nb.title),
    el("p", {html: renderInline(nb.body)}),
    el("div", {class: "acts"},
      el("button", {class: "btn primary", onclick: nb.act}, nb.cta),
      el("button", {class: "btn ghost", onclick: () => openCapture()}, "Capture something"),
      el("button", {class: "btn ghost", onclick: () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx))},
        state.context ? "Context: " + state.context : "Set context")
    ));
}

function stateChip(st) {
  return el("span", {class: "state " + (st || "")}, st || "");
}

function chipsFor(a) {
  const out = [];
  if (a.context) out.push(el("span", {class: "chip ctx b", onclick: e => {e.stopPropagation(); surfaceContext(a.context);}}, "@" + a.context));
  if (a.project) out.push(el("span", {class: "chip proj b", onclick: e => {e.stopPropagation(); a.projectPath && openPage(a.projectPath);}}, a.project));
  if (a.due) {
    const cls = a.due < todayISO() ? "late" : a.due === todayISO() ? "today" : "";
    out.push(el("span", {class: "chip " + cls}, humanDate(a.due)));
  }
  if (a.age != null && a.age > 0) out.push(el("span", {class: "chip age"}, a.age + "d"));
  if (a.missingVerb && a.state === "TODO")
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); openVerbPicker(a.path, a.block);}}, "no verb"));
  if (a.missingContext && a.state !== "WAIT")
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); promptAndInsertContext(a.path, a.block);}}, "no context"));
  return out;
}

/* Context and project links are already chips on the row, so hide them
   from the title text. The outline view still shows them Logseq-style. */
function titleForRow(title) {
  return trim(String(title || "")
    .replace(/\[\[[_0123c]\/[^\]]+\]\]/g, "")
    .replace(/\s{2,}/g, " "));
}

function taskRow(a) {
  const row = el("div", {
    class: "task" + (state.selected === a.block.id ? " sel" : ""),
    data: {state: a.state || ""},
    onclick: () => openTaskDetail(a.path, a.block),
  },
    el("button", {
      class: "chk", title: "Toggle done",
      onclick: e => { e.stopPropagation(); setBlockState(a.path, a.block, a.state === "DONE" ? "TODO" : "DONE"); },
    }, "✓"),
    el("div", {class: "t-body"},
      el("div", {class: "t-title", html: renderInline(titleForRow(a.title))}),
      el("div", {class: "t-meta"}, stateChip(a.state), ...chipsFor(a))),
    el("div", {class: "t-act"},
      el("button", {class: "iconbtn", title: "Waiting for", onclick: e => {e.stopPropagation(); setBlockState(a.path, a.block, "WAIT");}}, "⏸"),
      el("button", {class: "iconbtn", title: "Refile to a project", onclick: e => {e.stopPropagation(); openRefile(a.path, a.block);}}, "↪"),
      el("button", {class: "iconbtn", title: "Open page", onclick: e => {e.stopPropagation(); openPage(a.path);}}, "↗"))
  );
  return row;
}

function taskCard(actions, emptyText) {
  const card = el("div", {class: "card"});
  if (!actions.length) card.append(el("div", {class: "empty"}, emptyText || "Nothing here."));
  else actions.forEach(a => card.append(taskRow(a)));
  return card;
}

function section(title, count, node, extra) {
  return el("div", {class: "section"},
    el("h3", {}, title, count != null ? el("span", {class: "n"}, String(count)) : null, extra || null),
    node);
}
</script>
<script>
/* ============================================================
   105_OUTLINER -- the Logseq half of the app
   Keys: Enter new block, Tab/Shift-Tab indent, Ctrl-Enter cycle state,
         Backspace on an empty block deletes it.
   ============================================================ */
function siblingsOf(page, block) {
  let found = null;
  const rec = list => {
    if (list.includes(block)) { found = list; return; }
    list.forEach(b => rec(b.children || []));
  };
  rec(page.blocks);
  return found || page.blocks;
}
function parentOf(page, block) {
  let par = null;
  walkBlocks(page.blocks, (b, p) => { if (b === block) par = p; });
  return par;
}

function focusBlock(id, atEnd = true) {
  requestAnimationFrame(() => {
    const node = $(`.blk[data-id="${id}"] .txt`);
    if (!node) return;
    node.focus();
    const r = document.createRange(), s = getSelection();
    r.selectNodeContents(node); r.collapse(!atEnd);
    s.removeAllRanges(); s.addRange(r);
  });
}

function outlineBlock(path, page, b) {
  const kids = b.children || [];
  const node = el("div", {class: "blk" + (kids.length ? " has-kids" : "") + (b.collapsed ? " collapsed" : ""), data: {id: b.id}});
  const line = el("div", {class: "line"});

  line.append(el("span", {
    class: "bullet", title: kids.length ? "Collapse / expand" : "",
    onclick: () => { if (kids.length) { b.collapsed = !b.collapsed; render(); } },
  }));
  if (b.state) {
    line.append(el("button", {
      class: "state " + b.state, title: "Cycle state",
      onclick: () => cycleState(path, b),
    }, b.state));
  }

  const txt = el("div", {
    class: "txt", contenteditable: "true", spellcheck: "false",
    html: renderInline(b.title),
  });
  txt.addEventListener("focus", () => { txt.textContent = b.title; });
  txt.addEventListener("blur", () => {
    const val = txt.textContent.replace(/\n/g, " ");
    if (val !== b.title) {
      const [st, rest] = splitState(val);
      if (st) { b.state = st; b.title = rest; } else { b.title = val; }
      touch(path); noteTodoTouched();
      renderNav();
    }
    txt.innerHTML = renderInline(b.title);
  });
  txt.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); txt.blur();
      const sibs = siblingsOf(page, b);
      const nb = newBlock({state: b.state && OPEN_STATES[b.state] ? "TODO" : null});
      if (nb.state) nb.props.Added = "[[" + todayISO() + "]]";
      sibs.splice(sibs.indexOf(b) + 1, 0, nb);
      touch(path); render(); focusBlock(nb.id);
    } else if (e.key === "Tab") {
      e.preventDefault(); txt.blur();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      if (e.shiftKey) {
        const par = parentOf(page, b);
        if (par) {
          const gsibs = siblingsOf(page, par);
          sibs.splice(i, 1);
          gsibs.splice(gsibs.indexOf(par) + 1, 0, b);
          touch(path); render(); focusBlock(b.id);
        }
      } else if (i > 0) {
        const prev = sibs[i - 1];
        sibs.splice(i, 1);
        (prev.children || (prev.children = [])).push(b);
        prev.collapsed = false;
        touch(path); render(); focusBlock(b.id);
      }
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); txt.blur(); cycleState(path, b);
    } else if (e.key === "Backspace" && txt.textContent === "" && !(b.children || []).length) {
      e.preventDefault();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      const prev = i > 0 ? sibs[i - 1] : null;
      sibs.splice(i, 1);
      touch(path); render();
      if (prev) focusBlock(prev.id);
    } else if (e.key === "Escape") {
      txt.blur();
    }
  });
  line.append(txt);
  line.append(el("button", {
    class: "iconbtn", title: "Task actions",
    onclick: () => openTaskDetail(path, b),
  }, "⋯"));
  node.append(line);

  const props = Object.entries(b.props || {}).filter(([k]) => k.toLowerCase() !== "id");
  if (props.length) {
    node.append(el("div", {class: "props", html: props.map(([k, v]) => esc(k) + ":: " + renderInline(v)).join("  ·  ")}));
  }
  for (const l of b.body || []) if (trim(l)) node.append(el("div", {class: "bodyline", html: renderInline(l)}));

  if (!b.collapsed) for (const k of kids) node.append(outlineBlock(path, page, k));
  return node;
}

function outlineFor(path) {
  const page = getPage(path);
  const box = el("div", {class: "card"});
  const outline = el("div", {class: "outline"});
  if (!page.blocks.length) page.blocks.push(newBlock({title: ""}));
  for (const b of page.blocks) outline.append(outlineBlock(path, page, b));
  box.append(outline);
  box.append(el("button", {
    class: "dash-item", onclick: () => {
      const nb = newBlock({title: ""});
      page.blocks.push(nb); touch(path); render(); focusBlock(nb.id);
    },
  }, "+ new block"));
  return box;
}

/* ============================================================
   110_VIEWS
   ============================================================ */
function viewToday() {
  const path = ensureJournal(todayISO());
  const page = getPage(path);
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar(), heroCard());

  const surfaced = state.context ? oldestTodosForContext(state.context) : [];
  if (state.context) {
    c.append(section(
      "Oldest in @" + state.context, surfaced.length,
      taskCard(surfaced, "No open actions in this context — pick another or capture one."),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => openContextPicker("Switch context", ctx => surfaceContext(ctx))}, "switch")
    ));
  }

  const due = acts.filter(a => a.group === "LATE" || a.group === "TODAY");
  if (due.length) c.append(section("Due", due.length, taskCard(due)));

  c.append(section("Today's journal", null, outlineFor(path),
    el("span", {style: "margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0"}, humanDate(todayISO()))));

  const prev = journalPath(shiftISO(todayISO(), -1));
  c.append(el("div", {class: "section", style: "display:flex;gap:8px"},
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), -1)))}, "← yesterday"),
    V.pages.has(prev) ? null : null,
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), 1)))}, "tomorrow →")));
  return c;
}

function viewNext() {
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  for (const g of GROUPS) {
    const items = acts.filter(a => a.group === g);
    if (!items.length) continue;
    items.sort((x, y) => (x.added || "9999").localeCompare(y.added || "9999"));
    c.append(section(GROUP_META[g].label, items.length, taskCard(items)));
  }
  if (!acts.length) c.append(section("Next actions", 0, taskCard([], "No open actions. Capture something, or check your projects.")));
  return c;
}

function viewContext() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const ctxs = contextList();
  if (state.context) {
    const items = oldestTodosForContext(state.context, 99);
    c.append(section("@" + state.context, items.length,
      taskCard(items.slice(0, CFG.surfaceCount), "Nothing open here."),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => { state.context = null; render(); }}, "clear")));
    if (items.length > CFG.surfaceCount) {
      c.append(section("Rest of @" + state.context, items.length - CFG.surfaceCount, taskCard(items.slice(CFG.surfaceCount))));
    }
  }
  const card = el("div", {class: "card"});
  if (!ctxs.length) card.append(el("div", {class: "empty"}, "No contexts yet. Create pages under pages/c/ — e.g. c/phone, c/errand, c/computer."));
  for (const ctx of ctxs) {
    const open = leafActions().filter(a => a.context === ctx && OPEN_STATES[a.state]);
    card.append(el("button", {class: "prow", onclick: () => surfaceContext(ctx)},
      el("span", {class: "st st-1"}, "@"),
      el("span", {class: "nm"}, ctx),
      el("span", {class: "sub"}, open.length + " open")));
  }
  c.append(section("All contexts", ctxs.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newContextPrompt()}, "+ new")));
  return c;
}

function viewAgenda() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const days = agendaScan();
  if (!days.length) {
    c.append(section("Next " + CFG.agendaDays + " days", 0,
      taskCard([], "Nothing scheduled. Add SCHEDULED:: [[date]] or DEADLINE:: [[date]] to an action.")));
  }
  for (const [date, items] of days) {
    const label = date === todayISO() ? date + "  (today)" : date < todayISO() ? date + "  (overdue)" : date;
    c.append(section(label + " · " + humanDate(date), items.length, taskCard(items)));
  }
  return c;
}

function viewProjects() {
  const code = state.statusCode;
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const paths = projectsIn(code);
  const stuck = new Set(stuckActiveProjects().map(s => s.path));
  const card = el("div", {class: "card"});
  if (!paths.length) card.append(el("div", {class: "empty"}, "No " + STATUS_LABEL[code].toLowerCase() + " projects."));
  for (const p of paths.sort((a, b) => pageTitle(a).localeCompare(pageTitle(b)))) {
    const open = openTodoCount(p);
    const page = getPage(p);
    const reviewed = dateIn(page.props?.reviewed);
    const idle = reviewed ? dateDiffDays(reviewed, todayISO()) : null;
    card.append(el("div", {class: "prow"},
      el("button", {class: "st st-" + code, title: STATUS_TEXT[code], onclick: () => openStatusPicker(p)}, code),
      el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(p)}, pageTitle(p)),
      stuck.has(p) ? el("span", {class: "chip miss b", onclick: () => openAddNextAction(p)}, "no next action") : null,
      open ? el("span", {class: "chip"}, open + " open") : null,
      idle != null ? el("span", {class: "chip age"}, "reviewed " + idle + "d ago") : null,
      el("button", {class: "iconbtn", title: "Change status", onclick: () => openStatusPicker(p)}, "⇄")));
  }
  c.append(section(STATUS_LABEL[code] + " projects", paths.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newProjectPrompt()}, "+ new project")));
  return c;
}

function viewPages(filterFn, title, mkNew) {
  const c = el("div", {class: "wrap"});
  const paths = allPages(filterFn).sort((a, b) => pageTitle(a).localeCompare(pageTitle(b)));
  const card = el("div", {class: "card"});
  if (!paths.length) card.append(el("div", {class: "empty"}, "Nothing here yet."));
  for (const p of paths) {
    card.append(el("button", {class: "prow", onclick: () => openPage(p)},
      el("span", {class: "st st-2"}, pageRef(p).split("/")[0].slice(0, 1)),
      el("span", {class: "nm"}, pageTitle(p)),
      el("span", {class: "sub"}, p)));
  }
  c.append(section(title, paths.length, card,
    mkNew ? el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: mkNew}, "+ new") : null));
  return c;
}

function viewHealth() {
  const issues = healthScan();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const byType = new Map();
  for (const i of issues) { if (!byType.has(i.type)) byType.set(i.type, []); byType.get(i.type).push(i); }
  if (!issues.length) c.append(section("Health", 0, el("div", {class: "card"}, el("div", {class: "empty"}, "System healthy."))));
  for (const [type, items] of byType) {
    const card = el("div", {class: "card"});
    for (const i of items) {
      card.append(el("button", {class: "dash-item", onclick: () => openPage(i.path)},
        el("span", {}, i.text), el("span", {class: "p"}, i.path)));
    }
    c.append(section(type.replace(/-/g, " "), items.length, card));
  }
  const dupes = duplicateProjects();
  if (dupes.length) {
    const card = el("div", {class: "card"});
    for (const d of dupes) {
      card.append(el("div", {class: "dash-item"}, el("b", {}, d.slug), el("span", {class: "p"}, d.paths.length + " copies")));
      for (const p of d.paths) {
        card.append(el("div", {class: "prow"},
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(p)}, p),
          el("span", {class: "sub"}, openTodoCount(p) + " open"),
          el("button", {class: "btn sm ghost", onclick: () => {
            d.paths.filter(x => x !== p).forEach(x => mergePages(x, p));
            render();
          }}, "keep this, merge rest")));
      }
    }
    c.append(section("duplicate projects", dupes.length, card));
  }
  return c;
}

function viewPage() {
  const path = state.pagePath;
  if (!path || !V.pages.has(path)) { state.view = "today"; return viewToday(); }
  const page = getPage(path);
  const c = el("div", {class: "wrap"});
  const code = statusDirOf(path);

  const meta = el("div", {class: "nudgebar"});
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openStatusPicker(path)}, el("b", {}, code), STATUS_LABEL[code]));
  for (const [k, v] of Object.entries(page.props || {})) {
    if (k === "title") continue;
    meta.append(el("span", {class: "nudge", html: esc(k) + ":: " + renderInline(v)}));
  }
  meta.append(el("button", {class: "nudge", onclick: () => { updateReviewed(path); render(); }}, "mark reviewed"));
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openAddNextAction(path)}, "+ next action"));
  c.append(meta);
  c.append(el("div", {class: "section"}, outlineFor(path)));

  const back = backlinksTo(path);
  const card = el("div", {class: "card"});
  if (!back.length) card.append(el("div", {class: "empty"}, "No backlinks."));
  for (const h of back) {
    card.append(el("button", {class: "dash-item", onclick: () => openPage(h.path)},
      el("span", {html: renderInline(h.block.title || "(block)")}), el("span", {class: "p"}, h.path)));
  }
  c.append(section("Linked references", back.length, card));

  c.append(el("div", {class: "section", style: "display:flex;gap:8px;flex-wrap:wrap"},
    el("button", {class: "btn sm ghost", onclick: () => renamePrompt(path)}, "rename"),
    el("button", {class: "btn sm ghost", onclick: () => movePrompt(path)}, "move"),
    el("button", {class: "btn sm ghost", onclick: () => deletePrompt(path)}, "delete")));
  return c;
}

function viewSearch() {
  const q = trim(state.query).toLowerCase();
  const c = el("div", {class: "wrap"});
  const box = el("div", {class: "filterbox", style: "padding:14px 0"},
    el("input", {
      placeholder: "Search every block and page...", value: state.query,
      oninput: e => { state.query = e.target.value; clearTimeout(window.__sq); window.__sq = setTimeout(render, 160); },
    }));
  c.append(box);
  if (!q) { c.append(el("div", {class: "empty"}, "Type to search.")); return c; }
  const hits = [];
  for (const [path, page] of V.pages) {
    if (pageTitle(path).toLowerCase().includes(q)) hits.push({path, block: null});
    walkBlocks(page.blocks, b => {
      const text = [b.title, ...(b.body || [])].join(" ").toLowerCase();
      if (text.includes(q)) hits.push({path, block: b});
    });
  }
  const card = el("div", {class: "card"});
  if (!hits.length) card.append(el("div", {class: "empty"}, "No matches."));
  for (const h of hits.slice(0, 300)) {
    card.append(el("button", {class: "dash-item", onclick: () => h.block ? openTaskDetail(h.path, h.block) : openPage(h.path)},
      h.block ? stateChip(h.block.state) : null,
      el("span", {html: renderInline(h.block ? h.block.title : pageTitle(h.path))}),
      el("span", {class: "p"}, h.path)));
  }
  c.append(section("Results", hits.length, card));
  return c;
}

/* ============================================================
   115_RENDER dispatcher
   ============================================================ */
const VIEW_TITLE = {
  today: "Today", next: "Next actions", context: "Context", agenda: "Agenda",
  projects: "Projects", zettel: "Zettel", pages: "All pages", "journal-list": "Journals",
  health: "Health check", search: "Search", page: "Page",
};

function render() {
  if (!V.loaded) return;
  renderNav();
  const c = $("#content");
  c.textContent = "";
  let node;
  switch (state.view) {
    case "today":   node = viewToday(); break;
    case "next":    node = viewNext(); break;
    case "context": node = viewContext(); break;
    case "agenda":  node = viewAgenda(); break;
    case "projects":node = viewProjects(); break;
    case "health":  node = viewHealth(); break;
    case "search":  node = viewSearch(); break;
    case "page":    node = viewPage(); break;
    case "zettel":  node = viewPages(p => p.startsWith(DIRS.zettel + "/"), "Zettel notes", () => newZettelPrompt()); break;
    case "journal-list": node = viewPages(p => isJournalPath(p), "Journals"); break;
    case "pages":   node = viewPages(p => !isJournalPath(p) && pageKind(p) !== "verb", "All pages"); break;
    case "review":  node = viewToday(); openReview(0); break;
    case "weeding": node = viewToday(); openWeeding(); break;
    default:        node = viewToday();
  }
  c.append(node);
  $("#hTitle").textContent = state.view === "page" ? pageTitle(state.pagePath)
    : state.view === "projects" ? STATUS_LABEL[state.statusCode] + " projects"
    : (VIEW_TITLE[state.view] || "Today");
  $("#hSub").textContent = state.view === "page" ? state.pagePath
    : state.context && ["today", "context", "next"].includes(state.view) ? "@" + state.context : "";
}

/* wiki links are delegated */
$("#content").addEventListener("click", e => {
  const link = e.target.closest("[data-link]");
  if (link) { e.stopPropagation(); followLink(link.dataset.link); }
});
</script>
<script>
/* ============================================================
   120_MODALS
   Port of: init.lua 80_RENDER_ENGINE (open_scratch + letter keys)
   The bottom-split scratch buffers become bottom sheets; the a-z
   selection keys from open_context_picker are kept exactly.
   ============================================================ */
let MODAL_KEYS = null;

function modal({title, hint, body, foot, center = false, onKey = null}) {
  closeModal();
  const sheet = el("div", {class: "modal"},
    el("header", {}, el("h2", {}, title), el("div", {style: "flex:1"}),
      hint ? el("span", {class: "hint"}, hint) : null,
      el("button", {class: "iconbtn", onclick: closeModal}, "✕")),
    el("div", {class: "body"}, body),
    foot ? el("div", {class: "foot"}, foot) : null);
  const scrim = el("div", {class: "scrim" + (center ? " center" : ""), onclick: e => { if (e.target === scrim) closeModal(); }}, sheet);
  $("#modalRoot").append(scrim);
  MODAL_KEYS = onKey;
  return {close: closeModal, root: sheet};
}
function closeModal() {
  $("#modalRoot").textContent = "";
  MODAL_KEYS = null;
}
function pickRow(key, label, detail, onclick) {
  return el("button", {class: "pick", onclick},
    el("span", {class: "k"}, key), el("span", {}, label),
    detail ? el("span", {class: "d"}, detail) : null);
}

/* Generic list picker with a-z single-key selection. */
function listPicker({title, hint, items, label, detail, onPick, footer}) {
  const letters = "abcdefghijklmnopqrstuvwxyz";
  let filtered = items.slice();
  const body = el("div", {});
  const list = el("div", {});
  const input = el("input", {
    placeholder: "filter...",
    oninput: e => { const q = e.target.value.toLowerCase();
      filtered = items.filter(i => label(i).toLowerCase().includes(q)); draw(); },
  });
  body.append(el("div", {class: "filterbox"}, input), list);
  function draw() {
    list.textContent = "";
    if (!filtered.length) list.append(el("div", {class: "empty"}, "No matches."));
    filtered.forEach((it, i) => {
      const key = i < 26 ? letters[i] : String(i + 1);
      list.append(pickRow(key, label(it), detail ? detail(it) : null, () => { closeModal(); onPick(it); }));
    });
  }
  draw();
  modal({
    title, hint: hint || "letter selects · esc cancels", body,
    foot: footer,
    onKey: e => {
      if (document.activeElement === input && e.key.length === 1) return false;
      const i = letters.indexOf(e.key);
      if (i >= 0 && i < filtered.length) { closeModal(); onPick(filtered[i]); return true; }
      return false;
    },
  });
  // Deliberately NOT focused: a-z must select a row, exactly like the
  // letter-key context picker in the Neovim config. Tap the box to filter.
}

function promptInput({title, label, value = "", placeholder = "", multiline = false, cta = "Save", onSave}) {
  const input = multiline
    ? el("textarea", {placeholder})
    : el("input", {placeholder, value});
  if (multiline) input.value = value;
  const save = () => { const v = trim(input.value); closeModal(); if (v) onSave(v); };
  modal({
    center: true, title,
    body: el("div", {class: "field"}, el("label", {}, label), input),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: save}, cta)],
    onKey: e => {
      if (e.key === "Enter" && (!multiline || e.ctrlKey || e.metaKey)) { save(); return true; }
      return false;
    },
  });
  setTimeout(() => input.focus(), 30);
}

/* ============================================================
   125_CONTEXT_SYSTEM
   Port of: init.lua 52_CONTEXT_SYSTEM
   ============================================================ */
function seedContexts() {
  for (const c of SEED_CONTEXTS) {
    const p = join(DIRS.contexts, c + ".md");
    if (!V.pages.has(p)) putPage(p, pageTemplateFor("c", c));
  }
  notify("Installed " + SEED_CONTEXTS.length + " contexts under pages/c/.");
}

function offerStarterContexts(onPick) {
  modal({
    center: true, title: "No contexts yet",
    body: el("div", {class: "field"},
      el("label", {}, "Contexts are where work can happen"),
      el("div", {style: "color:var(--fg2);font-size:13.5px"},
        "An action tagged [[c/phone]] can only be done with a phone in hand. " +
        "Picking a context is what lets GroupTodo surface the three oldest things " +
        "you can actually do right now.")),
    foot: [
      el("button", {class: "btn ghost", onclick: () => { closeModal(); newContextPrompt(onPick); }}, "Name my own"),
      el("button", {class: "btn primary", onclick: () => {
        closeModal(); seedContexts(); render();
        openContextPicker("Where are you now?", onPick);
      }}, "Install starter contexts"),
    ],
  });
}

function openContextPicker(title, onPick) {
  const items = contextList();
  if (!items.length) { offerStarterContexts(onPick); return; }
  listPicker({
    title: title || "Pick context", items,
    label: c => "@" + c,
    detail: c => leafActions().filter(a => a.context === c && OPEN_STATES[a.state]).length + " open",
    onPick,
    footer: el("button", {class: "btn ghost", onclick: () => { closeModal(); newContextPrompt(onPick); }}, "+ new context"),
  });
}

function newContextPrompt(onPick) {
  promptInput({
    title: "New context", label: "Name (no @, e.g. phone, errand, deep-work)",
    cta: "Create",
    onSave: name => {
      const clean = slugify(name.replace(/^@/, ""));
      const path = join(DIRS.contexts, clean + ".md");
      if (!V.pages.has(path)) putPage(path, pageTemplateFor("c", clean));
      notify("Context created: @" + clean);
      render();
      if (onPick) onPick(clean);
    },
  });
}

function insertContextLink(path, block, ctx) {
  if (hasContextLink(block.title)) { notify("Already has a context"); return; }
  block.title = trim(block.title) + " [[c/" + ctx + "]]";
  touch(path);
  render();
}

function promptAndInsertContext(path, block) {
  openContextPicker("Pick a context for this action", ctx => {
    insertContextLink(path, block, ctx);
    checkProjectCompletion(path);
  });
}

/* Surface the 3 oldest actions in a context -- the core nudge loop. */
function surfaceContext(ctx) {
  state.context = ctx;
  state.lastTodoTouch = Date.now();
  const items = oldestTodosForContext(ctx);
  state.surfaced = items.map(a => a.block.id);
  setSetting("current_context", ctx);
  go("today");
  notify(items.length
    ? `@${ctx}: ${items.length} oldest action(s) surfaced.`
    : `@${ctx}: nothing open here. Capture one?`);
}

/* ============================================================
   130_VERB_PICKER
   Port of: init.lua suggest_phys_viz_verb
   ============================================================ */
function seedVerbs() {
  for (const [lang, verbs] of Object.entries(SEED_VERBS)) {
    for (const [canonical, syns] of Object.entries(verbs)) {
      const p = join(DIRS.verbs, lang, canonical + ".md");
      if (V.pages.has(p)) continue;
      putPage(p, {
        props: {title: canonical, type: "verb", lang},
        blocks: [newBlock({title: canonical + " = " + canonical}),
                 ...syns.map(x => newBlock({title: x + " = " + canonical}))],
      });
    }
  }
  scanVerbs();
  notify("Installed " + Object.keys(VERB_CANON).length + " verbs under pages/verbs/.");
}

function openVerbPicker(path, block) {
  const verbs = verbList();
  if (!verbs.length) {
    modal({
      center: true, title: "No verb lexicon yet",
      body: el("div", {class: "field"},
        el("label", {}, "The Phys-Viz rule"),
        el("div", {style: "color:var(--fg2);font-size:13.5px"},
          "A next action should start with a verb a camera could film: Call, Draft, Buy. " +
          "Verbs live in pages/verbs/<lang>/<verb>.md, one \u201Csynonym = verb\u201D per line.")),
      foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Not now"),
             el("button", {class: "btn primary", onclick: () => { closeModal(); seedVerbs(); openVerbPicker(path, block); }},
               "Install starter verbs")],
    });
    return;
  }
  listPicker({
    title: "Make it physical and visible",
    hint: "what would a camera see you doing?",
    items: verbs,
    label: v => v.canonical.charAt(0).toUpperCase() + v.canonical.slice(1),
    detail: v => v.lang,
    onPick: v => {
      const verb = v.canonical.charAt(0).toUpperCase() + v.canonical.slice(1);
      if (!startsWithVerb(block.title)) block.title = verb + " " + block.title;
      if (!block.state) block.state = "TODO";
      touch(path); render();
    },
  });
}

/* Clarify: make it a TODO, give it a verb, give it a context. */
function clarifyBlock(path, block) {
  if (!block.state) setBlockState(path, block, "TODO", {skipContext: true});
  if (!startsWithVerb(block.title)) { openVerbPicker(path, block); return; }
  if (!hasContextLink(block.title)) { promptAndInsertContext(path, block); return; }
  notify("Looks executable: physical verb + context.");
}

/* ============================================================
   135_CAPTURE / REFILE / DETAIL
   ============================================================ */
function openCapture() {
  const path = ensureJournal(todayISO());
  const input = el("textarea", {placeholder: "What just landed? One line per item."});
  let asTodo = true, ctx = state.context;
  const ctxBtn = el("button", {class: "btn ghost sm", onclick: () => {
    openContextPicker("Context for capture", c => { ctx = c; openCaptureWith(input.value, asTodo, c); });
  }}, ctx ? "@" + ctx : "no context");
  const todoBtn = el("button", {class: "btn ghost sm", onclick: () => {
    asTodo = !asTodo; todoBtn.textContent = asTodo ? "TODO" : "note";
    todoBtn.classList.toggle("primary", asTodo);
  }}, "TODO");
  todoBtn.classList.add("primary");

  const save = () => {
    const lines = input.value.split("\n").map(trim).filter(Boolean);
    closeModal();
    if (!lines.length) return;
    const page = getPage(path);
    for (const line of lines) {
      const [st, rest] = splitState(line);
      const title = (st ? rest : line) + (asTodo && ctx && !hasContextLink(line) ? " [[c/" + ctx + "]]" : "");
      const blk = newBlock({state: st || (asTodo ? "TODO" : null), title});
      if (blk.state) blk.props.Added = "[[" + todayISO() + "]]";
      page.blocks.push(blk);
    }
    touch(path); noteTodoTouched();
    notify(lines.length + " captured to today's journal.");
    go("today");
  };
  modal({
    center: true, title: "Capture", hint: "ctrl+enter saves",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Into " + journalPath()), input),
      el("div", {class: "field"}, el("label", {}, "Capture as"), el("div", {class: "seg"}, todoBtn, ctxBtn))),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: save}, "Capture")],
    onKey: e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); return true; } return false; },
  });
  setTimeout(() => input.focus(), 30);
}
function openCaptureWith(text, asTodo, ctx) { state.context = ctx; openCapture(); }

function openRefile(fromPath, block) {
  const targets = [...projectsIn("1"), ...projectsIn("3"), ...projectsIn("2")];
  listPicker({
    title: "Refile to project",
    items: targets,
    label: p => pageTitle(p),
    detail: p => pageRef(p),
    onPick: p => refileBlock(fromPath, block, p),
    footer: el("button", {class: "btn ghost", onclick: () => { closeModal(); newProjectPrompt(p => refileBlock(fromPath, block, p)); }}, "+ new project"),
  });
}

function openTaskDetail(path, block) {
  state.selected = block.id;
  const a = {
    path, block, state: block.state, title: block.title,
    context: contextOf(block.title), due: dueDate(block),
    age: blockAge(block), added: addedDate(block),
  };
  const titleInput = el("textarea", {}); titleInput.value = block.title;
  const notes = el("textarea", {placeholder: "Notes"}); notes.value = (block.body || []).join("\n");
  const sched = el("input", {type: "date", value: dateIn(blockProp(block, "SCHEDULED")) || ""});
  const dead  = el("input", {type: "date", value: dateIn(blockProp(block, "DEADLINE")) || ""});

  const seg = el("div", {class: "seg"});
  for (const st of TODO_STATES) {
    seg.append(el("button", {
      class: block.state === st ? "on" : "",
      onclick: () => { closeModal(); setBlockState(path, block, st); },
    }, st));
  }

  const save = () => {
    const val = trim(titleInput.value).replace(/\n/g, " ");
    const [st, rest] = splitState(val);
    if (st) { block.state = st; block.title = rest; } else { block.title = val; }
    block.body = notes.value.split("\n");
    while (block.body.length && !trim(block.body[block.body.length - 1])) block.body.pop();
    if (sched.value) setBlockProp(block, "SCHEDULED", "[[" + sched.value + "]]");
    else if (blockProp(block, "SCHEDULED")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "scheduled")];
    if (dead.value) setBlockProp(block, "DEADLINE", "[[" + dead.value + "]]");
    else if (blockProp(block, "DEADLINE")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "deadline")];
    touch(path); noteTodoTouched(); closeModal(); render();
  };

  modal({
    title: "Action", hint: a.age != null ? "on your list " + a.age + " days" : "",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Title"), titleInput),
      el("div", {class: "field"}, el("label", {}, "State"), seg),
      el("div", {class: "field"}, el("label", {}, "GTD hygiene"), el("div", {class: "seg"},
        el("button", {onclick: () => { closeModal(); promptAndInsertContext(path, block); }},
          a.context ? "@" + a.context : "add context"),
        el("button", {onclick: () => { closeModal(); openVerbPicker(path, block); }},
          startsWithVerb(block.title) ? "verb ok" : "add physical verb"),
        el("button", {onclick: () => { closeModal(); openRefile(path, block); }}, "refile"),
      )),
      el("div", {class: "grid2"},
        el("div", {class: "field"}, el("label", {}, "Scheduled"), sched),
        el("div", {class: "field"}, el("label", {}, "Deadline"), dead)),
      el("div", {class: "field"}, el("label", {}, "Notes"), notes),
      el("div", {class: "field"}, el("label", {}, "Source"),
        el("button", {class: "btn ghost sm", onclick: () => { closeModal(); openPage(path); }}, path))),
    foot: [
      el("button", {class: "btn ghost", onclick: () => {
        const page = getPage(path);
        removeBlockFrom(page, block); touch(path); closeModal(); render();
      }}, "Delete"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: save}, "Save"),
    ],
    onKey: e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); return true; } return false; },
  });
}

/* ============================================================

function openStatusPicker(path) {

function newZettelPrompt() {

  const page = getPage(path); if (!page) return;
  if (flattenBlocks(page.blocks).some(b => OPEN_STATES[b.state])) return;

/* ============================================================
   150_VAULT DIALOG -- connect a folder, a server, or export markdown
   ============================================================ */
function bundleMarkdown() {
  const out = [];
  for (const path of Array.from(V.pages.keys()).sort()) {
    out.push("<!-- gtd:file " + path + " -->");
    out.push(serializePage(getPage(path)).replace(/\n$/, ""));
    out.push("<!-- gtd:endfile -->", "");
  }
  return out.join("\n");
}
function parseBundle(text) {
  const files = new Map();
  const re = /<!--\s*gtd:file\s+(.+?)\s*-->\n([\s\S]*?)\n?<!--\s*gtd:endfile\s*-->/g;
  let m;
  while ((m = re.exec(text))) files.set(trim(m[1]), m[2]);
  return files;
}
function download(name, text) {
  const a = el("a", {href: URL.createObjectURL(new Blob([text], {type: "text/markdown"})), download: name});
  document.body.append(a); a.click(); a.remove();
}

async function connectFolder() {
  if (!window.showDirectoryPicker) {
    notify("This browser has no folder access. Use the sync server (serve.py) instead.", "warn");
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({mode: "readwrite", id: "grouptodo-vault"});
    await IDB.set("kv", "dirHandle", handle);
    await loadFromBackend(Backends.fs(handle));
    await seedIfEmpty();
    scanVerbs(); closeModal(); render();
    notify("Vault connected: " + handle.name);
  } catch (e) {
    if (e.name !== "AbortError") notify("Could not open folder: " + e.message, "error");
  }
}

async function connectServer(base) {
  try {
    const b = Backends.http(base);
    await loadFromBackend(b);
    localStorage.setItem("gtd.server", base);
    await seedIfEmpty();
    scanVerbs(); closeModal(); render();
    notify("Synced with " + b.label);
  } catch (e) {
    notify("Server not reachable: " + e.message, "error");
  }
}

function openVaultDialog() {
  const serverInput = el("input", {placeholder: "http://127.0.0.1:8777", value: localStorage.getItem("gtd.server") || location.origin});
  const fileInput = el("input", {type: "file", accept: ".md,.org,text/markdown", multiple: true, style: "display:none",
    onchange: async e => {
      let n = 0;
      for (const f of e.target.files) {
        const text = await f.text();
        const rel = f.webkitRelativePath || f.name;
        const path = rel.replace(/^[^/]*\//, "");
        if (/\.org$/i.test(f.name)) { putPage(path.replace(/\.org$/i, ".md"), orgToPage(text)); n++; }
        else if (parseBundle(text).size) {
          for (const [p, t] of parseBundle(text)) { putPage(p, parsePage(t)); n++; }
        } else { putPage(path, parsePage(text)); n++; }
      }
      scanVerbs(); notify("Imported " + n + " files."); closeModal(); render();
    }});

  modal({
    center: true, title: "Vault & sync",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Current backend"),
        el("div", {style: "color:var(--fg2)"},
          V.backend ? `${V.backend.kind} — ${V.backend.label} · ${V.pages.size} markdown files` : "none")),
      el("div", {class: "field"}, el("label", {}, "A. Local folder (Chrome / Edge on desktop)"),
        el("button", {class: "btn primary", onclick: connectFolder}, "Choose vault folder"),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Writes real .md files into journals/ and pages/. Reconnects automatically next time.")),
      el("div", {class: "field"}, el("label", {}, "B. Sync server (phone, Termux, anywhere)"),
        serverInput,
        el("div", {style: "display:flex;gap:8px;margin-top:8px"},
          el("button", {class: "btn", onclick: () => connectServer(trim(serverInput.value))}, "Connect"),
          el("button", {class: "btn ghost", onclick: () => { localStorage.removeItem("gtd.server"); notify("Server forgotten."); }}, "Forget")),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Run serve.py next to your vault, then point this at it. Same .md files, editable in Neovim.")),
      el("div", {class: "field"}, el("label", {}, "C. Import / export markdown"),
        el("div", {style: "display:flex;gap:8px;flex-wrap:wrap"},
          el("button", {class: "btn ghost", onclick: () => download("grouptodo-vault-" + todayISO() + ".md", bundleMarkdown())}, "Export bundle"),
          el("button", {class: "btn ghost", onclick: () => fileInput.click()}, "Import files"),
          V.raw.size ? el("button", {class: "btn ghost", onclick: () => { importOrgFiles(); closeModal(); }}, "Convert " + V.raw.size + " .org files") : null),
        fileInput)),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Close")],
  });
}

  "w w": () => go("projects", {statusCode: "3"}),
  "w m": () => go("projects", {statusCode: "2"}),
};
let chordBuf = "";
let chordTimer = null;
function showChord(txt) {
  let hud = $("#chord");
  if (!txt) { hud && hud.remove(); return; }
  if (!hud) { hud = el("div", {id: "chord"}); document.body.append(hud); }
  hud.textContent = txt;
}
function resetChord() { chordBuf = ""; showChord(""); clearTimeout(chordTimer); }

document.addEventListener("keydown", e => {
  if (MODAL_KEYS && MODAL_KEYS(e)) { e.preventDefault(); return; }
  if (e.key === "Escape") { resetChord(); closeModal(); return; }
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("#modalRoot").firstChild) return;

  if (chordBuf) {
    const key = chordBuf + " " + e.key;
    resetChord();
    if (CHORDS[key]) { e.preventDefault(); CHORDS[key](); }
    return;
  }
  if ("gfzhw".includes(e.key)) {
    chordBuf = e.key; showChord(e.key + " ...");
    chordTimer = setTimeout(resetChord, 1500);
    e.preventDefault(); return;
  }
  const single = {
    c: () => openCapture(),
    "/": () => go("search"),
    "?": () => openHelp(),
    t: () => go("today"),
  };
  if (single[e.key]) { e.preventDefault(); single[e.key](); }
});

function openHelp() {
  const rows = Object.entries(CHORDS).map(([k, _]) => k);
  modal({

          rows.join("   "))),
      el("div", {class: "field"}, el("label", {}, "In the outline"),
        el("div", {style: "font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--fg2)"},

    foot: [el("button", {class: "btn primary", onclick: closeModal}, "Got it")],
  });
}

function morningRoutine() {

function nudgeCheck() {
  if (!state.context) return;
  const idle = (Date.now() - state.lastTodoTouch) / 60000;
  const meetIdle = (Date.now() - state.lastMeetingTouch) / 60000;
  if (idle > CFG.idleNudgeMinutes && meetIdle > CFG.idleNudgeMinutes) {
    notify(`${CFG.idleNudgeMinutes}+ min idle. Pick one of the oldest @${state.context} actions.`, "warn");
    state.lastTodoTouch = Date.now();
  }
}

function scheduleContextPrompts() {
  for (const [h, m, label] of CFG.contextPrompts) {
    const tick = () => {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
      let delay = target - now;
      if (delay <= 0) delay += 86400000;
      setTimeout(() => {
        openContextPicker("What context are you in now? (" + label + ")", surfaceContext);
        tick();
      }, delay);
    };
    tick();
  }
}

/* ============================================================
   170_INIT
   ============================================================ */
$("#btnCapture").onclick = () => openCapture();
$("#btnSearch").onclick  = () => go("search");
$("#btnVault").onclick   = () => openVaultDialog();
$("#burger").onclick     = () => document.body.classList.toggle("nav-open");
$("#btnTheme").onclick   = () => {
  const cur = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = cur;
  localStorage.setItem("gtd.theme", cur);
};
if (localStorage.getItem("gtd.theme")) document.documentElement.dataset.theme = localStorage.getItem("gtd.theme");

async function pickBackend() {
  const server = localStorage.getItem("gtd.server");
  if (server) {
    try { const b = Backends.http(server); await b.list(); return b; } catch (_) {}
  }
  if (location.protocol.startsWith("http")) {
    try {
      const r = await fetch("./api/ping", {cache: "no-store"});
      if (r.ok) return Backends.http(location.origin + location.pathname.replace(/\/[^/]*$/, ""));
    } catch (_) {}
  }
  const handle = await IDB.get("kv", "dirHandle").catch(() => null);
  if (handle) {
    try {
      const perm = await handle.queryPermission({mode: "readwrite"});
      if (perm === "granted") return Backends.fs(handle);
    } catch (_) {}
  }
  return Backends.idb();
}

(async function init() {
  try {
    await loadFromBackend(await pickBackend());
  } catch (e) {
    notify("Falling back to browser storage: " + e.message, "warn");
    await loadFromBackend(Backends.idb());
  }
  await seedIfEmpty();
  scanVerbs();
  ensureJournal(todayISO());
  state.context = getSetting("current_context") || null;

  render();

  setInterval(nudgeCheck, 60000);
  scheduleContextPrompts();

  const last = getSetting("last_morning");
  if (last !== todayISO()) {
    setSetting("last_morning", todayISO());
    setTimeout(morningRoutine, 1200);
  }
  notify("Keep fresh: g M morning · g x context · g d re-surface · g r review · ? keys");
})();
</script>
