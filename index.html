function horizonRow(h, body, action) {
  return el("div", {class: "section"},
    el("h3", {},
      el("span", {style: "color:var(--accent);font-family:var(--mono);font-size:11px"}, h.alt),
      el("span", {}, h.h + " · " + h.name),
      action ? el("span", {style: "margin-left:auto"}, action) : null),
    body);
}

function textHorizonCard(key, h) {
  const lines = getHorizon(key);
  const card = el("div", {class: "card"});
  if (!lines.length) {
    card.append(el("div", {class: "empty"}, h.ask));
  } else {
    for (const l of lines) card.append(el("div", {class: "dash-item", html: renderInline(l)}));
  }
  return card;
}

function editHorizonText(key, h) {
  const ta = el("textarea", {placeholder: h.ask, style: "min-height:130px"});
  ta.value = getHorizon(key).join("\n");
  modal({
    center: true, title: h.h + " · " + h.name,
    body: el("div", {class: "field"}, el("label", {}, h.ask), ta),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: () => {
             setHorizon(key, ta.value.split("\n")); closeModal(); render();
           }}, "Save")],
  });
}

function viewHorizons() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());

  const areas = areaList(), goals = goalList();
  const nothing = !areas.length && !goals.length && !getHorizon("vision").length && !getHorizon("purpose").length;

  if (nothing) {
    c.append(el("div", {class: "hero"},
      el("h2", {}, "Horizons of focus"),
      el("div", {style: "font-size:16px;font-weight:600;margin-bottom:2px"}, "Altitude, not just a list"),
      el("p", {}, "Purpose, vision, goals and areas are what make your projects mean something. " +
                  "Nothing is created for you — the wizard asks, you answer."),
      el("div", {class: "acts"},
        el("button", {class: "btn primary", onclick: () => openHorizonsWizard(0)}, "Run the setup wizard"))));
  }

  for (const h of HORIZONS) {
    if (h.key === "purpose" || h.key === "vision") {
      c.append(horizonRow(h, textHorizonCard(h.key, h),
        el("span", {},
          getHorizon(h.key).length
            ? el("button", {class: "btn sm ghost", style: "margin-right:6px",
                onclick: () => openPage(horizonPath(h.key))}, "open")
            : null,
          el("button", {class: "btn sm ghost", onclick: () => editHorizonText(h.key, h)},
            getHorizon(h.key).length ? "edit" : "define"))));
    } else if (h.key === "goals") {
      const card = el("div", {class: "card"});
      if (!goals.length) card.append(el("div", {class: "empty"}, h.ask));
      for (const g of goals) {
        const name = baseName(g);
        const live = projectsForGoal(name).filter(p => ["1", "3"].includes(statusDirOf(p)));
        card.append(el("div", {class: "prow"},
          el("span", {class: "st st-1"}, "3"),
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(g)}, pageTitle(g)),
          el("button", {class: "chip b", onclick: () => openAreaPickerFor(g)},
            areaOfGoal(g) ? areaOfGoal(g) : "no area"),
          live.length ? el("span", {class: "chip"}, live.length + " projects")
                      : el("span", {class: "chip miss b", onclick: () => newProjectPrompt(np => { setGoalOfProject(np, name); openPage(np); })},
                          "no project")));
      }
      c.append(horizonRow(h, card,
        el("button", {class: "btn sm ghost", onclick: () => newGoalPrompt()}, "+ goal")));
    } else if (h.key === "areas") {
      const card = el("div", {class: "card"});
      if (!areas.length) card.append(el("div", {class: "empty"}, h.ask));
      for (const a of areas) {
        const name = baseName(a);
        const projects = projectsInArea(name);
        const open = projects.reduce((n, p) => n + openTodoCount(p), 0);
        card.append(el("div", {class: "prow"},
          el("span", {class: "st st-2"}, "2"),
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(a)}, name),
          el("span", {class: "sub"}, projects.length + " projects"),
          open ? el("span", {class: "chip"}, open + " open") : null,
          el("button", {class: "btn sm ghost", onclick: () => newProjectPrompt(np => { setAreaOfProject(np, name); openPage(np); })},
            "+ project")));
      }
      const orphans = unassignedProjects();
      if (orphans.length) {
        card.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
          el("span", {}, orphans.length + " project(s) belong to no area"),
          el("span", {class: "fix", onclick: () => openAreaPicker(orphans[0])}, "assign")));
      }
      c.append(horizonRow(h, card,
        el("button", {class: "btn sm ghost", onclick: () => newAreaPrompt()}, "+ area")));
    } else if (h.key === "projects") {
      const card = el("div", {class: "card"});
      for (const code of STATUS_ORDER) {
        card.append(el("button", {class: "prow", onclick: () => go("projects", {statusCode: code})},
          el("span", {class: "st st-" + code}, code),
          el("span", {class: "nm"}, STATUS_LABEL[code]),
          el("span", {class: "sub"}, projectsIn(code).length + "")));
      }
      const noOutcome = projectsWithoutOutcome();
      if (noOutcome.length) {
        card.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
          el("span", {}, noOutcome.length + " project(s) with no stated outcome"),
          el("span", {class: "fix", onclick: () => openOutcomePrompt(noOutcome[0])}, "define")));
      }
      c.append(horizonRow(h, card));
    } else {
      const open = leafActions().filter(a => OPEN_STATES[a.state]);
      const card = el("div", {class: "card"},
        el("button", {class: "prow", onclick: () => go(isSimple() ? "todos" : "next")},
          el("span", {class: "st st-1"}, "▸"),
          el("span", {class: "nm"}, "Open next actions"),
          el("span", {class: "sub"}, open.length + "")));
      c.append(horizonRow(h, card));
    }
  }

  c.append(el("div", {class: "section"},
    el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(0)}, "Run the horizons wizard")));
  return c;
}

function newGoalPrompt() {
  promptInput({
    title: "New goal", label: "What do you want true in one to two years?", cta: "Create",
    onSave: t => { const p = createGoal(t); render(); openPage(p); },
  });
}

/* Area picker that works for a goal page as well as a project page. */
function openAreaPickerFor(goalPath) {
  const areas = areaList().map(baseName);
  if (!areas.length) { newAreaPrompt(a => { setAreaOfGoal(goalPath, baseName(a)); render(); }); return; }
  listPicker({
    title: "Area for " + pageTitle(goalPath),
    items: areas.concat(["(none)"]),
    label: a => a,
    onPick: a => { setAreaOfGoal(goalPath, a === "(none)" ? null : a); render(); },
  });
}

/* Kept in three named groups rather than one undifferentiated pile, because the
   difference between them is the one piece of filing that actually earns its
   keep: a routine sitting in the project list makes the project list look
   permanently unfinished. */
function viewChecklists() {
  const c = el("div", {class: "wrap"});
  const lists = checklistPages();
  const GROUPS = [
    {label: "Routines", icon: "\u21bb", cta: "Run",
     test: pth => isRoutine(pth) && !isProjectTemplate(pth),
     blurb: "Comes back and never finishes \u2014 the weekly accounts, the monthly report, " +
            "everything you pack before a trip. Not a project, because there is nothing to tick off."},
    {label: "Checklists", icon: "\u2611", cta: "Run",
     test: pth => !isRoutine(pth) && !isProjectTemplate(pth),
     blurb: "Steps you would rather not think through twice. Run one into today, or into a " +
            "project you already have."},
    {label: "Project templates", icon: "\u221e", cta: "New project",
     test: pth => isProjectTemplate(pth),
     blurb: "Every run spins up a whole new project \u2014 \"Onboard new insurance customer\", " +
            "once per customer, the same steps each time."},
  ];
  const head = el("button", {class: "btn sm ghost", style: "margin-left:auto",
    onclick: () => newChecklistPrompt()}, "+ new");

  // Empty, the three descriptions ARE the content: this is the one screen where
  // the difference between them is worth a paragraph.
  if (!lists.length) {
    const card = el("div", {class: "card"});
    card.append(el("div", {class: "empty", style: "text-align:left"},
      el("div", {style: "font-size:13.5px;color:var(--fg2);margin-bottom:10px"}, "A project finishes. A routine comes back. A template makes projects."),
      ...GROUPS.map(g => el("div", {style: "margin:8px 0"},
        el("div", {}, g.icon + "  " + g.label),
        el("div", {style: "color:var(--fg3);font-size:12.5px;line-height:1.5"}, g.blurb)))));
    c.append(section("Routines & lists", null, card, head));
    return c;
  }

  let first = true;
  for (const g of GROUPS) {
    const mine = lists.filter(g.test);
    if (!mine.length) continue;
    const card = el("div", {class: "card"});
    card.append(el("div", {class: "listblurb"}, g.blurb));
    for (const pth of mine) {
      const items = flattenBlocks(getPage(pth).blocks).length;
      card.append(el("div", {class: "prow"},
        el("span", {class: "st " + (isProjectTemplate(pth) ? "st-1" : "st-2")}, g.icon),
        el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(pth)}, pageTitle(pth)),
        isRoutine(pth) ? el("span", {class: "chip"}, cadenceOf(pth)) : null,
        el("span", {class: "sub"}, items + (items === 1 ? " step" : " steps")),
        el("button", {class: "btn sm primary", onclick: () => openRunChecklist(pth)}, g.cta)));
    }
    c.append(section(g.label, mine.length, card, first ? head : null));
    first = false;
  }
  return c;
}

/* Flat todo list, grouped by project -- the simple-mode workhorse. */
function viewTodos() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const acts = leafActions().filter(a => OPEN_STATES[a.state]);
  c.append(el("div", {class: "section"}, quickAdd(ensureJournal(todayISO()), {placeholder: "Add a task to today"})));
  const tip = tipCard();
  if (tip) c.append(tip);

  const byProject = new Map();
  for (const a of acts) {
    const key = a.project || "No project";
    if (!byProject.has(key)) byProject.set(key, []);
    byProject.get(key).push(a);
  }
  if (!acts.length) c.append(section("Todos", 0, taskCard([], "Nothing open. Add one above.")));
  for (const [name, items] of Array.from(byProject.entries()).sort((x, y) => x[0].localeCompare(y[0]))) {
    items.sort((x, y) => (x.added || "9999").localeCompare(y.added || "9999"));
    c.append(section(name, items.length, taskCard(items)));
  }
  return c;
}

/* My day: what is actually on the hook today. */
function viewMyDay() {
  const c = el("div", {class: "wrap"});
  const path = ensureJournal(todayISO());
  const coach = coachStrip();
  if (coach) c.append(coach);
  c.append(el("div", {class: "section"}, quickAdd(path, {placeholder: "Add a task for today"})));
  // A suggestion, when there is one, takes the place of the hero card rather than
  // stacking on top of it: two things competing to be the next thing is neither.
  if (!coach) c.append(nudgeBar(), tipCard() || heroCard());

  const acts = leafActions();
  const due = acts.filter(a => a.group === "LATE" || a.group === "TODAY");
  if (due.length) c.append(section("Due", due.length, taskCard(due)));

  // A ticked task should not simply vanish: leave it here so the person can see
  // what they got done, and un-tick it if they were too quick.
  const closed = flattenBlocks(getPage(path).blocks)
    .filter(b => b.state && !OPEN_STATES[b.state])
    .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                due: dueDate(b), age: blockAge(b), added: addedDate(b),
                by: blockProp(b, "by"), doneBy: blockProp(b, "done_by"),
                missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)}));
  if (closed.length) c.append(section("Done today", closed.length, taskCard(closed)));

  // Below the fold: reference material, not the day's work. Both sections are
  // dropped entirely when there is nothing in them -- an empty box on the main
  // screen reads as a chore you have not done.
  const surfaced = state.context ? oldestTodosForContext(state.context) : [];
  if (surfaced.length) {
    c.append(section("Oldest in @" + state.context, surfaced.length, taskCard(surfaced),
      el("button", {class: "btn sm ghost", style: "margin-left:auto",
                    onclick: () => openContextPicker("Switch context", surfaceContext)}, "switch"),
      "quiet"));
  }

  const today = flattenBlocks(getPage(path).blocks)
    .filter(b => OPEN_STATES[b.state])
    .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                due: dueDate(b), age: blockAge(b), added: addedDate(b),
                missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)}));
  // While the coach is up this is the only thing on screen and the step it is
  // asking for, so it keeps its full weight until the newcomer is through.
  if (today.length) c.append(section("Captured today", today.length, taskCard(today), null, coach ? null : "quiet"));
  return c;
}


function navCount(id) {
  switch (id) {
    case "horizons":   return areaList().length || null;
    case "checklists": return checklistPages().length || null;
    case "todos":      return leafActions().filter(a => OPEN_STATES[a.state]).length;
    case "today":   return openTodoCount(journalPath());
    case "next":    return leafActions().filter(a => a.state !== "WAIT").length;
    case "context": return state.context ? oldestTodosForContext(state.context).length : contextList().length;
    case "agenda":  return agendaScan().reduce((n, [, l]) => n + l.length, 0);
    case "health":  return healthScan().length;
    case "review":  return stuckActiveProjects().length;
    default: {
      const m = /^proj-(.)$/.exec(id);
      if (m) return projectsIn(m[1]).length;
      return null;
    }
  }
}

/* During the first run the sidebar shows four things. The rest appears as soon
   as the coach is finished, rather than presenting a stranger with a filing
   system they have not filled in yet. */
const STARTER_NAV = ["today", "todos", "proj-1", "proj-0"];
function navVisible(item) {
  if (item.id === "weeding" && !weedingWorthIt()) return false;
  if (!coachOn() || !isSimple()) return true;
  // Making a routine mid-coach is allowed, and a place you were just sent to has
  // to be reachable afterwards.
  if (item.id === "checklists" && PREF.get("madeRoutine", "")) return true;
  return STARTER_NAV.includes(item.id);
}

function renderNav() {
  const sp = Spaces.get(Spaces.active);
  if (sp) {
    $("#spaceName").textContent = sp.name;
    const logo = $("#spaceLogo");
    const color = spaceColor(sp.name);
    logo.textContent = sp.name[0].toUpperCase();
    logo.style.background = color;
    logo.style.color = inkOn(color);        // a chosen colour can be any brightness
  }
  for (const b of $$("#modeSwitch button")) {
    b.classList.toggle("on", (b.dataset.mode === "simple") === isSimple());
    b.onclick = () => setMode(b.dataset.mode);
  }
  const nav = $("#nav");
  nav.textContent = "";
  for (const sec of NAV()) {
    const box = el("div", {class: "nav-group"});
    if (sec.group) box.append(el("h3", {}, sec.group));
    for (const it of sec.items) {
      if (!navVisible(it)) continue;
      const active = it.status ? (state.view === "projects" && state.statusCode === it.status)
                               : state.view === it.id;
      const count = navCount(it.id);
      const hot = (it.id === "health" || it.id === "review") && count > 0;
      box.append(el("button", {
        class: "nav-item" + (active ? " active" : ""),
        onclick: () => it.status ? go("projects", {statusCode: it.status}) : go(it.id),
      },
        el("span", {class: "ic"}, it.icon),
        el("span", {class: "lbl"}, it.label),
        count ? el("span", {class: "cnt" + (hot ? " hot" : "")}, String(count))
              : (it.key ? el("span", {class: "key"}, it.key) : null)
      ));
    }
    if (box.children.length > (sec.group ? 1 : 0)) nav.append(box);
  }
}

/* ============================================================
   100_RENDER -- shared pieces
   ============================================================ */
const NUDGE_RANK = {danger: 0, warn: 1, "": 2, ok: 3};

/* Everything that is true at once is not a to-do list, it is a telling-off. The
   few that matter stay on screen and the rest wait behind one chip, so a long
   list of small sins can never turn the top of the page into a wall of red. */
function nudgeBar() {
  const bar = el("div", {class: "nudgebar"});
  const all = computeNudges();
  const shown = all.slice()
    .sort((a, b) => (NUDGE_RANK[a.level || ""] ?? 2) - (NUDGE_RANK[b.level || ""] ?? 2))
    .slice(0, CFG.nudgeMax);
  for (const nd of shown) {
    bar.append(el("button", {
      class: "nudge " + (nd.level || ""),
      onclick: nd.act || (() => {}),
    }, nd.count != null ? el("b", {}, String(nd.count)) : null, nd.label));
  }
  const hidden = all.length - shown.length;
  const onlyClean = all.length === 1 && all[0].id === "clean";
  if (all.length && !onlyClean) {
    bar.append(el("button", {
      class: "nudge quieter",
      title: "What these are, why they are here, and how to quieten them",
      onclick: () => openNudgeExplainer(),
    }, hidden > 0 ? "+" + hidden + " more" : "why these?"));
  }
  return bar;
}

/* The nudges, explained and quietenable in the same breath. A prompt you cannot
   interrogate or turn down is a nag; the only convincing way to show this is not
   one is to put the off switch directly beside the reason. */
function openNudgeExplainer() {
  const all = computeNudges().filter(nd => nd.id !== "clean");
  const body = el("div", {});
  body.append(el("div", {class: "field"},
    el("div", {style: "color:var(--fg2);font-size:13px;line-height:1.55"},
      all.length
        ? "Each of these is your own list telling you something. Open one, or quieten it \u2014 " +
          "it comes back after " + CFG.nudgeSnoozeDays + " days, and only if it is still true."
        : "Nothing is nagging. This is the whole of what GroupTodo will ever bring up.")));
  for (const nd of all) {
    const sec = el("div", {class: "dash-sec"});
    sec.append(el("h4", {},
      el("span", {}, (nd.count != null ? nd.count + " " : "") + nd.label),
      el("span", {class: "n"}, nd.level === "danger" ? "worth doing now"
        : nd.level === "warn" ? "worth a look" : "whenever")));
    if (NUDGE_WHY[nd.id]) {
      sec.append(el("div", {style: "padding:2px 16px 4px;color:var(--fg2);font-size:13px;line-height:1.55"},
        NUDGE_WHY[nd.id]));
    }
    sec.append(el("div", {style: "display:flex;gap:6px;padding:6px 16px 10px;flex-wrap:wrap"},
      nd.act ? el("button", {class: "btn sm ghost", onclick: () => { closeModal(); nd.act(); }}, "open") : null,
      el("button", {class: "btn sm ghost", onclick: () => {
        quietNudge(nd.id);
        closeModal(); render(); openNudgeExplainer();
      }}, "quiet for " + CFG.nudgeSnoozeDays + " days")));
    body.append(sec);
  }
  body.append(el("div", {class: "field"},
    el("div", {style: "color:var(--fg3);font-size:12px;line-height:1.5"},
      "Under " + CFG.quietUntilTasks + " open tasks the method ones stay away entirely, at " +
      "most " + CFG.nudgeMax + " are ever on screen, and the first day has no weeding and no " +
      "review nag. None of this is counted, scored or sent anywhere \u2014 there is nowhere for " +
      "it to be sent.")));
  modal({
    title: "Why these are here", hint: "nudges, not nags",
    body,
    foot: [
      anyNudgeQuiet() ? el("button", {class: "btn ghost", onclick: () => {
        unquietAllNudges(); closeModal(); render(); notify("All nudges are back.");
      }}, "Bring back the quietened") : null,
      el("button", {class: "btn primary", onclick: closeModal}, "Done"),
    ].filter(Boolean),
  });
}

function heroCard() {
  const nb = nextBestAction();
  return el("div", {class: "hero"},
    el("h2", {}, "Next best move"),
    el("div", {style: "font-size:16px;font-weight:600;margin-bottom:2px"}, nb.title),
    el("p", {html: renderInline(nb.body)}),
    el("div", {class: "acts"},
      el("button", {class: "btn primary", onclick: nb.act}, nb.cta),
      el("button", {class: "btn ghost", onclick: () => openCapture()}, "Capture something"),
      el("button", {class: "btn ghost", onclick: () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx))},
        state.context ? "Context: " + state.context : "Set context")
    ));
}

/* With onCycle the badge is the control: one click per step, in place, instead of
   opening the action panel again for every state. */
function stateChip(st, onCycle) {
  if (!st) return null;              // a plain note carries no badge
  if (!onCycle) return el("span", {class: "state " + st}, st);
  return el("button", {
    class: "state btn " + st, title: "Cycle: TODO \u2192 DOING \u2192 WAIT \u2192 DONE",
    onclick: e => { e.stopPropagation(); onCycle(e.currentTarget); },
  }, st);
}

function chipsFor(a) {
  const out = [];
  if (a.context) out.push(el("span", {class: "chip ctx b", onclick: e => {e.stopPropagation(); surfaceContext(a.context);}}, "@" + a.context));
  if (a.project) out.push(el("span", {class: "chip proj b", onclick: e => {e.stopPropagation(); a.projectPath && openPageIn(a.space, a.projectPath);}}, a.project));
  if (a.due) {
    const cls = a.due < todayISO() ? "late" : a.due === todayISO() ? "today" : "";
    out.push(el("span", {class: "chip " + cls}, humanDate(a.due)));
  }
  if (a.age != null && a.age > 0) out.push(el("span", {class: "chip age"}, a.age + "d"));
  if (a.by && a.by !== whoAmI()) out.push(el("span", {class: "chip who"}, a.by));
  const quietChips = gtdQuiet();
  if (a.missingVerb && a.state === "TODO" && !quietChips)
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); openVerbPicker(a.path, a.block);}}, "no verb"));
  if (a.missingContext && a.state !== "WAIT" && !quietChips)
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); promptAndInsertContext(a.path, a.block);}}, "no context"));
  return out;
}

/* Context and project links are already chips on the row, so hide them
   from the title text. The outline view still shows them Logseq-style. */
function titleForRow(title) {
  return trim(String(title || "")
    .replace(/\[\[[_0123c]\/[^\]]+\]\]/g, "")
    .replace(/\s{2,}/g, " "));
}

function spaceBadge(name) {
  const sp = Spaces.get(name);
  if (!sp) return null;
  const color = spaceColor(name);
  return el("span", {class: "chip spacechip",
    style: "color:" + color + ";border-color:" + color + "55"}, name);
}

function taskRow(a) {
  // An action shown from another space must be edited IN that space, or the
  // change would be written through the active space's backend.
  const row = el("div", {
    class: "task" + (state.selected === a.block.id ? " sel" : ""),
    data: {state: a.state || "", id: a.block.id},
    onclick: () => inSpace(a.space, () => openTaskDetail(a.path, a.block, a.space)),
  },
    el("button", {
      class: "chk", title: "Toggle done",
      onclick: e => { e.stopPropagation();
        inSpace(a.space, () => setBlockState(a.path, a.block, a.state === "DONE" ? "TODO" : "DONE")); },
    }, "\u2713"),
    el("div", {class: "t-body"},
      el("div", {class: "t-title", html: renderInline(titleForRow(a.title))}),
      el("div", {class: "t-meta"}, stateChip(a.state, node => {
        keepFocus(idSel(".task", a.block.id, ".state"), node);
        inSpace(a.space, () => cycleState(a.path, a.block, {keepTask: true}));
      }),
        multiSpace() && a.space ? spaceBadge(a.space) : null, ...chipsFor(a))),
    el("div", {class: "t-act"},
      el("button", {class: "iconbtn", title: "Waiting for",
        onclick: e => {e.stopPropagation(); inSpace(a.space, () => setBlockState(a.path, a.block, "WAIT"));}}, "\u23F8"),
      el("button", {class: "iconbtn", title: "Refile to a project",
        onclick: e => {e.stopPropagation(); inSpace(a.space, () => openRefile(a.path, a.block));}}, "\u21AA"),
      el("button", {class: "iconbtn", title: "Open page",
        onclick: e => {e.stopPropagation(); openPageIn(a.space, a.path);}}, "\u2197"))
  );
  return row;
}

/* Opening a page from another space switches to it, so the outliner, saves
   and backlinks all operate where that page actually lives. */
function openPageIn(space, path) {
  if (space && space !== Spaces.active) { openSpace(space).then(() => openPage(path)); return; }
  openPage(path);
}

function taskCard(actions, emptyText) {
  const card = el("div", {class: "card"});
  if (!actions.length) card.append(el("div", {class: "empty"}, emptyText || "Nothing here."));
  else actions.forEach(a => card.append(taskRow(a)));
  return card;
}

function section(title, count, node, extra, cls) {
  return el("div", {class: cls ? "section " + cls : "section"},
    el("h3", {}, title, count != null ? el("span", {class: "n"}, String(count)) : null, extra || null),
    node);
}
</script>
<script>
/* ============================================================
   105_OUTLINER -- the Logseq half of the app
   Keys: Enter new block, Tab/Shift-Tab indent, Ctrl-Enter cycle state,
         Backspace on an empty block deletes it.
   ============================================================ */
function siblingsOf(page, block) {
  let found = null;
  const rec = list => {
    if (list.includes(block)) { found = list; return; }
    list.forEach(b => rec(b.children || []));
  };
  rec(page.blocks);
  return found || page.blocks;
}
function parentOf(page, block) {
  let par = null;
  walkBlocks(page.blocks, (b, p) => { if (b === block) par = p; });
  return par;
}

function focusBlock(id, atEnd = true) {
  requestAnimationFrame(() => {
    if ($("#modalRoot").firstChild) return;   // a picker opened on the way; it owns the keys
    const node = $(`.blk[data-id="${id}"] .txt`);
    if (!node) return;
    node.focus();
    const r = document.createRange(), s = getSelection();
    r.selectNodeContents(node); r.collapse(!atEnd);
    s.removeAllRanges(); s.addRange(r);
  });
}

function outlineBlock(path, page, b) {
  const kids = b.children || [];
  const node = el("div", {class: "blk" + (kids.length ? " has-kids" : "") + (b.collapsed ? " collapsed" : ""), data: {id: b.id}});
  const line = el("div", {class: "line"});

  line.append(el("span", {
    class: "bullet", title: kids.length ? "Collapse / expand" : "",
    onclick: () => { if (kids.length) { b.collapsed = !b.collapsed; render(); } },
  }));
  // Always a target here, so a plain note can become a task and a task can stop
  // being one, both by clicking the same place.
  line.append(el("button", {
    class: "state " + (b.state || "none"),
    title: b.state ? "Cycle state, then back to a plain note" : "Make this a task",
    onclick: e => {
      keepFocus(idSel(".blk", b.id, ".state"), e.currentTarget);
      cycleState(path, b);
    },
  }, b.state || "\u00B7"));

  const txt = el("div", {
    class: "txt", contenteditable: "true", spellcheck: "false",
    html: renderInline(b.title),
  });
  // Clicking a [[link]] must follow it, not drop into the editor. Focus would
  // replace this line with its raw text and destroy the span mid-click, so
  // refuse focus for that one gesture and let the delegated handler navigate.
  txt.addEventListener("mousedown", e => {
    if (e.target.closest("[data-link]")) e.preventDefault();
  });
  txt.addEventListener("focus", () => { txt.textContent = b.title; });
  txt.addEventListener("blur", () => {
    const val = txt.textContent.replace(/\n/g, " ");
    if (val !== b.title) {
      const [st, rest] = splitState(val);
      if (st) { b.state = st; b.title = rest; } else { b.title = val; }
      touch(path); noteTodoTouched();
      renderNav();
    }
    txt.innerHTML = renderInline(b.title);
  });
  txt.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); txt.blur();
      const sibs = siblingsOf(page, b);
      const nb = newBlock({state: b.state && OPEN_STATES[b.state] ? "TODO" : null});
      if (nb.state) { nb.props.Added = "[[" + todayISO() + "]]"; stampAuthor(nb); }
      sibs.splice(sibs.indexOf(b) + 1, 0, nb);
      touch(path); render(); focusBlock(nb.id);
    } else if (e.key === "Tab") {
      e.preventDefault(); txt.blur();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      if (e.shiftKey) {
        const par = parentOf(page, b);
        if (par) {
          const gsibs = siblingsOf(page, par);
          sibs.splice(i, 1);
          gsibs.splice(gsibs.indexOf(par) + 1, 0, b);
          touch(path); render(); focusBlock(b.id);
        }
      } else if (i > 0) {
        const prev = sibs[i - 1];
        sibs.splice(i, 1);
        (prev.children || (prev.children = [])).push(b);
        prev.collapsed = false;
        touch(path); render(); focusBlock(b.id);
      }
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      // Back into the same line afterwards, so ctrl-enter twice means two steps.
      e.preventDefault(); txt.blur(); cycleState(path, b); focusBlock(b.id);
    } else if (e.key === "Backspace" && txt.textContent === "" && !(b.children || []).length) {
      e.preventDefault();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      const prev = i > 0 ? sibs[i - 1] : null;
      sibs.splice(i, 1);
      touch(path); render();
      if (prev) focusBlock(prev.id);
    } else if (e.key === "Escape") {
      txt.blur();
    }
  });
  line.append(txt);
  line.append(el("button", {
    class: "iconbtn", title: "Task actions",
    onclick: () => openTaskDetail(path, b),
  }, "⋯"));
  node.append(line);

  const props = Object.entries(b.props || {}).filter(([k]) => k.toLowerCase() !== "id");
  if (props.length) {
    node.append(el("div", {class: "props", html: props.map(([k, v]) => esc(k) + ":: " + renderInline(v)).join("  ·  ")}));
  }
  for (const l of b.body || []) if (trim(l)) node.append(el("div", {class: "bodyline", html: renderInline(l)}));

  if (!b.collapsed) for (const k of kids) node.append(outlineBlock(path, page, k));
  return node;
}

function outlineFor(path) {
  const page = getPage(path);
  const box = el("div", {class: "card"});
  const outline = el("div", {class: "outline"});
  if (!page.blocks.length) page.blocks.push(newBlock({title: ""}));
  for (const b of page.blocks) outline.append(outlineBlock(path, page, b));
  box.append(outline);
  box.append(el("button", {
    class: "dash-item", onclick: () => {
      const nb = newBlock({title: ""});
      page.blocks.push(nb); touch(path); render(); focusBlock(nb.id);
    },
  }, "+ new block"));
  return box;
}

/* ============================================================
   110_VIEWS
   ============================================================ */
function viewToday() {
  const path = ensureJournal(todayISO());
  const page = getPage(path);
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar(), heroCard());

  const due = acts.filter(a => a.group === "LATE" || a.group === "TODAY");
  if (due.length) c.append(section("Due", due.length, taskCard(due)));

  c.append(section("Today's journal", null, outlineFor(path),
    el("span", {style: "margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0"}, humanDate(todayISO()))));

  // The journal is the point of this screen. The context surface sits under it,
  // faded, and only when it actually has something to offer.
  const surfaced = state.context ? oldestTodosForContext(state.context) : [];
  if (surfaced.length) {
    c.append(section("Oldest in @" + state.context, surfaced.length, taskCard(surfaced),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => openContextPicker("Switch context", ctx => surfaceContext(ctx))}, "switch"),
      "quiet"));
  }

  const prev = journalPath(shiftISO(todayISO(), -1));
  c.append(el("div", {class: "section", style: "display:flex;gap:8px"},
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), -1)))}, "← yesterday"),
    V.pages.has(prev) ? null : null,
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), 1)))}, "tomorrow →")));
  return c;
}

function viewNext() {
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  for (const g of GROUPS) {
    const items = acts.filter(a => a.group === g);
    if (!items.length) continue;
    items.sort((x, y) => (x.added || "9999").localeCompare(y.added || "9999"));
    c.append(section(GROUP_META[g].label, items.length, taskCard(items)));
  }
  if (!acts.length) c.append(section("Next actions", 0, taskCard([], "No open actions. Capture something, or check your projects.")));
  return c;
}

function viewContext() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const ctxs = contextList();
  if (state.context) {
    const items = oldestTodosForContext(state.context, 99);
    c.append(section("@" + state.context, items.length,
      taskCard(items.slice(0, CFG.surfaceCount), "Nothing open here."),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => { state.context = null; render(); }}, "clear")));
    if (items.length > CFG.surfaceCount) {
      c.append(section("Rest of @" + state.context, items.length - CFG.surfaceCount, taskCard(items.slice(CFG.surfaceCount))));
    }
  }
  const card = el("div", {class: "card"});
  if (!ctxs.length) card.append(el("div", {class: "empty"}, "No contexts yet. Create pages under pages/c/ — e.g. c/phone, c/errand, c/computer."));
  for (const ctx of ctxs) {
    const open = leafActions().filter(a => a.context === ctx && OPEN_STATES[a.state]);
    card.append(el("button", {class: "prow", onclick: () => surfaceContext(ctx)},
      el("span", {class: "st st-1"}, "@"),
      el("span", {class: "nm"}, ctx),
      el("span", {class: "sub"}, open.length + " open")));
  }
  c.append(section("All contexts", ctxs.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newContextPrompt()}, "+ new")));
  return c;
}

function viewAgenda() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const days = agendaScan();
  if (!days.length) {
    c.append(section("Next " + CFG.agendaDays + " days", 0,
      taskCard([], "Nothing scheduled. Add SCHEDULED:: [[date]] or DEADLINE:: [[date]] to an action.")));
  }
  for (const [date, items] of days) {
    const label = date === todayISO() ? date + "  (today)" : date < todayISO() ? date + "  (overdue)" : date;
    c.append(section(label + " · " + humanDate(date), items.length, taskCard(items)));
  }
  return c;
}

function viewProjects() {
  const code = state.statusCode;
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const rows = projectsInVisible(code);
  const stuck = new Set(stuckActiveProjects().map(x => x.path));
  const card = el("div", {class: "card"});
  if (!rows.length) card.append(el("div", {class: "empty"}, "No " + STATUS_LABEL[code].toLowerCase() + " projects."));
  const titleOf = r => inSpace(r.space, () => pageTitle(r.path));
  rows.sort((x, y) => titleOf(x).localeCompare(titleOf(y)));
  for (const {path: p, space} of rows) {
    const info = inSpace(space, () => ({
      title: pageTitle(p), open: openTodoCount(p),
      reviewed: dateIn(getPage(p)?.props?.reviewed),
    }));
    const idle = info.reviewed ? dateDiffDays(info.reviewed, todayISO()) : null;
    card.append(el("div", {class: "prow"},
      el("button", {class: "st st-" + code, title: STATUS_TEXT[code],
        onclick: () => inSpace(space, () => openStatusPicker(p))}, code),
      el("button", {class: "nm", style: "text-align:left", onclick: () => openPageIn(space, p)}, info.title),
      multiSpace() ? spaceBadge(space) : null,
      (stuck.has(p) && space === Spaces.active)
        ? el("span", {class: "chip miss b", onclick: () => openAddNextAction(p)}, "no next action") : null,
      info.open ? el("span", {class: "chip"}, info.open + " open") : null,
      idle != null ? el("span", {class: "chip age"}, "reviewed " + idle + "d ago") : null,
      el("button", {class: "iconbtn", title: "Change status",
        onclick: () => inSpace(space, () => openStatusPicker(p))}, "⇄")));
  }
  c.append(section(STATUS_LABEL[code] + " projects", rows.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newProjectPrompt()}, "+ new project")));
  return c;
}

function viewPages(filterFn, title, mkNew) {
  const c = el("div", {class: "wrap"});
  const paths = allPages(filterFn).sort((a, b) => pageTitle(a).localeCompare(pageTitle(b)));
  const card = el("div", {class: "card"});
  if (!paths.length) card.append(el("div", {class: "empty"}, "Nothing here yet."));
  for (const p of paths) {
    card.append(el("button", {class: "prow", onclick: () => openPage(p)},
      el("span", {class: "st st-2"}, pageRef(p).split("/")[0].slice(0, 1)),
      el("span", {class: "nm"}, pageTitle(p)),
      el("span", {class: "sub"}, p)));
  }
  c.append(section(title, paths.length, card,
    mkNew ? el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: mkNew}, "+ new") : null));
  return c;
}

function viewHealth() {
  const issues = healthScan();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const byType = new Map();
  for (const i of issues) { if (!byType.has(i.type)) byType.set(i.type, []); byType.get(i.type).push(i); }
  if (!issues.length) c.append(section("Health", 0, el("div", {class: "card"}, el("div", {class: "empty"}, "System healthy."))));
  for (const [type, items] of byType) {
    const card = el("div", {class: "card"});
    for (const i of items) {
      card.append(el("button", {class: "dash-item", onclick: () => openPage(i.path)},
        el("span", {}, i.text), el("span", {class: "p"}, i.path)));
    }
    c.append(section(type.replace(/-/g, " "), items.length, card));
  }
  const dupes = duplicateProjects();
  if (dupes.length) {
    const card = el("div", {class: "card"});
    for (const d of dupes) {
      card.append(el("div", {class: "dash-item"}, el("b", {}, d.slug), el("span", {class: "p"}, d.paths.length + " copies")));
      for (const p of d.paths) {
        card.append(el("div", {class: "prow"},
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(p)}, p),
          el("span", {class: "sub"}, openTodoCount(p) + " open"),
          el("button", {class: "btn sm ghost", onclick: () => {
            d.paths.filter(x => x !== p).forEach(x => mergePages(x, p));
            render();
          }}, "keep this, merge rest")));
      }
    }
    c.append(section("duplicate projects", dupes.length, card));
  }
  return c;
}

function viewPage() {
  const path = state.pagePath;
  if (!path || !V.pages.has(path)) { state.view = "today"; return viewToday(); }
  const page = getPage(path);
  const c = el("div", {class: "wrap"});
  const horizon = isHorizonPage(path);
  const code = horizon ? null : statusDirOf(path);

  const meta = el("div", {class: "nudgebar"});
  if (horizon) {
    const h = HORIZONS.find(x => x.page === baseName(path));
    meta.append(el("button", {class: "nudge", onclick: () => go("horizons")},
      el("b", {}, h ? h.alt : "horizon"), h ? h.h + " \u00B7 " + h.name : "horizon"));
  }
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openStatusPicker(path)}, el("b", {}, code), STATUS_LABEL[code]));
  for (const [k, v] of Object.entries(page.props || {})) {
    if (k === "title") continue;
    if (k === "updated") {
      meta.append(el("span", {class: "nudge"}, "changed " + formatStamp(v)));
      continue;
    }
    meta.append(el("span", {class: "nudge", html: esc(k) + ":: " + renderInline(v)}));
  }
  if (pageKind(path) === "checklist") {
    const tpl = isProjectTemplate(path);
    meta.append(el("button", {class: "nudge" + (tpl ? " ok" : ""),
      onclick: () => { setChecklistKind(path, tpl ? null : "project"); render(); }},
      tpl ? "project template" : "simple checklist"));
    meta.append(el("button", {class: "nudge", onclick: () => openRunChecklist(path)},
      tpl ? "new project from this" : "run this"));
  }
  meta.append(el("button", {class: "nudge", onclick: () => { updateReviewed(path); render(); }}, "mark reviewed"));
  if (code) meta.append(el("button", {class: "nudge" + (outcomeOf(path) ? "" : " warn"),
    onclick: () => openOutcomePrompt(path)},
    outcomeOf(path) ? "outcome: " + outcomeOf(path) : "no outcome stated"));
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openAreaPicker(path)},
    areaOfProject(path) ? "area: " + areaOfProject(path) : "no area"));
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openAddNextAction(path)}, "+ next action"));
  c.append(meta);

  if (isSimple() && pageKind(path) !== "journal") {
    // Rows and a quick-add box, rather than the outliner.
    c.append(el("div", {class: "section"}, quickAdd(path)));
    const rows = flattenBlocks(page.blocks)
      .filter(b => b.state)
      .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                  due: dueDate(b), age: blockAge(b), added: addedDate(b),
                  missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)}));
    const open = rows.filter(r => OPEN_STATES[r.state]);
    const done = rows.filter(r => !OPEN_STATES[r.state]);
    c.append(section("To do", open.length, taskCard(open, "No open steps. Add one above.")));
    if (done.length) c.append(section("Done", done.length, taskCard(done)));
    const notes = page.blocks.filter(b => !b.state && trim(b.title));
    if (notes.length) {
      const card = el("div", {class: "card"});
      for (const b of notes) {
        card.append(el("button", {class: "dash-item", title: "Open \u2014 you can make this a task",
          onclick: () => openTaskDetail(path, b)}, el("span", {html: renderInline(b.title)})));
      }
      c.append(section("Notes", notes.length, card));
    }
  } else {
    c.append(el("div", {class: "section"}, outlineFor(path)));
  }

  const back = isSimple() ? [] : backlinksTo(path);
  const card = el("div", {class: "card"});
  if (!back.length) card.append(el("div", {class: "empty"}, "No backlinks."));
  for (const h of back) {
    card.append(el("button", {class: "dash-item", onclick: () => openPage(h.path)},
      el("span", {html: renderInline(h.block.title || "(block)")}), el("span", {class: "p"}, h.path)));
  }
  if (!isSimple()) c.append(section("Linked references", back.length, card));

  c.append(el("div", {class: "section", style: "display:flex;gap:8px;flex-wrap:wrap"},
    isJournalPath(path) ? null
      : el("button", {class: "btn sm ghost", onclick: () => openExportPage(path)}, "share"),
    el("button", {class: "btn sm ghost", onclick: () => renamePrompt(path)}, "rename"),
    el("button", {class: "btn sm ghost", onclick: () => movePrompt(path)}, "move"),
    el("button", {class: "btn sm ghost", onclick: () => deletePrompt(path)}, "delete")));
  return c;
}

function viewSearch() {
  const q = trim(state.query).toLowerCase();
  const c = el("div", {class: "wrap"});
  const box = el("div", {class: "filterbox", style: "padding:14px 0"},
    el("input", {
      placeholder: "Search every block and page...", value: state.query,
      oninput: e => { state.query = e.target.value; clearTimeout(window.__sq); window.__sq = setTimeout(render, 160); },
    }));
  c.append(box);
  if (!q) { c.append(el("div", {class: "empty"}, "Type to search.")); return c; }
  const hits = acrossSpaces(() => {
    const found = [];
    for (const [path, page] of V.pages) {
      if (pageTitle(path).toLowerCase().includes(q)) found.push({path, block: null});
      walkBlocks(page.blocks, b => {
        const text = [b.title, ...(b.body || [])].join(" ").toLowerCase();
        if (text.includes(q)) found.push({path, block: b});
      });
    }
    return found;
  });
  const card = el("div", {class: "card"});
  if (!hits.length) card.append(el("div", {class: "empty"}, "No matches."));
  for (const h of hits.slice(0, 300)) {
    const label = inSpace(h.space, () => h.block ? h.block.title : pageTitle(h.path));
    card.append(el("button", {class: "dash-item",
      onclick: () => h.block ? inSpace(h.space, () => openTaskDetail(h.path, h.block, h.space))
                             : openPageIn(h.space, h.path)},
      h.block ? stateChip(h.block.state) : null,
      el("span", {html: renderInline(label)}),
      multiSpace() && h.space ? spaceBadge(h.space) : null,
      el("span", {class: "p"}, h.path)));
  }
  c.append(section("Results", hits.length, card));
  return c;
}

/* ============================================================
   115_RENDER dispatcher
   ============================================================ */
const VIEW_TITLE = {
  today: "Today", next: "Next actions", context: "Context", agenda: "Agenda",
  todos: "Todos", horizons: "Horizons of focus", checklists: "Routines & lists",
  projects: "Projects", zettel: "Zettel", pages: "All pages", "journal-list": "Journals",
  health: "Health check", search: "Search", page: "Page",
};

function render() {
  if (!V.loaded) return;
  QUIET_CACHE = null;
  renderNav();
  const c = $("#content");
  c.textContent = "";
  let node;
  switch (state.view) {
    case "today":   node = isSimple() ? viewMyDay() : viewToday(); break;
    case "todos":   node = viewTodos(); break;
    case "horizons":
      node = viewHorizons();
      if (!getSetting("horizons_seen")) setTimeout(() => openHorizonsWizard(0), 180);
      break;
    case "checklists": node = viewChecklists(); break;
    case "next":    node = viewNext(); break;
    case "context": node = viewContext(); break;
    case "agenda":  node = viewAgenda(); break;
    case "projects":node = viewProjects(); break;
    case "health":  node = viewHealth(); break;
    case "search":  node = viewSearch(); break;
    case "page":    node = viewPage(); break;
    case "zettel":  node = viewPages(p => p.startsWith(DIRS.zettel + "/"), "Zettel notes", () => newZettelPrompt()); break;
    case "journal-list": node = viewPages(p => isJournalPath(p), "Journals"); break;
    case "pages":   node = viewPages(p => !isJournalPath(p) && pageKind(p) !== "verb", "All pages"); break;
    case "review":  node = isSimple() ? viewMyDay() : viewToday(); openReview(0); break;
    case "weeding": node = isSimple() ? viewMyDay() : viewToday(); openWeeding(); break;
    default:        node = isSimple() ? viewMyDay() : viewToday();
  }
  c.append(node);
  if (isSimple() && state.view === "today") VIEW_TITLE.today = "My day";
  else VIEW_TITLE.today = "Today";
  $("#hTitle").textContent = state.view === "page" ? pageTitle(state.pagePath)
    : state.view === "projects" ? STATUS_LABEL[state.statusCode] + " projects"
    : (VIEW_TITLE[state.view] || "Today");
  const vis = visibleSpaces();
  $("#hSub").textContent = vis.length > 1 ? vis.join(" + ")
    : state.view === "page" ? state.pagePath
    : state.context && ["today", "context", "next"].includes(state.view) ? "@" + state.context : "";
  applyRefocus();
}

/* wiki links are delegated */
$("#content").addEventListener("click", e => {
  const link = e.target.closest("[data-link]");
  if (link) { e.stopPropagation(); followLink(link.dataset.link); }
});

<script>
/* ============================================================
   120_MODALS
   Port of: init.lua 80_RENDER_ENGINE (open_scratch + letter keys)
   The bottom-split scratch buffers become bottom sheets; the a-z
   selection keys from open_context_picker are kept exactly.
   ============================================================ */
let MODAL_KEYS = null;

function modal({title, hint, body, foot, center = false, onKey = null}) {
  closeModal();
  const sheet = el("div", {class: "modal"},
    el("header", {}, el("h2", {}, title), el("div", {style: "flex:1"}),
      hint ? el("span", {class: "hint"}, hint) : null,
      el("button", {class: "iconbtn", onclick: closeModal}, "✕")),
    el("div", {class: "body"}, body),
    foot ? el("div", {class: "foot"}, foot) : null);
  const scrim = el("div", {class: "scrim" + (center ? " center" : ""), onclick: e => { if (e.target === scrim) closeModal(); }}, sheet);
  $("#modalRoot").append(scrim);
  MODAL_KEYS = onKey;
  return {close: closeModal, root: sheet};
}
function closeModal() {
  $("#modalRoot").textContent = "";
  MODAL_KEYS = null;
}
function pickRow(key, label, detail, onclick) {
  return el("button", {class: "pick", onclick},
    el("span", {class: "k"}, key), el("span", {}, label),
    detail ? el("span", {class: "d"}, detail) : null);
}

/* Generic list picker with a-z single-key selection. */
function listPicker({title, hint, items, label, detail, onPick, footer}) {
  const letters = "abcdefghijklmnopqrstuvwxyz";
  let filtered = items.slice();
  const body = el("div", {});
  const list = el("div", {});
  const input = el("input", {
    placeholder: "filter...",
    oninput: e => { const q = e.target.value.toLowerCase();
      filtered = items.filter(i => label(i).toLowerCase().includes(q)); draw(); },
  });
  body.append(el("div", {class: "filterbox"}, input), list);
  function draw() {
    list.textContent = "";
    if (!filtered.length) list.append(el("div", {class: "empty"}, "No matches."));
    filtered.forEach((it, i) => {
      const key = i < 26 ? letters[i] : String(i + 1);
      list.append(pickRow(key, label(it), detail ? detail(it) : null, () => { closeModal(); onPick(it); }));
    });
  }
  draw();
  modal({
    title, hint: hint || "letter selects · esc cancels", body,
    foot: footer,
    onKey: e => {
      if (document.activeElement === input && e.key.length === 1) return false;
      const i = letters.indexOf(e.key);
      if (i >= 0 && i < filtered.length) { closeModal(); onPick(filtered[i]); return true; }
      return false;
    },
  });
  // Deliberately NOT focused: a-z must select a row, exactly like the
  // letter-key context picker in the Neovim config. Tap the box to filter.
}

function promptInput({title, label, value = "", placeholder = "", multiline = false, cta = "Save", onSave}) {
  const input = multiline
    ? el("textarea", {placeholder})
    : el("input", {placeholder, value});
  if (multiline) input.value = value;
  const save = () => { const v = trim(input.value); closeModal(); if (v) onSave(v); };
  modal({
    center: true, title,
    body: el("div", {class: "field"}, el("label", {}, label), input),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: save}, cta)],
    onKey: e => {
      if (e.key === "Enter" && (!multiline || e.ctrlKey || e.metaKey)) { save(); return true; }
      return false;
    },
  });
  setTimeout(() => input.focus(), 30);
}

function newContextPrompt(onPick) {

function insertContextLink(path, block, ctx) {
  if (hasContextLink(block.title)) { notify("Already has a context"); return; }
  block.title = trim(block.title) + " [[c/" + ctx + "]]";
  touch(path);
  render();
}

function promptAndInsertContext(path, block) {
  openContextPicker("Pick a context for this action", ctx => {
    insertContextLink(path, block, ctx);
    checkProjectCompletion(path);
  });
}

/* Surface the 3 oldest actions in a context -- the core nudge loop. */
function surfaceContext(ctx) {
  state.context = ctx;
  state.lastTodoTouch = Date.now();
  const items = oldestTodosForContext(ctx);
  state.surfaced = items.map(a => a.block.id);
  setSetting("current_context", ctx);
  go("today");
  notify(items.length
    ? `@${ctx}: ${items.length} oldest action(s) surfaced.`
    : `@${ctx}: nothing open here. Capture one?`);
}

   Port of: init.lua suggest_phys_viz_verb
   ============================================================ */
function seedVerbs() {
  for (const [lang, verbs] of Object.entries(SEED_VERBS)) {
    for (const [canonical, syns] of Object.entries(verbs)) {
      const p = join(DIRS.verbs, lang, canonical + ".md");
      if (V.pages.has(p)) continue;
      putPage(p, {
        props: {title: canonical, type: "verb", lang},
        blocks: [newBlock({title: canonical + " = " + canonical}),
                 ...syns.map(x => newBlock({title: x + " = " + canonical}))],
      });
    }
  }
  scanVerbs();
  notify("Installed " + Object.keys(VERB_CANON).length + " verbs under pages/verbs/.");
}

function openVerbPicker(path, block) {
  const verbs = verbList();
  if (!verbs.length) {
    modal({
      center: true, title: "No verb lexicon yet",
      body: el("div", {class: "field"},
        el("label", {}, "The Phys-Viz rule"),
        el("div", {style: "color:var(--fg2);font-size:13.5px"},
          "A next action should start with a verb a camera could film: Call, Draft, Buy. " +
          "Verbs live in pages/verbs/<lang>/<verb>.md, one \u201Csynonym = verb\u201D per line.")),
      foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Not now"),
             el("button", {class: "btn primary", onclick: () => { closeModal(); seedVerbs(); openVerbPicker(path, block); }},
               "Install starter verbs")],
    });
    return;
  }
  listPicker({
    title: "Make it physical and visible",
    hint: "what would a camera see you doing?",
    items: verbs,
    label: v => v.canonical.charAt(0).toUpperCase() + v.canonical.slice(1),
    detail: v => v.lang,
    onPick: v => {
      const verb = v.canonical.charAt(0).toUpperCase() + v.canonical.slice(1);
      if (!startsWithVerb(block.title)) block.title = verb + " " + block.title;
      if (!block.state) block.state = "TODO";
      touch(path); render();
    },
  });
}

/* Clarify: make it a TODO, give it a verb, give it a context. */
function clarifyBlock(path, block) {
  if (!block.state) setBlockState(path, block, "TODO", {skipContext: true});
  if (!startsWithVerb(block.title)) { openVerbPicker(path, block); return; }
  if (!hasContextLink(block.title)) { promptAndInsertContext(path, block); return; }
  notify("Looks executable: physical verb + context.");
}

/* ============================================================
   135_CAPTURE / REFILE / DETAIL
   ============================================================ */
function openCapture() {
  const path = ensureJournal(todayISO());
  const input = el("textarea", {placeholder: "What just landed? One line per item."});
  let asTodo = true, ctx = state.context;
  const ctxBtn = el("button", {class: "btn ghost sm", onclick: () => {
    openContextPicker("Context for capture", c => { ctx = c; openCaptureWith(input.value, asTodo, c); });
  }}, ctx ? "@" + ctx : "no context");
  const todoBtn = el("button", {class: "btn ghost sm", onclick: () => {
    asTodo = !asTodo; todoBtn.textContent = asTodo ? "TODO" : "note";
    todoBtn.classList.toggle("primary", asTodo);
  }}, "TODO");
  todoBtn.classList.add("primary");

  const save = () => {
    const lines = input.value.split("\n").map(trim).filter(Boolean);
    closeModal();
    if (!lines.length) return;
    const page = getPage(path);
    for (const line of lines) {
      const [st, rest] = splitState(line);
      const title = (st ? rest : line) + (asTodo && ctx && !hasContextLink(line) ? " [[c/" + ctx + "]]" : "");
      const blk = newBlock({state: st || (asTodo ? "TODO" : null), title});
      if (blk.state) { blk.props.Added = "[[" + todayISO() + "]]"; stampAuthor(blk); }
      page.blocks.push(blk);
    }
    touch(path); noteTodoTouched();
    notify(lines.length + " captured to today's journal.");
    go("today");
  };
  modal({
    center: true, title: "Capture", hint: "ctrl+enter saves",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Into " + journalPath()), input),
      el("div", {class: "field"}, el("label", {}, "Capture as"), el("div", {class: "seg"}, todoBtn, ctxBtn))),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: save}, "Capture")],
    onKey: e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); return true; } return false; },
  });
  setTimeout(() => input.focus(), 30);
}
function openCaptureWith(text, asTodo, ctx) { state.context = ctx; openCapture(); }

function openTaskDetail(path, block, space) {
  state.selected = block.id;
  const a = {
    path, block, state: block.state, title: block.title,
    context: contextOf(block.title), due: dueDate(block),
    age: blockAge(block), added: addedDate(block),
  };
  const titleInput = el("textarea", {}); titleInput.value = block.title;
  const notes = el("textarea", {placeholder: "Notes"}); notes.value = (block.body || []).join("\n");
  const sched = el("input", {type: "date", value: dateIn(blockProp(block, "SCHEDULED")) || ""});
  const dead  = el("input", {type: "date", value: dateIn(blockProp(block, "DEADLINE")) || ""});

  // Picking a state leaves the panel open: moving TODO -> DOING -> WAIT used to
  // cost one trip through the panel per step, because the first pick closed it.
  // The last entry is the way back out: stop being a task, keep the words.
  const seg = el("div", {class: "seg"});
  const stateBtns = [];
  for (const st of [...TODO_STATES, null]) {
    const btn = el("button", {
      title: st ? null : "Keep the text as a plain note",
      onclick: () => {
        if ((block.state ?? null) === st) return;
        setBlockState(path, block, st);
        syncPanel();                 // the panel outlives the redraw; its badges must keep up
      },
    }, st || "Not a task");
    stateBtns.push([st, btn]);
    seg.append(btn);
  }

  // The trail is the one part of the panel a state change rewrites, so it is
  // built as a function rather than once.
  const trail = el("div", {style: "color:var(--fg2);font-size:12.5px;line-height:1.8"});
  const fillTrail = () => {
    trail.textContent = "";
    const age = blockAge(block);
    trail.append((blockProp(block, "by") ? "Added by " + blockProp(block, "by") : "Added") +
      (addedDate(block) ? " on " + addedDate(block) : "") +
      (age != null ? " \u00B7 " + age + " days ago" : ""));
    const raw = blockProp(block, "done_by");
    if (raw) {
      const {who, iso} = splitStamp(raw);
      trail.append(el("div", {}, "Closed by " + (who || "someone") + (iso ? " \u00B7 " + formatStamp(iso) : "")));
    }
  };
  const syncPanel = () => {
    for (const [st, btn] of stateBtns) btn.className = (block.state ?? null) === st ? "on" : "";
    fillTrail();
  };
  syncPanel();

  const save = () => {
    const val = trim(titleInput.value).replace(/\n/g, " ");
    const [st, rest] = splitState(val);
    if (st) { block.state = st; block.title = rest; } else { block.title = val; }
    block.body = notes.value.split("\n");
    while (block.body.length && !trim(block.body[block.body.length - 1])) block.body.pop();
    if (sched.value) setBlockProp(block, "SCHEDULED", "[[" + sched.value + "]]");
    else if (blockProp(block, "SCHEDULED")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "scheduled")];
    if (dead.value) setBlockProp(block, "DEADLINE", "[[" + dead.value + "]]");
    else if (blockProp(block, "DEADLINE")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "deadline")];
    touch(path); noteTodoTouched(); closeModal(); render();
  };

  modal({
    title: "Action", hint: a.age != null ? "on your list " + a.age + " days" : "",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Title"), titleInput),
      el("div", {class: "field"}, el("label", {}, "State"), seg),
      el("div", {class: "field"}, el("label", {}, "GTD hygiene"), el("div", {class: "seg"},
        el("button", {onclick: () => { closeModal(); promptAndInsertContext(path, block); }},
          a.context ? "@" + a.context : "add context"),
        el("button", {onclick: () => { closeModal(); openVerbPicker(path, block); }},
          startsWithVerb(block.title) ? "verb ok" : "add physical verb"),
        el("button", {onclick: () => { closeModal(); openRefile(path, block); }}, "refile"),
      )),
      el("div", {class: "grid2"},
        el("div", {class: "field"}, el("label", {}, "Scheduled"), sched),
        el("div", {class: "field"}, el("label", {}, "Deadline"), dead)),
      el("div", {class: "field"}, el("label", {}, "Notes"), notes),
      el("div", {class: "field"}, el("label", {}, "Trail"), trail),
      el("div", {class: "field"}, el("label", {}, "Source"),
        el("button", {class: "btn ghost sm", onclick: () => { closeModal(); openPage(path); }}, path))),
    foot: [
      el("button", {class: "btn ghost", onclick: () => {
        const page = getPage(path);
        removeBlockFrom(page, block); touch(path); closeModal(); render();
      }}, "Delete"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: save}, "Save"),
    ],
    onKey: e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); return true; } return false; },
  });
}

/* Asked once, in passing, and never overridden: if somebody says it really is a
   project, it is a project. A guess that insists is worse than no guess. */
function routineFork(name, then) {
  const asRoutine = () => {
    closeModal();
    const path = createChecklist(name, "routine", cadenceFrom(name));
    PREF.set("madeRoutine", "1");
    notify("Routine created: " + pageTitle(path) + ". Run it whenever it comes round.");
    openPage(path);
  };
  const asProject = () => { closeModal(); createProjectFlow(name, then); };
  modal({
    center: true, title: "That sounds like a routine", hint: "r / p",
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.55"},
          "A project has a finish line \u2014 something you tick off once and never think " +
          "about again. This one reads like something that comes back instead, and those " +
          "live as routines under Routines & lists, so your project list stays a list of " +
          "things that can actually end.")),
      pickRow("r", "Make it a routine", "comes back \u2014 run it when it is due", asRoutine),
      pickRow("p", "Keep it a project", "it really does finish", asProject)),
    onKey: e => {
      if (e.key === "r") { asRoutine(); return true; }
      if (e.key === "p") { asProject(); return true; }
      return false;
    },
  });
}

function createProjectFlow(name, then) {
  const p = createProjectPage(name);
  // A project without a finish line is a wish. Ask straight away.
  promptInput({
    title: "What does done look like?",
    label: 'State it as if it already happened \u2014 "Sink repaired, no drip"',
    value: "", cta: "Create project",
    onSave: outcome => {
      if (trim(outcome)) setOutcome(p, outcome);
      notify("Project created: " + pageTitle(p));
      if (then) then(p); else openPage(p);
      render();
      // A project with an outcome but no next action is still stalled.
      setTimeout(() => openAddNextAction(p), 120);
    },
  });
}
function newZettelPrompt() {

}

    onSave: text => {
      const blk = addNextActionTo(path, text);

/* When the last open action in an active/waiting project closes. */
function checkProjectCompletion(path) {
  const code = statusDirOf(path);
  if (code !== "1" && code !== "3") return;
  const page = getPage(path); if (!page) return;
  if (flattenBlocks(page.blocks).some(b => OPEN_STATES[b.state])) return;
  projectCompletionPrompt(path);
}

function projectCompletionPrompt(path) {
  const body = el("div", {},
    el("div", {class: "field"}, el("label", {}, "All actions are closed"),
      el("div", {style: "color:var(--fg2);font-size:13.5px"},
        "A project with no next action is invisible work. Decide now:")),
    pickRow("n", "Add a new next action", "keep it active", () => { closeModal(); openAddNextAction(path); }),
    pickRow("d", "Move to 0 — completed", "it is done", () => { closeModal(); setProjectStatus(path, "0"); }),
    pickRow("s", "Move to 2 — someday/maybe", "not now", () => { closeModal(); setProjectStatus(path, "2"); }),
    pickRow("c", "Move to _ — cancelled", "never", () => { closeModal(); setProjectStatus(path, "_"); }));
  modal({
    center: true, title: "Project complete: " + pageTitle(path), hint: "n / d / s / c",
    body,
    onKey: e => {
      const map = {n: () => openAddNextAction(path), d: () => setProjectStatus(path, "0"),
                   s: () => setProjectStatus(path, "2"), c: () => setProjectStatus(path, "_")};
      if (map[e.key]) { closeModal(); map[e.key](); return true; }
      return false;
    },
  });
}

function openWeeding(next) {
  const stalest = stalestActiveProjects(CFG.weedCount);
  const body = el("div", {});
  if (!weedingWorthIt()) {
    body.append(el("div", {class: "field"},
      el("div", {style: "color:var(--fg2);font-size:13px"},
        `Weeding ranks the stalest of many projects. With ${projectsIn("1").length} active ` +
        `and ${leafActions().filter(a => OPEN_STATES[a.state]).length} open tasks there is little to rank, ` +
        `so GroupTodo will not bring this up by itself until there are ` +
        `${CFG.weedMinProjects} projects and ${CFG.weedMinTodos} tasks.`)));
  }
  if (!stalest.length) body.append(el("div", {class: "empty"}, "No active projects. Create one, or capture into today."));
  stalest.forEach((p, i) => {
    const sec = el("div", {class: "dash-sec"});
    const flags = [];
    if (!p.anyTodo)  flags.push("no next action");
    if (!outcomeOf(p.path)) flags.push("no outcome");
    if (p.noContext) flags.push("no context");
    if (p.noVerb)    flags.push("no verb");
    sec.append(el("h4", {},
      el("span", {}, (i + 1) + ". " + p.title),
      p.ageDays != null ? el("span", {class: "n"}, p.ageDays + "d old") : null,
      p.idleDays != null ? el("span", {class: "n"}, "idle " + p.idleDays + "d") : null,
      ...flags.map(f => el("span", {class: "chip miss"}, f))));
    if (p.ageDays != null && p.ageDays > CFG.staleProjectDays) {
      sec.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
        el("span", {}, "Older than 6 months. Still real? Park it in 2/ or kill it in _/."),
        el("button", {class: "fix", onclick: () => openStatusPicker(p.path)}, "change status")));
    }
    for (const t of p.todos) {
      sec.append(el("button", {class: "dash-item", onclick: () => { closeModal(); openTaskDetail(p.path, t.block); }},
        stateChip(t.state), el("span", {html: renderInline(t.title)}),
        t.missingContext ? el("span", {class: "chip miss"}, "ctx") : null,
        t.missingVerb ? el("span", {class: "chip miss"}, "verb") : null));
    }
    sec.append(el("div", {style: "display:flex;gap:6px;padding:6px 16px 10px;flex-wrap:wrap"},
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openPage(p.path); }}, "open"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openAddNextAction(p.path); }}, "+ next action"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openOutcomePrompt(p.path); }}, "outcome"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openStatusPicker(p.path); }}, "status"),
      el("button", {class: "btn sm ghost", onclick: () => { updateReviewed(p.path); closeModal(); openWeeding(next); }}, "mark reviewed")));
    body.append(sec);
  });
  modal({
    title: "Morning weeding", hint: "5 minutes · w continues",
    body,
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Skip"),
           el("button", {class: "btn primary", onclick: () => { closeModal(); (next || (() => openContextPicker("Where are you now?", surfaceContext)))(); }}, "Continue → context")],
    onKey: e => { if (e.key === "w") { closeModal(); (next || (() => openContextPicker("Where are you now?", surfaceContext)))(); return true; } return false; },
  });
}

/* ============================================================
   149_EXPORT_ONE_PROJECT
   Handing a single project to somebody, without handing them the space it
   lives in. The file is a copy, not a permission: once sent they have it
   for good. What it must never do is quietly carry more than you chose,
   so the dialog lists every page going out before it writes anything.
   ============================================================ */

/* Pages to include. Journals are never pulled in, even when referenced:
   a day's page is mixed content and would leak everything else in it. */
function collectExport(rootPath, {includeRefs = false} = {}) {
  const out = [rootPath];
  if (!includeRefs) return out;
  const page = getPage(rootPath);
  if (!page) return out;

  const texts = Object.values(page.props || {}).map(String);
  walkBlocks(page.blocks, b => {
    texts.push(b.title);
    (b.body || []).forEach(l => texts.push(l));
    for (const v of Object.values(b.props || {})) texts.push(String(v));
  });

  for (const text of texts) {
    for (const target of linksIn(text)) {
      const t = trim(target.split("][")[0]);
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) continue;          // a date link is a journal
      const p = findExistingPage(t);
      if (p && !isJournalPath(p) && !out.includes(p)) out.push(p);
    }
  }
  return out;
}

/* A copy with every trace of who did what removed. */
function stripAttributionFrom(page) {
  const props = Object.assign({}, page.props || {});
  delete props.updated_by;
  const copy = blocks => (blocks || []).map(b => {
    const bp = Object.assign({}, b.props || {});
    delete bp.by;
    delete bp.done_by;
    return newBlock({
      state: b.state, title: b.title, props: bp,
      body: (b.body || []).slice(), children: copy(b.children),
    });
  });
  return {props, blocks: copy(page.blocks)};
}

function exportMarkdown(paths, {strip = false, fenced = true} = {}) {
  const out = [];
  if (fenced) {
    out.push("<!-- GroupTodo export. Open it with Vault & sync → Open vault file. -->",
             "<!-- gtd:bundle v1 " + nowStamp() + " -->", "");
  }
  for (const path of paths) {
    const page = strip ? stripAttributionFrom(getPage(path)) : getPage(path);
    const text = serializePage(page).replace(/\n$/, "");
    if (fenced) out.push("<!-- gtd:file " + path + " -->", text, "<!-- gtd:endfile -->", "");
    else out.push("## " + pageTitle(path), "", text, "");
  }
  return out.join("\n");
}

function openExportPage(rootPath) {
