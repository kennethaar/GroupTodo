<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- No external resources, ever. This policy is the proof: the page cannot
     load a script, font or image from anywhere, and cannot send data to any
     host but the optional sync server on this machine. Safe to drop onto a
     corporate file share, intranet or managed laptop. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src data: blob:;
  connect-src 'self' http://127.0.0.1:* http://localhost:*;
  worker-src 'self';
  manifest-src 'self' blob:;
  form-action 'none';
  base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GroupTodo">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236aa3ff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%2306101f' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>GroupTodo</title>
<style>
/* ============================================================
   00_TOKENS
   ============================================================ */
:root{
  --bg:#0f1115; --bg2:#161920; --bg3:#1d212b; --bg4:#252a36;
  --fg:#e6e9ef; --fg2:#a4acbd; --fg3:#6d7689;
  --border:#252a36; --border2:#333a4a;
  --accent:#6aa3ff; --accent2:#2f6fd0; --accent-fg:#06101f;
  --todo:#6aa3ff; --doing:#c792ea; --wait:#e0b050; --done:#4fbf7b; --cancel:#6d7689;
  --late:#ff6b6b; --today:#e0b050; --ok:#4fbf7b; --warn:#e0b050; --danger:#ff6b6b;
  --ctx:#5ecfc0; --proj:#ff9f6b; --zet:#c792ea;
  --radius:10px; --radius-sm:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#fbfbfd; --bg2:#ffffff; --bg3:#f1f3f7; --bg4:#e6e9f0;
  --fg:#1b1f27; --fg2:#525b6d; --fg3:#858ea0;
  --border:#e2e6ee; --border2:#cfd5e1;
  --accent:#2f6fd0; --accent2:#2f6fd0; --accent-fg:#ffffff;
  --todo:#2f6fd0; --doing:#8b5cd6; --wait:#b57f12; --done:#1f9254; --cancel:#858ea0;
  --late:#d33; --today:#b57f12;
  --ctx:#0f8d7d; --proj:#c25b1e; --zet:#8b5cd6;
  --shadow:0 8px 32px rgba(20,30,60,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   05_LAYOUT
   ============================================================ */
#app{display:grid;grid-template-columns:248px 1fr;height:100dvh;overflow:hidden}
#sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 96px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* ---------- sidebar ---------- */
.brand{
  display:flex;align-items:center;gap:9px;padding:14px 16px 10px;
  font-weight:650;letter-spacing:-.2px;
}
.brand{width:100%;border-radius:0}
.brand:hover{background:var(--bg3)}
.brand .swap{margin-left:auto;color:var(--fg3);font-size:13px}
.brand .logo{
  width:24px;height:24px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;font-size:13px;color:#06101f;flex:none;font-weight:700;
}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--fg3);letter-spacing:0}
.nav{flex:1;overflow-y:auto;padding:4px 8px 12px}
.nav-group{margin-top:10px}
.nav-group>h3{
  margin:0;padding:6px 8px 4px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.9px;color:var(--fg3);
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;
  border-radius:var(--radius-sm);color:var(--fg2);font-size:13.5px;text-align:left;
}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--bg4);color:var(--fg);font-weight:550}
.nav-item .ic{width:17px;text-align:center;flex:none;font-size:13px;opacity:.95}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg3);
  background:var(--bg3);border-radius:20px;padding:1px 6px;min-width:20px;text-align:center;
}
.nav-item.active .cnt{background:var(--bg2)}
.nav-item .cnt.hot{background:rgba(255,107,107,.18);color:var(--late)}
.nav-item .key{font-family:var(--mono);font-size:10px;color:var(--fg3);opacity:.6}
.vaultbar{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}
.vaultbar .row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg3);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)}
.dot.sync{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;gap:10px;padding:12px 20px 10px;
  border-bottom:1px solid var(--border);background:var(--bg);flex:none;
}
header.top .burger{display:none}
.h-title{font-size:19px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;min-width:0}
.h-title .sub{font-size:12px;font-weight:400;color:var(--fg3)}
.h-sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--radius-sm);
  background:var(--bg3);color:var(--fg2);font-size:13px;border:1px solid transparent;white-space:nowrap;
}
.btn:hover{background:var(--bg4);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:550}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.ghost{background:none;border:1px solid var(--border2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.6}

/* ============================================================
   10_NUDGES
   ============================================================ */
.nudgebar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.nudge{
  display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border);font-size:12.5px;color:var(--fg2);
}
.nudge:hover{border-color:var(--border2);color:var(--fg)}
.nudge b{font-variant-numeric:tabular-nums;color:var(--fg)}
.nudge.warn{background:rgba(224,176,80,.12);border-color:rgba(224,176,80,.3);color:var(--warn)}
.nudge.warn b{color:var(--warn)}
.nudge.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.32);color:var(--late)}
.nudge.danger b{color:var(--late)}
.nudge.ok{background:rgba(79,191,123,.1);border-color:rgba(79,191,123,.28);color:var(--ok)}

.hero{
  margin:14px 0 6px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);
}
.hero h2{margin:0 0 3px;font-size:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--fg3);font-weight:600}
.hero p{margin:0 0 12px;color:var(--fg2);font-size:13.5px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   15_TASK ROWS
   ============================================================ */
.section{margin:20px 0 0}
.section>h3{
  display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 2px;
  font-size:12px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);
}
.section>h3 .n{background:var(--bg3);border-radius:20px;padding:0 7px;font-size:11px;color:var(--fg2)}

/* Quiet sections: background material. They are here when you go looking for
   them, and they stay out of the way of the thing you are meant to act on. */
.section.quiet{margin-top:28px;opacity:.55;transition:opacity .15s ease}
.section.quiet:hover,.section.quiet:focus-within{opacity:1}
.section.quiet>h3{font-weight:550;letter-spacing:.6px;color:var(--fg3)}
.section.quiet>h3 .n{background:transparent;padding:0 2px;color:var(--fg3)}
.section.quiet>.card{background:transparent;border-style:dashed}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.empty{padding:16px;color:var(--fg3);font-size:13px;text-align:center}

.task{
  display:flex;align-items:flex-start;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--border);position:relative;
}
.task:last-child{border-bottom:none}
.task:hover{background:var(--bg3)}
.task.sel{background:var(--bg4)}
.chk{
  width:19px;height:19px;border-radius:50%;border:1.6px solid var(--fg3);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s;
}
.chk:hover{border-color:var(--done);color:var(--fg3)}
.task[data-state="DONE"] .chk{background:var(--done);border-color:var(--done);color:#06210f}
.task[data-state="CANCELLED"] .chk{background:var(--cancel);border-color:var(--cancel);color:#fff}
.task[data-state="WAIT"] .chk{border-color:var(--wait);color:var(--wait)}
.task[data-state="DOING"] .chk{border-color:var(--doing);color:var(--doing)}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;word-wrap:break-word;overflow-wrap:anywhere}
.task[data-state="DONE"] .t-title,.task[data-state="CANCELLED"] .t-title{color:var(--fg3);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:20px;
  background:var(--bg3);color:var(--fg3);border:1px solid transparent;white-space:nowrap;
}
.chip.ctx{color:var(--ctx);background:rgba(94,207,192,.11)}
.chip.proj{color:var(--proj);background:rgba(255,159,107,.11)}
.chip.late{color:var(--late);background:rgba(255,107,107,.13)}
.chip.today{color:var(--today);background:rgba(224,176,80,.13)}
.chip.miss{color:var(--warn);background:rgba(224,176,80,.1);border-color:rgba(224,176,80,.3)}
.chip.age{font-family:var(--mono);font-size:10.5px}
.chip.who{color:var(--zet);background:rgba(199,146,234,.12)}
.chip.st{font-family:var(--mono);font-size:10px;letter-spacing:.5px}
.chip.spacechip{border-style:solid;border-width:1px;background:transparent;font-weight:600}
.spacetoggle{
  width:19px;height:19px;border-radius:5px;border:1.6px solid var(--border2);flex:none;
  display:grid;place-items:center;font-size:11px;color:transparent;margin-right:2px;
}
.spacetoggle.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.spacetoggle:hover{border-color:var(--accent)}

/* ---------- space colours ---------- */
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{
  width:26px;height:26px;border-radius:50%;flex:none;padding:0;
  display:grid;place-items:center;font-size:12px;font-weight:700;
  border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);
}
.swatch:hover{border-color:var(--border2)}
.swatch.on{border-color:var(--fg)}
.swatches .sep{width:1px;height:20px;flex:none;background:var(--border2);margin:0 3px}
/* A native colour well, cropped to the same round chip as the swatches. */
.colorwell{
  position:relative;width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--border2);
}
.colorwell.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);border:2px solid var(--fg)}
/* Unselected, the well advertises itself as "some other colour". */
.colorwell:not(.on)::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;color:#fff;mix-blend-mode:difference;pointer-events:none;
}
.colorwell input[type=color]{
  position:absolute;left:-25%;top:-25%;width:150%;height:150%;
  padding:0;border:none;background:none;cursor:pointer;
}
.colorwell input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.colorwell input[type=color]::-webkit-color-swatch{border:none}
.colorwell input[type=color]::-moz-color-swatch{border:none}
.colordot{
  width:13px;height:13px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.32);
}
.cpreview{display:flex;align-items:center;gap:9px;margin-top:10px}
.cpreview .avatar{
  width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;
}
.swatches .hexinput{
  width:94px;font-family:var(--mono);font-size:12px;padding:5px 8px;text-transform:lowercase;
}
.chip.b{cursor:pointer}
.chip.b:hover{border-color:var(--border2);color:var(--fg2)}
.t-act{display:flex;gap:2px;opacity:0;flex:none;transition:.12s}
.task:hover .t-act,.task.sel .t-act{opacity:1}
.iconbtn{
  width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--fg3);font-size:13px;
}
.iconbtn:hover{background:var(--bg4);color:var(--fg)}
@media (hover:none){.t-act{opacity:1}}

/* ---------- outliner ---------- */
.outline{padding:10px 12px}
.blk{padding-left:18px;position:relative}
.blk>.line{display:flex;align-items:flex-start;gap:7px;padding:2px 0;border-radius:4px}
.blk>.line:hover{background:var(--bg3)}
.bullet{
  position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--fg3);flex:none;cursor:pointer;
}
.blk.has-kids>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk.collapsed>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk .txt{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:anywhere;font-size:14px;padding:1px 0}
.blk .txt[contenteditable]{outline:none}
.blk .props{font-family:var(--mono);font-size:11px;color:var(--fg3);padding-left:0;margin:1px 0 2px}
.blk .bodyline{font-size:13px;color:var(--fg2);white-space:pre-wrap}
.state{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:1px 5px;border-radius:4px;flex:none;margin-top:2px;cursor:pointer;
}
.state.TODO{background:rgba(106,163,255,.16);color:var(--todo)}
.state.DOING{background:rgba(199,146,234,.16);color:var(--doing)}
.state.WAIT{background:rgba(224,176,80,.16);color:var(--wait)}
.state.DONE{background:rgba(79,191,123,.14);color:var(--done)}
.state.CANCELLED{background:var(--bg4);color:var(--cancel)}
.state.none{
  background:transparent;color:var(--fg3);opacity:0;border:1px dashed var(--border2);
  padding:0 4px;transition:opacity .12s;
}
.blk>.line:hover .state.none,.state.none:focus{opacity:1}
/* The badge is a control wherever it is clickable, and it keeps the focus ring
   after the redraw so the next space bar cycles it again. */
.state.btn{padding:2px 6px}   /* a thumb-sized target: on a list row the badge is the control */
.state.btn:hover{box-shadow:inset 0 0 0 1px currentColor}
.state:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.tag{color:var(--ctx);cursor:pointer}
.tag:hover{text-decoration:underline}
.wikilink{color:var(--accent);cursor:pointer}
.wikilink:hover{text-decoration:underline}
.wikilink.ctx{color:var(--ctx)} .wikilink.zet{color:var(--zet)} .wikilink.proj{color:var(--proj)}
code{font-family:var(--mono);font-size:.9em;background:var(--bg3);padding:1px 4px;border-radius:4px}

/* ---------- project/page list ---------- */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--bg3)}
.prow .st{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:11px;font-weight:700;
}
.st-1{background:rgba(106,163,255,.16);color:var(--todo)}
.st-3{background:rgba(224,176,80,.16);color:var(--wait)}
.st-2{background:var(--bg4);color:var(--fg3)}
.st-0{background:rgba(79,191,123,.14);color:var(--done)}
.st-_{background:var(--bg4);color:var(--cancel)}
.prow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:11.5px;color:var(--fg3)}

/* ============================================================
   20_MODALS
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.scrim.center{align-items:center}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:14px 14px 0 0;
  width:min(640px,100%);max-height:86dvh;display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;
}
.scrim.center .modal{border-radius:14px}
.modal header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex:none;
}
.modal header h2{margin:0;font-size:15px;font-weight:650}
.modal header .hint{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
.modal .body{overflow-y:auto;padding:10px 0;flex:1}
.modal .foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex:none}
.pick{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 16px;text-align:left;font-size:14px;color:var(--fg2);
}
.pick:hover,.pick.cur{background:var(--bg3);color:var(--fg)}
.pick .k{
  font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;flex:none;
  background:var(--bg4);color:var(--fg3);display:grid;place-items:center;
}
.pick:hover .k,.pick.cur .k{background:var(--accent);color:var(--accent-fg)}
.pick .d{margin-left:auto;font-size:11.5px;color:var(--fg3)}
.filterbox{padding:0 16px 8px}
.filterbox input,.field input,.field textarea,.field select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:14px;outline:none;
}
.filterbox input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field{padding:8px 16px}
.field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);margin-bottom:5px}
.field textarea{resize:vertical;min-height:70px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:6px 11px;border-radius:var(--radius-sm);background:var(--bg3);font-size:12.5px;
  font-family:var(--mono);color:var(--fg3);border:1px solid transparent;
}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
.seg button:hover{border-color:var(--border2)}

/* review / dashboards */
.dash-sec{border-bottom:1px solid var(--border)}
.dash-sec:last-child{border-bottom:none}
.dash-sec>h4{
  margin:0;padding:11px 16px 5px;font-size:12.5px;font-weight:650;display:flex;gap:8px;align-items:center;
}
.dash-sec>h4 .n{font-size:11px;background:var(--bg4);border-radius:20px;padding:0 7px;color:var(--fg3)}
.dash-sec>h4 .n.z{background:rgba(79,191,123,.15);color:var(--ok)}
.dash-item{display:flex;gap:9px;align-items:flex-start;padding:6px 16px;font-size:13px;color:var(--fg2);width:100%;text-align:left}
.dash-item:hover{background:var(--bg3);color:var(--fg)}

<div id="modalRoot"></div>
<script>
"use strict";
/* ============================================================
   00_BOOTSTRAP -- utilities
   Port of: init.lua 00_BOOTSTRAP
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "data") for (const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trim = s => String(s ?? "").replace(/^\s+|\s+$/g, "");
const join = (...p) => p.filter(Boolean).join("/").replace(/\/{2,}/g, "/");
const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

/* ---------- keeping your place across a redraw ----------
   Any change redraws the whole screen, so whatever had focus -- the state badge
   just clicked, the line being typed in -- went with it, and cycling a state
   meant selecting the todo again before every single step. Name the control just
   before the change that redraws, and focus lands back on the rebuilt one, so
   the next click or keypress carries straight on. */
let REFOCUS = null;
function keepFocus(selector, node) {
  REFOCUS = {selector, nth: node ? Math.max(0, $$(selector).indexOf(node)) : 0};
}
function applyRefocus() {
  const want = REFOCUS; REFOCUS = null;
  if (!want) return;
  requestAnimationFrame(() => {
    if ($("#modalRoot").firstChild) return;   // a picker opened on the way; it owns the keys
    const all = $$(want.selector);
    const node = all[want.nth] || all[0];     // the row may have left one list on the way
    if (node) node.focus({preventScroll: true});
  });
}
const idSel = (cls, id, part) => cls + '[data-id="' + CSS.escape(String(id)) + '"] ' + part;

function notify(msg, level="info") {
  const t = el("div", {class:"toast " + (level==="warn"?"warn":level==="error"?"err":"")},
    el("span", {}, msg),
    el("button", {class:"x", onclick:e=>e.target.closest(".toast").remove()}, "✕"));
  $("#toasts").append(t);
  setTimeout(() => t.remove(), level === "info" ? 3800 : 9000);
}

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());

/* Timestamps are written to the files in UTC so two people in different
   offices compare cleanly. Everything shown on screen is converted to the
   timezone set on this device -- including which day "today" is, so a journal
   written while travelling still lands on the day you think you are in. */
function userTZ() {
  const set = (typeof PREF !== "undefined") ? PREF.get("timezone", "") : "";
  if (set) return set;
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
  catch (_) { return "UTC"; }
}
function todayISO() {
  const tz = (typeof PREF !== "undefined") ? PREF.get("timezone", "") : "";
  if (!tz) return isoOf(new Date());
  try {
    return new Intl.DateTimeFormat("en-CA", {timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit"})
      .format(new Date());
  } catch (_) { return isoOf(new Date()); }
}

/* "2026-10-05T18:43:38Z" -> "5 Oct 2026, 20:43" in the chosen zone. */
function formatStamp(iso, opts = {}) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return iso || "";
  try {
    return new Intl.DateTimeFormat(undefined, Object.assign({
      dateStyle: "medium", timeStyle: "short", timeZone: userTZ(),
    }, opts)).format(d);
  } catch (_) { return String(iso); }
}
/* A stamp like "Kenneth 2026-10-05T18:43:38Z" splits into who and when. */
function splitStamp(value) {
  const m = /^(.*?)\s*(\d{4}-\d{2}-\d{2}T[\d:.]+Z)\s*$/.exec(trim(value || ""));
  return m ? {who: trim(m[1]), iso: m[2]} : {who: trim(value || ""), iso: null};
}
const parseISO = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : null;
};
const shiftISO = (iso, days) => { const d = parseISO(iso) || new Date(); d.setDate(d.getDate()+days); return isoOf(d); };
function dateDiffDays(d1, d2) {           // d2 - d1, in days
  const a = parseISO(d1), b = parseISO(d2);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function humanDate(iso) {
  const d = parseISO(iso); if (!d) return iso || "";
  const t = todayISO();
  if (iso === t) return "Today";
  if (iso === shiftISO(t, 1)) return "Tomorrow";
  if (iso === shiftISO(t, -1)) return "Yesterday";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined,
    {weekday:"short", day:"numeric", month:"short", year: sameYear ? undefined : "numeric"});
}
function isoWeek(iso) {
  const d = parseISO(iso); if (!d) return null;
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const week1 = new Date(t.getFullYear(), 0, 4);
  const w = 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return [w, t.getFullYear()];
}

/* ============================================================
   05_CONFIG_SCHEMA
   Port of: init.lua 05_CONFIG_SCHEMA
   Same vault shape as the Neovim config, with .md instead of .org:
     journals/YYYY-MM-DD.md
     pages/{_,0,1,2,3}/   project status directories
     pages/{c,p,o,z}/     contexts, people, orgs, zettel
     pages/{templates,verbs}/
   ============================================================ */
const JOURNALS = "journals";
const PAGES    = "pages";
const DIRS = {
  journals : JOURNALS,
  pages    : PAGES,
  cancelled: join(PAGES, "_"),
  completed: join(PAGES, "0"),
  active   : join(PAGES, "1"),
  someday  : join(PAGES, "2"),
  waiting  : join(PAGES, "3"),
  orgs     : join(PAGES, "o"),
  people   : join(PAGES, "p"),
  contexts : join(PAGES, "c"),
  templates: join(PAGES, "templates"),
  verbs    : join(PAGES, "verbs"),
  zettel   : join(PAGES, "z"),
  areas    : join(PAGES, "a"),   // H2: areas of focus, the standing responsibilities
  goals    : join(PAGES, "g"),   // H3: goals and objectives, 1-2 years
  lists    : join(PAGES, "8"),   // 8 = eternity: checklists you run again and again
};
const TODO_STATES  = ["TODO", "DOING", "WAIT", "DONE", "CANCELLED"];
const OPEN_STATES  = {TODO:true, DOING:true, WAIT:true};
const STATE_ALIAS  = {WAITING:"WAIT", CANCELED:"CANCELLED", NOW:"DOING", LATER:"TODO"};
const STATUS_DIRS  = {"_":DIRS.cancelled, "0":DIRS.completed, "1":DIRS.active, "2":DIRS.someday, "3":DIRS.waiting};
const STATUS_TEXT  = {
  "_": "_ = cancelled",
  "0": "0 = completed",
  "1": "1 = active",
  "2": "2 = someday maybe",
  "3": "3 = waiting for 3rd party",
};
const STATUS_LABEL = {"_":"Cancelled", "0":"Completed", "1":"Active", "2":"Someday/Maybe", "3":"Waiting for"};
/* The vault's own order: _ 0 1 2 3, then 8 for the checklists. */
const STATUS_ORDER = ["_", "0", "1", "2", "3"];
const PREFIX_DIR   = {"8":DIRS.lists,            // integer-like key, so pageRef finds it first
                      p:DIRS.people, c:DIRS.contexts, o:DIRS.orgs, z:DIRS.zettel,
                      a:DIRS.areas, g:DIRS.goals,
                      k:DIRS.lists};                // legacy: old [[k/...]] links still resolve

/* Tunables -- the GTD nudge thresholds (inline constants in init.lua). */
const CFG = {
  surfaceCount     : 3,      // oldest TODOs surfaced per context
  weedCount        : 3,      // stalest projects in morning weeding
  staleProjectDays : 180,    // "older than 6 months" warning
  reviewEveryDays  : 7,      // weekly review cadence
  waitFollowUpDays : 14,     // nudge to chase a WAIT item
  idleNudgeMinutes : 30,     // 30+ min idle -> nudge
  quietUntilTasks  : 6,      // simple mode: no GTD hygiene talk below this
  nudgeMax         : 4,      // chips on screen at once; the rest wait behind "more"
  nudgeSnoozeDays  : 7,      // a nudge you quieten stays quiet this long
  tipMinTasks      : 3,      // enough on the list for "some of these belong together"
  tipSnoozeDays    : 5,      // "not now" on a suggestion
  busyTasks        : 40,     // past this the length of the list is the problem
  busyProjectTodos : 12,     // one project carrying this much is really several
  undoStateMinutes : 5,      // grace period to cycle back without losing the dates
  weedMinProjects  : 5,      // weeding is for a garden, not a window box
  weedMinTodos     : 20,
  agendaDays       : 14,
  journalScanDays  : 365,
  contextPrompts   : [[12, 0, "lunchtime"], [17, 0, "after work"]],
};

const journalPath = (date) => join(JOURNALS, (date || todayISO()) + ".md");
const todayStamp  = () => "[[" + todayISO() + "]]";

function slugify(title) {
  const s = trim(title || "Untitled")
    .replace(/[\u0000-\u001f/\\:*?"<>|]/g, "-")
    .replace(/\s+/g, " ");
  return s === "" ? "Untitled" : s;
}

/* ============================================================
   10_MARKDOWN -- parse / serialize
   The org outline (*, **, ***) becomes a markdown bullet outline.
   Org "#+key: value"  ->  "key:: value" page properties.
   Org "Added: [[d]]"  ->  "Added:: [[d]]" block property.
   ============================================================ */
const PROP_RE   = /^([A-Za-z][\w-]*)::\s*(.*)$/;
const BULLET_RE = /^(\s*)[-*+]\s+(.*)$/;

function indentLevel(ws) {
  let n = 0;
  for (const ch of ws) n += ch === "\t" ? 2 : 1;
  return Math.floor(n / 2);
}

function splitState(text) {
  const m = /^([A-Z]{3,9})(\s+|$)/.exec(text || "");
  if (!m) return [null, text || ""];
  const raw = m[1];
  const st = STATE_ALIAS[raw] || (TODO_STATES.includes(raw) ? raw : null);
  if (!st) return [null, text || ""];
  return [st, (text || "").slice(m[0].length)];
}

function newBlock(patch = {}) {
  return Object.assign({
    id: uid(), state: null, title: "", props: {}, body: [],
    children: [], collapsed: false,
  }, patch);
}

/* Parse a markdown page into {props, blocks}. */
function parsePage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const root = {level: -1, children: page.blocks};
  const stack = [root];
  let cur = null, curIndent = 0, seenBullet = false;

  for (const line of lines) {
    const bm = BULLET_RE.exec(line);
    if (bm) {
      seenBullet = true;
      const level = indentLevel(bm[1]);
      const [state, title] = splitState(bm[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      const parent = stack[stack.length-1];
      (parent.children || (parent.children = [])).push(blk);
      blk.level = level;
      stack.push(blk);
      cur = blk; curIndent = bm[1].length;
      continue;
    }
    if (!seenBullet) {
      const pm = PROP_RE.exec(trim(line));
      if (pm) { page.props[pm[1].toLowerCase()] = trim(pm[2]); continue; }
      if (trim(line) === "") continue;
      // Stray prose before the first bullet: keep it as a leading block.
      const blk = newBlock({title: trim(line)});
      page.blocks.push(blk); blk.level = 0;
      stack.length = 1; stack.push(blk); cur = blk; curIndent = 0; seenBullet = true;
      continue;
    }
    if (!cur) continue;
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    const pm = PROP_RE.exec(trim(line));
    if (pm) { cur.props[pm[1]] = trim(pm[2]); continue; }
    const lead = /^\s*/.exec(line)[0].length;
    cur.body.push(line.slice(Math.min(lead, curIndent + 2)).replace(/\s+$/, ""));
  }
  // drop trailing blank body lines
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

function serializePage(page) {
  const out = [];
  const props = page.props || {};
  const keys = Object.keys(props);
  if (keys.length) {
    for (const k of keys) out.push(k + ":: " + props[k]);
    out.push("");
  }
  const emit = (blocks, level) => {
    for (const b of blocks) {
      const pad = "  ".repeat(level);
      out.push((pad + "- " + (b.state ? b.state + " " : "") + b.title).replace(/\s+$/, ""));
      for (const [k, v] of Object.entries(b.props || {})) out.push(pad + "  " + k + ":: " + v);
      for (const l of b.body || []) out.push(l === "" ? "" : pad + "  " + l);
      if (b.children && b.children.length) emit(b.children, level + 1);
    }
  };
  emit(page.blocks || [], 0);
  return out.join("\n").replace(/\n+$/, "") + "\n";
}

function walkBlocks(blocks, fn, parent = null) {
  for (const b of blocks || []) {
    if (fn(b, parent) === false) continue;
    walkBlocks(b.children, fn, b);
  }
}
function flattenBlocks(blocks, out = [], parent = null, depth = 0) {
  for (const b of blocks || []) {
    b._parent = parent; b._depth = depth;
    out.push(b);
    flattenBlocks(b.children, out, b, depth + 1);
  }
  return out;
}
</script>
<script>
/* ============================================================
   15_STORAGE -- three interchangeable backends
     fs   : File System Access API, writes real .md files (desktop Chrome/Edge)
     http : tiny PUT/GET server (serve.py) -- for Termux / phone / any device
     idb  : IndexedDB, browser-local, with markdown bundle export/import
   Port of: init.lua read_file/write_file/append_file + autosave timer
   ============================================================ */
/* ---------- what can this device actually do? ----------
   iOS Safari, locked-down corporate browsers and pages opened straight from
   disk all differ in what they allow. Probe rather than assume, and tell the
   user plainly in the Vault dialog. */
/* Reading window.localStorage THROWS -- it does not return null -- when the
   page has an opaque origin. SharePoint and Teams render an uploaded .html
   inside <iframe sandbox srcdoc> with no allow-same-origin, which is exactly
   that: no localStorage, no IndexedDB, no folder access, nothing. Every
   access goes through here so a locked-down frame degrades to memory rather
   than killing the script on the way past. */
const safeLS = {
  get(k, d = null) {
    try { const v = window.localStorage.getItem(k); return v === null ? d : v; }
    catch (_) { return d; }
  },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (_) { return false; } },
  del(k)    { try { window.localStorage.removeItem(k); return true; } catch (_) { return false; } },
};

const CAP = {
  served    : location.protocol === "http:" || location.protocol === "https:",
  /* A sandboxed frame with no allow-same-origin: storage ACCESS throws, not
     just storage reads. Tested by behaviour rather than by origin, because a
     plain file:// page also reports an origin of "null" and is perfectly
     usable -- checking the origin alone condemned every downloaded copy. Both
     halves are needed: in a frame, and storage unreachable. */
  sandboxed : (() => {
    const framed = (() => { try { return window.top !== window.self; } catch (_) { return true; } })();
    let blocked = false;
    try { void window.localStorage; } catch (_) { blocked = true; }
    return framed && blocked;
  })(),
  fromFile  : location.protocol === "file:",
  dirPicker : typeof window.showDirectoryPicker === "function",
  openPicker: typeof window.showOpenFilePicker === "function",
  savePicker: typeof window.showSaveFilePicker === "function",
  idb       : false,     // filled in by probeStorage()
  ls        : false,
  persist   : "memory",  // idb | ls | memory
};

async function probeStorage() {
  try {
    localStorage.setItem("gtd.probe", "1");
    CAP.ls = localStorage.getItem("gtd.probe") === "1";
    localStorage.removeItem("gtd.probe");
  } catch (_) { CAP.ls = false; }
  try {
    await IDB.set("kv", "probe", Date.now());
    CAP.idb = (await IDB.get("kv", "probe")) != null;
  } catch (_) { CAP.idb = false; }
  CAP.persist = CAP.idb ? "idb" : CAP.ls ? "ls" : "memory";
  return CAP;
}

/* localStorage and in-memory stand-ins, so a browser that blocks IndexedDB
   (iOS Safari on a file:// page, some managed profiles) still runs. */
const LS = {
  k: p => "gtd.file:" + p,
  all() {
    const out = new Map();
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith("gtd.file:")) out.set(key.slice(9), localStorage.getItem(key));
    }
    return out;
  },
  set(p, t) { localStorage.setItem(LS.k(p), t); },
  del(p)    { localStorage.removeItem(LS.k(p)); },
};
const MEM = new Map();

const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("grouptodo", 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      if (!db.objectStoreNames.contains("kv"))    db.createObjectStore("kv");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get : (s, k)    => tx(s, "readonly",  st => st.get(k)),
    set : (s, k, v) => tx(s, "readwrite", st => st.put(v, k)),
    del : (s, k)    => tx(s, "readwrite", st => st.delete(k)),
    keys: (s)       => tx(s, "readonly",  st => st.getAllKeys()),
    all : (s)       => tx(s, "readonly",  st => st.getAll()),
  };
})();

const Backends = {
  /* ---------- IndexedDB (always available) ---------- */
  idb(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "idb", label: space ? "browser storage" : "browser storage", writable: true,
      async list() {
        const keys = await IDB.keys("files"), vals = await IDB.all("files");
        const out = new Map();
        keys.forEach((k, i) => {
          if (pre) { if (String(k).startsWith(pre)) out.set(String(k).slice(pre.length), vals[i]); }
          else if (!String(k).includes("|")) out.set(String(k), vals[i]);
        });
        return out;
      },
      async write(path, text) { await IDB.set("files", pre + path, text); },
      async remove(path)      { await IDB.del("files", pre + path); },
    };
  },

  /* ---------- localStorage fallback (IndexedDB blocked) ---------- */
  ls(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "ls", label: "browser storage", writable: true,
      async list() {
        const out = new Map();
        for (const [k, v] of LS.all()) {
          if (pre) { if (k.startsWith(pre)) out.set(k.slice(pre.length), v); }
          else if (!k.includes("|")) out.set(k, v);
        }
        return out;
      },
      async write(path, text) { LS.set(pre + path, text); },
      async remove(path) { LS.del(pre + path); },
    };
  },

  /* ---------- memory only (everything blocked) ----------
     Still fully usable for a session; the Vault dialog shouts about it and
     file sync is the only durable home. */
  memory(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "memory", label: "memory only", writable: true, ephemeral: true,
      async list() {
        const out = new Map();
        for (const [k, v] of MEM) if (k.startsWith(pre)) out.set(k.slice(pre.length), v);
        return out;
      },
      async write(path, text) { MEM.set(pre + path, text); },
      async remove(path) { MEM.delete(pre + path); },
    };
  },

  /* ---------- File System Access API ---------- */
  fs(rootHandle) {
    const dirCache = new Map([["", rootHandle]]);
    async function dirFor(path, create=false) {
      if (dirCache.has(path)) return dirCache.get(path);
      const parts = path.split("/").filter(Boolean);
      let h = rootHandle, sofar = "";
      for (const p of parts) {
        sofar = sofar ? sofar + "/" + p : p;
        if (dirCache.has(sofar)) { h = dirCache.get(sofar); continue; }
        h = await h.getDirectoryHandle(p, {create});
        dirCache.set(sofar, h);
      }
      return h;
    }
    return {
      kind: "fs", label: rootHandle.name, writable: true, handle: rootHandle,
      async list() {
        const out = new Map();
        const walk = async (dir, prefix) => {
          for await (const [name, h] of dir.entries()) {
            if (name.startsWith(".")) continue;
            const p = prefix ? prefix + "/" + name : name;
            if (h.kind === "directory") { dirCache.set(p, h); await walk(h, p); }
            else if (/\.(md|org)$/i.test(name)) out.set(p, await (await h.getFile()).text());
          }
        };
        await walk(rootHandle, "");
        return out;
      },
      async write(path, text) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"), true);
        const fh = await dir.getFileHandle(path.split("/").pop(), {create: true});
        const w = await fh.createWritable();
        await w.write(text); await w.close();
      },
      async remove(path) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"));
        await dir.removeEntry(path.split("/").pop());
      },
    };
  },

  /* ---------- HTTP sync server (serve.py) ---------- */
  http(base) {
    const u = (p, q) => base.replace(/\/$/, "") + p + (q ? "?path=" + encodeURIComponent(q) : "");
    return {
      kind: "http", label: base.replace(/^https?:\/\//, "") || "server", writable: true,
      async list() {
        const r = await fetch(u("/api/list"));
        if (!r.ok) throw new Error("list failed: " + r.status);
        const paths = await r.json();
        const out = new Map();
        await Promise.all(paths.map(async p => {
          const f = await fetch(u("/api/file", p));
          if (f.ok) out.set(p, await f.text());
        }));
        return out;
      },
      async write(path, text) {
        const r = await fetch(u("/api/file", path), {
          method: "PUT", headers: {"Content-Type": "text/plain; charset=utf-8"}, body: text,
        });
        if (!r.ok) throw new Error("write failed: " + r.status);
      },
      async remove(path) { await fetch(u("/api/file", path), {method: "DELETE"}); },
    };
  },
};

/* ============================================================
   20_VAULT -- in-memory model over the backend
   ============================================================ */
/* Every space keeps its own record. V points at the active one and shares the
   very same Map and Set objects, so all the single-space code below works
   untouched while saves stay routed to the right backend. */
const LOADED = new Map();   // space name -> {name, backend, pages, raw, dirty, removed}

const V = {
  backend : null,
  pages   : new Map(),   // path -> {props, blocks}
  raw     : new Map(),   // path -> original text (for .org files kept verbatim)
  dirty   : new Set(),
  removed : new Set(),
  loaded  : false,
  syncing : false,
  error   : null,
  space   : null,
};

function newRecord(name, backend) {
  return {name, backend, pages: new Map(), raw: new Map(), dirty: new Set(), removed: new Set()};
}
function bindActive(name) {
  const r = LOADED.get(name);
  if (!r) return;
  V.backend = r.backend; V.pages = r.pages; V.raw = r.raw;
  V.dirty = r.dirty; V.removed = r.removed; V.space = name;
  V.loaded = true;
}

/* Run fn with V pointing at another loaded space, then put it back. Used both
   to read across spaces and to route an edit to the space that owns it. */
function inSpace(name, fn) {
  if (!name || name === V.space || !LOADED.has(name)) return fn();
  const save = {backend: V.backend, pages: V.pages, raw: V.raw,
                dirty: V.dirty, removed: V.removed, space: V.space};
  const r = LOADED.get(name);
  V.backend = r.backend; V.pages = r.pages; V.raw = r.raw;
  V.dirty = r.dirty; V.removed = r.removed; V.space = name;
  try { return fn(); } finally { Object.assign(V, save); }
}

function setSync(state, text) {
  const dot = $("#syncDot"), txt = $("#syncTxt");
  if (!dot) return;
  dot.className = "dot " + state;
  // "browser storage" reads like a destination. It is not a folder, and people
  // go looking for files that were never written, so say so outright.
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");
  txt.textContent = (state === "ok" && !onDisk) ? "browser only \u2014 no files" : text;
  txt.title = onDisk ? "Saving to " + (V.backend.label || "")
                     : "Nothing in this space is written to disk";
}

function pagePaths() { return Array.from(V.pages.keys()); }
function getPage(path) { return V.pages.get(path); }

function putPage(path, page, {silent = false} = {}) {
  V.pages.set(path, page);
  V.removed.delete(path);
  if (!silent) { V.dirty.add(path); scheduleFlush(); }
  return page;
}
/* Stamp every edit. This single property is what lets two devices merge a
   vault through a cloud drive with no server in the middle. */
const nowStamp = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");

function touch(path) {
  QUIET_CACHE = null;
  const page = V.pages.get(path);
  if (page) {
    const props = page.props || (page.props = {});
    props.updated = nowStamp();
    const me = stampName();
    if (me) props.updated_by = me;
    else delete props.updated_by;
  }
  V.dirty.add(path);
  scheduleFlush();
  scheduleAutoSync();
}

function removePage(path) {
  V.pages.delete(path);
  V.dirty.delete(path);
  V.removed.add(path);
  addTombstone(path);
  scheduleFlush();
}

let flushTimer = null;
function scheduleFlush() {
  clearTimeout(flushTimer);
  setSync("warn", "unsaved");
  retryWait = 0;
  flushTimer = setTimeout(flush, 450);
}

/* Storage that was unreachable usually comes back -- a laptop lid, a sleeping
   Pi, a phone off wifi -- so keep trying on a widening interval rather than
   waiting for the next keystroke, which is what used to re-arm the timer. */
let retryWait = 0;
function retryFlush() {
  retryWait = retryWait ? Math.min(retryWait * 2, 60000) : 3000;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, retryWait);
}

/* Saves are serialised through one chain and each one captures the backend
   and page map it started with. Without that, switching space mid-save wrote
   one space's pages through another space's backend. */
let flushChain = Promise.resolve();
function flush() {
  flushChain = flushChain.then(doFlush, doFlush);
  return flushChain;
}

async function doFlush() {
  let wrote = false;
  for (const rec of Array.from(LOADED.values())) {
    if (!rec.backend || (!rec.dirty.size && !rec.removed.size)) continue;
    const dirty = Array.from(rec.dirty); rec.dirty.clear();
    const gone  = Array.from(rec.removed); rec.removed.clear();
    wrote = true;
    V.syncing = true;
    setSync("sync", "saving...");
    // The mirror goes first: after this line the work cannot be lost, whatever
    // the real backend does next.
    await writeMirror(rec, dirty);
    await markUnconfirmed(rec, dirty);
    await removeMirror(rec, gone);
    try {
      for (const p of dirty) {
        const page = rec.pages.get(p);
        if (page) await rec.backend.write(p, serializePage(page));
      }
      for (const p of gone) await rec.backend.remove(p).catch(() => {});
      await confirmMirror(rec, dirty);
      V.error = null;
    } catch (e) {
      dirty.forEach(p => rec.dirty.add(p));
      V.error = e;
      setSync("warn", "saved on device");
      notify(`Cannot reach ${rec.name}'s storage. Saved on this device and it ` +
             `will go up when the connection is back.`, "warn");
      V.syncing = false;
      retryFlush();                 // a sleeping box must not need a keystroke
      return;
    }
  }
  V.syncing = false;
  if (V.backend) setSync("ok", V.backend.label);
  if (wrote) Spaces.writeSummary().catch(() => {});
  for (const rec of LOADED.values()) if (rec.dirty.size || rec.removed.size) { scheduleFlush(); break; }
}

window.addEventListener("beforeunload", e => {
  if (V.dirty.size) { flush(); e.preventDefault(); e.returnValue = ""; }
});

/* Local mirror. Always written BEFORE the real backend, so a save cannot be
   lost to storage that turns out to be unreachable. How much it keeps depends
   on what the backend is, because the two cases need opposite things.

   A SERVER-backed space keeps a FULL copy. The vault lives on the server, so
   when the server is gone the mirror is the only thing the app can open at
   all. On Android that is the difference between opening to your tasks and
   opening to an empty list.

   A FOLDER-backed space keeps only what the folder has not confirmed yet. It
   needs no second copy -- the folder IS the local one -- and a full copy there
   would actively do harm: a page you deleted in Neovim or Explorer is simply
   missing from the folder, which to a full mirror looks like a page the folder
   has never seen, so the next load would put it back. Holding only
   unconfirmed writes means nothing is resurrected, and work still survives a
   folder that loses permission or gets unplugged mid-session.

   On the way back in, the mirror is merged by updated:: and anything newer
   locally is re-queued upstream. */
const mirrorFor = rec => Backends.idb(rec.name);
const mirrorMode = rec =>
  !rec.backend                  ? "off"
  : rec.backend.kind === "http" ? "full"
  : rec.backend.kind === "fs"   ? "pending"
  : "off";

async function writeMirror(rec, paths) {
  if (mirrorMode(rec) === "off") return;
  const m = mirrorFor(rec);
  for (const path of paths) {
    const page = rec.pages.get(path);
    try { if (page) await m.write(path, serializePage(page)); } catch (_) {}
  }
}

async function removeMirror(rec, paths) {
  if (mirrorMode(rec) === "off") return;
  const m = mirrorFor(rec);
  for (const path of paths) { try { await m.remove(path); } catch (_) {} }
}

/* The backend took these, so a "pending" mirror has no further use for them. A
   "full" mirror keeps the page but stops calling it unconfirmed. */
async function confirmMirror(rec, paths) {
  const mode = mirrorMode(rec);
  if (mode === "off") return;
  if (mode === "pending") {
    const m = mirrorFor(rec);
    for (const path of paths) { try { await m.remove(path); } catch (_) {} }
    return;
  }
  const open = await unconfirmed(rec);
  let changed = false;
  for (const path of paths) if (open.delete(path)) changed = true;
  if (changed) await setUnconfirmed(rec, open);
}

/* Paths a full mirror holds that the server has not acknowledged. Without this
   the mirror cannot tell a page another device deleted from a page whose own
   upload failed, and guessing either way is wrong: guess "deleted" and unsent
   work vanishes, guess "unsent" and deletions come back forever. */
const unconfirmedKey = rec => "unconfirmed:" + rec.name;
async function unconfirmed(rec) {
  try { return new Set((await IDB.get("kv", unconfirmedKey(rec))) || []); }
  catch (_) { return new Set(); }
}
async function setUnconfirmed(rec, set) {
  try { await IDB.set("kv", unconfirmedKey(rec), Array.from(set)); } catch (_) {}
}
async function markUnconfirmed(rec, paths) {
  if (mirrorMode(rec) !== "full" || !paths.length) return;
  const open = await unconfirmed(rec);
  paths.forEach(p => open.add(p));
  await setUnconfirmed(rec, open);
}

async function mergeMirror(rec) {
  const mode = mirrorMode(rec);
  if (mode === "off") return 0;
  let newer = 0;
  try {
    const m = mirrorFor(rec);
    const open = mode === "full" ? await unconfirmed(rec) : null;
    let pruned = false;
    for (const [path, text] of await m.list()) {
      const local = parsePage(text);
      const fromBackend = rec.pages.get(path);
      if (!fromBackend && mode === "full" && !open.has(path)) {
        // The backend answered and does not have this page, and we never failed
        // to send it: somebody else deleted it. Let the deletion stand.
        try { await m.remove(path); pruned = true; } catch (_) {}
        continue;
      }
      const a = local.props?.updated || "";
      const b = fromBackend?.props?.updated || "";
      if (!fromBackend || a > b) {
        rec.pages.set(path, local);
        rec.dirty.add(path);          // the backend has not seen this yet
        newer++;
      }
    }
    if (pruned && mode === "full") await setUnconfirmed(rec, open);
  } catch (_) {}
  return newer;
}

/* A vault bundle is itself a .md file, and people quite reasonably keep one in
   the folder they are syncing. Read as a page it would turn the whole vault
   into a single blob of text -- exactly the thing that is not wanted -- so it
   is recognised and left alone. */
const looksLikeBundle = text =>
  /<!--\s*gtd:(bundle|file)\b/.test(text.slice(0, 4000));

async function readInto(record) {
  const files = await record.backend.list();
  record.pages.clear(); record.raw.clear();
  let couriers = 0;
  for (const [path, text] of files) {
    if (/\.org$/i.test(path)) { record.raw.set(path, text); continue; }
    if (looksLikeBundle(text)) { couriers++; continue; }
    record.pages.set(path, parsePage(text));
  }
  if (couriers) {
    notify(couriers + (couriers === 1 ? " exported vault file is" : " exported vault files are") +
           " in this folder. Left as they are \u2014 they are copies for sending, not pages. " +
           "Keeping them outside the folder avoids the confusion.", "warn");
  }
  const newer = await mergeMirror(record);
  if (newer) {
    notify(newer + " change(s) made on this device are being sent up now.", "warn");
    scheduleFlush();
  }
  return record;
}

/* Load a space's files without making it the active one. */
/* Rename things an older vault still spells the old way. Cheap, idempotent,
   and it keeps links working rather than leaving dangling [[k/...]] behind. */
function migrateVault() {
  let moved = 0;
  const legacyLists = join(PAGES, "k");
  for (const path of Array.from(V.pages.keys())) {
    if (!path.startsWith(legacyLists + "/")) continue;
    const target = join(DIRS.lists, path.slice(legacyLists.length + 1));
    if (!V.pages.has(target)) {
      putPage(target, getPage(path));
      removePage(path);
      moved++;
    }
  }
  if (moved) {
    rewriteChecklistLinks();
    notify("Moved " + moved + " checklist(s) to pages/8/.");
  }
  migrateHorizons();
  return moved;
}

function rewriteChecklistLinks() {
  const re = /\[\[k\/([^\]]+)\]\]/g;
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = str => { const n = String(str).replace(re, "[[8/$1]]"); if (n !== str) hit = true; return n; };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) touch(path);
  }
}

async function loadSpaceRecord(name) {
  const sp = Spaces.get(name);
  if (!sp) return null;
  const rec = LOADED.get(name) || newRecord(name, null);
  rec.backend = await spaceBackend(sp);
  await readInto(rec);
  LOADED.set(name, rec);
  return rec;
}

async function loadFromBackend(backend) {
  setSync("sync", "loading...");
  const name = Spaces.active || "Personal";
  const rec = LOADED.get(name) || newRecord(name, backend);
  rec.backend = backend;
  await readInto(rec);
  LOADED.set(name, rec);
  bindActive(name);
  $("#vaultName").textContent = backend.label;
  setSync("ok", backend.label);
  if (V.raw.size) {
    notify(V.raw.size + " .org files found -- open Vault → Import .org to convert them.", "warn");
  }
}

/* ============================================================
   22_SPACES
   Separate folders for separate parts of a life: Work, Private,
   Volunteer. A space is a COMPLETE, self-contained vault -- its own
   journals, projects, contexts, checklists and its own horizons, right
   up to its own purpose and vision.

   That matters for sharing. The unit you hand to someone is a whole
   space: a folder you share in OneDrive or Dropbox, or one exported
   markdown file. Nothing from another space is inside it, so colleagues
   who get Work cannot see Private, and family who get Home cannot see
   Work. The separation is the folder boundary, not a filter in the UI
   that someone could switch off.

   Each space picks its own storage, so Work can live in the company
   OneDrive while Private lives in iCloud and never touches it.
   ============================================================ */
/* A space's colour is how you tell its rows apart when several are on screen,
   so it is worth choosing rather than accepting. The first six cycle as new
   spaces are created; the palette below is what the picker offers, and any
   hex at all is allowed past that. Like the visibility toggles, the colour is
   held in this device's own list of spaces, never inside a space, so it does
   not travel in a folder you share. */
const SPACE_COLORS = ["#6aa3ff", "#5ecfc0", "#ff9f6b", "#c792ea", "#e0b050", "#4fbf7b"];
const SPACE_PALETTE = [
  ["#6aa3ff", "Blue"],   ["#38bdf8", "Sky"],    ["#5ecfc0", "Teal"],
  ["#4fbf7b", "Green"],  ["#9bcf3f", "Lime"],   ["#e0b050", "Amber"],
  ["#ff9f6b", "Orange"], ["#ff6b6b", "Red"],    ["#f06595", "Pink"],
  ["#c792ea", "Violet"], ["#818cf8", "Indigo"], ["#94a3b8", "Slate"],
];

/* Accepts #abc, #aabbcc or a bare aabbcc; anything else is not a colour. */
function normHex(c) {
  let v = trim(c).toLowerCase();
  if (!v) return null;
  if (v[0] !== "#") v = "#" + v;
  if (!/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/.test(v)) return null;
  if (v.length === 4) v = "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
  return v;
}

/* Relative luminance, WCAG's definition, for the two readability calls below. */
function relLum(hex) {
  const h = normHex(hex);
  if (!h) return 0;
  const lin = n => { const v = n / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(parseInt(h.slice(1, 3), 16))
       + 0.7152 * lin(parseInt(h.slice(3, 5), 16))
       + 0.0722 * lin(parseInt(h.slice(5, 7), 16));
}
function contrast(a, b) {
  const [hi, lo] = [relLum(a), relLum(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}

/* Dark or light ink to put on top of a colour. Once any hex can be chosen the
   letter in the avatar has to follow the background, or a navy space loses it.
   Measured rather than guessed at a brightness cutoff: mid colours like violet
   sit close enough to the middle that only the two ratios settle it. */
function inkOn(hex) {
  const h = normHex(hex);
  if (!h) return "var(--accent-fg)";
  return contrast(h, "#06101f") >= contrast(h, "#ffffff") ? "#06101f" : "#ffffff";
}

/* The surface a space's badge is drawn on, read from the live theme so the
   warning below follows whichever of dark and light is on. */
function themeSurface() {
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue("--bg2");
    return normHex(v) || "#161920";
  } catch (_) { return "#161920"; }
}

/* The colour to draw a space in, including spaces saved before colours were
   chooseable: those fall back to their position in the cycle. */
function spaceColor(name) {
  const hex = normHex(Spaces.get(name)?.color);
  if (hex) return hex;
  const i = Spaces.list.findIndex(s => s.name === name);
  return SPACE_COLORS[(i < 0 ? 0 : i) % SPACE_COLORS.length];
}
const nextSpaceColor = () => SPACE_COLORS[Spaces.list.length % SPACE_COLORS.length];
const paletteName = hex => (SPACE_PALETTE.find(c => c[0] === hex) || [, hex])[1];
const SPACE_EXAMPLES = ["Work", "Private", "Volunteer", "Family", "Studies", "Side project"];

/* App-level preferences live outside every space, so switching space does
   not re-ask how you like the app, and so a shared space carries none of it. */
const PREF = {
  get(k, d = null) {
    const v = safeLS.get("gtd.pref." + k);
    return v === null ? (PREF._mem?.[k] ?? d) : v;
  },
  set(k, v) {
    if (!safeLS.set("gtd.pref." + k, v)) (PREF._mem || (PREF._mem = {}))[k] = v;
  },
  _mem: null,
};

const Spaces = {
  list: [],          // [{name, kind, label, server, color}]
  active: null,

  async load() {
    try { Spaces.list = (await IDB.get("kv", "spaces")) || []; }
    catch (_) { Spaces.list = []; }
    try { Spaces.list = JSON.parse(PREF.get("spaces") || "null") || Spaces.list; }
    catch (_) {}
    return Spaces.list;
  },
  async save() {
    try { await IDB.set("kv", "spaces", Spaces.list); } catch (_) {}
    PREF.set("spaces", JSON.stringify(Spaces.list));
  },
  get(name) { return Spaces.list.find(s => s.name === name) || null; },

  async add(sp) {
    if (Spaces.get(sp.name)) return Spaces.get(sp.name);
    sp.color = normHex(sp.color) || nextSpaceColor();
    Spaces.list.push(sp);
    await Spaces.save();
    return sp;
  },

  /* Repaint one space. Rejects anything that is not a colour rather than
     writing it, so a bad value cannot leave a space invisible. */
  async setColor(name, color) {
    const sp = Spaces.get(name);
    const hex = normHex(color);
    if (!sp || !hex) return false;
    sp.color = hex;
    await Spaces.save();
    return true;
  },

  async remove(name) {
    Spaces.list = Spaces.list.filter(s => s.name !== name);
    await Spaces.save();
    try { await IDB.del("kv", "dir:" + name); } catch (_) {}
    try { await IDB.del("kv", "bundle:" + name); } catch (_) {}
    try { await IDB.del("kv", "summary:" + name); } catch (_) {}
  },

  /* A cheap per-space tally, cached so the switcher can show every space
     without loading them all. Refreshed whenever that space is saved. */
  async summary(name) {
    try { return (await IDB.get("kv", "summary:" + name)) || null; } catch (_) { return null; }
  },
  async writeSummary() {
    if (!Spaces.active) return;
    try {
      const acts = leafActions();
      await IDB.set("kv", "summary:" + Spaces.active, {
        open: acts.filter(a => OPEN_STATES[a.state]).length,
        late: acts.filter(a => a.group === "LATE").length,
        at: nowStamp(),
      });
    } catch (_) {}
  },
};

/* ============================================================
   23_SPACE_FOLDERS
   Every space gets its own folder, and that is enforced rather than
   advised. Two spaces in one folder would put Work and Private in the
   same place -- share that folder and you share both. One space nested
   inside another is worse still: the outer space walks its whole tree, so
   it would read and sync the inner space's files as if they were its own.

   The File System Access API gives no paths, so identity is tested with
   isSameEntry() and containment with resolve(), which returns the path
   segments when a handle really is a descendant.
   ============================================================ */
async function storedHandle(spaceName) {
  try { return (await IDB.get("kv", "dir:" + spaceName)) || null; } catch (_) { return null; }
}

/* Returns {space, how} when this folder cannot be used, else null. */
async function folderConflict(handle, exceptSpace) {
  for (const sp of Spaces.list) {
    if (sp.name === exceptSpace) continue;
    if (sp.kind !== "fs") continue;
    const other = await storedHandle(sp.name);
    if (!other) continue;
    try {
      if (await other.isSameEntry(handle)) return {space: sp.name, how: "same"};
      if (await other.resolve(handle))     return {space: sp.name, how: "inside"};
      if (await handle.resolve(other))     return {space: sp.name, how: "contains"};
    } catch (_) { /* an unreadable handle cannot be proven safe, but nor is it a conflict */ }
  }
  return null;
}

function conflictMessage(name, c) {
  if (c.how === "same")
    return `That folder already holds ${c.space}. Two spaces in one folder would put them in the same place — share it and you share both. Pick a different folder for ${name}.`;
  if (c.how === "inside")
    return `That folder is inside ${c.space}'s folder. ${c.space} reads everything beneath it, so it would swallow ${name}. Pick a folder outside it.`;
  return `That folder contains ${c.space}'s folder. ${name} would read and sync ${c.space}'s files as its own. Pick a folder that does not contain it.`;
}

/* Pick a folder for one space, refusing anything that collides. */
async function assignSpaceFolder(name) {
  if (!CAP.dirPicker) {
    notify("This browser cannot open folders.", "warn");
    return false;
  }
  const sp = Spaces.get(name);
  if (!sp) return false;
  let handle;
  try {
    handle = await window.showDirectoryPicker({mode: "readwrite", id: "gtd-space-" + name});
  } catch (e) {
    if (e.name !== "AbortError") notify("Could not open that folder: " + e.message, "error");
    return false;
  }
  const clash = await folderConflict(handle, name);
  if (clash) { notify(conflictMessage(name, clash), "error"); return false; }

  // Whatever the space already holds has to come with it, or moving a space
  // into a folder would look exactly like losing everything in it.
  let carried = new Map();
  try {
    const prev = LOADED.get(name) || await loadSpaceRecord(name);
    if (prev) carried = new Map(prev.pages);
  } catch (_) {}

  await IDB.set("kv", "dir:" + name, handle);
  sp.kind = "fs"; sp.label = handle.name;
  delete sp.legacyFlat; delete sp.placeholder;
  sp.askedStorage = true;
  await Spaces.save();

  const rec = newRecord(name, Backends.fs(handle));
  await readInto(rec);                              // what the folder already has wins
  let moved = 0;
  for (const [path, page] of carried) {
    if (rec.pages.has(path)) continue;
    rec.pages.set(path, page);
    rec.dirty.add(path);
    moved++;
  }
  LOADED.set(name, rec);

  if (name === Spaces.active) {
    bindActive(name);
    migrateVault();
    await seedIfEmpty();
    scanVerbs();
    $("#vaultName").textContent = handle.name;
  }
  await flush();
  notify(name + " now lives in \u201C" + handle.name + "\u201D" +
         (moved ? ", with " + moved + " page" + (moved === 1 ? "" : "s") + " moved in." : "."));
  render();
  return true;
}

/* Warn if an older setup already has two spaces sharing or nesting. */
async function checkFolderConflicts() {
  const fs = Spaces.list.filter(s => s.kind === "fs");
  for (let i = 0; i < fs.length; i++) {
    const a = await storedHandle(fs[i].name);
    if (!a) continue;
    for (let j = i + 1; j < fs.length; j++) {
      const b = await storedHandle(fs[j].name);
      if (!b) continue;
      try {
        if (await a.isSameEntry(b))
          notify(`${fs[i].name} and ${fs[j].name} share one folder. Give one of them its own.`, "error");
        else if (await a.resolve(b) || await b.resolve(a))
          notify(`${fs[i].name} and ${fs[j].name} are nested folders. One is reading the other's files.`, "error");
      } catch (_) {}
    }
  }
}

/* ---------- the startup question ---------- */
function spacesNeedingStorage() {
  return Spaces.list.filter(sp => sp.kind === "local" && !sp.askedStorage);
}

function openSpaceStorageSetup({firstRun = false} = {}) {

/* ---------- which spaces are on screen right now ----------
   The active space is where new things land; any number of others can be
   shown alongside it. Toggling is per device, never written into a space,
   so nothing about your other lives travels inside a shared folder. */
/* Which spaces are on screen is entirely your choice -- including hiding the
   one you are capturing into. The only rule is that at least one is shown, and
   that the active space is always one of the shown ones (untick it and the
   active role moves to another visible space). */
function storedVisible() {
  let names = [];
  try { names = JSON.parse(PREF.get("visibleSpaces") || "[]"); } catch (_) {}
  return names.filter(n => Spaces.get(n));
}
function visibleSpaces() {
  const names = storedVisible();
  if (names.length) return names;
  if (Spaces.active) return [Spaces.active];
  return Spaces.list.length ? [Spaces.list[0].name] : [];
}
function setVisibleSpaces(names) {
  PREF.set("visibleSpaces", JSON.stringify(Array.from(new Set(names))));
}
const multiSpace = () => visibleSpaces().length > 1;

async function ensureVisibleLoaded() {
  for (const n of visibleSpaces()) {
    if (!LOADED.has(n)) { try { await loadSpaceRecord(n); } catch (_) {} }
  }
}

/* Run a scanner once per visible space and tag each result with its space. */
let ACROSS = 0;
function acrossSpaces(fn) {
  const names = visibleSpaces();
  if (names.length <= 1 || ACROSS > 0) return fn();
  const out = [];
  ACROSS++;
  try {
    for (const n of names) {
      if (!LOADED.has(n)) continue;
      const res = inSpace(n, fn);
      if (Array.isArray(res)) for (const item of res) {
        if (item && typeof item === "object") item.space = n;
        out.push(item);
      }
    }
  } finally { ACROSS--; }
  return out;
}

async function ensureHandlePerm(h, mode = "readwrite") {
  try {
    if ((await h.queryPermission({mode})) === "granted") return true;
    return (await h.requestPermission({mode})) === "granted";
  } catch (_) { return false; }
}

/* Build the storage this space asked for, degrading loudly rather than
   silently writing somewhere the user did not expect. */
async function spaceBackend(sp) {
  if (sp.kind === "http" && sp.server) {
    try { const b = Backends.http(sp.server); await b.list(); return b; }
    catch (e) { notify(`"${sp.name}" server unreachable, using browser storage.`, "warn"); }
  }
  if (sp.kind === "fs") {
    try {
      const h = await IDB.get("kv", "dir:" + sp.name);
      if (h && await ensureHandlePerm(h)) return Backends.fs(h);
      if (h) notify(`"${sp.name}" needs folder permission again — reconnect it in Vault & sync.`, "warn");
    } catch (_) {}
  }
  const ns = sp.legacyFlat ? "" : sp.name;
  return CAP.idb ? Backends.idb(ns) : CAP.ls ? Backends.ls(ns) : Backends.memory(ns);
}

async function openSpace(name) {
  const sp = Spaces.get(name);
  if (!sp) { notify("No such space: " + name, "error"); return; }
  if (Spaces.active) await flush();     // drain before the backend changes underneath
  await Spaces.writeSummary().catch(() => {});

  Spaces.active = name;
  PREF.set("activeSpace", name);
  // Opening a space always shows it. If you were looking at a single space,
  // switching replaces it; if you were looking at several, it joins them.
  const shownNow = storedVisible();
  if (shownNow.length && !shownNow.includes(name)) {
    setVisibleSpaces(shownNow.length === 1 ? [name] : shownNow.concat([name]));
  }
  LINKED = null;                                  // the linked vault file is per space
  try { LINKED = (await IDB.get("kv", "bundle:" + name)) || null; } catch (_) {}

  await loadFromBackend(await spaceBackend(sp));
  V.space = name;
  migrateVault();
  await seedIfEmpty();             // a brand new space still needs verbs and templates
  scanVerbs();
  ensureJournal(todayISO());
  state.context = getSetting("current_context") || null;
  if (!getSetting("started")) setSetting("started", todayISO());
  state.view = "today";
  state.pagePath = null;
  await ensureVisibleLoaded();
  render();
  await Spaces.writeSummary().catch(() => {});
  AUTOSYNC_AT = 0;                  // arriving in a space is worth one merge
  autoSyncLinked();
}

/* ---------- creating and sharing ---------- */
async function createSpace(name, kind, color) {
  const clean = trim(name).replace(/[^\w \-]/g, "").slice(0, 40) || "Space";
  if (Spaces.get(clean)) { notify("A space called " + clean + " already exists.", "warn"); return null; }
  const sp = {name: clean, kind: kind || "local"};
  if (normHex(color)) sp.color = normHex(color);   // else Spaces.add takes the next in the cycle
  if (kind === "fs") {
    if (!CAP.dirPicker) { notify("This browser cannot open folders; using browser storage.", "warn"); sp.kind = "local"; }
    else {
      try {
        const h = await window.showDirectoryPicker({mode: "readwrite", id: "gtd-space-" + clean});
        const clash = await folderConflict(h, clean);
        if (clash) { notify(conflictMessage(clean, clash), "error"); return null; }
        await IDB.set("kv", "dir:" + clean, h);
        sp.label = h.name;
        sp.askedStorage = true;
      } catch (e) {
        if (e.name === "AbortError") return null;
        notify("Could not open that folder: " + e.message, "error");
        sp.kind = "local";
      }
    }
  }
  await Spaces.add(sp);
  return sp;
}

/* ---------- choosing a space's colour ----------
   One chooser, used by "New space", the space switcher and Vault & sync:
   twelve swatches, a native well for anything the palette does not hold, and
   the hex itself for a colour that has to match something exactly. It reports
   each choice through onPick and stores nothing; the caller decides whether and
   when a choice is committed. */
function colorPicker(initial, onPick) {
  let cur = normHex(initial) || SPACE_COLORS[0];
  const wrap = el("div", {class: "swatches"});
  const well = el("input", {type: "color", "aria-label": "Any other colour"});
  const wellBox = el("span", {class: "colorwell", title: "Any other colour"}, well);
  const hex = el("input", {class: "hexinput", "aria-label": "Colour as hex",
                           spellcheck: "false", maxlength: "7"});

  const paint = () => {
    for (const b of wrap.querySelectorAll(".swatch")) {
      const on = b.dataset.hex === cur;
      b.classList.toggle("on", on);
      b.textContent = on ? "\u2713" : "";
      b.style.color = on ? inkOn(cur) : "transparent";
    }
    wellBox.classList.toggle("on", !SPACE_PALETTE.some(c => c[0] === cur));
    well.value = cur;
    // Only rewrite what is being typed when it means a different colour, so
    // "#6aa" on the way to "#6aa3ff" is not snatched back mid-keystroke.
    if (normHex(hex.value) !== cur) hex.value = cur;
  };
  const choose = next => {
    const h = normHex(next);
    if (!h || h === cur) { paint(); return; }   // nonsense in the hex box snaps back
    cur = h;
    paint();
    onPick(cur);
  };

  for (const [c, label] of SPACE_PALETTE) {
    const b = el("button", {class: "swatch", title: label, "aria-label": label,
      style: "background:" + c, onclick: e => { e.preventDefault(); choose(c); }});
    b.dataset.hex = c;
    wrap.append(b);
  }
  well.addEventListener("input", () => choose(well.value));
  hex.addEventListener("input", () => { if (normHex(hex.value)) choose(hex.value); });
  hex.addEventListener("change", () => { choose(hex.value); hex.value = cur; });
  wrap.append(el("span", {class: "sep"}), wellBox, hex);
  paint();
  return wrap;
}

/* The two places a space's colour is actually read: the sidebar avatar and the
   badge rows carry when spaces are shown together. Showing both while choosing
   beats discovering afterwards that two spaces came out the same. `name` may be
   a getter, for a space whose name is still being typed; paint() with no colour
   repaints the name alone. */
function colorPreview(name, hex) {
  const box = el("div", {class: "cpreview"});
  let cur = normHex(hex) || SPACE_COLORS[0];
  const paint = c => {
    cur = normHex(c) || cur;
    const label = trim(typeof name === "function" ? name() : name) || "Space";
    box.textContent = "";
    box.append(
      el("span", {class: "avatar", style: "background:" + cur + ";color:" + inkOn(cur)},
        label[0].toUpperCase()),
      el("span", {class: "chip spacechip", style: "color:" + cur + ";border-color:" + cur + "55"},
        label),
      el("span", {style: "color:var(--fg3);font-size:11.5px"}, paletteName(cur)));
    // The badge is drawn in the colour itself, so one too close to the page
    // disappears. Say so here rather than let it be found in a crowded list.
    if (contrast(cur, themeSurface()) < 3) {
      box.append(el("span", {style: "color:var(--warn);font-size:11.5px"},
        "\u2014 too close to the page behind it to read"));
    }
  };
  paint(cur);
  return {node: box, paint};
}

/* Recolour an existing space. Nothing is written until "Use colour", so trying
   colours out costs nothing; `back` is where Cancel and Save return to. */
function openSpaceColor(name, back) {
  const sp = Spaces.get(name);
  if (!sp) return;
  const before = spaceColor(name);
  let chosen = before;
  const preview = colorPreview(name, before);
  const picker = colorPicker(before, c => { chosen = c; preview.paint(c); });
  const leave = () => { closeModal(); if (back) back(); };

  modal({
    center: true, title: "Colour for " + name,
    hint: sp.kind === "fs" ? (sp.label || "folder") : sp.kind === "http" ? "server" : "this browser",
    body: el("div", {class: "field"},
      el("label", {}, "Pick a colour"),
      picker,
      preview.node,
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:10px"},
        "The colour of " + name + " in the sidebar, in the space switcher, and on the badge " +
        "every row carries when several spaces are shown at once. Kept in this device's list " +
        "of spaces, so it is not inside the folder or file you share.")),
    foot: [
      el("button", {class: "btn ghost", onclick: leave}, "Cancel"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: async () => {
        if (chosen !== before) {
          await Spaces.setColor(name, chosen);
          notify(name + " is now " + paletteName(chosen) + ".");
        }
        leave();
        render();
      }}, "Use colour"),
    ],
  });
}

function openSpaceSwitcher() {
  const visible = new Set(visibleSpaces());
  const body = el("div", {});
  body.append(el("div", {class: "field", style: "padding-bottom:4px"},
    el("label", {}, "Shown together"),
    el("div", {style: "color:var(--fg2);font-size:12.5px"},
      "Tick the spaces you want on screen \u2014 any combination, including hiding " +
      "the one you are in. Tap a name to make it the space new captures land in; " +
      "that one is highlighted. Your choice sticks until you change it."),
    el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
      "Untick a space and it is gone from every list until you tick it back. " +
      "The dot on the right of each row sets that space's colour.")));

  for (const sp of Spaces.list) {
    const on = visible.has(sp.name);
    const active = sp.name === Spaces.active;
    const box = el("button", {
      class: "spacetoggle" + (on ? " on" : ""),
      title: on ? "Hide " + sp.name : "Show " + sp.name,
      onclick: async e => {
        e.stopPropagation();
        const next = new Set(visibleSpaces());
        if (on) {
          if (next.size === 1) { notify("At least one space has to be shown."); return; }
          next.delete(sp.name);
        } else {
          next.add(sp.name);
        }
        setVisibleSpaces(Array.from(next));
        await ensureVisibleLoaded();
        // Hiding the space you were capturing into hands that role to a visible one.
        if (!next.has(Spaces.active)) await openSpace(Array.from(next)[0]);
        closeModal(); render(); openSpaceSwitcher();
      },
    }, on ? "\u2713" : "");
    const color = spaceColor(sp.name);
    const row = el("div", {class: "pick" + (active ? " cur" : "")},
