  fs(rootHandle) {
    const dirCache = new Map([["", rootHandle]]);
    async function dirFor(path, create=false) {
      if (dirCache.has(path)) return dirCache.get(path);
      const parts = path.split("/").filter(Boolean);
      let h = rootHandle, sofar = "";
      for (const p of parts) {
        sofar = sofar ? sofar + "/" + p : p;
        if (dirCache.has(sofar)) { h = dirCache.get(sofar); continue; }
        h = await h.getDirectoryHandle(p, {create});
        dirCache.set(sofar, h);
      }
      return h;
    }
    return {
      kind: "fs", label: rootHandle.name, writable: true, handle: rootHandle,
      async list() {
        const out = new Map();
        const walk = async (dir, prefix) => {
          for await (const [name, h] of dir.entries()) {
            if (name.startsWith(".")) continue;
            const p = prefix ? prefix + "/" + name : name;
            if (h.kind === "directory") { dirCache.set(p, h); await walk(h, p); }
            else if (/\.(md|org)$/i.test(name)) out.set(p, await (await h.getFile()).text());
          }
        };
        await walk(rootHandle, "");
        return out;
      },
      async write(path, text) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"), true);
        const fh = await dir.getFileHandle(path.split("/").pop(), {create: true});
        const w = await fh.createWritable();
        await w.write(text); await w.close();
      },
      async remove(path) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"));
        await dir.removeEntry(path.split("/").pop());
      },
      /* A picture is a file in the folder, next to the markdown that mentions
         it, so the folder you share carries the whole note and not just its
         words. */
      async putAsset(path, blob) {
        const dir = await dirFor(path.split("/").slice(0, -1).join("/"), true);
        const fh = await dir.getFileHandle(path.split("/").pop(), {create: true});
        const w = await fh.createWritable();
        await w.write(blob); await w.close();
      },
      async getAsset(path) {
        try {
          const dir = await dirFor(path.split("/").slice(0, -1).join("/"));
          const fh = await dir.getFileHandle(path.split("/").pop());
          return await fh.getFile();
        } catch (_) { return null; }
      },
    };
  },

  /* ---------- HTTP sync server (serve.py) ---------- */
  http(base) {
    const u = (p, q) => base.replace(/\/$/, "") + p + (q ? "?path=" + encodeURIComponent(q) : "");
    return {
      kind: "http", label: base.replace(/^https?:\/\//, "") || "server", writable: true,
      async list() {
        const r = await fetch(u("/api/list"));
        if (!r.ok) throw new Error("list failed: " + r.status);
        const paths = await r.json();
        const out = new Map();
        await Promise.all(paths.map(async p => {
          const f = await fetch(u("/api/file", p));
          if (f.ok) out.set(p, await f.text());
        }));
        return out;
      },
      async write(path, text) {
        const r = await fetch(u("/api/file", path), {
          method: "PUT", headers: {"Content-Type": "text/plain; charset=utf-8"}, body: text,
        });
        if (!r.ok) throw new Error("write failed: " + r.status);
      },
      async remove(path) { await fetch(u("/api/file", path), {method: "DELETE"}); },
      async putAsset(path, blob) {
        const r = await fetch(u("/api/asset", path), {
          method: "PUT", headers: {"Content-Type": blob.type || "application/octet-stream"}, body: blob,
        });
        if (!r.ok) throw new Error("asset write failed: " + r.status);
      },
      async getAsset(path) {
        const r = await fetch(u("/api/asset", path));
        return r.ok ? await r.blob() : null;
      },
    };
  },
};

/* ============================================================
   20_VAULT -- in-memory model over the backend
   ============================================================ */
/* Every space keeps its own record. V points at the active one and shares the
   very same Map and Set objects, so all the single-space code below works
   untouched while saves stay routed to the right backend. */
const LOADED = new Map();   // space name -> {name, backend, pages, raw, dirty, removed}

const V = {
  backend : null,
  pages   : new Map(),   // path -> {props, blocks}
  raw     : new Map(),   // path -> original text (for .org files kept verbatim)
  dirty   : new Set(),
  removed : new Set(),
  loaded  : false,
  syncing : false,
  error   : null,
  space   : null,
};

function newRecord(name, backend) {
  return {name, backend, pages: new Map(), raw: new Map(), dirty: new Set(), removed: new Set()};
}
function bindActive(name) {
  const r = LOADED.get(name);
  if (!r) return;
  V.backend = r.backend; V.pages = r.pages; V.raw = r.raw;
  V.dirty = r.dirty; V.removed = r.removed; V.space = name;
  V.loaded = true;
}

/* Run fn with V pointing at another loaded space, then put it back. Used both
   to read across spaces and to route an edit to the space that owns it. */
function inSpace(name, fn) {
  if (!name || name === V.space || !LOADED.has(name)) return fn();
  const save = {backend: V.backend, pages: V.pages, raw: V.raw,
                dirty: V.dirty, removed: V.removed, space: V.space};
  const r = LOADED.get(name);
  V.backend = r.backend; V.pages = r.pages; V.raw = r.raw;
  V.dirty = r.dirty; V.removed = r.removed; V.space = name;
  try { return fn(); } finally { Object.assign(V, save); }
}

function setSync(state, text) {
  const dot = $("#syncDot"), txt = $("#syncTxt");
  if (!dot) return;
  dot.className = "dot " + state;
  // "browser storage" reads like a destination. It is not a folder, and people
  // go looking for files that were never written, so say so outright.
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");
  txt.textContent = (state === "ok" && !onDisk) ? "browser only - no files" : text;
  txt.title = onDisk ? "Saving to " + (V.backend.label || "")
                     : "Nothing in this space is written to disk";
}

function pagePaths() { return Array.from(V.pages.keys()); }
function getPage(path) { return V.pages.get(path); }

function putPage(path, page, {silent = false} = {}) {
  V.pages.set(path, page);
  V.removed.delete(path);
  if (!silent) { V.dirty.add(path); scheduleFlush(); }
  return page;
}
/* Stamp every edit. This single property is what lets two devices merge a
   vault through a cloud drive with no server in the middle. */
const nowStamp = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");

function touch(path) {
  clearMemo();
  QUIET_CACHE = null;
  const page = V.pages.get(path);
  if (page) {
    const props = page.props || (page.props = {});
    props.updated = nowStamp();
    const me = stampName();
    if (me) props.updated_by = me;
    else delete props.updated_by;
  }
  V.dirty.add(path);
  scheduleFlush();
  scheduleAutoSync();
}

function removePage(path) {
  V.pages.delete(path);
  V.dirty.delete(path);
  V.removed.add(path);
  addTombstone(path);
  scheduleFlush();
}

let flushTimer = null;
function scheduleFlush() {
  clearTimeout(flushTimer);
  setSync("warn", "unsaved");
  retryWait = 0;
  flushTimer = setTimeout(flush, 450);
}

/* Storage that was unreachable usually comes back -- a laptop lid, a sleeping
   Pi, a phone off wifi -- so keep trying on a widening interval rather than
   waiting for the next keystroke, which is what used to re-arm the timer. */
let retryWait = 0;
function retryFlush() {
  retryWait = retryWait ? Math.min(retryWait * 2, 60000) : 3000;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, retryWait);
}

/* Saves are serialised through one chain and each one captures the backend
   and page map it started with. Without that, switching space mid-save wrote
   one space's pages through another space's backend. */
let flushChain = Promise.resolve();

/* Set by Start afresh, between the wipe and the reload. Without it a focus
   event or a pending debounce could write the vault straight back into the
   storage we just emptied, and beforeunload below would argue with the
   reload. See 151_START AFRESH. */
let WIPING = false;

function flush() {
  flushChain = flushChain.then(doFlush, doFlush);
  return flushChain;
}

async function doFlush() {
  if (WIPING) return;
  let wrote = false;
  for (const rec of Array.from(LOADED.values())) {
    if (!rec.backend || (!rec.dirty.size && !rec.removed.size)) continue;
    const dirty = Array.from(rec.dirty); rec.dirty.clear();
    const gone  = Array.from(rec.removed); rec.removed.clear();
    wrote = true;
    V.syncing = true;
    setSync("sync", "saving...");
    // The mirror goes first: after this line the work cannot be lost, whatever
    // the real backend does next.
    await writeMirror(rec, dirty);
    await markUnconfirmed(rec, dirty);
    await removeMirror(rec, gone);
    try {
      for (const p of dirty) {
        const page = rec.pages.get(p);
        if (page) await rec.backend.write(p, serializePage(page));
      }
      for (const p of gone) await rec.backend.remove(p).catch(() => {});
      await confirmMirror(rec, dirty);
      V.error = null;
    } catch (e) {
      dirty.forEach(p => rec.dirty.add(p));
      V.error = e;
      setSync("warn", "saved on device");
      notify(`Cannot reach ${rec.name}'s storage. Saved on this device and it ` +
             `will go up when the connection is back.`, "warn");
      V.syncing = false;
      retryFlush();                 // a sleeping box must not need a keystroke
      return;
    }
  }
  V.syncing = false;
  if (V.backend) setSync("ok", V.backend.label);
  if (wrote) Spaces.writeSummary().catch(() => {});
  for (const rec of LOADED.values()) if (rec.dirty.size || rec.removed.size) { scheduleFlush(); break; }
}

window.addEventListener("beforeunload", e => {
  if (WIPING) return;
  if (V.dirty.size) { flush(); e.preventDefault(); e.returnValue = ""; }
});

/* Local mirror. Always written BEFORE the real backend, so a save cannot be
   lost to storage that turns out to be unreachable. How much it keeps depends
   on what the backend is, because the two cases need opposite things.

   A SERVER-backed space keeps a FULL copy. The vault lives on the server, so
   when the server is gone the mirror is the only thing the app can open at
   all. On Android that is the difference between opening to your tasks and
   opening to an empty list.

   A FOLDER-backed space keeps only what the folder has not confirmed yet. It
   needs no second copy -- the folder IS the local one -- and a full copy there
   would actively do harm: a page you deleted in Neovim or Explorer is simply
   missing from the folder, which to a full mirror looks like a page the folder
   has never seen, so the next load would put it back. Holding only
   unconfirmed writes means nothing is resurrected, and work still survives a
   folder that loses permission or gets unplugged mid-session.

   On the way back in, the mirror is merged by updated:: and anything newer
   locally is re-queued upstream. */
const mirrorFor = rec => Backends.idb(rec.name);
const mirrorMode = rec =>
  !rec.backend                  ? "off"
  : rec.backend.kind === "http" ? "full"
  : rec.backend.kind === "fs"   ? "pending"
  : "off";

async function writeMirror(rec, paths) {
  if (mirrorMode(rec) === "off") return;
  const m = mirrorFor(rec);
  for (const path of paths) {
    const page = rec.pages.get(path);
    try { if (page) await m.write(path, serializePage(page)); } catch (_) {}
  }
}

async function removeMirror(rec, paths) {
  if (mirrorMode(rec) === "off") return;
  const m = mirrorFor(rec);
  for (const path of paths) { try { await m.remove(path); } catch (_) {} }
}

/* The backend took these, so a "pending" mirror has no further use for them. A
   "full" mirror keeps the page but stops calling it unconfirmed. */
async function confirmMirror(rec, paths) {
  const mode = mirrorMode(rec);
  if (mode === "off") return;
  if (mode === "pending") {
    const m = mirrorFor(rec);
    for (const path of paths) { try { await m.remove(path); } catch (_) {} }
    return;
  }
  const open = await unconfirmed(rec);
  let changed = false;
  for (const path of paths) if (open.delete(path)) changed = true;
  if (changed) await setUnconfirmed(rec, open);
}

/* Paths a full mirror holds that the server has not acknowledged. Without this
   the mirror cannot tell a page another device deleted from a page whose own
   upload failed, and guessing either way is wrong: guess "deleted" and unsent
   work vanishes, guess "unsent" and deletions come back forever. */
const unconfirmedKey = rec => "unconfirmed:" + rec.name;
async function unconfirmed(rec) {
  try { return new Set((await IDB.get("kv", unconfirmedKey(rec))) || []); }
  catch (_) { return new Set(); }
}
async function setUnconfirmed(rec, set) {
  try { await IDB.set("kv", unconfirmedKey(rec), Array.from(set)); } catch (_) {}
}
async function markUnconfirmed(rec, paths) {
  if (mirrorMode(rec) !== "full" || !paths.length) return;
  const open = await unconfirmed(rec);
  paths.forEach(p => open.add(p));
  await setUnconfirmed(rec, open);
}

async function mergeMirror(rec) {
  const mode = mirrorMode(rec);
  if (mode === "off") return 0;
  let newer = 0;
  try {
    const m = mirrorFor(rec);
    const open = mode === "full" ? await unconfirmed(rec) : null;
    let pruned = false;
    for (const [path, text] of await m.list()) {
      const local = parsePage(text);
      const fromBackend = rec.pages.get(path);
      if (!fromBackend && mode === "full" && !open.has(path)) {
        // The backend answered and does not have this page, and we never failed
        // to send it: somebody else deleted it. Let the deletion stand.
        try { await m.remove(path); pruned = true; } catch (_) {}
        continue;
      }
      const a = local.props?.updated || "";
      const b = fromBackend?.props?.updated || "";
      if (!fromBackend || a > b) {
        rec.pages.set(path, local);
        rec.dirty.add(path);          // the backend has not seen this yet
        newer++;
      }
    }
    if (pruned && mode === "full") await setUnconfirmed(rec, open);
  } catch (_) {}
  return newer;
}

/* A vault bundle is itself a .md file, and people quite reasonably keep one in
   the folder they are syncing. Read as a page it would turn the whole vault
   into a single blob of text -- exactly the thing that is not wanted -- so it
   is recognised and left alone. */
const looksLikeBundle = text =>
  /<!--\s*gtd:(bundle|file)\b/.test(text.slice(0, 4000));

async function readInto(record) {
  const files = await record.backend.list();
  record.pages.clear(); record.raw.clear();
  let couriers = 0;
  for (const [path, text] of files) {
    if (/\.org$/i.test(path)) { record.raw.set(path, text); continue; }
    if (looksLikeBundle(text)) { couriers++; continue; }
    record.pages.set(path, parsePage(text));
  }
  if (couriers) {
    notify(couriers + (couriers === 1 ? " exported vault file is" : " exported vault files are") +
           " in this folder. Left as they are - they are copies for sending, not pages. " +
           "Keeping them outside the folder avoids the confusion.", "warn");
  }
  const newer = await mergeMirror(record);
  if (newer) {
    notify(newer + " change(s) made on this device are being sent up now.", "warn");
    scheduleFlush();
  }
  return record;
}

/* Load a space's files without making it the active one. */
/* Rename things an older vault still spells the old way. Cheap, idempotent,
   and it keeps links working rather than leaving dangling [[k/...]] behind. */
function migrateVault() {
  let moved = 0;
  const legacyLists = join(PAGES, "k");
  for (const path of Array.from(V.pages.keys())) {
    if (!path.startsWith(legacyLists + "/")) continue;
    const target = join(DIRS.lists, path.slice(legacyLists.length + 1));
    if (!V.pages.has(target)) {
      putPage(target, getPage(path));
      removePage(path);
      moved++;
    }
  }
  if (moved) {
    rewriteChecklistLinks();
    notify("Moved " + moved + " checklist(s) to pages/8/.");
  }
  migrateHorizons();
  migrateCancelled();
  migrateJournals();
  return moved;
}

/* Cancelled projects used to share pages/_/ with the horizon pages. Move them to
   pages/-/ so the underscore drawer is horizons alone. A horizon page is left
   where it is, and so is anything the type property says is a horizon, because
   that is the only thing that ever told the two apart. */
function migrateCancelled() {
  const old = join(PAGES, "_");
  let moved = 0;
  for (const path of Array.from(V.pages.keys())) {
    if (!path.startsWith(old + "/")) continue;
    if (isHorizonPage(path)) continue;
    const rest = path.slice(old.length + 1);
    // A horizon page an older build wrote without the type property.
    if (HORIZONS.some(h => h.page && h.page + ".md" === rest)) continue;
    const target = join(DIRS.cancelled, rest);
    if (V.pages.has(target)) { removePage(path); continue; }
    const page = getPage(path);
    // The status line says the directory it is in, and the directory changed.
    if (page.props && page.props.status) page.props.status = STATUS_TEXT["-"];
    putPage(target, page);
    removePage(path);
    moved++;
  }
  if (moved) {
    rewriteCancelledLinks();
    notify("Moved " + moved + " cancelled project(s) to pages/-/.");
  }
  return moved;
}

/* [[_/Old idea]] now means a horizon, so point the ones that were projects at
   pages/-/. A link to a page still sitting in pages/_/ is left alone: that is
   either a horizon or something this vault never cancelled. */
function rewriteCancelledLinks() {
  const re = /\[\[_\/([^\]]+)\]\]/g;
  const moved = name => V.pages.has(join(DIRS.cancelled, trim(name).replace(/\.md$/i, "") + ".md"));
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = str => {
      const n = String(str).replace(re, (m, name) => {
        if (!moved(name)) return m;
        hit = true;
        return "[[-/" + name + "]]";
      });
      return n;
    };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) touch(path);
  }
}

function rewriteChecklistLinks() {
  const re = /\[\[k\/([^\]]+)\]\]/g;
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = str => { const n = String(str).replace(re, "[[8/$1]]"); if (n !== str) hit = true; return n; };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) touch(path);
  }
}

async function loadSpaceRecord(name) {
  const sp = Spaces.get(name);
  if (!sp) return null;
  const rec = LOADED.get(name) || newRecord(name, null);
  rec.backend = await spaceBackend(sp);
  await readInto(rec);
  LOADED.set(name, rec);
  return rec;
}

async function loadFromBackend(backend) {
  setSync("sync", "loading...");
  const name = Spaces.active || "Personal";
  const rec = LOADED.get(name) || newRecord(name, backend);
  rec.backend = backend;
  await readInto(rec);
  LOADED.set(name, rec);
  bindActive(name);
  $("#vaultName").textContent = backend.label;
  setSync("ok", backend.label);
  if (V.raw.size) {
    notify(V.raw.size + " .org files found -- open Vault → Import .org to convert them.", "warn");
  }
}

/* ============================================================
   22_SPACES
   Separate folders for separate parts of a life: Work, Private,
   Volunteer. A space is a COMPLETE, self-contained vault -- its own
   journals, projects, contexts, checklists and its own horizons, right
   up to its own purpose and vision.

   That matters for sharing. The unit you hand to someone is a whole
   space: a folder you share in OneDrive or Dropbox, or one exported
   markdown file. Nothing from another space is inside it, so colleagues
   who get Work cannot see Private, and family who get Home cannot see
   Work. The separation is the folder boundary, not a filter in the UI
   that someone could switch off.

   Each space picks its own storage, so Work can live in the company
   OneDrive while Private lives in iCloud and never touches it.
   ============================================================ */
/* A space's colour is how you tell its rows apart when several are on screen,
   so it is worth choosing rather than accepting. The first six cycle as new
   spaces are created; the palette below is what the picker offers, and any
   hex at all is allowed past that. Like the visibility toggles, the colour is
   held in this device's own list of spaces, never inside a space, so it does
   not travel in a folder you share. */
const SPACE_COLORS = ["#6aa3ff", "#5ecfc0", "#ff9f6b", "#c792ea", "#e0b050", "#4fbf7b"];
const SPACE_PALETTE = [
  ["#6aa3ff", "Blue"],   ["#38bdf8", "Sky"],    ["#5ecfc0", "Teal"],
  ["#4fbf7b", "Green"],  ["#9bcf3f", "Lime"],   ["#e0b050", "Amber"],
  ["#ff9f6b", "Orange"], ["#ff6b6b", "Red"],    ["#f06595", "Pink"],
  ["#c792ea", "Violet"], ["#818cf8", "Indigo"], ["#94a3b8", "Slate"],
];

/* Accepts #abc, #aabbcc or a bare aabbcc; anything else is not a colour. */
function normHex(c) {
  let v = trim(c).toLowerCase();
  if (!v) return null;
  if (v[0] !== "#") v = "#" + v;
  if (!/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/.test(v)) return null;
  if (v.length === 4) v = "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
  return v;
}

/* Relative luminance, WCAG's definition, for the two readability calls below. */
function relLum(hex) {
  const h = normHex(hex);
  if (!h) return 0;
  const lin = n => { const v = n / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(parseInt(h.slice(1, 3), 16))
       + 0.7152 * lin(parseInt(h.slice(3, 5), 16))
       + 0.0722 * lin(parseInt(h.slice(5, 7), 16));
}
function contrast(a, b) {
  const [hi, lo] = [relLum(a), relLum(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}

/* Dark or light ink to put on top of a colour. Once any hex can be chosen the
   letter in the avatar has to follow the background, or a navy space loses it.
   Measured rather than guessed at a brightness cutoff: mid colours like violet
   sit close enough to the middle that only the two ratios settle it. */
function inkOn(hex) {
  const h = normHex(hex);
  if (!h) return "var(--accent-fg)";
  return contrast(h, "#06101f") >= contrast(h, "#ffffff") ? "#06101f" : "#ffffff";
}

/* The surface a space's badge is drawn on, read from the live theme so the
   warning below follows whichever of dark and light is on. */
function themeSurface() {
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue("--bg2");
    return normHex(v) || "#161920";
  } catch (_) { return "#161920"; }
}

/* The colour to draw a space in, including spaces saved before colours were
   chooseable: those fall back to their position in the cycle. */
function spaceColor(name) {
  const hex = normHex(Spaces.get(name)?.color);
  if (hex) return hex;
  const i = Spaces.list.findIndex(s => s.name === name);
  return SPACE_COLORS[(i < 0 ? 0 : i) % SPACE_COLORS.length];
}
const nextSpaceColor = () => SPACE_COLORS[Spaces.list.length % SPACE_COLORS.length];
const paletteName = hex => (SPACE_PALETTE.find(c => c[0] === hex) || [, hex])[1];
const SPACE_EXAMPLES = ["Work", "Private", "Volunteer", "Family", "Studies", "Side project"];

/* App-level preferences live outside every space, so switching space does
   not re-ask how you like the app, and so a shared space carries none of it. */
const PREF = {
  get(k, d = null) {
    const v = safeLS.get("gtd.pref." + k);
    return v === null ? (PREF._mem?.[k] ?? d) : v;
  },
  set(k, v) {
    if (!safeLS.set("gtd.pref." + k, v)) (PREF._mem || (PREF._mem = {}))[k] = v;
  },
  _mem: null,
};

const Spaces = {
  list: [],          // [{name, kind, label, server, color}]
  active: null,

  async load() {
    try { Spaces.list = (await IDB.get("kv", "spaces")) || []; }
    catch (_) { Spaces.list = []; }
    try { Spaces.list = JSON.parse(PREF.get("spaces") || "null") || Spaces.list; }
    catch (_) {}
    return Spaces.list;
  },
  async save() {
    try { await IDB.set("kv", "spaces", Spaces.list); } catch (_) {}
    PREF.set("spaces", JSON.stringify(Spaces.list));
  },
  get(name) { return Spaces.list.find(s => s.name === name) || null; },

  async add(sp) {
    if (Spaces.get(sp.name)) return Spaces.get(sp.name);
    sp.color = normHex(sp.color) || nextSpaceColor();
    Spaces.list.push(sp);
    await Spaces.save();
    return sp;
  },

  /* Repaint one space. Rejects anything that is not a colour rather than
     writing it, so a bad value cannot leave a space invisible. */
  async setColor(name, color) {
    const sp = Spaces.get(name);
    const hex = normHex(color);
    if (!sp || !hex) return false;
    sp.color = hex;
    await Spaces.save();
    return true;
  },

  async remove(name) {
    Spaces.list = Spaces.list.filter(s => s.name !== name);
    await Spaces.save();
    try { await IDB.del("kv", "dir:" + name); } catch (_) {}
    try { await IDB.del("kv", "bundle:" + name); } catch (_) {}
    try { await IDB.del("kv", "summary:" + name); } catch (_) {}
  },

  /* A cheap per-space tally, cached so the switcher can show every space
     without loading them all. Refreshed whenever that space is saved. */
  async summary(name) {
    try { return (await IDB.get("kv", "summary:" + name)) || null; } catch (_) { return null; }
  },
  async writeSummary() {
    if (!Spaces.active) return;
    try {
      const acts = leafActions();
      await IDB.set("kv", "summary:" + Spaces.active, {
        open: acts.filter(a => OPEN_STATES[a.state]).length,
        late: acts.filter(a => a.group === "LATE").length,
        at: nowStamp(),
      });
    } catch (_) {}
  },
};

/* ============================================================
   23_SPACE_FOLDERS
   Every space gets its own folder, and that is enforced rather than
   advised. Two spaces in one folder would put Work and Private in the
   same place -- share that folder and you share both. One space nested
   inside another is worse still: the outer space walks its whole tree, so
   it would read and sync the inner space's files as if they were its own.

   The File System Access API gives no paths, so identity is tested with
   isSameEntry() and containment with resolve(), which returns the path
   segments when a handle really is a descendant.
   ============================================================ */
async function storedHandle(spaceName) {
  try { return (await IDB.get("kv", "dir:" + spaceName)) || null; } catch (_) { return null; }
}

/* Returns {space, how} when this folder cannot be used, else null. */
async function folderConflict(handle, exceptSpace) {
  for (const sp of Spaces.list) {
    if (sp.name === exceptSpace) continue;
    if (sp.kind !== "fs") continue;
    const other = await storedHandle(sp.name);
    if (!other) continue;
    try {
      if (await other.isSameEntry(handle)) return {space: sp.name, how: "same"};
      if (await other.resolve(handle))     return {space: sp.name, how: "inside"};
      if (await handle.resolve(other))     return {space: sp.name, how: "contains"};
    } catch (_) { /* an unreadable handle cannot be proven safe, but nor is it a conflict */ }
  }
  return null;
}

function conflictMessage(name, c) {
  if (c.how === "same")
    return `That folder already holds ${c.space}. Two spaces in one folder would put them in the same place - share it and you share both. Pick a different folder for ${name}.`;
  if (c.how === "inside")
    return `That folder is inside ${c.space}'s folder. ${c.space} reads everything beneath it, so it would swallow ${name}. Pick a folder outside it.`;
  return `That folder contains ${c.space}'s folder. ${name} would read and sync ${c.space}'s files as its own. Pick a folder that does not contain it.`;
}

/* Pick a folder for one space, refusing anything that collides. */
async function assignSpaceFolder(name) {
  if (!CAP.dirPicker) {
    notify("This browser cannot open folders.", "warn");
    return false;
  }
  const sp = Spaces.get(name);
  if (!sp) return false;
  let handle;
  try {
    const opts = {mode: "readwrite", id: "gtd-space-" + name};
    // startIn makes the picker open on the folder this space last used, so
    // even a real re-pick starts where it ended rather than at Documents.
    const prev = PENDING_GRANT.get(name) || await storedHandle(name);
    if (prev) opts.startIn = prev;
    handle = await window.showDirectoryPicker(opts);
  } catch (e) {
    if (e.name !== "AbortError") notify("Could not open that folder: " + e.message, "error");
    return false;
  }
  const clash = await folderConflict(handle, name);
  if (clash) { notify(conflictMessage(name, clash), "error"); return false; }

  // Whatever the space already holds has to come with it, or moving a space
  // into a folder would look exactly like losing everything in it.
  let carried = new Map();
  try {
    const prev = LOADED.get(name) || await loadSpaceRecord(name);
    if (prev) carried = new Map(prev.pages);
  } catch (_) {}

  await IDB.set("kv", "dir:" + name, handle);
  sp.kind = "fs"; sp.label = handle.name;
  delete sp.legacyFlat; delete sp.placeholder;
  sp.askedStorage = true;
  await Spaces.save();

  const rec = newRecord(name, Backends.fs(handle));
  await readInto(rec);                              // what the folder already has wins
  let moved = 0;
  for (const [path, page] of carried) {
    if (rec.pages.has(path)) continue;
    rec.pages.set(path, page);
    rec.dirty.add(path);
    moved++;
  }
  LOADED.set(name, rec);

  if (name === Spaces.active) {
    bindActive(name);
    migrateVault();
    await seedIfEmpty();
    scanVerbs();
    $("#vaultName").textContent = handle.name;
  }
  await flush();
  notify(name + " now lives in \u201C" + handle.name + "\u201D" +
         (moved ? ", with " + moved + " page" + (moved === 1 ? "" : "s") + " moved in." : "."));
  render();
  return true;
}

/* Warn if an older setup already has two spaces sharing or nesting. */
async function checkFolderConflicts() {
  const fs = Spaces.list.filter(s => s.kind === "fs");
  for (let i = 0; i < fs.length; i++) {
    const a = await storedHandle(fs[i].name);
    if (!a) continue;
    for (let j = i + 1; j < fs.length; j++) {
      const b = await storedHandle(fs[j].name);
      if (!b) continue;
      try {
        if (await a.isSameEntry(b))
          notify(`${fs[i].name} and ${fs[j].name} share one folder. Give one of them its own.`, "error");
        else if (await a.resolve(b) || await b.resolve(a))
          notify(`${fs[i].name} and ${fs[j].name} are nested folders. One is reading the other's files.`, "error");
      } catch (_) {}
    }
  }
}

/* ---------- the startup question ---------- */
function spacesNeedingStorage() {
  return Spaces.list.filter(sp => sp.kind === "local" && !sp.askedStorage);
}

function openSpaceStorageSetup({firstRun = false} = {}) {

                                 : sp.kind === "http" ? "server"

}

/* ---------- which spaces are on screen right now ----------
   The active space is where new things land; any number of others can be
   shown alongside it. Toggling is per device, never written into a space,
   so nothing about your other lives travels inside a shared folder. */
/* Which spaces are on screen is entirely your choice -- including hiding the
   one you are capturing into. The only rule is that at least one is shown, and
   that the active space is always one of the shown ones (untick it and the
   active role moves to another visible space). */
function storedVisible() {
  let names = [];
  try { names = JSON.parse(PREF.get("visibleSpaces") || "[]"); } catch (_) {}
  return names.filter(n => Spaces.get(n));
}
function visibleSpaces() {
  const names = storedVisible();
  if (names.length) return names;
  if (Spaces.active) return [Spaces.active];
  return Spaces.list.length ? [Spaces.list[0].name] : [];
}
function setVisibleSpaces(names) {
  PREF.set("visibleSpaces", JSON.stringify(Array.from(new Set(names))));
}
const multiSpace = () => visibleSpaces().length > 1;

async function ensureVisibleLoaded() {
  for (const n of visibleSpaces()) {
    if (!LOADED.has(n)) { try { await loadSpaceRecord(n); } catch (_) {} }
  }
}

/* Run a scanner once per visible space and tag each result with its space. */
let ACROSS = 0;
function acrossSpaces(fn) {
  const names = visibleSpaces();
  if (names.length <= 1 || ACROSS > 0) return fn();
  const out = [];
  ACROSS++;
  try {
    for (const n of names) {
      if (!LOADED.has(n)) continue;
      const res = inSpace(n, fn);
      if (Array.isArray(res)) for (const item of res) {
        if (item && typeof item === "object") item.space = n;
        out.push(item);
      }
    }
  } finally { ACROSS--; }
  return out;
}

/* ---------- a remembered folder whose permission lapsed ----------
   Downloading grouptodo.html again gives you the same app in a new file, and
   the handles it stored are still there -- but a file:// page keeps no
   permission between visits, so the folder reads as "prompt" again. The old
   behaviour fell back to browser storage with a note telling you to reconnect
   it in Vault & sync, which meant walking the folder picker to a folder the
   app already knew. These keep the handle and ask for the click instead. */
const PENDING_GRANT = new Map();        // space name -> FileSystemDirectoryHandle
let INIT_DONE = false;

async function grantSpaceFolder(name) {
  const h = PENDING_GRANT.get(name);
  if (!h) return false;
  let ok = false;
  try { ok = (await h.requestPermission({mode: "readwrite"})) === "granted"; } catch (_) {}
  if (!ok) {
    notify("Permission to " + (h.name || "the folder") + " was declined. " +
           (Spaces.get(name) ? Spaces.get(name).name : name) + " stays in browser storage.", "warn");
    return false;
  }
  PENDING_GRANT.delete(name);
  if (Spaces.active === name) await openSpace(name);   // re-read, now from the folder
  else LOADED.delete(name);                            // next open picks the folder up
  notify((Spaces.get(name) ? Spaces.get(name).name : name) + " is back on " + h.name + ".");
  return true;
}

/* One button, no picker: requestPermission() on a handle we already hold names
   the folder itself, so the whole job is saying yes. */
function offerFolderReconnect(name) {
  const h = PENDING_GRANT.get(name);
  if (!h) return;
  const sp = Spaces.get(name);
  const label = sp ? sp.name : name;
  const where = h.name || (sp && sp.label) || "its folder";
  const others = Array.from(PENDING_GRANT.keys()).filter(n => n !== name);
  modal({
    center: true,
    title: "Reconnect " + label,
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "font-size:13.5px"},
          "The folder " + label + " writes into - \u201C" + where + "\u201D - is still " +
          "remembered. Opening the app from a fresh download only drops the browser's " +
          "permission to it, and that comes back with one click: nothing to find, " +
          "no folder to pick.")),
      el("div", {class: "field"},
        el("div", {style: "font-size:13px;color:var(--fg2)"},
          "Until then " + label + " reads and writes browser storage, and the .md files in " +
          where + " are left exactly as they are.")),
      others.length
        ? el("div", {class: "field"},
            el("div", {style: "font-size:12.5px;color:var(--fg3)"},
              "Waiting the same way: " + others.join(", ") + "."))
        : null),
    foot: [
      el("button", {class: "btn primary", onclick: async () => {
        closeModal();
        const ok = await grantSpaceFolder(name);
        const next = Array.from(PENDING_GRANT.keys())[0];
        if (ok && next) offerFolderReconnect(next);
      }}, "Allow access to " + where),
      el("button", {class: "btn ghost", onclick: () => {
        closeModal();
        notify("Reconnect it any time from Vault & sync \u2192 Connect folder.", "warn");
      }}, "Not now"),
    ],
  });
}

/* Build the storage this space asked for, degrading loudly rather than
   silently writing somewhere the user did not expect. */
async function spaceBackend(sp) {
  if (sp.kind === "http" && sp.server) {
    try { const b = Backends.http(sp.server); await b.list(); return b; }
    catch (e) { notify(`"${sp.name}" server unreachable, using browser storage.`, "warn"); }
  }
  if (sp.kind === "fs") {
    try {
      const h = await IDB.get("kv", "dir:" + sp.name);
      if (h) {
        if ((await h.queryPermission({mode: "readwrite"})) === "granted") {
          PENDING_GRANT.delete(sp.name);
          return Backends.fs(h);
        }
        /* The handle is still here: the folder IS remembered. Only the
           permission lapsed, which is what every browser does to a page
           opened fresh from a download. Granting it again needs a click, so
           park the handle and let offerFolderReconnect() ask for that one
           click -- there is nothing for anyone to go looking for. */
        PENDING_GRANT.set(sp.name, h);
      }
    } catch (_) {}
  }
  const ns = sp.legacyFlat ? "" : sp.name;
  return CAP.idb ? Backends.idb(ns) : CAP.ls ? Backends.ls(ns) : Backends.memory(ns);
}

async function openSpace(name) {
  const sp = Spaces.get(name);
  if (!sp) { notify("No such space: " + name, "error"); return; }
  if (Spaces.active) await flush();     // drain before the backend changes underneath
  await Spaces.writeSummary().catch(() => {});

  Spaces.active = name;
  PREF.set("activeSpace", name);
  // Opening a space always shows it. If you were looking at a single space,
  // switching replaces it; if you were looking at several, it joins them.
  const shownNow = storedVisible();
  if (shownNow.length && !shownNow.includes(name)) {
    setVisibleSpaces(shownNow.length === 1 ? [name] : shownNow.concat([name]));
  }
  LINKED = null;                                  // the linked vault file is per space
  try { LINKED = (await IDB.get("kv", "bundle:" + name)) || null; } catch (_) {}

  await loadFromBackend(await spaceBackend(sp));
  V.space = name;
  migrateVault();
  await seedIfEmpty();             // a brand new space still needs verbs and templates
  scanVerbs();
  ensureJournal(todayISO());
  state.context = getSetting("current_context") || null;
  if (!getSetting("started")) setSetting("started", todayISO());
  /* Answered in New space, before this vault existed to write it to. Never
     overwrites a profile the vault already carries. */
  if (PENDING_PROFILE.has(name)) {
    const want = PENDING_PROFILE.get(name);
    PENDING_PROFILE.delete(name);
    if (!getSetting("horizon_profile") && HORIZON_PROFILES[want]) setSetting("horizon_profile", want);
  }
  state.view = "today";
  state.pagePath = null;
  await ensureVisibleLoaded();
  render();
  await Spaces.writeSummary().catch(() => {});
  touchLastSeen();
  AUTOSYNC_AT = 0;                  // arriving in a space is worth one merge
  autoSyncLinked();
  checkNews();
  checkClaimable();
  // At startup init() does this once, after everything else it opens.
  if (INIT_DONE && PENDING_GRANT.has(name)) offerFolderReconnect(name);
}

/* ---------- creating and sharing ---------- */
async function createSpace(name, kind, color) {
  const clean = trim(name).replace(/[^\w \-]/g, "").slice(0, 40) || "Space";
  if (Spaces.get(clean)) { notify("A space called " + clean + " already exists.", "warn"); return null; }
  const sp = {name: clean, kind: kind || "local"};
  if (normHex(color)) sp.color = normHex(color);   // else Spaces.add takes the next in the cycle
  if (kind === "fs") {
    if (!CAP.dirPicker) { notify("This browser cannot open folders; using browser storage.", "warn"); sp.kind = "local"; }
    else {
      try {
        const opts = {mode: "readwrite", id: "gtd-space-" + clean};
        const near = await storedHandle(Spaces.active).catch(() => null);
        if (near) opts.startIn = near;        // spaces usually live side by side
        const h = await window.showDirectoryPicker(opts);
        const clash = await folderConflict(h, clean);
        if (clash) { notify(conflictMessage(clean, clash), "error"); return null; }
        await IDB.set("kv", "dir:" + clean, h);
        sp.label = h.name;
        sp.askedStorage = true;
      } catch (e) {
        if (e.name === "AbortError") return null;
        notify("Could not open that folder: " + e.message, "error");
        sp.kind = "local";
      }
    }
  }
  await Spaces.add(sp);
  return sp;
}

/* ---------- choosing a space's colour ----------
   One chooser, used by "New space", the space switcher and Vault & sync:
   twelve swatches, a native well for anything the palette does not hold, and
   the hex itself for a colour that has to match something exactly. It reports
   each choice through onPick and stores nothing; the caller decides whether and
   when a choice is committed. */
function colorPicker(initial, onPick) {
  let cur = normHex(initial) || SPACE_COLORS[0];
  const wrap = el("div", {class: "swatches"});
  const well = el("input", {type: "color", "aria-label": "Any other colour"});
  const wellBox = el("span", {class: "colorwell", title: "Any other colour"}, well);
  const hex = el("input", {class: "hexinput", "aria-label": "Colour as hex",
                           spellcheck: "false", maxlength: "7"});

  const paint = () => {
    for (const b of wrap.querySelectorAll(".swatch")) {
      const on = b.dataset.hex === cur;
      b.classList.toggle("on", on);
      b.textContent = on ? "\u2713" : "";
      b.style.color = on ? inkOn(cur) : "transparent";
    }
    wellBox.classList.toggle("on", !SPACE_PALETTE.some(c => c[0] === cur));
    well.value = cur;
    // Only rewrite what is being typed when it means a different colour, so
    // "#6aa" on the way to "#6aa3ff" is not snatched back mid-keystroke.
    if (normHex(hex.value) !== cur) hex.value = cur;
  };
  const choose = next => {
    const h = normHex(next);
    if (!h || h === cur) { paint(); return; }   // nonsense in the hex box snaps back
    cur = h;
    paint();
    onPick(cur);
  };

  for (const [c, label] of SPACE_PALETTE) {
    const b = el("button", {class: "swatch", title: label, "aria-label": label,
      style: "background:" + c, onclick: e => { e.preventDefault(); choose(c); }});
    b.dataset.hex = c;
    wrap.append(b);
  }
  well.addEventListener("input", () => choose(well.value));
  hex.addEventListener("input", () => { if (normHex(hex.value)) choose(hex.value); });
  hex.addEventListener("change", () => { choose(hex.value); hex.value = cur; });
  wrap.append(el("span", {class: "sep"}), wellBox, hex);
  paint();
  return wrap;
}

/* The two places a space's colour is actually read: the sidebar avatar and the
   badge rows carry when spaces are shown together. Showing both while choosing
   beats discovering afterwards that two spaces came out the same. `name` may be
   a getter, for a space whose name is still being typed; paint() with no colour
   repaints the name alone. */
function colorPreview(name, hex) {
  const box = el("div", {class: "cpreview"});
  let cur = normHex(hex) || SPACE_COLORS[0];
  const paint = c => {
    cur = normHex(c) || cur;
    const label = trim(typeof name === "function" ? name() : name) || "Space";
    box.textContent = "";
    box.append(
      el("span", {class: "avatar", style: "background:" + cur + ";color:" + inkOn(cur)},
        label[0].toUpperCase()),
      el("span", {class: "chip spacechip", style: "color:" + cur + ";border-color:" + cur + "55"},
        label),
      el("span", {style: "color:var(--fg3);font-size:11.5px"}, paletteName(cur)));
    // The badge is drawn in the colour itself, so one too close to the page
    // disappears. Say so here rather than let it be found in a crowded list.
    if (contrast(cur, themeSurface()) < 3) {
      box.append(el("span", {style: "color:var(--warn);font-size:11.5px"},
        "- too close to the page behind it to read"));
    }
  };
  paint(cur);
  return {node: box, paint};
}

/* Recolour an existing space. Nothing is written until "Use colour", so trying
   colours out costs nothing; `back` is where Cancel and Save return to. */
function openSpaceColor(name, back) {
  const sp = Spaces.get(name);
  if (!sp) return;
  const before = spaceColor(name);
  let chosen = before;
  const preview = colorPreview(name, before);
  const picker = colorPicker(before, c => { chosen = c; preview.paint(c); });
  const leave = () => { closeModal(); if (back) back(); };

  modal({
    center: true, title: "Colour for " + name,
    hint: sp.kind === "fs" ? (sp.label || "folder") : sp.kind === "http" ? "server" : "this browser",
    body: el("div", {class: "field"},
      el("label", {}, "Pick a colour"),
      picker,
      preview.node,
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:10px"},
        "The colour of " + name + " in the sidebar, in the space switcher, and on the badge " +
        "every row carries when several spaces are shown at once. Kept in this device's list " +
        "of spaces, so it is not inside the folder or file you share.")),
    foot: [
      el("button", {class: "btn ghost", onclick: leave}, "Cancel"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: async () => {
        if (chosen !== before) {
          await Spaces.setColor(name, chosen);
          notify(name + " is now " + paletteName(chosen) + ".");
        }
        leave();
        render();
      }}, "Use colour"),
    ],
  });
}

/* A space's profile is vault content, written to its own GTD.md, and a brand new
   space has no vault yet -- it is created here but not loaded until openSpace.
   So the answer waits here by name and openSpace writes it once the pages are
   in hand. */
const PENDING_PROFILE = new Map();

function newSpacePrompt(then) {
  const nameInput = el("input", {placeholder: "Work"});
  let kind = CAP.dirPicker ? "fs" : "local";
  let profile = DEFAULT_HORIZON_PROFILE;
  let color = nextSpaceColor();
  const preview = colorPreview(() => nameInput.value, color);
  const picker = colorPicker(color, c => { color = c; preview.paint(c); });
  nameInput.addEventListener("input", () => preview.paint());
  const seg = el("div", {class: "seg"});
  const opts = [
    CAP.dirPicker ? ["fs", "Its own folder", "pick a folder - share that folder with the people who should see it"] : null,
    ["local", "In this browser", "share it later as a single markdown file"],
  ].filter(Boolean);
  for (const [k, label] of opts) {
    const btn = el("button", {class: k === kind ? "on" : "", onclick: () => {
      kind = k;
      for (const b of seg.children) b.classList.toggle("on", b.dataset.k === k);
    }}, label);
    btn.dataset.k = k;
    seg.append(btn);
  }

  /* What the space is for, asked once and only here. It decides which
     altitudes this vault runs and how they are worded -- a job is not asked
     why it is here and what it will not trade away. Changeable later, and it
     only ever changes what is shown, never what is stored. */
  const profSeg = el("div", {class: "seg", style: "flex-wrap:wrap"});
  const profWhy = el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
    HORIZON_PROFILES[profile].blurb);
  for (const p of Object.values(HORIZON_PROFILES)) {
    const btn = el("button", {class: p.key === profile ? "on" : "", onclick: () => {
      profile = p.key;
      for (const b of profSeg.children) b.classList.toggle("on", b.dataset.p === profile);
      profWhy.textContent = p.blurb;
    }}, p.label);
    btn.dataset.p = p.key;
    profSeg.append(btn);
  }

  modal({
    center: true, title: "New space",
    body: el("div", {},
      el("div", {class: "field"},
        el("label", {}, "Name"),
        nameInput,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "A whole separate vault: its own projects, contexts and horizons. " +
          "Nothing leaks between spaces.")),
      el("div", {class: "field"},
        el("label", {}, "What is it for"), profSeg, profWhy),
      el("div", {class: "field"},
        el("label", {}, "Where it lives"), seg,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          opts.find(o => o[0] === kind)?.[2] || "")),
      el("div", {class: "field"},
        el("label", {}, "Colour"),
        picker,
        preview.node,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:10px"},
          "How this space shows up in the sidebar, and on the badge its rows carry when " +
          "it is on screen next to another space. Change it later from the space switcher."))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: async () => {
        const name = trim(nameInput.value);
        if (!name) return;
        closeModal();
        const sp = await createSpace(name, kind, color);
        if (!sp) return;
        PENDING_PROFILE.set(sp.name, profile);
        notify("Space created: " + sp.name);
        if (then) then(sp); else await openSpace(sp.name);
        renderNav();
      }}, "Create"),
    ],
  });
  setTimeout(() => nameInput.focus(), 30);
}

function openSpaceSwitcher() {
  const visible = new Set(visibleSpaces());
  const body = el("div", {});
  body.append(el("div", {class: "field", style: "padding-bottom:4px"},
    el("label", {}, "Shown together"),
    el("div", {style: "color:var(--fg2);font-size:12.5px"},
      "Tick the spaces you want on screen - any combination, including hiding " +
      "the one you are in. Tap a name to make it the space new captures land in; " +
      "that one is highlighted. Your choice sticks until you change it."),
    el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
      "Untick a space and it is gone from every list until you tick it back. " +
      "The dot on the right of each row sets that space's colour.")));

  for (const sp of Spaces.list) {
    const on = visible.has(sp.name);
    const active = sp.name === Spaces.active;
    const box = el("button", {
      class: "spacetoggle" + (on ? " on" : ""),
      title: on ? "Hide " + sp.name : "Show " + sp.name,
      onclick: async e => {
        e.stopPropagation();
        const next = new Set(visibleSpaces());
        if (on) {
          if (next.size === 1) { notify("At least one space has to be shown."); return; }
          next.delete(sp.name);
        } else {
          next.add(sp.name);
        }
        setVisibleSpaces(Array.from(next));
        await ensureVisibleLoaded();
        // Hiding the space you were capturing into hands that role to a visible one.
        if (!next.has(Spaces.active)) await openSpace(Array.from(next)[0]);
        closeModal(); render(); openSpaceSwitcher();
      },
    }, on ? "\u2713" : "");
    const color = spaceColor(sp.name);
    const row = el("div", {class: "pick" + (active ? " cur" : "")},
      box,
      el("button", {class: "k", style: "background:" + color + ";color:" + inkOn(color) + ";border:none",
        onclick: () => { closeModal(); if (!active) openSpace(sp.name); }}, sp.name[0].toUpperCase()),
      el("button", {style: "flex:1;text-align:left;background:none",
        onclick: () => { closeModal(); if (!active) openSpace(sp.name); }},
        sp.name, active ? el("span", {class: "d", style: "margin-left:8px"}, "active") : null),
      el("span", {class: "d meta"}, sp.kind === "fs" ? (sp.label || "folder")
                             : sp.kind === "http" ? "server" : "this browser"),
      el("button", {class: "iconbtn", title: "Colour for " + sp.name + " (" + paletteName(color) + ")",
        "aria-label": "Colour for " + sp.name,
        onclick: e => {
          e.stopPropagation();
          openSpaceColor(sp.name, () => openSpaceSwitcher());
        }}, el("span", {class: "colordot", style: "background:" + color})));
    body.append(row);
    Spaces.summary(sp.name).then(sm => {
      if (sm) row.querySelector(".d.meta").textContent =
        sm.open + " open" + (sm.late ? " \u00B7 " + sm.late + " late" : "");

/* ---------- first run and migration ---------- */
/* Is this page being served by serve.py? If so, that is where files belong, and
   a space sitting in browser storage instead would mean nothing the person
   creates ever appears in their folder. */
let SERVER_BASE = null;
async function detectServer() {
  if (SERVER_BASE !== null) return SERVER_BASE;
  SERVER_BASE = "";
  if (CAP.served) {
    try {
      const r = await fetch("./api/ping", {cache: "no-store"});
      if (r.ok) SERVER_BASE = location.origin + location.pathname.replace(/\/[^/]*$/, "");
    } catch (_) {}
  }
  return SERVER_BASE;
}

async function initSpaces() {
  await Spaces.load();
  await detectServer();
  if (Spaces.list.length) return;

  // An existing single vault from before spaces existed becomes one space.
  let legacy = null;
  try { legacy = await IDB.get("kv", "dirHandle"); } catch (_) {}
  let server = null;
  server = safeLS.get("gtd.server");
  if (!server) server = SERVER_BASE;        // served by serve.py: that is the vault

  if (legacy) {
    await IDB.set("kv", "dir:Personal", legacy).catch(() => {});
    await Spaces.add({name: "Personal", kind: "fs", label: legacy.name});
  } else if (server) {
    await Spaces.add({name: "Personal", kind: "http", server});
  } else {
    // Nothing to migrate yet: a placeholder the spaces wizard may replace.
    await Spaces.add({name: "Personal", kind: "local", legacyFlat: true, placeholder: true});
  }
}

/* ============================================================
   25_PAGE_CLASSIFY
   Port of: init.lua 35_NODE_CLASSIFY
   ============================================================ */
const isJournalPath = p => p.startsWith(JOURNALS + "/");
const isPagePath    = p => p.startsWith(PAGES + "/");

function statusDirOf(path) {
  const m = new RegExp("^" + PAGES + "/([-0123])/").exec(path || "");
  return m ? m[1] : null;
}
function pageKind(path) {
  if (isJournalPath(path)) return "journal";
  if (isHorizonPage(path)) return "horizon";
  if (statusDirOf(path)) return "project";
  if (path.startsWith(DIRS.contexts  + "/")) return "context";
  if (path.startsWith(DIRS.people    + "/")) return "person";
  if (path.startsWith(DIRS.orgs      + "/")) return "org";
  if (path.startsWith(DIRS.zettel    + "/")) return "zettel";
  if (path.startsWith(DIRS.areas     + "/")) return "area";
  if (path.startsWith(DIRS.goals     + "/")) return "goal";
  if (path.startsWith(DIRS.lists     + "/")) return "checklist";
  if (path.startsWith(DIRS.templates + "/")) return "template";
  if (path.startsWith(DIRS.verbs     + "/")) return "verb";
  return "page";
}
const baseName  = p => (p || "").split("/").pop().replace(/\.md$/i, "");
const pageTitle = p => (getPage(p)?.props?.title) || baseName(p);

/* Short reference used in links: "1/Fix sink", "c/phone", "2026-09-17" */
function pageRef(path) {
  const sd = statusDirOf(path);
  if (sd) return sd + "/" + baseName(path);
  for (const [pfx, dir] of Object.entries(PREFIX_DIR)) {
    if (path.startsWith(dir + "/")) return pfx + "/" + baseName(path);
  }
  if (isJournalPath(path)) {
    const who = journalOwnerOf(path);
    return (who && who !== journalOwner()) ? baseName(path) + " \u00B7 " + who : baseName(path);
  }
  return baseName(path);
}

function allPages(filter) {
  const out = [];
  for (const path of V.pages.keys()) if (!filter || filter(path)) out.push(path);
  return out.sort();
}
const projectsIn = code => allPages(p => statusDirOf(p) === code && !isHorizonPage(p));
/* Same list, but across every visible space and carrying which space each is in. */
const projectsInVisible = code =>
  acrossSpaces(() => projectsIn(code).map(path => ({path, space: V.space})));

/* Journal files from the last N days that actually exist -- EVERYONE's, not
   just mine. A task somebody wrote in their own day page is still the team's
   task, so it belongs in the shared lists; whose page it came from is carried
   along for display. */
function recentJournals(days = CFG.journalScanDays) {
  const from = shiftISO(todayISO(), -(days - 1));
  const out = [];
  for (const path of V.pages.keys()) {
    if (!isJournalPath(path)) continue;
    const date = baseName(path);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date < from) continue;
    out.push(path);
  }
  // Mine first, then the rest, newest first within each.
  return out.sort((a, b) => (myJournal(b) - myJournal(a)) || baseName(b).localeCompare(baseName(a)));
}

/* Move pre-name journals into this person's folder, once there is a name. */
function migrateJournals() {
  const who = journalOwner();
  if (!who) return 0;
  let moved = 0;
  for (const path of Array.from(V.pages.keys())) {
    if (!isJournalPath(path)) continue;
    const owner = journalOwnerOf(path);
    // "Untitled" is not a person: an earlier build wrote it for anybody who had
    // not named themselves yet. Claim those days along with the flat ones.
    if (owner && owner !== "Untitled") continue;
    if (owner === who) continue;
    const target = join(JOURNALS, who, baseName(path) + ".md");
    if (V.pages.has(target)) { removePage(path); continue; }
    putPage(target, getPage(path));
    removePage(path);
    moved++;
  }
  if (moved) notify("Moved " + moved + " journal day(s) into your own folder.");
  return moved;
}

/* ============================================================
   30_LINKS
   Port of: init.lua 110_WIKI_LINK_OVERRIDE
   ============================================================ */
const LINK_RE = /\[\[([^\]]+)\]\]/g;
const LINK_PREFIXES = new Set(Object.keys(STATUS_DIRS).concat(Object.keys(PREFIX_DIR)));

function linksIn(text) {
  const out = []; let m;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(text || ""))) out.push(trim(m[1]));
  return out;
}
const contextOf = text => {
  const m = /\[\[c\/([^\]]+)\]\]/.exec(text || "");
  return m ? trim(m[1]) : null;
};
const hasContextLink = text => /\[\[c\/[^\]]+\]\]/.test(text || "");

/* target -> vault path (creating nothing) */
function resolveWikiPath(target) {
  target = trim(target).replace(/\.md$/i, "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return journalPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  if (m) {
    const [, pfx, rest] = m;
    if (STATUS_DIRS[pfx]) return join(STATUS_DIRS[pfx], rest + ".md");
    if (PREFIX_DIR[pfx])  return join(PREFIX_DIR[pfx], rest + ".md");
  }
  return join(PAGES, target + ".md");
}

/* Find an existing page for a link target, searching every root like init.lua did. */
function findExistingPage(target) {
  target = trim(target).replace(/\.md$/i, "");
  const direct = resolveWikiPath(target);
  if (V.pages.has(direct)) return direct;
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) return null;
  const slug = slugify(target.includes("/") ? target.split("/").pop() : target);
  const roots = [PAGES, DIRS.active, DIRS.someday, DIRS.waiting, DIRS.completed,
                 DIRS.cancelled, DIRS.people, DIRS.contexts, DIRS.orgs, DIRS.zettel];
  for (const r of roots) {
    const p = join(r, slug + ".md");
    if (V.pages.has(p)) return p;
  }
  return null;
}

/* ============================================================
   35_TEMPLATES
   Port of: init.lua 20_TEMPLATE_RESOLVER -- date cascade lookup:
   2026-09-17 > 2026-W38 > 2026-Q3 > 2026-H2 > 2026-09 > 09-17 > 2026 > 09 > kind
   ============================================================ */
function templateCandidates(date, kind) {
  const list = [];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || "");
  if (m) {
    const [, y, mo, d] = m;
    const w = isoWeek(date);
    list.push(date);
    if (w) list.push(`${w[1]}-W${pad2(w[0])}`);
    list.push(`${y}-Q${Math.ceil(+mo / 3)}`, `${y}-H${+mo <= 6 ? 1 : 2}`, `${y}-${mo}`, `${mo}-${d}`, y, mo);
  }
  if (kind) list.push(kind);
  return list;
}
function readTemplate(name) {
  const p = join(DIRS.templates, name + ".md");
  return V.pages.has(p) ? p : null;
}
function resolveTemplate({date, kind}) {
  const cands = templateCandidates(date, kind);
  if (kind === "journals" || (date && !kind)) cands.push("journals");
  if (kind && kind !== "journals") cands.push(kind, "pages");
  for (const name of cands) {
    const p = readTemplate(name);
    if (p) return {path: p, name};
  }
  return null;
}
function expandVars(text, vars) {
  return String(text).replace(/%(\w+)%/g, (all, k) => (k in vars ? vars[k] : all));
}
/* Deep-copy a template page, expanding %vars%. */
function instantiateTemplate(tplPath, vars) {
  const src = getPage(tplPath);
  const clone = {props: {}, blocks: []};
  for (const [k, v] of Object.entries(src.props || {})) clone.props[k] = expandVars(v, vars);
  const copy = bs => (bs || []).map(b => newBlock({
    state: b.state,
    title: expandVars(b.title, vars),
    props: Object.fromEntries(Object.entries(b.props || {}).map(([k, v]) => [k, expandVars(v, vars)])),
    body : (b.body || []).map(l => expandVars(l, vars)),
    children: copy(b.children),
  }));
  clone.blocks = copy(src.blocks);
  return clone;
}

/* ============================================================
   40_VERBS -- the Phys-Viz rule
   Port of: init.lua 50_VERB_SYSTEM
   pages/verbs/<lang>/<canonical>.md holds lines "synonym = canonical".
   A next action must START with a physical, visible verb.
   ============================================================ */
let VERB_LOOKUP = {};      // synonym -> canonical
let VERB_CANON  = {};      // canonical -> {lang, path, synonyms[]}

function scanVerbs() {
  VERB_LOOKUP = {}; VERB_CANON = {};
  for (const path of V.pages.keys()) {
    if (!path.startsWith(DIRS.verbs + "/")) continue;
    const rest = path.slice(DIRS.verbs.length + 1).split("/");
    if (rest.length < 2) continue;
    const lang = rest[0];
    const canonical = baseName(path).toLowerCase();
    const synonyms = [];
    const page = getPage(path);
    const scan = txt => {
      const m = /^\s*([\p{L}\p{M}\-_ ]+?)\s*=\s*([\p{L}\p{M}\-_ ]+?)\s*$/u.exec(txt || "");
      if (!m) return;
      const syn = m[1].toLowerCase();
      synonyms.push(syn);
      VERB_LOOKUP[syn] = canonical;
    };
    walkBlocks(page.blocks, b => { scan(b.title); (b.body || []).forEach(scan); });
    VERB_LOOKUP[canonical] = canonical;
    VERB_CANON[canonical] = {lang, path, synonyms};
  }
}

function startsWithVerb(title) {
  const m = /^\s*([\p{L}\p{M}\-]+)/u.exec(title || "");
  if (!m) return false;
  return !!VERB_LOOKUP[m[1].toLowerCase()];
}
function verbList() {
  return Object.keys(VERB_CANON).sort().map(c => ({canonical: c, lang: VERB_CANON[c].lang}));
}

/* ============================================================
   45_ORG_IMPORT -- convert an existing .org vault to markdown
   ============================================================ */
function orgToPage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const stack = [{level: 0, children: page.blocks}];
  let cur = null, inProps = false;

  for (const line of lines) {
    let m = /^#\+([\w-]+):\s*(.*)$/.exec(line);
    if (m && !cur) { page.props[m[1].toLowerCase()] = trim(m[2]); continue; }
    m = /^(\*+)\s+(.*)$/.exec(line);
    if (m) {
      const level = m[1].length;
      const [state, title] = splitState(m[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      stack[stack.length-1].children.push(blk);
      blk.level = level; blk.children = blk.children || [];
      stack.push(blk);
      cur = blk; inProps = false;
      continue;
    }
    if (!cur) continue;
    if (/^\s*:PROPERTIES:\s*$/.test(line)) { inProps = true; continue; }
    if (/^\s*:END:\s*$/.test(line))        { inProps = false; continue; }
    if (inProps) {
      const pm = /^\s*:([\w-]+):\s*(.*)$/.exec(line);
      if (pm) cur.props[pm[1].toLowerCase()] = trim(pm[2]);
      continue;
    }
    // "Added: [[2026-09-15]] - [[2026-09-17]] = 2 days"  ->  property
    const am = /^\s*(Added|CLOSED|SCHEDULED|DEADLINE):\s*(.*)$/i.exec(line);
    if (am) { cur.props[am[1].replace(/^./, c => c.toUpperCase())] = trim(am[2]); continue; }
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    cur.body.push(trim(line));
  }
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

function importOrgFiles() {
  let n = 0;
  for (const [path, text] of Array.from(V.raw)) {
    const mdPath = path.replace(/\.org$/i, ".md");
    if (V.pages.has(mdPath)) continue;
    putPage(mdPath, orgToPage(text));
    V.raw.delete(path);
    n++;
  }
  scanVerbs();
  notify(n ? `Converted ${n} .org files to markdown (originals untouched).` : "Nothing to import.");
  render();
}
</script>
<script>
/* ============================================================
   50_BLOCK_HELPERS
   ============================================================ */
const dateIn = s => (/(\d{4}-\d{2}-\d{2})/.exec(s || "") || [])[1] || null;

function blockProp(b, key) {
  if (!b || !b.props) return null;
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  return k ? b.props[k] : null;
}
function setBlockProp(b, key, val) {
  const k = Object.keys(b.props).find(x => x.toLowerCase() === key.toLowerCase());
  b.props[k || key] = val;
}
const addedDate = b => dateIn(blockProp(b, "Added"));
const blockAge  = b => { const a = addedDate(b); return a ? dateDiffDays(a, todayISO()) : null; };
function dueDate(b) {
  return dateIn(blockProp(b, "SCHEDULED")) || dateIn(blockProp(b, "DEADLINE")) || dateIn(blockProp(b, "due"));
}
/* Locate a block anywhere in the vault by id. */
function findBlock(id) {
  for (const [path, page] of V.pages) {
    let found = null;
    walkBlocks(page.blocks, b => { if (b.id === id) found = b; });
    if (found) return {path, page, block: found};
  }
  return null;
}
function blockPagePath(block) {
  for (const [path, page] of V.pages) {
    let hit = false;
    walkBlocks(page.blocks, b => { if (b === block) hit = true; });
    if (hit) return path;
  }
  return null;
}
function removeBlockFrom(page, block) {
  const rec = list => {
    const i = list.indexOf(block);
    if (i >= 0) { list.splice(i, 1); return true; }
    return list.some(b => rec(b.children || []));
  };
  return rec(page.blocks);
}
function hasOpenDescendant(block) {
  let open = false;
  walkBlocks(block.children, b => { if (OPEN_STATES[b.state]) open = true; });
  return open;
}

/* ============================================================
   55_JOURNAL_LIFECYCLE
   Port of: init.lua 45_JOURNAL_LIFECYCLE
   ============================================================ */
function ensureJournal(date) {
  date = date || todayISO();
  const path = journalPath(date);
  if (V.pages.has(path)) return path;
  const tpl = resolveTemplate({date, kind: "journals"});
  const page = tpl
    ? instantiateTemplate(tpl.path, {title: date, date, created: "[[" + date + "]]"})
    : {props: {title: date, created: "[[" + date + "]]"}, blocks: []};
  putPage(path, page);
  if (tpl && !isSimple()) notify("Journal created from template: " + tpl.name);
  return path;
}

/* ============================================================
   60_STATE_MACHINE
   Port of: init.lua set_org_state
     -> TODO : stamp "Added", then nudge for a context if missing
     -> DONE : close out the Added line with an end date + elapsed days,
               then check whether the project just ran out of next actions
   ============================================================ */
/* Dropping the state strips the task's dates out of the markdown, which is right
   for a note but unforgiving if the cycle went one click too far. The stripped
   properties are held here, in memory only, long enough to click back. */
const DEMOTED = new WeakMap();
const TASK_PROPS = /^(added|closed|done_by|scheduled|deadline)$/i;
const CLOSED_PROPS = /^(closed|done_by)$/i;

function setBlockState(path, block, state, opts = {}) {
  const prev = block.state;
  block.state = state;

  if (!state) {
    // No longer a task: drop the bookkeeping that only a task has, so the
    // markdown reads as the plain note it now is -- but remember it briefly.
    const kept = {};
    for (const k of Object.keys(block.props || {})) {
      if (TASK_PROPS.test(k)) { kept[k] = block.props[k]; delete block.props[k]; }
    }
    if (Object.keys(kept).length) DEMOTED.set(block, {props: kept, at: Date.now()});
    touch(path);
    render();
    return;
  }

  if (!prev) {
    // Becoming a task again. If that happened within the grace period, put the
    // original dates back rather than stamping today's.
    const stash = DEMOTED.get(block);
    if (stash && Date.now() - stash.at < CFG.undoStateMinutes * 60000) {
      const closing = state === "DONE" || state === "CANCELLED";
      let restored = 0;
      for (const [k, v] of Object.entries(stash.props)) {
        if (!closing && CLOSED_PROPS.test(k)) continue;   // a TODO has not been closed by anyone
        if (block.props[k] == null) { block.props[k] = v; restored++; }
      }
      DEMOTED.delete(block);
      if (restored) notify("Back to a task, with its original dates.");
    }
  }

  if (OPEN_STATES[state]) {
    // Re-opening something: it is no longer closed, so the closing stamps go.
    // (This also catches a plain un-tick, which used to leave a TODO claiming
    // it had been finished.)
    const raw = blockProp(block, "Added");
    if (raw) {
      const reopened = raw.replace(/\s*-\s*\[\[\d{4}-\d{2}-\d{2}\]\]\s*=\s*-?\d+\s*days?\s*$/, "");
      if (reopened !== raw) setBlockProp(block, "Added", trim(reopened));
    }
    for (const k of Object.keys(block.props || {})) {
      if (CLOSED_PROPS.test(k)) delete block.props[k];
    }
  }

  if (state === "TODO" || state === "DOING") {
    if (path !== journalPath() && !addedDate(block)) {
      setBlockProp(block, "Added", "[[" + todayISO() + "]]");
      stampAuthor(block);
    }
  } else if (state === "DONE" || state === "CANCELLED") {
    coachMark("tick");
    const me = stampName();
    if (me) setBlockProp(block, "done_by", me + " " + nowStamp());
    const added = addedDate(block);
    const end = todayISO();
    if (added) {
      const raw = blockProp(block, "Added") || "";
      if (!/\]\]\s*-\s*\[\[/.test(raw)) {
        const days = dateDiffDays(added, end) ?? 0;
        setBlockProp(block, "Added", raw + " - [[" + end + "]] = " + days + " days");
      }
    } else if (!blockProp(block, "CLOSED")) {
      setBlockProp(block, "CLOSED", "[[" + end + "]]");
    }
  }
  touch(path);

  if ((state === "TODO" || state === "DOING") && !opts.skipContext
      && !gtdQuiet() && !hasContextLink(block.title)) {
    promptAndInsertContext(path, block);
    return;
  }
  if (state === "DONE" || state === "CANCELLED") {
    if (prev !== state) noteTodoTouched();
    // Asked, never assumed, and only on the tick that actually finished it.
    if (state === "DONE" && prev !== "DONE" && repeatOf(block) && !opts.skipRepeat) {
      render();
      offerNextOccurrence(path, block);
      return;
    }
    checkProjectCompletion(path);
  }
  render();
}

/* In the outliner the cycle comes back round to "not a task at all", so anything
   made a todo by accident -- or a line that stopped being one -- can be turned
   back into an ordinary note without retyping it. On a to-do list row there is
   nowhere for a plain note to live, so {keepTask} stops at DONE and wraps to
   TODO; the action panel still has the explicit way out. */
function cycleState(path, block, opts = {}) {
  const order = opts.keepTask ? ["TODO", "DOING", "WAIT", "DONE"]
                              : ["TODO", "DOING", "WAIT", "DONE", null];
  const i = order.indexOf(block.state ?? null);
  setBlockState(path, block, order[(i + 1) % order.length]);
}

   65_GTD_SCANNERS
   Port of: init.lua 55_GTD_SCANNERS + 57_STALENESS_SCAN
