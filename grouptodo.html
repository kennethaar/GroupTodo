const TOUR_DESTS = {
  todos:      {label: "Todos",             go: () => go("todos")},
  agenda:     {label: "Planned",           go: () => go("agenda")},
  context:    {label: "Contexts",          go: () => go("context")},
  people:     {label: "People",            go: () => go("people")},
  projects:   {label: "Active projects",   go: () => go("projects", {statusCode: "1"})},
  checklists: {label: "Routines & lists",  go: () => go("checklists")},
  horizons:   {label: "Big picture",       go: () => go("horizons")},
  search:     {label: "Search",            go: () => go("search")},
  today:      {label: "My day",            go: () => go("today")},
  vault:      {label: "Vault & sync",      go: () => openVaultDialog()},
  capture:    {label: "Capture",           go: () => openCapture()},
  review:     {label: "Weekly review",     go: () => openReview(0)},
  keys:       {label: "Keys",              go: () => openHelp()},
};

const TOUR_LINK_RE = /\[\[go\/([A-Za-z0-9_-]+)(?:\]\[[^\]]*)?\]\]/;
function tourDestOf(title) {
  const m = TOUR_LINK_RE.exec(title || "");
  return m && TOUR_DESTS[m[1]] ? m[1] : null;
}
function tourLabel(id) { return (TOUR_DESTS[id] || {}).label || id; }

/* The same line with the door written out in words. Links are followed from the
   page, and a link inside a dialog that cannot be followed is a lie. */
function tourPlainTitle(title) {
  return trim(String(title || "").replace(/\[\[go\/([A-Za-z0-9_-]+)(?:\]\[([^\]]*))?\]\]/g,
    (all, id, label) => trim(label || tourLabel(id))));
}

/* Seen is per device and per person, like "last seen" for notifications: it is
   about what you have looked at, so it has no business in the shared files. */
function tourMarkSeen(id) { if (TOUR_DESTS[id]) PREF.set("tour.seen." + id, "1"); }
function tourSeen(id) { return PREF.get("tour.seen." + id, "") === "1"; }

function goTour(id) {
  const dest = TOUR_DESTS[id];
  if (!dest) { notify("That link points at a part of the app that is not here.", "warn"); return; }
  tourMarkSeen(id);
  dest.go();
}

/* Arriving any other way counts too -- somebody who finds Planned in the
   sidebar on their own should not be asked to go again through the link. */
function tourNoteView(view, opts = {}) {
  if (view === "projects") { if (opts.statusCode === "1" || state.statusCode === "1") tourMarkSeen("projects"); return; }
  if (TOUR_DESTS[view]) tourMarkSeen(view);
}

/* Worked out once per draw, like QUIET_CACHE: this is asked by the coach, the
   suggestions and every project row, and scanning the vault for each of them
   is a lot of walking for one answer. */
let TOUR_PATH_CACHE;                                    // undefined = not yet this draw
function tourProjectPath() {
  if (TOUR_PATH_CACHE !== undefined) return TOUR_PATH_CACHE;
  if (!V || !V.pages) return null;                      // called before a space is open
  let found = null;
  for (const path of V.pages.keys()) {
    if (!statusDirOf(path)) continue;
    if (trim(getPage(path)?.props?.[TOUR_PROP] || "")) { found = path; break; }
  }
  return (TOUR_PATH_CACHE = found);
}
const isTourProject = path => !!path && path === tourProjectPath();

/* Every step of the tour, open or closed, with the door it points at. */
function tourSteps(path) {
  const p = path || tourProjectPath();
  const page = p && getPage(p);
  if (!page) return [];
  return flattenBlocks(page.blocks)
    .filter(b => b.state && tourDestOf(b.title))
    .map(b => ({path: p, block: b, dest: tourDestOf(b.title),
                open: !!OPEN_STATES[b.state], seen: tourSeen(tourDestOf(b.title))}));
}
/* Still on the list, but you have been where it sends you. */
const tourPending = () => tourSteps().filter(s => s.open && s.seen);

/* ---------- the ask ----------
   One prompt, and only when the answer has changed since the last time: a
   newcomer who says "not yet" to three steps must not be asked a fourth time
   about the same three. */
const tourAskKey = steps => steps.map(s => s.dest).sort().join(",");

function askTourCheckoff(steps) {
  const list = steps || tourPending();
  if (!list.length) return;
  PREF.set("tour.asked", tourAskKey(list));

  const picked = new Set(list.map(s => s.dest));
  const body = el("div", {},
    el("div", {class: "field"},
      el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.55"},
        list.length === 1 ? "You have been to " + tourLabel(list[0].dest) +
          ". Tick the step off if you are done with it - nothing is closed unless you say so."
          : "You have been to " + list.length + " of the places on " + TOUR_TITLE.toLowerCase() +
            ". Tick off the ones you are done with. Nothing is closed unless you say so.")));
  for (const s of list) {
    const row = el("label", {class: "coach-step", style: "cursor:pointer"});
    const box = el("input", {type: "checkbox"});
    box.checked = true;
    box.addEventListener("change", () => { if (box.checked) picked.add(s.dest); else picked.delete(s.dest); });
    row.append(box, el("div", {},
      el("div", {}, tourPlainTitle(s.block.title)),
      el("div", {style: "color:var(--fg3);font-size:12px"}, "you opened " + tourLabel(s.dest))));
    body.append(row);
  }

  modal({
    center: true, title: "Tick off what you have done", hint: "your call",
    body,
    foot: [
      el("button", {class: "btn ghost", onclick: () => { closeModal(); render(); }}, "Not yet"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: () => {
        closeModal();
        const chosen = list.filter(s => picked.has(s.dest));
        if (!chosen.length) { render(); return; }
        // The last one closed may finish the project, and that prompt is the
        // ordinary one -- the tour earns its ending the same way any project does.
        for (const s of chosen) setBlockState(s.path, s.block, "DONE");
        notify(chosen.length === 1 ? "Ticked off." : chosen.length + " ticked off.");
      }}, "Tick these off"),
    ],
  });
}

/* Asked on the way back rather than the moment you arrive: being asked whether
   you are finished with a screen you have only just opened is worse than not
   being asked at all. */
let TOUR_ASK_TIMER = null;
function maybeAskTourCheckoff(list) {
  clearTimeout(TOUR_ASK_TIMER);
  if (!PREF.get("tour.ask", "1")) return;               // turned off from the card
  const steps = (list || tourPending()).filter(s => s.open);
  if (!steps.length) return;
  if (tourAskKey(steps) === PREF.get("tour.asked", "")) return;
  TOUR_ASK_TIMER = setTimeout(() => {
    if ($("#modalRoot").firstChild) return;             // something else is talking
    const live = steps.filter(s => OPEN_STATES[s.block.state]);
    if (live.length) askTourCheckoff(live);
  }, 600);
}

/* On the project page itself: the same offer, standing, for anybody who said
   "not yet" or turned the asking off. */
function tourCard(path) {
  const steps = tourSteps(path);
  if (!steps.length) return null;
  const pending = steps.filter(s => s.open && s.seen);
  const left = steps.filter(s => s.open);
  const box = el("div", {class: "coach tip"});
  box.append(el("div", {class: "coach-head"},
    el("b", {}, pending.length ? "You have been to " + pending.length +
                 " of these" : "Every step is a door"),
    el("span", {style: "color:var(--fg3);font-size:12px"},
      (steps.length - left.length) + " of " + steps.length)));
  box.append(el("div", {style: "font-size:13.5px;color:var(--fg2);line-height:1.55"},
    pending.length
      ? "Tick off what you are actually done with. The app can see that you opened them; " +
        "it cannot see whether that was enough, so it asks."
      : "Press the link in a step to go straight to the part of the app it is about. " +
        "Come back and tick it off when you are done with it."));
  const acts = el("div", {style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"});
  if (pending.length)
    acts.append(el("button", {class: "btn sm primary", onclick: () => askTourCheckoff(pending)},
      "Check off " + pending.length));
  if (PREF.get("tour.ask", "1"))
    acts.append(el("button", {class: "btn sm ghost", onclick: () => {
      PREF.set("tour.ask", ""); notify("GroupTodo will stop asking. The button here stays.");
      render();
    }}, "stop asking me"));
  else
    acts.append(el("button", {class: "btn sm ghost", onclick: () => {
      PREF.set("tour.ask", "1"); PREF.set("tour.asked", ""); render();
    }}, "ask me again"));
  box.append(acts);
  return box;
}

/* ---------- the project itself ----------
   Written as ordinary markdown a stranger could have typed: a TODO, a verb, a
   link. Opening this file in Notepad shows a list of steps and where each one
   goes, which is the whole promise of keeping tasks as text. */
function seedTourProject() {
  const path = join(DIRS.active, slugify(TOUR_TITLE) + ".md");
  if (V.pages.has(path)) return path;
  const page = projectTemplateLines(slugify(TOUR_TITLE), "1");
  page.props[TOUR_PROP] = "1";
  page.props.outcome = "I have seen every part of GroupTodo and know where my files live";
  const step = title => stampAuthor(newBlock({
    state: "TODO", title, props: {Added: todayStamp()},
  }));
  /* Written without a label -- [[go/todos]] rather than [[go/todos][Todos]] --
     because the link reads out its own destination, so the day one of these
     screens is renamed the task does not go on claiming the old name. */
  page.blocks = [
    step("Find everything you have open in one list - [[go/todos]]"),
    step("Send something to a day instead of today - [[go/agenda]]"),
    step("Say where you are, and see what you can do there - [[go/context]]"),
    step("Give your files a folder, and put your name on your changes - [[go/vault]]"),
    step("Find out who else is here and what they are carrying - [[go/people]]"),
    step("Park a job that comes round again rather than finishing - [[go/checklists]]"),
    step("Read the one screen that keeps the rest trustworthy - [[go/review]]"),
    step("Find anything by typing part of it - [[go/search]]"),
  ];
  putPage(path, page);
  return path;
}

/* ============================================================
   113c_SUGGESTIONS
   One card at a time, only once the list itself has earned it, and every one of
   them dismissible for good. These are the things a person standing behind you
   would say -- "that is a lot of tasks, want to thin them out?" -- rather than
   anything the method demands. Simple mode only: the advanced door is for people
   who came here already knowing how they want to work.
   ============================================================ */
const tipOff = id => PREF.get("tip.off." + id, "") === "1";
function tipQuiet(id) {
  const until = PREF.get("tip.quiet." + id, "");
  return !!until && todayISO() < until;
}

function tipList() {
  // Same rule as the coach: the tour and its steps are the app's scaffolding,
  // not your list, so no suggestion is ever about them.
  const open = leafActions().filter(a => OPEN_STATES[a.state] && !a.tourStep);
  const projects = projectsIn("1").filter(p => !isTourProject(p));
  const perProject = new Map();
  for (const a of open) {
    if (!a.projectPath) continue;
    perProject.set(a.projectPath, (perProject.get(a.projectPath) || 0) + 1);
  }
  let fattest = null;
  for (const [path, n] of perProject) if (!fattest || n > fattest.n) fattest = {path, n};
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");

  return [
    {
      id: "project",
      live: open.length >= CFG.tipMinTasks && !projects.length,
      title: "Some of these belong together",
      body: open.length + " open tasks and no project yet. A project is just a page holding " +
            "the steps for one job, with a line saying what done looks like.",
      why: "Your head keeps bringing back anything unfinished that has no agreed next step. " +
           "Writing the steps down once, somewhere you will actually look again, is what stops " +
           "the reminding - and it is the single habit the rest of this hangs on.",
      cta: "Make a project", act: () => newProjectPrompt(),
    },
    {
      // Only when weeding has something to rank. Offering to weed five projects
      // and then opening a screen that says there is nothing to weed is worse
      // than saying nothing at all.
      id: "weed",
      live: open.length >= CFG.busyTasks && weedingWorthIt(),
      title: "That is a lot on the list",
      body: open.length + " open tasks across " + projects.length + " active project" +
            (projects.length === 1 ? "" : "s") + ". Weeding takes the stalest few and asks one " +
            "question of each: is this still real? Five minutes, and nothing goes without you.",
      why: "A list long enough to read as a wall stops being a tool and becomes a thing to " +
           "avoid. Making it shorter is usually worth more than working harder down it.",
      cta: "Weed the stalest", act: () => openWeeding(),
    },
    {
      // The same pile, but flat: plenty of tasks and barely any projects, so
      // there is nothing to rank and the useful move is grouping, not pruning.
      id: "pile",
      live: open.length >= CFG.busyTasks && !weedingWorthIt(),
      title: "That is a lot on one pile",
      body: open.length + " open tasks, " + open.filter(a => a.group === "JOURNAL").length +
            " of them sitting loose in your days rather than under anything. Going through " +
            "them once and grouping the ones that belong together is usually an hour you " +
            "get back later.",
      why: "A flat list has no shape, so every time you look for the next thing you pay for " +
           "the whole list. Grouping is not filing for its own sake - it is what lets you " +
           "look at a tenth of it and still be sure.",
      cta: "Sort the loose ones", act: () => openReview(2),
    },
    {
      id: "split",
      live: !!fattest && fattest.n >= CFG.busyProjectTodos,
      title: fattest ? pageTitle(fattest.path) + " is carrying " + fattest.n + " tasks" : "",
      body: "That is usually two or three jobs wearing one name. Split it and each half gets a " +
            "finish line it can actually reach.",
      why: "A project that never empties reads as a chore list with your name on it. Two that " +
           "can be finished give you somewhere to stop.",
      cta: "Open it", act: () => fattest && openPage(fattest.path),
    },
    {
      id: "name",
      live: onDisk && !whoAmI(),
      title: "Put your name on your changes",
      body: "This space lives somewhere another person can open. With a name set, what you add " +
            "is stamped by:: you and what you close done_by:: you.",
      why: "In a shared list, unsigned work slides into being nobody's work: two people redo the " +
           "same thing, and neither can tell who already asked.",
      cta: "Set a name",
      act: () => promptInput({
        title: "Your name", value: whoAmI(), cta: "Save",
        label: "Shown beside what you add in " + (Spaces.active || "this space"),
        onSave: n => {
          setIdentity(n, Spaces.active);
          notify("Changes here will be signed " + trim(n) + ".");
          render();
        },
      }),
    },
  ];
}

function tipCard() {
  if (coachOn()) return null;             // one teacher at a time
  const tip = tipList().find(t => t.live && !tipOff(t.id) && !tipQuiet(t.id));
  if (!tip) return null;
  const box = el("div", {class: "coach tip"});
  box.append(el("div", {class: "coach-head"},
    el("b", {}, tip.title),
    el("button", {class: "iconbtn", title: "Do not suggest this again",
      onclick: () => { PREF.set("tip.off." + tip.id, "1"); render(); }}, "\u2715")));
  box.append(el("div", {style: "font-size:13.5px;color:var(--fg2);line-height:1.55"}, tip.body));
  box.append(el("div", {class: "coach-why"}, tip.why));
  box.append(el("div", {style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"},
    el("button", {class: "btn sm primary", onclick: tip.act}, tip.cta),
    el("button", {class: "btn sm ghost", onclick: () => {
      PREF.set("tip.quiet." + tip.id, shiftISO(todayISO(), CFG.tipSnoozeDays));
      render();
    }}, "not now")));
  return box;
}

/* ============================================================
   114_SIMPLE VIEWS
   ============================================================ */
/* ============================================================
   143_HORIZONS_WIZARD
   Runs on the first visit to Horizons. Climbs from the most concrete
   altitude to the most abstract, which is the order people can actually
   answer in -- Allen's own advice is to implement bottom-up even though
   you review top-down. Every step is skippable and nothing is written
   until the last one.

   Which steps there are, and what each one asks, come from the space's own
   profile -- a job is not asked what it will not trade away.
   ============================================================ */
const AREA_EXAMPLES = {
  life: ["Health", "Finances", "Family", "Home", "Career", "Team",
         "Clients", "Learning", "Friendships", "Admin"],
  work: ["Team", "Clients", "Hiring", "Budget", "Reporting", "Quality",
         "Roadmap", "On-call", "Vendors", "Admin"],
};
const areaChips = () => AREA_EXAMPLES[horizonProfile().chips] || AREA_EXAMPLES.life;

const WIZ = {step: 0, areas: "", goals: "", vision: "", purpose: ""};

function wizField(key, placeholder, rows = 6) {
  const ta = el("textarea", {placeholder, style: "min-height:" + (rows * 22) + "px"});
  ta.value = WIZ[key];
  ta.addEventListener("input", () => { WIZ[key] = ta.value; });
  return ta;
}

function wizChips(key, options) {
  const box = el("div", {class: "seg", style: "margin-top:8px"});
  for (const o of options) {
    box.append(el("button", {
      onclick: e => {
        const lines = WIZ[key].split("\n").map(trim).filter(Boolean);
        const i = lines.indexOf(o);
        if (i >= 0) lines.splice(i, 1); else lines.push(o);
        WIZ[key] = lines.join("\n");
        e.target.classList.toggle("on");
        const ta = $(".modal textarea");
        if (ta) ta.value = WIZ[key];
      },
      class: WIZ[key].split("\n").map(trim).includes(o) ? "on" : "",
    }, o));
  }
  return box;
}

/* Bottom-up: areas, then goals, then the two above them. In a work space those
   top two are the ones you inherit rather than invent, and they come last for
   the same reason -- they are the hardest to sit down and answer cold. */
const WIZ_ORDER = ["areas", "goals", "vision", "purpose"];

function wizSteps() {
  const profile = horizonProfile();
  const ladder = activeHorizons();
  const intro = {
    title: "Horizons of focus",
    render: () => el("div", {class: "field"},
      el("label", {}, ladder.length + " altitudes"),
      el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.75"},
        "Todo apps live on the runway. GTD says the runway only makes sense if you " +
        "can see what it serves. This takes a few minutes and you can skip any step."),
      el("div", {style: "font-family:var(--mono);font-size:12px;line-height:2;color:var(--fg3);margin-top:10px"},
        ladder.map(h => {
          const m = horizonMeta(h.key);
          return el("div", {},
            el("span", {style: "color:var(--accent)"}, m.alt.padEnd(11)),
            m.h + " · " + m.name);
        })),
      profile.key === "life" ? null
        : el("div", {style: "color:var(--fg3);font-size:12px;margin-top:10px"}, profile.blurb)),
    cta: "Start",
  };

  const steps = [intro];
  for (const key of WIZ_ORDER) {
    if (!horizonActive(key)) continue;
    const m = horizonMeta(key);
    steps.push({
      key,
      title: m.h + " · " + m.name,
      inherited: !!m.inherited,
      render: () => el("div", {class: "field"},
        el("label", {}, m.wiz.label),
        el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"}, m.wiz.help),
        wizField(key, m.wiz.placeholder),
        key === "areas"
          ? el("div", {},
              el("div", {style: "color:var(--fg3);font-size:12px;margin-top:8px"}, "Tap any that fit:"),
              wizChips("areas", areaChips()))
          : null),
    });
  }
  return steps;
}

function applyWizard() {
  const lines = v => v.split("\n").map(trim).filter(Boolean);
  const areas = lines(WIZ.areas);
  const goals = lines(WIZ.goals);
  /* A step the profile left out was never shown, so whatever an earlier run of
     the wizard left in WIZ for it is not an answer about this space. */
  for (const a of areas) createArea(a);
  for (const g of goals) createGoal(g);
  const wrote = {};
  for (const key of ["vision", "purpose"]) {
    if (!horizonActive(key) || !trim(WIZ[key])) continue;
    setHorizon(key, lines(WIZ[key]));
    wrote[key] = true;
  }
  setSetting("horizons_done", todayISO());
  const made = [];
  if (areas.length) made.push(areas.length + " " + (horizonMeta("areas").inherited ? "" : "") + "areas");
  if (goals.length) made.push(goals.length + " goals");
  for (const key of ["vision", "purpose"]) {
    if (wrote[key]) made.push("a " + horizonMeta(key).name.toLowerCase());
  }
  notify(made.length ? "Created " + made.join(", ") + "." : "Nothing created - run it again any time.");
  render();
}

function openHorizonsWizard(step = 0) {
  setSetting("horizons_seen", todayISO());
  const steps = wizSteps();
  WIZ.step = Math.max(0, Math.min(step, steps.length));
  if (WIZ.step === steps.length) { closeModal(); applyWizard(); return; }
  const s = steps[WIZ.step];
  const last = WIZ.step === steps.length - 1;
  modal({
    center: true,
    title: s.title,
    hint: WIZ.step ? "step " + WIZ.step + " of " + (steps.length - 1)
                     + (s.inherited ? " · optional" : "") : "",
    body: s.render(),
    foot: [
      WIZ.step > 0 ? el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(WIZ.step - 1)}, "Back") : null,
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: () => { closeModal(); setSetting("horizons_seen", todayISO()); }}, "Later"),
      s.key ? el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(WIZ.step + 1)}, "Skip") : null,
      el("button", {class: "btn primary", onclick: () => openHorizonsWizard(WIZ.step + 1)},
        s.cta || (last ? "Finish" : "Next")),
    ],
  });
}

/* ============================================================
   144_CONTEXTS_WIZARD
   Same principle: your contexts, not mine. Examples are offered as
   suggestions you tap, never written behind your back.
   ============================================================ */
const CONTEXT_EXAMPLES = [
  "phone", "computer", "errand", "home", "office", "anywhere",
  "deep-work", "waiting", "agenda", "offline",
];
const CTXWIZ = {picked: ""};

function openContextsWizard(onDone) {
  CTXWIZ.picked = "";
  const ta = el("textarea", {placeholder: "phone\ncomputer\nerrand", style: "min-height:110px"});
  ta.addEventListener("input", () => { CTXWIZ.picked = ta.value; });
  const chips = el("div", {class: "seg", style: "margin-top:8px"});
  for (const o of CONTEXT_EXAMPLES) {
    chips.append(el("button", {
      onclick: e => {
        const lines = CTXWIZ.picked.split("\n").map(trim).filter(Boolean);
        const i = lines.indexOf(o);
        if (i >= 0) lines.splice(i, 1); else lines.push(o);
        CTXWIZ.picked = lines.join("\n");
        ta.value = CTXWIZ.picked;
        e.target.classList.toggle("on");
      },
    }, "@" + o));
  }
  modal({
    center: true, title: "Set up your contexts",
    body: el("div", {class: "field"},
      el("label", {}, "Where, or with what, can work actually happen?"),
      el("div", {style: "color:var(--fg2);font-size:13px;margin-bottom:8px"},
        "A context is the thing an action needs: a phone in your hand, a shop you are " +
        "standing in, two uninterrupted hours. Picking one is what lets GroupTodo show " +
        "the three oldest things you could do right now. Yours should match your real life - " +
        "these are only suggestions."),
      ta, chips),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Later"),
      el("button", {class: "btn primary", onclick: () => {
        const names = CTXWIZ.picked.split("\n").map(trim).filter(Boolean);
        closeModal();
        for (const n of names) {
          const clean = slugify(n.replace(/^@/, ""));
          const p = join(DIRS.contexts, clean + ".md");
          if (!V.pages.has(p)) putPage(p, pageTemplateFor("c", clean));
        }
        setSetting("contexts_done", todayISO());
        notify(names.length ? "Created " + names.length + " contexts." : "No contexts created.");
        render();
        if (onDone && names.length) onDone(slugify(names[0].replace(/^@/, "")));
      }}, "Create"),
    ],
  });
}

/* ============================================================
   145_HORIZONS_VIEW
   ============================================================ */
function horizonRow(h, body, action) {
  return el("div", {class: "section"},
    el("h3", {},
      el("span", {style: "color:var(--accent);font-family:var(--mono);font-size:11px"}, h.alt),
      el("span", {}, h.h + " · " + h.name),
      action ? el("span", {style: "margin-left:auto"}, action) : null),
    body);
}

function textHorizonCard(key, h) {
  const lines = getHorizon(key);
  const card = el("div", {class: "card"});
  if (!lines.length) {
    card.append(el("div", {class: "empty"}, h.ask));
  } else {
    for (const l of lines) card.append(el("div", {class: "dash-item", html: renderInline(l)}));
  }
  return card;
}

function editHorizonText(key, h) {
  const ta = el("textarea", {placeholder: h.ask, style: "min-height:130px"});
  ta.value = getHorizon(key).join("\n");
  modal({
    center: true, title: h.h + " · " + h.name,
    body: el("div", {class: "field"}, el("label", {}, h.ask), ta),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: () => {
             setHorizon(key, ta.value.split("\n")); closeModal(); render();
           }}, "Save")],
  });
}

function viewHorizons() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());

  const areas = areaList(), goals = goalList();
  /* Only what this space actually runs counts as empty, or a space with no
     purpose by design would sit under the hero for ever. */
  const texts = ["vision", "purpose"].filter(horizonActive);
  const nothing = !areas.length && !goals.length && !texts.some(k => getHorizon(k).length);

  if (nothing) {
    c.append(el("div", {class: "hero"},
      el("h2", {}, "Horizons of focus"),
      el("div", {style: "font-size:16px;font-weight:600;margin-bottom:2px"}, "Altitude, not just a list"),
      el("p", {}, (texts.length ? "Purpose, vision, goals and areas are" : "Goals and areas are") +
                  " what make your projects mean something. " +
                  "Nothing is created for you - the wizard asks, you answer."),
      el("div", {class: "acts"},
        el("button", {class: "btn primary", onclick: () => openHorizonsWizard(0)}, "Run the setup wizard"))));
  }

  for (const row of activeHorizons()) {
    const h = horizonMeta(row.key);
    if (h.key === "purpose" || h.key === "vision") {
      const has = getHorizon(h.key).length;
      c.append(horizonRow(h, textHorizonCard(h.key, h),
        el("span", {},
          has
            ? el("button", {class: "btn sm ghost", style: "margin-right:6px",
                onclick: () => openPage(horizonPath(h.key))}, "open")
            : null,
          el("button", {class: "btn sm ghost", onclick: () => editHorizonText(h.key, h)},
            /* An inherited horizon is not yours to define - you are writing
               down something that already exists somewhere else. */
            has ? "edit" : h.inherited ? "record" : "define"))));
    } else if (h.key === "goals") {
      const card = el("div", {class: "card"});
      if (!goals.length) card.append(el("div", {class: "empty"}, h.ask));
      for (const g of goals) {
        const name = baseName(g);
        const live = projectsForGoal(name).filter(p => ["1", "3"].includes(statusDirOf(p)));
        card.append(el("div", {class: "prow"},
          el("span", {class: "st st-1"}, "3"),
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(g)}, pageTitle(g)),
          el("button", {class: "chip b", onclick: () => openAreaPickerFor(g)},
            areaOfGoal(g) ? areaOfGoal(g) : "no area"),
          live.length ? el("span", {class: "chip"}, live.length + " projects")
                      : el("span", {class: "chip miss b", onclick: () => newProjectPrompt(np => { setGoalOfProject(np, name); openPage(np); })},
                          "no project")));
      }
      c.append(horizonRow(h, card,
        el("button", {class: "btn sm ghost", onclick: () => newGoalPrompt()}, "+ goal")));
    } else if (h.key === "areas") {
      const card = el("div", {class: "card"});
      if (!areas.length) card.append(el("div", {class: "empty"}, h.ask));
      for (const a of areas) {
        const name = baseName(a);
        const projects = projectsInArea(name);
        const open = projects.reduce((n, p) => n + openTodoCount(p), 0);
        card.append(el("div", {class: "prow"},
          el("span", {class: "st st-2"}, "2"),
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(a)}, name),
          el("span", {class: "sub"}, projects.length + " projects"),
          open ? el("span", {class: "chip"}, open + " open") : null,
          el("button", {class: "btn sm ghost", onclick: () => newProjectPrompt(np => { setAreaOfProject(np, name); openPage(np); })},
            "+ project")));
      }
      const orphans = unassignedProjects();
      if (orphans.length) {
        card.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
          el("span", {}, orphans.length + " project(s) belong to no area"),
          el("span", {class: "fix", onclick: () => openAreaPicker(orphans[0])}, "assign")));
      }
      c.append(horizonRow(h, card,
        el("button", {class: "btn sm ghost", onclick: () => newAreaPrompt()}, "+ area")));
    } else if (h.key === "projects") {
      const card = el("div", {class: "card"});
      for (const code of STATUS_ORDER) {
        card.append(el("button", {class: "prow", onclick: () => go("projects", {statusCode: code})},
          el("span", {class: "st st-" + code}, code),
          el("span", {class: "nm"}, STATUS_LABEL[code]),
          el("span", {class: "sub"}, projectsIn(code).length + "")));
      }
      const noOutcome = projectsWithoutOutcome();
      if (noOutcome.length) {
        card.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
          el("span", {}, noOutcome.length + " project(s) with no stated outcome"),
          el("span", {class: "fix", onclick: () => openOutcomePrompt(noOutcome[0])}, "define")));
      }
      c.append(horizonRow(h, card));
    } else {
      const open = leafActions().filter(a => OPEN_STATES[a.state]);
      const card = el("div", {class: "card"},
        el("button", {class: "prow", onclick: () => go(isSimple() ? "todos" : "next")},
          el("span", {class: "st st-1"}, "▸"),
          el("span", {class: "nm"}, "Open next actions"),
          el("span", {class: "sub"}, open.length + "")));
      c.append(horizonRow(h, card));
    }
  }

  c.append(el("div", {class: "section"},
    el("button", {class: "btn ghost", onclick: () => openHorizonsWizard(0)}, "Run the horizons wizard")));
  return c;
}

function newGoalPrompt() {
  promptInput({
    title: "New goal", label: "What do you want true in one to two years?", cta: "Create",
    onSave: t => { const p = createGoal(t); render(); openPage(p); },
  });
}

/* Area picker that works for a goal page as well as a project page. */
function openAreaPickerFor(goalPath) {
  const areas = areaList().map(baseName);
  if (!areas.length) { newAreaPrompt(a => { setAreaOfGoal(goalPath, baseName(a)); render(); }); return; }
  listPicker({
    title: "Area for " + pageTitle(goalPath),
    items: areas.concat(["(none)"]),
    label: a => a,
    onPick: a => { setAreaOfGoal(goalPath, a === "(none)" ? null : a); render(); },
  });
}

/* Kept in three named groups rather than one undifferentiated pile, because the
   difference between them is the one piece of filing that actually earns its
   keep: a routine sitting in the project list makes the project list look
   permanently unfinished. */
function viewChecklists() {
  const c = el("div", {class: "wrap"});
  const lists = checklistPages();
  const GROUPS = [
    {label: "Routines", icon: "\u21bb", cta: "Run",
     test: pth => isRoutine(pth) && !isProjectTemplate(pth),
     blurb: "Comes back and never finishes - the weekly accounts, the monthly report, " +
            "everything you pack before a trip. Not a project, because there is nothing to tick off."},
    {label: "Checklists", icon: "\u2611", cta: "Run",
     test: pth => !isRoutine(pth) && !isProjectTemplate(pth),
     blurb: "Steps you would rather not think through twice. Run one into today, or into a " +
            "project you already have."},
    {label: "Project templates", icon: "\u221e", cta: "New project",
     test: pth => isProjectTemplate(pth),
     blurb: "Every run spins up a whole new project - \"Onboard new insurance customer\", " +
            "once per customer, the same steps each time."},
  ];
  const head = el("button", {class: "btn sm ghost", style: "margin-left:auto",
    onclick: () => newChecklistPrompt()}, "+ new");

  // Empty, the three descriptions ARE the content: this is the one screen where
  // the difference between them is worth a paragraph.
  if (!lists.length) {
    const card = el("div", {class: "card"});
    card.append(el("div", {class: "empty", style: "text-align:left"},
      el("div", {style: "font-size:13.5px;color:var(--fg2);margin-bottom:10px"}, "A project finishes. A routine comes back. A template makes projects."),
      ...GROUPS.map(g => el("div", {style: "margin:8px 0"},
        el("div", {}, g.icon + "  " + g.label),
        el("div", {style: "color:var(--fg3);font-size:12.5px;line-height:1.5"}, g.blurb)))));
    c.append(section("Routines & lists", null, card, head));
    return c;
  }

  let first = true;
  for (const g of GROUPS) {
    const mine = lists.filter(g.test);
    if (!mine.length) continue;
    const card = el("div", {class: "card"});
    card.append(el("div", {class: "listblurb"}, g.blurb));
    for (const pth of mine) {
      const items = flattenBlocks(getPage(pth).blocks).length;
      card.append(el("div", {class: "prow"},
        el("span", {class: "st " + (isProjectTemplate(pth) ? "st-1" : "st-2")}, g.icon),
        el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(pth)}, pageTitle(pth)),
        isRoutine(pth) ? el("span", {class: "chip"}, cadenceOf(pth)) : null,
        el("span", {class: "sub"}, items + (items === 1 ? " step" : " steps")),
        el("button", {class: "btn sm primary", onclick: () => openRunChecklist(pth)}, g.cta)));
    }
    c.append(section(g.label, mine.length, card, first ? head : null));
    first = false;
  }
  return c;
}

/* Flat todo list, grouped by project -- the simple-mode workhorse. */
function viewTodos() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const all = leafActions().filter(a => OPEN_STATES[a.state]);
  c.append(el("div", {class: "section"}, quickAdd(ensureJournal(todayISO()), {placeholder: "Add a task to today"})));
  const bar = stateFilterBar(all);
  if (bar) c.append(el("div", {class: "section"}, bar));
  const tip = tipCard();
  if (tip) c.append(tip);

  const acts = visibleStates(all);
  const byProject = new Map();
  for (const a of acts) {
    const key = a.project || "No project";
    if (!byProject.has(key)) byProject.set(key, []);
    byProject.get(key).push(a);
  }
  if (!acts.length) c.append(section("Todos", 0, taskCard([],
    all.length ? "Nothing in the states you have shown." : "Nothing open. Add one above.")));

  /* The groups need rationing as much as the rows do: capping each project at
     sixty tasks does nothing when the cost is two thousand projects. */
  const groups = Array.from(byProject.entries()).sort((x, y) => x[0].localeCompare(y[0]));
  for (const [, items] of groups)
    items.sort((x, y) => (x.added || "9999").localeCompare(y.added || "9999"));
  appendPaged(c, groups, ([name, items]) => section(name, items.length, taskCard(items)),
              n => n + " more project" + (n === 1 ? "" : "s"));
  return c;
}

/* The row under a rationed list: one more page, or all of it.
   A cap exists because drawing twenty thousand rows took ten seconds, but
   somebody who actually wants the whole list should not have to press "show
   more" eleven times to get it. `step` draws another page, `all` draws the
   rest; the second button only appears when it would do something the first
   one does not. */
function moreRow(step, all) {
  const stepBtn = el("button", {class: "showmore", onclick: e => { e.stopPropagation(); step(); }});
  const allBtn  = el("button", {class: "showmore all", onclick: e => { e.stopPropagation(); all(); }});
  const row = el("div", {class: "showmorerow"}, stepBtn, allBtn);
  row.set = (stepText, allText) => {
    stepBtn.textContent = stepText;
    allBtn.textContent = allText || "";
    allBtn.hidden = !allText;
  };
  return row;
}

/* Draw the first page of anything, with the rest a click away. */
function appendPaged(parent, items, make, label) {
  let drawn = 0;
  const drawTo = upto => {
    for (let i = drawn; i < upto; i++) parent.insertBefore(make(items[i]), more);
    drawn = upto;
    const left = items.length - drawn;
    if (!left) { more.remove(); return; }
    more.set("Show " + (label ? label(Math.min(left, CFG.groupsPerPage)) : Math.min(left, CFG.groupsPerPage) + " more"),
             left > CFG.groupsPerPage ? "Show all " + items.length : "");
  };
  const more = moreRow(() => drawTo(Math.min(items.length, drawn + CFG.groupsPerPage)),
                       () => drawTo(items.length));
  parent.append(more);
  drawTo(Math.min(items.length, CFG.groupsPerPage));
  return parent;
}

/* ---------- taking something back out of a shared space ----------
   "Private" is not a flag on a page: anyone with the folder can read the
   folder. The only thing that actually makes a page private is moving it to a
   folder the others cannot open -- so that is the question this asks, rather
   than offering a checkbox that would be a lie. */
function makePrivatePrompt(path) {
  const title = pageTitle(path);
  const others = Spaces.list.filter(sp => sp.name !== Spaces.active);
  const body = el("div", {},
    el("div", {class: "field"},
      el("div", {style: "font-size:13.5px"},
        "\u201C" + title + "\u201D is in " + Spaces.active + ", and everybody who can open " +
        "that folder can read it. Making it private means putting it somewhere they cannot, " +
        "so pick where it should live."),
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
        "The page moves with its tasks and its notes. Links from pages left behind will " +
        "point at nothing - that is the cost of taking it out.")));

  const list = el("div", {});
  for (const sp of others) {
    list.append(el("button", {class: "pick", onclick: () => { closeModal(); movePageToSpace(path, sp.name); }},
      el("span", {class: "k", style: "background:" + sp.color + ";color:#06101f"}, sp.name[0].toUpperCase()),
      el("span", {style: "flex:1"}, sp.name),
      el("span", {class: "d"}, sp.kind === "fs" ? (sp.label || "folder")
                             : sp.kind === "http" ? "server" : "this browser")));
  }
  list.append(el("button", {class: "pick", onclick: () => { closeModal(); newSpacePrompt(sp => movePageToSpace(path, sp.name)); }},
    el("span", {class: "k"}, "+"),
    el("span", {style: "flex:1"}, "A new private space"),
    el("span", {class: "d"}, "its own folder")));
  body.append(el("div", {class: "field"}, el("label", {}, "Move it to"), list));

  modal({center: true, title: "Make \u201C" + title + "\u201D private", body,
         foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Leave it here")]});
}

/* Carry a page across the folder boundary: write it there, remove it here. */
async function movePageToSpace(path, target) {
  const page = getPage(path);
  if (!page) return;
  const copy = parsePage(serializePage(page));       // detach from this space
  const from = Spaces.active;
  removePage(path);
  await flush();
  await openSpace(target);
  putPage(path, copy);
  await flush();
  notify("\u201C" + pageTitle(path) + "\u201D now lives in " + target + ", out of " + from + ".");
  openPage(path);
}

/* ============================================================
   UNDO FOR DELETES
   Deleting was one click and permanent, which is the only genuinely scary
   thing left in the app. It is now one click and reversible for a while.

   What is kept is the removed thing itself, not a snapshot of the page --
   putting a whole page back would quietly discard anything else that changed
   on it in the meantime, which is a worse bug than the one being fixed. A
   block remembers its parent and where it sat; if the shape has moved on by
   the time you undo, it goes back to the end of that parent rather than
   refusing.
   ============================================================ */
const UNDO = [];
const UNDO_KEEP = 20;
/* Blocks carry a _parent back-reference for the outliner, so a structured
   clone has to be explicit: JSON.stringify walks straight into the cycle.
   Internal keys begin with an underscore and are rebuilt, never copied. */
function cloneBlock(b) {
  const out = newBlock({
    state: b.state ?? null,
    title: b.title || "",
    props: Object.assign({}, b.props || {}),
    body: (b.body || []).slice(),
    collapsed: !!b.collapsed,
  });
  out.children = (b.children || []).map(cloneBlock);
  return out;
}
function clonePage(page) {
  return {
    props: Object.assign({}, page.props || {}),
    blocks: (page.blocks || []).map(cloneBlock),
  };
}

function pushUndo(entry) {
  UNDO.push(Object.assign({at: Date.now()}, entry));
  while (UNDO.length > UNDO_KEEP) UNDO.shift();
}

/* Within the same window a demoted task keeps its dates for. */
const undoFresh = e => (Date.now() - e.at) < CFG.undoStateMinutes * 60000;

function undoLast() {
  while (UNDO.length) {
    const e = UNDO.pop();
    if (!undoFresh(e)) continue;                 // too old to be what you meant
    if (e.run()) return true;
  }
  notify("Nothing recent to undo.", "warn");
  return false;
}

/* Remove a block, remembering enough to put it back. */
function deleteBlockWithUndo(path, block, label) {
  const page = getPage(path);
  if (!page) return;
  const parent = parentOf(page, block);
  const sibs = parent ? (parent.children || []) : page.blocks;
  const index = sibs.indexOf(block);
  const copy = cloneBlock(block);
  const parentTitle = parent ? parent.title : null;
  const space = Spaces.active;

  removeBlockFrom(page, block);
  touch(path);
  render();

  const restore = () => {
    let ok = false;
    inSpace(space, () => {
      const pg = getPage(path);
      if (!pg) return;
      let list = pg.blocks;
      if (parentTitle != null) {
        let found = null;
        walkBlocks(pg.blocks, b => { if (!found && b.title === parentTitle) found = b; });
        if (found) list = found.children || (found.children = []);
      }
      const at = index >= 0 && index <= list.length ? index : list.length;
      list.splice(at, 0, cloneBlock(copy));
      touch(path);
      ok = true;
    });
    if (ok) { render(); notify("Put back."); }
    return ok;
  };
  pushUndo({run: restore, label});
  notify((label || "Deleted") + ".", "info", {label: "Undo", run: restore});
}

/* Remove a whole page, remembering it. */
function deletePageWithUndo(path) {
  const page = getPage(path);
  if (!page) return;
  const copy = clonePage(page);
  const space = Spaces.active;
  removePage(path);
  render();

  const restore = () => {
    let ok = false;
    inSpace(space, () => {
      if (V.pages.has(path)) { notify("That page is back already.", "warn"); return; }
      V.removed.delete(path);
      dropTombstone(path);
      putPage(path, clonePage(copy));
      ok = true;
    });
    if (ok) { render(); notify("Put “" + pageTitle(path) + "” back."); }
    return ok;
  };
  pushUndo({run: restore, label: "Deleted " + pageTitle(path)});
  notify("Deleted " + pageTitle(path) + ".", "info", {label: "Undo", run: restore});
}

/* ============================================================
   TALKING ON A TASK
   "Done except the VAT bit" had nowhere to go: you could only edit somebody
   else's words, which loses who said what and when. A message is an ordinary
   child block carrying who wrote it and when -- so it is plain markdown, it
   nests under the task in Neovim, and because the sync merges blocks by text
   two people posting at the same moment both survive.

   A message has no state, so it is not a task: it cannot make its parent look
   unfinished and it never appears in a to-do list.

   Read is per device and never written to the vault: you reading something
   must not mark it read for everybody. A FLAG is the opposite -- it carries
   your name in the file, so it follows you between devices and your colleagues
   can see you have picked it up.
   ============================================================ */
const MSG_PROP = "msg", MSG_AT = "at", MSG_FLAG = "flagged_by";

const isMessage = b => !!trim(blockProp(b, MSG_PROP) || "");
const msgAuthor = b => trim(blockProp(b, MSG_PROP) || "");
const msgAt     = b => trim(blockProp(b, MSG_AT) || "");
const msgKey    = b => slugPerson(msgAuthor(b)) + "|" + msgAt(b);

const msgFlags = b => (trim(blockProp(b, MSG_FLAG) || "")
  .split(",").map(trim).filter(Boolean));
const flaggedByMe = b => msgFlags(b).some(n => samePerson(n, whoAmI()));

function messagesOf(block) {
  return (block.children || []).filter(isMessage)
    .sort((a, b) => msgAt(a).localeCompare(msgAt(b)));
}

function postMessage(path, block, text) {
  const body = trim(text);
  if (!body) return null;
  const m = newBlock({state: null, title: body});
  setBlockProp(m, MSG_PROP, whoAmI() || "Someone");
  setBlockProp(m, MSG_AT, nowStamp());
  (block.children || (block.children = [])).push(m);
  touch(path);
  markThreadRead(block);            // your own words are not news to you
  return m;
}

function toggleMsgFlag(path, m) {
  const me = whoAmI();
  if (!me) { notify("Put your name in first - a flag is a name.", "warn"); return; }
  const now = msgFlags(m).filter(n => !samePerson(n, me));
  if (now.length === msgFlags(m).length) now.push(me);
  if (now.length) setBlockProp(m, MSG_FLAG, now.join(", "));
  else for (const k of Object.keys(m.props)) if (k.toLowerCase() === MSG_FLAG) delete m.props[k];
  touch(path);
  render();
}

/* ---------- read, per device ---------- */
const readKey = () => "readmsg:" + (Spaces.active || "");
function readSet() {
  return memo("readSet:" + readKey(), () => {
    try { return new Set(JSON.parse(PREF.get(readKey(), "[]"))); }
    catch (_) { return new Set(); }
  });
}
function saveReadSet(set) {
  // Keep it from growing without limit; the oldest keys are the least useful.
  const keys = Array.from(set).slice(-800);
  PREF.set(readKey(), JSON.stringify(keys));
  MEMO.delete("readSet:" + readKey());
}
const isUnread = m => !samePerson(msgAuthor(m), whoAmI()) && !readSet().has(msgKey(m));

function markThreadRead(block) {
  const set = readSet();
  let hit = false;
  for (const m of messagesOf(block)) if (!set.has(msgKey(m))) { set.add(msgKey(m)); hit = true; }
  if (hit) saveReadSet(set);
}

function unreadCount(block) {
  const set = readSet();
  const me = whoAmI();
  return messagesOf(block).filter(m => !samePerson(msgAuthor(m), me) && !set.has(msgKey(m))).length;
}

/* Everything flagged by me, anywhere in this space. */
function flaggedMessages() { return memo("flagged", flaggedMessagesNow); }
function flaggedMessagesNow() {
  const out = [];
  for (const [path, page] of V.pages) {
    walkBlocks(page.blocks, (b, parent) => {
      if (isMessage(b) && flaggedByMe(b)) out.push({path, msg: b, task: parent});
    });
  }
  return out.sort((a, b) => msgAt(b.msg).localeCompare(msgAt(a.msg)));
}

/* ============================================================
   LINKS IN FROM EVERYWHERE ELSE
   "Did you correct the colours on the rollup?" is a sentence somebody types in
   Teams, in an email, in a text. It should be able to carry the task with it.

   A link is the page's own address plus which space, which file and which
   block -- so pasting it anywhere gives a colleague a way back to the exact
   thing. Block ids are regenerated on every parse, so copying a link stamps a
   durable id:: on that block; it is the only moment we need one, and it goes
   into the markdown like everything else.

   Links are worth most when the app is served from a URL, since then everybody
   has the same address. From a downloaded file the link still works for anyone
   whose copy sits at the same path, and the dialog says so rather than
   pretending.
   ============================================================ */
const LINK_TAG = "gt";

function ensureBlockId(path, block) {
  let id = trim(blockProp(block, "id") || "");
  if (!id) {
    id = Math.random().toString(36).slice(2, 10);
    setBlockProp(block, "id", id);
    touch(path);
  }
  return id;
}

function deepLink(path, block) {
  const q = new URLSearchParams();
  if (Spaces.active) q.set("s", Spaces.active);
  q.set("p", path);
  if (block) q.set("b", ensureBlockId(path, block));
  return location.href.replace(/#.*$/, "") + "#" + LINK_TAG + "&" + q.toString();
}

function parseDeepLink(hash) {
  const h = String(hash || "").replace(/^#/, "");
  if (h.slice(0, LINK_TAG.length) !== LINK_TAG) return null;
  const q = new URLSearchParams(h.slice(LINK_TAG.length).replace(/^&/, ""));
  const path = q.get("p");
  return path ? {space: q.get("s") || "", path, block: q.get("b") || ""} : null;
}

async function followDeepLink(link) {
  if (link.space && link.space !== Spaces.active) {
    if (Spaces.get(link.space)) await openSpace(link.space);
    else { notify("That link is for a space called \u201C" + link.space + "\u201D, which is not on this device.", "warn"); return false; }
  }
  if (!V.pages.has(link.path)) {
    notify("That link points at a page this vault does not have: " + link.path, "warn");
    return false;
  }
  if (link.block) {
    let found = null;
    walkBlocks(getPage(link.path).blocks, b => {
      if (!found && trim(blockProp(b, "id") || "") === link.block) found = b;
    });
    if (found) {
      openPage(link.path);
      state.selected = found.id;
      setTimeout(() => openTaskDetail(link.path, found), 120);
      return true;
    }
    notify("The page is here, but that particular item has gone.", "warn");
  }
  openPage(link.path);
  return true;
}

/* Clipboard where it is allowed, a selectable box where it is not. */
async function copyLinkTo(url, what) {
  try {
    await navigator.clipboard.writeText(url);
    notify("Link to " + what + " copied." +
      (CAP.served ? "" : " It only opens for somebody whose copy of the app sits at the same path."));
    return true;
  } catch (_) {}
  const box = el("input", {value: url, readonly: "readonly", style: "font-family:var(--mono);font-size:12px"});
  modal({
    center: true, title: "Link to " + what,
    body: el("div", {}, el("div", {class: "field"}, box,
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
        CAP.served ? "Paste it anywhere - chat, email, a document."
          : "This app is open as a file, so the link only works for somebody whose copy " +
            "sits at the same path. Serve it from a web address and the link works for everybody."))),
    foot: [el("button", {class: "btn primary", onclick: closeModal}, "Done")],
  });
  setTimeout(() => { box.focus(); box.select(); }, 40);
  return false;
}

/* The same bargain for a block of text: the clipboard where the browser allows
   it, and a box you can select where it does not -- a report exists to be
   pasted somewhere else, so "it is on screen" is not finished. */
async function copyText(text, okMsg, title) {
  try {
    await navigator.clipboard.writeText(text);
    notify(okMsg || "Copied.");
    return true;
  } catch (_) {}
  const box = el("textarea", {readonly: "readonly",
    style: "width:100%;min-height:260px;font-family:var(--mono);font-size:12px"});
  box.value = text;
  modal({
    center: true, title: title || "Copy this",
    body: el("div", {}, el("div", {class: "field"}, box,
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
        "This browser would not let the app reach the clipboard, so select it and copy."))),
    foot: [el("button", {class: "btn primary", onclick: closeModal}, "Done")],
  });
  setTimeout(() => { box.focus(); box.select(); }, 40);
  return false;
}

/* Arriving on a link, whether the app was already open or not. */
let LAST_HASH = "";
async function handleHash() {
  const h = location.hash;
  if (h === LAST_HASH) return;
  LAST_HASH = h;
  const link = parseDeepLink(h);
  if (!link) return;
  await followDeepLink(link);
}

/* ============================================================
   FACES AND LAST SEEN
   A picture lives in the person's own page as a data: URI, so it travels in
   the vault like everything else -- no uploads, no server, no second place for
   things to go missing. The cost is bytes in a markdown file, so the image is
   re-drawn at 96px and squeezed until it fits a hard ceiling; a 4MB photo
   becomes about 8KB of text.

   Last seen is written to the same page, at most once an hour, so colleagues
   can tell whether somebody has even opened the thing this week. A space that
   is set to record nothing records this too -- it is the same promise.
   ============================================================ */
const AVATAR_PROP = "avatar", SEEN_PROP = "last_seen";
const AVATAR_MAX = 24 * 1024;          // data: URI characters, not pixels

const personProp = (name, key) => {
  const page = V.pages.get(personPath(name));
  return page ? trim(String(page.props?.[key] || "")) : "";
};
const avatarOf = name => {
  const v = personProp(name, AVATAR_PROP);
  return /^data:image\//.test(v) ? v : "";
};

/* A face if there is one, initials in their own colour if not. */
function avatarNode(name, size) {
  const px = size || 26;
  const src = avatarOf(name);
  const common = {class: "avatar", style: "width:" + px + "px;height:" + px + "px"};
  if (src) return el("img", Object.assign({src, alt: name || "", loading: "lazy"}, common));
  return el("div", Object.assign({}, common, {
    style: common.style + ";background:" + personTint(name) +
           ";font-size:" + Math.round(px * 0.40) + "px",
  }), initialsOf(name));
}

/* Square, downscaled, and squeezed until the text fits. */
function shrinkToDataURI(file, px, limit) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);
      const cv = document.createElement("canvas");
      cv.width = cv.height = px;
      const cx = cv.getContext("2d");
      cx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, px, px);
      let q = 0.82, out = "";
      for (let i = 0; i < 7; i++) {
        out = cv.toDataURL("image/jpeg", q);
        if (out.length <= limit) return resolve(out);
        q -= 0.1;
      }
      resolve(out.length <= limit * 1.5 ? out : null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("not an image")); };
    img.src = url;
  });
}

function pickAvatar(name, then) {
  const input = el("input", {type: "file", accept: "image/*", style: "display:none",
    onchange: async e => {
      const f = e.target.files[0];
      input.remove();
      if (!f) return;
      try {
        const data = await shrinkToDataURI(f, 96, AVATAR_MAX);
        if (!data) { notify("Could not get that picture small enough. Try a simpler one.", "warn"); return; }
        const path = personPath(name);
        const page = V.pages.has(path) ? getPage(path) : {props: {title: name}, blocks: []};
        page.props[AVATAR_PROP] = data;
        putPage(path, page);
        notify("Picture set - " + Math.round(data.length / 1024) + "KB in your page.");
        render();
        if (then) then();
      } catch (_) { notify("That file did not read as an image.", "error"); }
    }});
  document.body.append(input);
  input.click();
}

function clearAvatar(name) {
  const path = personPath(name);
  if (!V.pages.has(path)) return;
  const page = getPage(path);
  delete page.props[AVATAR_PROP];
  putPage(path, page);
  render();
}

/* ---------- last seen ---------- */
const SEEN_EVERY_MS = 60 * 60 * 1000;

function touchLastSeen() {
  const me = whoAmI();
  if (!me || attributionOff()) return;        // a space that records nothing records this too
  const path = personPath(me);
  if (!V.pages.has(path)) return;             // ensureMemberPage makes it; do not fight it
  const page = getPage(path);
  const prev = Date.parse(trim(String(page.props?.[SEEN_PROP] || ""))) || 0;
  if (Date.now() - prev < SEEN_EVERY_MS) return;   // an hour's resolution is plenty
  page.props[SEEN_PROP] = nowStamp();
  putPage(path, page);
}

/* "just now", "2 hours ago", "yesterday", "3 days ago", "6 Oct". */
function sinceLabel(stamp) {
  const t = Date.parse(stamp || "");
  if (!t) return "";
  const mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 2)    return "just now";
  if (mins < 60)   return mins + " min ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)    return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.floor(hrs / 24);
  if (days === 1)  return "yesterday";
  if (days < 7)    return days + " days ago";
  return humanDate(dateIn(stamp) || "");
}
const lastSeenOf = name => sinceLabel(personProp(name, SEEN_PROP));

/* ---------- reading a conversation ----------
   The ordinary rules for making a thread scannable rather than a wall: group
   what one person said in one go instead of repeating their name, separate the
   days, show a time you can actually use, and put one line where the unread
   starts rather than tinting every message. */
const initialsOf = name => trim(name).split(/\s+/).filter(Boolean)
  .slice(0, 2).map(w => w[0].toUpperCase()).join("") || "?";

/* A colour per person, stable, so the same face is the same colour everywhere. */
function personTint(name) {
  const key = slugPerson(name).toLowerCase();
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 360;
  return "hsl(" + h + " 55% 55%)";
}

/* "14:32" today, "Yesterday 14:32", "Mon 14:32" this week, else a date.
   The clock is asked for as a time, not sliced out of a formatted datetime:
   pulling /\d+:\d+/ out of "6 Oct 2026, 2:02 pm" gives "2:02" and loses the
   afternoon, which is the kind of wrong that gets somebody to a meeting late. */
function chatTime(stamp) {
  const day = dateIn(stamp);
  const t = formatStamp(stamp);
  const clock = formatStamp(stamp, {dateStyle: undefined, timeStyle: "short"});
  if (!day) return t;
  if (day === todayISO()) return clock || t;
  if (day === shiftISO(todayISO(), -1)) return "Yesterday" + (clock ? " " + clock : "");
  if (day > shiftISO(todayISO(), -7)) {
    const wd = new Date(day + "T00:00:00Z").getUTCDay();
    return WEEKDAYS[wd].slice(0, 3).replace(/^./, c => c.toUpperCase()) + (clock ? " " + clock : "");
  }
  return humanDate(day) + (clock ? " " + clock : "");
}

function chatDayLabel(day) {
  if (day === todayISO()) return "Today";
  if (day === shiftISO(todayISO(), -1)) return "Yesterday";
  return humanDate(day);
}

/* Messages -> rows, with the grouping decisions already made. */
function threadRows(msgs) {
  const rows = [];
  let lastDay = null, lastWho = null, lastAt = 0, firstUnread = true;
  for (const m of msgs) {
    const day = dateIn(msgAt(m)) || todayISO();
    if (day !== lastDay) { rows.push({sep: chatDayLabel(day)}); lastDay = day; lastWho = null; }
    if (isUnread(m) && firstUnread) { rows.push({newHere: true}); firstUnread = false; }
    const at = Date.parse(msgAt(m)) || 0;
    // Same person, within five minutes: one speech, not two.
    const grouped = msgAuthor(m) === lastWho && (at - lastAt) < 5 * 60000;
    rows.push({msg: m, grouped});
    lastWho = msgAuthor(m); lastAt = at;
  }
  return rows;
}

/* ---------- the thread, as it appears under a task ---------- */
function threadPanel(path, block) {
  const wrap = el("div", {});
  const list = el("div", {class: "thread"});
  const input = el("textarea", {rows: "2", placeholder: "Say something about this\u2026"});

  const draw = () => {
    list.textContent = "";
    const msgs = messagesOf(block);
    if (!msgs.length) {
      list.append(el("div", {class: "empty", style: "font-size:12.5px"},
        "Nothing said yet. Useful for \u201Cdone except the VAT bit\u201D."));
    }
    for (const row of threadRows(msgs)) {
      if (row.sep)     { list.append(el("div", {class: "msg-day"}, el("span", {}, row.sep))); continue; }
      if (row.newHere) { list.append(el("div", {class: "msg-new"}, el("span", {}, "New"))); continue; }
      const m = row.msg;
      const who = msgAuthor(m) || "Someone";
      const mine = samePerson(who, whoAmI());
      const others = msgFlags(m).filter(n => !samePerson(n, whoAmI()));
      // The name sits above the bubble, not inside it: a bubble holds what was
      // said, and mixing the speaker into it makes both harder to scan.
      const node = el("div", {class: "msg" + (mine ? " mine" : "") + (row.grouped ? " cont" : "")},
        // The spacer has to be the SAME size as a face, or every continuation
        // bubble sits a couple of pixels off from the one above it.
        row.grouped ? el("div", {class: "avatar ghost", style: "width:28px;height:28px"})
                    : avatarNode(who, 28),
        el("div", {class: "msg-main"},
          row.grouped ? null : el("div", {class: "msg-head"},
            el("span", {class: "who"}, mine ? "You" : who),
            el("span", {class: "when"}, chatTime(msgAt(m))),
            !mine && lastSeenOf(who) ? el("span", {class: "seen"}, "\u00B7 seen " + lastSeenOf(who)) : null),
          el("div", {class: "bubble"},
            el("div", {class: "msg-body"}, m.title),
            el("button", {class: "flagbtn" + (flaggedByMe(m) ? " on" : ""),
              title: flaggedByMe(m) ? "Flagged - click to clear" : "Flag to come back to",
              onclick: () => { toggleMsgFlag(path, m); draw(); }}, "\u2691")),
          others.length ? el("div", {class: "msg-flags"}, "\u2691 " + others.join(", ")) : null));
      list.append(node);
    }
    markThreadRead(block);
    requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
  };
  draw();

  const send = () => {
    if (!trim(input.value)) return;
    postMessage(path, block, input.value);
    input.value = "";
    draw();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });

  wrap.append(list, el("div", {style: "display:flex;gap:8px;align-items:flex-end;margin-top:8px"},
    input, el("button", {class: "btn sm primary", onclick: send}, "Send")));
  return wrap;
}

/* ============================================================
   OTHER WAYS TO LOOK AT THE SAME TASKS
   A list is the right default and the wrong shape for some questions. Three
   more, all reading the very same blocks -- nothing here is a second copy or a
   separate mode, and anything you change in one is changed everywhere.

   Board     where is everything up to
   Calendar  what lands on which day
   Graph     what is connected to what
   ============================================================ */

/* ---------- board ---------- */
const BOARD_COLUMNS = [
  ["TODO",  "To do"],
  ["DOING", "Doing"],
  ["WAIT",  "Waiting for"],
  ["DONE",  "Done"],
];

function boardCard(a) {
  // A button, not a div: a card you cannot reach with Tab is a card half the
  // people here cannot open. Dragging works on a button just the same.
  const card = el("button", {
    class: "bcard", draggable: "true",
    data: {id: a.block.id},
    // A link inside the title is the link's click, not the card's -- the same
    // rule the list rows follow, so [[go/todos]] goes to Todos.
    onclick: e => {
      if (e.target.closest("[data-link]")) return;
      inSpace(a.space, () => openTaskDetail(a.path, a.block, a.space));
    },
  },
    el("div", {class: "bcard-title", html: renderInline(titleForRow(a.title))}),
    el("div", {class: "bcard-meta"},
      multiSpace() && a.space ? spaceBadge(a.space) : null,
      a.project ? el("span", {class: "chip proj"}, a.project) : null,
      a.context ? el("span", {class: "chip ctx"}, "@" + a.context) : null,
      a.due ? el("span", {class: "chip " + (a.due < todayISO() ? "late" : a.due === todayISO() ? "today" : "")},
        humanDate(a.due)) : null,
      a.assignee ? el("span", {class: "chip who"}, "\u2192 " + a.assignee) : null,
      messagesOf(a.block).length ? el("span", {class: "chip msg"}, "\u25CB " + messagesOf(a.block).length) : null));
  card.addEventListener("dragstart", e => {
    DRAGGED = a;
    card.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", a.block.id); e.dataTransfer.effectAllowed = "move"; } catch (_) {}
  });
  card.addEventListener("dragend", () => { card.classList.remove("dragging"); DRAGGED = null; });
  return card;
}

let DRAGGED = null;

function viewBoard() {
  const c = el("div", {class: "wrap"});
  const all = leafActions();
  const done = doneToday();
  c.append(el("div", {class: "section"},
    quickAdd(ensureJournal(todayISO()), {placeholder: "Add a task"})));

  const board = el("div", {class: "board"});
  for (const [stateKey, label] of BOARD_COLUMNS) {
    const items = stateKey === "DONE" ? done : all.filter(a => a.state === stateKey);
    const col = el("div", {class: "bcol"},
      el("div", {class: "bcol-head"},
        el("span", {class: "state " + stateKey}, label),
        el("span", {class: "n"}, String(items.length))));
    const body = el("div", {class: "bcol-body"});
    /* On a phone the columns are stacked, so a hundred cards in the first one
       means scrolling past all of them to reach the second. */
    const step = window.innerWidth < 860 ? CFG.boardPerPhone : CFG.boardPerColumn;
    const shown = (state.boardMore || {})[stateKey] || step;
    items.slice(0, shown).forEach(a => body.append(boardCard(a)));
    if (items.length > shown) {
      const left = items.length - shown;
      const setTo = n => {
        const more = Object.assign({}, state.boardMore);
        more[stateKey] = n;
        go("board", {boardMore: more});
      };
      const row = moreRow(() => setTo(shown + step), () => setTo(items.length));
      row.set("Show " + Math.min(step, left) + " more \u00B7 " + left + " below",
              left > step ? "Show all " + items.length : "");
      body.append(row);
    }
    if (!items.length) body.append(el("div", {class: "empty", style: "font-size:12px"}, "Nothing here."));

    // Dropping on a column is the same call the state chip makes.
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      const a = DRAGGED;
      DRAGGED = null;
      if (!a || a.state === stateKey) return;
      inSpace(a.space, () => setBlockState(a.path, a.block, stateKey));
    });
    col.append(body);
    board.append(col);
  }
  c.append(board);
  c.append(el("div", {class: "section quiet"},
    el("div", {style: "color:var(--fg3);font-size:12px"},
      "Drag a card to move it, or open one and use the state buttons - which is " +
      "what you want on a phone, where dragging is a fight.")));
  return c;
}

/* Everything closed today, from any page, so the board's last column is not
   permanently empty. */
function doneTodayHere() {
  const out = [];
  const today = todayISO();
  for (const [path, page] of V.pages) {
    walkBlocks(page.blocks, b => {
      if (b.state !== "DONE" || isMessage(b)) return;
      if (closedOn(b) !== today) return;
      out.push({path, block: b, state: "DONE", title: b.title, context: contextOf(b.title),
                due: dueDate(b), assignee: assigneeOf(b), project: isJournalPath(path) ? null : pageTitle(path),
                projectPath: isJournalPath(path) ? null : path});
    });
  }
  return out;
}
const doneToday = () => memo("doneToday", () => acrossSpaces(doneTodayHere));
const closedDate = b => dateIn(blockProp(b, "CLOSED")) ||
  ((trim(blockProp(b, "Added") || "").match(/\]\]\s*-\s*\[\[(\d{4}-\d{2}-\d{2})/) || [])[1] || "");

/* ---------- calendar ---------- */
function monthGrid(anchor) {
  const [y, m] = anchor.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const start = new Date(first);
  start.setUTCDate(1 - ((first.getUTCDay() + 6) % 7));        // weeks begin on Monday
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setUTCDate(start.getUTCDate() + i);
    days.push(d.toISOString().slice(0, 10));
  }
  return days;
}

function viewCalendar() {
  const c = el("div", {class: "wrap"});
  const anchor = state.calMonth || todayISO().slice(0, 7);
  const picked = state.calDay && state.calDay.slice(0, 7) === anchor ? state.calDay
               : (todayISO().slice(0, 7) === anchor ? todayISO() : anchor + "-01");
  const byDay = new Map();
  for (const a of leafActions().filter(a => a.due)) {
    if (!byDay.has(a.due)) byDay.set(a.due, []);
    byDay.get(a.due).push(a);
  }

  const shift = n => {
    const [y, m] = anchor.split("-").map(Number);
    const d = new Date(Date.UTC(y, m - 1 + n, 1));
    go("calendar", {calMonth: d.toISOString().slice(0, 7), calDay: null});
  };
  const title = new Date(anchor + "-01T00:00:00Z")
    .toLocaleDateString(undefined, {month: "long", year: "numeric", timeZone: "UTC"});
  c.append(el("div", {class: "section", style: "display:flex;gap:8px;align-items:center"},
    el("button", {class: "btn sm ghost", title: "Previous month", onclick: () => shift(-1)}, "\u2039"),
    el("h2", {style: "margin:0;flex:1"}, title),
    el("button", {class: "btn sm ghost",
      onclick: () => go("calendar", {calMonth: todayISO().slice(0, 7), calDay: todayISO()})}, "Today"),
    el("button", {class: "btn sm ghost", title: "Next month", onclick: () => shift(1)}, "\u203A")));

  const grid = el("div", {class: "cal"});
  for (const name of ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"])
    grid.append(el("div", {class: "cal-dow"}, name));
  for (const day of monthGrid(anchor)) {
    const items = byDay.get(day) || [];
    const outside = day.slice(0, 7) !== anchor;
    const late = a => a.due < todayISO() && OPEN_STATES[a.state];
    // The whole square is the control: on a phone, picking a day is the gesture,
    // and the day's tasks are listed underneath where there is room to read them.
    const cell = el("button", {
      class: "cal-day" + (outside ? " out" : "") + (day === todayISO() ? " today" : "") +
             (day === picked ? " picked" : ""),
      onclick: () => go("calendar", {calMonth: day.slice(0, 7), calDay: day}),
    }, el("div", {class: "cal-num"}, String(Number(day.slice(8)))));
    const box = el("div", {class: "cal-items"});
    for (const a of items.slice(0, 4))
      box.append(el("span", {class: "cal-item" + (late(a) ? " late" : ""),
        title: plainTitle(a.title)}, plainTitle(a.title)));
    if (items.length > 4) box.append(el("span", {class: "cal-more"}, "+" + (items.length - 4)));
    cell.append(box);
    grid.append(cell);
  }
  c.append(grid);

  const dayItems = (byDay.get(picked) || []);
  // humanDate already says "Today", so do not say it twice.
  c.append(section(humanDate(picked), dayItems.length,
    taskCard(dayItems, "Nothing due on this day.")));

  if (!byDay.size) c.append(el("div", {class: "section quiet"},
    el("div", {style: "color:var(--fg3);font-size:12.5px"},
      "Nothing has a date yet. Give a task a scheduled day or a deadline and it lands here.")));
  return c;
}

/* ---------- graph ----------
   Every page, and the [[links]] between them. The shape is worked out by
   pushing all the pages apart and pulling linked ones together until it stops
   moving, which is why clusters appear: the things you write about together
   end up near each other without anybody filing them.

   It is a canvas and not a pile of divs because a few hundred dots and a few
   thousand lines as DOM elements is a slideshow, and because this is the one
   screen in the app that is a picture rather than a document. */
const GRAPH_KIND_VAR = {
  project: "--proj", journal: "--fg3", person: "--zet", context: "--ctx",
  zettel: "--zet", area: "--accent", goal: "--accent", horizon: "--accent",
  checklist: "--done", org: "--wait",
  // the mindmap hangs the tasks themselves off their page, coloured by state
  TODO: "--todo", DOING: "--doing", WAIT: "--wait", DONE: "--done", CANCELLED: "--cancel",
};

/* Positions survive a redraw, so ticking something off in the detail panel does
   not reshuffle the whole picture under your cursor. */
const GRAPH_POS = new Map();

function graphData() {
  return memo("graphData", () => {
    const nodes = [], edges = [], index = new Map();
    const keyOf = (space, path) => (space || "") + "\u0000" + path;
    const skip = k => k === "template" || k === "verb";
    const add = (space, path) => {
      const k = keyOf(space, path);
      let i = index.get(k);
      if (i == null) {
        i = nodes.length;
        index.set(k, i);
        const kind = pageKind(path);
        nodes.push({key: k, space, path, kind,
                    // A context reads as @phone everywhere else in the app.
                    label: kind === "context" ? "@" + pageTitle(path) : pageTitle(path), deg: 0});
      }
      return i;
    };
    /* A link to a page nobody has opened yet is still a link: [[c/phone]] is
       written in fifty tasks long before anything creates pages/c/phone.md.
       Leaving those out would hide most of the structure, so they are drawn
       hollow, and clicking one creates the page exactly as clicking the link
       in a task does. */
    const ghostKind = {c: "context", p: "person", o: "org", z: "zettel"};
    const addGhost = (space, ref) => {
      const k = keyOf(space, "\u0000ghost\u0000" + ref.toLowerCase());
      let i = index.get(k);
      if (i == null) {
        const pfx = (/^([^/]+)\//.exec(ref) || [])[1];
        const known = ghostKind[pfx] || (pfx && STATUS_DIRS[pfx] ? "project" : null);
        const bare = known ? ref.slice(pfx.length + 1) : ref;
        i = nodes.length;
        index.set(k, i);
        nodes.push({key: k, space, ref, ghost: true, kind: known || "page",
                    label: pfx === "c" ? "@" + bare : bare, deg: 0});
      }
      return i;
    };
    const names = visibleSpaces().filter(n => LOADED.has(n));
    for (const name of (names.length ? names : [null])) {
      inSpace(name, () => {
        const space = name;
        const pairs = new Set();
        for (const [path, page] of V.pages) {
          if (skip(pageKind(path))) continue;
          const from = add(space, path);
          walkBlocks(page.blocks, b => {
            if (isMessage(b)) return;
            const text = [b.title, ...(b.body || [])].join("\n");
            for (const raw of linksIn(text)) {
              const target = raw.split("][")[0];
              if (/^go\//.test(target)) continue;            // tour doors are not pages
              const tp = findExistingPage(target);
              if (tp && (tp === path || skip(pageKind(tp)))) continue;
              if (!tp && /^\d{4}-\d{2}-\d{2}$/.test(target)) continue;   // a day nobody wrote in
              const to = tp ? add(space, tp) : addGhost(space, target);
              const pk = from < to ? from + ":" + to : to + ":" + from;
              if (pairs.has(pk)) continue;
              pairs.add(pk);
              edges.push([from, to]);
              nodes[from].deg++; nodes[to].deg++;
            }
          });
        }
      });
    }

    /* Past a couple of hundred dots the picture stops being readable and starts
       being wallpaper, so keep the best-connected ones and say how many were
       left out rather than drawing a grey cloud. */
    let dropped = 0;
    let out = {nodes, edges, dropped};
    if (nodes.length > CFG.graphNodes) {
      const keep = nodes.slice()
        .sort((a, b) => b.deg - a.deg || a.label.localeCompare(b.label))
        .slice(0, CFG.graphNodes);
      const kept = new Map();
      keep.forEach((nd, i) => kept.set(nodes.indexOf(nd), i));
      dropped = nodes.length - keep.length;
      out = {
        nodes: keep,
        edges: edges.filter(([a, b]) => kept.has(a) && kept.has(b))
                    .map(([a, b]) => [kept.get(a), kept.get(b)]),
        dropped,
      };
    }
    /* Labels: at 200 dots, naming them all is a wall of text with a graph
       somewhere behind it. Name the hubs, and the one under the cursor. */
    const ranked = out.nodes.slice().sort((a, b) => b.deg - a.deg);
    ranked.slice(0, 14).forEach(nd => { if (nd.deg > 0) nd.hub = true; });
    return out;
  });
}

/* ---------- the mindmap's own graph ----------
   The map is about pages, so pages are all it draws. The mindmap is about
   getting somewhere, and the place you are usually getting to is a task: a
   project whose actions are invisible is a dot with a name on it, which is
   exactly the complaint. So the mindmap takes the page graph and hangs the
   tasks off it -- a page's tasks below the page, a task's sub-tasks below the
   task, and a task that names a project below that project too, wherever it
   happens to be written -- which makes "zoom in to a project" the same gesture
   as every other move on this screen.

   Done and cancelled tasks are drawn too, faintly: a project you are reviewing
   is partly a record of what you already did, and a branch that empties as you
   finish it reads as the work vanishing rather than as progress. */
function plexGraph() {
  return memo("plexGraph", () => {
    const base = graphData();
    // Copies, because degree is counted again here and the map must not see it.
    const nodes = base.nodes.map(n => Object.assign({}, n));
    const edges = base.edges.slice();
    const index = new Map();
    nodes.forEach((n, i) => index.set(n.key, i));

    const names = visibleSpaces().filter(n => LOADED.has(n));
    for (const name of (names.length ? names : [null])) {
      inSpace(name, () => {
        const space = name;
        /* A task written in today's journal under "[[1/kitchen]]" is a step of
           the kitchen project, and centring the project and seeing a bare dot
           is the complaint this answers. So a task also hangs off the project
           it names -- its own line, or the nearest bullet above it that names
