const GROUPS = ["LATE", "TODAY", "PROJECT", "LINKED", "WAITING", "CHECKLIST", "JOURNAL"];
const GROUP_META = {
  LATE   : {label: "Overdue",         cls: "late"},
  TODAY  : {label: "Due today",       cls: "today"},
  PROJECT: {label: "Project actions", cls: "proj"},
  LINKED  : {label: "Journal, linked to a project", cls: "ctx"},
  WAITING: {label: "Waiting for",     cls: "wait"},
  CHECKLIST: {label: "Checklist run",  cls: "proj"},
  JOURNAL: {label: "Loose journal actions", cls: ""},
};

/* The block itself, or its nearest ancestor, linking to a project page: [[1/Fix sink]] */
function nearestProjectAncestor(block) {
  let p = block;
  while (p) {
    const m = /\[\[([_0123])\/([^\]]+)\]\]/.exec(p.title || "");
    if (m) return {statusDir: m[1], title: trim(m[2]), ref: m[1] + "/" + trim(m[2])};
    p = p._parent;
  }
  return null;
}

/* The checklist a line came from. Running a list into a day drops its steps
   under one parent carrying [[8/<list>]], so the ancestor walk finds it from any
   step. A copy of a list is not loose thinking somebody failed to file: it was
   filed once, in the list, and it gets ticked off and forgotten. So these count
   as actions you can do, but never as journal actions to refile -- only applying
   a list to a project makes its steps project actions. */
function nearestChecklistAncestor(block) {
  let p = block;
  while (p) {
    const m = /\[\[8\/([^\]]+)\]\]/.exec(p.title || "");
    if (m) return {title: trim(m[1]), ref: "8/" + trim(m[1])};
    p = p._parent;
  }
  return null;
}

/* Journal lines that name a project. The line lives in somebody's day page,
   but the project is what it belongs to -- so a project started by writing
   [[1/Userflow]] in a task reads as having that task, rather than looking
   empty. Indexed under both the link's own ref and its bare title, which is how
   nearestProjectAncestor finds them written. */
function journalActionsIndex() {
  return memo("journalActionsIndex", () => {
    const by = new Map();
    const add = (key, row) => {
      if (!key) return;
      const list = by.get(key) || [];
      if (!list.includes(row)) list.push(row);
      by.set(key, list);
    };
    for (const path of recentJournals()) {
      const page = getPage(path); if (!page) continue;
      for (const b of flattenBlocks(page.blocks)) {
        if (!b.state || hasOpenDescendant(b)) continue;
        const link = nearestProjectAncestor(b); if (!link) continue;
        const row = {path, block: b, state: b.state, title: b.title,
                     context: contextOf(b.title), due: dueDate(b),
                     age: blockAge(b) ?? dateDiffDays(baseName(path), todayISO()),
                     added: addedDate(b) || baseName(path),
                     assignee: assigneeOf(b), by: blockProp(b, "by"),
                     owner: journalOwnerOf(path) || null,
                     missingVerb: !startsWithVerb(b.title),
                     missingContext: !hasContextLink(b.title)};
        add(link.ref.toLowerCase(), row);
        add(link.title.toLowerCase(), row);
      }
    }
    return by;
  });
}

function journalActionsFor(projectPath) {
  const by = journalActionsIndex();
  const out = [];
  for (const key of [pageRef(projectPath), baseName(projectPath), pageTitle(projectPath)]) {
    for (const row of by.get(String(key || "").toLowerCase()) || []) {
      if (!out.includes(row)) out.push(row);
    }
  }
  return out;
}

/* Open leaf actions: an open item with no open children is the actionable one.
   With several spaces shown, this runs once per space and tags each result. */
function leafActions() { return memo("leafActions", () => acrossSpaces(leafActionsHere)); }

function leafActionsHere() {
  const out = [];
  const paths = [...projectsIn("1"), ...projectsIn("3"), ...recentJournals()];
  for (const path of paths) {
    const page = getPage(path); if (!page) continue;
    const journal = isJournalPath(path);
    const flat = flattenBlocks(page.blocks);
    for (const b of flat) {
      if (!OPEN_STATES[b.state] || hasOpenDescendant(b)) continue;
      const linked = journal ? nearestProjectAncestor(b) : null;
      const fromList = journal && !linked ? nearestChecklistAncestor(b) : null;
      let group = "JOURNAL", project = null, projectStatusDir = null, projectPath = null;
      if (!journal) {
        group = b.state === "WAIT" ? "WAITING" : "PROJECT";
        project = pageTitle(path);
        projectStatusDir = statusDirOf(path);
        projectPath = path;
      } else if (linked) {
        group = b.state === "WAIT" ? "WAITING" : "LINKED";
        project = linked.title;
        projectStatusDir = linked.statusDir;
        projectPath = findExistingPage(linked.ref);
      } else if (fromList) {
        group = b.state === "WAIT" ? "WAITING" : "CHECKLIST";
      } else if (b.state === "WAIT") {
        group = "WAITING";
      }
      // Handed to somebody else: the same row, seen from your side. No copy is
      // made, so ticking it off once is enough for both of you.
      const assignee = assigneeOf(b);
      const mine = assignedToMe(b);
      if (!mine) group = "WAITING";

      const due = dueDate(b);
      if (due) {
        if (due < todayISO()) group = "LATE";
        else if (due === todayISO()) group = "TODAY";
      }
      /* A step of the tour is a door, not a next action: telling somebody on
         their first morning that "Find everything you have open" lacks a
         context is the method talking to itself. */
      const tourStep = !!tourDestOf(b.title);
      /* The same applies to the wording nudges: a step was phrased once, in the
         list, and asking for a verb again on every run is the method talking to
         itself. Fix the list, not the copy. */
      const authored = tourStep || !!fromList;
      out.push({
        path, block: b, state: b.state, title: b.title,
        project, projectPath, projectStatusDir, group, due,
        assignee, mine, owner: journalOwnerOf(path) || null,
        tourStep, checklist: fromList ? fromList.title : null,
        context: contextOf(b.title),
        missingContext: !authored && !hasContextLink(b.title),
        missingVerb: !authored && !startsWithVerb(b.title),
        // Journal items carry no Added:: stamp (the filename is the date),
        // so fall back to the journal's own date to keep "oldest first" honest.
        by: blockProp(b, "by"), doneBy: blockProp(b, "done_by"),
        added: addedDate(b) || (journal ? baseName(path) : null),
        age: blockAge(b) ?? (journal ? dateDiffDays(baseName(path), todayISO()) : null),
      });
    }
  }
  return out;
}

/* Active projects with nothing actionable left -- the classic GTD trap. */
function stuckActiveProjects() {
  const linkedFromJournal = new Set();
  for (const a of leafActions()) {
    if (a.group === "LINKED" && a.project) linkedFromJournal.add(a.project.toLowerCase());
  }
  const stuck = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const flat = flattenBlocks(page.blocks);
    let leafTodo = false, waiting = false, parentTodos = false;
    for (const b of flat) {
      if (b.state === "TODO" || b.state === "DOING") {
        if (hasOpenDescendant(b)) parentTodos = true; else leafTodo = true;
      } else if (b.state === "WAIT" && !hasOpenDescendant(b)) waiting = true;
    }
    const fromJournal = linkedFromJournal.has(pageTitle(path).toLowerCase())
                     || linkedFromJournal.has(baseName(path).toLowerCase());
    if (!leafTodo && !waiting && !fromJournal) {
      stuck.push({path, reason: parentTodos ? "Has parent TODOs but no actionable task" : "No next action"});
    }
  }
  return stuck;
}

/* Stalest active projects. Missing context beats missing verb beats plain age. */
function stalestActiveProjects(n = CFG.weedCount) {
  const rows = [];
  for (const path of projectsIn("1")) {
    const page = getPage(path);
    const todos = [];
    let noContext = false, noVerb = false, anyTodo = false;
    for (const b of flattenBlocks(page.blocks)) {
      if (!OPEN_STATES[b.state]) continue;
      anyTodo = true;
      const ctx = contextOf(b.title);
      const missingVerb = !startsWithVerb(b.title);
      if (!ctx) noContext = true;
      if (missingVerb) noVerb = true;
      todos.push({path, block: b, state: b.state, title: b.title,
                  context: ctx, missingContext: !ctx, missingVerb});
    }
    const createdDate = dateIn(page.props?.created);
    const reviewedDate = dateIn(page.props?.reviewed);
    const ageDays = createdDate ? dateDiffDays(createdDate, todayISO()) : null;
    const idleDays = reviewedDate ? dateDiffDays(reviewedDate, todayISO())
                   : (ageDays ?? 3650);
    let bias = 0;
    if (!anyTodo)  bias += 1500;
    if (noContext) bias += 1000;
    if (noVerb)    bias += 500;
    rows.push({path, title: pageTitle(path), todos, anyTodo, noContext, noVerb,
               ageDays, createdDate, reviewedDate, idleDays, score: bias + (idleDays || 0)});
  }
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, n);
}

/* The heart of the nudge loop: 3 oldest open actions in the chosen context. */
function oldestTodosForContext(context, n = CFG.surfaceCount) {
  const matches = leafActions().filter(a => {
    if (a.context !== context) return false;
    if (!OPEN_STATES[a.state]) return false;
    // standalone, or under an active / waiting project -- never 0, 2 or _
    return a.projectStatusDir == null || a.projectStatusDir === "1" || a.projectStatusDir === "3";
  });
  matches.sort((x, y) => (x.added || "9999-99-99").localeCompare(y.added || "9999-99-99"));
  return matches.slice(0, n);
}

function contextList() {
  const set = new Set();
  for (const path of allPages(p => p.startsWith(DIRS.contexts + "/"))) {
    set.add(path.slice(DIRS.contexts.length + 1).replace(/\.md$/i, ""));
  }
  for (const a of leafActions()) if (a.context) set.add(a.context);
  return Array.from(set).sort();
}

function agendaScan(days = CFG.agendaDays) {
  const cutoff = shiftISO(todayISO(), days);
  const byDate = new Map();
  for (const a of leafActions()) {
    if (!a.due || a.due > cutoff) continue;
    if (!byDate.has(a.due)) byDate.set(a.due, []);
    byDate.get(a.due).push(a);
  }
  return Array.from(byDate.entries()).sort((x, y) => x[0].localeCompare(y[0]));
}

/* Port of: init.lua 70_HEALTH_CHECKS */
function healthScan() {
  const issues = [];
  for (const path of [...projectsIn("1"), ...projectsIn("2"), ...projectsIn("3")]) {
    const page = getPage(path);
    if (!page.props?.title) issues.push({path, type: "missing-title", text: "No title:: property"});
    if (statusDirOf(path) === "3" && !(page.props?.waiting_since || page.props?.["waiting-since"]))
      issues.push({path, type: "missing-waiting_since", text: "Waiting project without waiting_since"});
  }
  for (const [path, page] of V.pages) {
    if (pageKind(path) === "template") continue;
    const check = (text, blk) => {
      for (const target of linksIn(text)) {
        const t = target.split("][")[0];
        if (/^\d{4}-\d{2}-\d{2}$/.test(t)) continue;
        if (!LINK_PREFIXES.has((/^([^/]+)\//.exec(t) || [])[1])) continue;
        if (!findExistingPage(t)) issues.push({path, block: blk, type: "broken-link", text: "Broken link: [[" + t + "]]"});
      }
    };
    walkBlocks(page.blocks, b => { check(b.title, b); (b.body || []).forEach(l => check(l, b)); });
  }
  return issues;
}

/* Port of: init.lua 60_GRAPH_QUERIES */
function backlinksTo(path) {
  const ref = pageRef(path).toLowerCase();
  const name = baseName(path).toLowerCase();
  const hits = [];
  for (const [p, page] of V.pages) {
    if (p === path) continue;
    walkBlocks(page.blocks, b => {
      const text = [b.title, ...(b.body || [])].join("\n");
      for (const target of linksIn(text)) {
        const t = target.split("][")[0].toLowerCase().replace(/\.md$/, "");
        if (t === ref || t === name) { hits.push({path: p, block: b}); return; }
      }
    });
  }
  return hits;
}

/* Port of: init.lua find_duplicate_projects */
function duplicateProjects() {
  const bySlug = new Map();
  for (const path of allPages(p => statusDirOf(p) && !isHorizonPage(p))) {
    const slug = baseName(path).toLowerCase();
    if (!bySlug.has(slug)) bySlug.set(slug, []);
    bySlug.get(slug).push(path);
  }
  return Array.from(bySlug.entries())
    .filter(([, l]) => l.length > 1)
    .map(([slug, paths]) => ({slug, paths: paths.sort()}))
    .sort((a, b) => b.paths.length - a.paths.length || a.slug.localeCompare(b.slug));
}

function openTodoCount(path) {
  const page = getPage(path); if (!page) return 0;
  return flattenBlocks(page.blocks).filter(b => OPEN_STATES[b.state]).length;
}

/* ============================================================
   70_PAGE_MUTATIONS
   Port of: init.lua 65_PROJECT_STATUS_MOVE + 75_REFILE_AND_TELEPORT
   ============================================================ */
function rewriteLinksEverywhere(oldRef, newRef) {
  if (oldRef === newRef) return 0;
  let changed = 0;
  const re = new RegExp("\\[\\[" + oldRef.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\]\\]|\\]\\[)", "g");
  for (const [path, page] of V.pages) {
    let hit = false;
    const fix = s => { const n = s.replace(re, "[[" + newRef + "$1"); if (n !== s) hit = true; return n; };
    walkBlocks(page.blocks, b => {
      b.title = fix(b.title);
      b.body = (b.body || []).map(fix);
      for (const k of Object.keys(b.props || {})) b.props[k] = fix(b.props[k]);
    });
    for (const k of Object.keys(page.props || {})) page.props[k] = fix(page.props[k]);
    if (hit) { touch(path); changed++; }
  }
  return changed;
}

function moveFile(oldPath, newPath) {
  if (oldPath === newPath) return true;
  if (V.pages.has(newPath)) { notify("Target already exists: " + newPath, "error"); return false; }
  const page = getPage(oldPath);
  const oldRef = pageRef(oldPath), oldBase = baseName(oldPath);
  V.pages.delete(oldPath);
  V.dirty.delete(oldPath);
  V.removed.add(oldPath);
  putPage(newPath, page);
  const newRef = pageRef(newPath);
  let n = rewriteLinksEverywhere(oldRef, newRef);
  if (oldBase !== baseName(newPath) || oldRef !== oldBase) n += rewriteLinksEverywhere(oldBase, newRef);
  if (n) notify("Link update: " + n + " pages updated.");
  return true;
}

function setProjectStatus(path, code) {
  if (!STATUS_DIRS[code]) return;
  const page = getPage(path);
  page.props.status = STATUS_TEXT[code];
  page.props.reviewed = todayStamp();
  if (code === "0") page.props.completed = todayStamp();
  if (code === "-") page.props.cancelled = todayStamp();
  if (code === "3") page.props.waiting_since = todayStamp();
  const newPath = join(STATUS_DIRS[code], baseName(path) + ".md");
  touch(path);
  if (newPath !== path && moveFile(path, newPath)) {
    notify("Moved to " + STATUS_TEXT[code]);
    if (state.view === "page" && state.pagePath === path) state.pagePath = newPath;
  } else {
    notify("Status: " + STATUS_TEXT[code]);
  }
  render();
}

function projectTemplateLines(title, code = "1") {
  const st = code === "3" ? "WAIT" : code === "0" ? "DONE" : code === "-" ? "CANCELLED" : "TODO";
  void st;
  const tpl = resolveTemplate({kind: code});
  if (tpl) {
    return instantiateTemplate(tpl.path, {
      title, status: STATUS_TEXT[code], created: todayStamp(), reviewed: todayStamp(), state: st,
    });
  }
  const props = {title, status: STATUS_TEXT[code], created: todayStamp(), reviewed: todayStamp()};
  if (code === "3") { props.waiting_for = ""; props.waiting_since = todayStamp(); }
  if (code === "0") props.completed = todayStamp();
  if (code === "-") props.cancelled = todayStamp();
  return {props, blocks: []};
}

function createProjectPage(title, blocks) {
  const clean = slugify(title);
  const path = join(DIRS.active, clean + ".md");
  if (V.pages.has(path)) return path;
  const page = projectTemplateLines(clean, "1");
  if (blocks && blocks.length) page.blocks = blocks;
  putPage(path, page);
  return path;
}

function zettelTemplate(title) {
  return {
    props: {title, created: todayStamp()},
    blocks: [
      newBlock({title}),
      newBlock({title: "Relates to"}),
      newBlock({title: "Contradicts"}),
      newBlock({title: "Informs"}),
    ],
  };
}
function createZettel(title) {
  const clean = slugify(title);
  const path = join(DIRS.zettel, clean + ".md");
  if (!V.pages.has(path)) putPage(path, zettelTemplate(clean));
  return path;
}

    blurb: "Goals down to next actions. No purpose and no vision, because something " +
           "this size borrows them from the life it sits in.",
    active: HORIZON_KEYS.filter(k => k !== "purpose" && k !== "vision"),
    chips: "life",
  },
};
const DEFAULT_HORIZON_PROFILE = "life";

/* Falls back to the full ladder rather than to nothing, so a hand-edited or
   half-synced GTD.md can never leave somebody looking at an empty Horizons. */
function horizonProfile() {
  return HORIZON_PROFILES[trim(getSetting("horizon_profile") || "")]
      || HORIZON_PROFILES[DEFAULT_HORIZON_PROFILE];
}
const activeHorizons = () => {
  const on = horizonProfile().active;
  return HORIZONS.filter(h => on.includes(h.key));
};
const horizonActive = key => horizonProfile().active.includes(key);

/* The one accessor every surface asks for a horizon's wording: the base row with
   this space's profile laid over it, `wiz` merged rather than replaced so an
   override only has to say the parts that differ. */
function horizonMeta(key) {
  const base = HORIZON_BY_KEY[key];
  if (!base) return null;
  const over = base.by?.[horizonProfile().key];
  if (!over) return base;
  return Object.assign({}, base, over, {wiz: Object.assign({}, base.wiz, over.wiz)});
}

const horizonPath = key => join(DIR_HORIZONS, (HORIZON_BY_KEY[key]?.page || key) + ".md");
const isHorizonPage = path =>
  path.startsWith(DIR_HORIZONS + "/") && trim(getPage(path)?.props?.type || "") === "horizon";

function horizonPage(key, create) {
  const path = horizonPath(key);
  if (!V.pages.has(path) && create) {
    const h = HORIZON_BY_KEY[key];
    putPage(path, {
      props: {title: h?.page || key, type: "horizon", horizon: h?.level || "",
              created: todayStamp()},
      blocks: [],
    });
  }
  return V.pages.has(path) ? getPage(path) : null;
}

function getHorizon(key) {
  const page = horizonPage(key, false);
  if (!page) return [];
  return (page.blocks || []).map(b => b.title).filter(t => trim(t));
}

function setHorizon(key, lines) {
  const page = horizonPage(key, true);
  page.blocks = lines.filter(l => trim(l)).map(l => newBlock({title: trim(l)}));
  touch(horizonPath(key));
}

/* An older vault kept purpose and vision as sections of one page. Split them. */
function migrateHorizons() {
  for (const legacy of HORIZONS_LEGACY) {
    if (!V.pages.has(legacy)) continue;
    const page = getPage(legacy);
    const headings = {purpose: "Purpose & principles", vision: "Vision (3-5 years)"};
    for (const [key, head] of Object.entries(headings)) {
      const blk = (page.blocks || []).find(b => trim(b.title) === head);
      const lines = blk ? (blk.children || []).map(c => c.title).filter(t => trim(t)) : [];
      if (lines.length && !getHorizon(key).length) setHorizon(key, lines);
    }
    removePage(legacy);
  }
}

/* ---------- H3 goals ---------- */
function goalTemplate(title) {
  return {
    props: {title, type: "goal", horizon: "3", created: todayStamp()},
    blocks: [newBlock({title: "What has to be true for this to count as achieved?"})],
  };
}
function createGoal(title, area) {
  const clean = slugify(title);
  const path = join(DIRS.goals, clean + ".md");
  if (!V.pages.has(path)) putPage(path, goalTemplate(clean));
  if (area) { getPage(path).props.area = "[[a/" + area + "]]"; touch(path); }
  return path;
}
const goalList = () => allPages(p => pageKind(p) === "goal");

function areaOfGoal(path) {
  const m = /\[\[a\/([^\]]+)\]\]/.exec(getPage(path)?.props?.area || "");
  return m ? trim(m[1]) : null;
}
function setAreaOfGoal(path, area) {
  const page = getPage(path); if (!page) return;
  if (area) page.props.area = "[[a/" + area + "]]"; else delete page.props.area;
  touch(path);
}
function goalOfProject(path) {
  const m = /\[\[g\/([^\]]+)\]\]/.exec(getPage(path)?.props?.goal || "");
  return m ? trim(m[1]) : null;
}
function setGoalOfProject(path, goal) {
  const page = getPage(path); if (!page) return;
  if (goal) page.props.goal = "[[g/" + goal + "]]"; else delete page.props.goal;
  touch(path);
}
const projectsForGoal = goal =>
  allPages(p => statusDirOf(p) && !isHorizonPage(p)).filter(p => goalOfProject(p) === goal);

/* Goals nobody is actually working on: the classic H3 failure. */
const goalsWithoutProjects = () =>
  goalList().filter(g => !projectsForGoal(baseName(g)).some(p => ["1", "3"].includes(statusDirOf(p))));

/* ============================================================
   74_PROJECT_OUTCOME
   "What would done look like?" A project named Website is a noun nobody
   can finish. A project named Website live and taking bookings is a
   finish line. Stored as outcome:: so it stays greppable markdown.
   ============================================================ */
const OUTCOME_PLACEHOLDER = /what does done look like|what has to be true/i;

function outcomeOf(path) {
  const page = getPage(path); if (!page) return null;
  const prop = trim(page.props?.outcome || "");
  if (prop && !OUTCOME_PLACEHOLDER.test(prop)) return prop;
  // older pages wrote it as a leading "Outcome: ..." block
  for (const b of page.blocks || []) {
    const m = /^outcome:\s*(.+)$/i.exec(trim(b.title));
    if (m && !OUTCOME_PLACEHOLDER.test(m[1])) return trim(m[1]);
  }
  return null;
}
function setOutcome(path, text) {
  const page = getPage(path); if (!page) return;
  page.props.outcome = trim(text);
  // drop a stale placeholder block so the page does not say it twice
  page.blocks = (page.blocks || []).filter(b => !(/^outcome:/i.test(trim(b.title)) && OUTCOME_PLACEHOLDER.test(b.title)));
  touch(path);
}
/* Active and waiting projects with no finish line stated. */
const projectsWithoutOutcome = () =>
  allPages(p => ["1", "3"].includes(statusDirOf(p))).filter(p => !outcomeOf(p));

/* ---------- what the question is about ----------
   This dialog used to ask what done looks like without saying what for. Asked
   out of the weekly review it arrives on its own, with nothing on screen to
   say which project it means, and you cannot state an outcome for a project
   you cannot name.

   So it names it. And when the page is empty, naming it is not enough either:
   a project that is nothing but a title exists because somebody wrote
   [[1/Something]] in a line somewhere, and that line is the only record of
   what they meant. So the empty case shows where it came from - the area it
   sits under, and the lines that started it, in full. */
function projectProvenance(path) {
  const page = getPage(path);
  const open = openTodoCount(path);
  const body = (page ? flattenBlocks(page.blocks) : [])
    .filter(b => trim(b.title) && !isMessage(b)).length;
  const area = areaOfProject(path);
  const box = el("div", {class: "prov"});
  box.append(el("div", {class: "provhead"},
    el("span", {class: "chip"}, STATUS_TEXT[statusDirOf(path)] ?
      trim(String(STATUS_TEXT[statusDirOf(path)]).replace(/^[-0-9]\s*=\s*/, "")) : "project"),
    el("b", {}, pageTitle(path)),
    area ? el("span", {class: "chip"}, area) : null));

  if (body) {
    box.append(el("div", {class: "provnote"},
      open + " open step" + (open === 1 ? "" : "s") + " on this page."));
    return box;
  }

  /* Nothing on the page, so the question has to be answered from whatever
     started it. */
  const from = backlinksTo(path).slice(0, 5);
  if (!from.length) {
    box.append(el("div", {class: "provnote"},
      "Nothing on this page yet, and nothing links to it. The name is all there is " +
      "to go on."));
    return box;
  }
  box.append(el("div", {class: "provnote"}, "Nothing on this page yet. It was started here:"));
  const list = el("div", {class: "provlist"});
  for (const h of from) {
    const row = el("button", {class: "provrow", title: "Open " + h.path,
      onclick: () => { closeModal(); openPage(h.path); }},
      el("span", {class: "nm"}, linkWords(h.block.title) || "(a line with no words)"),
      el("span", {class: "p"}, pageTitle(h.path)));
    list.append(row);
  }
  box.append(list);
  return box;
}

function openOutcomePrompt(path, then) {
  promptInput({
    title: "What does done look like?",
    hint: pageTitle(path),
    note: projectProvenance(path),
    label: 'Write it as if it already happened - "Sink repaired, no drip"',
    value: outcomeOf(path) || "",
    cta: "Save outcome",
    onSave: text => { setOutcome(path, text); render(); if (then) then(); },
  });
}

/* ============================================================
   74b_PROJECT_CHAINS -- "this one cannot start until that one is finished"
   A plan is rarely a flat list of projects. The survey comes before the
   drawings, the drawings before the quote, the quote before the work. Until
   now that order lived in somebody's head, so a project could sit at the top
   of Active looking perfectly startable while the thing it actually waits on
   had not been touched.

   Stored as depends_on:: on the page, as ordinary wiki links -- the same shape
   outcome:: and area:: already use -- so the order is greppable markdown and
   survives the app. The links go through findExistingPage, which falls back to
   the slug across every status directory, so moving a prerequisite from 1/ to
   0/ does not break the chain.
   ============================================================ */
const DEPENDS_PROP = "depends_on";

/* The prerequisites of one project, as paths. Links that no longer resolve are
   dropped rather than reported: a page somebody deleted is not a blocker. */
function dependsOn(path) {
  const page = getPage(path); if (!page) return [];
  const raw = trim(page.props?.[DEPENDS_PROP] || "");
  if (!raw) return [];
  const out = [];
  for (const target of linksIn(raw)) {
    const p = findExistingPage(trim(target.split("][")[0]));
    if (p && p !== path && !out.includes(p)) out.push(p);
  }
  return out;
}

function writeDependsOn(path, paths) {
  const page = getPage(path); if (!page) return;
  const links = paths.map(p => "[[" + pageRef(p) + "]]");
  if (links.length) page.props[DEPENDS_PROP] = links.join(", ");
  else for (const k of Object.keys(page.props)) if (k.toLowerCase() === DEPENDS_PROP) delete page.props[k];
  touch(path);
}

/* Everything that waits on this project. Only within the space: a chain that
   crossed spaces would be a chain you cannot see both ends of. */
const dependentsOf = path => memo("dependents:" + path, () =>
  allPages(p => statusDirOf(p) && dependsOn(p).includes(path)));

/* A -> B -> A would make "when can this start" unanswerable, and the honest
   place to refuse it is the moment somebody draws the second arrow. */
function wouldCycle(path, candidate) {
  if (candidate === path) return true;
  const seen = new Set();
  const walk = p => {
    if (p === path) return true;
    if (seen.has(p)) return false;
    seen.add(p);
    return dependsOn(p).some(walk);
  };
  return walk(candidate);
}

/* A prerequisite is cleared when it has no open task left, or when it has been
   filed as completed or cancelled. 2/ -- someday -- is NOT cleared: a project
   waiting on something nobody intends to start is exactly what you want told. */
function projectCleared(path) {
  const code = statusDirOf(path);
  if (code === "0" || code === "-") return true;
  const page = getPage(path);
  if (!page) return true;
  return !flattenBlocks(page.blocks).some(b => OPEN_STATES[b.state] && !isMessage(b));
}

/* The prerequisites of this project that are not finished yet. */
const blockersOf = path => dependsOn(path).filter(p => !projectCleared(p));

/* The day this project is free to start: the day after its last prerequisite
   ends. Null when nothing comes first. Uses the same span the timeline draws,
   so the number on the page and the bar on the chart cannot disagree. */
function earliestStart(path) {
  let latest = null;
  for (const p of dependsOn(path)) {
    const end = projectEnd(p);
    if (end && (!latest || end > latest)) latest = end;
  }
  return latest ? shiftISO(latest, 1) : null;
}

/* ---------- the picker ---------- */
function openDependsPicker(path) {
  const current = dependsOn(path);
  const choices = allPages(p => statusDirOf(p) && p !== path && !isHorizonPage(p))
    .filter(p => current.includes(p) || !wouldCycle(path, p))
    .sort((a, b) => (statusDirOf(a) + pageTitle(a)).localeCompare(statusDirOf(b) + pageTitle(b)));

  const pick = new Set(current);
  const card = el("div", {style: "max-height:46vh;overflow:auto"});
  const summary = el("div", {style: "color:var(--fg3);font-size:12.5px;margin-top:8px"});

  const refresh = () => {
    summary.textContent = pick.size
      ? pageTitle(path) + " starts after " + Array.from(pick).map(pageTitle).join(", ")
      : "Nothing comes first - this project can start whenever you like.";
  };

  if (!choices.length) card.append(el("div", {class: "empty"},
    "No other project could come first. Make one and it will show up here."));
  for (const p of choices) {
    const on = () => pick.has(p);
    const box = el("button", {class: "spacetoggle" + (on() ? " on" : ""), onclick: () => {
      if (on()) pick.delete(p); else pick.add(p);
      box.className = "spacetoggle" + (on() ? " on" : "");
      box.textContent = on() ? "✓" : "";
      refresh();
    }}, on() ? "✓" : "");
    card.append(el("div", {style: "display:flex;gap:10px;align-items:center;margin:6px 0"},
      box,
      el("div", {style: "min-width:0;flex:1"},
        el("div", {}, pageTitle(p)),
        el("div", {style: "color:var(--fg3);font-size:12px"},
          STATUS_LABEL[statusDirOf(p)] +
          (projectCleared(p) ? " · finished" : " · still open") +
          (projectEnd(p) ? " · ends " + projectEnd(p) : "")))));
  }
  refresh();

  modal({
    center: true, title: "What has to finish first?",
    hint: pageTitle(path),
    body: el("div", {},
      el("div", {class: "field"},
        el("label", {}, "Prerequisites"),
        card, summary),
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg3);font-size:12.5px"},
          "Saved as depends_on:: on the page - one line of markdown, so the order " +
          "travels with the files. A project that would depend on itself, however long " +
          "the way round, is not offered."))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: () => {
        writeDependsOn(path, Array.from(pick));
        closeModal();
        const late = earliestStart(path);
        const start = projectStart(path);
        if (late && start && start < late)
          notify(pageTitle(path) + " now starts before what it waits on. Drag its bar on the " +
                 "Timeline, or let the chain push it.", "warn",
                 {label: "Push it", run: () => { pushProjectTo(path, late); render(); }});
        else notify(pick.size ? "Chain saved." : "Chain cleared.");
        render();
      }}, "Save chain"),
    ],
  });
}

/* ============================================================
   72_AREAS -- GTD horizon 2: the responsibilities that never finish.
   Projects finish; areas do not. A project with no area is a project
   nobody owns, which is exactly what the review should surface.
   ============================================================ */
function areaTemplate(title) {
  return {
    props: {title, type: "area", created: todayStamp()},
    blocks: [newBlock({title: "What does keeping this area healthy look like?"})],
  };
}
function createArea(title) {
  const clean = slugify(title);
  const path = join(DIRS.areas, clean + ".md");
  if (!V.pages.has(path)) putPage(path, areaTemplate(clean));
  return path;
}
const areaList = () => allPages(p => pageKind(p) === "area");

/* A project declares its area with  area:: [[a/Health]] */
function areaOfProject(path) {
  const m = /\[\[a\/([^\]]+)\]\]/.exec(getPage(path)?.props?.area || "");
  return m ? trim(m[1]) : null;
}
function setAreaOfProject(path, area) {
  const page = getPage(path); if (!page) return;
  if (area) page.props.area = "[[a/" + area + "]]";
  else delete page.props.area;
  touch(path);
}
function projectsInArea(area) {
  return allPages(p => statusDirOf(p) && !isHorizonPage(p)).filter(p => areaOfProject(p) === area);
}
const unassignedProjects = () =>
  allPages(p => ["1", "3"].includes(statusDirOf(p))).filter(p => !areaOfProject(p));

/* ============================================================
   73_CHECKLISTS -- the MS To Do half: a reusable list you run again
   and again (weekly shop, trip packing, release steps).
   ============================================================ */
function checklistTemplate(title, kind, cadence) {
  const props = {title, type: "checklist", created: todayStamp()};
  if (kind === "project") {
    props.kind = "project";
    props.outcome = "%name% complete";
  }
  /* cadence:: is what separates a routine from a plain checklist. It is a word,
     not a schedule -- nothing fires on a timer here, and a to-do app that nags
     you about a recurrence you set months ago is the thing people flee. */
  if (kind === "routine") props.cadence = cadence || "as needed";
  return {
    props,
    blocks: kind === "project"
      ? [newBlock({title: "First step for %name%"})]
      : [newBlock({title: "First step"})],
  };
}

/* A checklist marked kind:: project is a PROJECT TEMPLATE: running it spins up
   a whole new project with these steps as its actions. "Onboard new insurance
   customer" run twice gives two independent projects, each with the same
   choreography. %name% in a step or in the outcome is replaced by the name you
   give that run. */
const isProjectTemplate = path => trim(getPage(path)?.props?.kind || "") === "project";

function setChecklistKind(path, kind) {
  const page = getPage(path); if (!page) return;
  if (kind === "project") page.props.kind = "project"; else delete page.props.kind;
  touch(path);
}

function runChecklistAsProject(listPath, name, opts = {}) {
  const list = getPage(listPath); if (!list) return null;
  const vars = {name, project: name, date: todayISO()};
  const projectPath = createProjectPage(name);

  const outcomeTpl = trim(list.props?.outcome || "");
  const outcome = trim(opts.outcome || (outcomeTpl ? expandVars(outcomeTpl, vars) : ""));
  if (outcome) setOutcome(projectPath, outcome);

  const areaM = /\[\[a\/([^\]]+)\]\]/.exec(list.props?.area || "");
  if (areaM) setAreaOfProject(projectPath, trim(areaM[1]));
  const goalM = /\[\[g\/([^\]]+)\]\]/.exec(list.props?.goal || "");
  if (goalM) setGoalOfProject(projectPath, trim(goalM[1]));

  const page = getPage(projectPath);
  page.props.from = "[[8/" + baseName(listPath) + "]]";
  const ctx = opts.context || state.context;
  let n = 0;
  const copy = blocks => (blocks || []).map(b => {
    n++;
    const title = expandVars(b.title, vars);
    return stampAuthor(newBlock({
      state: "TODO",
      title: title + (ctx && !hasContextLink(title) ? " [[c/" + ctx + "]]" : ""),
      props: {Added: "[[" + todayISO() + "]]"},
      children: copy(b.children),
    }));
  });
  page.blocks.push(...copy(list.blocks));
  touch(projectPath);
  return {path: projectPath, steps: n};
}
function createChecklist(title, kind, cadence) {
  const clean = slugify(title);
  const path = join(DIRS.lists, clean + ".md");
  if (!V.pages.has(path)) putPage(path, checklistTemplate(clean, kind, cadence));
  return path;
}
const checklistPages = () => allPages(p => pageKind(p) === "checklist");
const isRoutine = path => !!trim(getPage(path)?.props?.cadence || "");
const cadenceOf = path => trim(getPage(path)?.props?.cadence || "");

/* Three things live in this folder and they are not the same thing:

     a project   finishes  -- "Move house", ticked off once and gone
     a routine   returns   -- "Weekly accounts", never finished, only due again
     a template  breeds    -- "Onboard customer", one new project per run

   Filing a routine as a project is the commonest way a GTD list goes bad: it
   sits in Active looking undone forever, and everything around it starts to
   feel undone too. So the words are asked for at the moment of naming, where
   changing your mind is free. */
const ROUTINE_WORDS = /\b(daily|weekly|fortnightly|monthly|quarterly|yearly|annual(?:ly)?|routine|recurring|upkeep|maintenance|housekeeping|habit|stand-?up|check-?ins?|every (?:day|week|month|morning|evening|monday|tuesday|wednesday|thursday|friday|saturday|sunday)|each (?:day|week|month|morning))\b/i;
function cadenceFrom(name) {
  const m = /\b(daily|weekly|fortnightly|monthly|quarterly|yearly|annual(?:ly)?)\b/i.exec(name || "");
  if (!m) return "as needed";
  return m[1].toLowerCase().replace(/^annually$/, "annual");
}

/* Copy a checklist's items into a target page as fresh open actions. */
function runChecklist(listPath, targetPath, context) {
  const list = getPage(listPath), target = getPage(targetPath);
  if (!list || !target) return 0;
  const ctx = context || state.context;
  let n = 0;
  const parent = newBlock({
    title: pageTitle(listPath) + " [[8/" + baseName(listPath) + "]]",
    props: {Added: "[[" + todayISO() + "]]"},
  });
  const copy = blocks => (blocks || []).map(b => {
    n++;
    return stampAuthor(newBlock({
      state: "TODO",
      title: b.title + (ctx && !hasContextLink(b.title) ? " [[c/" + ctx + "]]" : ""),
      props: {Added: "[[" + todayISO() + "]]"},
      children: copy(b.children),
    }));
  });
  parent.children = copy(list.blocks);
  target.blocks.push(parent);
  touch(targetPath);
  return n;
}

function pageTemplateFor(kind, title) {
  if (kind === "z") return zettelTemplate(title);
  if (kind === "a") return areaTemplate(title);
  if (kind === "g") return goalTemplate(title);
  if (kind === "k") return checklistTemplate(title);
  if (STATUS_DIRS[kind]) return projectTemplateLines(title, kind);
  const tpl = resolveTemplate({kind});
  if (tpl) return instantiateTemplate(tpl.path, {title, created: todayStamp(), kind});
  const props = {title, created: todayStamp()};
  if (["p", "c", "o"].includes(kind)) props.type = {p: "person", c: "context", o: "org"}[kind];
  return {props, blocks: [newBlock({title: ""})]};
}

/* Follow [[target]] -- creating the page if it does not exist yet. */
function followLink(target) {
  target = trim(target).split("][")[0];
  /* A go/ link goes somewhere in the app, so it never creates a page. */
  const door = /^go\/(.+)$/.exec(target);
  if (door) { goTour(trim(door[1])); return; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(target)) { openPage(ensureJournal(target)); return; }
  const existing = findExistingPage(target);
  if (existing) { openPage(existing); return; }
  const path = resolveWikiPath(target);
  const m = /^([^/]+)\/(.+)$/.exec(target);
  const kind = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[1] : "page";
  const title = m && (STATUS_DIRS[m[1]] || PREFIX_DIR[m[1]]) ? m[2] : target;
  putPage(path, pageTemplateFor(kind, title));
  notify("Created page: " + path);
  scanVerbs();
  openPage(path);
}

/* A link you type is a page you meant. Writing
   "Chase the quote [[1/Userflow]] [[p/Niclas]] [[c/computer]]" is how a
   project, a person and a context get started here, so the pages behind a line
   are made as the line is written -- rather than left as broken links for the
   health check to find weeks later. Dates and [[go/...]] doors are not pages,
   and anything already there is left exactly as it is. */
function createLinkedPages(text) {
  const made = [];
  for (const raw of linksIn(text)) {
    const target = trim(String(raw).split("][")[0]);
    if (!target || /^go\//i.test(target)) continue;
    if (/^\d{4}-\d{2}-\d{2}$/.test(target)) continue;
    const m = /^([^/]+)\/(.+)$/.exec(target);
    if (!m || !LINK_PREFIXES.has(m[1])) continue;   // a bare [[note]] is not filed anywhere
    if (findExistingPage(target)) continue;
    const path = resolveWikiPath(target);
    putPage(path, pageTemplateFor(m[1], trim(m[2])));
    made.push(path);
  }
  if (!made.length) return made;
  scanVerbs();
  const name = p => (statusDirOf(p) ? "project " : "") + pageTitle(p);
  notify(made.length === 1
    ? "Started " + name(made[0])
    : "Started " + made.length + " pages: " + made.map(pageTitle).join(", "));
  return made;
}

/* Port of: init.lua refile_current_task -- move a subtree to a project,
   leaving a DONE breadcrumb behind when it came from a journal. */
function refileBlock(fromPath, block, toPath) {
  const from = getPage(fromPath), to = getPage(toPath);
  if (!from || !to) return;
  removeBlockFrom(from, block);
  to.blocks.push(block);
  if (isJournalPath(fromPath)) {
    from.blocks.push(newBlock({
      state: "DONE",
      title: "Refiled: " + block.title + " -> [[" + pageRef(toPath) + "]]",
      props: {CLOSED: todayStamp()},
    }));
  }
  touch(fromPath); touch(toPath);
  notify("Refiled to " + pageTitle(toPath));
  render();
}

function addNextActionTo(path, text) {
  const page = getPage(path); if (!page) return null;
  const blk = stampAuthor(newBlock({state: "TODO", title: text, props: {Added: "[[" + todayISO() + "]]"}}));
  createLinkedPages(blk.title);
  page.blocks.push(blk);
  touch(path);
  return blk;
}

function updateReviewed(path) {
  const page = getPage(path); if (!page) return;
  page.props.reviewed = todayStamp();
  touch(path);
  notify("Reviewed date updated");
}

function mergePages(sourcePath, targetPath) {
  const src = getPage(sourcePath), tgt = getPage(targetPath);
  if (!src || !tgt) return;
  tgt.blocks.push(...src.blocks);
  touch(targetPath);
  removePage(sourcePath);
  notify("Merged " + baseName(sourcePath) + " into " + baseName(targetPath));
}
</script>
<script>
/* ============================================================
   75_SETTINGS -- kept in markdown too (pages/GTD.md)
   ============================================================ */
const SETTINGS_PATH = join(PAGES, "GTD.md");
function settingsPage() {
  if (!V.pages.has(SETTINGS_PATH)) {
    putPage(SETTINGS_PATH, {
      props: {title: "GTD", type: "settings", created: todayStamp(), started: todayISO()},
      blocks: [newBlock({title: "System settings for GroupTodo. Safe to edit by hand."})],
    });
  }
  return getPage(SETTINGS_PATH);
}
/* ============================================================
   76_IDENTITY
   A shared space means several people editing the same markdown. Changes
   therefore carry a name and a time, written into the files themselves so
   they survive sync, git and any editor -- not held in some private database.

   The name lives on this device (and can differ per space: your full name at
   work, something shorter at home). With no name set, nothing is stamped, so
   a vault you use alone stays clean.
   ============================================================ */
function whoAmI() {
  return trim(PREF.get("identity:" + (Spaces.active || ""), "") || PREF.get("identity", "") || "");
}
function setIdentity(name, space) {
  const clean = trim(name).slice(0, 60);
  const was = whoAmI();
  if (space) PREF.set("identity:" + space, clean);
  else PREF.set("identity", clean);
  if (!clean || !V.pages) return;
  if (was && !samePerson(was, clean)) renameIdentity(was, clean);
  migrateJournals();
  ensureMemberPage();
}

/* Changing your name has to take your things with it, or you end up listed
   twice in People, with yesterday's journal filed under somebody who no longer
   exists and tasks assigned to a name nobody answers to.

   by:: and done_by:: are deliberately left alone: they are a record of who did
   something at the time, not a pointer to a person. */
function renameIdentity(was, now) {
  const from = personPath(was), to = personPath(now);
  if (V.pages.has(from)) {
    const page = getPage(from);
    if (!V.pages.has(to)) {
      page.props = Object.assign({}, page.props, {title: now, member: "true"});
      putPage(to, page);
    }
    removePage(from);
  }

  // Journal days move wholesale: journals/<was>/2026-10-05.md -> <now>/...
  const oldDir = join(JOURNALS, slugPerson(was));
  const newDir = join(JOURNALS, slugPerson(now));
  let days = 0;
  for (const path of Array.from(V.pages.keys())) {
    if (!path.startsWith(oldDir + "/")) continue;
    const target = join(newDir, baseName(path) + ".md");
    if (!V.pages.has(target)) { putPage(target, getPage(path)); days++; }
    removePage(path);
  }

  // Live assignments must follow; history must not.
  let handed = 0;
  for (const [path, page] of V.pages) {
    let hit = false;
    walkBlocks(page.blocks, bl => {
      if (samePerson(assigneeOf(bl), was)) { setBlockProp(bl, ASSIGN_PROP, now); hit = true; handed++; }
    });
    if (hit) touch(path);
  }
  // The old identity's own read-marker is meaningless now.
  notify("You are " + now + " here now" +
    (days ? ", with " + days + " journal day(s)" : "") +
    (handed ? " and " + handed + " assigned task(s)" : "") + " moved across.");
  return {days, handed};
}

/* Stamp authorship on something the person just created. */
function stampAuthor(block) {
  const me = stampName();
  if (me && block && block.props && !block.props.by) block.props.by = me;
  return block;
}

/* ============================================================
   WHO IS IT FOR
   Every task belongs to somebody, and by default that is you. The interesting
   case is handing one over, and there are two quite different handovers:

     to someone in this space   they own it now. It stays a live task, in
                                their name, and because you wrote it the item
                                turns up in your Waiting for -- the same row,
                                seen from your side, not a copy.

     to anyone else             they cannot see it and cannot tick it off, so
                                calling it a task would be a lie. It becomes a
                                WAIT: something you are waiting on a person for.

   A "member" is simply a person page marked member:: true. Naming yourself
   creates yours; opening a space somebody shared shows theirs.
   ============================================================ */
const ASSIGN_PROP = "assigned";
const samePerson = (a, b) => !!a && !!b && slugPerson(a) === slugPerson(b);

const personPath = name => join(DIRS.people, trim(name).replace(/[\/]/g, "-") + ".md");
const personName = path => baseName(path);

function allPeople() {
  return allPages(p => p.startsWith(DIRS.people + "/")).sort((a, b) =>
    personName(a).localeCompare(personName(b)));
}
const isMemberPage = path => trim(String(getPage(path)?.props?.member || "")) === "true";
function members() { return memo("members", membersNow); }
function membersNow() {
  return allPeople().filter(isMemberPage).map(path => ({
    path, name: personName(path), me: samePerson(personName(path), whoAmI()),
  }));
}
const isMember = name =>
  !!name && members().some(m => samePerson(m.name, name));

/* Your own person page, so everybody else in the space can see you exist. */
function ensureMemberPage() {
  const me = whoAmI();
  if (!me) return null;
  const path = personPath(me);
  const page = V.pages.has(path) ? getPage(path) : {props: {title: me}, blocks: []};
  if (trim(String(page.props.member || "")) !== "true") {
    page.props.member = "true";
    putPage(path, page);
  }
  return path;
}

const assigneeOf = b => trim(blockProp(b, ASSIGN_PROP) || "");
/* Unassigned means mine: the common case should need no ceremony. */
const assignedToMe = b => { const a = assigneeOf(b); return !a || samePerson(a, whoAmI()); };

/* Returns "mine" | "member" | "outside". */
function assignKind(name) {
  if (!trim(name) || samePerson(name, whoAmI())) return "mine";
  return isMember(name) ? "member" : "outside";
}

function assignBlock(path, block, name) {
  const kind = assignKind(name);
  if (kind === "mine") {
    delete block.props[ASSIGN_PROP];
    for (const k of Object.keys(block.props)) if (/^assigned_at$/i.test(k)) delete block.props[k];
    if (block.state === "WAIT") block.state = "TODO";
  } else {
    setBlockProp(block, ASSIGN_PROP, trim(name));
    setBlockProp(block, "assigned_at", nowStamp());
    if (kind === "outside") {
      // Nobody here can act on it, so for this vault it is a waiting-for.
      if (OPEN_STATES[block.state]) block.state = "WAIT";
    } else if (block.state === "WAIT") {
      block.state = "TODO";                 // a member can actually do it
    }
  }
  if (!blockProp(block, "by")) stampAuthor(block);
  touch(path);
  render();
  notify(kind === "mine" ? "Back to you."
       : kind === "member" ? trim(name) + " has it. It is in your Waiting for."
       : "Waiting on " + trim(name) + ".");
}

const getSetting = k => settingsPage().props[k] || null;

/* The weekly review is only "due" once a week of actually using the thing has
   passed. Day one should not open with a red chip about a review you could not
   possibly have done yet. */
function reviewBaseline() {
  const last = dateIn(getSetting("last_review"));
  if (last) return last;
  return dateIn(getSetting("started")) || todayISO();
}
const daysSinceReview = () => dateDiffDays(reviewBaseline(), todayISO()) ?? 0;
const reviewDue = () => daysSinceReview() >= CFG.reviewEveryDays;
function setSetting(k, v) { settingsPage().props[k] = v; touch(SETTINGS_PATH); }

/* ============================================================
   80_NUDGE_ENGINE
   Every GTD nudge the Neovim config fired, as a always-visible strip.
   ============================================================ */
/* GTD's own vocabulary is the steepest thing here. In simple mode the nudges
   say what they mean, and the method-purist ones stay quiet until there is
   enough on the list for them to be about something. */
/* One rule, used by the nudge bar, the row chips and the context prompt: a
   newcomer with a handful of tasks is not told off about method. */
/* Several of the whole-vault questions -- what is open, who is here, where the
   conversations are -- get asked many times in one render: navVisible alone
   asks three of them per item. Each is cheap on a small vault and 20ms on a
   big one, which is how a sidebar ends up costing 150ms to draw. They are
   answered once per render instead, and the memo is dropped whenever anything
   is touched so nothing can read a stale answer. */
const MEMO = new Map();
const memo = (key, fn) => {
  if (!MEMO.has(key)) MEMO.set(key, fn());
  return MEMO.get(key);
};
const clearMemo = () => MEMO.clear();

let QUIET_CACHE = null;
/* Weeding ranks the stalest of many projects. With a handful of each it has
   nothing to say, so it is never suggested -- though g w still opens it for
   anyone who wants to look. */
function weedingWorthIt() {
  const projects = projectsIn("1").length;
  if (projects < CFG.weedMinProjects) return false;
  return leafActions().filter(a => OPEN_STATES[a.state]).length >= CFG.weedMinTodos;
}

function gtdQuiet() {
  if (!isSimple()) return false;
  if (QUIET_CACHE === null) {
    // The tour's own steps do not count: eight of them would otherwise switch
    // the method nudges on before the newcomer has written a single task.
    QUIET_CACHE = leafActions().filter(a => OPEN_STATES[a.state] && !a.tourStep).length
                  < CFG.quietUntilTasks;
  }
  return QUIET_CACHE;
}

const NUDGE_PLAIN = {
  stuck  : "projects with nothing to do next",
  loose  : "tasks not attached to anything",
  verb   : "tasks that don't say what to actually do",
  ctx    : "tasks with no place to do them",
  outcome: "projects with no finish line",
  area   : "projects not under an area",
  goal   : "goals nobody is working on",
  wait   : "people to chase",
  ask    : "people to send a check-in to",
  late   : "overdue",
  stale  : "projects older than 6 months",
};
const DEEP_NUDGES = ["verb", "ctx", "area", "goal", "loose", "outcome"];

/* Why each one is here, in the person's own interest rather than the method's.
   Kept out of the way -- a chip says what is true, this says why anyone should
   care, and only when asked. Where the research is strong it is named; where it
   is folklore it is written as an opinion, because a nudge that oversells itself
   is just advertising. */
const NUDGE_WHY = {
  late:
    "A date you sail past teaches you to stop believing your own list, and a list you " +
    "do not believe stops getting opened. Moving the date on purpose keeps it honest; " +
    "letting it rot does not.",
  stuck:
    "A project with no next step is the one thing your head refuses to let go of, " +
    "because there is nothing to let go of it to. One concrete next action is what " +
    "makes it quiet.",
  loose:
    "A task with no home survives a day and rots over a month: nothing brings it back " +
    "to you at the moment it would have mattered.",
  verb:
    "\u201cSort out the insurance\u201d is a decision you have to make again every time you " +
    "read it. \u201cCall Storebrand\u201d is something your hands can start. This is the " +
    "best-evidenced habit in the whole system: people who write down the specific " +
    "action, and when and where they will do it, follow through markedly more often " +
    "than people who only intend to - psychologists call them implementation intentions.",
  ctx:
    "Most of what blocks a task is being in the wrong place, without the thing you " +
    "need in your hand. A context is what lets the list answer the only question you " +
    "ever really ask it: what can I actually do, here, now?",
  outcome:
    "Written as though it already happened - \u201cSink repaired, no drip\u201d - a project " +
    "gives you something you can recognise when you get there. Without it projects do " +
    "not finish, they only get older.",
  area:
    "A project under no part of your life is usually one you took on without ever " +
    "deciding to.",
  goal:
    "A goal nobody is working on is a wish. Give it a project or let it go - both are " +
    "honest; leaving it to sit there is the one option that costs you something.",
  wait:
    "Anything you handed to someone else is invisible by definition. Keeping the list " +
    "is what makes chasing it feel like admin rather than nagging.",
  stale:
    "Old projects do not sit there harmlessly. They make the whole list feel heavy, " +
    "and a heavy list gets avoided.",
  review:
    "The weekly look is what makes everything else trustworthy. Capture, contexts and " +
    "projects are bookkeeping if nobody ever reads them back.",
};

/* A nudge you have quietened. Deliberately per-nudge and time-boxed rather than a
   global off switch: "not now" is almost always what someone means, and a nudge that
   can never come back is a nudge that has to shout the first time. */
const nudgeQuietUntil = id => PREF.get("nudge.quiet." + id, "");
function nudgeQuiet(id) {
  const until = nudgeQuietUntil(id);
  return !!until && todayISO() < until;
}
function quietNudge(id, days) {
  PREF.set("nudge.quiet." + id, shiftISO(todayISO(), days == null ? CFG.nudgeSnoozeDays : days));
}
function unquietAllNudges() {
  for (const id of Object.keys(NUDGE_PLAIN).concat(["review"])) PREF.set("nudge.quiet." + id, "");
}
const anyNudgeQuiet = () =>
  Object.keys(NUDGE_PLAIN).concat(["review"]).some(id => nudgeQuiet(id));

function computeNudges() {
  const acts = leafActions();
  const n = [];
  // Below this, a newcomer is being told off about a list they have barely started.
  const quiet = gtdQuiet();
  const push = (id, level, label, count, act) => {
    if (count <= 0) return;
    if (quiet && DEEP_NUDGES.includes(id)) return;
    if (nudgeQuiet(id)) return;
    n.push({id, level, label: isSimple() ? (NUDGE_PLAIN[id] || label) : label, count, act});
  };

  const overdue = acts.filter(a => a.group === "LATE");
  push("late", "danger", "overdue", overdue.length, () => go("agenda"));

  const stuck = stuckActiveProjects();
  push("stuck", "danger", "projects with no next action", stuck.length, () => openReview(0));

  const loose = acts.filter(a => a.group === "JOURNAL");
  push("loose", "warn", "journal actions not tied to a project", loose.length, () => openReview(2));

  const noVerb = acts.filter(a => a.state === "TODO" && a.missingVerb);
  push("verb", "warn", "actions without a physical verb", noVerb.length, () => openReview(3));

  const noCtx = acts.filter(a => a.state === "TODO" && a.missingContext);
  push("ctx", "warn", "actions without a context", noCtx.length, () => openReview(4));

  const oldWait = acts.filter(a => a.state === "WAIT" && (a.age ?? 0) >= CFG.waitFollowUpDays);
  push("wait", "warn", "waiting items to chase", oldWait.length, () => go("next"));

  /* Chasing somebody who is not in the space has an answer now, so the nudge
     can point at the thing that actually moves it rather than at a list. */
  const toAsk = updatesWorthAsking();
  push("ask", "warn", "people outside the space to ask for an update", toAsk.length,
       () => toAsk.length === 1 ? openAskForUpdate(toAsk[0].name) : go("people"));

  const noOutcome = projectsWithoutOutcome();
  push("outcome", "warn", "projects with no stated outcome", noOutcome.length,
       () => noOutcome.length && openOutcomePrompt(noOutcome[0]));

  const orphanProjects = unassignedProjects();
  push("area", "", "projects in no area of focus", orphanProjects.length, () => go("horizons"));

  const idleGoals = goalsWithoutProjects();
  push("goal", "", "goals with no project", idleGoals.length, () => go("horizons"));

  const stale = weedingWorthIt()
    ? stalestActiveProjects(99).filter(p => (p.ageDays ?? 0) > CFG.staleProjectDays) : [];
  push("stale", "", "projects older than 6 months", stale.length, () => openWeeding());

  if (reviewDue() && !nudgeQuiet("review")) {
    const last = dateIn(getSetting("last_review"));
    const since = daysSinceReview();
    n.push({
      id: "review", level: since > CFG.reviewEveryDays * 2 ? "danger" : "warn",
      label: last ? `weekly review, ${since} days since last`
                  : `first weekly review is due - ${since} days in`,
      count: null, act: () => openReview(0),
    });
  }
  if (!n.length) n.push({id: "clean", level: "ok", label: "system is clean - go do the work", count: null, act: null});
  return n;
}

/* The single most useful thing to do right now. */
function nextBestAction() {
  const acts = leafActions();
  const pick = (title, body, cta, act) => ({title, body, cta, act});
  const overdue = acts.filter(a => a.group === "LATE");
  if (overdue.length) return pick("Overdue", `${overdue.length} action(s) are past their date. Renegotiate or do them.`, "Open agenda", () => go("agenda"));
  if (reviewDue())
    return pick("Weekly review is due", "The review is what makes the rest of the system trustworthy.",
                "Start review", () => openReview(0));
  if (!state.context) return pick("Where are you right now?", "Pick a context and GroupTodo surfaces the three oldest actions you can actually do here.", "Pick context", () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx)));
  const stuck = stuckActiveProjects();
  if (stuck.length) return pick("A project has stalled", `${stuck.length} active project(s) have no next action. Define one or park the project.`, "Unstick", () => openReview(0));
  const surf = oldestTodosForContext(state.context);
  if (surf.length) return pick("Oldest in " + state.context, surf[0].title, "Surface all three", () => surfaceContext(state.context));
  if (weedingWorthIt())
    return pick("Nothing is nagging", "Inbox to the journal, or weed the stalest projects.",
                "Weed projects", () => openWeeding());
  return pick("Nothing is nagging", "Nothing is overdue and nothing is stuck. Add what is on your mind, or stop.",
              "Capture something", () => openCapture());
}

/* ============================================================
   84_ASSETS -- the files you drag in
   A note is not always words. Drop a screenshot on a line, or paste one out of
   the clipboard, and the file is written into assets/ inside the very folder
   the markdown lives in -- where Logseq and Obsidian keep theirs -- and the
   line gets an ordinary markdown link to it. Nothing is uploaded anywhere, and
   the folder you share now carries the picture along with the task.
   ============================================================ */
const ASSET_DIR = "assets";
const ASSET_URLS = new Map();          // space|path -> object URL, for this page's life
const ASSET_IMAGE_RE = /\.(png|jpe?g|gif|webp|avif|bmp|svg|ico|heic)$/i;
const assetMax = () => (V.backend && V.backend.kind === "http" ? 8 : 20) * 1024 * 1024;
const isAssetPath = path => /^assets\//i.test(String(path || ""));
const canKeepFiles = () => !!(V.backend && typeof V.backend.putAsset === "function");

function assetStamp() {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  return "" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
         "-" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

/* The name the file gets in the folder: what it was called, tidied into
   something every filesystem accepts, and stamped so a second screenshot
   called "image.png" does not land on top of the first. */
function assetFileName(file) {
  const raw = String((file && file.name) || "");
  const dot = raw.lastIndexOf(".");
  const dotted = dot > 0 && /^\.[A-Za-z0-9]{1,8}$/.test(raw.slice(dot));
  const ext = dotted ? raw.slice(dot).toLowerCase()
    : "." + (String((file && file.type) || "").split("/")[1] || "bin").replace(/[^a-z0-9]/g, "").slice(0, 8);
  const stem = (dotted ? raw.slice(0, dot) : raw) || "pasted";
  const slug = stem.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) || "file";
  return slug + "-" + assetStamp() + ext;
}

async function saveAsset(file) {
  const be = V.backend;
  if (!be || typeof be.putAsset !== "function") throw new Error("this space has nowhere to keep files");
  let path = join(ASSET_DIR, assetFileName(file));
  // Two drops in the same second with the same name: keep both.
  if (await be.getAsset(path)) {
    const dot = path.lastIndexOf(".");
    path = path.slice(0, dot) + "-" + Math.random().toString(36).slice(2, 6) + path.slice(dot);
  }
  await be.putAsset(path, file);
  const key = (V.space || "") + "|" + path;
  const old = ASSET_URLS.get(key);
  if (old) { try { URL.revokeObjectURL(old); } catch (_) {} ASSET_URLS.delete(key); }
  return path;
}

/* What a dropped file becomes in the line: a picture shows itself, anything
   else is a link you can click. Plain markdown either way, so the note still
   reads in Notepad and in every other editor that opens the folder. */
const assetMarkdown = (file, path) =>
  ((ASSET_IMAGE_RE.test(path) || /^image\//.test((file && file.type) || "")) ? "!" : "") +
  "[" + String((file && file.name) || "file").replace(/[\[\]()]/g, "") + "](" + path + ")";

async function assetURL(path, space) {
  const key = (space || V.space || "") + "|" + path;
  if (ASSET_URLS.has(key)) return ASSET_URLS.get(key);
  const rec = space ? LOADED.get(space) : null;
  const be = space ? (rec && rec.backend) : V.backend;
  if (!be || typeof be.getAsset !== "function") return null;
  const blob = await be.getAsset(path);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  ASSET_URLS.set(key, url);
  return url;
}

/* A rendered line carries the path, not a URL: the file has to be read back out
   of the folder first, and that cannot happen while the HTML is still a string.
   One pass after every redraw fills them in. */
function resolveAssets(root) {
  for (const node of $$("[data-asset]", root || document)) {
    if (node.dataset.assetDone) continue;
    node.dataset.assetDone = "1";
    const path = node.dataset.asset;
    assetURL(path).then(url => {
      if (!url) {
        // The line says what is missing rather than showing a broken picture:
        // the file may simply not have synced to this machine yet.
        node.replaceWith(el("span", {class: "asset-missing", title: "Not in this folder: " + path},
                            "\u2298 " + path.split("/").pop()));
        return;
      }
      if (node.tagName === "IMG") node.src = url;
      else {
        node.href = url; node.target = "_blank"; node.rel = "noopener";
        node.download = path.split("/").pop();
      }
    }).catch(() => {});
  }
}

/* Saving the files, then putting them in the line -- at the caret when you are
   typing in it, at the end of the line when you dropped them on it. */
async function attachFilesToBlock(path, b, files, txt) {
  const list = Array.from(files || []).filter(f => f && (f.size || f.type));
  if (!list.length) return false;
  if (!canKeepFiles()) { notify("This space has nowhere to keep files.", "warn"); return true; }

  const marks = [];
  for (const f of list) {
    if (f.size > assetMax()) {
      notify("\u201C" + (f.name || "That file") + "\u201D is bigger than " +
             Math.round(assetMax() / 1024 / 1024) + " MB, so it stays where it is.", "warn");
      continue;
    }
    try { marks.push(assetMarkdown(f, await saveAsset(f))); }
    catch (e) { notify("Could not save " + (f.name || "that file") + ": " + (e.message || e), "warn"); }
  }
  if (!marks.length) return true;
  const addition = marks.join(" ");

  /* Written straight into the line rather than left on screen for the blur
     handler to pick up: a drop does not necessarily come with the caret in the
     line, and the redraw below would throw an unsaved edit away. */
  if (txt && document.activeElement === txt) {
    const whole = txt.textContent.replace(/\n/g, " ");
    const [from, to] = caretOffsets(txt);
    const before = whole.slice(0, from), after = whole.slice(to);
    b.title = before + (before && !/\s$/.test(before) ? " " : "") + addition +
              (after && !/^\s/.test(after) ? " " : "") + after;
    /* The line on screen is handed the same text before the redraw takes it
       away. Losing the focused element fires blur on the way out, and that
       handler saves what the line still said -- the text as it was before the
       paste -- which put the old line straight back over the one just
       written, so a pasted screenshot landed in assets/ and left no trace.
       Focus is asked back afterwards, because a paste comes mid-sentence. */
    txt.textContent = b.title;
    keepFocus(".txt", txt);
  } else {
    const cur = trim(b.title);
    b.title = cur ? cur + " " + addition : addition;
  }
  touch(path); noteTodoTouched();
  render();
  const where = V.backend.kind === "fs" || V.backend.kind === "http"
    ? "saved in " + ASSET_DIR + "/"
    : "kept in this browser only - choose a folder to make them real files";
  notify(marks.length + (marks.length === 1 ? " file " : " files ") + where + ".");
  return true;
}

/* The line is the target, so a file let go anywhere else would otherwise make
   the browser leave the app and open it. Say where it should have gone. */
window.addEventListener("dragover", e => {
  if (Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files")) e.preventDefault();
});
window.addEventListener("drop", e => {
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  e.preventDefault();
  notify("Drop a file onto a line to attach it to it.", "warn");
});

/* ============================================================
   85_INLINE_RENDER
   ============================================================ */
function renderInline(text) {
  let h = esc(text || "");
  /* ![name](assets/x.png) and [name](assets/x.pdf) -- the markdown a dropped
     file leaves behind. First, because the target is a path into the folder
     and not a page in the vault, and set aside rather than left in the string:
     the rules below are looking for words, and an anchor they walked into
     would come out with its own href linked all over again. */
  const held = [];
  const hold = html => "\u0000" + (held.push(html) - 1) + "\u0000";
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (all, alt, src) =>
    isAssetPath(src) || /^(blob|data|https?):/.test(src)
      ? hold(`<img class="asset" alt="${alt}" title="${alt}" ${isAssetPath(src) ? `data-asset="${src}"` : `src="${src}"`}>`)
      : all);
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, label, href) =>
    isAssetPath(href)
      ? hold(`<a class="asset-file" data-asset="${href}" href="#">\u{1F4CE} ${label}</a>`)
      : /^https?:/.test(href)
        ? hold(`<a class="asset-file" href="${href}" target="_blank" rel="noopener">${label}</a>`)
        : all);
  h = h.replace(/\[\[([^\]]+)\]\]/g, (all, t) => {
    const raw = trim(t.split("][")[0]);
    const target = esc(raw);
    const pfx = (/^([^/]+)\//.exec(raw) || [])[1];
    /* [[go/todos]] is not a page but a door into the app itself. That is what
       lets the first project be a tour you click through rather than a leaflet
       about one, and it stays a plain readable line in the markdown. */
    if (pfx === "go") {
      const id = raw.slice(3);
      // The text reached here already escaped, so a label written in the task
      // stands as it is and only a label of our own needs escaping.
      const shown = t.includes("][") ? trim(t.split("][")[1]) : esc(tourLabel(id));
      return `<span class="wikilink go" data-link="${target}">${shown} ↗</span>`;
    }
    const known = pfx === "c" || pfx === "z" || pfx === "p" || pfx === "o" || (pfx && STATUS_DIRS[pfx]);
    let label = trim(t.includes("][") ? t.split("][")[1] : (known ? raw.slice(pfx.length + 1) : raw));
    if (pfx === "c") label = "@" + label;
    const cls = pfx === "c" ? " ctx" : pfx === "z" ? " zet" : (pfx && STATUS_DIRS[pfx]) ? " proj" : "";
    return `<span class="wikilink${cls}" data-link="${target}">${esc(label)}</span>`;
  });
  h = h.replace(/(^|\s)#([\p{L}\p{N}_\-/]+)/gu, (all, sp, t) =>
    `${sp}<span class="tag" data-link="${esc(t)}">#${esc(t)}</span>`);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  h = h.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return h.replace(/\u0000(\d+)\u0000/g, (all, i) => held[i]);
}

/* ============================================================
   113_QUICK_ADD -- the MS To Do "+ Add a task" row
   ============================================================ */
function quickAdd(targetPath, opts = {}) {
  const input = el("input", {
    placeholder: opts.placeholder || "Add a task",
    onkeydown: e => {
      if (linkPopKey(e)) return;
      if (e.key !== "Enter") return;
      const text = trim(input.value);
      if (!text) return;
      input.value = "";
      const page = getPage(targetPath);
      if (!page) return;
      const ctx = opts.context || state.context;
      const blk = stampAuthor(newBlock({
        state: "TODO",
        title: text + (ctx && !hasContextLink(text) ? " [[c/" + ctx + "]]" : ""),
        props: {Added: "[[" + todayISO() + "]]"},
      }));
      createLinkedPages(blk.title);
      page.blocks.push(blk);
      touch(targetPath);
      noteTodoTouched();
      coachMark("add");
      render();
      // keep typing: re-focus the box that replaced this one
      requestAnimationFrame(() => {
        const next = $(".quickadd input");
        if (next) next.focus();
      });
      if (!startsWithVerb(text)) notify("Tip: start with a verb you could film - Call, Draft, Buy.", "warn");
    },
  });
  /* A list pasted into a one-line box is still a list. The box itself would
     throw the line breaks away and leave one long task, so catch the paste and
     make the tasks it describes instead. */
  input.addEventListener("paste", e => {
    const raw = e.clipboardData && e.clipboardData.getData("text/plain");
    if (raw == null) return;
    if (raw.replace(/\r\n?/g, "\n").split("\n").filter(l => trim(l) !== "").length < 2) return;
    const roots = parseOutlineText(raw);
    if (!roots.length) return;
    e.preventDefault();
    const page = getPage(targetPath);
    if (!page) return;
    const n = readyPastedBlocks(roots, {defaultState: "TODO", context: opts.context || state.context});
    for (const blk of roots) page.blocks.push(blk);
    input.value = "";
    touch(targetPath); noteTodoTouched(); coachMark("add"); render();
    notify(n + " tasks added from what you pasted.");
  });
  attachLinkAutocomplete(input);
  return el("div", {class: "quickadd"}, el("span", {}, "+"), input);
}

/* ============================================================
   113b_FIRST_RUN COACH
   Three steps that tick themselves off as you do them, in the page rather
   than in front of it. Teaching by doing beats a wall of modals, and it
   disappears for good once the third one is done.
   ============================================================ */
const coachOn = () => PREF.get("coach", "") === "1";
function coachMark(step) {
  if (!coachOn()) return;
  PREF.set("coach." + step, "1");
}
const coachDone = step => PREF.get("coach." + step, "") === "1";

function coachSteps() {
  const onDisk = V.backend && (V.backend.kind === "fs" || V.backend.kind === "http");
  const steps = [
    {k: "add",  done: coachDone("add"),  label: "Add your first task",
     hint: "type it in the box above and press enter",
     why: "Getting it out of your head and into something you trust is the whole point. " +
          "Nothing else here is worth anything until that part is dull."},
    {k: "tick", done: coachDone("tick"), label: "Tick it off",
     hint: "click the circle on the left",
     why: "One thing crossed off proves the list answers back. A list that never visibly " +
          "moves is one you quietly stop opening."},
  ];
  /* The project step waits until something has actually been added and closed.
     Handing somebody a filing system while their screen is still empty is how
     every other to-do app loses them inside a minute. */
  if (coachDone("add") && coachDone("tick")) {
    // The tour project was put there by the app, so it cannot stand in for one
    // of your own -- this step is about filing a job of your own.
    const own = projectsIn("1").filter(p => !isTourProject(p));
    steps.push({k: "project", done: own.length > 0, optional: true,
      label: "Give a bigger job a project", cta: "Make one",
      hint: "anything that needs more than one step",
      why: "A task is one move; a project is the handful of moves that finish something, " +
           "with a line saying what done looks like. Keeping them apart is what stops " +
           "\u201cmove house\u201d sitting on the same list as \u201cbuy milk\u201d and making both feel heavy.",
      act: () => newProjectPrompt()});
  }
  /* The one pointer at the tour. Without it the first project sits in Active
     where a newcomer has no reason to look, and the half of the app behind the
     sidebar stays undiscovered -- which is the whole problem it solves. */
  const tourPath = tourProjectPath();
  const tourLeft = tourPath ? tourSteps(tourPath).filter(s => s.open).length : 0;
  if (tourPath && coachDone("add")) {
    steps.push({k: "tour", done: tourLeft === 0, optional: true,
      label: "Find your way round the rest of it", cta: "Open",
      hint: tourLeft ? tourLeft + " short steps, each one a link to the part it is about" : "",
      why: "Half of what is here is behind one more click - contexts, planned dates, " +
           "people, routines, the folder your files live in. The steps are on your list " +
           "like anything else, so ignore them, reorder them or delete the lot.",
      act: () => openPage(tourPath)});
  }
  steps.push({k: "home", done: onDisk, label: "Give your tasks a home", cta: "Choose",
    hint: onDisk ? "" : "right now they live in this browser only",
    why: "A folder of plain .md files you picked yourself means nothing can hold your work " +
         "hostage - not this app, not a company, not a browser clearing its storage.",
    act: () => openSpaceStorageSetup()});
  return steps;
}

function coachStrip() {
  if (!coachOn()) return null;
  const steps = coachSteps();
  const needed = steps.filter(st => !st.optional);
  /* Finished when the three that matter are done. The project step is an
     invitation and never a gate -- somebody whose life genuinely is a flat list
     of errands should not be held in onboarding for declining to file them. */
  if (needed.every(st => st.done)) { PREF.set("coach", "0"); return null; }

  const box = el("div", {class: "coach"});
  box.append(el("div", {class: "coach-head"},
    el("b", {}, "Getting started"),
    el("span", {style: "color:var(--fg3);font-size:12px"},
      needed.filter(st => st.done).length + " of " + needed.length),
    el("button", {class: "iconbtn", title: "Hide this for good",
      onclick: () => { PREF.set("coach", "0"); render(); }}, "\u2715")));
  // Only the step you are actually on explains itself. Three reasons at once is
  // a leaflet, and nobody reads the leaflet.
  const current = steps.find(st => !st.done);
  for (const st of steps) {
    box.append(el("div", {class: "coach-step" + (st.done ? " done" : "")},
      el("span", {class: "coach-dot"}, st.done ? "\u2713" : ""),
      el("div", {},
        el("div", {}, st.label,
          st.optional ? el("span", {class: "chip", style: "margin-left:6px"}, "optional") : null),
        st.hint ? el("div", {style: "color:var(--fg3);font-size:12px"}, st.hint) : null,
        (st === current && st.why) ? el("div", {class: "coach-why"}, st.why) : null),
      (!st.done && st.act) ? el("button", {class: "btn sm ghost", style: "margin-left:auto",
        onclick: st.act}, st.cta || "Choose") : null));
  }
  return box;
}

/* ============================================================
   113d_FIRST PROJECT -- the tour, as an actual project

   The coach above teaches the two moves the app is for: write one down, tick
   it off. Everything else -- contexts, planned dates, people, routines, the
   folder your files live in -- is a part of the interface nobody finds by
   being told it exists.

   So the first space gets one project, and its steps are doors: each one is a
   real TODO whose text carries a [[go/...]] link straight to the part of the
   app it is about. Pressing it takes you there. It is not a modal tour laid
   over the app, because a tour you cannot leave is a tour you resent, and it
   is not a help page either: it is on your list, it can be reordered,
   reworded, ignored, or ticked off unread like anything else, and when the
   last step closes the ordinary project-completion prompt files it away.

   The one thing added on top: going somewhere is remembered, and a step whose
   destination you have now seen is one the app offers to tick off for you --
   asked, never done behind your back, because the only person who knows
   whether you actually did it is you.
   ============================================================ */
const TOUR_PROP  = "tour";                  // tour:: 1  on the project page
const TOUR_TITLE = "Find your way round GroupTodo";

/* label: what the link reads as. go: where it actually goes. Nothing here is
   special-cased UI -- every destination is a thing the sidebar or a dialog can
   already reach, so the tour cannot drift away from the real app. */
