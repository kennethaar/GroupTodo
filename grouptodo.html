           one -- as well as off the page it is written on. Both edges are
           true, and neither is a copy of anything: the link is already in the
           markdown. */
        const projectAt = text => {
          for (const raw of linksIn(text || "")) {
            const tp = findExistingPage(raw.split("][")[0]);
            if (tp && pageKind(tp) === "project") return tp;
          }
          return null;
        };
        const fanned = idx => {
          const nd = nodes[idx];
          if ((nd.fan || 0) >= CFG.plexTaskFan) { nd.more = (nd.more || 0) + 1; return true; }
          nd.fan = (nd.fan || 0) + 1;
          return false;
        };
        const link = (parentIdx, idx) => {
          if (parentIdx == null || parentIdx === idx) return;
          edges.push([parentIdx, idx]);
          nodes[parentIdx].deg++; nodes[idx].deg++;
        };
        /* ownerIdx: the page or task the bullet is written under.
           projIdx: the project named on the way down here, if any. */
        const hang = (blocks, ownerIdx, projIdx) => {
          for (const b of blocks || []) {
            const named = projectAt(b.title);
            const nIdx = named == null ? null
              : index.get((space || "") + "\u0000" + named);
            const proj = nIdx == null ? projIdx : nIdx;
            // A message is a conversation, not an action, and an untitled
            // bullet is a blank line somebody left behind.
            if (!b.state || isMessage(b)) { hang(b.children, ownerIdx, proj); continue; }
            /* The project is where this step belongs, so it is the one that
               gets the room when the fan is full; the page it is written on is
               a second home and does not keep it off the map on its own. */
            const owners = [];
            if (proj != null && proj !== ownerIdx) owners.push(proj);
            owners.push(ownerIdx);
            const room = owners.filter(o => !fanned(o));
            if (!room.length) continue;
            const path = nodes[ownerIdx].path;
            const key = (space || "") + "\u0000" + path + "\u0000#" + b.id;
            const idx = nodes.length;
            index.set(key, idx);
            nodes.push({key, space, path, block: b, blockId: b.id, task: true,
                        kind: b.state, state: b.state,
                        label: plainTitle(b.title) || "(untitled)", deg: 0});
            room.forEach(o => link(o, idx));
            /* Sub-tasks hang off the task and stop there: a step of a step
               is not a step of the project, and drawing it as one puts the
               whole tree in one fan. One that names a project itself still
               goes there. */
            hang(b.children, idx, null);
          }
        };
        for (const [path, page] of V.pages) {
          const pi = index.get((space || "") + "\u0000" + path);
          if (pi == null) continue;            // not drawn: capped, or a kind we skip
          hang(page.blocks, pi, pageKind(path) === "project" ? pi : null);
        }
      });
    }
    return {nodes, edges, dropped: base.dropped};
  });
}

/* A deterministic start, so the same vault always settles into the same shape
   and you can recognise your own graph tomorrow. Coordinates here are the
   graph's own, not the screen's -- the picture is fitted to the box afterwards,
   which is what keeps the dots off the frame however many there are. */
function graphSeed(g) {
  const n = g.nodes.length;
  const r0 = 30 + n * 6;
  g.nodes.forEach((nd, i) => {
    const had = GRAPH_POS.get(nd.key);
    if (had) { nd.x = had.x; nd.y = had.y; return; }
    const ang = (i / Math.max(1, n)) * Math.PI * 2;
    const jitter = 0.45 + ((i * 2654435761) % 997) / 997 * 0.55;
    nd.x = Math.cos(ang) * r0 * jitter;
    nd.y = Math.sin(ang) * r0 * jitter;
  });
}

/* One round of Fruchterman-Reingold: everything repels everything, linked
   things pull back, and a weak pull to the middle stops a page nobody links to
   from drifting out of the picture. Forces are applied as directions, so a pair
   settles at roughly k apart whatever the numbers happen to be.
   O(n^2), which at 200 nodes is 20k pairs and costs well under a millisecond. */
function graphStep(g, temp) {
  const n = g.nodes.length;
  if (!n) return;
  const k = 62;                              // how far apart two linked pages sit
  for (const a of g.nodes) { a.dx = 0; a.dy = 0; }
  for (let i = 0; i < n; i++) {
    const a = g.nodes[i];
    for (let j = i + 1; j < n; j++) {
      const b = g.nodes[j];
      let ddx = a.x - b.x, ddy = a.y - b.y;
      let d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < 0.01) { ddx = 0.3 + (i % 7) * 0.05; ddy = 0.3 - (j % 5) * 0.05; d = Math.sqrt(ddx * ddx + ddy * ddy); }
      const f = (k * k) / (d * d);           // unit vector * k^2/d
      a.dx += ddx * f; a.dy += ddy * f;
      b.dx -= ddx * f; b.dy -= ddy * f;
    }
  }
  for (const [i, j] of g.edges) {
    const a = g.nodes[i], b = g.nodes[j];
    const ddx = a.x - b.x, ddy = a.y - b.y;
    const d = Math.sqrt(ddx * ddx + ddy * ddy) || 0.01;
    const f = d / k;                         // unit vector * d^2/k
    a.dx -= ddx * f; a.dy -= ddy * f;
    b.dx += ddx * f; b.dy += ddy * f;
  }
  let cx = 0, cy = 0;
  for (const a of g.nodes) { cx += a.x; cy += a.y; }
  cx /= n; cy /= n;
  for (const a of g.nodes) {
    /* Gravity grows with distance. A fixed pull loses to repulsion, and pages
       nobody links to end up twenty times further out than a linked pair is
       wide -- which, once the picture is fitted to the box, squashes the part
       you came to look at into a dot in the middle. */
    a.dx += (cx - a.x) * 1.2;
    a.dy += (cy - a.y) * 1.2;
    const d = Math.sqrt(a.dx * a.dx + a.dy * a.dy) || 1;
    const step = Math.min(d, temp);
    a.x += (a.dx / d) * step;
    a.y += (a.dy / d) * step;
    GRAPH_POS.set(a.key, {x: a.x, y: a.y});
  }
}

/* Fit whatever shape came out to the box on screen, so the drawing fills it
   without anything pressed against the frame. Dots and labels keep their size:
   a graph you cannot read is not a smaller graph, it is a smudge. */
function graphFit(g, w, h) {
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const n of g.nodes) {
    if (n.x < minx) minx = n.x;
    if (n.x > maxx) maxx = n.x;
    if (n.y < miny) miny = n.y;
    if (n.y > maxy) maxy = n.y;
  }
  if (!Number.isFinite(minx)) { g.view = {scale: 1, ox: w / 2, oy: h / 2}; return; }
  const pad = 42;
  const scale = Math.min((w - pad * 2) / Math.max(1, maxx - minx),
                         (h - pad * 2) / Math.max(1, maxy - miny), 2.4);
  g.view = {scale,
            ox: w / 2 - ((minx + maxx) / 2) * scale,
            oy: h / 2 - ((miny + maxy) / 2) * scale};
}
const gX = (g, n) => n.x * g.view.scale + g.view.ox;
const gY = (g, n) => n.y * g.view.scale + g.view.oy;

const graphRadius = nd => 3.4 + Math.min(nd.deg, 16) * 0.55;

function graphDraw(cv, g, hoverIdx) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  const x = cv.getContext("2d");
  if (!x) return;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);

  // Read the theme rather than hard-coding, so the graph follows light mode.
  const css = getComputedStyle(document.documentElement);
  const v = (name, fallback) => trim(css.getPropertyValue(name)) || fallback;
  const line = v("--border2", "#333a4a"), fg = v("--fg", "#e6e9ef"), fg2 = v("--fg2", "#a4acbd");
  graphFit(g, w, h);
  const hov = hoverIdx >= 0 ? g.nodes[hoverIdx] : null;
  const near = new Set();
  if (hov) {
    near.add(hoverIdx);
    for (const [a, b] of g.edges) {
      if (a === hoverIdx) near.add(b);
      else if (b === hoverIdx) near.add(a);
    }
  }

  /* A thousand lines at the alpha that suits ten is a grey sheet with dots on
     it, so the more there are, the fainter each one gets. */
  const edgeAlpha = Math.max(0.1, Math.min(0.62, 8 / Math.sqrt(g.edges.length || 1)));
  x.lineWidth = 1;
  for (const [a, b] of g.edges) {
    const n1 = g.nodes[a], n2 = g.nodes[b];
    const lit = hov && (a === hoverIdx || b === hoverIdx);
    // Faint enough to stay behind the dots, solid enough to actually see:
    // at 0.4 on a dark background the links read as nothing at all.
    x.globalAlpha = hov ? (lit ? 0.95 : edgeAlpha * 0.25) : edgeAlpha;
    x.strokeStyle = lit ? v("--accent", "#6aa3ff") : v("--fg3", "#6d7689");
    x.beginPath();
    x.moveTo(gX(g, n1), gY(g, n1));
    x.lineTo(gX(g, n2), gY(g, n2));
    x.stroke();
  }

  const labelAll = g.nodes.length <= 70;
  x.font = "11px " + v("--sans", "sans-serif");
  x.textAlign = "center";
  x.textBaseline = "top";
  /* Two names written on top of each other are worse than one name: where hubs
     sit close together, the first one drawn keeps the space and the rest go
     unlabelled until you hover them. */
  const taken = [];
  const roomFor = (cx, cy, tw, force) => {
    const box = [cx - tw / 2 - 2, cy - 1, cx + tw / 2 + 2, cy + 13];
    if (!force) {
      for (const t of taken)
        if (box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1]) return false;
    }
    taken.push(box);
    return true;
  };
  for (let i = 0; i < g.nodes.length; i++) {
    const nd = g.nodes[i];
    const r = graphRadius(nd), px = gX(g, nd), py = gY(g, nd);
    const dim = hov && !near.has(i);
    x.globalAlpha = dim ? 0.2 : 1;
    const colour = v(GRAPH_KIND_VAR[nd.kind] || "--fg2", "#a4acbd");
    x.beginPath();
    x.arc(px, py, i === hoverIdx ? r + 2 : r, 0, Math.PI * 2);
    if (nd.ghost) {
      // Hollow: something links here, but there is no page behind it yet.
      x.fillStyle = v("--bg2", "#161920");
      x.fill();
      x.strokeStyle = colour;
      x.lineWidth = 1.4;
      x.stroke();
    } else {
      x.fillStyle = colour;
      x.fill();
      // A hairline in the background colour, so two dots that overlap still
      // read as two dots rather than one blob.
      x.strokeStyle = v("--bg2", "#161920");
      x.lineWidth = 1;
      x.stroke();
    }
    if (i === hoverIdx) {
      x.globalAlpha = 1;
      x.strokeStyle = v("--fg", "#e6e9ef");
      x.lineWidth = 1.5;
      x.stroke();
      x.lineWidth = 1;
    }
    if (i === hoverIdx || labelAll || nd.hub) {
      x.globalAlpha = dim ? 0.2 : (i === hoverIdx ? 1 : 0.8);
      x.fillStyle = i === hoverIdx ? fg : fg2;
      const text = nd.label.length > 26 ? nd.label.slice(0, 25) + "…" : nd.label;
      if (roomFor(px, py + r + 3, x.measureText(text).width, i === hoverIdx))
        x.fillText(text, px, py + r + 3);
    }
  }
  x.globalAlpha = 1;
}

/* ============================================================
   THE PLEX -- one thought in the middle, its relatives around it
   The force-directed map answers "what does all of this look like". It is bad
   at the other question, "what is around THIS", because the thing you care
   about is wherever the physics happened to leave it and everything else is
   drawn at the same weight.

   So: TheBrain's arrangement. The page you are on sits in the middle, what
   links TO it stands above, what it links to hangs below, and what shares a
   parent with it sits out to the sides. Their own relatives form a fainter,
   smaller outer ring: that is the whole of the 2.5D, size and opacity standing
   in for distance, with everything gliding rather than jumping so you can see
   where a thing went when the middle changes.

   Nothing here is a second copy of anything. A relation is a [[link]] in the
   markdown, which is what it already was.
   ============================================================ */
const PLEX = {
  anim: null,            // the running rAF, so a redraw cannot leave two
  pos: new Map(),        // key -> {x, y, r, a} where things are NOW
  drag: null,            // {from, x, y} while pulling a link out of a node
  cursor: null,          // key the keyboard is pointing at, which is not the middle
  key: null,             // the keydown listener this screen has in place
};

const plexFocus = () => state.graphFocus || null;

/* Edges are directed: [from, to] means the page `from` has a link in it that
   points at `to`. That is the whole of the hierarchy, and it is already in the
   files. */
function plexRelatives(g, key) {
  const i = g.nodes.findIndex(n => n.key === key);
  const parents = [], children = [], jumps = [];
  if (i < 0) return {i: -1, parents, children, jumps};
  for (const [a, b] of g.edges) {
    if (a === i && !children.includes(b)) children.push(b);
    else if (b === i && !parents.includes(a)) parents.push(a);
  }
  // A sibling is anything that hangs off one of your parents besides you.
  for (const pi of parents)
    for (const [a, b] of g.edges)
      if (a === pi && b !== i && !jumps.includes(b) && !children.includes(b)) jumps.push(b);
  return {i, parents, children, jumps};
}

/* Where everything wants to be. Returns key -> {x,y,r,a,ring}; anything absent
   is off the plex and is not drawn. */
function plexTargets(g, key, w, h) {
  const out = new Map();
  const {i, parents, children, jumps} = plexRelatives(g, key);
  if (i < 0) return out;
  const cx = w / 2;
  /* The middle is only in the middle when there is something on both sides of
     it. A page nothing points at, fanning ten tasks downward, should not leave
     the top half of the box empty and crowd everything into the bottom. */
  const lean = (parents.length ? 1 : 0) - (children.length ? 1 : 0);
  const cy = h / 2 + lean * h * 0.13;
  const R = Math.min(w, h) * 0.3;

  out.set(g.nodes[i].key, {x: cx, y: cy, r: 13, a: 1, ring: 0, idx: i, rank: 0});

  /* An arc rather than a ring: parents overhead, children underfoot, jumps on
     the horizon. A fan keeps them apart without a simulation.

     Past about six on one side, one arc at one distance puts the dots -- and,
     long before the dots, their names -- on top of each other. So a long side
     is dealt out into two arcs at different distances, taking every other item
     so neighbours in the list never share a row. `label` says which way the
     name hangs off the dot, which is the other half of not overlapping:
     overhead for the parents, underfoot for the children. */
  const fan = (list, centreAngle, spread, radius, r, a, ring, label, rank) => {
    const rows = list.length > 6
      ? [list.filter((_, k) => k % 2 === 0), list.filter((_, k) => k % 2 === 1)]
      : [list];
    rows.forEach((row, ri) => {
      // Capped, so the outer arc stays inside the box with room for its names.
      const rad = Math.min(radius * (ri ? 1.52 : 1), Math.min(w, h) * 0.41);
      const n = row.length;
      row.forEach((idx, k) => {
        const t = n === 1 ? 0 : (k / (n - 1)) - 0.5;
        const ang = centreAngle + t * Math.min(spread, 0.5 * n);
        out.set(g.nodes[idx].key, {
          x: cx + Math.cos(ang) * rad,
          y: cy + Math.sin(ang) * rad,
          r: ri ? r * 0.88 : r, a, ring, idx, label, rank,
        });
      });
    });
  };
  const UP = -Math.PI / 2, DOWN = Math.PI / 2;
  /* rank is who gets the space when two names want it: what this is made of
     before what merely sits beside it, and both before the outer ring. */
  fan(parents,  UP,   2.0, R, 9, 1, 1, "above", 1);
  fan(children, DOWN, 2.0, R, 9, 1, 1, "below", 1);
  /* The jumps sit out to the sides, where there is room along the x axis but
     none along the y, so their names go beside them rather than underneath. */
  const side = jumps.slice(0, 8);
  fan(side, 0, 1.5, R * 1.08, 7, .9, 1, "right", 2);
  // the left-hand half of the jumps, so they are not all stacked on one side
  side.forEach((idx, k) => {
    if (k % 2 === 0) return;
    const t = out.get(g.nodes[idx].key);
    if (t) { t.x = cx - (t.x - cx); t.label = "left"; }
  });

  /* The outer ring: the relatives of your relatives, small and faint. This is
     the depth cue, and the reason the middle feels like a place rather than a
     list. */
  const near = new Set([i, ...parents, ...children, ...jumps]);
  const ringTwo = [];
  for (const idx of [...parents, ...children]) {
    for (const [a, b] of g.edges) {
      const other = a === idx ? b : b === idx ? a : -1;
      if (other < 0 || near.has(other) || ringTwo.includes(other)) continue;
      ringTwo.push(other);
      if (ringTwo.length >= 10) break;
    }
    if (ringTwo.length >= 10) break;
  }
  ringTwo.forEach((idx, k) => {
    const ang = (k / Math.max(1, ringTwo.length)) * Math.PI * 2 - Math.PI / 2;
    out.set(g.nodes[idx].key, {
      x: cx + Math.cos(ang) * R * 1.85,
      y: cy + Math.sin(ang) * R * 1.85,
      r: 4.5, a: .42, ring: 2, idx, label: Math.cos(ang) < 0 ? "left" : "right", rank: 3,
    });
  });
  return out;
}

function plexDraw(cv, g, targets, hoverKey) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const x = cv.getContext("2d");
  if (!x) return;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);

  const css = getComputedStyle(document.documentElement);
  const v = (n, f) => trim(css.getPropertyValue(n)) || f;
  const accent = v("--accent", "#6aa3ff"), fg = v("--fg", "#e6e9ef"), fg2 = v("--fg2", "#a4acbd");
  const here = PLEX.pos.get(plexFocus());

  /* Links first, as curves through the middle: a straight line between two
     dots says "these two", a curve that bends toward the centre says "both of
     these belong to the one in the middle", which is the thing being shown. */
  x.lineWidth = 1.4;
  for (const [a, b] of g.edges) {
    const ka = g.nodes[a].key, kb = g.nodes[b].key;
    const pa = PLEX.pos.get(ka), pb = PLEX.pos.get(kb);
    if (!pa || !pb) continue;
    const lit = ka === plexFocus() || kb === plexFocus();
    x.globalAlpha = Math.min(pa.a, pb.a) * (lit ? 0.85 : 0.22);
    x.strokeStyle = lit ? accent : fg2;
    x.beginPath();
    x.moveTo(pa.x, pa.y);
    if (here) x.quadraticCurveTo((pa.x + pb.x) / 2 * 0.6 + here.x * 0.4,
                                 (pa.y + pb.y) / 2 * 0.6 + here.y * 0.4, pb.x, pb.y);
    else x.lineTo(pb.x, pb.y);
    x.stroke();
  }

  if (PLEX.drag) {
    const from = PLEX.pos.get(PLEX.drag.from);
    if (from) {
      x.globalAlpha = .9; x.strokeStyle = accent; x.setLineDash([5, 4]);
      x.beginPath(); x.moveTo(from.x, from.y); x.lineTo(PLEX.drag.x, PLEX.drag.y); x.stroke();
      x.setLineDash([]);
    }
  }

  x.textBaseline = "top";
  /* Two names written on top of each other are worse than one name, and a name
     written across a dot is worse than both. So every dot reserves its own
     patch first, the names are drawn afterwards in a pass of their own, and a
     name that cannot find space is simply left out -- walking onto the dot, or
     pointing at it, is how you read that one. */
  const taken = [];
  const free = box => {
    for (const t of taken)
      if (box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1]) return false;
    return true;
  };
  const jobs = [];

  // Nearest last, so the middle is never drawn under something behind it.
  const drawn = [...PLEX.pos.entries()]
    .filter(([k]) => targets.has(k))
    .sort((p, q) => (targets.get(q[0]).ring) - (targets.get(p[0]).ring));

  for (const [k, pos] of drawn) {
    const t = targets.get(k);
    const nd = g.nodes[t.idx];
    const focused = k === plexFocus();
    const hot = k === hoverKey;
    x.globalAlpha = pos.a * (nd.task && !OPEN_STATES[nd.state] ? 0.55 : 1);
    const colour = v(GRAPH_KIND_VAR[nd.kind] || "--fg2", "#a4acbd");
    const rad = pos.r + (hot ? 2 : 0);
    x.beginPath();
    /* A task is a square dot and a page is a round one. Shape rather than
       colour alone, because colour here already means state. */
    if (nd.task) {
      const q = rad * 0.92;
      if (x.roundRect) x.roundRect(pos.x - q, pos.y - q, q * 2, q * 2, Math.max(2, q * 0.35));
      else x.rect(pos.x - q, pos.y - q, q * 2, q * 2);
    } else x.arc(pos.x, pos.y, rad, 0, Math.PI * 2);
    const hollow = nd.ghost || (nd.task && !OPEN_STATES[nd.state]);
    if (hollow) { x.fillStyle = v("--bg2", "#161920"); x.fill(); x.strokeStyle = colour; x.lineWidth = 1.6; x.stroke(); }
    else { x.fillStyle = colour; x.fill(); x.strokeStyle = v("--bg2", "#161920"); x.lineWidth = 1; x.stroke(); }
    if (focused) {
      x.globalAlpha = pos.a;
      x.strokeStyle = accent; x.lineWidth = 2;
      x.beginPath(); x.arc(pos.x, pos.y, pos.r + 5, 0, Math.PI * 2); x.stroke();
    }
    /* Where the keyboard is. Dashed, so it reads as "about to be chosen"
       rather than as "chosen", which is what the solid ring in the middle
       already says. */
    if (k === PLEX.cursor && !focused) {
      x.globalAlpha = 1;
      x.strokeStyle = accent; x.lineWidth = 1.8; x.setLineDash([4, 3]);
      x.beginPath(); x.arc(pos.x, pos.y, pos.r + 6, 0, Math.PI * 2); x.stroke();
      x.setLineDash([]);
    }
    // The dot keeps its own space, so no name is ever written across it.
    taken.push([pos.x - rad - 2, pos.y - rad - 2, pos.x + rad + 2, pos.y + rad + 2]);
    // Ring two is the depth cue, so it carries no words unless you point at it.
    const marked = focused || hot || k === PLEX.cursor;
    if (t.ring === 2 && !marked) continue;
    const name = nd.label + (nd.more ? " (+" + nd.more + " more)" : "");
    /* Shorter the further out it sits. A ring of thirty-character names is a
       wall of text with a map somewhere behind it. */
    const cap = marked ? 34 : t.ring === 2 ? 18 : 24;
    jobs.push({pos, t, marked, focused, text: name.length > cap ? name.slice(0, cap - 1) + "…" : name});
  }

  /* Names last, and the ones that matter first: whatever is marked wins its
     space outright -- it is the answer to "what am I on" -- and gets a patch of
     background behind it so it stays readable where it has to overlap. */
  x.textAlign = "center";
  jobs.sort((p, q) => (q.marked - p.marked) || ((p.t.rank || 0) - (q.t.rank || 0)));
  for (const job of jobs) {
    const {pos, t} = job;
    x.font = (job.focused ? "600 13px " : "11.5px ") + v("--sans", "sans-serif");
    const tw = x.measureText(job.text).width;
    /* Which way the name hangs off its dot. Overhead for what points here,
       underfoot for what this points at, beside it out on the flanks -- so the
       names fan out the way the dots do instead of all queueing downward. The
       second spot is where it goes when the first one is already spoken for,
       which is most of what saves a name from being dropped. */
    const under = [pos.x, pos.y + pos.r + 6], over = [pos.x, pos.y - pos.r - 17];
    const spots = t.label === "above" ? [over, under]
                : t.label === "left"  ? [[pos.x - pos.r - 6 - tw / 2, pos.y - 6], under, over]
                : t.label === "right" ? [[pos.x + pos.r + 6 + tw / 2, pos.y - 6], under, over]
                : [under, over];
    let box = null, tx = 0, ty = 0;
    for (const [sx, sy] of spots) {
      // A name half off the canvas is not a name.
      tx = Math.max(tw / 2 + 4, Math.min(w - tw / 2 - 4, sx));
      ty = Math.max(2, Math.min(h - 16, sy));
      const cand = [tx - tw / 2 - 3, ty - 2, tx + tw / 2 + 3, ty + 15];
      if (free(cand) || job.marked) { box = cand; break; }
    }
    if (!box) continue;
    taken.push(box);
    if (job.marked) {
      x.globalAlpha = pos.a * 0.88;
      x.fillStyle = v("--bg", "#0f1115");
      if (x.roundRect) { x.beginPath(); x.roundRect(box[0], box[1], box[2] - box[0], box[3] - box[1], 4); x.fill(); }
      else x.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]);
    }
    x.globalAlpha = pos.a;
    x.fillStyle = job.marked ? fg : fg2;
    x.fillText(job.text, tx, ty);
  }
  x.globalAlpha = 1;
}

/* One animation for the whole plex: every dot eases toward where it belongs,
   which is what makes a change of focus readable instead of a cut. */
function plexAnimate(cv, g, getTargets, getHover) {
  if (PLEX.anim) cancelAnimationFrame(PLEX.anim);
  const step = () => {
    PLEX.anim = null;
    if (!cv.isConnected) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    const targets = getTargets(w, h);
    let moving = false;
    for (const [k, t] of targets) {
      let p = PLEX.pos.get(k);
      if (!p) {
        // Arriving from where the middle is, so new relatives fly outward.
        const from = PLEX.pos.get(plexFocus());
        p = {x: from ? from.x : w / 2, y: from ? from.y : h / 2, r: 1, a: 0};
        PLEX.pos.set(k, p);
      }
      for (const f of ["x", "y", "r", "a"]) {
        const d = t[f] - p[f];
        if (Math.abs(d) > (f === "a" ? 0.004 : 0.4)) moving = true;
        p[f] += d * 0.22;
      }
    }
    for (const k of [...PLEX.pos.keys()]) {
      if (targets.has(k)) continue;
      const p = PLEX.pos.get(k);
      p.a += (0 - p.a) * 0.3;
      if (p.a < 0.02) PLEX.pos.delete(k); else moving = true;
    }
    plexDraw(cv, g, targets, getHover());
    if (moving || PLEX.drag) PLEX.anim = requestAnimationFrame(step);
  };
  PLEX.anim = requestAnimationFrame(step);
}


/* ---------- editing the plex ----------
   A relation is a [[link]] in the markdown and nothing else, so making one here
   writes the same line you would have typed. They are gathered under a block
   called Related, which reads as a list of links in any editor and parses back
   as exactly what it looks like. */
const RELATED_BLOCK = "Related";

function relatedBlockOf(page) {
  let b = (page.blocks || []).find(x => trim(x.title) === RELATED_BLOCK);
  if (!b) { b = newBlock({title: RELATED_BLOCK}); page.blocks.push(b); }
  if (!b.children) b.children = [];
  return b;
}

/* True when the link was added; false when it was already there. */
function linkPages(fromNode, toRef) {
  if (!fromNode || fromNode.ghost || !toRef) return false;
  return inSpace(fromNode.space, () => {
    const page = getPage(fromNode.path);
    if (!page) return false;
    const want = "[[" + toRef + "]]";
    let found = false;
    walkBlocks(page.blocks, x => {
      if (linksIn([x.title, ...(x.body || [])].join("\n"))
          .some(t => trim(t.split("][")[0]).toLowerCase() === toRef.toLowerCase())) found = true;
    });
    if (found) return false;
    relatedBlockOf(page).children.push(newBlock({title: want}));
    createLinkedPages(want);
    touch(fromNode.path);
    return true;
  });
}

function unlinkPages(fromNode, toRef) {
  if (!fromNode || fromNode.ghost) return false;
  return inSpace(fromNode.space, () => {
    const page = getPage(fromNode.path);
    if (!page) return false;
    let cut = 0;
    const strip = list => {
      for (let i = list.length - 1; i >= 0; i--) {
        const x = list[i];
        if (x.children) strip(x.children);
        const hits = linksIn(x.title)
          .some(t => trim(t.split("][")[0]).toLowerCase() === toRef.toLowerCase());
        if (!hits) continue;
        // A line that is only the link goes; a sentence that mentions it keeps
        // its words and loses the link, because the words are not ours to bin.
        if (trim(x.title.replace(/\[\[[^\]]+\]\]/g, "")) === "" && !(x.children || []).length) {
          list.splice(i, 1);
        } else {
          x.title = trim(x.title.replace(new RegExp("\\[\\[" +
            toRef.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\]\\[[^\\]]*)?\\]\\]", "gi"), ""))
            .replace(/\s{2,}/g, " ");
        }
        cut++;
      }
    };
    strip(page.blocks);
    if (cut) touch(fromNode.path);
    return cut > 0;
  });
}

/* Double-click opens the page here rather than leaving: the whole point of a
   plex is that you keep your place while you look around. */
function openPlexNode(g, nd) {
  /* A task node is a task. Opening it is the task panel the rest of the app
     uses, not a page dialog about a page it does not have. */
  if (nd.task) {
    const hit = inSpace(nd.space, () => findBlock(nd.blockId));
    if (hit) { openTaskDetail(hit.path, hit.block, nd.space); return; }
    notify("That task is no longer there.", "warn");
    return;
  }
  const {parents, children} = plexRelatives(g, nd.key);
  const open = nd.ghost ? 0 : inSpace(nd.space, () => {
    const page = getPage(nd.path);
    if (!page) return 0;
    let n = 0;
    walkBlocks(page.blocks, b => { if (OPEN_STATES[b.state] && !isMessage(b)) n++; });
    return n;
  });

  const listOf = (idxs, dir) => {
    if (!idxs.length) return el("div", {style: "color:var(--fg3);font-size:12.5px"},
      dir === "in" ? "Nothing points here yet." : "This points at nothing yet.");
    const box = el("div", {style: "display:flex;gap:6px;flex-wrap:wrap"});
    for (const i of idxs) {
      const other = g.nodes[i];
      box.append(el("button", {class: "chip filter", title: "Go there",
        onclick: () => { closeModal(); go("graph", {graphFocus: other.key}); }}, other.label));
    }
    return box;
  };

  modal({
    center: true,
    title: nd.label,
    hint: nd.ghost ? "no page yet" : (LINK_KIND_WORD[nd.kind] || nd.kind || "page"),
    body: el("div", {},
      nd.ghost ? el("div", {class: "field"},
        el("div", {style: "font-size:13.5px;color:var(--fg2)"},
          "Something links here, but no page has been made yet. Opening it makes one.")) : null,
      !nd.ghost && open ? el("div", {class: "field"},
        el("div", {style: "font-size:13.5px"}, open + " open task" + (open === 1 ? "" : "s") + " on this page.")) : null,
      el("div", {class: "field"}, el("label", {}, "Points here"), listOf(parents, "in")),
      el("div", {class: "field"}, el("label", {}, "Points at"), listOf(children, "out"))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Stay here"),
      el("button", {class: "btn ghost", onclick: () => { closeModal(); go("graph", {graphFocus: nd.key}); }},
        "Centre on it"),
      el("button", {class: "btn primary", onclick: () => {
        closeModal();
        if (nd.ghost) inSpace(nd.space, () => followLink(nd.ref));
        else openPageIn(nd.space, nd.path);
      }}, "Open the page"),
    ],
  });
}

/* A page made from the graph is a page like any other: a file with a title.
   It is linked to whatever you dragged it out of, so it is never born an
   orphan nobody can find again. */
function createNodeFrom(fromNode, name) {
  const title = trim(name);
  if (!title) return null;
  return inSpace(fromNode ? fromNode.space : null, () => {
    const path = findExistingPage(title) || (() => {
      const p = resolveWikiPath(title);
      putPage(p, pageTemplateFor(/^([^/]+)\//.test(title) ? title.split("/")[0] : "page",
                                 title.includes("/") ? title.split("/").slice(1).join("/") : title));
      return p;
    })();
    if (fromNode) linkPages(fromNode, pageRef(path));
    scanVerbs();
    return path;
  });
}


/* ---------- growing the mindmap downward ----------
   Enter on the middle makes a child, which on a mindmap means one of two
   things depending on what the middle is. Under a task, or under a project,
   the child is the next action -- the thing a mindmap of a project is for.
   Under any other page it is another page, linked, which is what dragging a
   dot out into space already does. */
function addSubActionTo(path, block, text) {
  const blk = stampAuthor(newBlock({state: "TODO", title: text, props: {Added: todayStamp()}}));
  createLinkedPages(blk.title);
  (block.children || (block.children = [])).push(blk);
  touch(path);
  return blk;
}

/* ---------- the context a new node lands in ----------
   You are standing in @phone when you hang a step off a project, so the step
   is a phone call: filing it anywhere else would be a lie, and asking every
   time turns a mindmap into a form. So it is filed where you are standing and
   the toast says so, with one button for the times it does not belong there.
   Ignore the toast and nothing happens, which is the point. */
function fileInCurrentContext(space, path, block, said) {
  if (!state.context || !block || hasContextLink(block.title)) return false;
  const ctx = state.context;
  const setTo = pick => inSpace(space, () => {
    block.title = trim(trim(block.title).replace(/\s*\[\[c\/[^\]]+\]\]/g, "")) + " [[c/" + pick + "]]";
    createLinkedPages(block.title);
    touch(path);
  });
  setTo(ctx);
  // One toast, not two: the thing that happened, and the one correction to it.
  notify((said ? said + ", " : "") + "filed under @" + ctx, "info", {
    label: "Not @" + ctx + "?",
    run: () => openContextPicker("Which context does this belong to?", pick => {
      if (pick === ctx) return;
      setTo(pick);
      notify("Moved to @" + pick);
      render();
    }),
  });
  return true;
}

/* ---------- editing a node where it sits ----------
   Space on a dot edits the thing the dot is: a task's line, a page's name.
   The mindmap is where you think, and a thought you cannot correct without
   leaving the picture is a thought you leave wrong. */
function plexEditNode(nd, after) {
  after = after || (() => render());
  if (!nd) return;
  if (nd.ghost) { notify("Make " + nd.label + " a page first, then there is something to edit.", "warn"); return; }
  if (nd.task) {
    const hit = inSpace(nd.space, () => findBlock(nd.blockId));
    if (!hit) { notify("That task is no longer there.", "warn"); return; }
    promptInput({
      title: "Edit this step", hint: inSpace(nd.space, () => pageTitle(hit.path)),
      label: "The line itself, links and all",
      value: hit.block.title, cta: "Save",
      onSave: text => {
        if (!trim(text)) { notify("A task with no words is not a task.", "warn"); return; }
        inSpace(nd.space, () => {
          hit.block.title = trim(text);
          createLinkedPages(hit.block.title);
          touch(hit.path);
        });
        after();
      },
    });
    return;
  }
  inSpace(nd.space, () => renamePrompt(nd.path));
}

function plexAddChild(nd, after) {
  after = after || (() => render());
  if (!nd) return;
  if (nd.ghost) { notify("Make " + nd.label + " a page first, then it can have children.", "warn"); return; }
  if (nd.task) {
    const hit = inSpace(nd.space, () => findBlock(nd.blockId));
    if (!hit) { notify("That task is no longer there.", "warn"); return; }
    promptInput({
      title: "Sub-action", hint: nd.label,
      label: "What is the next step inside this one?",
      value: "", cta: "Add",
      onSave: text => {
        if (!trim(text)) return;
        const blk = inSpace(nd.space, () => addSubActionTo(hit.path, hit.block, trim(text)));
        PLEX.cursor = (nd.space || "") + "\u0000" + hit.path + "\u0000#" + blk.id;
        if (!fileInCurrentContext(nd.space, hit.path, blk, "Added under " + nd.label))
          notify("Added under " + nd.label);
        after();
      },
    });
    return;
  }
  if (inSpace(nd.space, () => statusDirOf(nd.path))) {
    promptInput({
      title: "Next action", hint: nd.label,
      label: "What is the very next physical action?",
      value: "Call ", cta: "Add",
      onSave: text => {
        if (!trim(text)) return;
        const blk = inSpace(nd.space, () => addNextActionTo(nd.path, trim(text)));
        if (blk) PLEX.cursor = (nd.space || "") + "\u0000" + nd.path + "\u0000#" + blk.id;
        if (!fileInCurrentContext(nd.space, nd.path, blk, "Added to " + nd.label))
          notify("Added to " + nd.label);
        after();
      },
    });
    return;
  }
  plexNameModal(nd, () => after());
}

/* ---------- the plex screen ----------
   Two ways of looking at the same links, and the toggle says which: the map is
   the whole vault at once, the plex is one page and its neighbours. Neither is
   a different file format. */
const plexDefaultFocus = g => {
  if (state.graphFocus && g.nodes.some(n => n.key === state.graphFocus)) return state.graphFocus;
  const best = g.nodes.slice().sort((a, b) => b.deg - a.deg || a.label.localeCompare(b.label))[0];
  return best ? best.key : null;
};

/* Naming a new page is a line of text, so it is a line of text and not a form.
   The page is made in the space the node you dragged from lives in, which is
   the only space it could sensibly belong to. */
function plexNameModal(fromNode, after) {
  const input = el("input", {placeholder: "c/phone, p/Niclas, or just a name"});
  const done = () => {
    const name = trim(input.value);
    if (!name) { closeModal(); return; }
    closeModal();
    const path = createNodeFrom(fromNode, name);
    if (!path) return;
    notify("Made " + name + (fromNode ? " and linked it to " + fromNode.label : ""));
    after(path);
  };
  modal({
    center: true,
    title: "New page here",
    hint: fromNode ? "linked to " + fromNode.label : "",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Name"), input),
      el("div", {style: "font-size:12.5px;color:var(--fg3)"},
        "A prefix files it: c/ a context, p/ a person, o/ an org, z/ a note. " +
        "Without one it is a plain page.")),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: done}, "Make it"),
    ],
  });
  setTimeout(() => { input.focus(); input.onkeydown = e => { if (e.key === "Enter") done(); }; }, 0);
}

function viewPlex() {
  const c = el("div", {class: "wrap"});
  const g = plexGraph();
  const focusKey = plexDefaultFocus(g);
  state.graphFocus = focusKey;
  // The keyboard points at the middle until an arrow key moves it off.
  if (!PLEX.cursor || !g.nodes.some(n => n.key === PLEX.cursor)) PLEX.cursor = focusKey;
  const cv = el("canvas", {class: "graphcv"});
  const stage = el("div", {class: "graph plex"}, cv);
  const edit = () => !!state.graphEdit;

  const head = el("div", {class: "section", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap"},
    el("h2", {style: "margin:0;flex:1"},
      focusKey ? (g.nodes.find(n => n.key === focusKey) || {}).label : "Nothing linked yet"),
    el("button", {class: "btn sm ghost", onclick: () => go("graph", {graphMode: "map"})}, "Whole map"),
    el("button", {class: "btn sm " + (edit() ? "primary" : "ghost"),
      onclick: () => { state.graphEdit = !state.graphEdit; render(); }},
      edit() ? "Editing" : "Edit"));
  c.append(head, stage);

  if (!g.nodes.length) {
    c.append(el("div", {class: "section quiet"}, el("div", {style: "color:var(--fg3)"},
      "Nothing to draw yet. Pages join the plex as soon as something links to them.")));
    return c;
  }

  const keyline = el("span", {class: "glg"});
  c.append(el("div", {class: "graph-legend"},
    el("span", {class: "glg"}, "Above: what points here. Below: what this points at. Sides: shares a parent."),
    el("span", {class: "glg"}, "Round dot: a page. Square dot: a task, coloured by its state, hollow once it is closed."),
    keyline,
    el("span", {class: "glg quiet"}, edit()
      ? "Drag one dot onto another to link them. Drag into space, or double-click space, to make a page."
      : "Click a dot to move the middle. Double-click it to look at it without leaving. Space edits it.")));

  let hover = null;
  const targets = (w, h) => plexTargets(g, state.graphFocus, w, h);
  const kick = () => plexAnimate(cv, g, targets, () => hover);
  requestAnimationFrame(kick);

  const nodeAt = (e) => {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    let best = null, bestD = Infinity;
    for (const [k, p] of PLEX.pos) {
      const dx = p.x - px, dy = p.y - py, d = dx * dx + dy * dy;
      const reach = p.r + 10;
      if (d <= reach * reach && d < bestD) { best = k; bestD = d; }
    }
    return best;
  };
  const nodeOf = key => {
    const t = plexTargets(g, state.graphFocus, cv.clientWidth, cv.clientHeight).get(key);
    return t ? g.nodes[t.idx] : null;
  };
  const byKey = key => g.nodes.find(n => n.key === key) || null;

  /* Moving the middle redraws the whole screen rather than only the canvas:
     the relatives list below it is the same information, and a list that
     disagrees with the picture above it is worse than no list. The dots animate
     across anyway, because their positions outlive the redraw. */
  const recentre = key => {
    if (!key) return;
    state.graphFocus = key;
    PLEX.cursor = key;
    render();
  };

  const syncKeyline = () => {
    const cur = byKey(PLEX.cursor);
    const mid = PLEX.cursor === state.graphFocus;
    keyline.textContent = "Keys: arrows walk the dots, enter centres the one you are on"
      + ", enter on the middle adds a step under it, space edits it, o opens it"
      + ", backspace goes back up."
      + (cur ? "  On: " + cur.label + (mid ? " (the middle)" : "") : "");
  };
  syncKeyline();

  /* Arrow keys pick the nearest dot in the direction pressed, measured on the
     picture itself rather than along a list: the plex is a map, and up on a map
     means up. Straight ahead beats near, so pressing down from a project walks
     into its tasks instead of sideways into its siblings. */
  const step = (dx, dy) => {
    const w = cv.clientWidth, h = cv.clientHeight;
    const ts = targets(w, h);
    const fromKey = ts.has(PLEX.cursor) ? PLEX.cursor : state.graphFocus;
    const from = ts.get(fromKey);
    if (!from) return;
    let best = null, bestScore = Infinity;
    for (const [k, t] of ts) {
      if (k === fromKey) continue;
      const vx = t.x - from.x, vy = t.y - from.y;
      const along = vx * dx + vy * dy;
      if (along <= 8) continue;
      const across = Math.abs(vx * -dy + vy * dx);
      if (across > along * 2.6 + 40) continue;
      const score = along + across * 2.2;
      if (score < bestScore) { bestScore = score; best = k; }
    }
    if (!best) return;
    PLEX.cursor = best;
    syncKeyline();
    kick();
  };

  const onKey = e => {
    if (!cv.isConnected) { document.removeEventListener("keydown", onKey); return; }
    if ($("#modalRoot").firstChild) return;
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const arrows = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]};
    if (arrows[e.key]) { e.preventDefault(); step(arrows[e.key][0], arrows[e.key][1]); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (PLEX.cursor && PLEX.cursor !== state.graphFocus) { recentre(PLEX.cursor); return; }
      plexAddChild(byKey(state.graphFocus), () => render());
      return;
    }
    if (e.key === "Backspace") {
      e.preventDefault();
      const rel = plexRelatives(g, state.graphFocus);
      if (rel.parents.length) recentre(g.nodes[rel.parents[0]].key);
      else notify("Nothing points at this one, so there is no way back up.");
      return;
    }
    /* Space edits what the dot is; o opens it. Editing is the thing you reach
       for in the middle of thinking, so it gets the big key. */
    if (e.key === " ") {
      e.preventDefault();
      const nd = byKey(PLEX.cursor) || byKey(state.graphFocus);
      if (nd) plexEditNode(nd, () => render());
      return;
    }
    if (e.key === "o") {
      e.preventDefault();
      const nd = byKey(PLEX.cursor) || byKey(state.graphFocus);
      if (nd) openPlexNode(g, nd);
    }
  };
  // One listener at a time, however many times this screen is drawn.
  if (PLEX.key) document.removeEventListener("keydown", PLEX.key);
  PLEX.key = onKey;
  document.addEventListener("keydown", onKey);

  cv.addEventListener("mousemove", e => {
    if (PLEX.drag) {
      const r = cv.getBoundingClientRect();
      PLEX.drag.x = e.clientX - r.left;
      PLEX.drag.y = e.clientY - r.top;
      kick();
    }
    const k = nodeAt(e);
    if (k === hover && !PLEX.drag) return;
    hover = k;
    cv.style.cursor = k ? (edit() ? "grab" : "pointer") : "default";
    const nd = k ? nodeOf(k) : null;
    cv.title = nd ? nd.label + "  · " +
      (nd.task ? nd.state + " on " + pageTitle(nd.path) : nd.ghost ? "no page yet" : nd.path) : "";
    kick();
  });
  cv.addEventListener("mouseleave", () => { hover = null; PLEX.drag = null; kick(); });

  cv.addEventListener("mousedown", e => {
    if (!edit()) return;
    const k = nodeAt(e);
    if (!k) return;
    const r = cv.getBoundingClientRect();
    PLEX.drag = {from: k, x: e.clientX - r.left, y: e.clientY - r.top};
    e.preventDefault();
    kick();
  });
  cv.addEventListener("mouseup", e => {
    const d = PLEX.drag;
    PLEX.drag = null;
    if (!d) return;
    const onto = nodeAt(e);
    const fromNode = nodeOf(d.from);
    if (!fromNode) { kick(); return; }
    if (onto && onto !== d.from) {
      const toNode = nodeOf(onto);
      if (fromNode.task || toNode.task) {
        notify("Links join pages. To move a task, open it and refile it.", "warn");
        kick(); return;
      }
      const ref = toNode.ghost ? toNode.ref : inSpace(toNode.space, () => pageRef(toNode.path));
      if (fromNode.ghost) { notify("Make " + fromNode.label + " a page first, then it can link out.", "warn"); kick(); return; }
      if (linkPages(fromNode, ref)) { notify(fromNode.label + " now links to " + toNode.label); render(); }
      else { notify("That link is already there."); kick(); }
      return;
    }
    // Dragged out into nothing: a new child, born attached to what it came from.
    if (fromNode.ghost) { notify("Make " + fromNode.label + " a page first.", "warn"); kick(); return; }
    plexAddChild(fromNode, () => render());
  });

  /* A single click moves the middle and a double click opens the modal, so the
     single one waits long enough to find out which it was. Neither leaves the
     graph: looking around is the whole job of this screen. */
  let pending = null;
  cv.addEventListener("click", e => {
    const k = nodeAt(e);

    if (!k) return;
    pending = setTimeout(() => {
      pending = null;
      recentre(k);
    }, 200);
  });
  cv.addEventListener("dblclick", e => {
    if (pending) { clearTimeout(pending); pending = null; }
    const k = nodeAt(e);
    if (k) { const nd = nodeOf(k); if (nd) openPlexNode(g, nd); return; }
    if (edit()) plexNameModal(nodeOf(state.graphFocus), () => render());
  });

  /* The same relatives as buttons, because a canvas is invisible to a keyboard
     and to a screen reader, and because unlinking wants a list and not a drag. */
  const rel = plexRelatives(g, state.graphFocus);
  const here = g.nodes[rel.i];
  const sideList = (idxs, dir) => {
    const box = el("div", {class: "pagelist"});
    if (!idxs.length) {
      box.append(el("div", {class: "dash-item", style: "color:var(--fg3)"},
        dir === "in" ? "Nothing points here yet." : "This points at nothing yet."));
      return box;
    }
    for (const i of idxs) {
      const other = g.nodes[i];
      const row = el("div", {class: "dash-item"},
        el("button", {class: "nm", style: "all:unset;flex:1;cursor:pointer",
          onclick: () => go("graph", {graphFocus: other.key})}, other.label));
      if (edit() && here && !here.ghost && !here.task && !other.task && dir === "out")
        row.append(el("button", {class: "btn sm ghost", onclick: () => {
          const ref = other.ghost ? other.ref : inSpace(other.space, () => pageRef(other.path));
          if (unlinkPages(here, ref)) { notify("Unlinked " + other.label); render(); }
        }}, "Unlink"));
      box.append(row);
    }
    return box;
  };
  const panel = el("details", {class: "section", open: edit() ? "" : null},
    el("summary", {}, "The same relatives as a list"),
    el("div", {class: "field"}, el("label", {}, "Points here"), sideList(rel.parents, "in")),
    el("div", {class: "field"}, el("label", {}, "Points at"), sideList(rel.children, "out")));
  if (edit() && here && !here.ghost)
    panel.append(el("button", {class: "btn sm ghost", onclick: () => plexAddChild(here, () => render())},
      here.task || inSpace(here.space, () => statusDirOf(here.path))
        ? "Add a step under this one" : "Add a page linked to this one"));
  c.append(panel);
  return c;
}

function viewGraph() {

     the one you survey. The toggle is remembered in the view state, so coming
     back to the graph brings you back to the one you were using. */
  if (state.graphMode === "plex") return viewPlex();
  const c = el("div", {class: "wrap"});
  const g = graphData();
  const cv = el("canvas", {class: "graphcv"});
  const stage = el("div", {class: "graph"}, cv);

    el("i", {style: "background:transparent;box-shadow:inset 0 0 0 1.4px var(--fg3)"}), "No page yet"));

    el("div", {style: "color:var(--fg3);font-size:12.5px"},

      " more are in the vault - they are not drawn because past this many dots " +
      "the picture stops telling you anything.")));

      "Nothing to draw yet. Pages join the graph as soon as something links to them.")));
    return c;

  if (!g.edges.length) c.append(el("div", {class: "section quiet"},
    el("div", {style: "color:var(--fg3);font-size:12.5px"},
      "No links yet, so the pages float on their own. Type [[ in any line to link one " +
      "page to another, and the graph starts pulling them together.")));

     to clicks while it does. */

  let frames = 0;
  // Stale keys from deleted pages make a count meaningless; ask whether every
  // dot on screen already has a place, so one new page still settles properly.
  const maxFrames = g.nodes.every(n => GRAPH_POS.has(n.key)) ? 14 : 90;
  let temp = 26;                               // graph units, cooling each frame
  const tick = () => {
    if (!cv.isConnected) return;                 // the screen moved on

    const r = cv.getBoundingClientRect();

      const d = sx * sx + sy * sy;
