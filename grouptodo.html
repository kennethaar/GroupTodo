<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- No external resources, ever. This policy is the proof: the page cannot
     load a script, font or image from anywhere, and cannot send data to any
     host but the optional sync server on this machine. Safe to drop onto a
     corporate file share, intranet or managed laptop. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src data: blob:;
  connect-src 'self' http://127.0.0.1:* http://localhost:*;
  worker-src 'self';
  manifest-src 'self' blob:;
  form-action 'none';
  base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GroupTodo">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236aa3ff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%2306101f' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>GroupTodo</title>
<style>
/* ============================================================
   00_TOKENS
   ============================================================ */
:root{
  --bg:#0f1115; --bg2:#161920; --bg3:#1d212b; --bg4:#252a36;
  --fg:#e6e9ef; --fg2:#a4acbd; --fg3:#6d7689;
  --border:#252a36; --border2:#333a4a;
  --accent:#6aa3ff; --accent2:#2f6fd0; --accent-fg:#06101f;
  --todo:#6aa3ff; --doing:#c792ea; --wait:#e0b050; --done:#4fbf7b; --cancel:#6d7689;
  --late:#ff6b6b; --today:#e0b050; --ok:#4fbf7b; --warn:#e0b050; --danger:#ff6b6b;
  --ctx:#5ecfc0; --proj:#ff9f6b; --zet:#c792ea;
  --radius:10px; --radius-sm:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#fbfbfd; --bg2:#ffffff; --bg3:#f1f3f7; --bg4:#e6e9f0;
  --fg:#1b1f27; --fg2:#525b6d; --fg3:#858ea0;
  --border:#e2e6ee; --border2:#cfd5e1;
  --accent:#2f6fd0; --accent2:#2f6fd0; --accent-fg:#ffffff;
  --todo:#2f6fd0; --doing:#8b5cd6; --wait:#b57f12; --done:#1f9254; --cancel:#858ea0;
  --late:#d33; --today:#b57f12;
  --ctx:#0f8d7d; --proj:#c25b1e; --zet:#8b5cd6;
  --shadow:0 8px 32px rgba(20,30,60,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   05_LAYOUT
   ============================================================ */
#app{display:grid;grid-template-columns:248px 1fr;height:100dvh;overflow:hidden}
#sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 96px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* ---------- sidebar ---------- */
.brand{
  display:flex;align-items:center;gap:9px;padding:14px 16px 10px;
  font-weight:650;letter-spacing:-.2px;
}
.brand{width:100%;border-radius:0}
.brand:hover{background:var(--bg3)}
.brand .swap{margin-left:auto;color:var(--fg3);font-size:13px}
.brand .logo{
  width:24px;height:24px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;font-size:13px;color:#06101f;flex:none;font-weight:700;
}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--fg3);letter-spacing:0}
.nav{flex:1;overflow-y:auto;padding:4px 8px 12px}
.nav-group{margin-top:10px}
.nav-group>h3{
  margin:0;padding:6px 8px 4px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.9px;color:var(--fg3);
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;
  border-radius:var(--radius-sm);color:var(--fg2);font-size:13.5px;text-align:left;
}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--bg4);color:var(--fg);font-weight:550}
.nav-item .ic{width:17px;text-align:center;flex:none;font-size:13px;opacity:.95}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg3);
  background:var(--bg3);border-radius:20px;padding:1px 6px;min-width:20px;text-align:center;
}
.nav-item.active .cnt{background:var(--bg2)}
.nav-item .cnt.hot{background:rgba(255,107,107,.18);color:var(--late)}
.nav-item .key{font-family:var(--mono);font-size:10px;color:var(--fg3);opacity:.6}
.vaultbar{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}
.vaultbar .row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg3);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)}
.dot.sync{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;gap:10px;padding:12px 20px 10px;
  border-bottom:1px solid var(--border);background:var(--bg);flex:none;
}
header.top .burger{display:none}
.h-title{font-size:19px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;min-width:0}
.h-title .sub{font-size:12px;font-weight:400;color:var(--fg3)}
.h-sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--radius-sm);
  background:var(--bg3);color:var(--fg2);font-size:13px;border:1px solid transparent;white-space:nowrap;
}
.btn:hover{background:var(--bg4);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:550}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.ghost{background:none;border:1px solid var(--border2)}
.btn.danger{background:none;border:1px solid rgba(255,107,107,.42);color:var(--late)}
.btn.danger:hover{background:rgba(255,107,107,.14);color:var(--late)}
.btn.danger:disabled{opacity:.45;cursor:not-allowed}
.btn.danger:disabled:hover{background:none}
.btn.sm{padding:3px 8px;font-size:12px}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.6}

/* ============================================================
   10_NUDGES
   ============================================================ */
.nudgebar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.nudge{
  display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border);font-size:12.5px;color:var(--fg2);
}
.nudge:hover{border-color:var(--border2);color:var(--fg)}
.nudge b{font-variant-numeric:tabular-nums;color:var(--fg)}
.nudge.warn{background:rgba(224,176,80,.12);border-color:rgba(224,176,80,.3);color:var(--warn)}
.nudge.warn b{color:var(--warn)}
.nudge.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.32);color:var(--late)}
.nudge.danger b{color:var(--late)}
.nudge.ok{background:rgba(79,191,123,.1);border-color:rgba(79,191,123,.28);color:var(--ok)}

.hero{
  margin:14px 0 6px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);
}
.hero h2{margin:0 0 3px;font-size:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--fg3);font-weight:600}
.hero p{margin:0 0 12px;color:var(--fg2);font-size:13.5px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   15_TASK ROWS
   ============================================================ */
.section{margin:20px 0 0}
.section>h3{
  display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 2px;
  font-size:12px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);
}
.section>h3 .n{background:var(--bg3);border-radius:20px;padding:0 7px;font-size:11px;color:var(--fg2)}

/* Quiet sections: background material. They are here when you go looking for
   them, and they stay out of the way of the thing you are meant to act on. */
.section.quiet{margin-top:28px;opacity:.55;transition:opacity .15s ease}
.section.quiet:hover,.section.quiet:focus-within{opacity:1}
.section.quiet>h3{font-weight:550;letter-spacing:.6px;color:var(--fg3)}
.section.quiet>h3 .n{background:transparent;padding:0 2px;color:var(--fg3)}
.section.quiet>.card{background:transparent;border-style:dashed}

/* Folded sections: a record rather than the day's work. The heading is the
   disclosure, so "done today" and "captured today" are one line each until you
   actually want to look, instead of two full lists competing with what is open. */
.section.fold>summary{
  display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:2px;cursor:pointer;
  font-size:12px;font-weight:550;letter-spacing:.6px;text-transform:uppercase;color:var(--fg3);
  list-style:none;
}
.section.fold>summary::-webkit-details-marker{display:none}
.section.fold>summary::before{
  content:"\203A";display:inline-block;font-size:13px;line-height:1;
  transition:transform .12s ease;color:var(--fg3);
}
.section.fold[open]>summary::before{transform:rotate(90deg)}
.section.fold>summary:hover{color:var(--fg2)}
.section.fold>summary .n{padding:0 2px;font-size:11px;color:var(--fg3)}
/* Opened on purpose, so it is no longer background material. */
.section.fold[open]{opacity:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.empty{padding:16px;color:var(--fg3);font-size:13px;text-align:center}

.task{
  display:flex;align-items:flex-start;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--border);position:relative;
}
.task:last-child{border-bottom:none}
.task:hover{background:var(--bg3)}
.task.sel{background:var(--bg4)}
.chk{
  width:19px;height:19px;border-radius:50%;border:1.6px solid var(--fg3);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s;
}
.chk:hover{border-color:var(--done);color:var(--fg3)}
.task[data-state="DONE"] .chk{background:var(--done);border-color:var(--done);color:#06210f}
.task[data-state="CANCELLED"] .chk{background:var(--cancel);border-color:var(--cancel);color:#fff}
.task[data-state="WAIT"] .chk{border-color:var(--wait);color:var(--wait)}
.task[data-state="DOING"] .chk{border-color:var(--doing);color:var(--doing)}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;word-wrap:break-word;overflow-wrap:anywhere}
.task[data-state="DONE"] .t-title,.task[data-state="CANCELLED"] .t-title{color:var(--fg3);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:20px;
  background:var(--bg3);color:var(--fg3);border:1px solid transparent;white-space:nowrap;
}
.chip.ctx{color:var(--ctx);background:rgba(94,207,192,.11)}
.chip.proj{color:var(--proj);background:rgba(255,159,107,.11)}
.chip.late{color:var(--late);background:rgba(255,107,107,.13)}
.chip.today{color:var(--today);background:rgba(224,176,80,.13)}
.chip.miss{color:var(--warn);background:rgba(224,176,80,.1);border-color:rgba(224,176,80,.3)}
.chip.age{font-family:var(--mono);font-size:10.5px}
.chip.who{color:var(--zet);background:rgba(199,146,234,.12)}
/* State filters: checkboxes, so several can be on at once. Off is legible
   rather than invisible -- a filter you cannot see is a bug report later. */
.statefilter{display:flex;gap:8px;flex-wrap:wrap}
.chip.filter{cursor:pointer;font-size:12px;padding:5px 11px;border:1px solid var(--border);
  background:transparent;color:var(--fg3);user-select:none}
.chip.filter:hover{color:var(--fg2)}
.chip.filter.on{color:var(--fg);background:var(--bg3);border-color:var(--accent)}
/* Where you are, kept on screen. Picking a context changed what the app showed
   and then said nothing about it, so it was impossible to tell you had one or
   to get rid of it. */
/* A thread reads as a conversation, not as more task rows: no checkboxes, the
   author and the time on top, and unread marked on the edge so a glance finds it. */
.thread{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;padding-right:4px}
/* Bubbles, with the name and time OUTSIDE them: a bubble holds what was said.
   Mine sit on the right in the accent, theirs on the left in the panel grey --
   the two-sided arrangement everybody already reads without being taught. */
.msg{display:flex;gap:9px;align-items:flex-end;padding:1px 2px}
.msg.cont{margin-top:1px}
.msg.mine{flex-direction:row-reverse}
.msg-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.mine .msg-main{align-items:flex-end}
.msg-head{display:flex;align-items:baseline;gap:7px;font-size:11px;color:var(--fg3);
  margin:6px 0 2px;padding:0 4px}
.msg-head .who{font-weight:600;color:var(--fg2);font-size:12.5px}
.msg-head .seen{color:var(--fg3);opacity:.8}
.bubble{position:relative;display:flex;align-items:flex-start;gap:4px;
  background:var(--bg3);border-radius:14px 14px 14px 4px;padding:8px 12px;max-width:min(46ch,88%)}
.msg.cont .bubble{border-radius:14px 14px 14px 14px}
.msg.mine .bubble{background:var(--accent);border-radius:14px 14px 4px 14px}
.msg.mine .msg-body{color:var(--accent-fg)}
.msg-body{font-size:13.5px;color:var(--fg);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-flags{font-size:11px;color:var(--warn);margin:3px 4px 0}
/* One face per speaker; a run of messages from the same person keeps the
   indent but drops the repeat. */
.avatar{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:#06101f;letter-spacing:.02em;
  object-fit:cover;background:var(--bg3)}
.avatar.ghost{background:none}
/* A day line and an unread line, both rules with a word sitting on them. */
.msg-day,.msg-new{display:flex;align-items:center;gap:10px;margin:10px 0 4px;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.msg-day{color:var(--fg3)}
.msg-new{color:var(--accent)}
.msg-day::before,.msg-day::after,.msg-new::before,.msg-new::after{
  content:"";flex:1;height:1px;background:var(--border)}
.msg-new::before,.msg-new::after{background:var(--accent);opacity:.45}
.flagbtn{background:none;border:0;cursor:pointer;color:transparent;font-size:12px;padding:0;
  flex:none;line-height:1.5;align-self:flex-start}
.msg:hover .flagbtn{color:var(--fg3)}
.msg.mine:hover .flagbtn{color:rgba(6,16,31,.55)}
.flagbtn:hover{color:var(--warn)}
.flagbtn.on,.msg.mine .flagbtn.on{color:var(--warn)}
/* The all-conversations list. */
/* Anybody who has asked their system for less movement gets less movement. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}
/* display on a class beats the user agent's [hidden]{display:none}, so without
   this a hidden "show all" stays in the row as an empty strip you can press --
   the same trap the context chip fell into. */
/* ---------- focus ----------
   Not a different screen: the same screen with everything that is not the work
   taken away. The sidebar, the chips, the nudges and the counts all go, the
   column narrows to a readable measure, and what is left is the list and the
   box you type into. Escape, or the button again, brings it all back. */
/* #app is a two column grid, so hiding the sidebar alone drops #content into
   the 248px column it vacated. The column has to go with it. */
body.focus #app{grid-template-columns:1fr}
body.focus #sidebar{display:none}
body.focus .burger{display:none}
body.focus .h-title .sub{display:none}
body.focus #btnTheme,body.focus #btnSearch{display:none}
body.focus .wrap{max-width:46rem;margin-inline:auto}
body.focus .nudgebar,body.focus .coach,body.focus .hero{display:none}
body.focus .section.quiet{display:none}
body.focus .t-act{opacity:0;transition:opacity .12s ease}
body.focus .task:hover .t-act,body.focus .task:focus-within .t-act{opacity:1}
body.focus .chip.miss,body.focus .chip.age{display:none}
body.focus #btnFocus{color:var(--accent);border-color:var(--accent)}
body.focus .statefilter{display:none}
@media (min-width:900px){ body.focus #content{padding-top:8px} }

/* ---------- advanced reads as text ----------
   Advanced is the outliner half, and an outliner is a text file you can see.
   Chrome that is useful in Simple -- rounded cards, filled state pills, hover
   lifts -- fights that, so in Advanced the rows flatten to lines, the badges
   become the words they stand for, and the type goes monospace where the file
   itself would be. */
body.adv .card{background:transparent;border-color:transparent;border-radius:0}
body.adv .task{border-radius:0;padding-block:5px}
body.adv .task:hover{background:var(--bg2)}
body.adv .t-title{font-family:var(--mono);font-size:12.5px;line-height:1.5}
body.adv .state{background:transparent;padding:0 2px;font-family:var(--mono);font-size:11px;
  letter-spacing:.5px;border-radius:0}
body.adv .state.btn:hover{box-shadow:none;text-decoration:underline}
body.adv .chip{background:transparent;border-color:transparent;font-family:var(--mono);
  font-size:11px;padding:0 3px}
body.adv .chip.proj::before{content:"@@"}
body.adv .chip.ctx{opacity:.85}
body.adv .prow,body.adv .dash-item{font-family:var(--mono);font-size:12.5px}
body.adv .section>h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em}
body.adv .chk{border-radius:2px}
.showmore[hidden]{display:none}
.showmore{display:block;width:100%;text-align:center;background:none;border:0;cursor:pointer;
  border-top:1px solid var(--border);color:var(--accent);font-size:12.5px;padding:10px}
.showmore:hover{background:var(--bg3)}
/* One more page, or the lot. Two buttons side by side rather than one that
   changes meaning, so neither press is a surprise. */
.showmorerow{display:flex;width:100%;border-top:1px solid var(--border)}
/* width:100% from .showmore would make both buttons claim the whole row, so
   the first one ends up a one-word-wide column. Inside the row, width is the
   flex box's business. */
.showmorerow .showmore{border-top:0;width:auto;min-width:0;flex:1 1 auto}
.showmorerow .showmore.all{flex:0 0 auto;padding-left:18px;padding-right:18px;color:var(--fg3);
  border-left:1px solid var(--border);white-space:nowrap}
.showmorerow .showmore.all:hover{color:var(--accent)}
.chatrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  padding:11px 12px;background:none;border:0;border-top:1px solid var(--border);color:inherit}
.chatrow:first-child{border-top:0}
.chatrow:hover{background:var(--bg3)}
.chatrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chatrow-top{display:flex;align-items:baseline;gap:8px}
.chatrow-top .task{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow-top .when{margin-left:auto;font-size:11px;color:var(--fg3);flex:none}
.chatrow-last{font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow-last .who{color:var(--fg3)}
.chatrow-where{font-size:11px;color:var(--fg3)}
.chatrow.unread .chatrow-last{color:var(--fg)}
.chatrow-marks{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
@media (max-width:560px){.chatrow-where{display:none}}
.chip.msg{color:var(--fg3)}
.chip.msg.unread{color:var(--accent);background:rgba(106,163,255,.14)}
.chip.flagged{color:var(--warn);background:rgba(224,176,80,.13)}
.toast .act{background:none;border:1px solid var(--border2);color:var(--accent);
  border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;margin-left:8px}
.toast .act:hover{background:var(--bg3)}
/* display on a class beats the user agent's [hidden]{display:none}, so without
   this the chip sat in the header as an empty 22px pill you could click. */
.ctxnow[hidden]{display:none}
.ctxnow{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;
  border-radius:20px;cursor:pointer;white-space:nowrap;
  color:var(--ctx);background:rgba(94,207,192,.12);border:1px solid rgba(94,207,192,.35)}
.ctxnow:hover{background:rgba(94,207,192,.2)}
.ctxnow .x{color:var(--fg3);font-size:13px;line-height:1}
.ctxnow .x:hover{color:var(--fg)}
@media (max-width:560px){.ctxnow{max-width:9rem;overflow:hidden;text-overflow:ellipsis}}
.chip.st{font-family:var(--mono);font-size:10px;letter-spacing:.5px}

/* ---------- board, calendar, graph ----------
   Three more ways to look at exactly the same blocks. Nothing here holds its
   own copy of anything: a card, a calendar entry and a dot are all the same
   line in the same markdown file, seen from a different angle. */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px;
  align-items:start}
.bcol{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  min-height:120px;display:flex;flex-direction:column;overflow:hidden}
.bcol.over{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bcol-head{display:flex;gap:8px;align-items:center;padding:10px 12px;
  border-bottom:1px solid var(--border);background:var(--bg3)}
.bcol-head .n{margin-left:auto;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.bcol-body{display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto;
  max-height:min(68vh,760px)}
/* Inside a board column the row sits among the cards, so it keeps the padding
   but loses the divider that separates it from a card list. */
.bcol-body .showmorerow{border-top:0}
.bcol-body .showmore{font-size:11.5px;padding:6px 4px}
.bcard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 10px;cursor:pointer;text-align:left;width:100%;display:block}
.bcard:hover{border-color:var(--border2);background:var(--bg4)}
.bcard-title{font-size:13px;color:var(--fg);line-height:1.35;overflow-wrap:anywhere}
.bcard-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bcard-meta:empty{display:none}
.bcard.dragging{opacity:.4}
@media (max-width:860px){
  /* Four columns on a phone is four slivers. One column each, stacked, and the
     state buttons in the detail panel do the moving -- dragging on a touch
     screen fights the scroll. */
  .board{grid-template-columns:1fr}
  .bcol-body{max-height:none}
}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-top:4px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden}
.cal-dow{background:var(--bg3);color:var(--fg3);font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;padding:6px 8px;text-align:center}
.cal-day{background:var(--bg2);min-height:92px;padding:5px 5px 7px;display:flex;
  flex-direction:column;gap:3px;width:100%;text-align:left;cursor:pointer}
.cal-day:hover{background:var(--bg3)}
.cal-day.out{background:var(--bg);opacity:.5}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.picked{background:var(--bg4)}
.cal-num{font-size:11px;color:var(--fg3);font-family:var(--mono);text-align:right}
.cal-day.today .cal-num{color:var(--accent);font-weight:700}
.cal-items{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-item{display:block;font-size:11.5px;line-height:1.25;
  padding:3px 5px;border-radius:5px;background:var(--bg3);color:var(--fg2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item.late{color:var(--late);background:rgba(255,107,107,.12)}
.cal-more{font-size:10.5px;color:var(--fg3);padding-left:5px}
@media (max-width:700px){
  /* Seven columns of readable titles do not fit on a phone, and a line of text
     shrunk until it fits is not readable either. The squares become dots --
     how many, and whether any are late -- and tapping a day lists it below. */
  .cal-day{min-height:54px;gap:4px}
  .cal-items{flex-direction:row;flex-wrap:wrap;gap:3px;justify-content:flex-end}
  .cal-item{font-size:0;width:7px;height:7px;padding:0;border-radius:50%;
    background:var(--todo)}
  .cal-item.late{background:var(--late)}
  .cal-more{font-size:9.5px;padding:0}
}

/* ---------- gantt ----------
   A label column and a track, with the bar placed by percentage across the
   track. Today is a CSS variable rather than one overlay, so each row draws its
   own slice of the same line and it lands in the right place. */
.gantt{--glabelw:230px;margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg2);overflow:hidden}
.ghead{display:flex;align-items:stretch;height:30px;border-bottom:1px solid var(--border);
  background:var(--bg3)}
.gbody{display:flex;flex-direction:column}
.grow{display:flex;align-items:stretch;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--border);cursor:pointer;color:inherit;padding:0;min-height:30px}
.gbody .grow:first-child{border-top:0}
.grow:hover{background:var(--bg3)}
.glabel{flex:0 0 var(--glabelw);min-width:0;display:flex;gap:6px;align-items:center;
  padding:5px 10px;font-size:12.5px;color:var(--fg);overflow:hidden}
/* text-overflow does nothing on a flex container, so the name needs a box of
   its own to be clipped in. */
.glabel .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glabel .caret{color:var(--fg3);font-size:10px;flex:none}
.glabel .n{margin-left:auto;font-size:10.5px;color:var(--fg3);font-family:var(--mono);flex:none;
  padding-left:6px}
.glabel.sub{padding-left:28px;color:var(--fg2);font-size:12px}
/* overflow:hidden so the last month label does not hang off the right edge;
   every bar is already clamped to 0-100%, so nothing real is cut. */
.gtrack{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
.gtrack::before{content:"";position:absolute;top:0;bottom:0;left:var(--gnow,-10%);width:1px;
  background:var(--accent);opacity:.45}
.gtick{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.gmon{position:absolute;top:7px;font-size:10.5px;color:var(--fg3);padding-left:5px;
  white-space:nowrap;letter-spacing:.3px}
.gbar{position:absolute;top:7px;height:16px;border-radius:4px;background:var(--fg3);
  overflow:hidden;display:flex;align-items:center}
.gbar.TODO{background:var(--todo)}
.gbar.DOING{background:var(--doing)}
.gbar.WAIT{background:var(--wait)}
.gbar.DONE{background:var(--done);opacity:.65}
.gbar.CANCELLED{background:var(--cancel);opacity:.5}
.gbar.late{background:var(--late)}
.glabelin{font-size:10.5px;color:var(--accent-fg);padding:0 6px;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.grow.group .gbar{height:11px;top:9px;border-radius:3px;opacity:.85}
/* ---------- dragging a bar, and the chain between projects ----------
   A bar you can move has to look like one before it is touched: the grab
   cursor and the two end handles are the whole affordance. touch-action is
   what stops a drag on a phone from scrolling the page instead. */
.gbar.movable{cursor:grab;touch-action:none}
.gbar.movable:active,.gbar.dragging{cursor:grabbing}
.gbar.dragging{box-shadow:0 0 0 2px var(--accent);z-index:4;opacity:.95}
.grow.movable:focus-visible .gbar{box-shadow:0 0 0 2px var(--accent)}
.ghandle{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;
  touch-action:none;opacity:0;background:var(--accent)}
.ghandle.l{left:0}
.ghandle.r{right:0}
.gbar.movable:hover .ghandle,.gbar.dragging .ghandle{opacity:.55}
.ghandle:hover{opacity:.95!important}
/* The dates follow the pointer while the bar moves, because a bar halfway
   between two month ticks does not tell you which day you have landed on. It
   is fixed to the window rather than parented to the bar: .gtrack clips, so a
   label sitting above a bar would be sliced off at the row boundary. */
.gtip{position:fixed;z-index:80;transform:translate(-50%,-150%);
  font-family:var(--mono);font-size:11px;white-space:nowrap;padding:3px 7px;
  border-radius:5px;background:var(--fg);color:var(--bg);pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
/* The part of a bar standing to the left of its gate: it is scheduled during
   something it is supposed to be waiting for. */
.gbar.clash{background-image:repeating-linear-gradient(135deg,
  rgba(0,0,0,0) 0 5px, rgba(255,255,255,.38) 5px 10px)}
.ggate{position:absolute;top:2px;bottom:2px;width:2px;background:var(--fg3);opacity:.7}
.ggate::after{content:"";position:absolute;top:0;left:-3px;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid var(--fg3)}
.ggate.bad,.ggate.bad::after{background:var(--late);border-top-color:var(--late)}
.gdep{color:var(--fg3);font-size:11px;flex:none;cursor:help}
.glinks{position:absolute;inset:0;pointer-events:none;z-index:3}
.gbody{position:relative}
.garrows{position:absolute;top:0;left:0;overflow:visible}
.garrow{fill:none;stroke:var(--fg3);stroke-width:1.2;opacity:.75}
.garrow.bad{stroke:var(--late);opacity:.95}
.garrowhead{fill:var(--fg3);opacity:.75}
.garrowhead.bad{fill:var(--late);opacity:.95}

@media (max-width:700px){
  /* A 230px label beside a track leaves no track. Half the width, smaller type. */
  .gantt{--glabelw:118px}
  .glabel{font-size:11.5px;padding:5px 6px}
  .glabel.sub{padding-left:14px}
  .glabel .n{display:none}
  .glabelin{display:none}
  /* Fingers, not a mouse: the handles stay out but the bar itself is the
     target, and 11px of grab area either side of a 16px bar is a trap. */
  .ghandle{display:none}
}

/* ---------- report ---------- */
.reportsum{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--fg2);
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px}
.reportsum b{color:var(--fg);font-size:17px}
.reprow{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;
  border:0;border-top:1px solid var(--border);padding:8px 12px;cursor:pointer;color:inherit}
.reprow:first-child{border-top:0}
.reprow:hover{background:var(--bg3)}
.reprow .when{flex:0 0 92px;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.reprow .what{flex:1 1 auto;min-width:0;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.reprow .marks{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap}
@media (max-width:700px){
  .reprow{flex-wrap:wrap;gap:4px}
  .reprow .when{flex:0 0 100%}
  .reprow .what{flex:0 0 100%}
}
/* The surroundings grid: three columns, four rows, the todo in the middle of
   the middle. Each cell is a hit area and not a decoration, so the whole thing
   is the navigation as well as the picture. */
.around{display:grid;gap:6px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);
  grid-template-rows:auto auto auto auto;
  grid-template-areas:
    "tags project sibs"
    "tags parent  sibs"
    "tags self    sibs"
    "kids kids    kids"}
.acell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.acell.a-project{grid-area:project}
.acell.a-parent{grid-area:parent}
.acell.a-self{grid-area:self;border-color:var(--accent);
  background:color-mix(in srgb, var(--bg2) 88%, var(--accent) 12%)}
.acell.a-tags{grid-area:tags}
.acell.a-sibs{grid-area:sibs;justify-content:center}
.acell.a-kids{grid-area:kids;flex-direction:row;flex-wrap:wrap;align-items:center}
.acell.a-kids .alab{flex:0 0 100%}
.alab{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg3)}
.achip{display:block;text-align:left;font-size:12.5px;color:var(--fg2);
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:3px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:pointer}
.achip:hover{color:var(--fg);border-color:var(--border2)}
.acell.a-kids .achip{display:inline-block;width:auto}
/* A project further up the chain is the setting, not the thing: quieter, so the
   one this todo actually sits in is the one you read first. */
.achip.up{color:var(--fg3);font-size:11.5px}
.achip.ctx{color:var(--ctx);border-color:color-mix(in srgb, var(--ctx) 45%, var(--border))}
.achip.want{color:var(--fg3);border-style:dashed}
.achip.done{opacity:.55;text-decoration:line-through}
.around:focus{outline:none}
.around.picking{box-shadow:0 0 0 1px var(--accent) inset;border-radius:var(--radius)}
.achip:focus-visible,.around.picking .achip:focus{outline:none;
  border-color:var(--accent);color:var(--fg);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent)}
/* What the question is about, above the box you answer it in. */
.prov{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 11px;margin-bottom:12px}
.provhead{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--fg)}
.provnote{font-size:12.5px;color:var(--fg3);margin-top:6px}
.provlist{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.provrow{display:flex;gap:9px;align-items:baseline;text-align:left;width:100%;
  padding:4px 7px;border-radius:6px;font-size:12.5px;color:var(--fg2);cursor:pointer}
.provrow:hover{background:var(--bg3);color:var(--fg)}
.provrow .nm{flex:1;overflow-wrap:anywhere}
.provrow .p{color:var(--fg3);font-size:11.5px;white-space:nowrap}
.ahint{font-size:11.5px;color:var(--fg3);margin-top:6px}
.around{position:relative}
/* One ring that travels, rather than a highlight that teleports. */
.aring{position:absolute;left:0;top:0;pointer-events:none;opacity:0;border-radius:7px;
  border:1.5px solid var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  transition:transform .16s cubic-bezier(.2,.8,.3,1), width .16s, height .16s, opacity .12s}
.aring.on{opacity:1}
.achip{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.achip.aself{font-size:13.5px;font-weight:600;color:var(--fg);white-space:normal;
  overflow-wrap:anywhere;text-overflow:clip;background:transparent;border:none;padding:0}
.achip.aself:hover{border:none}
@media (prefers-reduced-motion: reduce){
  .aring,.achip{transition:none}
}
.aself{font-size:13.5px;font-weight:600;color:var(--fg);overflow-wrap:anywhere}
.anone{font-size:12px;color:var(--fg3)}
/* On a phone the three columns are a row of slivers, so the same cells stack in
   reading order instead: what it belongs to, what it is, what is around it. */
@media (max-width:620px){
  .around{grid-template-columns:1fr;
    grid-template-areas:"project" "parent" "self" "tags" "sibs" "kids"}
  .acell.a-tags,.acell.a-sibs,.acell.a-kids{flex-direction:row;flex-wrap:wrap;align-items:center}
  .acell.a-tags .alab,.acell.a-sibs .alab,.acell.a-kids .alab{flex:0 0 100%}
  .achip{display:inline-block;width:auto}
}
.graph{margin-top:14px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);height:min(66vh,620px);overflow:hidden}
.graphcv{display:block;width:100%;height:100%}
/* The plex leans on depth rather than on a legend: a light middle and dark
   edges, so the dots that are small and faint read as further away instead of
   just smaller. */
.graph.plex{background:
  radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--bg2) 72%, var(--fg) 6%) 0%,
                  var(--bg2) 58%, color-mix(in srgb, var(--bg2) 86%, #000 14%) 100%)}
.graph.plex .graphcv{user-select:none}
.graph-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:9px;
  font-size:11.5px;color:var(--fg3)}
.glg{display:inline-flex;gap:5px;align-items:center}
.glg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.glg.quiet{margin-left:auto}
.pagelist{display:flex;flex-direction:column;margin-top:6px;
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.pagelist .nm{flex:1;overflow-wrap:anywhere}
details>summary{cursor:pointer;font-size:12.5px;color:var(--fg3);padding:2px 0}
details>summary:hover{color:var(--fg2)}
@media (max-width:700px){.graph{height:min(52vh,430px)}.glg.quiet{margin-left:0}}
.chip.spacechip{border-style:solid;border-width:1px;background:transparent;font-weight:600}
.spacetoggle{
  width:19px;height:19px;border-radius:5px;border:1.6px solid var(--border2);flex:none;
  display:grid;place-items:center;font-size:11px;color:transparent;margin-right:2px;
}
.spacetoggle.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.spacetoggle:hover{border-color:var(--accent)}

/* ---------- space colours ---------- */
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{
  width:26px;height:26px;border-radius:50%;flex:none;padding:0;
  display:grid;place-items:center;font-size:12px;font-weight:700;
  border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);
}
.swatch:hover{border-color:var(--border2)}
.swatch.on{border-color:var(--fg)}
.swatches .sep{width:1px;height:20px;flex:none;background:var(--border2);margin:0 3px}
/* A native colour well, cropped to the same round chip as the swatches. */
.colorwell{
  position:relative;width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--border2);
}
.colorwell.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);border:2px solid var(--fg)}
/* Unselected, the well advertises itself as "some other colour". */
.colorwell:not(.on)::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;color:#fff;mix-blend-mode:difference;pointer-events:none;
}
.colorwell input[type=color]{
  position:absolute;left:-25%;top:-25%;width:150%;height:150%;
  padding:0;border:none;background:none;cursor:pointer;
}
.colorwell input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.colorwell input[type=color]::-webkit-color-swatch{border:none}
.colorwell input[type=color]::-moz-color-swatch{border:none}
.colordot{
  width:13px;height:13px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.32);
}
.cpreview{display:flex;align-items:center;gap:9px;margin-top:10px}
.cpreview .avatar{
  width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;
}
.swatches .hexinput{
  width:94px;font-family:var(--mono);font-size:12px;padding:5px 8px;text-transform:lowercase;
}
.chip.b{cursor:pointer}
.chip.b:hover{border-color:var(--border2);color:var(--fg2)}
.t-act{display:flex;gap:2px;opacity:0;flex:none;transition:.12s}
.task:hover .t-act,.task.sel .t-act{opacity:1}
.iconbtn{
  width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--fg3);font-size:13px;
}
.iconbtn:hover{background:var(--bg4);color:var(--fg)}
@media (hover:none){.t-act{opacity:1}}

/* ---------- outliner ---------- */
.outline{padding:10px 12px}
.blk{padding-left:18px;position:relative}
.blk>.line{display:flex;align-items:flex-start;gap:7px;padding:2px 0;border-radius:4px}
.blk>.line:hover{background:var(--bg3)}
.bullet{
  position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--fg3);flex:none;cursor:pointer;
}
.blk.has-kids>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk.collapsed>.bullet{box-shadow:0 0 0 3.5px var(--bg4)}
.blk .txt{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:anywhere;font-size:14px;padding:1px 0}
/* A dropped picture shows at a size you can read a line around, and clicking
   it opens the file itself. */
.txt img.asset,.note img.asset{display:block;max-width:min(100%,520px);max-height:360px;
  margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:zoom-in}
.asset-file{display:inline-flex;align-items:center;gap:4px;max-width:100%}
.asset-missing{color:var(--warn,#b45309);font-size:12px;word-break:break-all}
.blk .txt.dropping{outline:2px dashed var(--accent,#2563eb);outline-offset:2px;border-radius:4px}
.blk .txt[contenteditable]{outline:none}
.blk .props{font-family:var(--mono);font-size:11px;color:var(--fg3);padding-left:0;margin:1px 0 2px}
.blk .bodyline{font-size:13px;color:var(--fg2);white-space:pre-wrap}
.state{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:1px 5px;border-radius:4px;flex:none;margin-top:2px;cursor:pointer;
}
.state.TODO{background:rgba(106,163,255,.16);color:var(--todo)}
.state.DOING{background:rgba(199,146,234,.16);color:var(--doing)}
.state.WAIT{background:rgba(224,176,80,.16);color:var(--wait)}
.state.DONE{background:rgba(79,191,123,.14);color:var(--done)}
.state.CANCELLED{background:var(--bg4);color:var(--cancel)}
.state.none{
  background:transparent;color:var(--fg3);opacity:0;border:1px dashed var(--border2);
  padding:0 4px;transition:opacity .12s;
}
.blk>.line:hover .state.none,.state.none:focus{opacity:1}
/* The badge is a control wherever it is clickable, and it keeps the focus ring
   after the redraw so the next space bar cycles it again. */
.state.btn{padding:2px 6px}   /* a thumb-sized target: on a list row the badge is the control */
.state.btn:hover{box-shadow:inset 0 0 0 1px currentColor}
.state:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.tag{color:var(--ctx);cursor:pointer}
.tag:hover{text-decoration:underline}
.wikilink{color:var(--accent);cursor:pointer}
.wikilink:hover{text-decoration:underline}
.wikilink.ctx{color:var(--ctx)} .wikilink.zet{color:var(--zet)} .wikilink.proj{color:var(--proj)}
/* A door into the app rather than a page: [[go/todos]]. Drawn as something to
   press, because that is what it is. */
.wikilink.go{
  display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 8px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border2);white-space:nowrap;
}
.wikilink.go:hover{background:var(--bg4);text-decoration:none}
code{font-family:var(--mono);font-size:.9em;background:var(--bg3);padding:1px 4px;border-radius:4px}

/* ---------- project/page list ---------- */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--bg3)}
.prow .st{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:11px;font-weight:700;
}
.st-1{background:rgba(106,163,255,.16);color:var(--todo)}
.st-3{background:rgba(224,176,80,.16);color:var(--wait)}
.st-2{background:var(--bg4);color:var(--fg3)}
.st-0{background:rgba(79,191,123,.14);color:var(--done)}
.st--{background:var(--bg4);color:var(--cancel)}
.prow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:11.5px;color:var(--fg3)}

/* ============================================================
   20_MODALS
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.scrim.center{align-items:center}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:14px 14px 0 0;
  width:min(640px,100%);max-height:86dvh;display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;
}
.scrim.center .modal{border-radius:14px}
.modal header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex:none;
}
.modal header h2{margin:0;font-size:15px;font-weight:650}
.modal header .hint{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
.modal .body{overflow-y:auto;padding:10px 0;flex:1}
.modal .foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex:none}
.pick{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 16px;text-align:left;font-size:14px;color:var(--fg2);
}
.pick:hover,.pick.cur{background:var(--bg3);color:var(--fg)}
/* The row the keys are pointing at. A list you type into has to show you where
   it thinks you are, or Enter is a guess. */
.pick.on{background:var(--bg3);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.pick.on .k{color:var(--accent)}
/* A row that holds its own buttons cannot itself be one, so the name inside it
   carries the link instead -- same hit area, same look, one fewer nested button. */
.linky{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;min-width:0}
.linky:hover{color:var(--accent)}
.pick .k{
  font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;flex:none;
  background:var(--bg4);color:var(--fg3);display:grid;place-items:center;
}
.pick:hover .k,.pick.cur .k{background:var(--accent);color:var(--accent-fg)}
/* In a list you type the name into, the rows have no letters, so the badge
   keeps the gutter and stops being a thing: an empty box in every row reads as
   a checkbox nobody ticked. */
.pick .k:empty{background:transparent;box-shadow:none}
.pick .d{margin-left:auto;font-size:11.5px;color:var(--fg3)}
/* The [[ list. Fixed rather than absolute so it is positioned against the
   caret's own viewport rectangle, and above everything, because it hangs over
   whatever line you are typing on. */
.linkpop{
  position:fixed;z-index:240;min-width:230px;max-width:330px;max-height:244px;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);padding:4px 0;
}
.linkpop .pick{padding:6px 11px;font-size:13px}
.linkpop .pick .k{width:22px;height:18px;font-size:10px}
.filterbox{padding:0 16px 8px}
.filterbox input,.field input,.field textarea,.field select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:14px;outline:none;
}
.filterbox input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field{padding:8px 16px}
.field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);margin-bottom:5px}
.field textarea{resize:vertical;min-height:70px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  padding:6px 11px;border-radius:var(--radius-sm);background:var(--bg3);font-size:12.5px;
  font-family:var(--mono);color:var(--fg3);border:1px solid transparent;
}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
.seg button:hover{border-color:var(--border2)}

/* review / dashboards */
.dash-sec{border-bottom:1px solid var(--border)}
.dash-sec:last-child{border-bottom:none}
.dash-sec>h4{
  margin:0;padding:11px 16px 5px;font-size:12.5px;font-weight:650;display:flex;gap:8px;align-items:center;
}
.dash-sec>h4 .n{font-size:11px;background:var(--bg4);border-radius:20px;padding:0 7px;color:var(--fg3)}
.dash-sec>h4 .n.z{background:rgba(79,191,123,.15);color:var(--ok)}
.dash-item{display:flex;gap:9px;align-items:flex-start;padding:6px 16px;font-size:13px;color:var(--fg2);width:100%;text-align:left}
.dash-item:hover{background:var(--bg3);color:var(--fg)}
.dash-item .p{font-size:11px;color:var(--fg3);font-family:var(--mono)}
.dash-item .fix{margin-left:auto;font-size:11px;color:var(--accent);flex:none}
.checkline{display:flex;gap:10px;align-items:center;padding:8px 16px;font-size:13.5px}
.checkline input{width:17px;height:17px;accent-color:var(--accent)}

.coach{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin:14px 0 4px;
}
.coach-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.coach-head .iconbtn{margin-left:auto}
.coach-step{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:13.5px}
.coach-step.done{color:var(--fg3)}
.coach-step.done>div>div:first-child{text-decoration:line-through}
.coach-dot{
  width:18px;height:18px;border-radius:50%;border:1.6px solid var(--border2);flex:none;
  display:grid;place-items:center;font-size:11px;color:transparent;margin-top:1px;
}
.coach-step.done .coach-dot{background:var(--ok);border-color:var(--ok);color:#06210f}
/* The one reason, for the one step you are on. Set apart so it reads as an aside
   and not as another instruction. */
.coach-why{
  color:var(--fg3);font-size:12.5px;line-height:1.55;margin-top:7px;
  border-left:2px solid var(--border2);padding-left:9px;
}
.coach.tip .coach-head b{font-size:13.5px}
.nudge.quieter{color:var(--fg3);border-style:dashed}
.listblurb{color:var(--fg3);font-size:12.5px;line-height:1.5;padding:10px 16px 2px}
.quickadd{
  display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 13px;
}
.quickadd:focus-within{border-color:var(--accent)}
.quickadd>span{color:var(--accent);font-size:17px;flex:none}
.quickadd input{flex:1;background:none;border:none;outline:none;font-size:14.5px}
.modeswitch{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:3px}
.modeswitch button{
  flex:1;padding:4px 8px;border-radius:4px;font-size:11.5px;color:var(--fg3);text-align:center;
}
.modeswitch button.on{background:var(--bg2);color:var(--fg);font-weight:600}

/* toast */
#toasts{position:fixed;right:14px;top:60px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;width:min(420px,calc(100vw - 28px))}
.toast{
  background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;
  font-size:13px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;
}
.toast.warn{border-color:rgba(224,176,80,.5)} .toast.err{border-color:rgba(255,107,107,.5)}
.toast .x{margin-left:auto;color:var(--fg3)}

/* keyboard chord hud */
#chord{
  position:fixed;left:12px;bottom:12px;z-index:210;background:var(--bg4);border:1px solid var(--border2);
  border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:12px;box-shadow:var(--shadow);
}

/* ============================================================
   25_RESPONSIVE
   ============================================================ */
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #sidebar{
    position:fixed;inset:0 auto 0 0;width:270px;z-index:70;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:var(--shadow);
  }
  body.nav-open #sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65}
  header.top .burger{display:grid}
  .wrap{padding:0 14px}
  .modal{max-height:92dvh}
  #toasts{left:14px;right:14px;width:auto;align-items:stretch}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <button class="brand" id="spaceBtn" title="Switch space">
      <div class="logo" id="spaceLogo">&#9715;</div>
      <div style="min-width:0;text-align:left">
        <div id="spaceName">GroupTodo</div>
        <small id="vaultName">no vault</small>
      </div>
      <span class="swap">&#8645;</span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="vaultbar">
      <div class="modeswitch" id="modeSwitch">
        <button data-mode="simple">Simple</button>
        <button data-mode="advanced">Advanced</button>
      </div>
      <div class="row"><span class="dot" id="syncDot"></span><span id="syncTxt">local only</span></div>
      <button class="btn sm" id="btnVault">&#9187; Vault &amp; sync</button>
    </div>
  </aside>

  <div id="main">
    <header class="top">
      <button class="iconbtn burger" id="burger">&#9776;</button>
      <div class="h-title"><span id="hTitle">Today</span><span class="sub" id="hSub"></span></div>
      <div class="h-sp"></div>
      <button class="ctxnow" id="btnContext" hidden></button>
      <button class="btn sm ghost" id="btnFocus" title="Focus (f f)">&#9678;</button>
      <button class="btn sm ghost" id="btnSearch" title="Search (/)">&#8981;</button>
      <button class="btn sm ghost" id="btnTheme" title="Theme">&#9689;</button>
      <button class="btn primary sm" id="btnCapture">&#65291; Capture <kbd>c</kbd></button>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ============================================================
   00_BOOTSTRAP -- utilities
   Port of: init.lua 00_BOOTSTRAP
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "data") for (const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trim = s => String(s ?? "").replace(/^\s+|\s+$/g, "");
const join = (...p) => p.filter(Boolean).join("/").replace(/\/{2,}/g, "/");
const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

/* ---------- keeping your place across a redraw ----------
   Any change redraws the whole screen, so whatever had focus -- the state badge
   just clicked, the line being typed in -- went with it, and cycling a state
   meant selecting the todo again before every single step. Name the control just
   before the change that redraws, and focus lands back on the rebuilt one, so
   the next click or keypress carries straight on. */
let REFOCUS = null;
function keepFocus(selector, node) {
  REFOCUS = {selector, nth: node ? Math.max(0, $$(selector).indexOf(node)) : 0};
}
function applyRefocus() {
  const want = REFOCUS; REFOCUS = null;
  if (!want) return;
  requestAnimationFrame(() => {
    if ($("#modalRoot").firstChild) return;   // a picker opened on the way; it owns the keys
    const all = $$(want.selector);
    const node = all[want.nth] || all[0];     // the row may have left one list on the way
    if (node) node.focus({preventScroll: true});
  });
}
const idSel = (cls, id, part) => cls + '[data-id="' + CSS.escape(String(id)) + '"] ' + part;

function notify(msg, level="info", action=null) {
  const t = el("div", {class:"toast " + (level==="warn"?"warn":level==="error"?"err":"")},
    el("span", {}, msg),
    action ? el("button", {class:"act", onclick:e=>{
      e.target.closest(".toast").remove(); action.run();
    }}, action.label) : null,
    el("button", {class:"x", onclick:e=>e.target.closest(".toast").remove()}, "✕"));
  $("#toasts").append(t);
  // An offer to undo has to outlast the moment you realise you need it.
  setTimeout(() => t.remove(), action ? 12000 : level === "info" ? 3800 : 9000);
}

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());

/* Timestamps are written to the files in UTC so two people in different
   offices compare cleanly. Everything shown on screen is converted to the
   timezone set on this device -- including which day "today" is, so a journal
   written while travelling still lands on the day you think you are in. */
function userTZ() {
  const set = (typeof PREF !== "undefined") ? PREF.get("timezone", "") : "";
  if (set) return set;
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
  catch (_) { return "UTC"; }
}
function todayISO() {
  const tz = (typeof PREF !== "undefined") ? PREF.get("timezone", "") : "";
  if (!tz) return isoOf(new Date());
  try {
    return new Intl.DateTimeFormat("en-CA", {timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit"})
      .format(new Date());
  } catch (_) { return isoOf(new Date()); }
}

/* "2026-10-05T18:43:38Z" -> "5 Oct 2026, 20:43" in the chosen zone. */
function formatStamp(iso, opts = {}) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return iso || "";
  try {
    return new Intl.DateTimeFormat(undefined, Object.assign({
      dateStyle: "medium", timeStyle: "short", timeZone: userTZ(),
    }, opts)).format(d);
  } catch (_) { return String(iso); }
}
/* A stamp like "Kenneth 2026-10-05T18:43:38Z" splits into who and when. */
function splitStamp(value) {
  const m = /^(.*?)\s*(\d{4}-\d{2}-\d{2}T[\d:.]+Z)\s*$/.exec(trim(value || ""));
  return m ? {who: trim(m[1]), iso: m[2]} : {who: trim(value || ""), iso: null};
}
const parseISO = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : null;
};
const shiftISO = (iso, days) => { const d = parseISO(iso) || new Date(); d.setDate(d.getDate()+days); return isoOf(d); };
function dateDiffDays(d1, d2) {           // d2 - d1, in days
  const a = parseISO(d1), b = parseISO(d2);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function humanDate(iso) {
  const d = parseISO(iso); if (!d) return iso || "";
  const t = todayISO();
  if (iso === t) return "Today";
  if (iso === shiftISO(t, 1)) return "Tomorrow";
  if (iso === shiftISO(t, -1)) return "Yesterday";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined,
    {weekday:"short", day:"numeric", month:"short", year: sameYear ? undefined : "numeric"});
}
function isoWeek(iso) {
  const d = parseISO(iso); if (!d) return null;
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const week1 = new Date(t.getFullYear(), 0, 4);
  const w = 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return [w, t.getFullYear()];
}

/* ============================================================
   05_CONFIG_SCHEMA
   Port of: init.lua 05_CONFIG_SCHEMA
   Same vault shape as the Neovim config, with .md instead of .org:
     journals/YYYY-MM-DD.md
     pages/{_,0,1,2,3}/   project status directories
     pages/{c,p,o,z}/     contexts, people, orgs, zettel
     pages/{templates,verbs}/
   ============================================================ */
const JOURNALS = "journals";
const PAGES    = "pages";
const DIRS = {
  journals : JOURNALS,
  pages    : PAGES,
  /* Cancelled used to live in pages/_/, which is also where the horizon pages
     live, so every project query had to filter horizons back out by hand and a
     cancelled project and your purpose shared one drawer. Cancelled is "-" now:
     struck out, and it keeps the rule that the folder name IS the status code.
     pages/_/ is horizons alone. migrateCancelled() moves old vaults. */
  cancelled: join(PAGES, "-"),
  completed: join(PAGES, "0"),
  active   : join(PAGES, "1"),
  someday  : join(PAGES, "2"),
  waiting  : join(PAGES, "3"),
  orgs     : join(PAGES, "o"),
  people   : join(PAGES, "p"),
  contexts : join(PAGES, "c"),
  templates: join(PAGES, "templates"),
  verbs    : join(PAGES, "verbs"),
  zettel   : join(PAGES, "z"),
  areas    : join(PAGES, "a"),   // H2: areas of focus, the standing responsibilities
  goals    : join(PAGES, "g"),   // H3: goals and objectives, 1-2 years
  lists    : join(PAGES, "8"),   // 8 = eternity: checklists you run again and again
};
const TODO_STATES  = ["TODO", "DOING", "WAIT", "DONE", "CANCELLED"];
const OPEN_STATES  = {TODO:true, DOING:true, WAIT:true};
const STATE_ALIAS  = {WAITING:"WAIT", CANCELED:"CANCELLED", NOW:"DOING", LATER:"TODO"};
const STATUS_DIRS  = {"-":DIRS.cancelled, "0":DIRS.completed, "1":DIRS.active, "2":DIRS.someday, "3":DIRS.waiting};
const STATUS_TEXT  = {
  "-": "- = cancelled",
  "0": "0 = completed",
  "1": "1 = active",
  "2": "2 = someday maybe",
  "3": "3 = waiting for 3rd party",
};
const STATUS_LABEL = {"-":"Cancelled", "0":"Completed", "1":"Active", "2":"Someday/Maybe", "3":"Waiting for"};
/* The vault's own order: - 0 1 2 3, then 8 for the checklists. */
const STATUS_ORDER = ["-", "0", "1", "2", "3"];
const PREFIX_DIR   = {"8":DIRS.lists,            // integer-like key, so pageRef finds it first
                      p:DIRS.people, c:DIRS.contexts, o:DIRS.orgs, z:DIRS.zettel,
                      a:DIRS.areas, g:DIRS.goals,
                      _:join(PAGES, "_"),           // horizons: [[_/Purpose]], [[_/Vision]]
                      k:DIRS.lists};                // legacy: old [[k/...]] links still resolve

/* Tunables -- the GTD nudge thresholds (inline constants in init.lua). */
const CFG = {
  surfaceCount     : 3,      // oldest TODOs surfaced per context
  weedCount        : 3,      // stalest projects in morning weeding
  staleProjectDays : 180,    // "older than 6 months" warning
  reviewEveryDays  : 7,      // weekly review cadence
  waitFollowUpDays : 14,     // nudge to chase a WAIT item
  idleNudgeMinutes : 30,     // 30+ min idle -> nudge
  quietUntilTasks  : 6,      // simple mode: no GTD hygiene talk below this
  nudgeMax         : 4,      // chips on screen at once; the rest wait behind "more"
  nudgeSnoozeDays  : 7,      // a nudge you quieten stays quiet this long
  tipMinTasks      : 3,      // enough on the list for "some of these belong together"
  tipSnoozeDays    : 5,      // "not now" on a suggestion
  busyTasks        : 40,     // past this the length of the list is the problem
  busyProjectTodos : 12,     // one project carrying this much is really several
  undoStateMinutes : 5,      // grace period to cycle back without losing the dates
  weedMinProjects  : 5,      // weeding is for a garden, not a window box
  weedMinTodos     : 20,
  agendaDays       : 14,
  rowsPerPage      : 100,    // drawn at once; the rest wait behind "show more"
  groupsPerPage    : 100,    // project sections drawn at once
  boardPerColumn   : 100,    // cards in one board column
  boardPerPhone    : 12,     // and on a phone, where the columns are stacked
  graphNodes       : 200,    // pages drawn in the graph before it stops being readable
  plexTaskFan      : 12,     // todos hung off one page or todo in the mindmap
  journalScanDays  : 365,
  contextPrompts   : [[12, 0, "lunchtime"], [17, 0, "after work"]],
};

/* A journal belongs to one person. It is the one page everybody writes to
   every single day, so sharing it is the fastest way to make a vault
   confusing: two people appending to the same day, each wondering which lines
   are theirs. Each person gets a folder instead, and what they put in it is
   still visible to everyone in the space.

   Before a name is set there is no folder to use, so the old flat path stays
   valid and migrateJournals() moves those files in once a name exists. */
/* Not slugify(): that falls back to "Untitled" for an empty string, which is
   right for a page with no title and wrong here -- it gave somebody who had
   not named themselves a journal folder called Untitled, which then never
   migrated because it looked like it already had an owner. No name must mean
   no folder. */
const slugPerson = n => trim(n || "")
  .replace(/[\u0000-\u001f/\\:*?"<>|]/g, "-")
  .replace(/\s+/g, " ")
  .slice(0, 40);
const journalOwner = () => slugPerson(whoAmI());
const journalPath = (date, owner) => {
  const who = owner === undefined ? journalOwner() : slugPerson(owner);
  const day = (date || todayISO()) + ".md";
  return who ? join(JOURNALS, who, day) : join(JOURNALS, day);
};
/* "" for an un-owned journal from before a name was set. */
const journalOwnerOf = path => {
  const rest = String(path).slice(JOURNALS.length + 1);
  const cut = rest.lastIndexOf("/");
  return cut === -1 ? "" : rest.slice(0, cut);
};
const myJournal = path => journalOwnerOf(path) === journalOwner();
const todayStamp  = () => "[[" + todayISO() + "]]";

function slugify(title) {
  const s = trim(title || "Untitled")
    .replace(/[\u0000-\u001f/\\:*?"<>|]/g, "-")
    .replace(/\s+/g, " ");
  return s === "" ? "Untitled" : s;
}

/* ============================================================
   10_MARKDOWN -- parse / serialize
   The org outline (*, **, ***) becomes a markdown bullet outline.
   Org "#+key: value"  ->  "key:: value" page properties.
   Org "Added: [[d]]"  ->  "Added:: [[d]]" block property.
   ============================================================ */
const PROP_RE   = /^([A-Za-z][\w-]*)::\s*(.*)$/;
const BULLET_RE = /^(\s*)[-*+]\s+(.*)$/;

function indentLevel(ws) {
  let n = 0;
  for (const ch of ws) n += ch === "\t" ? 2 : 1;
  return Math.floor(n / 2);
}

function splitState(text) {
  const m = /^([A-Z]{3,9})(\s+|$)/.exec(text || "");
  if (!m) return [null, text || ""];
  const raw = m[1];
  const st = STATE_ALIAS[raw] || (TODO_STATES.includes(raw) ? raw : null);
  if (!st) return [null, text || ""];
  return [st, (text || "").slice(m[0].length)];
}

function newBlock(patch = {}) {
  return Object.assign({
    id: uid(), state: null, title: "", props: {}, body: [],
    children: [], collapsed: false,
  }, patch);
}

/* Parse a markdown page into {props, blocks}. */
function parsePage(text) {
  const lines = String(text || "").split(/\r?\n/);
  const page = {props: {}, blocks: []};
  const root = {level: -1, children: page.blocks};
  const stack = [root];
  let cur = null, curIndent = 0, seenBullet = false;

  for (const line of lines) {
    const bm = BULLET_RE.exec(line);
    if (bm) {
      seenBullet = true;
      const level = indentLevel(bm[1]);
      const [state, title] = splitState(bm[2]);
      const blk = newBlock({state, title: trim(title)});
      while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      const parent = stack[stack.length-1];
      (parent.children || (parent.children = [])).push(blk);
      blk.level = level;
      stack.push(blk);
      cur = blk; curIndent = bm[1].length;
      continue;
    }
    if (!seenBullet) {
      const pm = PROP_RE.exec(trim(line));
      if (pm) { page.props[pm[1].toLowerCase()] = trim(pm[2]); continue; }
      if (trim(line) === "") continue;
      // Stray prose before the first bullet: keep it as a leading block.
      const blk = newBlock({title: trim(line)});
      page.blocks.push(blk); blk.level = 0;
      stack.length = 1; stack.push(blk); cur = blk; curIndent = 0; seenBullet = true;
      continue;
    }
    if (!cur) continue;
    if (trim(line) === "") { if (cur.body.length) cur.body.push(""); continue; }
    const pm = PROP_RE.exec(trim(line));
    if (pm) { cur.props[pm[1]] = trim(pm[2]); continue; }
    const lead = /^\s*/.exec(line)[0].length;
    cur.body.push(line.slice(Math.min(lead, curIndent + 2)).replace(/\s+$/, ""));
  }
  // drop trailing blank body lines
  walkBlocks(page.blocks, b => { while (b.body.length && trim(b.body[b.body.length-1]) === "") b.body.pop(); });
  return page;
}

/* ---------- loose text into blocks ----------
   Text that arrives from somewhere else -- pasted out of an email, a chat, a
   meeting's minutes -- is already a list. Every line of it is one task, and
   the little marks in front of the words are the list's, not the task's: a
   leading "-" is a bullet, indentation is nesting, and a leading TODO is a
   state. Reading them here is what lets a paste become ten tasks rather than
   one line with ten dashes in it.

   A "key:: value" line belongs to the line above it, so a block copied out of
   the app -- Added, by, assigned and all -- pastes back whole.

   State is left alone when a line does not carry one: only the caller knows
   whether an unmarked line is a task or a note. */
function parseOutlineText(text) {
  const roots = [];
  const stack = [];                       // {level, block}, outermost first
  for (const raw of String(text || "").replace(/\r\n?/g, "\n").split("\n")) {
    if (trim(raw) === "") continue;
    const bm = BULLET_RE.exec(raw);
    const level = indentLevel(bm ? bm[1] : /^[ \t]*/.exec(raw)[0]);
    const rest = trim(bm ? bm[2] : raw);
    if (rest === "") continue;
    const cur = stack.length ? stack[stack.length - 1].block : null;
    const pm = PROP_RE.exec(rest);
    if (pm && cur) { cur.props[pm[1]] = trim(pm[2]); continue; }
    const [state, title] = splitState(rest);
    const blk = newBlock({state, title: trim(title)});
    while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
    if (stack.length) stack[stack.length - 1].block.children.push(blk);
    else roots.push(blk);
    stack.push({level, block: blk});
  }
  return roots;
}

/* The parsed lines, ready to go into a page: a line that carries no state of
   its own becomes whatever the place it is going says an unmarked line is, a
   task gets today's date, your name and the context in force, and the pages
   its [[links]] point at come into being. The helpers it leans on are defined
   further down; nothing calls this before they are.  */
function readyPastedBlocks(roots, opts = {}) {
  let n = 0;
  walkBlocks(roots, b => {
    n++;
    if (!b.state && opts.defaultState) b.state = opts.defaultState;
    if (b.state && opts.context && !hasContextLink(b.title))
      b.title = trim(b.title + " [[c/" + opts.context + "]]");
    if (b.state) { b.props.Added = b.props.Added || todayStamp(); stampAuthor(b); }
    if (b.title) createLinkedPages(b.title);
  });
  return n;
}

function serializePage(page) {
  const out = [];
  const props = page.props || {};
  const keys = Object.keys(props);
  if (keys.length) {
    for (const k of keys) out.push(k + ":: " + props[k]);
    out.push("");
  }
  const emit = (blocks, level) => {
    for (const b of blocks) {
      const pad = "  ".repeat(level);
      out.push((pad + "- " + (b.state ? b.state + " " : "") + b.title).replace(/\s+$/, ""));
      for (const [k, v] of Object.entries(b.props || {})) out.push(pad + "  " + k + ":: " + v);
      for (const l of b.body || []) out.push(l === "" ? "" : pad + "  " + l);
      if (b.children && b.children.length) emit(b.children, level + 1);
    }
  };
  emit(page.blocks || [], 0);
  return out.join("\n").replace(/\n+$/, "") + "\n";
}

function walkBlocks(blocks, fn, parent = null) {
  for (const b of blocks || []) {
    if (fn(b, parent) === false) continue;
    walkBlocks(b.children, fn, b);
  }
}
function flattenBlocks(blocks, out = [], parent = null, depth = 0) {
  for (const b of blocks || []) {
    b._parent = parent; b._depth = depth;
    out.push(b);
    flattenBlocks(b.children, out, b, depth + 1);
  }
  return out;
}
</script>
<script>
/* ============================================================
   15_STORAGE -- three interchangeable backends
     fs   : File System Access API, writes real .md files (desktop Chrome/Edge)
     http : tiny PUT/GET server (serve.py) -- for Termux / phone / any device
     idb  : IndexedDB, browser-local, with markdown bundle export/import
   Port of: init.lua read_file/write_file/append_file + autosave timer
   ============================================================ */
/* ---------- what can this device actually do? ----------
   iOS Safari, locked-down corporate browsers and pages opened straight from
   disk all differ in what they allow. Probe rather than assume, and tell the
   user plainly in the Vault dialog. */
/* Reading window.localStorage THROWS -- it does not return null -- when the
   page has an opaque origin. SharePoint and Teams render an uploaded .html
   inside <iframe sandbox srcdoc> with no allow-same-origin, which is exactly
   that: no localStorage, no IndexedDB, no folder access, nothing. Every
   access goes through here so a locked-down frame degrades to memory rather
   than killing the script on the way past. */
const safeLS = {
  get(k, d = null) {
    try { const v = window.localStorage.getItem(k); return v === null ? d : v; }
    catch (_) { return d; }
  },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (_) { return false; } },
  del(k)    { try { window.localStorage.removeItem(k); return true; } catch (_) { return false; } },
};

const CAP = {
  served    : location.protocol === "http:" || location.protocol === "https:",
  /* A sandboxed frame with no allow-same-origin: storage ACCESS throws, not
     just storage reads. Tested by behaviour rather than by origin, because a
     plain file:// page also reports an origin of "null" and is perfectly
     usable -- checking the origin alone condemned every downloaded copy. Both
     halves are needed: in a frame, and storage unreachable. */
  sandboxed : (() => {
    const framed = (() => { try { return window.top !== window.self; } catch (_) { return true; } })();
    let blocked = false;
    try { void window.localStorage; } catch (_) { blocked = true; }
    return framed && blocked;
  })(),
  fromFile  : location.protocol === "file:",
  dirPicker : typeof window.showDirectoryPicker === "function",
  openPicker: typeof window.showOpenFilePicker === "function",
  savePicker: typeof window.showSaveFilePicker === "function",
  idb       : false,     // filled in by probeStorage()
  ls        : false,
  persist   : "memory",  // idb | ls | memory
};

async function probeStorage() {
  try {
    localStorage.setItem("gtd.probe", "1");
    CAP.ls = localStorage.getItem("gtd.probe") === "1";
    localStorage.removeItem("gtd.probe");
  } catch (_) { CAP.ls = false; }
  try {
    await IDB.set("kv", "probe", Date.now());
    CAP.idb = (await IDB.get("kv", "probe")) != null;
  } catch (_) { CAP.idb = false; }
  CAP.persist = CAP.idb ? "idb" : CAP.ls ? "ls" : "memory";
  return CAP;
}

/* localStorage and in-memory stand-ins, so a browser that blocks IndexedDB
   (iOS Safari on a file:// page, some managed profiles) still runs. */
const LS = {
  k: p => "gtd.file:" + p,
  all() {
    const out = new Map();
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith("gtd.file:")) out.set(key.slice(9), localStorage.getItem(key));
    }
    return out;
  },
  set(p, t) { localStorage.setItem(LS.k(p), t); },
  del(p)    { localStorage.removeItem(LS.k(p)); },
};
const MEM = new Map();
/* Dropped files for backends with nowhere to put them (localStorage is far
   too small, memory has no disk at all). Session-long, like MEM. */
const ASSET_MEM = new Map();

const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("grouptodo", 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      if (!db.objectStoreNames.contains("kv"))    db.createObjectStore("kv");
      /* Dropped-in pictures and documents. A store of their own, so a walk
         over the pages never has to step over a blob that is not markdown. */
      if (!db.objectStoreNames.contains("assets")) db.createObjectStore("assets");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    /* Deleting the database blocks for as long as any connection to it is
       open, and this module holds one for the life of the page. Start afresh
       lets go of it first. */
    close: () => {
      const p = dbp;
      dbp = null;
      if (p) p.then(db => { try { db.close(); } catch (_) {} }, () => {});
    },
    get : (s, k)    => tx(s, "readonly",  st => st.get(k)),
    set : (s, k, v) => tx(s, "readwrite", st => st.put(v, k)),
    del : (s, k)    => tx(s, "readwrite", st => st.delete(k)),
    keys: (s)       => tx(s, "readonly",  st => st.getAllKeys()),
    all : (s)       => tx(s, "readonly",  st => st.getAll()),
  };
})();

const Backends = {
  /* ---------- IndexedDB (always available) ---------- */
  idb(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "idb", label: space ? "browser storage" : "browser storage", writable: true,
      async list() {
        const keys = await IDB.keys("files"), vals = await IDB.all("files");
        const out = new Map();
        keys.forEach((k, i) => {
          if (pre) { if (String(k).startsWith(pre)) out.set(String(k).slice(pre.length), vals[i]); }
          else if (!String(k).includes("|")) out.set(String(k), vals[i]);
        });
        return out;
      },
      async write(path, text) { await IDB.set("files", pre + path, text); },
      async remove(path)      { await IDB.del("files", pre + path); },
      async putAsset(path, blob) { await IDB.set("assets", pre + path, blob); },
      async getAsset(path)       { return (await IDB.get("assets", pre + path)) || null; },
    };
  },

  /* ---------- localStorage fallback (IndexedDB blocked) ---------- */
  ls(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "ls", label: "browser storage", writable: true,
      async list() {
        const out = new Map();
        for (const [k, v] of LS.all()) {
          if (pre) { if (k.startsWith(pre)) out.set(k.slice(pre.length), v); }
          else if (!k.includes("|")) out.set(k, v);
        }
        return out;
      },
      async write(path, text) { LS.set(pre + path, text); },
      async remove(path) { LS.del(pre + path); },
      /* No room in localStorage for a photograph, so a dropped file lives for
         this session only and the drop says so. Choose a folder and it becomes
         a real file like everything else. */
      async putAsset(path, blob) { ASSET_MEM.set(pre + path, blob); },
      async getAsset(path)       { return ASSET_MEM.get(pre + path) || null; },
    };
  },

  /* ---------- memory only (everything blocked) ----------
     Still fully usable for a session; the Vault dialog shouts about it and
     file sync is the only durable home. */
  memory(space = "") {
    const pre = space ? space + "|" : "";
    return {
      kind: "memory", label: "memory only", writable: true, ephemeral: true,
      async list() {
        const out = new Map();
        for (const [k, v] of MEM) if (k.startsWith(pre)) out.set(k.slice(pre.length), v);
        return out;
      },
      async write(path, text) { MEM.set(pre + path, text); },
      async remove(path) { MEM.delete(pre + path); },
      async putAsset(path, blob) { ASSET_MEM.set(pre + path, blob); },
      async getAsset(path)       { return ASSET_MEM.get(pre + path) || null; },
    };
  },

  /* ---------- File System Access API ---------- */
