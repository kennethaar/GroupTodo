  // are reachable as a plain list underneath. Not a fallback -- the real thing,
  // in the shape a reader can use.
  const list = el("details", {class: "section"},
    el("summary", {}, "The same pages as a list"));
  const ranked = g.nodes.slice().sort((a, b) => b.deg - a.deg || a.label.localeCompare(b.label));
  const ul = pagedCard(ranked, nd => el("button", {class: "dash-item", onclick: () => openNode(nd)},
    el("span", {class: "nm"}, nd.label),
    nd.ghost ? el("span", {class: "chip"}, "no page yet") : null,
    el("span", {class: "chip"}, nd.deg + " link" + (nd.deg === 1 ? "" : "s"))));
  ul.className = "pagelist";
  list.append(ul);
  c.append(list);
  return c;
}

/* ============================================================
   GANTT -- the plan laid out in time, and movable
   The same tasks again, placed on a calendar line instead of in a list, so
   overlap and drift are visible rather than inferred. Reading was all it did
   at first, which made it the one view where seeing the problem did not let
   you fix it: you spotted the clash here and went somewhere else to move the
   date. Now a bar is a handle -- drag it along to reschedule, drag an end to
   stretch it -- and a project bar drags its whole project with it.

   Nothing is invented by the drag. It writes SCHEDULED:: and DEADLINE:: on the
   task, which is where the plan already lived; Added:: is history and is never
   rewritten, so a task captured in March that you push to May still says it
   was captured in March.
   ============================================================ */

/* A bar needs two ends, and the file does not always have both:
     start  SCHEDULED, else the day it was captured, else its deadline
     end    DEADLINE, else the day it was ticked off, else today -- still running
   A task with none of those gets no bar. It is counted and named underneath
   rather than given an invented span, because a made-up bar is a lie about
   the plan and reads exactly like a real one. */
function spanOf(b, journalDay) {
  const sched  = dateIn(blockProp(b, "SCHEDULED"));
  const dead   = dateIn(blockProp(b, "DEADLINE"));
  const added  = addedDate(b) || journalDay || null;
  const closed = closedOn(b);
  const open   = !!OPEN_STATES[b.state];
  let start = sched || added || dead || closed;
  if (!start) return null;
  let end = dead || (open ? null : closed) || (open ? todayISO() : start);
  if (end < start) end = start;
  return {start, end, open};
}

/* ---------- moving a bar ----------
   Only an open task can be dragged. A done task's end is the day somebody
   ticked it off, and dragging that would be editing the past. */
const canMoveTask = b => !!OPEN_STATES[b.state];

const dropProp = (b, key) => {
  const k = Object.keys(b.props || {}).find(x => x.toLowerCase() === key.toLowerCase());
  if (k) delete b.props[k];
};
const writeDay = (b, key, iso) => setBlockProp(b, key, "[[" + iso + "]]");

/* Move both ends by the same number of days, writing only the properties the
   task already had -- plus a SCHEDULED:: when the bar's start was coming from
   Added::, because that is the one case where there is nothing to shift. */
function shiftTaskBy(path, b, days) {
  if (!days || !canMoveTask(b)) return false;
  const span = spanOf(b, isJournalPath(path) ? baseName(path) : null);
  if (!span) return false;
  writeDay(b, "SCHEDULED", shiftISO(span.start, days));
  if (dateIn(blockProp(b, "DEADLINE"))) writeDay(b, "DEADLINE", shiftISO(span.end, days));
  return true;
}

/* Dragging the left edge is "start it later", which is SCHEDULED:: and nothing
   else. Dragging the right edge is "it has to be finished by", which is a
   DEADLINE:: -- and a task that had no deadline before now has one, which is
   the honest reading of somebody pulling its end to a date. */
function setTaskStart(path, b, iso) {
  if (!canMoveTask(b)) return false;
  const span = spanOf(b, isJournalPath(path) ? baseName(path) : null);
  if (!span) return false;
  /* Only a real deadline is an end to clamp a start against. For an open task
     without one, spanOf's "end" is today standing in for "still running", so
     clamping against it silently refused to schedule anything for next week --
     which is most tasks, and the most ordinary thing to want. */
  const hardEnd = dateIn(blockProp(b, "DEADLINE"));
  if (hardEnd && iso > hardEnd) iso = hardEnd;
  writeDay(b, "SCHEDULED", iso);
  return true;
}
function setTaskEnd(path, b, iso) {
  if (!canMoveTask(b)) return false;
  const span = spanOf(b, isJournalPath(path) ? baseName(path) : null);
  if (!span) return false;
  if (iso < span.start) iso = span.start;
  // An end date on a task whose start was only ever implied would make the bar
  // jump the moment it is redrawn, so pin the start it is being stretched from.
  if (!dateIn(blockProp(b, "SCHEDULED"))) writeDay(b, "SCHEDULED", span.start);
  writeDay(b, "DEADLINE", iso);
  return true;
}

/* ---------- a project's own span, and moving all of it ---------- */
function projectSpan(path) {
  const page = getPage(path);
  if (!page) return null;
  let start = null, end = null;
  walkBlocks(page.blocks, b => {
    if (!b.state || isMessage(b)) return;
    const s = spanOf(b, null);
    if (!s) return;
    if (!start || s.start < start) start = s.start;
    if (!end   || s.end   > end)   end   = s.end;
  });
  return start ? {start, end} : null;
}
const projectStart = path => (projectSpan(path) || {}).start || null;
const projectEnd   = path => (projectSpan(path) || {}).end   || null;

/* Everything open and dated in the project moves together, so the shape of the
   plan inside it survives the move. Closed tasks stay where they happened. */
function shiftProjectBy(path, days) {
  if (!days) return 0;
  const page = getPage(path);
  if (!page) return 0;
  let n = 0;
  walkBlocks(page.blocks, b => {
    if (!b.state || isMessage(b) || !canMoveTask(b)) return;
    if (shiftTaskBy(path, b, days)) n++;
  });
  if (n) touch(path);
  return n;
}
function pushProjectTo(path, iso) {
  const start = projectStart(path);
  if (!start) return 0;
  const days = dateDiffDays(start, iso);
  return days > 0 ? shiftProjectBy(path, days) : 0;
}

/* ---------- the chain, applied to the chart ----------
   A project that starts before the thing it waits on has finished is the whole
   reason to record the order, so it is drawn rather than described: the gate
   marker sits where the prerequisite ends, and the part of the bar standing
   to the left of it is hatched. */
function chainTrouble(path) {
  const need = earliestStart(path);
  const start = projectStart(path);
  if (!need || !start || start >= need) return null;
  return {need, start, days: dateDiffDays(start, need)};
}

/* Push this project's dependents clear of it, and theirs clear of them. Each
   pass can only move a project later, so the walk terminates; the cap is there
   for a chain somebody has managed to make longer than any real plan. */
function cascadePush(path) {
  const moved = [];
  const queue = [path];
  const seen = new Set();
  for (let guard = 0; queue.length && guard < 200; guard++) {
    const from = queue.shift();
    for (const d of dependentsOf(from)) {
      const t = chainTrouble(d);
      if (!t) continue;
      if (pushProjectTo(d, t.need)) {
        if (!seen.has(d)) { seen.add(d); moved.push(d); }
        queue.push(d);
      }
    }
  }
  return moved;
}

/* Offered, never done behind your back: moving one project is your decision,
   and moving four more of somebody else's is a different decision. */
function offerCascade(space, path) {
  const waiting = inSpace(space, () =>
    dependentsOf(path).filter(d => chainTrouble(d)).length);
  if (!waiting) return;
  notify(waiting + " project" + (waiting === 1 ? "" : "s") + " downstream now start" +
         (waiting === 1 ? "s" : "") + " too early.", "warn",
    {label: "Push them along", run: () => {
      const moved = inSpace(space, () => cascadePush(path));
      notify(moved.length ? "Moved " + moved.map(p => inSpace(space, () => pageTitle(p))).join(", ") + "."
                          : "Nothing needed moving after all.");
      render();
    }});
}

function ganttRowsHere() {
  const out = [];
  for (const [path, page] of V.pages) {
    const kind = pageKind(path);
    if (kind === "template" || kind === "verb") continue;
    const journal = isJournalPath(path);
    const day = journal ? baseName(path) : null;
    const tasks = [];
    walkBlocks(page.blocks, b => {
      if (!b.state || isMessage(b)) return;
      const span = spanOf(b, day);
      tasks.push({path, block: b, title: b.title, state: b.state, span,
                  assignee: assigneeOf(b), project: journal ? null : pageTitle(path)});
    });
    if (!tasks.length) continue;
    out.push({path, journal, label: journal ? chatDayLabel(day) : pageTitle(path), tasks,
              project: !!statusDirOf(path),
              deps: statusDirOf(path) ? dependsOn(path) : [],
              blockers: statusDirOf(path) ? blockersOf(path) : [],
              trouble: statusDirOf(path) ? chainTrouble(path) : null});
  }
  return out;
}
const ganttRows = () => memo("ganttRows", () => {
  const groups = acrossSpaces(ganttRowsHere);
  // acrossSpaces tags the groups; the tasks inside them need the same stamp,
  // or a click would edit the row through the wrong space's backend.
  for (const g of groups) for (const t of g.tasks) t.space = g.space;
  return groups;
});

const GANTT_SPANS = [["3", "3 months", 3], ["6", "6 months", 6], ["12", "A year", 12], ["fit", "Fit", 0]];

/* The window the chart is currently drawn in. A drag has to turn pixels back
   into days, and it is the same arithmetic the bars were placed with, so it is
   kept rather than recomputed from the DOM. */
let GWIN = null;

function viewGantt() {
  const c = el("div", {class: "wrap"});
  const groups = ganttRows();
  const key = state.ganttSpan || "3";
  const months = (GANTT_SPANS.find(s => s[0] === key) || GANTT_SPANS[0])[2];
  const chains = state.ganttChains !== false;

  /* Every bar, so the window can be worked out before anything is drawn. */
  const all = [];
  let undated = 0;
  for (const g of groups) for (const t of g.tasks) {
    if (t.span) all.push(t.span); else undated++;
  }

  let from, to;
  if (months) {
    // A plan is mostly about what is ahead, with just enough behind to see drift.
    from = addMonths(todayISO(), -Math.max(1, Math.round(months / 3)));
    to   = addMonths(from, months);
  } else if (all.length) {
    from = all.reduce((a, s) => s.start < a ? s.start : a, all[0].start);
    to   = all.reduce((a, s) => s.end   > a ? s.end   : a, all[0].end);
    from = shiftISO(from, -3);
    to   = shiftISO(to, 3);
  } else {
    from = addMonths(todayISO(), -1);
    to   = addMonths(todayISO(), 2);
  }
  const total = Math.max(1, dateDiffDays(from, to));
  const pct = iso => Math.max(0, Math.min(100, (dateDiffDays(from, iso) / total) * 100));
  const inWindow = s => s.end >= from && s.start <= to;
  GWIN = {from, to, total, pct};

  const bar = el("div", {class: "statefilter"});
  for (const [k, label] of GANTT_SPANS)
    bar.append(el("button", {class: "chip filter" + (key === k ? " on" : ""),
      onclick: () => go("gantt", {ganttSpan: k})}, (key === k ? "✓ " : "") + label));
  bar.append(el("button", {class: "chip filter" + (chains ? " on" : ""),
    title: "Draw the order projects have to happen in",
    onclick: () => go("gantt", {ganttChains: !chains})}, (chains ? "✓ " : "") + "Chains"));
  c.append(el("div", {class: "section"}, bar));

  /* Only the groups with something inside the window, and only their dated
     tasks: a row with no bar is a row of nothing. */
  const shown = [];
  let hiddenRows = 0;
  for (const g of groups) {
    const tasks = g.tasks.filter(t => t.span && inWindow(t.span));
    if (!tasks.length) { if (g.tasks.some(t => t.span)) hiddenRows++; continue; }
    const start = tasks.reduce((a, t) => t.span.start < a ? t.span.start : a, tasks[0].span.start);
    const end   = tasks.reduce((a, t) => t.span.end   > a ? t.span.end   : a, tasks[0].span.end);
    const openN = tasks.filter(t => OPEN_STATES[t.state]).length;
    /* A project whose last task ends next month is not "on time" if something
       inside it was due a fortnight ago, so the group bar goes red when any
       open task in it has run past its end. The whole point of the row is to
       show that without opening it. */
    const late = tasks.some(t => OPEN_STATES[t.state] && t.span.end < todayISO());
    shown.push({group: g, tasks, start, end, openN, late});
  }
  shown.sort((a, b) => a.start.localeCompare(b.start) || a.group.label.localeCompare(b.group.label));

  if (!shown.length) {
    c.append(section("Timeline", 0, el("div", {class: "card"}, el("div", {class: "empty"},
      all.length ? "Nothing falls in this window. Try a longer one, or Fit."
                 : "Nothing has a date yet. Give a task a SCHEDULED day or a deadline " +
                   "and it gets a bar here."))));
    return c;
  }

  const chart = el("div", {class: "gantt"});
  chart.append(ganttHeader(from, to, pct));

  /* Today is the line everything is read against. It is a percentage of the
     track, not of the row, so it is handed to the CSS as a variable and each
     track draws its own slice of the same line -- the alternative is one
     absolute overlay whose 100% includes the label column, which would put the
     line in the wrong place. */
  chart.style.setProperty("--gnow",
    (todayISO() >= from && todayISO() <= to) ? pct(todayISO()) + "%" : "-10%");

  const body = el("div", {class: "gbody"});
  /* The arrows between project bars cannot live in any one row, so they are one
     overlay drawn on top of the rows once the browser has laid them out. */
  const links = el("div", {class: "glinks"});
  body.append(links);

  let drawn = 0;
  const drawTo = upto => {
    for (let i = drawn; i < upto; i++) {
      const row = shown[i];
      body.insertBefore(ganttGroupRow(row, pct), more);
      if (state.ganttOpen === row.group.path)
        for (const t of row.tasks) body.insertBefore(ganttTaskRow(t, pct), more);
    }
    drawn = upto;
    const left = shown.length - drawn;
    if (!left) { more.remove(); }
    else more.set("Show " + Math.min(left, CFG.rowsPerPage) + " more · " + left + " below",
                  left > CFG.rowsPerPage ? "Show all " + shown.length : "");
    if (chains) drawChainArrows(body, links, shown.slice(0, drawn));
  };
  const more = moreRow(() => drawTo(Math.min(shown.length, drawn + CFG.rowsPerPage)),
                       () => drawTo(shown.length));
  body.append(more);
  drawTo(Math.min(shown.length, CFG.rowsPerPage));
  chart.append(body);
  c.append(chart);

  c.append(el("div", {class: "graph-legend"},
    el("span", {class: "glg"}, el("i", {style: "background:var(--todo)"}), "To do"),
    el("span", {class: "glg"}, el("i", {style: "background:var(--doing)"}), "Doing"),
    el("span", {class: "glg"}, el("i", {style: "background:var(--wait)"}), "Waiting for"),
    el("span", {class: "glg"}, el("i", {style: "background:var(--done)"}), "Done"),
    el("span", {class: "glg"}, el("i", {style: "background:var(--late)"}), "Late"),
    el("span", {class: "glg quiet"},
      "Drag a bar to move it, an end to stretch it. A project bar takes its tasks with it. " +
      "Click a row to open it. On a keyboard: Alt+← / Alt+→ by a day, with Shift by a week.")));

  const notes = [];
  if (hiddenRows) notes.push(hiddenRows + " project(s) sit entirely outside this window.");
  if (undated) notes.push(undated + " task(s) have no date at all, so they have no bar - " +
    "a span invented for them would read exactly like a real one.");
  const troubled = shown.filter(r => r.group.trouble);
  if (troubled.length) notes.push(troubled.length + " project(s) start before what they wait " +
    "on has finished - the hatched part of the bar is the overlap.");
  if (notes.length) c.append(el("div", {class: "section quiet"},
    el("div", {style: "color:var(--fg3);font-size:12.5px"}, notes.join(" "))));
  return c;
}

/* Month columns across the top, and the faint lines under them that make a bar
   readable as "ends in March" rather than "ends somewhere over there". */
function ganttHeader(from, to, pct) {
  const head = el("div", {class: "ghead"}, el("div", {class: "glabel"}, ""));
  const track = el("div", {class: "gtrack"});
  let m = from.slice(0, 7) + "-01";
  if (m < from) m = addMonths(m, 1);
  for (; m <= to; m = addMonths(m, 1)) {
    const left = pct(m);
    track.append(el("div", {class: "gtick", style: "left:" + left + "%"}));
    track.append(el("div", {class: "gmon", style: "left:" + left + "%"},
      new Date(m + "T00:00:00Z").toLocaleDateString(undefined,
        {month: "short", year: m.slice(5, 7) === "01" ? "2-digit" : undefined, timeZone: "UTC"})));
  }
  head.append(track);
  return head;
}

const ganttBarClass = (stateKey, end) =>
  "gbar " + (OPEN_STATES[stateKey] && end < todayISO() ? "late" : stateKey);

/* ---------- the drag ----------
   One pointer handler for both kinds of row. It never writes while the pointer
   is down: it moves the bar it was given and keeps the day offset, and the
   commit happens once, on release. So a drag across three months is one edit to
   the file, not ninety. */
let GSUPPRESS = 0;
const swallowedDrag = () => Date.now() - GSUPPRESS < 400;

function dragLabel() {
  const tip = el("div", {class: "gtip"});
  document.body.append(tip);
  return tip;
}

/* mode: "move" | "start" | "end"; commit(days|iso) does the writing. */
function makeDraggable(barEl, {from, to, mode, commit}) {
  if (!GWIN) return;
  const grab = e => {
    if (e.button != null && e.button !== 0) return;
    const track = barEl.closest(".gtrack");
    if (!track) return;
    const width = track.getBoundingClientRect().width;
    if (!width) return;
    const perDay = width / GWIN.total;
    if (perDay <= 0) return;

    e.preventDefault();
    e.stopPropagation();
    const x0 = e.clientX;
    const left0 = parseFloat(barEl.style.left) || 0;
    const w0 = parseFloat(barEl.style.width) || 0;
    const tip = dragLabel();
    const follow = ev => { tip.style.left = ev.clientX + "px"; tip.style.top = ev.clientY + "px"; };
    follow(e);
    let days = 0, moved = false;

    try { barEl.setPointerCapture(e.pointerId); } catch (_) {}
    barEl.classList.add("dragging");

    // A bar cannot be dragged through its own far end, so an end drag is held
    // at the day the other end sits on rather than inverting the span.
    const barDays = Math.max(0, dateDiffDays(from, to));
    const clamp = () => mode === "start" ? Math.min(days, barDays)
                      : mode === "end"   ? Math.max(days, -barDays)
                      : days;
    const paint = () => {
      const d = clamp();
      const dPct = (d * perDay / width) * 100;
      if (mode === "move") barEl.style.left = (left0 + dPct) + "%";
      else if (mode === "start") {
        barEl.style.left = (left0 + dPct) + "%";
        barEl.style.width = Math.max(0.6, w0 - dPct) + "%";
      } else {
        barEl.style.width = Math.max(0.6, w0 + dPct) + "%";
      }
      const s = mode === "end"   ? from : shiftISO(from, d);
      const e = mode === "start" ? to   : shiftISO(to, d);
      tip.textContent = mode === "end"   ? "\u2192 " + e
                      : mode === "start" ? s + " \u2192"
                      : s + " \u2192 " + e;
    };

    const move = ev => {
      follow(ev);
      const next = Math.round((ev.clientX - x0) / perDay);
      if (next === days) return;
      days = next;
      if (days) moved = true;
      paint();
    };
    const up = () => {
      barEl.removeEventListener("pointermove", move);
      barEl.removeEventListener("pointerup", up);
      barEl.removeEventListener("pointercancel", up);
      barEl.classList.remove("dragging");
      tip.remove();
      const d = clamp();
      if (!moved || !d) { barEl.style.left = left0 + "%"; barEl.style.width = w0 + "%"; return; }
      GSUPPRESS = Date.now();
      commit(d);
    };
    barEl.addEventListener("pointermove", move);
    barEl.addEventListener("pointerup", up);
    barEl.addEventListener("pointercancel", up);
  };
  barEl.addEventListener("pointerdown", grab);
}

/* Alt+arrows, so the chart is not drag-only. A plan you can only edit with a
   mouse is a plan half the people here cannot edit. */
function nudgeKeys(rowEl, shift) {
  rowEl.addEventListener("keydown", e => {
    if (!e.altKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    e.preventDefault();
    const step = (e.shiftKey ? 7 : 1) * (e.key === "ArrowLeft" ? -1 : 1);
    shift(step);
  });
}

function ganttGroupRow(row, pct) {
  const g = row.group;
  const open = state.ganttOpen === g.path;
  const left = pct(row.start), right = pct(row.end);
  const movable = row.openN > 0;

  const shift = days => {
    const n = inSpace(g.space, () => shiftProjectBy(g.path, days));
    if (!n) { notify("Nothing open and dated in there to move.", "warn"); return; }
    notify("Moved " + g.label + " " + Math.abs(days) + " day" + (Math.abs(days) === 1 ? "" : "s") +
           (days > 0 ? " later" : " earlier") + " · " + n + " task" + (n === 1 ? "" : "s") + ".");
    if (g.project) offerCascade(g.space, g.path);
    render();
  };

  const barEl = el("span", {class: ganttBarClass(row.openN ? "TODO" : "DONE",
                                                 row.late ? "0000-00-00" : row.end) +
                             (movable ? " movable" : "") + (g.trouble ? " clash" : ""),
    data: {proj: g.project ? g.path : ""},
    style: "left:" + left + "%;width:" + Math.max(0.6, right - left) + "%",
    title: row.start + " → " + row.end +
           (movable ? "  ·  drag to move the whole project" : "")});
  if (movable) makeDraggable(barEl, {from: row.start, to: row.end, mode: "move", commit: shift});

  const track = el("span", {class: "gtrack"}, barEl);
  /* Where the chain says this project is free to start. Drawn even when the bar
     is clear of it, because "it only just fits" is worth seeing too. */
  if (g.deps && g.deps.length) {
    const need = inSpace(g.space, () => earliestStart(g.path));
    if (need && need >= GWIN.from && need <= GWIN.to)
      track.append(el("span", {class: "ggate" + (g.trouble ? " bad" : ""),
        style: "left:" + pct(need) + "%",
        title: "Cannot start before " + need + " - waiting on " +
               inSpace(g.space, () => g.deps.map(pageTitle).join(", "))}));
  }

  const rowEl = el("button", {class: "grow group" + (open ? " open" : "") + (movable ? " movable" : ""),
    data: {row: g.path},
    onclick: () => {
      if (swallowedDrag()) return;
      go("gantt", {ganttOpen: open ? null : g.path});
    },
  },
    el("span", {class: "glabel"},
      el("span", {class: "caret"}, open ? "▾" : "▸"),
      // The name is what gets shortened when the column is narrow, never the
      // count beside it: "Project 0  8 o" tells you nothing.
      el("span", {class: "nm", title: g.label +
        (g.deps && g.deps.length
          ? " - after " + inSpace(g.space, () => g.deps.map(pageTitle).join(", "))
          : "")}, g.label),
      g.blockers && g.blockers.length
        ? el("span", {class: "gdep", title: "Waiting on " +
            inSpace(g.space, () => g.blockers.map(pageTitle).join(", "))}, "⇠") : null,
      el("span", {class: "n"}, row.late ? "late" : row.openN ? row.openN + " open" : "done")),
    track);
  if (movable) nudgeKeys(rowEl, shift);
  return rowEl;
}

function ganttTaskRow(t, pct) {
  const left = pct(t.span.start), right = pct(t.span.end);
  const movable = canMoveTask(t.block);

  const after = (what, msg) => () => {
    touch(t.path);
    GSUPPRESS = Date.now();
    notify(msg);
    render();
  };
  const commitMove = days => inSpace(t.space, () => {
    if (!shiftTaskBy(t.path, t.block, days)) return;
    const s = spanOf(t.block, null);
    after(null, "Moved to " + s.start + " → " + s.end + ".")();
  });
  const commitStart = days => inSpace(t.space, () => {
    if (!setTaskStart(t.path, t.block, shiftISO(t.span.start, days))) return;
    after(null, "Starts " + dateIn(blockProp(t.block, "SCHEDULED")) + ".")();
  });
  const commitEnd = days => inSpace(t.space, () => {
    if (!setTaskEnd(t.path, t.block, shiftISO(t.span.end, days))) return;
    after(null, "Due " + dateIn(blockProp(t.block, "DEADLINE")) + ".")();
  });

  const barEl = el("span", {class: ganttBarClass(t.state, t.span.end) + (movable ? " movable" : ""),
    style: "left:" + left + "%;width:" + Math.max(0.6, right - left) + "%",
    title: t.span.start + " → " + t.span.end + "  ·  " + t.state +
           (movable ? "  ·  drag to move, drag an end to stretch" : "  ·  closed, so it stays put")},
    el("span", {class: "glabelin"}, plainTitle(t.title)));
  if (movable) {
    makeDraggable(barEl, {from: t.span.start, to: t.span.end, mode: "move", commit: commitMove});
    /* Grips only on a bar wide enough to still leave something in the middle:
       two of them on a one-day bar ARE the bar, and it could then only be
       stretched, never moved. A narrow bar keeps the Alt+arrow keys and the
       two date fields in its own panel. */
    if (right - left >= 2.2) {
      const lh = el("span", {class: "ghandle l", title: "Drag to change when it starts"});
      const rh = el("span", {class: "ghandle r", title: "Drag to change when it is due"});
      barEl.append(lh, rh);
      makeDraggable(lh, {from: t.span.start, to: t.span.end, mode: "start", commit: commitStart});
      makeDraggable(rh, {from: t.span.start, to: t.span.end, mode: "end",   commit: commitEnd});
    }
  }

  const rowEl = el("button", {class: "grow task" + (movable ? " movable" : ""),
    onclick: () => {
      if (swallowedDrag()) return;
      inSpace(t.space, () => openTaskDetail(t.path, t.block, t.space));
    }},
    el("span", {class: "glabel sub"},
      el("span", {class: "nm", title: plainTitle(t.title)}, plainTitle(t.title))),
    el("span", {class: "gtrack"}, barEl));
  if (movable) nudgeKeys(rowEl, commitMove);
  return rowEl;
}

/* ---------- the arrows ----------
   Drawn from the DOM rather than from the percentages, because the label column
   is a fixed width and the tracks are what is left: only the browser knows how
   many pixels that turned out to be. Rows that are not on screen yet get no
   arrow, which is the right answer -- an arrow to nothing is noise. */
function drawChainArrows(body, links, rows) {
  links.textContent = "";
  const byPath = new Map();
  for (const r of rows) if (r.group.project) byPath.set(r.group.path, r);
  if (!byPath.size) return;

  const paint = () => {
    links.textContent = "";
    let base;
    try { base = body.getBoundingClientRect(); } catch (_) { return; }
    if (!base.width) return;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "garrows");
    svg.setAttribute("width", String(base.width));
    svg.setAttribute("height", String(base.height));
    svg.setAttribute("viewBox", "0 0 " + base.width + " " + base.height);
    let any = false;

    for (const [path, row] of byPath) {
      for (const dep of (row.group.deps || [])) {
        const src = byPath.get(dep);
        if (!src) continue;
        const a = body.querySelector('.grow.group[data-row="' + CSS.escape(dep) + '"] .gbar');
        const b = body.querySelector('.grow.group[data-row="' + CSS.escape(path) + '"] .gbar');
        if (!a || !b) continue;
        let ra, rb;
        try { ra = a.getBoundingClientRect(); rb = b.getBoundingClientRect(); } catch (_) { continue; }
        const x1 = ra.right - base.left, y1 = ra.top - base.top + ra.height / 2;
        const x2 = rb.left  - base.left, y2 = rb.top - base.top + rb.height / 2;
        // An elbow, not a curve: the vertical leg says "and then", and a bezier
        // across six rows is a decoration you have to decode.
        const mid = x2 > x1 + 14 ? x1 + Math.min(18, (x2 - x1) / 2) : x1 + 12;
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", "M" + x1 + "," + y1 + " H" + mid + " V" + y2 + " H" + x2);
        p.setAttribute("class", "garrow" + (row.group.trouble ? " bad" : ""));
        svg.append(p);
        const head = document.createElementNS("http://www.w3.org/2000/svg", "path");
        head.setAttribute("d", "M" + x2 + "," + y2 + " l-5,-3.2 v6.4 z");
        head.setAttribute("class", "garrowhead" + (row.group.trouble ? " bad" : ""));
        svg.append(head);
        any = true;
      }
    }
    if (any) links.append(svg);
  };

  requestAnimationFrame(paint);
  // The label column halves on a narrow screen, so every arrow is in the wrong
  // place after a rotate. The observer dies with the chart it is watching.
  if (typeof ResizeObserver === "function" && !links.__ro) {
    links.__ro = new ResizeObserver(() => requestAnimationFrame(paint));
    try { links.__ro.observe(body); } catch (_) {}
  }
}

/* ============================================================
   WHAT GOT DONE, AND WHEN
   A report is a different question from a to-do list: not "what is left" but
   "what did we actually finish". The answer is already in the files -- done_by::
   is stamped on the tick, and CLOSED:: or the "- [[end]]" half of Added:: is
   what older entries and hand-edited files carry -- so this reads, it does not
   record.
   ============================================================ */

/* Who ticked it off, without the timestamp that follows the name. */
const closedBy = b => trim(trim(blockProp(b, "done_by") || "")
  .replace(/\s*\d{4}-\d{2}-\d{2}T[\d:]{5,8}Z?\s*$/, ""));

/* The day it was ticked off, from whichever of the three the file has. */
const closedOn = b => (trim(blockProp(b, "done_by") || "").match(/\d{4}-\d{2}-\d{2}/) || [])[0]
  || closedDate(b) || null;

function completedSinceHere(from) {
  const out = [];
  for (const [path, page] of V.pages) {
    if (pageKind(path) === "template") continue;
    walkBlocks(page.blocks, b => {
      if (b.state !== "DONE" || isMessage(b)) return;
      const when = closedOn(b);
      const journal = isJournalPath(path);
      out.push({
        path, block: b, state: "DONE", title: b.title,
        when, undated: !when,
        who: closedBy(b) || journalOwnerOf(path) || "",
        context: contextOf(b.title), due: dueDate(b), assignee: assigneeOf(b),
        project: journal ? null : pageTitle(path),
        projectPath: journal ? null : path,
      });
    });
  }
  return out.filter(r => r.undated || r.when >= from);
}
const completedSince = from =>
  memo("completed:" + from, () => acrossSpaces(() => completedSinceHere(from)));

const REPORT_RANGES = [
  ["month",   "Last month",      1],
  ["quarter", "Last quarter",    3],
  ["half",    "Last 2 quarters", 6],
  ["year",    "Last year",      12],
];

function viewReport() {
  const c = el("div", {class: "wrap"});
  const key = state.reportRange || "month";
  const months = (REPORT_RANGES.find(r => r[0] === key) || REPORT_RANGES[0])[2];
  const from = addMonths(todayISO(), -months);
  const all = completedSince(from);
  const dated = all.filter(r => !r.undated);
  const undated = all.length - dated.length;

  const bar = el("div", {class: "statefilter"});
  for (const [k, label] of REPORT_RANGES)
    bar.append(el("button", {class: "chip filter" + (key === k ? " on" : ""),
      onclick: () => go("report", {reportRange: k, reportWho: state.reportWho})},
      (key === k ? "✓ " : "") + label));
  c.append(el("div", {class: "section"}, bar));

  /* Who ticked things off, in this window. Names come from the files rather
     than from the member list, so somebody who has since left still shows up
     against the work they did. */
  const byWho = new Map();
  for (const r of dated) {
    const name = r.who || "Nobody named";
    byWho.set(name, (byWho.get(name) || 0) + 1);
  }
  const who = state.reportWho || "";
  if (byWho.size > 1) {
    const wbar = el("div", {class: "statefilter"});
    wbar.append(el("button", {class: "chip filter" + (!who ? " on" : ""),
      onclick: () => go("report", {reportRange: key, reportWho: ""})},
      (!who ? "✓ " : "") + "Everyone " + dated.length));
    for (const [name, n] of Array.from(byWho.entries()).sort((a, b) => b[1] - a[1]))
      wbar.append(el("button", {class: "chip filter" + (who === name ? " on" : ""),
        onclick: () => go("report", {reportRange: key, reportWho: name})},
        (who === name ? "✓ " : "") + name + " " + n));
    c.append(el("div", {class: "section"}, wbar));
  }

  const rows = (who ? dated.filter(r => (r.who || "Nobody named") === who) : dated)
    .sort((a, b) => String(b.when).localeCompare(String(a.when)));

  const since = humanDate(from);
  c.append(el("div", {class: "section"},
    el("div", {class: "reportsum"},
      el("b", {}, String(rows.length)),
      " finished since " + since +
      (who ? " by " + who : "") +
      " · " + new Set(rows.map(r => r.project || "No project")).size + " project(s)" +
      (who ? "" : " · " + byWho.size + " person(s)"),
      el("button", {class: "btn sm ghost", style: "margin-left:auto",
        onclick: () => copyReport(rows, since, who)}, "Copy as text"))));

  if (!rows.length) {
    c.append(section("Finished", 0, el("div", {class: "card"}, el("div", {class: "empty"},
      "Nothing ticked off in this window. Tick a task and it lands here."))));
  } else {
    /* Grouped by month, because that is the shape a report is read in: what
       happened in September, then in August. */
    const byMonth = new Map();
    for (const r of rows) {
      const m = r.when.slice(0, 7);
      if (!byMonth.has(m)) byMonth.set(m, []);
      byMonth.get(m).push(r);
    }
    for (const [m, items] of byMonth) {
      const label = new Date(m + "-01T00:00:00Z")
        .toLocaleDateString(undefined, {month: "long", year: "numeric", timeZone: "UTC"});
      c.append(section(label, items.length, pagedCard(items, reportRow)));
    }
  }

  // Never quietly drop work: say what has no date and why it cannot be placed.
  if (undated) c.append(el("div", {class: "section quiet"},
    el("div", {style: "color:var(--fg3);font-size:12.5px"},
      undated + " finished task(s) carry no date, so they are not counted above. " +
      "A task ticked off in the app is stamped done_by:: with the day; one marked " +
      "DONE by hand in the file is not, and nothing can tell when that happened.")));
  return c;
}

function reportRow(r) {
  return el("button", {class: "reprow",
    onclick: () => inSpace(r.space, () => openTaskDetail(r.path, r.block, r.space))},
    el("span", {class: "when"}, humanDate(r.when)),
    el("span", {class: "what", html: renderInline(titleForRow(r.title))}),
    el("span", {class: "marks"},
      r.project ? el("span", {class: "chip proj"}, r.project) : null,
      r.who ? el("span", {class: "chip who"}, r.who) : null));
}

/* A report is written to be pasted somewhere else -- an email, a status
   update, a stand-up note -- so it leaves as plain text rather than only
   living on this screen. */
function copyReport(rows, since, who) {
  const lines = ["Finished since " + since + (who ? " by " + who : "") + " (" + rows.length + ")", ""];
  const byProject = new Map();
  for (const r of rows) {
    const k = r.project || "No project";
    if (!byProject.has(k)) byProject.set(k, []);
    byProject.get(k).push(r);
  }
  for (const [name, items] of Array.from(byProject.entries()).sort((a, b) => b[1].length - a[1].length)) {
    lines.push("## " + name + " (" + items.length + ")");
    for (const r of items)
      lines.push("- " + plainTitle(r.title) + "  - " + r.when + (r.who && !who ? ", " + r.who : ""));
    lines.push("");
  }
  copyText(lines.join("\n"), rows.length + " finished task(s) copied.");
}

/* ---------- every conversation, everywhere ----------
   A thread is only useful if you can find it again. This gathers them from
   every space you have shown, every project and every day page, newest first,
   so "where was that said" is one screen rather than a hunt. */
function allThreadsHere() {
  const out = [];
  for (const [path, page] of V.pages) {
    walkBlocks(page.blocks, b => {
      if (isMessage(b)) return;
      const msgs = messagesOf(b);
      if (!msgs.length) return;
      const last = msgs[msgs.length - 1];
      out.push({
        path, block: b, msgs,
        last, at: msgAt(last),
        unread: unreadCount(b),
        flagged: msgs.filter(flaggedByMe).length,
        // A journal is a day, so say which day rather than printing a raw date.
        where: isJournalPath(path) ? chatDayLabel(baseName(path)) : pageTitle(path),
      });
    });
  }
  return out;
}
const allThreads = () => memo("allThreads", () => acrossSpaces(allThreadsHere)
  .sort((a, b) => String(b.at).localeCompare(String(a.at))));

const CHAT_FILTERS = [["all", "All"], ["unread", "Unread"], ["flagged", "Flagged"]];

function viewChat() {
  const c = el("div", {class: "wrap"});
  const threads = allThreads();
  const mode = state.chatFilter || "all";
  const shown = threads.filter(t =>
    mode === "unread" ? t.unread : mode === "flagged" ? t.flagged : true);

  const bar = el("div", {class: "statefilter"});
  for (const [key, label] of CHAT_FILTERS) {
    const n = key === "unread" ? threads.filter(t => t.unread).length
            : key === "flagged" ? threads.filter(t => t.flagged).length
            : threads.length;
    bar.append(el("button", {class: "chip filter" + (mode === key ? " on" : ""),
      onclick: () => go("chat", {chatFilter: key})},
      (mode === key ? "\u2713 " : "") + label + " " + n));
  }
  c.append(el("div", {class: "section"}, bar));

  if (!shown.length) {
    c.append(section("Chat", 0, el("div", {class: "card"}, el("div", {class: "empty"},
      mode === "flagged" ? "Nothing flagged. The \u2691 on a message keeps it here."
      : mode === "unread" ? "Nothing unread."
      : "No conversations yet. Open a task and say something - everyone in that space sees it."))));
    return c;
  }

  // Clicking a row lands on the task, not merely the page it sits in.
  const chatRow = t => el("button", {class: "chatrow" + (t.unread ? " unread" : ""),
      onclick: () => inSpace(t.space, () => openTaskDetail(t.path, t.block, t.space))},
      avatarNode(msgAuthor(t.last), 34),
      el("div", {class: "chatrow-main"},
        el("div", {class: "chatrow-top"},
          el("span", {class: "task"}, titleForRow(t.block.title)),
          multiSpace() && t.space ? spaceBadge(t.space) : null,
          el("span", {class: "when"}, chatTime(t.at))),
        el("div", {class: "chatrow-last"},
          el("span", {class: "who"}, (samePerson(msgAuthor(t.last), whoAmI()) ? "You" : msgAuthor(t.last)) + ": "),
          t.last.title),
        el("div", {class: "chatrow-where"}, t.where)),
      el("div", {class: "chatrow-marks"},
        t.unread ? el("span", {class: "chip msg b unread"}, t.unread + " new") : null,
        t.flagged ? el("span", {class: "chip flagged"}, "\u2691 " + t.flagged) : null));
  c.append(section(mode === "all" ? "Conversations" : CHAT_FILTERS.find(f => f[0] === mode)[1],
                   shown.length, pagedCard(shown, chatRow)));
  return c;
}

/* ---------- a place to find what you flagged ---------- */
function viewFlagged() {
  const c = el("div", {class: "wrap"});
  const items = flaggedMessages();
  if (!items.length) {
    c.append(section("Flagged", 0, el("div", {class: "card"},
      el("div", {class: "empty"},
        "Nothing flagged. The flag on a message is for things you want to come back to."))));
    return c;
  }
  const card = el("div", {class: "card"});
  for (const it of items) {
    card.append(el("button", {class: "dash-item", onclick: () => {
      if (it.task) openTaskDetail(it.path, it.task);
      else openPage(it.path);
    }},
      el("span", {}, it.msg.title),
      el("span", {class: "p"}, (it.task ? titleForRow(it.task.title) : pageTitle(it.path))),
      el("span", {class: "chip"}, msgAuthor(it.msg))));
  }
  c.append(section("Flagged", items.length, card));
  return c;
}

/* ============================================================
   RECURRENCE, OFFERED RATHER THAN SCHEDULED
   A scheduler fills your list while you are on holiday and hands you a wall of
   overdue chores on the Monday. That is the thing people flee, and this app
   already says so about nudges, so recurrence works the other way round:
   NOTHING is created until you tick the last one off, and even then you are
   asked. Miss a week and you have missed a week -- there is no backlog of
   imaginary Mondays waiting for you.

   The spec lives in the file as plain words -- repeat:: every 2 weeks -- so it
   reads the same in Neovim as it does here.
   ============================================================ */
const REPEAT_PROP = "repeat";
const WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

/* "weekly", "every 2 weeks", "monthly", "every monday" -> a step, or null. */
function parseRepeat(spec) {
  const t = trim(String(spec || "")).toLowerCase().replace(/^every\s+/, "");
  if (!t) return null;
  const named = {
    day: ["day", 1], daily: ["day", 1],
    week: ["day", 7], weekly: ["day", 7],
    fortnight: ["day", 14], fortnightly: ["day", 14], biweekly: ["day", 14],
    month: ["month", 1], monthly: ["month", 1],
    quarter: ["month", 3], quarterly: ["month", 3],
    year: ["month", 12], yearly: ["month", 12], annually: ["month", 12], annual: ["month", 12],
  }[t];
  if (named) return {unit: named[0], n: named[1]};

  const wd = WEEKDAYS.indexOf(t.replace(/s$/, ""));
  if (wd >= 0) return {unit: "weekday", n: wd};

  const m = /^(\d{1,3})\s*(day|week|month|year)s?$/.exec(t);
  if (m) {
    const n = Number(m[1]);
    if (!n) return null;
    if (m[2] === "day")   return {unit: "day",   n};
    if (m[2] === "week")  return {unit: "day",   n: n * 7};
    if (m[2] === "month") return {unit: "month", n};
    return {unit: "month", n: n * 12};
  }
  return null;
}

/* Add months without rolling over: 31 Jan + 1 month is 28 Feb, not 3 March. */
function addMonths(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const target = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  target.setUTCDate(Math.min(d, last));
  return target.toISOString().slice(0, 10);
}

/* The next one after `from`, always strictly later: ticking a chore off late
   should still put the next one in the future, not in the past. */
function nextRepeatDate(spec, from) {
  const step = parseRepeat(spec);
  if (!step) return null;
  const base = dateIn(from) || todayISO();
  if (step.unit === "weekday") {
    const cur = new Date(base + "T00:00:00Z").getUTCDay();
    let ahead = (step.n - cur + 7) % 7;
    if (ahead === 0) ahead = 7;
    return shiftISO(base, ahead);
  }
  let next = step.unit === "month" ? addMonths(base, step.n) : shiftISO(base, step.n);
  // A monthly chore ticked three months late should land next month, not in May.
  let guard = 0;
  while (next <= todayISO() && guard++ < 60)
    next = step.unit === "month" ? addMonths(next, step.n) : shiftISO(next, step.n);
  return next;
}

const repeatOf = b => trim(blockProp(b, REPEAT_PROP) || "");
const REPEAT_CHOICES = ["", "daily", "weekly", "fortnightly", "monthly", "quarterly", "yearly"];

/* Build the next occurrence beside the one just finished. */
function makeNextOccurrence(path, block, when) {
  const page = getPage(path);
  if (!page) return null;
  const copy = newBlock({
    state: "TODO",
    title: block.title,
    body: (block.body || []).slice(),
    props: {},
  });
  // Carry what describes the job; leave behind what described that one doing of it.
  for (const [k, v] of Object.entries(block.props || {})) {
    if (/^(added|closed|done_by|scheduled|deadline|assigned_at)$/i.test(k)) continue;
    copy.props[k] = v;
  }
  setBlockProp(copy, "SCHEDULED", "[[" + when + "]]");
  setBlockProp(copy, "Added", "[[" + todayISO() + "]]");
  stampAuthor(copy);

  const sibs = siblingsOf(page, block);
  const at = sibs.indexOf(block);
  sibs.splice(at < 0 ? sibs.length : at + 1, 0, copy);
  touch(path);
  return copy;
}

function offerNextOccurrence(path, block) {
  const spec = repeatOf(block);
  const when = nextRepeatDate(spec, dueDate(block) || todayISO());
  if (!when) return;
  modal({
    center: true, title: "Again?",
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "font-size:13.5px"},
          "\u201C" + titleForRow(block.title) + "\u201D repeats " + spec + "."),
        el("div", {style: "color:var(--fg2);font-size:13px;margin-top:6px"},
          "Put the next one on " + humanDate(when) + "?"),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:8px"},
          "Nothing is created until you say so, so a week you skipped stays skipped. " +
          "You will never come back to a pile of chores you were not there for."))),
    foot: [
      el("button", {class: "btn ghost", onclick: () => { closeModal(); render(); }}, "Leave it"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: () => {
        closeModal();
        makeNextOccurrence(path, block, when);
        render();
        notify("Next one on " + humanDate(when) + ".");
      }}, "Yes, " + humanDate(when)),
    ],
  });
}

/* ============================================================
   PUTTING A DATED TASK IN A CALENDAR
   Two routes, and the difference matters.

   A .ics file is made here and downloaded. Nothing is sent anywhere, it works
   with every calendar there is, and it is the only route that works offline.

   A deeplink opens the calendar's own "new event" screen with the fields
   filled in. One click instead of download-then-import -- but the title and
   the date travel to Microsoft or Google in the URL, because that is how the
   link works. That is a per-click disclosure you can see happening, which is
   a different thing from subscribing a feed, and it is why there is no feed
   here: a subscription would hand over the whole list, forever, to a URL whose
   only protection is that nobody has guessed it.

   Navigation is not connect-src, so the CSP does not block these and does not
   need widening.
   ============================================================ */
const CAL_PREF_KEY = "calendar";
const calendarChoice = () => PREF.get(CAL_PREF_KEY, "");

const icsDate = iso => String(iso).replace(/-/g, "");
const icsEsc = t => String(t || "")
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/* RFC 5545 wants lines folded at 75 octets; a long task title otherwise makes
   a file some calendars quietly refuse. */
const icsFold = line => {
  const out = [];
  let rest = line;
  while (rest.length > 73) { out.push((out.length ? " " : "") + rest.slice(0, 73)); rest = rest.slice(73); }
  out.push((out.length ? " " : "") + rest);
  return out.join("\r\n");
};

function icsFor(items) {
  const now = nowStamp().replace(/[-:]/g, "");
  const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//GroupTodo//EN", "CALSCALE:GREGORIAN"];
  items.forEach((a, i) => {
    const day = a.due;
    if (!day) return;
    out.push("BEGIN:VEVENT");
    out.push(icsFold("UID:" + (a.block.id || ("gtd-" + i)) + "@grouptodo"));
    out.push("DTSTAMP:" + now);
    // All-day: DTEND is exclusive, so a one-day task ends the next morning.
    out.push("DTSTART;VALUE=DATE:" + icsDate(day));
    out.push("DTEND;VALUE=DATE:" + icsDate(shiftISO(day, 1)));
    out.push(icsFold("SUMMARY:" + icsEsc(titleForRow(a.title))));
    const notes = [a.project ? "Project: " + a.project : null,
                   a.context ? "Context: @" + a.context : null,
                   a.assignee ? "For: " + a.assignee : null].filter(Boolean).join("\n");
    if (notes) out.push(icsFold("DESCRIPTION:" + icsEsc(notes)));
    out.push("TRANSP:TRANSPARENT");          // a to-do should not show you as busy
    out.push("END:VEVENT");
  });
  out.push("END:VCALENDAR");
  return out.join("\r\n") + "\r\n";
}

/* Deeplinks. Outlook on the web -- "new Outlook" included, which is the web
   app in a window -- takes a compose URL; Google takes a template URL. */
function calendarLink(kind, a) {
  const title = titleForRow(a.title);
  const start = a.due, end = shiftISO(a.due, 1);
  const body = [a.project ? "Project: " + a.project : null,
                a.context ? "Context: @" + a.context : null].filter(Boolean).join("\n");
  if (kind === "outlook" || kind === "outlook-personal") {
    const host = kind === "outlook" ? "https://outlook.office.com" : "https://outlook.live.com";
    return host + "/calendar/0/deeplink/compose?" + new URLSearchParams({
      path: "/calendar/action/compose", rru: "addevent", allday: "true",
      subject: title, startdt: start, enddt: end, body,
    }).toString();
  }
  if (kind === "google") {
    return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
      action: "TEMPLATE", text: title,
      dates: icsDate(start) + "/" + icsDate(end), details: body,
    }).toString();
  }
  return null;
}

const CALENDARS = [
  ["outlook",          "Outlook (work or school)"],
  ["outlook-personal", "Outlook.com"],
  ["google",           "Google Calendar"],
  ["ics",              "Download a file (any calendar)"],
];

function sendToCalendar(kind, items) {
  if (kind === "ics" || !items.every(a => a.due)) {
    const name = items.length === 1
      ? "task-" + slugify(titleForRow(items[0].title)).toLowerCase().replace(/[^\w-]+/g, "-") + ".ics"
      : "grouptodo-dates.ics";
    downloadText(name, icsFor(items));
    notify("Saved " + name + ". Open it and your calendar will offer to add " +
           (items.length === 1 ? "it." : "them."));
    return;
  }
  if (items.length > 1) {           // no deeplink takes a batch; the file does
    downloadText("grouptodo-dates.ics", icsFor(items));
    notify("That calendar takes one event per link, so here are all " + items.length +
           " as a file instead.");
    return;
  }
  const url = calendarLink(kind, items[0]);
  if (!url) return;
  window.open(url, "_blank", "noopener");
}

/* One picker, remembered, so the second time is a single click. */
function openCalendarPicker(items) {
  const dated = items.filter(a => a.due);
  if (!dated.length) { notify("Nothing here has a date yet.", "warn"); return; }
  const body = el("div", {});
  body.append(el("div", {class: "field"},
    el("div", {style: "font-size:13.5px"},
      dated.length === 1 ? "\u201C" + titleForRow(dated[0].title) + "\u201D on " + humanDate(dated[0].due) + "."
        : dated.length + " dated tasks."),
    el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
      "A file is made here and goes nowhere. The links open your calendar's own new-event " +
      "screen, which means the title and date travel in the web address - fine for a " +
      "meeting, worth a thought for anything private.")));
  const list = el("div", {});
  for (const [kind, label] of CALENDARS) {
    list.append(el("button", {class: "pick", onclick: () => {
      PREF.set(CAL_PREF_KEY, kind);
      closeModal();
      sendToCalendar(kind, dated);
    }},
      el("span", {class: "k"}, kind === "ics" ? "\u2193" : "\u2197"),
      el("span", {style: "flex:1"}, label),
      calendarChoice() === kind ? el("span", {class: "d"}, "last used") : null));
  }
  body.append(el("div", {class: "field"}, el("label", {}, "Send it to"), list));
  modal({center: true, title: "Add to calendar", body,
         foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel")]});
}

/* The button itself: straight to the remembered calendar, long-press-free. */
function addToCalendar(items) {
  const dated = items.filter(a => a.due);
  if (!dated.length) { notify("Give it a date first - SCHEDULED or a deadline.", "warn"); return; }
  const chosen = calendarChoice();
  if (!chosen) return openCalendarPicker(dated);
  sendToCalendar(chosen, dated);
}

/* ---------- claiming what was waiting for you ----------
   Before you existed here, a colleague could only name you: "assigned:: Kenneth"
   on somebody who was not a member became a WAIT, because nobody in the space
   could tick it off. The moment you arrive that stops being true, so the app
   offers you the pile.

   Claiming does not take anything away from them. The row is the same row --
   they wrote it, so it stays in their Waiting for -- it just becomes a live
   task in your name rather than a note that they are waiting on an outsider. */
function nameMatches(assigned, me) {
  if (samePerson(assigned, me)) return true;
  const a = slugPerson(assigned).toLowerCase().split(/\s+/).filter(Boolean);
  const m = slugPerson(me).toLowerCase().split(/\s+/).filter(Boolean);
  if (!a.length || !m.length) return false;
  // "Kenneth" matches "Kenneth Aar"; "Kenneth Berg" does not.
  return a.every(t => m.includes(t));
}

function claimableFor(me) {
  if (!me) return [];
  const out = [];
  const mine = m => samePerson(m, me);
  for (const [path, page] of V.pages) {
    walkBlocks(page.blocks, b => {
      const who = assigneeOf(b);
      if (!who || !OPEN_STATES[b.state]) return;
      if (!nameMatches(who, me)) return;
      // Somebody else of that name is already here; it is theirs, not yours.
      if (isMember(who) && !mine(who)) return;
      // Written with your exact name before you arrived, it is already "yours"
      // -- but it was filed as a WAIT because nobody here could act on it, and
      // nothing flips that back on its own. Those need claiming too.
      if (mine(who) && b.state !== "WAIT") return;
      out.push({path, block: b, named: who, by: trim(blockProp(b, "by") || "")});
    });
  }
  return out;
}

function claimThese(items, me) {
  for (const it of items) {
    setBlockProp(it.block, ASSIGN_PROP, me);
    if (it.block.state === "WAIT") it.block.state = "TODO";   // you can act on it now
    touch(it.path);
  }
  render();
  notify(items.length + (items.length === 1 ? " task is" : " tasks are") +
         " yours now. Still in their Waiting for - they wrote it, you own it.");
}

function openClaimPrompt(items, me) {
  const picked = new Set(items.map((_, i) => i));
  const card = el("div", {class: "card"});
  items.forEach((it, i) => {
    const box = el("button", {class: "spacetoggle on", onclick: () => {
      if (picked.has(i)) { picked.delete(i); box.classList.remove("on"); box.textContent = ""; }
      else { picked.add(i); box.classList.add("on"); box.textContent = "\u2713"; }
    }}, "\u2713");
    card.append(el("div", {class: "dash-item", style: "cursor:default;gap:10px"},
      box,
      el("span", {style: "flex:1"}, it.block.title),
      el("span", {class: "chip"}, (it.by ? it.by : "somebody") + " \u2192 " + it.named)));
  });

  modal({
    center: true,
    title: items.length === 1 ? "Somebody is waiting on you" : items.length + " things are waiting on you",
    hint: "written before you joined",
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "font-size:13.5px"},
          "These were put down with your name on them while you were not here yet, so " +
          "they count as something your colleagues are waiting for. Take them on and they " +
          "become your tasks."),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "They stay in your colleagues' Waiting for either way - they wrote them, " +
          "so they keep watching them.")),
      el("div", {class: "field"}, card)),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Not mine"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: () => {
        const take = items.filter((_, i) => picked.has(i));
        closeModal();
        if (take.length) claimThese(take, me);
      }}, "Take them on"),
    ],
  });
}

/* Called once a name is known and a space is loaded. */
function checkClaimable() {
  const me = whoAmI();
  if (!me) return;
  const items = claimableFor(me);
  if (!items.length) return;
  let waited = 0;
  const show = () => {
    if (!$("#modalRoot").firstChild && !busyEditing()) return openClaimPrompt(items, me);
    if ((waited += 1500) > 60000) return;
    setTimeout(show, 1500);
  };
  setTimeout(show, 700);
}

/* Hand it to somebody who is not in the space: a name, and nothing more to it,
   because there is nobody on the other end to notify. */
function openAssignOther(path, block) {
  const input = el("input", {placeholder: "Name", value: assigneeOf(block)});
  modal({
    center: true, title: "Waiting on somebody",
    body: el("div", {},
      el("div", {class: "field"}, el("label", {}, "Who"), input,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "They are not in this space, so this becomes something you are waiting " +
          "for rather than a task anybody here can tick off."))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: () => {
        const name = trim(input.value);
        closeModal();
        if (name) assignBlock(path, block, name);
      }}, "Waiting on them"),
    ],
  });
  setTimeout(() => input.focus(), 30);
}

/* ============================================================
   INVITING SOMEBODY
   "Here is the app, and it already knows about our space." One file, and on
   opening it they are in, with the list in front of them.

   What a browser will NOT let us do is hand over a folder: a directory handle
   cannot be serialised or transferred, by design. So the invite carries
   everything else -- the space's name and colour, the server address when
   there is one, and a full snapshot of the vault -- and for a folder-backed
   space it names the folder and leaves one button to press. A server-backed
   space needs nothing at all: the address is in the file.
   ============================================================ */
const INVITE_TAG = "gtd:invite";

function inviteConfig() {
  const sp = Spaces.get(Spaces.active) || {};
  const cfg = {v: 1, space: sp.name, color: sp.color, from: whoAmI() || null, at: nowStamp()};
  if (sp.kind === "http" && sp.server) { cfg.kind = "http"; cfg.server = sp.server; }
  else if (sp.kind === "fs") { cfg.kind = "fs"; cfg.folder = sp.label || sp.name; }
  else cfg.kind = "local";
  return cfg;
}

/* The invite IS a vault bundle, with a config comment in front. An older copy
   of the app ignores the comment and still imports the pages. */
function inviteMarkdown() {
  return "<!-- " + INVITE_TAG + " " + JSON.stringify(inviteConfig()) + " -->\n" +
         bundleMarkdown();
}

function parseInvite(text) {
  const m = new RegExp("<!--\\s*" + INVITE_TAG + "\\s*(\\{[\\s\\S]*?\\})\\s*-->").exec(String(text).slice(0, 8000));
  if (!m) return null;
  try { const cfg = JSON.parse(m[1]); return cfg && cfg.space ? cfg : null; } catch (_) { return null; }
}

/* Put the space in place, then the pages, then say what is left to do. */
async function applyInvite(cfg, text) {
  const name = trim(cfg.space).replace(/[^\w \-]/g, "").slice(0, 40) || "Shared";
  let sp = Spaces.get(name);
  if (!sp) {
    sp = {name, kind: cfg.kind === "http" ? "http" : "local", color: cfg.color || undefined};
    if (cfg.kind === "http" && cfg.server) sp.server = cfg.server;
    sp.askedStorage = cfg.kind === "http";       // a server needs no folder
    await Spaces.add(sp);
  }
  await openSpace(name);
  const report = mergeBundle(parseBundle(text));
  ensureMemberPage();
  await flush();
  render();
  markSeen();                                   // their first visit is not "news"
  return {name, report, cfg};
}

  modal({

    body: el("div", {},

        el("div", {style: "font-size:13.5px"},

/* ---------- making one ---------- */
async function bakeInviteHtml() {
  // Only possible where the app can read its own source: a served page can
  // fetch itself, a file:// page cannot.
  const r = await fetch(location.href, {cache: "no-store"});
  const src = await r.text();
  if (!/<title>/i.test(src)) throw new Error("could not read the app's own file");
  // The vault is full of <!-- gtd:file --> comments, and a bare "<" inside a
  // script element puts the HTML parser into its legacy comment state, which
  // silently swallows the rest of the document. Escaping every "<" (and the two
  // line separators JSON leaves raw) keeps the payload inert text.
  const json = JSON.stringify({cfg: inviteConfig(), vault: bundleMarkdown()})
    .replace(/</g, "\\u003c")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
  const payload = "\n<script type=\"application/x-gtd-invite\">" + json + "<\/script>\n";
  // Split, never written whole: a literal closing body tag in this very source
  // is itself the first match in the file we are editing, so writing one here
  // made the app inject its payload into the middle of its own script.
  const closeBody = "<\/" + "body>";
  const at = src.lastIndexOf(closeBody);
  if (at === -1) throw new Error("no closing body tag in the app file");
  return src.slice(0, at) + payload + src.slice(at);
}

/* ---------- what happened while you were away ----------
   There is nobody to push a notification, so the app looks for itself: on
   opening a space, what changed that is actually about me. Two things qualify
   -- work somebody handed me, and work I handed over that is now finished.

   "Last seen" is per device and never written to the vault. One person marking
   their news read must not mark it read for everybody, and a shared file is
   exactly the wrong place to keep that. */
const seenKey = () => "seen:" + (Spaces.active || "");
const lastSeen = () => PREF.get(seenKey(), "");
const markSeen = () => PREF.set(seenKey(), nowStamp());

function newsSince(since) {
  const me = whoAmI();
  if (!me) return [];
  const out = [];
  for (const [path, page] of V.pages) {
    walkBlocks(page.blocks, b => {
      const at = trim(blockProp(b, "assigned_at") || "");
      const who = assigneeOf(b);
      const by = trim(blockProp(b, "by") || "");
      // Handed to me by somebody else, since I last looked.
      if (who && samePerson(who, me) && at && at > since && !samePerson(by, me) &&
          OPEN_STATES[b.state])
        out.push({kind: "given", path, block: b, at, who: by || "somebody"});
      // Somebody said something on a task I am part of -- mine, or one I wrote.
      if (isMessage(b)) return;
      for (const m of messagesOf(b)) {
        if (samePerson(msgAuthor(m), me)) continue;
        if (msgAt(m) <= since) continue;
        // "Mine" is wider than by::, which is only stamped on a state change:
        // a task you simply typed carries no author at all. It is yours if it
        // is on your day page, if you wrote it, if it is assigned to you, or
        // if you have already said something in the thread.
        const involved = samePerson(assigneeOf(b), me) || samePerson(by, me) ||
                         (isJournalPath(path) && myJournal(path)) ||
                         messagesOf(b).some(x => samePerson(msgAuthor(x), me));
        if (!involved) continue;
        out.push({kind: "said", path, block: b, at: msgAt(m), who: msgAuthor(m), text: m.title});
      }
      // Something I handed over, now done by them.
      const raw = trim(blockProp(b, "done_by") || "");
      if (raw && samePerson(by, me) && !samePerson(raw.split(/\s+/)[0], me)) {
        const when = (raw.match(/\d{4}-\d{2}-\d{2}T[\d:]+Z/) || [])[0] || "";
        if (when && when > since)
          out.push({kind: "finished", path, block: b, at: when, who: raw.split(/\s+/)[0]});
      }
    });
  }
  return out.sort((x, y) => y.at.localeCompare(x.at));
}

function openNews(items) {
  const card = el("div", {class: "card"});
  for (const n of items) {
    card.append(el("button", {class: "dash-item", onclick: () => {
      closeModal(); markSeen();
      if (n.kind === "said") openTaskDetail(n.path, n.block); else openPage(n.path);
    }},
      el("span", {}, (n.kind === "given" ? "\u2192 " : n.kind === "said" ? "\u25CB " : "\u2713 ") +
        (n.kind === "said" ? n.text : n.block.title)),
      el("span", {class: "chip"},
        n.kind === "given"    ? "from " + n.who
        : n.kind === "said"   ? n.who + " on " + titleForRow(n.block.title)
        : n.who + " finished it")));
  }
  modal({
    center: true,
    title: items.length === 1 ? "One thing happened" : items.length + " things happened",
    hint: "since you last opened " + (Spaces.active || "this space"),
    body: el("div", {}, el("div", {class: "field"}, card),
      el("div", {style: "color:var(--fg3);font-size:12px"},
        "Nobody was notified when this happened - there is no server to do it. " +
        "The app checks for you when you open the space.")),
    foot: [
      el("button", {class: "btn ghost", onclick: () => { markSeen(); closeModal(); }}, "Later"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn primary", onclick: () => {
        markSeen(); closeModal(); go("todos");
      }}, "Got it"),
    ],
  });
}

/* Called after a space finishes loading. Silent on the very first visit: a
   brand new space has no "while you were away". */
function checkNews() {
  if (!whoAmI() || members().length < 2) return;
  const since = lastSeen();
  if (!since) { markSeen(); return; }
  const items = newsSince(since);
  if (!items.length) { markSeen(); return; }
  // Something else may own the screen on arrival -- onboarding, a folder
  // question. Wait for it rather than dropping the news on the floor, but give
  // up after a minute so this never ambushes somebody mid-task.
  let waited = 0;
  const show = () => {
    if (!$("#modalRoot").firstChild && !busyEditing()) return openNews(items);
    if ((waited += 1500) > 60000) return;
    setTimeout(show, 1500);
  };
  setTimeout(show, 600);
}

/* ============================================================
   ASKING SOMEBODY OUTSIDE FOR AN UPDATE
   Half of a shared list is work other people owe you, and the people who owe
   it to you are mostly not in your list. Waiting for already knows what they
   owe; what it could not do was ask. So you ended up writing the same email
   by hand every fortnight, pasting four task titles into it, and typing their
   reply back in one task at a time.

   One file does the round trip instead. You send them a self-contained HTML
   page -- no account, no invite, no server, the same bargain as the rest of
   GroupTodo. They double-click it, tick what they finished, type a note where
   a note is worth typing, and press one button. That writes a small markdown
   file. You open that file here and it lands on the right tasks.

   The check-in sheet is NOT a copy of your vault. It carries the titles you
   chose and nothing else: no project names, no colleagues, no other tasks,
   no files. Somebody forwarding it leaks four sentences, not a space.
   ============================================================ */

/* When you last asked, and who you asked. Dropped the moment they answer:
   "asked and heard nothing" is the thing worth measuring, and once they have
   replied there is nothing outstanding to measure. */
const ASKED_PROP = "asked";
const askedAt   = b => (trim(blockProp(b, ASKED_PROP) || "").match(/\d{4}-\d{2}-\d{2}/) || [])[0] || null;
const askedDays = b => { const d = askedAt(b); return d ? dateDiffDays(d, todayISO()) : null; };

/* What this person owes you: anything open with their name on it. WAIT is the
   usual shape, but a TODO somebody handed to a name the app does not know is
   the same debt wearing different clothes. */
function waitingOnFrom(name) {
  if (!name) return [];
  return leafActions().filter(a =>
    OPEN_STATES[a.state] && a.assignee && samePerson(a.assignee, name) &&
    !samePerson(name, whoAmI()));
}

/* People with open work who are not in the space -- the ones a sheet is for.
   A colleague who IS in the space does not need one: they can see the list. */
function outsidersOwingMe() {
  const by = new Map();
  for (const a of leafActions()) {
    if (!OPEN_STATES[a.state] || !a.assignee) continue;
    if (isMember(a.assignee) || samePerson(a.assignee, whoAmI())) continue;
    const k = slugPerson(a.assignee);
    if (!by.has(k)) by.set(k, {name: a.assignee, items: []});
    by.get(k).items.push(a);
  }
  return Array.from(by.values()).sort((x, y) => x.name.localeCompare(y.name));
}

/* Anybody owing you something you have never asked about, or asked about long
   enough ago that it has gone quiet. */
function updatesWorthAsking() {
  return outsidersOwingMe().filter(p => p.items.some(a => {
    const d = askedDays(a.block);
    return d == null ? (a.age ?? 0) >= CFG.waitFollowUpDays : d >= CFG.waitFollowUpDays;
  }));
}

/* ---------- the sheet ---------- */
const firstNameOf = n => trim(String(n || "").split(/\s+/)[0] || "there");
const jsonForScript = o => JSON.stringify(o).replace(/</g, "\\u003c");

/* One HTML file, no network, no libraries, no fonts to fetch: it has to open

function checkinSheetHtml({to, from, items, replyTo}) {

  return `<!doctype html>

<script>
(function(){
var D = JSON.parse(document.getElementById("gtd-data").textContent);
var S = {};
var KEY = "gtd-checkin:" + D.at;
try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { S = {}; }
function keep(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function st(k){ return S[k] || (S[k] = {done:false, note:"", open:false}); }

var rows = document.getElementById("rows");
var countEl = document.getElementById("count");

function count(){
  var n = 0;
  D.items.forEach(function(it){ if (st(it.k).done) n++; });
  countEl.textContent = n + " of " + D.items.length + " done";
}
function draw(){
  rows.textContent = "";
  D.items.forEach(function(it){
    var s = st(it.k);
    var row = document.createElement("div");
    row.className = "row" + (s.done ? " done" : "");

    var hit = document.createElement("button");
    hit.type = "button"; hit.className = "hit";
    hit.setAttribute("aria-pressed", String(!!s.done));
    var box = document.createElement("span");
    box.className = "box"; box.textContent = "✓"; box.setAttribute("aria-hidden", "true");
    var t = document.createElement("span"); t.className = "t";
    var name = document.createElement("span"); name.textContent = it.t;
    t.appendChild(name);
    if (it.asked) { var m = document.createElement("span"); m.className = "meta"; m.textContent = it.asked; t.appendChild(m); }
    hit.appendChild(box); hit.appendChild(t);
    hit.addEventListener("click", function(){ s.done = !s.done; keep(); draw(); count(); });
    row.appendChild(hit);

    var nd = document.createElement("div"); nd.className = "note";
    if (s.open || s.note) {
      var ta = document.createElement("textarea");
      ta.value = s.note || "";
      ta.placeholder = "Anything " + D.from.split(" ")[0] + " should know (optional)";
      ta.setAttribute("aria-label", "Note on: " + it.t);
      ta.addEventListener("input", function(){ s.note = ta.value; keep(); });
      nd.appendChild(ta);
    } else {
      var b = document.createElement("button");
      b.type = "button"; b.className = "notebtn"; b.textContent = "Add a note";
      b.addEventListener("click", function(){ s.open = true; keep(); draw(); });
      nd.appendChild(b);
    }
    row.appendChild(nd);
    rows.appendChild(row);
  });
}
function stamp(){ return new Date().toISOString().replace(/\\.\\d+Z$/, "Z"); }
function reply(){
  var at = stamp();
  var out = [];
  out.push("<" + "!-- GroupTodo update. Open it with Vault & sync → Open vault file. --" + ">");
  out.push("<" + "!-- gtd:reply v1 --" + ">");
  out.push("");
  out.push("From: " + D.to);
  out.push("For: " + D.from);
  out.push("At: " + at);
  out.push("");
  var items = [];
  D.items.forEach(function(it){
    var s = st(it.k);
    out.push("- [" + (s.done ? "x" : " ") + "] " + it.t);
    var note = (s.note || "").replace(/\\s+$/, "");
    if (note) note.split(/\\r?\\n/).forEach(function(l){ out.push("  " + l); });
    items.push({k: it.k, done: !!s.done, note: note});
  });
  out.push("");
  out.push("<" + "!-- gtd:replydata");
  out.push(JSON.stringify({v: 1, from: D.to, "for": D.from, at: at, items: items}));
  out.push("gtd:endreplydata --" + ">");
  out.push("");
  return out.join("\\n");
}
function fileName(){
  return "grouptodo-update-" + D.to.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md";
}
function say(node){

}
document.getElementById("send").addEventListener("click", function(){

  var p = document.createElement("p");

        + "&body=" + encodeURIComponent("Here is my update - the file is attached.\\n\\n" + text);
      a2.textContent = "Open an email to " + D.replyTo;

document.getElementById("copy").addEventListener("click", function(){

  if (navigator.clipboard && navigator.clipboard.writeText)

function showText(text){

draw(); count();

/* ---------- asking ---------- */
function openAskForUpdate(name) {
  const me = whoAmI();
  if (!me) { notify("Put your name in first - the sheet has to say who is asking.", "warn"); return; }
  const found = waitingOnFrom(name);
  if (!found.length) {
    notify("Nothing open with " + name + "'s name on it.", "warn");
    return;
  }

  const pick = new Set(found.map((_, i) => i));
  const email = el("input", {type: "email", placeholder: "you@example.com (optional)",
    value: PREF.get("myEmail", "")});
  const card = el("div", {style: "max-height:40vh;overflow:auto"});
  const summary = el("div", {style: "color:var(--fg3);font-size:12.5px;margin-top:8px"});
  const refresh = () => {
    summary.textContent = pick.size
      ? pick.size + (pick.size === 1 ? " line" : " lines") + " go to " + name +
        ". Nothing else about your vault goes with them."
