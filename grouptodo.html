  };

  found.forEach((a, i) => {
    const on = () => pick.has(i);
    const box = el("button", {class: "spacetoggle on", onclick: () => {
      if (on()) pick.delete(i); else pick.add(i);
      box.className = "spacetoggle" + (on() ? " on" : "");
      box.textContent = on() ? "✓" : "";
      refresh();
    }}, "✓");
    const d = askedDays(a.block);
    card.append(el("div", {style: "display:flex;gap:10px;align-items:flex-start;margin:7px 0"},
      box,
      el("div", {style: "min-width:0;flex:1"},
        el("div", {}, plainTitle(a.title)),
        el("div", {style: "color:var(--fg3);font-size:12px"},
          [a.project || baseName(a.path),
           a.age != null ? "open " + a.age + "d" : null,
           d != null ? "asked " + d + "d ago" : "never asked"
          ].filter(Boolean).join(" · ")))));
  });
  refresh();

  modal({
    center: true, title: "Ask " + name + " for an update",
    hint: found.length + " open",
    body: el("div", {},
      el("div", {class: "field"},
        el("label", {}, "What to ask about"),
        card, summary),
      el("div", {class: "field"},
        el("label", {}, "Your email, so the sheet can offer a reply button"),
        email,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Optional, and it goes only into this one file. Leave it blank and they " +
          "just send the file back the way they got it.")),
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg3);font-size:12.5px"},
          "One HTML file. They double-click it, tick what is done, press one button, and " +
          "send you back the small file it writes. Nothing is uploaded and " + name +
          " never needs an account."))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn ghost", onclick: () => { closeModal(); importUpdatePasted(); }},
        "Paste a reply"),
      el("button", {class: "btn ghost", onclick: () => { closeModal(); importUpdateFromFile(); }},
        "Import a file"),
      el("button", {class: "btn primary", onclick: () => {
        const chosen = found.filter((_, i) => pick.has(i));
        if (!chosen.length) { notify("Pick at least one thing to ask about.", "warn"); return; }
        const replyTo = trim(email.value);
        if (replyTo) PREF.set("myEmail", replyTo);

        /* A durable id on each line, so their answer can find its way home even
           after the file has been re-read and every in-memory id regenerated. */
        const items = chosen.map(a => inSpace(a.space, () => {
          const id = ensureBlockId(a.path, a.block);
          setBlockProp(a.block, ASKED_PROP, me + " " + nowStamp());
          touch(a.path);
          const d = a.age;
          return {
            key: [a.space || "", a.path, id].join("\u0001"),
            title: a.title,
            askedLabel: d != null && d > 0 ? "on " + name + "'s plate " + d + " days" : "",
          };
        }));

        const file = "grouptodo-check-in-" +
          slugPerson(name).toLowerCase().replace(/[^\w-]+/g, "-") + ".html";
        closeModal();
        sendFileOut(file, checkinSheetHtml({to: name, from: me, items, replyTo}),
                    "text/html", {title: "Update for " + me}).then(how => {
          if (how === "cancelled") return;
          notify((how === "shared" ? "Sent " : "Saved ") + file + " - " + items.length +
                 " line" + (items.length === 1 ? "" : "s") + " for " + name +
                 ". When the reply comes back, open it here.");
          render();
          // Saving the file is half the job; it still has to reach them with
          // something that reads like you wrote it.
          if (how !== "shared") setTimeout(() => openAskNote(name, items, file), 250);
        });
      }}, "Make the sheet"),
    ],
  });
}

/* ---------- the note that carries the sheet ----------
   They are about to get an HTML attachment from somebody, which is the shape of
   a phishing mail. The note has to earn the open, and a logo will not do it.
   Two things will: the items are named, because a stranger could not have known
   them, and they are told outright that they can ignore the attachment and just
   reply. A request nobody is allowed to refuse is a request people learn to
   ignore.

   No em dashes in here. It lands in somebody's mail client, where a dash that
   is not on the keyboard reads as something a machine wrote, and the whole job
   of this note is to read as though a person wrote it. */
const ASK_NOTE = {
  en: {
    subject: (n) => (["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"][n] || n)
      + (n === 1 ? " thing" : " things") + " I'm waiting for - 2 minute check-in",
    body: (them, me, items, file) => [
      "Hei " + them + ",",
      "",
      "I'm chasing a few things and I'd rather not ping you about them one at a time,",
      "so I've put them in " + file + ", attached:",
      "",
      items,
      "",
      "It is a page that opens in your browser. No login, no account, nothing to",
      "install. Tick what's done, and the button at the bottom sends the answers",
      "back to me.",
      "",
      "If you'd rather not open an attachment, just reply to this and tell me which",
      "ones are done. That works just as well.",
      "",
      "Thanks,",
      me,
    ].join("\n"),
  },
  no: {
    subject: (n) => (["Ingen","\u00c9n","To","Tre","Fire","Fem","Seks","Sju","\u00c5tte","Ni","Ti"][n] || n)
      + " ting jeg venter p\u00e5 - 2 minutters sjekk",
    body: (them, me, items, file) => [
      "Hei " + them + ",",
      "",
      "Jeg venter p\u00e5 noen ting, og vil helst slippe \u00e5 mase om dem \u00e9n av gangen,",
      "s\u00e5 jeg har samlet dem i " + file + ", som ligger ved:",
      "",
      items,
      "",
      "Det er en side som \u00e5pner seg i nettleseren din. Ingen innlogging, ingen konto,",
      "ingenting \u00e5 installere. Huk av det som er gjort, s\u00e5 sender knappen nederst",
      "svarene tilbake til meg.",
      "",
      "Vil du heller ikke \u00e5pne et vedlegg, er det bare \u00e5 svare p\u00e5 denne og si hvilke",
      "som er gjort. Det funker like bra.",
      "",
      "Takk,",
      me,
    ].join("\n"),
  },
};
const askLang = () => (PREF.get("askLang", "") === "no" ? "no" : "en");

function askNote(name, items, file) {
  const t = ASK_NOTE[askLang()];
  const lines = items.map(i => "  \u00b7 " + plainTitle(i.title)
    + (i.askedLabel ? "  (" + i.askedLabel + ")" : "")).join("\n");
  return {subject: t.subject(items.length),
          body: t.body(name.split(" ")[0], whoAmI() || "", lines, file)};
}

/* mailto: carries to, subject and body and nothing else, so the file is
   attached by hand either way. Teams takes a chat deep link with the message

function openAskNote(name, items, file) {

      el("div", {class: "field"},
        el("label", {}, "Language"),
        el("div", {class: "statefilter"},
          ...[["en", "English"], ["no", "Norsk"]].map(([code, label]) =>
            el("button", {class: "chip filter" + (askLang() === code ? " on" : ""),

}

/* ---------- their reply, coming back ---------- */
function parseUpdateReply(text) {
  const m = /<!--\s*gtd:replydata\s*([\s\S]*?)\s*gtd:endreplydata\s*-->/.exec(String(text || ""));
  if (!m) return null;
  let data;
  try { data = JSON.parse(m[1]); } catch (_) { return null; }
  if (!data || !Array.isArray(data.items)) return null;
  return data;
}

/* Their answer has to land on the exact block it came from. The key carries the
   space and the page, and the id:: is what survives a reparse; the whole-vault
   sweep is the fallback for a task somebody has since moved to another page. */
function resolveReplyItem(item) {
  const [space, path, id] = String(item.k || "").split("\u0001");
  if (!id) return null;
  const look = () => {
    let hit = null;
    const page = getPage(path);
    if (page) walkBlocks(page.blocks, b => {
      if (!hit && trim(blockProp(b, "id") || "") === id) hit = {path, block: b};
    });
    if (hit) return hit;
    for (const [p, pg] of V.pages) {
      walkBlocks(pg.blocks, b => {
        if (!hit && trim(blockProp(b, "id") || "") === id) hit = {path: p, block: b};
      });
      if (hit) return hit;
    }
    return null;
  };
  const found = space && LOADED.has(space) ? inSpace(space, look) : look();
  return found ? Object.assign({space: space || null}, found) : null;
}

/* Closed by somebody who is not here. Same three stamps the tick writes, so a
   task finished by a colleague outside the app reads identically to one
   finished inside it -- which it is. */
function closeOnTheirWord(path, block, who, at) {
  block.state = "DONE";
  setBlockProp(block, "done_by", who + " " + at);
  const end = dateIn(at) || todayISO();
  const added = addedDate(block);
  const raw = blockProp(block, "Added") || "";
  if (added && !/\]\]\s*-\s*\[\[/.test(raw)) {
    setBlockProp(block, "Added", raw + " - [[" + end + "]] = " + (dateDiffDays(added, end) ?? 0) + " days");
  } else if (!added && !blockProp(block, "CLOSED")) {
    setBlockProp(block, "CLOSED", "[[" + end + "]]");
  }
}

function postMessageAs(path, block, text, who, at) {
  const body = trim(text);
  if (!body) return null;
  const m = newBlock({state: null, title: body.replace(/\n+/g, " ")});
  setBlockProp(m, MSG_PROP, who);
  setBlockProp(m, MSG_AT, at);
  (block.children || (block.children = [])).push(m);
  return m;
}

function openUpdateArrived(data) {
  const who = trim(data.from) || "They";
  const at  = trim(data.at) || nowStamp();

  const rows = [];
  let gone = 0;
  for (const item of data.items) {
    const hit = resolveReplyItem(item);
    if (!hit) { gone++; continue; }
    const note = trim(item.note || "");
    if (!item.done && !note) continue;                  // no answer is not news
    const closed = inSpace(hit.space, () => !OPEN_STATES[hit.block.state]);
    rows.push({hit, done: !!item.done, note, closed, take: true});
  }

  if (!rows.length) {
    modal({center: true, title: who + " replied", body: el("div", {},
      el("div", {class: "field"}, el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.6"},
        gone ? "Nothing in the reply matches a task that is still here. " +
               gone + " of the lines point at tasks that have since been deleted or renamed past recognition."
             : "They sent it back without ticking anything or writing a note. " +
               "Everything is still open, which is itself an answer."))),
      foot: [el("button", {class: "btn primary", onclick: closeModal}, "Close")]});
    return;
  }

  const list = el("div", {style: "max-height:46vh;overflow:auto"});
  const counts = el("div", {style: "color:var(--fg3);font-size:12.5px;margin-top:8px"});
  const refresh = () => {
    const taken = rows.filter(r => r.take);
    const closes = taken.filter(r => r.done && !r.closed).length;
    const notes  = taken.filter(r => r.note).length;
    counts.textContent = closes + (closes === 1 ? " task closes, " : " tasks close, ") +
      notes + (notes === 1 ? " comment filed." : " comments filed.");
    apply.textContent = taken.length ? "Apply " + taken.length : "Apply nothing";
  };

  for (const r of rows) {
    const title = inSpace(r.hit.space, () => plainTitle(r.hit.block.title));
    const box = el("button", {class: "spacetoggle on", onclick: () => {
      r.take = !r.take;
      box.className = "spacetoggle" + (r.take ? " on" : "");
      box.textContent = r.take ? "✓" : "";
      refresh();
    }}, "✓");
    list.append(el("div", {style: "display:flex;gap:10px;align-items:flex-start;margin:9px 0"},
      box,
      el("div", {style: "min-width:0;flex:1"},
        el("div", {}, title),
        r.note ? el("div", {style: "color:var(--fg2);font-size:12.5px;font-style:italic;margin-top:2px"},
          "“" + r.note + "”") : null,
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:2px"},
          (r.done ? (r.closed ? "they say done · already closed here" : "they say done → close it")
                  : "comment only · stays open") +
          " · " + r.hit.path)),
      el("span", {class: "state " + (r.done ? "DONE" : "WAIT")}, r.done ? "done" : "open")));
  }

  const apply = el("button", {class: "btn primary", onclick: () => {
    let closed = 0, noted = 0;
    for (const r of rows) {
      if (!r.take) continue;
      inSpace(r.hit.space, () => {
        if (r.done && !r.closed) { closeOnTheirWord(r.hit.path, r.hit.block, who, at); closed++; }
        if (r.note && postMessageAs(r.hit.path, r.hit.block, r.note, who, at)) noted++;
        // They answered, so there is no longer an unanswered question to chase.
        dropProp(r.hit.block, ASKED_PROP);
        touch(r.hit.path);
      });
    }
    closeModal();
    notify(who + "'s update is in: " + closed + " closed, " + noted +
           (noted === 1 ? " comment." : " comments."));
    render();
  }});
  refresh();

  modal({
    center: true, title: who + " replied",
    hint: formatStamp(at),
    body: el("div", {},
      el("div", {class: "field"},
        el("label", {}, "What this will change"),
        list, counts),
      gone ? el("div", {class: "field"},
        el("div", {style: "color:var(--fg3);font-size:12.5px"},
          gone + (gone === 1 ? " line" : " lines") + " in the reply point at tasks that are " +
          "no longer here, so there is nothing to apply them to.")) : null,
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg3);font-size:12.5px"},
          "Their notes are filed as comments on the tasks, in their name - so the thread " +
          "reads like they said it, because they did."))),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      apply,
    ],
  });
}

/* The reply usually arrives as the body of an email, not as a file: that is the
   whole point of the sheet sending it that way. Making somebody save the mail
   to disk first, so there is a file to import, would undo it. So the ordinary
   route is to select the message, copy it, and drop it in here. */
function importUpdatePasted() {
  const box = el("textarea", {rows: 12, placeholder:
    "Paste their reply here. The whole email is fine, extra lines and all.",
    style: "font-size:12.5px;font-family:var(--mono)"});
  const said = el("div", {style: "color:var(--fg3);font-size:12.5px;margin-top:6px"});
  const check = () => {
    const data = parseUpdateReply(box.value);
    said.textContent = !trim(box.value) ? ""
      : data ? "Found a reply from " + (data.from || "somebody") + ": " + data.items.length +
               " answer" + (data.items.length === 1 ? "" : "s") + "."
             : "No GroupTodo answers in that yet. Paste the whole message, including the " +
               "lines at the bottom that look like machine noise: that is the part that says " +
               "which task is which.";
    said.style.color = data ? "var(--ok)" : "var(--fg3)";
  };
  box.addEventListener("input", check);

  modal({
    center: true, title: "Paste a reply",
    body: el("div", {}, el("div", {class: "field"}, box, said)),
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn ghost", onclick: async () => {
        try { box.value = await navigator.clipboard.readText(); check(); }
        catch (_) { notify("This browser would not let the app read the clipboard. Paste into the box.", "warn"); }
      }}, "Paste from clipboard"),
      el("button", {class: "btn primary", onclick: () => {
        const data = parseUpdateReply(box.value);
        if (!data) { notify("No GroupTodo answers in that text.", "error"); return; }
        closeModal();
        openUpdateArrived(data);
      }}, "Read it"),
    ],
  });
  setTimeout(() => box.focus(), 50);
}

function importUpdateFromFile() {
  const input = el("input", {type: "file", accept: ".md,.markdown,.txt,text/markdown,text/plain",
    style: "display:none",
    onchange: async e => {
      const f = e.target.files && e.target.files[0];
      input.remove();
      if (!f) return;
      const text = await f.text();
      const data = parseUpdateReply(text);
      if (!data) { notify("That file is not a GroupTodo update.", "error"); return; }
      openUpdateArrived(data);
    }});
  document.body.append(input);
  input.click();
}

/* ---------- people ----------
   Waiting for answers "what have I handed over". It does not answer "what is
   everyone actually doing", and on a shared space that is the more useful
   question: work you are NOT waiting on is invisible otherwise. So: everybody
   in the space, and what each of them is carrying. */
function workOf(name) {
  const acts = leafActions().filter(a => OPEN_STATES[a.state]);
  const theirs = acts.filter(a => samePerson(a.assignee || whoAmI(), name));
  const projects = allPages(p => statusDirOf(p) === "1")
    .filter(p => {
      const page = getPage(p);
      if (samePerson(trim(page.props?.[ASSIGN_PROP] || ""), name)) return true;
      if (page.props?.[ASSIGN_PROP]) return false;
      return samePerson(trim(page.props?.by || ""), name);
    });
  return {acts: theirs, projects};
}

function viewPeople() {
  const c = el("div", {class: "wrap"});
  const roster = members();
  const me = whoAmI();
  if (!me) {
    c.append(section("People", null, el("div", {class: "card"},
      el("div", {class: "empty"}, "Tell the app your name first, in Vault & sync, and you will show up here."))));
    return c;
  }
  if (!roster.some(m => m.me)) ensureMemberPage();

  const card = el("div", {class: "card"});
  for (const m of members()) {
    const w = workOf(m.name);
    const seen = lastSeenOf(m.name);
    const face = avatarNode(m.name, 30);
    if (m.me) {
      // Your own face is the fastest place to change it from.
      face.title = avatarOf(m.name) ? "Change your photo" : "Add a photo of yourself";
      face.style.cursor = "pointer";
      face.addEventListener("click", e => { e.stopPropagation(); pickAvatar(m.name, () => render()); });
    }

        " \u00B7 " + w.acts.length + " open")));
  }
  c.append(section("In this space", members().length, card));

  /* Anybody named on a task who is not using the app: those are waiting-fors,
     and the only ones a check-in sheet is for. Somebody in the space can read
     the list themselves. */
  const outside = outsidersOwingMe();
  if (outside.length) {
    const oc = el("div", {class: "card"});
    for (const o of outside) {
      const asked = o.items.map(a => askedDays(a.block)).filter(d => d != null);
      const quietest = asked.length === o.items.length ? Math.min(...asked) : null;

          onclick: () => go("person", {person: o.name})},
          el("div", {}, o.name),
          el("div", {style: "color:var(--fg3);font-size:11.5px"},
            o.items.length + (o.items.length === 1 ? " thing" : " things") + " owing" +
            (quietest == null ? " \u00B7 never asked"
                              : quietest >= CFG.waitFollowUpDays ? " \u00B7 asked " + quietest + "d ago"
                              : " \u00B7 asked recently"))),
        el("button", {class: "btn sm ghost", title: "One file they tick off and send back",
          onclick: () => openAskForUpdate(o.name)}, "ask for an update")));
    }
    c.append(section("Not in this space", outside.length, oc, null, "quiet"));
  }
  c.append(el("div", {class: "section", style: "display:flex;gap:8px;flex-wrap:wrap"},
    el("button", {class: "btn sm ghost", title: "A reply file a colleague sent back",
      onclick: () => importUpdateFromFile()}, "import an update")));

}

function viewPerson(name) {

        : "Last asked " + Math.min(...asked) + " days ago" +

            ? ", and " + (owing.length - asked.length) + " never asked about." : "."))));

/* My day: what is actually on the hook today. */
function viewMyDay() {
  const c = el("div", {class: "wrap"});
  const path = ensureJournal(todayISO());
  const coach = coachStrip();
  if (coach) c.append(coach);
  c.append(el("div", {class: "section"}, quickAdd(path, {placeholder: "Add a task for today"})));
  // A suggestion, when there is one, takes the place of the hero card rather than
  // stacking on top of it: two things competing to be the next thing is neither.
  if (!coach) c.append(nudgeBar(), tipCard() || heroCard());

  // One task, one row. The sections below are different questions about the
  // same journal, so without this a task captured today that also has a date
  // appeared under Due AND under Captured today.
  const shown = new Set();
  const unseen = list => list.filter(a => !shown.has(a.block.id));
  const claim = list => { list.forEach(a => shown.add(a.block.id)); return list; };

  const acts = leafActions();
  const due = claim(acts.filter(a => a.group === "LATE" || a.group === "TODAY"));
  if (due.length) c.append(section("Due", due.length, taskCard(due)));

  // A ticked task should not simply vanish: leave it here so the person can see
  // what they got done, and un-tick it if they were too quick.
  const closed = flattenBlocks(getPage(path).blocks)
    .filter(b => b.state && !OPEN_STATES[b.state])
    .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                due: dueDate(b), age: blockAge(b), added: addedDate(b),
                by: blockProp(b, "by"), doneBy: blockProp(b, "done_by"),
                missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)}));
  /* What is done is a record, not the day's work, so it folds away under a
     single line. It is still here -- and still un-tickable -- for anyone who
     wants to see what they got through. */
  if (closed.length) c.append(foldSection("Done today", closed.length, taskCard(closed)));

  // Below the fold: reference material, not the day's work. Both sections are
  // dropped entirely when there is nothing in them -- an empty box on the main
  // screen reads as a chore you have not done.
  const surfaced = claim(unseen(state.context ? oldestTodosForContext(state.context) : []));
  if (surfaced.length) {
    c.append(section("Oldest in @" + state.context, surfaced.length, taskCard(surfaced),
      el("button", {class: "btn sm ghost", style: "margin-left:auto",
                    onclick: () => openContextPicker("Switch context", surfaceContext)}, "switch"),
      "quiet"));
  }

  const today = unseen(flattenBlocks(getPage(path).blocks)
    .filter(b => OPEN_STATES[b.state])
    .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                due: dueDate(b), age: blockAge(b), added: addedDate(b),
                missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)})));
  // While the coach is up this is the only thing on screen and the step it is
  // asking for, so it keeps its full weight until the newcomer is through.
  /* Captured is an inbox, not an agenda: anything in it that is actually due
     has already been shown under Due above. It folds too -- except during the
     first run, when it is the step the coach is asking for. */
  if (today.length) {
    c.append(coach
      ? section("Captured today", today.length, taskCard(today))
      : foldSection("Captured today", today.length, taskCard(today)));
  }
  return c;
}


function navCount(id) {
  switch (id) {
    case "horizons":   return areaList().length || null;
    case "checklists": return checklistPages().length || null;
    case "todos":      return leafActions().filter(a => OPEN_STATES[a.state]).length;
    case "today":   return openTodoCount(journalPath());
    case "next":    return leafActions().filter(a => a.state !== "WAIT").length;
    case "context": return state.context ? oldestTodosForContext(state.context).length : contextList().length;
    case "agenda":  return agendaScan().reduce((n, [, l]) => n + l.length, 0);
    case "health":  return healthScan().length;
    case "review":  return stuckActiveProjects().length;
    default: {
      const m = /^proj-(.)$/.exec(id);
      if (m) return projectsIn(m[1]).length;
      return null;
    }
  }
}

/* During the first run the sidebar shows four things. The rest appears as soon
   as the coach is finished, rather than presenting a stranger with a filing
   system they have not filled in yet. */
const STARTER_NAV = ["today", "todos", "proj-1", "proj-0"];
/* ---------- does this vault actually have one of those? ----------
   A menu of twenty screens, eighteen of which say "nothing here yet", is a
   menu that teaches you to ignore it. Every entry below earns its place from
   the files: no dated task, no Timeline; no links, no Graph; nothing finished,
   no Report. Each probe stops at the first hit rather than counting, and the
   answers are memoised for the render, because this runs once per item per
   draw and a vault can be large.

   An entry you are standing on never disappears underneath you, or leaving the
   last dated task would strand you on a screen with no way back to it. */
const anyDated = () => memo("anyDated", () =>
  leafActions().some(a => a.due) ||
  acrossSpaces(() => {
    for (const [path, page] of V.pages) {
      if (pageKind(path) === "template") continue;
      let hit = false;
      walkBlocks(page.blocks, b => {
        if (hit || !b.state || isMessage(b)) return;
        if (dateIn(blockProp(b, "SCHEDULED")) || dateIn(blockProp(b, "DEADLINE"))) hit = true;
      });
      if (hit) return [true];
    }
    return [];
  }).length > 0);

const anyLinked = () => memo("anyLinked", () => graphData().edges.length > 0);
const anyFinished = () => memo("anyFinished", () =>
  completedSince(addMonths(todayISO(), -12)).some(r => !r.undated));
const anyOpenTask = () => memo("anyOpenTask", () =>
  leafActions().some(a => OPEN_STATES[a.state]));

function navVisible(item) {
  // Where you are now always stays reachable, whatever the files say.
  const here = item.status ? (state.view === "projects" && state.statusCode === item.status)
                           : state.view === item.id;
  if (here) return true;
  if (item.id === "weeding" && !weedingWorthIt()) return false;
  // Nothing to see while you are the only person here.
  if (item.id === "people" && members().length < 2 &&
      !leafActions().some(a => a.assignee)) return false;
  // Chat shows up once there is one, and stays once you are using it.
  if (item.id === "chat" && !allThreads().length) return false;

  /* The five screens that need something in the files to be about. */
  if (item.id === "board"    && !anyOpenTask())  return false;
  if (item.id === "calendar" && !anyDated())     return false;
  if (item.id === "gantt"    && !anyDated())     return false;
  if (item.id === "graph"    && !anyLinked())    return false;
  if (item.id === "report"   && !anyFinished())  return false;
  if (item.id === "checklists" && !checklistPages().length
      && !PREF.get("madeRoutine", "")) return false;
  if (item.id === "zettel"   && !allPages(p => pageKind(p) === "zettel").length) return false;
  if (item.id === "horizons" && !areaList().length && !goalList().length
      && !getSetting("horizons_seen")) return false;
  // An empty status folder is a filing cabinet drawer nobody has used.
  if (item.status && !projectsIn(item.status).length) return false;

  if (!coachOn() || !isSimple()) return true;
  // Making a routine mid-coach is allowed, and a place you were just sent to has
  // to be reachable afterwards.
  if (item.id === "checklists" && PREF.get("madeRoutine", "")) return true;
  return STARTER_NAV.includes(item.id);
}

function renderNav() {
  const sp = Spaces.get(Spaces.active);
  if (sp) {
    $("#spaceName").textContent = sp.name;
    const logo = $("#spaceLogo");
    const color = spaceColor(sp.name);
    logo.textContent = sp.name[0].toUpperCase();
    logo.style.background = color;
    logo.style.color = inkOn(color);        // a chosen colour can be any brightness
  }
  for (const b of $$("#modeSwitch button")) {
    b.classList.toggle("on", (b.dataset.mode === "simple") === isSimple());
    b.onclick = () => setMode(b.dataset.mode);
  }
  const nav = $("#nav");
  nav.textContent = "";
  for (const sec of NAV()) {
    const box = el("div", {class: "nav-group"});
    if (sec.group) box.append(el("h3", {}, sec.group));
    for (const it of sec.items) {
      if (!navVisible(it)) continue;
      const active = it.status ? (state.view === "projects" && state.statusCode === it.status)
                               : state.view === it.id;
      const count = navCount(it.id);
      const hot = (it.id === "health" || it.id === "review") && count > 0;
      box.append(el("button", {
        class: "nav-item" + (active ? " active" : ""),
        onclick: () => it.status ? go("projects", {statusCode: it.status}) : go(it.id),
      },
        el("span", {class: "ic"}, it.icon),
        el("span", {class: "lbl"}, it.label),
        count ? el("span", {class: "cnt" + (hot ? " hot" : "")}, String(count))
              : (it.key ? el("span", {class: "key"}, it.key) : null)
      ));
    }
    if (box.children.length > (sec.group ? 1 : 0)) nav.append(box);
  }
}

/* ============================================================
   100_RENDER -- shared pieces
   ============================================================ */
const NUDGE_RANK = {danger: 0, warn: 1, "": 2, ok: 3};

/* Everything that is true at once is not a to-do list, it is a telling-off. The
   few that matter stay on screen and the rest wait behind one chip, so a long
   list of small sins can never turn the top of the page into a wall of red. */
function nudgeBar() {
  const bar = el("div", {class: "nudgebar"});
  const all = computeNudges();
  const shown = all.slice()
    .sort((a, b) => (NUDGE_RANK[a.level || ""] ?? 2) - (NUDGE_RANK[b.level || ""] ?? 2))
    .slice(0, CFG.nudgeMax);
  for (const nd of shown) {
    bar.append(el("button", {
      class: "nudge " + (nd.level || ""),
      onclick: nd.act || (() => {}),
    }, nd.count != null ? el("b", {}, String(nd.count)) : null, nd.label));
  }
  const hidden = all.length - shown.length;
  const onlyClean = all.length === 1 && all[0].id === "clean";
  if (all.length && !onlyClean) {
    bar.append(el("button", {
      class: "nudge quieter",
      title: "What these are, why they are here, and how to quieten them",
      onclick: () => openNudgeExplainer(),
    }, hidden > 0 ? "+" + hidden + " more" : "why these?"));
  }
  return bar;
}

/* The nudges, explained and quietenable in the same breath. A prompt you cannot
   interrogate or turn down is a nag; the only convincing way to show this is not
   one is to put the off switch directly beside the reason. */
function openNudgeExplainer() {
  const all = computeNudges().filter(nd => nd.id !== "clean");
  const body = el("div", {});
  body.append(el("div", {class: "field"},
    el("div", {style: "color:var(--fg2);font-size:13px;line-height:1.55"},
      all.length
        ? "Each of these is your own list telling you something. Open one, or quieten it - " +
          "it comes back after " + CFG.nudgeSnoozeDays + " days, and only if it is still true."
        : "Nothing is nagging. This is the whole of what GroupTodo will ever bring up.")));
  for (const nd of all) {
    const sec = el("div", {class: "dash-sec"});
    sec.append(el("h4", {},
      el("span", {}, (nd.count != null ? nd.count + " " : "") + nd.label),
      el("span", {class: "n"}, nd.level === "danger" ? "worth doing now"
        : nd.level === "warn" ? "worth a look" : "whenever")));
    if (NUDGE_WHY[nd.id]) {
      sec.append(el("div", {style: "padding:2px 16px 4px;color:var(--fg2);font-size:13px;line-height:1.55"},
        NUDGE_WHY[nd.id]));
    }
    sec.append(el("div", {style: "display:flex;gap:6px;padding:6px 16px 10px;flex-wrap:wrap"},
      nd.act ? el("button", {class: "btn sm ghost", onclick: () => { closeModal(); nd.act(); }}, "open") : null,
      el("button", {class: "btn sm ghost", onclick: () => {
        quietNudge(nd.id);
        closeModal(); render(); openNudgeExplainer();
      }}, "quiet for " + CFG.nudgeSnoozeDays + " days")));
    body.append(sec);
  }
  body.append(el("div", {class: "field"},
    el("div", {style: "color:var(--fg3);font-size:12px;line-height:1.5"},
      "Under " + CFG.quietUntilTasks + " open tasks the method ones stay away entirely, at " +
      "most " + CFG.nudgeMax + " are ever on screen, and the first day has no weeding and no " +
      "review nag. None of this is counted, scored or sent anywhere - there is nowhere for " +
      "it to be sent.")));
  modal({
    title: "Why these are here", hint: "nudges, not nags",
    body,
    foot: [
      anyNudgeQuiet() ? el("button", {class: "btn ghost", onclick: () => {
        unquietAllNudges(); closeModal(); render(); notify("All nudges are back.");
      }}, "Bring back the quietened") : null,
      el("button", {class: "btn primary", onclick: closeModal}, "Done"),
    ].filter(Boolean),
  });
}

function heroCard() {
  const nb = nextBestAction();
  return el("div", {class: "hero"},
    el("h2", {}, "Next best move"),
    el("div", {style: "font-size:16px;font-weight:600;margin-bottom:2px"}, nb.title),
    el("p", {html: renderInline(nb.body)}),
    // The alternatives are alternatives. When the best move already IS capture,
    // offering "Capture something" again beside it just looked broken.
    el("div", {class: "acts"},
      el("button", {class: "btn primary", onclick: nb.act}, nb.cta),
      nb.cta === "Capture something" ? null
        : el("button", {class: "btn ghost", onclick: () => openCapture()}, "Capture something"),
      el("button", {class: "btn ghost", onclick: () => openContextPicker("Where are you now?", ctx => surfaceContext(ctx))},
        state.context ? "Change context" : "Set context")
    ));
}

/* With onCycle the badge is the control: one click per step, in place, instead of
   opening the action panel again for every state. */
function stateChip(st, onCycle) {
  if (!st) return null;              // a plain note carries no badge
  if (!onCycle) return el("span", {class: "state " + st}, st);
  return el("button", {
    class: "state btn " + st, title: "Cycle: TODO \u2192 DOING \u2192 WAIT \u2192 DONE",
    onclick: e => { e.stopPropagation(); onCycle(e.currentTarget); },
  }, st);
}

/* ---------- the pills on a row ----------
   A pill is three things at once: somewhere to go, a value to change, and a
   value to take off. A plain click used to mean only the first, so correcting
   the wrong project or a context you no longer work in cost a trip through the
   action panel -- and worse, it moved you off the list you were working. The
   click opens the three instead, with the same a/b/c letters the pickers use,
   and going there is still the first row. */
function chipMenu(title, hint, rows) {
  const live = rows.filter(Boolean);
  const body = el("div", {});
  for (const [key, label, detail, run] of live)
    body.append(pickRow(key, label, detail, () => { closeModal(); run(); }));
  modal({
    title, hint, body, center: true,
    onKey: e => {
      const hit = live.find(r => r[0] === e.key.toLowerCase());
      if (!hit) return false;
      closeModal(); hit[3]();
      return true;
    },
  });
}

/* The context lives in the title as [[c/name]], so changing it rewrites that
   link rather than adding a second one, and taking it off leaves the words. */
function replaceContextLink(path, block, ctx) {
  if (!hasContextLink(block.title)) { insertContextLink(path, block, ctx); return; }
  block.title = trim(block.title.replace(/\[\[c\/[^\]]+\]\]/, "[[c/" + ctx + "]]"));
  touch(path); render();
  notify("Now @" + ctx + ".");
}
function removeContextLink(path, block) {
  block.title = trim(block.title.replace(/\[\[c\/[^\]]+\]\]/, "").replace(/\s{2,}/g, " "));
  touch(path); render();
  notify("Context taken off.");
}

/* "Out of this project" is a refile to today's journal: the inbox is where an
   action with no home belongs, and deleting the action is not what was asked. */
function unfileFromProject(path, block) {
  refileBlock(path, block, ensureJournal(todayISO()));
}

function openContextChipMenu(a) {
  chipMenu("@" + a.context, "the context on this action", [
    ["a", "Go to @" + a.context, "the oldest few, surfaced", () => surfaceContext(a.context)],
    ["b", "Change the context", null,
      () => openContextPicker("Pick a context for this action",
        ctx => inSpace(a.space, () => replaceContextLink(a.path, a.block, ctx)))],
    ["c", "Take the context off", "the words stay", () => inSpace(a.space, () => removeContextLink(a.path, a.block))],
  ]);
}

function openProjectChipMenu(a) {
  chipMenu(a.project, "the project this action sits in", [
    a.projectPath ? ["a", "Open " + a.project, pageRef(a.projectPath), () => openPageIn(a.space, a.projectPath)] : null,
    ["b", "Move it to another project", null, () => inSpace(a.space, () => openRefile(a.path, a.block))],
    ["c", "Out of this project", "back to today's inbox", () => inSpace(a.space, () => unfileFromProject(a.path, a.block))],
  ]);
}

function openAssigneeChipMenu(a) {
  const mine = samePerson(a.assignee, whoAmI());
  chipMenu("\u2192 " + a.assignee, "who is doing it", [
    ["a", "Go to " + a.assignee, "everything of theirs", () => go("person", {person: a.assignee})],
    ["b", "Hand it to somebody else", null, () => inSpace(a.space, () => openAssignOther(a.path, a.block))],
    mine ? null : ["c", "Take it back", "it becomes yours again", () => inSpace(a.space, () => assignBlock(a.path, a.block, ""))],
  ]);
}

/* A date has nowhere to go, so the menu is the other two. Both dates are
   edited in one place, so "change" is the panel's date fields. */
function clearDates(path, block) {
  for (const k of Object.keys(block.props))
    if (/^(scheduled|deadline|due)$/i.test(k)) delete block.props[k];
  touch(path); render();
  notify("Date cleared.");
}
function openDueChipMenu(a) {
  chipMenu(humanDate(a.due), "scheduled and deadline", [
    ["a", "Change the dates", null, () => inSpace(a.space, () => openTaskDetail(a.path, a.block, a.space))],
    ["b", "Clear the date", null, () => inSpace(a.space, () => clearDates(a.path, a.block))],
  ]);
}

function chipsFor(a) {
  const out = [];
  if (a.context) out.push(el("span", {class: "chip ctx b", title: "@" + a.context + " - go there, change it, take it off",
    onclick: e => {e.stopPropagation(); openContextChipMenu(a);}}, "@" + a.context));
  if (a.project) out.push(el("span", {class: "chip proj b", title: a.project + " - open it, move this, take it out",
    onclick: e => {e.stopPropagation(); openProjectChipMenu(a);}}, a.project));
  if (a.due) {
    const cls = a.due < todayISO() ? "late" : a.due === todayISO() ? "today" : "";
    out.push(el("span", {class: "chip b " + cls, title: "Change or clear the date",
      onclick: e => {e.stopPropagation(); openDueChipMenu(a);}}, humanDate(a.due)));
  }
  if (a.age != null && a.age > 0) out.push(el("span", {class: "chip age"}, a.age + "d"));
  const msgs = messagesOf(a.block).length;
  if (msgs) {
    const un = unreadCount(a.block);
    out.push(el("span", {class: "chip msg" + (un ? " b unread" : ""),
      title: un ? un + " you have not read" : msgs + " message(s)"},
      "\u25CB " + (un ? un + " new" : String(msgs))));
  }
  if (messagesOf(a.block).some(flaggedByMe))
    out.push(el("span", {class: "chip flagged"}, "\u2691"));
  if (a.assignee) out.push(el("span", {class: "chip who b", title: a.assignee + " has it - go there, hand it on, take it back",
    onclick: e => {e.stopPropagation(); openAssigneeChipMenu(a);}}, "\u2192 " + a.assignee));
  if (a.by && a.by !== whoAmI() && !samePerson(a.by, a.assignee))
    out.push(el("span", {class: "chip who"}, a.by));
  const quietChips = gtdQuiet();
  if (a.missingVerb && a.state === "TODO" && !quietChips)
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); openVerbPicker(a.path, a.block);}}, "no verb"));
  if (a.missingContext && a.state !== "WAIT" && !quietChips)
    out.push(el("span", {class: "chip miss b", onclick: e => {e.stopPropagation(); promptAndInsertContext(a.path, a.block);}}, "no context"));
  return out;
}

/* Context and project links are already chips on the row, so hide them
   from the title text. The outline view still shows them Logseq-style. */
function titleForRow(title) {
  return trim(String(title || "")
    .replace(/\[\[[_0123c]\/[^\]]+\]\]/g, "")
    .replace(/\s{2,}/g, " "));
}

/* The same title with the link syntax read out rather than shown. A calendar
   cell has no room for a chip, and a link nested inside a button is both bad
   markup and two things to press in one. */
/* Every [[link]] read out as the words it stands for, dropping nothing. The
   grid uses this rather than stripping the links: a title is often mostly
   links, and "Ring about the quote" with the person and the org taken out of it
   is a line you cannot identify in a list of six. */
function linkWords(text) {
  return trim(String(text || "").replace(/\[\[([^\]]+)\]\]/g, (all, t) => {
    if (t.includes("][")) return trim(t.split("][")[1]);
    const raw = trim(t);
    const pfx = (/^([^/]+)\//.exec(raw) || [])[1];
    if (pfx === "go") return tourLabel(raw.slice(3));
    const known = pfx === "c" || pfx === "z" || pfx === "p" || pfx === "o" || (pfx && STATUS_DIRS[pfx]);
    const label = known ? raw.slice(pfx.length + 1) : raw;
    return pfx === "c" ? "@" + label : label;
  }).replace(/\s{2,}/g, " "));
}
function plainTitle(title) { return linkWords(titleForRow(title)); }

function spaceBadge(name) {
  const sp = Spaces.get(name);
  if (!sp) return null;
  const color = spaceColor(name);
  return el("span", {class: "chip spacechip",
    style: "color:" + color + ";border-color:" + color + "55"}, name);
}

function taskRow(a) {
  // An action shown from another space must be edited IN that space, or the
  // change would be written through the active space's backend.
  const row = el("div", {
    class: "task" + (state.selected === a.block.id ? " sel" : ""),
    data: {state: a.state || "", id: a.block.id},
    // A link inside the title is the link's click, not the row's: pressing
    // [[go/todos]] has to go to Todos rather than open the action panel on top
    // of it. The delegated handler on #content does the following.
    onclick: e => {
      if (e.target.closest("[data-link]")) return;
      inSpace(a.space, () => openTaskDetail(a.path, a.block, a.space));
    },
  },
    el("button", {
      class: "chk", title: "Toggle done",
      onclick: e => { e.stopPropagation();
        inSpace(a.space, () => setBlockState(a.path, a.block, a.state === "DONE" ? "TODO" : "DONE")); },
    }, "\u2713"),
    el("div", {class: "t-body"},
      el("div", {class: "t-title", html: renderInline(titleForRow(a.title))}),
      el("div", {class: "t-meta"}, stateChip(a.state, node => {
        keepFocus(idSel(".task", a.block.id, ".state"), node);
        inSpace(a.space, () => cycleState(a.path, a.block, {keepTask: true}));
      }),
        multiSpace() && a.space ? spaceBadge(a.space) : null, ...chipsFor(a))),
    el("div", {class: "t-act"},
      el("button", {class: "iconbtn", title: "Waiting for",
        onclick: e => {e.stopPropagation(); inSpace(a.space, () => setBlockState(a.path, a.block, "WAIT"));}}, "\u23F8"),
      el("button", {class: "iconbtn", title: "Refile to a project",
        onclick: e => {e.stopPropagation(); inSpace(a.space, () => openRefile(a.path, a.block));}}, "\u21AA"),
      el("button", {class: "iconbtn", title: "Open page",
        onclick: e => {e.stopPropagation(); openPageIn(a.space, a.path);}}, "\u2197"))
  );
  return row;
}

/* Opening a page from another space switches to it, so the outliner, saves
   and backlinks all operate where that page actually lives. */
function openPageIn(space, path) {
  if (space && space !== Spaces.active) { openSpace(space).then(() => openPage(path)); return; }
  openPage(path);
}

/* ---------- state filters ----------
   Checkboxes rather than one-of, so Active and Waiting for can share a list
   when that is what you want. A state only appears once something is in it:
   a list with nothing waiting has no reason to mention waiting. */
const STATE_FILTER_ORDER = ["TODO", "DOING", "WAIT"];
const STATE_FILTER_LABEL = {TODO: "To do", DOING: "Doing", WAIT: "Waiting for"};

function hiddenStates() {
  try { return new Set(JSON.parse(PREF.get("hideStates:" + (Spaces.active || ""), "[]"))); }
  catch (_) { return new Set(); }
}
function setHiddenStates(set) {
  PREF.set("hideStates:" + (Spaces.active || ""), JSON.stringify(Array.from(set)));
}
const visibleStates = acts => {
  const hidden = hiddenStates();
  return acts.filter(a => !hidden.has(a.state));
};

function stateFilterBar(acts) {
  const present = STATE_FILTER_ORDER.filter(st => acts.some(a => a.state === st));
  if (present.length < 2) return null;          // nothing to choose between
  const hidden = hiddenStates();
  const bar = el("div", {class: "statefilter"});
  for (const st of present) {
    const on = !hidden.has(st);
    const n = acts.filter(a => a.state === st).length;
    bar.append(el("button", {
      class: "chip filter" + (on ? " on" : ""),
      onclick: () => {
        const next = hiddenStates();
        if (next.has(st)) next.delete(st); else next.add(st);
        if (next.size >= present.length) next.delete(st);   // never hide everything
        setHiddenStates(next);
        render();
      },
    }, (on ? "\u2713 " : "") + STATE_FILTER_LABEL[st] + " " + n));
  }
  return bar;
}

/* A list draws what you can actually look at, and offers the rest.
   Rendering every open task was 3.7 seconds at five thousand of them and ten
   at twenty thousand -- a to-do list that takes ten seconds to appear is
   broken, however correct the contents. The counts in the headings are still
   the true totals; only the rows are rationed. */
function taskCard(actions, emptyText) {
  return pagedCard(actions, taskRow, emptyText);
}

/* The same rationing, for a list of anything that is not a task: pages,
   conversations, health findings. Everything that draws a long list goes
   through here, so "show all" means the same thing wherever you press it. */
function pagedCard(items, makeRow, emptyText, step) {
  const card = el("div", {class: "card"});
  if (!items.length) {
    card.append(el("div", {class: "empty"}, emptyText || "Nothing here."));
    return card;
  }
  const n = step || CFG.rowsPerPage;
  let drawn = 0;
  const drawTo = upto => {
    for (let i = drawn; i < upto; i++) card.insertBefore(makeRow(items[i], i), more);
    drawn = upto;
    const left = items.length - drawn;
    if (!left) { more.remove(); return; }
    more.set("Show " + Math.min(left, n) + " more \u00B7 " + left + " below",
             left > n ? "Show all " + items.length : "");
  };
  const more = moreRow(() => drawTo(Math.min(items.length, drawn + n)),
                       () => drawTo(items.length));
  card.append(more);
  drawTo(Math.min(items.length, n));
  return card;
}

function section(title, count, node, extra, cls) {
  return el("div", {class: cls ? "section " + cls : "section"},
    el("h3", {}, title, count != null ? el("span", {class: "n"}, String(count)) : null, extra || null),
    node);
}

/* The same section, folded away. For the parts of a screen that are a record
   of what already happened rather than something to act on: they are one line
   until you open them, and they stay open for the rest of the session once you
   have, because somebody who looked once is usually looking again. */
const FOLD_OPEN = new Set();
function foldSection(title, count, node, {open = false, cls = "quiet", extra = null} = {}) {
  const id = "fold:" + title;
  const shown = open || FOLD_OPEN.has(id);
  const d = el("details", {class: "section fold" + (cls ? " " + cls : ""), open: shown ? "" : null},
    el("summary", {}, title,
      count != null ? el("span", {class: "n"}, String(count)) : null, extra || null),
    node);
  d.addEventListener("toggle", () => { if (d.open) FOLD_OPEN.add(id); else FOLD_OPEN.delete(id); });
  return d;
}
</script>
<script>
/* ============================================================
   105_OUTLINER -- the Logseq half of the app
   Keys: Enter new block, Tab/Shift-Tab indent, Ctrl-Enter cycle state,
         Backspace on an empty block deletes it, Up/Down move between blocks
         once there is no line left to move to inside this one.
   ============================================================ */
function siblingsOf(page, block) {
  let found = null;
  const rec = list => {
    if (list.includes(block)) { found = list; return; }
    list.forEach(b => rec(b.children || []));
  };
  rec(page.blocks);
  return found || page.blocks;
}
function parentOf(page, block) {
  let par = null;
  walkBlocks(page.blocks, (b, p) => { if (b === block) par = p; });
  return par;
}

function focusBlock(id, atEnd = true) {
  requestAnimationFrame(() => {
    if ($("#modalRoot").firstChild) return;   // a picker opened on the way; it owns the keys
    const node = $(`.blk[data-id="${id}"] .txt`);
    if (!node) return;
    node.focus();
    const r = document.createRange(), s = getSelection();
    r.selectNodeContents(node); r.collapse(!atEnd);
    s.removeAllRanges(); s.addRange(r);
  });
}

/* ============================================================
   [[ OPENS A LIST OF PAGES
   The prefix in a link is the folder it lives in, so [[c/ can only mean a
   context and [[p/ can only mean a person. That is knowledge the app already
   has and the person typing should not have to carry: having to remember which
   letter goes with which folder, and then whether you spelled the page the same
   way as last time, is exactly the work a list on screen exists to take away.

   It writes nothing by itself. Accepting a row inserts the same [[ref]] you
   could have typed, and the page it points at is created on blur by the same
   createLinkedPages the outliner already ran, so a link to something that does
   not exist yet still works the way it always did.
   ============================================================ */
let LINKPOP = null;

/* Where the caret is on screen, for hanging the list under it. A collapsed
   caret at a text boundary has no rectangle in Chrome, so fall back to the
   field itself rather than putting the list in the corner. */
function caretScreenRect(host) {
  const sel = getSelection();
  if (host.isContentEditable && sel && sel.rangeCount && host.contains(sel.anchorNode)) {
    const r = sel.getRangeAt(0).getClientRects()[0];
    if (r && (r.width || r.height || r.top)) return r;
  }
  return host.getBoundingClientRect();
}

/* The text between the start of the field and the caret. */
function textBeforeCaret(host) {
  if (!host.isContentEditable) return host.value.slice(0, host.selectionStart ?? 0);
  const sel = getSelection();
  if (!sel || !sel.rangeCount || !host.contains(sel.anchorNode)) return null;
  const r = document.createRange();
  r.selectNodeContents(host);
  r.setEnd(sel.anchorNode, sel.anchorOffset);
  return r.toString();
}

const hostText = host => host.isContentEditable ? host.textContent : host.value;

function setHostText(host, text, caret) {
  if (!host.isContentEditable) {
    host.value = text;
    host.setSelectionRange(caret, caret);
    return;
  }
  host.textContent = text;
  const tn = host.firstChild;
  const r = document.createRange();
  if (tn && tn.nodeType === 3) { r.setStart(tn, Math.min(caret, tn.length)); r.collapse(true); }
  else { r.selectNodeContents(host); r.collapse(false); }
  const sel = getSelection();
  sel.removeAllRanges(); sel.addRange(r);
}

/* Where the caret sits in the field, counted in characters of its plain text,
   so a line can be cut in two at exactly that point. A selection gives back
   both of its ends, and what lies between them is what a paste replaces. */
function caretOffsets(host) {
  const text = hostText(host);
  if (!host.isContentEditable)
    return [host.selectionStart ?? text.length, host.selectionEnd ?? text.length];
  const sel = getSelection();
  if (!sel || !sel.rangeCount || !host.contains(sel.anchorNode)) return [text.length, text.length];
  const r = sel.getRangeAt(0), pre = document.createRange();
  pre.selectNodeContents(host);
  pre.setEnd(r.startContainer, r.startOffset);
  const start = pre.toString().length;
  if (!host.contains(r.endContainer)) return [start, start];
  pre.setEnd(r.endContainer, r.endOffset);
  return [start, pre.toString().length];
}

/* An unclosed [[ immediately before the caret, and whatever has been typed
   since. A second [ or a closing ]] means this one is finished with. */
function openLinkAt(before) {
  if (before == null) return null;
  const at = before.lastIndexOf("[[");
  if (at < 0) return null;
  const q = before.slice(at + 2);
  if (/[\[\]\n]/.test(q)) return null;
  return {at, query: q};
}

/* The folders a prefix can mean, in the order the vault itself uses them. */
const linkDirFor = pfx => PREFIX_DIR[pfx] || STATUS_DIRS[pfx] || null;
const LINK_KIND_WORD = {context: "context", person: "person", org: "org", zettel: "note",
  area: "area", goal: "goal", checklist: "routine", project: "project", journal: "day",
  horizon: "horizon", page: "page"};

function linkCandidates(query) {
  const m = /^([^/]*)\/(.*)$/.exec(query);
  const pfx = m ? m[1] : null;
  const rest = trim(m ? m[2] : query).toLowerCase();
  const dir = pfx != null ? linkDirFor(pfx) : null;

  let paths;
  if (pfx != null && dir) paths = allPages(q => q.startsWith(dir + "/"));
  else if (pfx != null) paths = [];            // a prefix of its own invention
  else paths = allPages(q => !["template", "verb"].includes(pageKind(q)));

  const rows = paths.map(path => ({
    path, ref: pageRef(path), title: pageTitle(path), kind: pageKind(path),
  })).filter(r => {
    if (!rest) return true;
    return r.title.toLowerCase().includes(rest) || r.ref.toLowerCase().includes(rest);
  });

  // What you typed the start of beats what merely contains it somewhere.
  const score = r => (r.title.toLowerCase().startsWith(rest) ? 2 : 0) +
                     (r.ref.toLowerCase().startsWith(rest) ? 1 : 0);
  rows.sort((a, b) => score(b) - score(a) || a.title.localeCompare(b.title));
  const out = rows.slice(0, 10);

  /* Nothing that matches exactly is still a usable link: typing it makes the
     page. Offered last, so it never steals the Enter from a real page, and only
     once there is a name to make - "Make c/" would be a page called nothing. */
  const typed = trim(query);
  const named = trim(m ? m[2] : query);
  if (typed && named && !out.some(r => r.ref.toLowerCase() === typed.toLowerCase()
                                    || r.title.toLowerCase() === typed.toLowerCase())) {
    out.push({ref: typed, title: typed, kind: null, isNew: true});
  }
  return out;
}

function linkPopClose() {
  if (!LINKPOP) return;
  LINKPOP.box.remove();
  LINKPOP = null;
}

function linkPopDraw() {
  const {box, rows, i} = LINKPOP;
  box.textContent = "";
  rows.forEach((r, n) => {
    const row = el("button", {
      class: "pick" + (n === i ? " cur" : ""),
      onmousedown: e => e.preventDefault(),          // keep the caret where it is
      onclick: () => linkPopAccept(n),
    },
      el("span", {class: "k"}, r.isNew ? "+" : (r.ref.split("/")[0] || "\u00b7").slice(0, 2)),
      el("span", {style: "min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},
        r.isNew ? "Make " + r.ref : r.title),
      el("span", {class: "d"}, r.isNew ? "new page" : (LINK_KIND_WORD[r.kind] || r.kind || "")));
    box.append(row);
  });
  const cur = box.children[i];
  if (cur) cur.scrollIntoView({block: "nearest"});
}

function linkPopAccept(n) {
  if (!LINKPOP) return;
  const {host, at, rows} = LINKPOP;
  const r = rows[n == null ? LINKPOP.i : n];
  if (!r) { linkPopClose(); return; }
  const text = hostText(host);
  const before = textBeforeCaret(host) || "";
  const insert = "[[" + r.ref + "]]";
  const next = text.slice(0, at) + insert + text.slice(before.length);
  linkPopClose();
  setHostText(host, next, at + insert.length);
  host.dispatchEvent(new Event("input", {bubbles: true}));
}

/* True when the key belonged to the list rather than to the text. */
function linkPopKey(e) {
  if (!LINKPOP || LINKPOP.host !== e.target) return false;
  const n = LINKPOP.rows.length;
  if (e.key === "ArrowDown") { LINKPOP.i = (LINKPOP.i + 1) % n; linkPopDraw(); e.preventDefault(); return true; }
  if (e.key === "ArrowUp")   { LINKPOP.i = (LINKPOP.i - 1 + n) % n; linkPopDraw(); e.preventDefault(); return true; }
  if (e.key === "Enter" || e.key === "Tab") { linkPopAccept(); e.preventDefault(); return true; }
  if (e.key === "Escape")    { linkPopClose(); e.preventDefault(); return true; }
  return false;
}

function linkPopSync(host) {
  const found = openLinkAt(textBeforeCaret(host));
  if (!found) { linkPopClose(); return; }
  const rows = linkCandidates(found.query);
  if (!rows.length) { linkPopClose(); return; }

  if (!LINKPOP || LINKPOP.host !== host) {
    linkPopClose();
    const box = el("div", {class: "linkpop"});
    document.body.append(box);
    LINKPOP = {host, box, rows, i: 0, at: found.at};
  } else {
    Object.assign(LINKPOP, {rows, at: found.at});
    if (LINKPOP.i >= rows.length) LINKPOP.i = 0;
  }
  linkPopDraw();

  const r = caretScreenRect(host);
  const box = LINKPOP.box;
  box.style.left = Math.min(r.left, window.innerWidth - 300) + "px";
  // Above the line when there is no room under it.
  const below = window.innerHeight - r.bottom;
  if (below < 200 && r.top > 200) {
    box.style.top = "auto";
    box.style.bottom = (window.innerHeight - r.top + 4) + "px";
  } else {
    box.style.bottom = "auto";
    box.style.top = (r.bottom + 4) + "px";
  }
}

function attachLinkAutocomplete(host) {
  host.addEventListener("input", () => linkPopSync(host));
  host.addEventListener("click", () => linkPopSync(host));
  host.addEventListener("blur", () => { if (LINKPOP && LINKPOP.host === host) linkPopClose(); });
}

/* ---------- which visual line the caret is on ----------
   A title wraps, so "at the top of the block" is not "at character zero": a
   long line that has wrapped three times should let Up walk through all three
   before it leaves. So this measures where the caret actually is on screen and
   compares it with the block's own box.

   A collapsed caret at a text boundary returns no rectangle in Chrome, so when
   there is none we measure the character beside it instead. No rectangle at all
   means an empty block, which is both its first line and its last. */
function caretAtEdge(node) {
  const both = {first: true, last: true};
  const sel = getSelection();
  if (!sel || !sel.rangeCount || !node.contains(sel.anchorNode)) return both;

  const cs = getComputedStyle(node);
  const line = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 14) * 1.4;
  const box = node.getBoundingClientRect();

  let rect = sel.getRangeAt(0).getClientRects()[0];
  if (!rect) {
    const tn = node.firstChild;
    if (!tn || tn.nodeType !== 3 || !tn.length) return both;
    /* anchorOffset counts children when the caret sits on the element rather
       than inside its text, so at the end of a block it reads 1 and measuring
       character 1 would report the FIRST line. Measure the text before the
       caret instead, which is the same number whatever the anchor is. */
    const pre = document.createRange();
    pre.selectNodeContents(node);
    pre.setEnd(sel.anchorNode, sel.anchorOffset);
    const off = Math.max(0, Math.min(pre.toString().length, tn.length));
    const r = document.createRange();
    if (off > 0) { r.setStart(tn, off - 1); r.setEnd(tn, off); }
    else { r.setStart(tn, 0); r.setEnd(tn, 1); }
    rect = r.getClientRects()[0];
  }
  if (!rect) return both;

  // Three quarters of a line of slack: enough to be on the line, not enough to
  // reach the one after it.
  return {first: rect.top - box.top < line * 0.75,
          last: box.bottom - rect.bottom < line * 0.75};
}

/* The blocks you can actually see, in the order you see them. Collapsed
   children are not rendered at all, so the DOM is already the right answer. */
function moveToBlock(txt, dir) {
  const outline = txt.closest(".outline");
  if (!outline) return false;
  const all = $$(".txt", outline);
  const next = all[all.indexOf(txt) + dir];
  if (!next) return false;
  const id = next.closest(".blk")?.dataset.id;
  if (!id) return false;
  txt.blur();
  // Up lands at the end of the block above and Down at the start of the one
  // below, so holding the key walks through a wrapped line rather than
  // skipping over it.
  focusBlock(id, dir < 0);
  return true;
}

function outlineBlock(path, page, b) {
  const kids = b.children || [];
  const node = el("div", {class: "blk" + (kids.length ? " has-kids" : "") + (b.collapsed ? " collapsed" : ""), data: {id: b.id}});
  const line = el("div", {class: "line"});

  line.append(el("span", {
    class: "bullet", title: kids.length ? "Collapse / expand" : "",
    onclick: () => { if (kids.length) { b.collapsed = !b.collapsed; render(); } },
  }));
  // Always a target here, so a plain note can become a task and a task can stop
  // being one, both by clicking the same place.
  line.append(el("button", {
    class: "state " + (b.state || "none"),
    title: b.state ? "Cycle state, then back to a plain note" : "Make this a task",
    onclick: e => {
      keepFocus(idSel(".blk", b.id, ".state"), e.currentTarget);
      cycleState(path, b);
    },
  }, b.state || "\u00B7"));

  const txt = el("div", {
    class: "txt", contenteditable: "true", spellcheck: "false",
    html: renderInline(b.title),
  });
  // Clicking a [[link]] must follow it, not drop into the editor. Focus would
  // replace this line with its raw text and destroy the span mid-click, so
  // refuse focus for that one gesture and let the delegated handler navigate.
  txt.addEventListener("mousedown", e => {
    if (e.target.closest("[data-link]")) e.preventDefault();
  });
  txt.addEventListener("focus", () => { txt.textContent = b.title; });
  txt.addEventListener("blur", () => {
    const val = txt.textContent.replace(/\n/g, " ");
    if (val !== b.title) {
      const [st, rest] = splitState(val);
      if (st) { b.state = st; b.title = rest; } else { b.title = val; }
      createLinkedPages(b.title);
      touch(path); noteTodoTouched();
      renderNav();
    }
    /* A line with a dropped picture in it comes back as a path, not a URL, so
       the same pass the redraw runs has to run over the line it just rebuilt --
       otherwise editing a line emptied the picture that was already in it. */
    txt.innerHTML = renderInline(b.title);
    resolveAssets(txt);
  });
  /* ---------- pasting a list ----------
     A list that arrives from somewhere else is a list of tasks, so it becomes
     one block per line instead of one block with the whole thing in it. One
     line is still just text at the caret: pasting a word into the middle of a
     sentence has to keep working, and it is the second line that tells us a
     paste was a list. Plain text either way, so a copy out of a web page does
     not bring its fonts and colours with it. */
  /* ---------- dropping a file on a line ----------
     The line is the target, so where the file ends up needs no dialog: it goes
     in assets/ and the line it was dropped on gets the link. */
  txt.addEventListener("dragover", e => {
    if (!Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    txt.classList.add("dropping");
  });
  txt.addEventListener("dragleave", () => txt.classList.remove("dropping"));
  txt.addEventListener("drop", e => {
    const files = e.dataTransfer && e.dataTransfer.files;
    txt.classList.remove("dropping");
    if (!files || !files.length) return;
    e.preventDefault();
    e.stopPropagation();
    attachFilesToBlock(path, b, files, txt);
  });
  txt.addEventListener("paste", e => {
    /* A screenshot in the clipboard arrives as a file, not as text. Words win
       when there are words: a copy out of a spreadsheet carries a picture of
       itself as well, and it is the text that was meant. */
    const raw = e.clipboardData && e.clipboardData.getData("text/plain");
    const files = e.clipboardData ? Array.from(e.clipboardData.files || []) : [];
    if (files.length && !trim(raw || "")) {
      e.preventDefault();
      attachFilesToBlock(path, b, files, txt);
      return;
    }
    if (raw == null) return;
    e.preventDefault();
    if (LINKPOP && LINKPOP.host === txt) linkPopClose();
    const whole = txt.textContent.replace(/\n/g, " ");
    const [from, to] = caretOffsets(txt);
    const before = whole.slice(0, from), after = whole.slice(to);

    const lines = raw.replace(/\r\n?/g, "\n").split("\n").filter(l => trim(l) !== "");
    if (lines.length < 2) {
      const one = raw.replace(/[\r\n]+/g, " ");
      setHostText(txt, before + one + after, before.length + one.length);
      linkPopSync(txt);
      return;
    }

    const roots = parseOutlineText(raw);
    if (!roots.length) return;
    const inherit = b.state && OPEN_STATES[b.state] ? "TODO" : null;
    const n = readyPastedBlocks(roots, {defaultState: inherit});

    const sibs = siblingsOf(page, b);
    let tail = null;
    if (trim(whole) === "" && !(b.children || []).length) {
      // Pasted into the empty block you just opened: the list takes its place
      // rather than leaving a blank line above itself. A block with children
      // under it is not spare like that, so there the list goes after it.
      txt.blur();
      sibs.splice(sibs.indexOf(b), 1, ...roots);
    } else if (trim(before) === "") {
      /* At the very start of a line that has words on it, the list goes above
         and the line keeps them. Emptying it and rebuilding it underneath
         leaves a blank block where the caret used to be, which is the same
         debris Enter-at-the-start already takes care to avoid. */
      txt.blur();
      sibs.splice(sibs.indexOf(b), 0, ...roots);
    } else {
      txt.textContent = before;
      txt.blur();
      if (trim(after) !== "") {
        const [st, rest] = splitState(after);
        tail = newBlock({state: st || inherit, title: trim(st ? rest : after)});
        if (tail.state) { tail.props.Added = todayStamp(); stampAuthor(tail); }
      }
      sibs.splice(sibs.indexOf(b) + 1, 0, ...roots, ...(tail ? [tail] : []));
    }
    touch(path); noteTodoTouched(); render();
    notify(n + " lines pasted, one block each.");
    focusBlock((tail || roots[roots.length - 1]).id);
  });
  attachLinkAutocomplete(txt);
  txt.addEventListener("keydown", e => {
    // While the [[ list is up it owns the arrows, Enter, Tab and Escape.
    if (linkPopKey(e)) return;
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      /* Enter cuts the line where the caret is: what is behind the caret stays
         here and what is in front of it goes to the new block. At the end of a
         line -- where Enter usually gets pressed -- that is the same empty new
         block as before, so the familiar case is untouched and the middle of a
         sentence now works too. */
      e.preventDefault();
      const sibs = siblingsOf(page, b);
      const whole = txt.textContent.replace(/\n/g, " ");
      const [from, to] = caretOffsets(txt);
      const before = whole.slice(0, from), after = whole.slice(to);
      const inherit = b.state && OPEN_STATES[b.state] ? "TODO" : null;
      if (from === 0 && to === 0 && trim(whole) !== "") {
        // At the very start: open a line above and leave this one as it is,
        // rather than emptying it and carrying its words down.
        txt.blur();
        const nb = newBlock({state: inherit});
        if (nb.state) { nb.props.Added = todayStamp(); stampAuthor(nb); }
        sibs.splice(sibs.indexOf(b), 0, nb);
        touch(path); render(); focusBlock(nb.id);
        return;
      }
      // Blur is what writes a block's text back, so hand it the half that stays.
      txt.textContent = before;
      txt.blur();
      const [st, rest] = splitState(after);
      const nb = newBlock({state: st || inherit, title: trim(st ? rest : after)});
      if (nb.state) { nb.props.Added = todayStamp(); stampAuthor(nb); }
      if (nb.title) createLinkedPages(nb.title);
      sibs.splice(sibs.indexOf(b) + 1, 0, nb);
      touch(path); render();
      // Caret where the cut was, which is the start of what moved down.
      focusBlock(nb.id, false);
    } else if (e.key === "Tab") {
      e.preventDefault(); txt.blur();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      if (e.shiftKey) {
        const par = parentOf(page, b);
        if (par) {
          const gsibs = siblingsOf(page, par);
          sibs.splice(i, 1);
          gsibs.splice(gsibs.indexOf(par) + 1, 0, b);
          touch(path); render(); focusBlock(b.id);
        }
      } else if (i > 0) {
        const prev = sibs[i - 1];
        sibs.splice(i, 1);
        (prev.children || (prev.children = [])).push(b);
        prev.collapsed = false;
        touch(path); render(); focusBlock(b.id);
      }
    } else if (e.altKey && e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      /* Move the line among its own siblings, children and all, the way every
         outliner does it. Alt-shift rather than plain alt: the arrows alone
         already walk the blocks, and a key that both moves the caret and
         rearranges the document depending on a modifier you forgot you were
         holding is how a plan gets reordered by accident. */
      e.preventDefault();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      const to = i + (e.key === "ArrowUp" ? -1 : 1);
      if (to < 0 || to >= sibs.length) return;     // the ends are the ends
      txt.blur();
      sibs.splice(i, 1);
      sibs.splice(to, 0, b);
      touch(path); noteTodoTouched(); render(); focusBlock(b.id);
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      // Back into the same line afterwards, so ctrl-enter twice means two steps.
      e.preventDefault(); txt.blur(); cycleState(path, b); focusBlock(b.id);
    } else if (e.key === "Backspace" && txt.textContent === "" && !(b.children || []).length) {
      e.preventDefault();
      const sibs = siblingsOf(page, b), i = sibs.indexOf(b);
      const prev = i > 0 ? sibs[i - 1] : null;
      sibs.splice(i, 1);
      touch(path); render();
      if (prev) focusBlock(prev.id);
    } else if (e.key === "ArrowUp" && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
      // Only once there is no line left above inside this block.
      if (caretAtEdge(txt).first && moveToBlock(txt, -1)) e.preventDefault();
    } else if (e.key === "ArrowDown" && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
      if (caretAtEdge(txt).last && moveToBlock(txt, 1)) e.preventDefault();
    } else if (e.key === "Escape") {
      txt.blur();
    }
  });
  line.append(txt);
  line.append(el("button", {
    class: "iconbtn", title: "Task actions",
    onclick: () => openTaskDetail(path, b),
  }, "⋯"));
  node.append(line);

  const props = Object.entries(b.props || {}).filter(([k]) => k.toLowerCase() !== "id");
  if (props.length) {
    node.append(el("div", {class: "props", html: props.map(([k, v]) => esc(k) + ":: " + renderInline(v)).join("  ·  ")}));
  }
  for (const l of b.body || []) if (trim(l)) node.append(el("div", {class: "bodyline", html: renderInline(l)}));

  if (!b.collapsed) for (const k of kids) node.append(outlineBlock(path, page, k));
  return node;
}

function outlineFor(path) {
  const page = getPage(path);
  const box = el("div", {class: "card"});
  const outline = el("div", {class: "outline"});
  if (!page.blocks.length) page.blocks.push(newBlock({title: ""}));
  for (const b of page.blocks) outline.append(outlineBlock(path, page, b));
  box.append(outline);
  box.append(el("button", {
    class: "dash-item", onclick: () => {
      const nb = newBlock({title: ""});
      page.blocks.push(nb); touch(path); render(); focusBlock(nb.id);
    },
  }, "+ new block"));
  return box;
}

function viewToday() {
  const path = ensureJournal(todayISO());
  const page = getPage(path);
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar(), heroCard());

  const due = acts.filter(a => a.group === "LATE" || a.group === "TODAY");
  if (due.length) c.append(section("Due", due.length, taskCard(due)));

  c.append(section("Today's journal", null, outlineFor(path),
    el("span", {style: "margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0"}, humanDate(todayISO()))));

  // The journal is the point of this screen. The context surface sits under it,
  // faded, and only when it actually has something to offer.
  const surfaced = state.context ? oldestTodosForContext(state.context) : [];
  if (surfaced.length) {
    c.append(section("Oldest in @" + state.context, surfaced.length, taskCard(surfaced),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => openContextPicker("Switch context", ctx => surfaceContext(ctx))}, "switch"),
      "quiet"));
  }

  const prev = journalPath(shiftISO(todayISO(), -1));
  c.append(el("div", {class: "section", style: "display:flex;gap:8px"},
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), -1)))}, "← yesterday"),
    V.pages.has(prev) ? null : null,
    el("button", {class: "btn sm ghost", onclick: () => openPage(ensureJournal(shiftISO(todayISO(), 1)))}, "tomorrow →")));
  return c;
}

function viewNext() {
  const acts = leafActions();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  for (const g of GROUPS) {
    const items = acts.filter(a => a.group === g);
    if (!items.length) continue;
    items.sort((x, y) => (x.added || "9999").localeCompare(y.added || "9999"));
    c.append(section(GROUP_META[g].label, items.length, taskCard(items)));
  }
  if (!acts.length) c.append(section("Next actions", 0, taskCard([], "No open actions. Capture something, or check your projects.")));
  return c;
}

function viewContext() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const ctxs = contextList();
  if (state.context) {
    const items = oldestTodosForContext(state.context, 99);
    c.append(section("@" + state.context, items.length,
      taskCard(items.slice(0, CFG.surfaceCount), "Nothing open here."),
      el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => { state.context = null; render(); }}, "clear")));
    if (items.length > CFG.surfaceCount) {
      c.append(section("Rest of @" + state.context, items.length - CFG.surfaceCount, taskCard(items.slice(CFG.surfaceCount))));
    }
  }
  const card = el("div", {class: "card"});
  if (!ctxs.length) card.append(el("div", {class: "empty"}, "No contexts yet. Create pages under pages/c/ - e.g. c/phone, c/errand, c/computer."));
  for (const ctx of ctxs) {
    const open = leafActions().filter(a => a.context === ctx && OPEN_STATES[a.state]);
    card.append(el("button", {class: "prow", onclick: () => surfaceContext(ctx)},
      el("span", {class: "st st-1"}, "@"),
      el("span", {class: "nm"}, ctx),
      el("span", {class: "sub"}, open.length + " open")));
  }
  c.append(section("All contexts", ctxs.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newContextPrompt()}, "+ new")));
  return c;
}

function viewAgenda() {
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const days = agendaScan();
  const dated = days.flatMap(([, items]) => items).filter(a => a.due);
  if (dated.length) {
    c.append(el("div", {class: "section", style: "display:flex;gap:8px;flex-wrap:wrap;align-items:center"},
      el("button", {class: "btn sm", onclick: () => addToCalendar(dated)},
        "\u25F7 Add " + dated.length + " to calendar"),
      el("button", {class: "btn sm ghost", onclick: () => openCalendarPicker(dated)}, "Choose where"),
      el("span", {style: "color:var(--fg3);font-size:12px"},
        "A file, or your calendar's new-event screen. Nothing is subscribed.")));
  }
  if (!days.length) {
    c.append(section("Next " + CFG.agendaDays + " days", 0,
      taskCard([], "Nothing scheduled. Add SCHEDULED:: [[date]] or DEADLINE:: [[date]] to an action.")));
  }
  for (const [date, items] of days) {
    const label = date === todayISO() ? date + "  (today)" : date < todayISO() ? date + "  (overdue)" : date;
    c.append(section(label + " · " + humanDate(date), items.length, taskCard(items)));
  }
