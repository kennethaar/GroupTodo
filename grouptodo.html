}

function viewProjects() {
  const code = state.statusCode;
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const rows = projectsInVisible(code);
  const stuck = new Set(stuckActiveProjects().map(x => x.path));
  const card = el("div", {class: "card"});
  if (!rows.length) card.append(el("div", {class: "empty"}, "No " + STATUS_LABEL[code].toLowerCase() + " projects."));
  const titleOf = r => inSpace(r.space, () => pageTitle(r.path));
  rows.sort((x, y) => titleOf(x).localeCompare(titleOf(y)));
  for (const {path: p, space} of rows) {
    const info = inSpace(space, () => ({
      title: pageTitle(p),
      open: openTodoCount(p) + journalActionsFor(p).filter(r => OPEN_STATES[r.state]).length,
      reviewed: dateIn(getPage(p)?.props?.reviewed),
    }));
    const idle = info.reviewed ? dateDiffDays(info.reviewed, todayISO()) : null;
    card.append(el("div", {class: "prow"},
      el("button", {class: "st st-" + code, title: STATUS_TEXT[code],
        onclick: () => inSpace(space, () => openStatusPicker(p))}, code),
      el("button", {class: "nm", style: "text-align:left", onclick: () => openPageIn(space, p)}, info.title),
      multiSpace() ? spaceBadge(space) : null,
      (stuck.has(p) && space === Spaces.active)
        ? el("span", {class: "chip miss b", onclick: () => openAddNextAction(p)}, "no next action") : null,
      info.open ? el("span", {class: "chip"}, info.open + " open") : null,
      idle != null ? el("span", {class: "chip age"}, "reviewed " + idle + "d ago") : null,
      el("button", {class: "iconbtn", title: "Change status",
        onclick: () => inSpace(space, () => openStatusPicker(p))}, "⇄")));
  }
  c.append(section(STATUS_LABEL[code] + " projects", rows.length, card,
    el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: () => newProjectPrompt()}, "+ new project")));
  return c;
}

function viewPages(filterFn, title, mkNew) {
  const c = el("div", {class: "wrap"});
  const paths = allPages(filterFn).sort((a, b) => pageTitle(a).localeCompare(pageTitle(b)));
  const card = pagedCard(paths, p => el("button", {class: "prow", onclick: () => openPage(p)},
    el("span", {class: "st st-2"}, pageRef(p).split("/")[0].slice(0, 1)),
    el("span", {class: "nm"}, pageTitle(p)),
    el("span", {class: "sub"}, p)), "Nothing here yet.");
  c.append(section(title, paths.length, card,
    mkNew ? el("button", {class: "btn sm ghost", style: "margin-left:auto", onclick: mkNew}, "+ new") : null));
  return c;
}

function viewHealth() {
  const issues = healthScan();
  const c = el("div", {class: "wrap"});
  c.append(nudgeBar());
  const byType = new Map();
  for (const i of issues) { if (!byType.has(i.type)) byType.set(i.type, []); byType.get(i.type).push(i); }
  if (!issues.length) c.append(section("Health", 0, el("div", {class: "card"}, el("div", {class: "empty"}, "System healthy."))));
  for (const [type, items] of byType) {
    c.append(section(type.replace(/-/g, " "), items.length,
      pagedCard(items, i => el("button", {class: "dash-item", onclick: () => openPage(i.path)},
        el("span", {}, i.text), el("span", {class: "p"}, i.path)))));
  }
  const dupes = duplicateProjects();
  if (dupes.length) {
    const card = el("div", {class: "card"});
    for (const d of dupes) {
      card.append(el("div", {class: "dash-item"}, el("b", {}, d.slug), el("span", {class: "p"}, d.paths.length + " copies")));
      for (const p of d.paths) {
        card.append(el("div", {class: "prow"},
          el("button", {class: "nm", style: "text-align:left", onclick: () => openPage(p)}, p),
          el("span", {class: "sub"}, openTodoCount(p) + " open"),
          el("button", {class: "btn sm ghost", onclick: () => {
            d.paths.filter(x => x !== p).forEach(x => mergePages(x, p));
            render();
          }}, "keep this, merge rest")));
      }
    }
    c.append(section("duplicate projects", dupes.length, card));
  }
  return c;
}

function viewPage() {
  const path = state.pagePath;
  if (!path || !V.pages.has(path)) { state.view = "today"; return viewToday(); }
  const page = getPage(path);
  const c = el("div", {class: "wrap"});
  const horizon = isHorizonPage(path);
  const code = horizon ? null : statusDirOf(path);

  const meta = el("div", {class: "nudgebar"});
  if (horizon) {
    const base = HORIZONS.find(x => x.page === baseName(path));
    const h = base ? horizonMeta(base.key) : null;
    meta.append(el("button", {class: "nudge", onclick: () => go("horizons")},
      el("b", {}, h ? h.alt : "horizon"), h ? h.h + " \u00B7 " + h.name : "horizon"));
  }
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openStatusPicker(path)}, el("b", {}, code), STATUS_LABEL[code]));
  for (const [k, v] of Object.entries(page.props || {})) {
    if (k === "title") continue;
    if (k === DEPENDS_PROP) continue;      // it has a control of its own below
    if (k === "updated") {
      meta.append(el("span", {class: "nudge"}, "changed " + formatStamp(v)));
      continue;
    }
    meta.append(el("span", {class: "nudge", html: esc(k) + ":: " + renderInline(v)}));
  }
  if (pageKind(path) === "checklist") {
    const tpl = isProjectTemplate(path);
    meta.append(el("button", {class: "nudge" + (tpl ? " ok" : ""),
      onclick: () => { setChecklistKind(path, tpl ? null : "project"); render(); }},
      tpl ? "project template" : "simple checklist"));
    meta.append(el("button", {class: "nudge", onclick: () => openRunChecklist(path)},
      tpl ? "new project from this" : "run this"));
  }
  meta.append(el("button", {class: "nudge", onclick: () => { updateReviewed(path); render(); }}, "mark reviewed"));
  if (code) meta.append(el("button", {class: "nudge" + (outcomeOf(path) ? "" : " warn"),
    onclick: () => openOutcomePrompt(path)},
    outcomeOf(path) ? "outcome: " + outcomeOf(path) : "no outcome stated"));
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openAreaPicker(path)},
    areaOfProject(path) ? "area: " + areaOfProject(path) : "no area"));
  /* The order this project sits in. A blocked project says so here rather than
     in a list somewhere else, because this is the page you open when you are
     about to start it. */
  if (code) {
    const deps = dependsOn(path);
    const blocked = blockersOf(path);
    meta.append(el("button", {class: "nudge" + (blocked.length ? " warn" : deps.length ? " ok" : ""),
      title: deps.length ? "Starts after " + deps.map(pageTitle).join(", ") : "Nothing has to finish first",
      onclick: () => openDependsPicker(path)},
      deps.length
        ? (blocked.length ? "blocked by " + blocked.map(pageTitle).join(", ")
                          : "after " + deps.map(pageTitle).join(", "))
        : "nothing comes first"));
    const t = chainTrouble(path);
    if (t) meta.append(el("button", {class: "nudge warn",
      title: "Push this project so it starts on " + t.need,
      onclick: () => { if (pushProjectTo(path, t.need)) { notify("Moved to start " + t.need + "."); render(); } }},
      "starts " + t.days + " day" + (t.days === 1 ? "" : "s") + " too early"));
    const waiting = dependentsOf(path);
    if (waiting.length) meta.append(el("button", {class: "nudge",
      title: waiting.map(pageTitle).join(", "),
      onclick: () => openPage(waiting[0])},
      waiting.length + " project" + (waiting.length === 1 ? "" : "s") + " waiting on this"));
  }
  if (code) meta.append(el("button", {class: "nudge", onclick: () => openAddNextAction(path)}, "+ next action"));
  c.append(meta);

  /* A project gets the same grid a todo gets: what it serves, what shelf it is
     on, what is beside it, what is in it. Escape walks it with the arrows. */
  if (code && !isSimple()) c.append(el("div", {class: "section"},
    el("label", {class: "alab", style: "display:block;margin-bottom:5px"}, "Where it sits"),
    projectGrid(path),
    el("div", {class: "ahint"}, "esc walks it with the arrows, enter centres; enter on the middle adds a step under it")));

  // The tour explains itself on its own page and nowhere else, so the rest of
  // the app is never carrying an explanation of the app around with it.
  if (isTourProject(path)) {
    const tc = tourCard(path);
    if (tc) c.append(tc);
  }

  if (isSimple() && pageKind(path) !== "journal") {
    // Rows and a quick-add box, rather than the outliner.
    c.append(el("div", {class: "section"}, quickAdd(path)));
    const rows = flattenBlocks(page.blocks)
      .filter(b => b.state)
      .map(b => ({path, block: b, state: b.state, title: b.title, context: contextOf(b.title),
                  due: dueDate(b), age: blockAge(b), added: addedDate(b), assignee: assigneeOf(b),
                  missingVerb: !startsWithVerb(b.title), missingContext: !hasContextLink(b.title)}));
    // A task written in a day page with [[1/this project]] belongs here too.
    if (statusDirOf(path)) rows.push(...journalActionsFor(path));
    const open = rows.filter(r => OPEN_STATES[r.state]);
    const done = rows.filter(r => !OPEN_STATES[r.state]);
    c.append(section("To do", open.length, taskCard(open, "No open steps. Add one above.")));
    if (done.length) c.append(section("Done", done.length, taskCard(done)));
    const notes = page.blocks.filter(b => !b.state && trim(b.title));
    if (notes.length) {
      const card = el("div", {class: "card"});
      for (const b of notes) {
        card.append(el("button", {class: "dash-item", title: "Open - you can make this a task",
          onclick: () => openTaskDetail(path, b)}, el("span", {html: renderInline(b.title)})));
      }
      c.append(section("Notes", notes.length, card));
    }
  } else {
    c.append(el("div", {class: "section"}, outlineFor(path)));
    /* The outliner shows this page's own lines. A task written in a day page
       with [[1/this project]] is this project's too, so it gets its own
       section -- edited where it lives, which is what the arrow opens. */
    if (statusDirOf(path)) {
      const fromDays = journalActionsFor(path);
      if (fromDays.length) c.append(section("From the day pages", fromDays.length, taskCard(fromDays)));
    }
  }

  const back = isSimple() ? [] : backlinksTo(path);
  const card = el("div", {class: "card"});
  if (!back.length) card.append(el("div", {class: "empty"}, "No backlinks."));
  for (const h of back) {
    card.append(el("button", {class: "dash-item", onclick: () => openPage(h.path)},
      el("span", {html: renderInline(h.block.title || "(block)")}), el("span", {class: "p"}, h.path)));
  }
  if (!isSimple()) c.append(section("Linked references", back.length, card));

  c.append(el("div", {class: "section", style: "display:flex;gap:8px;flex-wrap:wrap"},
    isJournalPath(path) ? null
      : el("button", {class: "btn sm ghost", onclick: () => openExportPage(path)}, "share"),
    el("button", {class: "btn sm ghost", title: "A link you can paste into chat or email",
      onclick: () => copyLinkTo(deepLink(path), pageTitle(path))}, "copy link"),
    el("button", {class: "btn sm ghost", onclick: () => renamePrompt(path)}, "rename"),
    el("button", {class: "btn sm ghost", onclick: () => movePrompt(path)}, "move"),
    isJournalPath(path) ? null
      : el("button", {class: "btn sm ghost", onclick: () => makePrivatePrompt(path)}, "make private"),
    el("button", {class: "btn sm ghost", onclick: () => deletePrompt(path)}, "delete")));
  return c;
}

function viewSearch() {
  const q = trim(state.query).toLowerCase();
  const c = el("div", {class: "wrap"});
  const box = el("div", {class: "filterbox", style: "padding:14px 0"},
    el("input", {
      placeholder: "Search every block and page...", value: state.query,
      oninput: e => { state.query = e.target.value; clearTimeout(window.__sq); window.__sq = setTimeout(render, 160); },
    }));
  c.append(box);
  if (!q) { c.append(el("div", {class: "empty"}, "Type to search.")); return c; }
  const hits = acrossSpaces(() => {
    const found = [];
    for (const [path, page] of V.pages) {
      if (pageTitle(path).toLowerCase().includes(q)) found.push({path, block: null});
      walkBlocks(page.blocks, b => {
        const text = [b.title, ...(b.body || [])].join(" ").toLowerCase();
        if (text.includes(q)) found.push({path, block: b});
      });
    }
    return found;
  });
  const card = el("div", {class: "card"});
  if (!hits.length) card.append(el("div", {class: "empty"}, "No matches."));
  for (const h of hits.slice(0, 300)) {
    const label = inSpace(h.space, () => h.block ? h.block.title : pageTitle(h.path));
    card.append(el("button", {class: "dash-item",
      onclick: () => h.block ? inSpace(h.space, () => openTaskDetail(h.path, h.block, h.space))
                             : openPageIn(h.space, h.path)},
      h.block ? stateChip(h.block.state) : null,
      el("span", {html: renderInline(label)}),
      multiSpace() && h.space ? spaceBadge(h.space) : null,
      el("span", {class: "p"}, h.path)));
  }
  c.append(section("Results", hits.length, card));
  return c;
}

  today: "Today", next: "Next actions", context: "Context", agenda: "Agenda",
  todos: "Todos", horizons: "Horizons of focus", checklists: "Routines & lists",
  people: "People",                     // or the header read "Today" on People
  chat: "Chat", flagged: "Flagged",     // same trap, same fix
  board: "Board", calendar: "Calendar", graph: "Graph",   // and again, for the three new ones

  health: "Health check", search: "Search", page: "Page",
};

function render() {
  if (!V.loaded) return;
  applyChrome();
  clearMemo();
  QUIET_CACHE = null;
  TOUR_PATH_CACHE = undefined;
  renderNav();
  renderContextChip();
  const c = $("#content");
  c.textContent = "";
  let node;
  switch (state.view) {
    case "today":   node = isSimple() ? viewMyDay() : viewToday(); break;
    case "todos":   node = viewTodos(); break;
    case "people":  node = viewPeople(); break;
    case "chat":    node = viewChat(); break;
    case "flagged": node = viewFlagged(); break;
    case "board":   node = viewBoard(); break;
    case "calendar":node = viewCalendar(); break;
    case "graph":   node = viewGraph(); break;
    case "gantt":   node = viewGantt(); break;
    case "report":  node = viewReport(); break;
    case "person":  node = viewPerson(state.person || whoAmI()); break;
    case "horizons":
      node = viewHorizons();
      if (!getSetting("horizons_seen")) setTimeout(() => openHorizonsWizard(0), 180);
      break;
    case "checklists": node = viewChecklists(); break;
    case "next":    node = viewNext(); break;
    case "context": node = viewContext(); break;
    case "agenda":  node = viewAgenda(); break;
    case "projects":node = viewProjects(); break;
    case "health":  node = viewHealth(); break;
    case "search":  node = viewSearch(); break;
    case "page":    node = viewPage(); break;
    case "zettel":  node = viewPages(p => p.startsWith(DIRS.zettel + "/"), "Zettel notes", () => newZettelPrompt()); break;
    case "journal-list": node = viewPages(p => isJournalPath(p), "Journals"); break;
    case "pages":   node = viewPages(p => !isJournalPath(p) && pageKind(p) !== "verb", "All pages"); break;
    case "review":  node = isSimple() ? viewMyDay() : viewToday(); openReview(0); break;
    case "weeding": node = isSimple() ? viewMyDay() : viewToday(); openWeeding(); break;
    default:        node = isSimple() ? viewMyDay() : viewToday();
  }
  c.append(node);
  if (isSimple() && state.view === "today") VIEW_TITLE.today = "My day";
  else VIEW_TITLE.today = "Today";
  $("#hTitle").textContent = state.view === "page" ? pageTitle(state.pagePath)
    : state.view === "projects" ? STATUS_LABEL[state.statusCode] + " projects"
    : state.view === "person" ? (state.person || whoAmI() || "Person")
    : (VIEW_TITLE[state.view] || "Today");
  const vis = visibleSpaces();
  $("#hSub").textContent = vis.length > 1 ? vis.join(" + ")
    : state.view === "page" ? state.pagePath
    : state.context && ["today", "context", "next"].includes(state.view) ? "@" + state.context : "";
  resolveAssets(c);
  applyRefocus();
}

<script>
/* ============================================================
   120_MODALS
   Port of: init.lua 80_RENDER_ENGINE (open_scratch + letter keys)
   The bottom-split scratch buffers become bottom sheets; the a-z
   selection keys from open_context_picker are kept exactly.
   ============================================================ */
let MODAL_KEYS = null;

function modal({title, hint, body, foot, center = false, onKey = null}) {
  closeModal();
  const sheet = el("div", {class: "modal"},
    el("header", {}, el("h2", {}, title), el("div", {style: "flex:1"}),
      hint ? el("span", {class: "hint"}, hint) : null,
      el("button", {class: "iconbtn", onclick: closeModal}, "✕")),
    el("div", {class: "body"}, body),
    foot ? el("div", {class: "foot"}, foot) : null);
  const scrim = el("div", {class: "scrim" + (center ? " center" : ""), onclick: e => { if (e.target === scrim) closeModal(); }}, sheet);
  $("#modalRoot").append(scrim);
  resolveAssets(sheet);
  MODAL_KEYS = onKey;
  return {close: closeModal, root: sheet};
}
function closeModal() {
  $("#modalRoot").textContent = "";
  MODAL_KEYS = null;
  /* Four of the tour's doors are dialogs rather than screens, so closing one is
     the moment that counts as coming back. Nothing happens unless a step is
     waiting, and the check stands down if anything else opens meanwhile. */
  if (typeof maybeAskTourCheckoff === "function") maybeAskTourCheckoff();
}
function pickRow(key, label, detail, onclick) {
  return el("button", {class: "pick", onclick},
    el("span", {class: "k"}, key), el("span", {}, label),
    detail ? el("span", {class: "d"}, detail) : null);
}

/* Generic list picker with a-z single-key selection. */
/* A picker, in one of two shapes.

   Positional, the default: the rows are lettered a, b, c down the page and the
   letter is the choice, exactly like the picker in the Neovim config this grew
   out of.

   Typeahead, when `typeahead` is set: you type the name instead. The first
   item starting with what you typed is selected, the same letter again cycles
   through the others starting with it, and Enter takes the selected one. The
   two shapes cannot be mixed in one list: with `computer, errand, phone` the
   letter c means "phone" to one rule and "computer" to the other, and a picker
   you cannot predict is worse than either rule alone. A list whose names you
   know wants typeahead; a list of unfamiliar things wants the letters. */
function listPicker({title, hint, items, label, detail, onPick, footer, typeahead = false}) {
  const letters = "abcdefghijklmnopqrstuvwxyz";
  let filtered = items.slice();
  let sel = 0, buf = "", bufAt = 0;
  const body = el("div", {});
  const list = el("div", {});
  const input = el("input", {
    placeholder: "filter...",
    oninput: e => { const q = e.target.value.toLowerCase();
      filtered = items.filter(i => label(i).toLowerCase().includes(q)); sel = 0; draw(); },
  });
  body.append(el("div", {class: "filterbox"}, input), list);
  const plain = it => trim(String(label(it))).toLowerCase().replace(/^@/, "");
  function draw() {
    list.textContent = "";
    if (!filtered.length) list.append(el("div", {class: "empty"}, "No matches."));
    filtered.forEach((it, i) => {
      const key = typeahead ? (i === sel ? "›" : "") : (i < 26 ? letters[i] : String(i + 1));
      const row = pickRow(key, label(it), detail ? detail(it) : null,
                          () => { closeModal(); onPick(it); });
      if (typeahead && i === sel) {
        row.classList.add("on");
        requestAnimationFrame(() => row.scrollIntoView({block: "nearest"}));
      }
      list.append(row);
    });
  }
  const starts = () => filtered.map((it, i) => [i, plain(it)])
    .filter(([, name]) => name.startsWith(buf)).map(([i]) => i);
  function match() {
    const hit = buf ? starts() : [];
    sel = buf ? (hit.length ? hit[0] : sel) : 0;
    draw();
  }
  function cycle(ch) {
    buf = ch;
    const hit = starts();
    if (!hit.length) return;
    sel = hit[(hit.indexOf(sel) + 1) % hit.length];
    draw();
  }
  draw();
  modal({
    title,
    hint: hint || (typeahead ? "type the name · enter switches · esc cancels"
                             : "letter selects · esc cancels"),
    body,
    foot: footer,
    onKey: e => {
      if (document.activeElement === input && e.key.length === 1) return false;
      if (!typeahead) {
        const i = letters.indexOf(e.key);
        if (i >= 0 && i < filtered.length) { closeModal(); onPick(filtered[i]); return true; }
        return false;
      }
      if (e.key === "Enter") {
        if (!filtered[sel]) return false;
        closeModal(); onPick(filtered[sel]); return true;
      }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!filtered.length) return true;
        sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + filtered.length) % filtered.length;
        buf = ""; draw(); return true;
      }
      if (e.key === "Backspace") { buf = buf.slice(0, -1); bufAt = Date.now(); match(); return true; }
      if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return false;
      /* A letter typed again straight away is part of the same word; left for a
         moment it starts a new one. The rule every list box has used for thirty
         years, and the reason pressing p twice cycles the two contexts starting
         with p rather than looking for "pp". */
      const ch = e.key.toLowerCase();
      const stale = Date.now() - bufAt > 1200;
      const again = !stale && buf.length === 1 && buf === ch;
      bufAt = Date.now();
      if (again) { cycle(buf); return true; }
      /* Carrying on the word is the first reading, but if nothing in the list
         starts with what that makes, the letter is taken as the start of a new
         one instead. Otherwise typing w and then changing your mind to p
         leaves you staring at an unchanged list for a second and a bit, with
         no way to know the picker heard you: it is hunting for "wp". */
      const was = buf;
      buf = (stale ? "" : buf) + ch;
      if (!starts().length) buf = ch;
      if (!starts().length && was && !stale) buf = was;   // neither matched: keep the word
      match();
      return true;
    },
  });
  /* The box is not focused. Where the name is the thing you know, the keys
     belong to the list, and the box is there for a word from the middle of a
     name. */
}

function promptInput({title, label, value = "", placeholder = "", multiline = false,
                     cta = "Save", onSave, hint = "", note = null}) {
  const input = multiline
    ? el("textarea", {placeholder})
    : el("input", {placeholder, value});
  if (multiline) input.value = value;
  const save = () => { const v = trim(input.value); closeModal(); if (v) onSave(v); };
  modal({
    center: true, title, hint,
    body: el("div", {},
      note,
      el("div", {class: "field"}, el("label", {}, label), input)),
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
           el("button", {class: "btn primary", onclick: save}, cta)],
    onKey: e => {
      if (e.key === "Enter" && (!multiline || e.ctrlKey || e.metaKey)) { save(); return true; }
      return false;
    },
  });
  setTimeout(() => input.focus(), 30);
}

/* ============================================================
   130_VERB_PICKER
   Port of: init.lua suggest_phys_viz_verb
   ============================================================ */
function seedVerbs() {
  for (const [lang, verbs] of Object.entries(SEED_VERBS)) {
    for (const [canonical, syns] of Object.entries(verbs)) {
      const p = join(DIRS.verbs, lang, canonical + ".md");
      if (V.pages.has(p)) continue;
      putPage(p, {
        props: {title: canonical, type: "verb", lang},
        blocks: [newBlock({title: canonical + " = " + canonical}),
                 ...syns.map(x => newBlock({title: x + " = " + canonical}))],
      });
    }
  }
  scanVerbs();
  notify("Installed " + Object.keys(VERB_CANON).length + " verbs under pages/verbs/.");
}

/* ---------- the verb lexicon, in whichever language you think in ----------
   The Phys-Viz rule is about the first word of the line, so the lexicon has to
   hold the words you actually write. Half the people this is for write their
   tasks in Norwegian, and a lexicon that only knows English would quietly mark
   every one of their lines as verbless. */
const VERB_LANG_NAME = {en: "English", no: "Norsk"};
const verbLang = () => {
  const want = PREF.get("verbLang", "");
  return VERB_LANG_NAME[want] ? want : "en";
};

/* The languages worth offering: the ones the vault has verbs in, plus the two
   we can seed, so an empty vault still shows both tabs. */
function verbLangs() {
  const have = new Set(Object.values(VERB_CANON).map(v => v.lang));
  for (const k of Object.keys(SEED_VERBS)) have.add(k);
  return Array.from(have).sort((a, b) => (a === "en" ? -1 : b === "en" ? 1 : a.localeCompare(b)));
}

/* Teach the lexicon a word. One file, the same shape scanVerbs already reads:
   pages/verbs/<lang>/<word>.md with "word = word" inside it. */
function teachVerb(word, lang) {
  const canonical = trim(word).toLowerCase();
  if (!canonical || /[^\p{L}\p{M}\- ]/u.test(canonical)) return null;
  const path = join(DIRS.verbs, lang, canonical + ".md");
  if (!V.pages.has(path)) {
    putPage(path, {props: {title: canonical, type: "verb", lang},
                   blocks: [newBlock({title: canonical + " = " + canonical})]});
  }
  scanVerbs();
  return path;
}

const capitalise = w => w.charAt(0).toUpperCase() + w.slice(1);

/* The words of the task that could be the action, minus the ones the lexicon
   already knows and the scaffolding that is never a verb. */
function verbCandidatesIn(title) {
  const plain = plainTitle(title || "");
  const seen = new Set();
  const out = [];
  for (const raw of plain.split(/[^\p{L}\p{M}\-]+/u)) {
    const w = trim(raw);
    /* Three letters and up. Teaching "om" or "av" as a verb would make every
       line that happens to start with a preposition pass the check, which is
       worse than leaving the handful of two letter verbs ("be", "se") to the
       add box below. */
    if (w.length < 3) continue;
    const low = w.toLowerCase();
    if (seen.has(low) || VERB_LOOKUP[low]) continue;
    seen.add(low);
    out.push(w);
  }
  return out.slice(0, 8);
}

function openVerbPicker(path, block) {
  const lang = verbLang();
  const all = verbList();
  const mine = all.filter(v => v.lang === lang);

  const useVerb = word => {
    const verb = capitalise(trim(word));
    if (!startsWithVerb(block.title)) block.title = verb + " " + block.title;
    if (!block.state) block.state = "TODO";
    touch(path); render();
  };

  /* Teaching a word that is already the first word clears the flag and rewrites
     nothing, which is the common case: the verb was there all along, the
     lexicon had simply never heard it.

     A word from the middle is taught just the same, but the line still does not
     start with it. Shuffling the word to the front would turn "Kabelen ma
     trekkes gjennom roret" into "Trekkes Kabelen ma gjennom roret", which is
     mechanically correct and not a sentence. Rewriting a line so it still reads
     is a person's job, so this says what is wrong and opens the line for
     editing rather than pretending a regex can write Norwegian. */
  const teachFromTitle = word => {
    if (!teachVerb(word, lang)) { notify("A verb is one word of letters.", "warn"); return; }
    closeModal();
    const starts = plainTitle(block.title).toLowerCase().startsWith(trim(word).toLowerCase());
    touch(path); render();
    if (starts) { notify("\u201C" + word + "\u201D is a verb now, in " + VERB_LANG_NAME[lang] + "."); return; }
    notify("\u201C" + word + "\u201D is a verb now, but this line does not start with it.",
      "warn", {label: "Reword the line", run: () => openTaskDetail(path, block)});
  };

  const body = el("div", {});

  // --- language tabs
  const tabs = el("div", {class: "statefilter"});
  for (const code of verbLangs()) {
    tabs.append(el("button", {class: "chip filter" + (code === lang ? " on" : ""),
      onclick: () => { PREF.set("verbLang", code); closeModal(); openVerbPicker(path, block); }},
      (code === lang ? "\u2713 " : "") + (VERB_LANG_NAME[code] || code)));
  }
  body.append(el("div", {class: "field"}, el("label", {}, "Language"), tabs));

  // --- the words already in the task
  const cands = verbCandidatesIn(block.title);
  if (cands.length) {
    const row = el("div", {class: "statefilter"});
    for (const w of cands)
      row.append(el("button", {class: "chip filter", title: "Teach the lexicon this word",
        onclick: () => teachFromTitle(w)}, w));
    body.append(el("div", {class: "field"},
      el("label", {}, "A word in this task is the action"),
      row,
      el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
        "Press one and the lexicon learns it, so this line and every line like it " +
        "counts from now on. Nothing is rewritten unless you say so.")));
  }

  // --- pick one from the lexicon
  const list = el("div", {style: "max-height:34vh;overflow:auto"});
  const draw = q => {
    list.textContent = "";
    const hits = mine.filter(v => !q || v.canonical.includes(q));
    if (!hits.length) {
      list.append(el("div", {class: "empty"},
        mine.length ? "No matches." : "No verbs in " + (VERB_LANG_NAME[lang] || lang) + " yet."));
      return;
    }
    hits.forEach(v => list.append(pickRow("\u00b7", capitalise(v.canonical),
      (VERB_CANON[v.canonical]?.synonyms || []).filter(x => x !== v.canonical).slice(0, 3).join(", "),
      () => { closeModal(); useVerb(v.canonical); })));
  };
  const filter = el("input", {placeholder: "filter...",
    oninput: e => draw(trim(e.target.value).toLowerCase())});
  draw("");
  body.append(el("div", {class: "field"},
    el("label", {}, "Or start the line with one of these"), filter, list));

  // --- a verb the lexicon has never heard of
  const own = el("input", {placeholder: "a verb a camera could film",
    onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); addOwn(); } }});
  const addOwn = () => {
    const w = trim(own.value);
    if (!w) return;
    if (!teachVerb(w, lang)) { notify("A verb is one word of letters.", "warn"); return; }
    closeModal(); useVerb(w);
  };
  body.append(el("div", {class: "field"},
    el("label", {}, "Add one of your own, in " + (VERB_LANG_NAME[lang] || lang)),
    el("div", {style: "display:flex;gap:8px"}, own,
      el("button", {class: "btn ghost", onclick: addOwn}, "Add"))));

  modal({
    center: true,
    title: "Make it physical and visible",
    hint: "what would a camera see you doing?",
    body,
    foot: [
      el("button", {class: "btn ghost", onclick: closeModal}, "Not now"),
      mine.length ? null
        : el("button", {class: "btn primary", onclick: () => {
            closeModal(); seedVerbs(); openVerbPicker(path, block);
          }}, "Install starter verbs"),
    ].filter(Boolean),
  });
}

/* ---------- moving around the grid without the mouse ----------
   Escape puts the grid into select mode: the arrows walk from node to node and
   Enter centres on the one you land on. It is Escape because that is the key
   you already press to get your hands off the text, and because in select mode
   the arrows are free -- nothing is being typed into.

   Selection is real DOM focus rather than a class of our own, so Enter already
   does the right thing, a screen reader says what is selected, and nothing has
   to be kept in step by hand. Movement is geometric: the nearest node in the
   direction you pressed, measured from the middle of each. That survives the
   phone layout, where the same cells stack into one column, with no second set
   of rules to write or get wrong. */
function aroundNodes(grid) { return [...grid.querySelectorAll(".achip")]; }

/* ---------- the travelling ring ----------
   A selection that teleports makes you find it again on every press. One ring
   that slides from node to node is cheap and tells you where you came from, so
   the arrows read as movement through a place rather than as a cursor jumping
   about. The first placement does not slide, because sliding in from a corner
   you were never at is a lie about where you were. */
function aroundRing(grid) {
  let ring = grid.querySelector(".aring");
  if (!ring) { ring = el("div", {class: "aring"}); grid.append(ring); }
  return ring;
}
function aroundRingTo(grid, node) {
  const ring = aroundRing(grid);
  if (!node) { ring.classList.remove("on"); return; }
  const g = grid.getBoundingClientRect(), r = node.getBoundingClientRect();
  const first = !ring.classList.contains("on");
  if (first) ring.style.transition = "none";
  ring.style.width = r.width + "px";
  ring.style.height = r.height + "px";
  ring.style.transform = "translate(" + (r.left - g.left) + "px," + (r.top - g.top) + "px)";
  ring.classList.add("on");
  if (first) requestAnimationFrame(() => { ring.style.transition = ""; });
}

/* ---------- carrying the old positions over a re-centre ----------
   Centring on a node rebuilds the grid, and a rebuild is a cut: the thing you
   pressed Enter on is suddenly in the middle with no account of how it got
   there. So the positions are measured before the rebuild and every node that
   survives it is put back where it was and then released, which plays as the
   grid rearranging itself around your choice. FLIP, in other words, and the
   whole of the animation: no library, no timers, one transition. */
let AROUND_FLIP = null;
function aroundCapture(grid) {
  if (!grid) return;
  AROUND_FLIP = new Map();
  for (const n of [...aroundNodes(grid), ...grid.querySelectorAll(".aself")]) {
    const k = n.dataset.node;
    if (k) AROUND_FLIP.set(k, n.getBoundingClientRect());
  }
}
function aroundPlay(grid) {
  const was = AROUND_FLIP;
  AROUND_FLIP = null;
  if (!was || !was.size) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  requestAnimationFrame(() => {
    const moved = [];
    for (const n of [...aroundNodes(grid), ...grid.querySelectorAll(".aself")]) {
      const from = was.get(n.dataset.node);
      if (!from) continue;
      const to = n.getBoundingClientRect();
      const dx = from.left - to.left, dy = from.top - to.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      n.style.transition = "none";
      n.style.transform = "translate(" + dx + "px," + dy + "px)";
      moved.push(n);
    }
    if (!moved.length) return;
    requestAnimationFrame(() => {
      for (const n of moved) { n.style.transition = ""; n.style.transform = ""; }
    });
  });
}

function aroundSelect(grid, on = true) {
  if (!grid) return false;
  const nodes = aroundNodes(grid);
  if (!nodes.length) return false;
  if (!on) { grid.classList.remove("picking"); grid.blur(); return true; }
  grid.classList.add("picking");
  // Start beside the thing in the middle rather than at the top left: the
  // nearest node to what you are looking at is the one you probably want.
  const self = grid.querySelector(".a-self");
  const from = self ? self.getBoundingClientRect() : grid.getBoundingClientRect();
  const cx = from.left + from.width / 2, cy = from.top + from.height / 2;
  let best = nodes[0], bestD = Infinity;
  for (const n of nodes) {
    const r = n.getBoundingClientRect();
    const d = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
    if (d < bestD) { bestD = d; best = n; }
  }
  best.focus();
  return true;
}

/* The grid on screen that select mode should act on. */
function aroundOnScreen() {
  const inModal = $("#modalRoot") && $("#modalRoot").querySelector(".around");
  return inModal || $(".around");
}

function aroundNavKeys(grid) {
  grid.addEventListener("keydown", e => {
    const picking = grid.classList.contains("picking");
    if (e.key === "Escape" && picking) {
      /* In a panel, the second Escape closes it, which is what Escape has
         always done there: select mode costs one extra press and takes nothing
         away. On a page there is nothing to close, so Escape just puts the
         arrows back. */
      aroundSelect(grid, false);
      /* The same keypress goes on to the panel, which must not read it as a
         fresh request to start selecting again: one Escape, one meaning. */
      e.aroundLeft = true;
      if (!grid.closest(".modal")) { e.preventDefault(); e.stopPropagation(); }
      return;
    }
    if (!/^Arrow(Up|Down|Left|Right)$/.test(e.key)) return;
    if (!picking) return;
    const here = document.activeElement;
    if (!here || !here.classList.contains("achip")) return;
    const r = here.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const want = e.key.slice(5).toLowerCase();
    let best = null, bestScore = Infinity;
    for (const n of aroundNodes(grid)) {
      if (n === here) continue;
      const q = n.getBoundingClientRect();
      const dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      const along = want === "up" ? -dy : want === "down" ? dy : want === "left" ? -dx : dx;
      if (along <= 1) continue;                       // not that way
      const across = Math.abs(want === "up" || want === "down" ? dx : dy);
      /* A cone, not a half plane. Without it the last node in a row answers
         Right by jumping to a different row, because something is always
         further right if you look far enough up. At the end of a row the end
         of the row is the honest answer. */
      if (across > along) continue;
      const score = along + across * 2.4;
      if (score < bestScore) { bestScore = score; best = n; }
    }
    e.preventDefault(); e.stopPropagation();
    if (best) best.focus();
  });
  grid.addEventListener("focusin", e => {
    if (e.target.classList.contains("achip")) aroundRingTo(grid, e.target);
  });
  grid.addEventListener("focusout", e => {
    if (grid.contains(e.relatedTarget)) return;
    grid.classList.remove("picking");
    aroundRingTo(grid, null);
  });
  /* Whatever you press, the grid is about to be rebuilt around it, so the old
     positions are taken now. */
  grid.addEventListener("click", e => {
    if (e.target.closest(".achip, .aself")) aroundCapture(grid);
  }, true);
}

/* ---------- where this todo sits ----------
   A todo in a list is a line with no surroundings: you cannot see what it
   belongs to, what comes with it, or what hangs off it without leaving and
   coming back. This is the same few facts the file already holds, placed rather
   than listed, so the shape is read in one look:

       tags          project
       (context       parent
        first)        THE TODO        siblings
                    children

   Three columns, four rows, every cell a way in. Nothing here is computed or
   stored: the project is the page the line lives on, the parent and siblings
   and children are the indentation, and the tags are the [[links]] in the
   title. */
/* Every project link above a todo, nearest first, all the way to the top of
   the page. Indentation is inheritance here: a line under a project link
   belongs to that project however deep it sits, and a project link indented
   under another project link is a milestone inside it, which is how a plan with
   stages gets written in a file that has no idea what a stage is:

     - [[1/Rewire the workshop]]
       - [[1/First fix]]
         - TODO Pull the cable
       - [[1/Second fix]]
         - TODO Dress the board

   So the nearest one answers "what is this part of", and the ones above it are
   the plan it is part of. Both are kept, in that order. */
function projectChainOf(page, block) {
  const chain = [], seen = new Set();
  let b = block;
  while (b) {
    for (const raw of linksIn(b.title)) {
      const r = trim(String(raw).split("][")[0]);
      const pfx = (/^([^/]+)\//.exec(r) || [])[1];
      if (!pfx || !STATUS_DIRS[pfx] || seen.has(r.toLowerCase())) continue;
      seen.add(r.toLowerCase());
      chain.push(r);
    }
    b = parentOf(page, b);
  }
  return chain;
}
const projectRefNear = (page, block) => projectChainOf(page, block)[0] || null;

/* Enter on the middle: a new step under the thing you are looking at. It asks
   for words rather than dropping a blank row in, because a nameless line in
   somebody's plan is litter, and because the same box is what every other way
   of adding a todo here uses. */
function addChildTodo(path, block, space) {
  promptInput({
    title: "A step under this one",
    label: linkWords(block.title) || "This todo",
    cta: "Add",
    onSave: text => inSpace(space, () => {
      const kid = stampAuthor(newBlock({state: "TODO", title: text,
                                        props: {Added: "[[" + todayISO() + "]]"}}));
      createLinkedPages(kid.title);
      (block.children || (block.children = [])).push(kid);
      touch(path); noteTodoTouched();
      render();
      openTaskDetail(path, kid, space);
    }),
  });
}

function surroundingsGrid(path, block, space) {
  const page = getPage(path);
  const grid = el("div", {class: "around", tabindex: "-1"});
  aroundNavKeys(grid);
  aroundPlay(grid);
  const cell = (where, label, kids) => {
    const box = el("div", {class: "acell " + where}, el("span", {class: "alab"}, label));
    for (const k of [].concat(kids)) if (k) box.append(k);
    return box;
  };
  const chip = (text, title, onclick, cls, key) =>
    el("button", {class: "achip " + (cls || ""), title: title || text, onclick,
                  data: key ? {node: key} : {}}, text);
  const toTask = b => () => { closeModal(); openTaskDetail(path, b, space); };
  /* The links are read out, not taken out. They have a column of their own, but
     a todo is often mostly links, and the words left over once you remove them
     are frequently not a sentence anybody could identify. The brackets go; the
     words stay. */
  const words = s => linkWords(s) || "(untitled)";
  const quiet = text => el("span", {class: "anone"}, text);

  /* The project is whichever the line says it is. A link to a project on the
     todo itself wins, then one on the line above it, then the line above that:
     writing

       - [[1/Rewire the workshop]]
         - TODO Pull the cable

     in today's page is how most of them get captured, and the project is the
     point of writing it that way. Only when no line says otherwise does the
     page the todo lives on answer, which for a journal capture is the day. */
  const kind = pageKind(path);
  const chain = page ? projectChainOf(page, block) : [];
  const near = chain[0] || null;
  if (near) {
    /* Outermost first, so the column reads downward the way the plan nests:
       the project, its milestone, the line above this one, this one. */
    grid.append(cell("a-project", chain.length > 1 ? "Project and milestone" : "Project",
      chain.slice().reverse().map((ref, i, all) => {
        const to = findExistingPage(ref);
        return chip(ref.replace(/^[^/]+\//, ""), ref,
          () => { closeModal(); if (to) openPageIn(space, to); else inSpace(space, () => followLink(ref)); },
          i === all.length - 1 ? "" : "up", "p:" + ref);
      })));
  } else {
    grid.append(cell("a-project", kind === "project" ? "Project" : LINK_KIND_WORD[kind] || "Page",
      chip(pageTitle(path), path, () => { closeModal(); openPageIn(space, path); },
        "", "p:" + path)));
  }

  /* The line above, unless the line above is nothing but the project link that
     already answered the cell above it. A heading written only to hang todos
     under is scaffolding, not a parent, and printing it twice says nothing the
     first printing did not. */
  let par = page ? parentOf(page, block) : null;
  const scaffold = b => {
    if (!b || !chain.length) return false;
    let left = linkWords(b.title);
    for (const ref of chain) left = left.replace(ref.replace(/^[^/]+\//, ""), "");
    return !trim(left);
  };
  while (scaffold(par)) par = parentOf(page, par);
  grid.append(cell("a-parent", "Parent",
    par ? chip(words(par.title), par.title, toTask(par), "", "b:" + par.id)
        : quiet("none, it sits at the top")));

  /* The middle is a node like any other, so the arrows can land on it, and
     Enter there is the one thing the grid cannot do by moving: make something
     new under what you are looking at. Two presses, two meanings, and neither
     is a key to remember separately. Enter on a node you have walked to centres
     it; Enter on the one already in the middle grows it. */
  grid.append(cell("a-self", "This todo",
    el("button", {class: "achip aself", data: {node: "b:" + block.id},
      title: "Enter adds a step under this one",
      onclick: () => addChildTodo(path, block, space)},
      (block.state ? block.state + " " : "") + words(block.title))));

  /* The tags are the links in the title, and the context goes first because it
     is the one that decides whether you can do the thing where you are. */
  const refs = linksIn(block.title).map(r => trim(r.split("][")[0]))
    .filter(r => r && !/^\d{4}-\d{2}-\d{2}$/.test(r) && !/^go\//i.test(r))
    // the projects have a cell of their own; they are not also tags
    .filter(r => !chain.includes(r));
  const ctx = refs.filter(r => /^c\//i.test(r));
  const rest = refs.filter(r => !/^c\//i.test(r));
  const tagBox = [];
  for (const r of ctx.concat(rest))
    tagBox.push(chip(/^c\//i.test(r) ? "@" + r.slice(2) : r, r,
      () => { closeModal(); inSpace(space, () => followLink(r)); },
      /^c\//i.test(r) ? "ctx" : "", "p:" + r));
  if (!ctx.length) tagBox.unshift(chip("add context", "A todo with no context cannot be filtered to where you are",
    () => { closeModal(); promptAndInsertContext(path, block); }, "want"));
  grid.append(cell("a-tags", "Tags", tagBox));

  const sibs = (page ? siblingsOf(page, block) : []).filter(b => b !== block && !isMessage(b));
  grid.append(cell("a-sibs", "Siblings" + (sibs.length > 6 ? " · " + sibs.length : ""),
    sibs.length ? sibs.slice(0, 6).map(b => chip(words(b.title), b.title, toTask(b),
                    OPEN_STATES[b.state] ? "" : "done", "b:" + b.id))
                : quiet("nothing beside it")));

  const kids = (block.children || []).filter(b => !isMessage(b));
  grid.append(cell("a-kids", "Children",
    kids.length ? kids.map(b => chip(words(b.title), b.title, toTask(b),
                    OPEN_STATES[b.state] ? "" : "done", "b:" + b.id))
                : quiet("nothing under it")));
  return grid;
}


/* ---------- where a project sits ----------
   The same grid one storey up. A project has the same surroundings a todo has,
   they are just called different things: the area it serves instead of the page
   it lives on, its status instead of its parent line, its own todos instead of
   its children, the other projects on the same shelf instead of its siblings.
   Same three columns, same four rows, same keys, so there is one thing to learn
   and not two. */
function projectGrid(path) {
  const grid = el("div", {class: "around", tabindex: "-1"});
  aroundNavKeys(grid);
  aroundPlay(grid);
  const page = getPage(path);
  const cell = (where, label, kids) => {
    const box = el("div", {class: "acell " + where}, el("span", {class: "alab"}, label));
    for (const k of [].concat(kids)) if (k) box.append(k);
    return box;
  };
  const chip = (text, title, onclick, cls, key) =>
    el("button", {class: "achip " + (cls || ""), title: title || text, onclick,
                  data: key ? {node: key} : {}}, text);
  const quiet = text => el("span", {class: "anone"}, text);

  const area = areaOfProject(path);
  grid.append(cell("a-project", "Area",
    area ? chip(area, "a/" + area, () => followLink("a/" + area), "", "p:a/" + area)
         : chip("no area", "A project nothing serves is a project nobody misses",
             () => openAreaPicker(path), "want")));

  const code = statusDirOf(path);
  grid.append(cell("a-parent", "Status",
    chip(trim(String(STATUS_TEXT[code] || "no status").replace(/^[-0-9]\s*=\s*/, "")),
      "Move it to another shelf",
      () => openStatusPicker(path))));

  /* Same bargain as a todo: Enter on the middle makes the next step in it. */
  grid.append(cell("a-self", "This project",
    el("button", {class: "achip aself", data: {node: "p:" + path},
      title: "Enter adds the next action",
      onclick: () => openAddNextAction(path)}, pageTitle(path))));

  /* The tags of a project are the links on its page that are not other
     projects or days: the context it is done in, the people in it, the orgs.
     Context first, same as a todo. */
  const refs = [];
  if (page) walkBlocks(page.blocks, b => {
    if (isMessage(b)) return;
    for (const raw of linksIn([b.title, ...(b.body || [])].join("\n"))) {
      const r = trim(raw.split("][")[0]);
      if (!/^[cpoz]\//i.test(r) || refs.includes(r)) continue;
      refs.push(r);
    }
  });
  const ctx = refs.filter(r => /^c\//i.test(r)), rest = refs.filter(r => !/^c\//i.test(r));
  const tags = ctx.concat(rest).slice(0, 12)
    .map(r => chip(/^c\//i.test(r) ? "@" + r.slice(2) : r, r, () => followLink(r),
      /^c\//i.test(r) ? "ctx" : "", "p:" + r));
  grid.append(cell("a-tags", "Tags", tags.length ? tags : quiet("nothing linked yet")));

  const sibs = (area ? projectsInArea(area) : projectsIn(code))
    .filter(p => p !== path);
  grid.append(cell("a-sibs", "Beside it" + (sibs.length > 6 ? " · " + sibs.length : ""),
    sibs.length ? sibs.slice(0, 6).map(p => chip(pageTitle(p), p, () => openPage(p), "", "p:" + p))
                : quiet(area ? "the only project in this area" : "nothing else on this shelf")));

  const todos = page ? flattenBlocks(page.blocks).filter(b => b.state && !isMessage(b)) : [];
  const open = todos.filter(b => OPEN_STATES[b.state]);
  const shown = (open.length ? open : todos).slice(0, 8);
  grid.append(cell("a-kids", "Todos" + (open.length > 8 ? " · " + open.length + " open" : ""),
    shown.length ? shown.map(b => chip(linkWords(b.title) || "(untitled)",
                      b.title, () => openTaskDetail(path, b),
                      OPEN_STATES[b.state] ? "" : "done", "b:" + b.id))
                 : quiet("no steps yet")));
  return grid;
}

function openTaskDetail(path, block, space) {
  state.selected = block.id;
  const a = {
    path, block, state: block.state, title: block.title,
    context: contextOf(block.title), due: dueDate(block),
    age: blockAge(block), added: addedDate(block),
  };
  const titleInput = el("textarea", {}); titleInput.value = block.title;
  const notes = el("textarea", {placeholder: "Notes"}); notes.value = (block.body || []).join("\n");
  const sched = el("input", {type: "date", value: dateIn(blockProp(block, "SCHEDULED")) || ""});
  const dead  = el("input", {type: "date", value: dateIn(blockProp(block, "DEADLINE")) || ""});

  // Picking a state leaves the panel open: moving TODO -> DOING -> WAIT used to
  // cost one trip through the panel per step, because the first pick closed it.
  // The last entry is the way back out: stop being a task, keep the words.
  const seg = el("div", {class: "seg"});
  const stateBtns = [];
  for (const st of [...TODO_STATES, null]) {
    const btn = el("button", {
      title: st ? null : "Keep the text as a plain note",
      onclick: () => {
        if ((block.state ?? null) === st) return;
        setBlockState(path, block, st);
        syncPanel();                 // the panel outlives the redraw; its badges must keep up
      },
    }, st || "Not a task");
    stateBtns.push([st, btn]);
    seg.append(btn);
  }

  // The trail is the one part of the panel a state change rewrites, so it is
  // built as a function rather than once.
  const trail = el("div", {style: "color:var(--fg2);font-size:12.5px;line-height:1.8"});
  const fillTrail = () => {
    trail.textContent = "";
    const age = blockAge(block);
    trail.append((blockProp(block, "by") ? "Added by " + blockProp(block, "by") : "Added") +
      (addedDate(block) ? " on " + addedDate(block) : "") +
      (age != null ? " \u00B7 " + age + " days ago" : ""));
    const raw = blockProp(block, "done_by");
    if (raw) {
      const {who, iso} = splitStamp(raw);
      trail.append(el("div", {}, "Closed by " + (who || "someone") + (iso ? " \u00B7 " + formatStamp(iso) : "")));
    }
  };
  const syncPanel = () => {
    for (const [st, btn] of stateBtns) btn.className = (block.state ?? null) === st ? "on" : "";
    fillTrail();
  };
  syncPanel();

  const save = () => {
    const val = trim(titleInput.value).replace(/\n/g, " ");
    const [st, rest] = splitState(val);
    if (st) { block.state = st; block.title = rest; } else { block.title = val; }
    createLinkedPages(block.title);
    block.body = notes.value.split("\n");
    while (block.body.length && !trim(block.body[block.body.length - 1])) block.body.pop();
    if (sched.value) setBlockProp(block, "SCHEDULED", "[[" + sched.value + "]]");
    else if (blockProp(block, "SCHEDULED")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "scheduled")];
    if (dead.value) setBlockProp(block, "DEADLINE", "[[" + dead.value + "]]");
    else if (blockProp(block, "DEADLINE")) delete block.props[Object.keys(block.props).find(k => k.toLowerCase() === "deadline")];
    touch(path); noteTodoTouched(); closeModal(); render();
  };

  modal({
    title: "Action", hint: a.age != null ? "on your list " + a.age + " days" : "",
    body: el("div", {},
      el("div", {class: "field"},
        el("label", {}, "Where it sits"),
        surroundingsGrid(path, block, space),
        el("div", {class: "ahint"}, "esc walks it with the arrows, enter centres; enter on the middle adds a step under it")),
      el("div", {class: "field"}, el("label", {}, "Title"), titleInput),
      el("div", {class: "field"}, el("label", {}, "State"), seg),
      el("div", {class: "field"},
        el("label", {}, "Who is doing it"),
        (() => {
          const row = el("div", {class: "seg"});
          const current = assigneeOf(block);
          const choices = [["", "Me"]].concat(
            members().filter(m => !m.me).map(m => [m.name, m.name]));
          for (const [val, label] of choices) {
            const on = val ? samePerson(val, current) : !current;
            row.append(el("button", {class: on ? "on" : "", onclick: () => {
              closeModal(); assignBlock(path, block, val);
            }}, label));
          }
          row.append(el("button", {onclick: () => {
            closeModal(); openAssignOther(path, block);
          }}, current && !isMember(current) ? current : "someone else\u2026"));
          return row;
        })(),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Somebody in this space gets it as their task, and you get it in your " +
          "Waiting for. Anybody else is only a waiting-for - they cannot see this.")),
      el("div", {class: "field"},
        el("label", {}, "Chat" + (messagesOf(block).length ? " \u00B7 " + messagesOf(block).length : "")),
        threadPanel(path, block),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "Everyone in this space sees it, with who said it and when. Flag one with " +
          "\u2691 to come back to it - that carries your name, so it follows you between " +
          "devices. Read is per device and stays out of the files.")),
      el("div", {class: "field"}, el("label", {}, "GTD hygiene"), el("div", {class: "seg"},
        el("button", {onclick: () => { closeModal(); promptAndInsertContext(path, block); }},
          a.context ? "@" + a.context : "add context"),
        el("button", {onclick: () => { closeModal(); openVerbPicker(path, block); }},
          startsWithVerb(block.title) ? "verb ok" : "add physical verb"),
        el("button", {onclick: () => { closeModal(); openRefile(path, block); }}, "refile"),
      )),
      el("div", {class: "grid2"},
        el("div", {class: "field"}, el("label", {}, "Scheduled"), sched),
        el("div", {class: "field"}, el("label", {}, "Deadline"), dead)),
      el("div", {class: "field"},
        el("label", {}, "Repeats"),
        (() => {
          const row = el("div", {class: "seg"});
          const cur = repeatOf(block);
          for (const choice of REPEAT_CHOICES) {
            const on = trim(cur).toLowerCase() === choice;
            row.append(el("button", {class: on ? "on" : "", onclick: () => {
              if (choice) setBlockProp(block, REPEAT_PROP, choice);
              else for (const k of Object.keys(block.props)) if (k.toLowerCase() === REPEAT_PROP) delete block.props[k];
              touch(path);
              closeModal(); render();
              notify(choice ? "Repeats " + choice + ". You will be asked when you tick it off."
                            : "No longer repeats.");
            }}, choice || "never"));
          }
          return row;
        })(),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          repeatOf(block)
            ? "Nothing is created until you tick this one off, and you are asked first. " +
              "Skip a " + repeatOf(block).replace(/ly$/, "") + " and it stays skipped."
            : "Any of these, or write your own in the file - repeat:: every 2 weeks, " +
              "repeat:: every monday.")),
      el("div", {class: "field"},
        el("label", {}, "Calendar"),
        el("div", {style: "display:flex;gap:8px;flex-wrap:wrap"},
          el("button", {class: "btn ghost sm", onclick: () => {
            const when = trim(sched.value) || trim(dead.value) || dueDate(block);
            if (!when) { notify("Give it a date first.", "warn"); return; }
            addToCalendar([Object.assign({}, a, {due: when, title: block.title, block})]);
          }}, "Add to calendar"),
          el("button", {class: "btn ghost sm", onclick: () => {
            const when = trim(sched.value) || trim(dead.value) || dueDate(block);
            if (!when) { notify("Give it a date first.", "warn"); return; }
            openCalendarPicker([Object.assign({}, a, {due: when, title: block.title, block})]);
          }}, "Choose where")),
        el("div", {style: "color:var(--fg3);font-size:12px;margin-top:6px"},
          "The file route sends nothing anywhere. A link opens your calendar with the " +
          "title and date in the web address.")),
      el("div", {class: "field"}, el("label", {}, "Notes"), notes),
      el("div", {class: "field"}, el("label", {}, "Trail"), trail),
      el("div", {class: "field"}, el("label", {}, "Source"),
        el("div", {style: "display:flex;gap:8px;flex-wrap:wrap;align-items:center"},
          el("button", {class: "btn ghost sm", onclick: () => { closeModal(); openPage(path); }}, path),
          el("button", {class: "btn ghost sm", title: "A link you can paste into chat or email",
            onclick: () => copyLinkTo(deepLink(path, block), "this task")}, "\u{1F517} Copy link")))),
    foot: [
      el("button", {class: "btn ghost", onclick: () => {
        closeModal();
        deleteBlockWithUndo(path, block, "Deleted \u201C" + titleForRow(block.title) + "\u201D");
      }}, "Delete"),
      el("div", {style: "flex:1"}),
      el("button", {class: "btn ghost", onclick: closeModal}, "Cancel"),
      el("button", {class: "btn primary", onclick: save}, "Save"),
    ],
    onKey: e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); return true; }
      /* Escape hands the panel over to the grid rather than closing it. Once
         the grid has it, the grid's own Escape hands it back, and the one after
         that closes the panel as it always did, so nothing is taken away. */
      if (e.key === "Escape" && !e.aroundLeft) {
        const grid = $("#modalRoot") && $("#modalRoot").querySelector(".around");
        if (grid && !grid.classList.contains("picking")) return aroundSelect(grid);
      }
      return false;
    },
  });
}

function openStatusPicker(path) {
  const codes = STATUS_ORDER;
  listPicker({
    title: "Project status: " + pageTitle(path),
    hint: "moves the file into pages/<code>/",
    items: codes,
    label: c => STATUS_TEXT[c],
    detail: c => statusDirOf(path) === c ? "current" : "",
    onPick: c => setProjectStatus(path, c),
  });
}

function newProjectPrompt(then) {
  promptInput({
    title: "New project", label: "Project name", cta: "Next",
    onSave: name => {
      if (ROUTINE_WORDS.test(name)) routineFork(name, then);
      else createProjectFlow(name, then);
    },
  });
}

/* Asked once, in passing, and never overridden: if somebody says it really is a
   project, it is a project. A guess that insists is worse than no guess. */
function routineFork(name, then) {
  const asRoutine = () => {
    closeModal();
    const path = createChecklist(name, "routine", cadenceFrom(name));
    PREF.set("madeRoutine", "1");
    notify("Routine created: " + pageTitle(path) + ". Run it whenever it comes round.");
    openPage(path);
  };
  const asProject = () => { closeModal(); createProjectFlow(name, then); };
  modal({
    center: true, title: "That sounds like a routine", hint: "r / p",
    body: el("div", {},
      el("div", {class: "field"},
        el("div", {style: "color:var(--fg2);font-size:13.5px;line-height:1.55"},
          "A project has a finish line - something you tick off once and never think " +
          "about again. This one reads like something that comes back instead, and those " +
          "live as routines under Routines & lists, so your project list stays a list of " +
          "things that can actually end.")),
      pickRow("r", "Make it a routine", "comes back - run it when it is due", asRoutine),
      pickRow("p", "Keep it a project", "it really does finish", asProject)),
    onKey: e => {
      if (e.key === "r") { asRoutine(); return true; }
      if (e.key === "p") { asProject(); return true; }
      return false;
    },
  });
}

function createProjectFlow(name, then) {
  const p = createProjectPage(name);
  // A project without a finish line is a wish. Ask straight away.
  promptInput({
    title: "What does done look like?",
    hint: pageTitle(p),
    label: 'State it as if it already happened - "Sink repaired, no drip"',
    value: "", cta: "Create project",
    onSave: outcome => {
      if (trim(outcome)) setOutcome(p, outcome);
      notify("Project created: " + pageTitle(p));
      if (then) then(p); else openPage(p);
      render();
      // A project with an outcome but no next action is still stalled.
      setTimeout(() => openAddNextAction(p), 120);
    },
  });
}
function newZettelPrompt() {
  promptInput({
    title: "New zettel", label: "Note title", cta: "Create",
    onSave: t => { const p = createZettel(t); notify("Zettel: " + pageTitle(p)); openPage(p); },
  });
}
function openAddNextAction(path) {
  promptInput({
    title: "Next action",
    hint: pageTitle(path),
    note: projectProvenance(path),
    label: "What is the very next physical action?",
    value: "Call ", cta: "Add",
    onSave: text => {
      const blk = addNextActionTo(path, text);
      render();
      if (!startsWithVerb(text)) { openVerbPicker(path, blk); return; }
      if (!hasContextLink(text)) promptAndInsertContext(path, blk);
    },
  });
}

/* When the last open action in an active/waiting project closes. */
function checkProjectCompletion(path) {
  const code = statusDirOf(path);
  if (code !== "1" && code !== "3") return;
  const page = getPage(path); if (!page) return;
  if (flattenBlocks(page.blocks).some(b => OPEN_STATES[b.state])) return;
  projectCompletionPrompt(path);
}

function projectCompletionPrompt(path) {
  const body = el("div", {},
    el("div", {class: "field"}, el("label", {}, "All actions are closed"),
      el("div", {style: "color:var(--fg2);font-size:13.5px"},
        "A project with no next action is invisible work. Decide now:")),
    pickRow("n", "Add a new next action", "keep it active", () => { closeModal(); openAddNextAction(path); }),
    pickRow("d", "Move to 0, completed", "it is done", () => { closeModal(); setProjectStatus(path, "0"); }),
    pickRow("s", "Move to 2, someday/maybe", "not now", () => { closeModal(); setProjectStatus(path, "2"); }),
    pickRow("c", "Move to -, cancelled", "never", () => { closeModal(); setProjectStatus(path, "-"); }));
  modal({
    center: true, title: "Project complete: " + pageTitle(path), hint: "n / d / s / c",
    body,
    onKey: e => {
      const map = {n: () => openAddNextAction(path), d: () => setProjectStatus(path, "0"),
                   s: () => setProjectStatus(path, "2"), c: () => setProjectStatus(path, "-")};
      if (map[e.key]) { closeModal(); map[e.key](); return true; }
      return false;
    },
  });
}

function renamePrompt(path) {
  promptInput({
    title: "Rename page", label: "New name", value: pageTitle(path), cta: "Rename",
    onSave: name => {
      if (isJournalPath(path)) { notify("Journals are date-keyed and cannot be renamed.", "warn"); return; }
      const page = getPage(path);
      page.props.title = name;
      const newPath = join(path.split("/").slice(0, -1).join("/"), slugify(name) + ".md");
      if (moveFile(path, newPath)) { state.pagePath = newPath; render(); }
    },
  });
}
function movePrompt(path) {
  const targets = [
    {label: "Contexts (c/)",        dir: DIRS.contexts},
    {label: "Zettel (z/)",          dir: DIRS.zettel},
    {label: "People (p/)",          dir: DIRS.people},
    {label: "Orgs (o/)",            dir: DIRS.orgs},
    {label: "Pages root",           dir: DIRS.pages},
    {label: "Active project (1/)",  dir: DIRS.active},
  ];
  listPicker({
    title: "Move page", items: targets, label: t => t.label,

      const newPath = join(t.dir, baseName(path) + ".md");

function deletePrompt(path) {
  promptInput({
    title: "Delete " + pageTitle(path), label: 'Type YES to confirm', cta: "Delete",
    onSave: ans => {
      if (ans !== "YES") { notify("Delete cancelled"); return; }
      deletePageWithUndo(path);
      go("today");
    },
  });
}

/* ============================================================
   145_WEEDING + REVIEW dashboards
   Port of: init.lua 92_MORNING_ROUTINE + weekly_review_dashboard
   ============================================================ */
function openWeeding(next) {
  const stalest = stalestActiveProjects(CFG.weedCount);
  const body = el("div", {});
  if (!weedingWorthIt()) {
    body.append(el("div", {class: "field"},
      el("div", {style: "color:var(--fg2);font-size:13px"},
        `Weeding ranks the stalest of many projects. With ${projectsIn("1").length} active ` +
        `and ${leafActions().filter(a => OPEN_STATES[a.state]).length} open tasks there is little to rank, ` +
        `so GroupTodo will not bring this up by itself until there are ` +
        `${CFG.weedMinProjects} projects and ${CFG.weedMinTodos} tasks.`)));
  }
  if (!stalest.length) body.append(el("div", {class: "empty"}, "No active projects. Create one, or capture into today."));
  stalest.forEach((p, i) => {
    const sec = el("div", {class: "dash-sec"});
    const flags = [];
    if (!p.anyTodo)  flags.push("no next action");
    if (!outcomeOf(p.path)) flags.push("no outcome");
    if (p.noContext) flags.push("no context");
    if (p.noVerb)    flags.push("no verb");
    sec.append(el("h4", {},
      el("span", {}, (i + 1) + ". " + p.title),
      p.ageDays != null ? el("span", {class: "n"}, p.ageDays + "d old") : null,
      p.idleDays != null ? el("span", {class: "n"}, "idle " + p.idleDays + "d") : null,
      ...flags.map(f => el("span", {class: "chip miss"}, f))));
    if (p.ageDays != null && p.ageDays > CFG.staleProjectDays) {
      sec.append(el("div", {class: "dash-item", style: "color:var(--warn)"},
        el("span", {}, "Older than 6 months. Still real? Park it in 2/ or kill it in _/."),
        el("button", {class: "fix", onclick: () => openStatusPicker(p.path)}, "change status")));
    }
    for (const t of p.todos) {
      sec.append(el("button", {class: "dash-item", onclick: () => { closeModal(); openTaskDetail(p.path, t.block); }},
        stateChip(t.state), el("span", {html: renderInline(t.title)}),
        t.missingContext ? el("span", {class: "chip miss"}, "ctx") : null,
        t.missingVerb ? el("span", {class: "chip miss"}, "verb") : null));
    }
    sec.append(el("div", {style: "display:flex;gap:6px;padding:6px 16px 10px;flex-wrap:wrap"},
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openPage(p.path); }}, "open"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openAddNextAction(p.path); }}, "+ next action"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openOutcomePrompt(p.path); }}, "outcome"),
      el("button", {class: "btn sm ghost", onclick: () => { closeModal(); openStatusPicker(p.path); }}, "status"),
      el("button", {class: "btn sm ghost", onclick: () => { updateReviewed(p.path); closeModal(); openWeeding(next); }}, "mark reviewed")));
    body.append(sec);
  });
  modal({
    title: "Morning weeding", hint: "5 minutes · w continues",
    body,
    foot: [el("button", {class: "btn ghost", onclick: closeModal}, "Skip"),
           el("button", {class: "btn primary", onclick: () => { closeModal(); (next || (() => openContextPicker("Where are you now?", surfaceContext)))(); }}, "Continue → context")],
    onKey: e => { if (e.key === "w") { closeModal(); (next || (() => openContextPicker("Where are you now?", surfaceContext)))(); return true; } return false; },
  });
}

function reviewSections() {
  const acts = leafActions();
  return [
    {title: "Stuck active projects", hint: "no next action - define one or park it",
     items: stuckActiveProjects().map(s => ({text: pageTitle(s.path), sub: s.reason, path: s.path,
       fix: "+ next action", act: () => { closeModal(); openAddNextAction(s.path); }}))},
    {title: "Projects not stated as an outcome", hint: "what would done look like?",
     items: projectsWithoutOutcome().map(p => ({text: pageTitle(p), sub: "no outcome:: yet", path: p,
       fix: "state outcome", act: () => { closeModal(); openOutcomePrompt(p, () => openReview(1)); }}))},
    {title: "Journal actions without a project", hint: "refile or let them go",
     items: acts.filter(a => a.group === "JOURNAL").map(a => ({text: a.title, sub: a.path, path: a.path, block: a.block,
       fix: "refile", act: () => { closeModal(); openRefile(a.path, a.block); }}))},
    {title: "Actions without a physical verb", hint: "what would a camera see?",
     items: acts.filter(a => a.state === "TODO" && a.missingVerb).map(a => ({text: a.title, sub: a.path, path: a.path, block: a.block,
       fix: "add verb", act: () => { closeModal(); openVerbPicker(a.path, a.block); }}))},
    {title: "Actions without a context", hint: "where can this be done?",
     items: acts.filter(a => a.state === "TODO" && a.missingContext).map(a => ({text: a.title, sub: a.path, path: a.path, block: a.block,
       fix: "add context", act: () => { closeModal(); promptAndInsertContext(a.path, a.block); }}))},
    {title: "Active projects not reviewed lately", hint: "touch them or move them",
     items: projectsIn("1").map(p => {
        const r = dateIn(getPage(p).props?.reviewed);
        const d = r ? dateDiffDays(r, todayISO()) : null;
        return {p, d, r};
      }).filter(x => x.d == null || x.d >= CFG.reviewEveryDays)
        .sort((a, b) => (b.d ?? 9999) - (a.d ?? 9999))
        .map(x => ({text: pageTitle(x.p), sub: x.r ? "reviewed " + x.d + "d ago" : "never reviewed", path: x.p,
          fix: "mark reviewed", act: () => { updateReviewed(x.p); openReview(4); }}))},
    {title: "Waiting for", hint: "chase anything older than " + CFG.waitFollowUpDays + " days",
     items: acts.filter(a => a.state === "WAIT").map(a => ({text: a.title, sub: (a.age != null ? a.age + "d" : "") + " · " + a.path,
       path: a.path, block: a.block, fix: "open", act: () => { closeModal(); openTaskDetail(a.path, a.block); }}))},
    {title: "Someday / maybe", hint: "anything ready to become active?",
     items: projectsIn("2").map(p => ({text: pageTitle(p), sub: openTodoCount(p) + " actions", path: p,
       fix: "activate", act: () => { setProjectStatus(p, "1"); openReview(6); }}))},
  ];
}

function openReview(focusIdx = 0) {
  tourMarkSeen("review");
  const secs = reviewSections();
  const body = el("div", {});
  /* A review is a list of what needs doing, and a heading with nothing under it
     needs nothing done. The clear ones are counted in one line at the top
     instead -- you still get the credit for them, without eight headings of it
     between you and the two that are actually asking for something. */
  const clear = secs.filter(s => !s.items.length);

/* ============================================================
   149_EXPORT_ONE_PROJECT
   Handing a single project to somebody, without handing them the space it
   lives in. The file is a copy, not a permission: once sent they have it
   for good. What it must never do is quietly carry more than you chose,
   so the dialog lists every page going out before it writes anything.
   ============================================================ */

/* Pages to include. Journals are never pulled in, even when referenced:
   a day's page is mixed content and would leak everything else in it. */
function collectExport(rootPath, {includeRefs = false} = {}) {
  const out = [rootPath];
  if (!includeRefs) return out;
  const page = getPage(rootPath);
  if (!page) return out;

  const texts = Object.values(page.props || {}).map(String);
  walkBlocks(page.blocks, b => {
    texts.push(b.title);
    (b.body || []).forEach(l => texts.push(l));
    for (const v of Object.values(b.props || {})) texts.push(String(v));
  });

  for (const text of texts) {
    for (const target of linksIn(text)) {
      const t = trim(target.split("][")[0]);
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) continue;          // a date link is a journal
      const p = findExistingPage(t);
      if (p && !isJournalPath(p) && !out.includes(p)) out.push(p);
    }
  }
  return out;
}

/* A copy with every trace of who did what removed. */
function stripAttributionFrom(page) {
  const props = Object.assign({}, page.props || {});
  delete props.updated_by;
  const copy = blocks => (blocks || []).map(b => {
    const bp = Object.assign({}, b.props || {});
    delete bp.by;
    delete bp.done_by;
    return newBlock({
      state: b.state, title: b.title, props: bp,
      body: (b.body || []).slice(), children: copy(b.children),
    });
  });
  return {props, blocks: copy(page.blocks)};
}

function exportMarkdown(paths, {strip = false, fenced = true} = {}) {
  const out = [];
  if (fenced) {
    out.push("<!-- GroupTodo export. Open it with Vault & sync → Open vault file. -->",
             "<!-- gtd:bundle v1 " + nowStamp() + " -->", "");
  }
  for (const path of paths) {
    const page = strip ? stripAttributionFrom(getPage(path)) : getPage(path);
    const text = serializePage(page).replace(/\n$/, "");
    if (fenced) out.push("<!-- gtd:file " + path + " -->", text, "<!-- gtd:endfile -->", "");
    else out.push("## " + pageTitle(path), "", text, "");
  }
  return out.join("\n");
}
