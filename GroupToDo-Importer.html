<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Same promise as grouptodo.html: nothing is loaded from anywhere and
     nothing is sent anywhere. The importer reads one folder and writes
     another, both on this computer. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  img-src data: blob:;
  form-action 'none';
  base-uri 'none'">
<title>GroupToDo Importer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236aa3ff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%2306101f' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f6f3; --bg2:#ffffff; --bg3:#f0efea; --bg4:#e6e5df;
  --fg:#1d1d1b; --fg2:#4d4d48; --fg3:#6b6b66;
  --border:#e4e3de; --border2:#d3d2cc;
  --accent:#2f6fde; --accent2:#2559b8; --accent-fg:#ffffff; --accent-soft:#e7effc;
  --ok:#2e8a57; --warn:#a8710f; --danger:#c4402f;
  --late-soft:#fbeae7; --wait-soft:#fbf1dc; --ok-soft:#e3f3ea;
  --radius:12px; --radius-sm:8px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --bg2:#1f1f1d; --bg3:#272725; --bg4:#31312e;
    --fg:#ecebe6; --fg2:#c3c2bc; --fg3:#9a9993;
    --border:#33332f; --border2:#45453f;
    --accent:#6c9cf0; --accent2:#8bb0f4; --accent-fg:#0d1626; --accent-soft:#1f2b40;
    --ok:#5fc08a; --warn:#e0aa45; --danger:#ec7a68;
    --late-soft:#3a201c; --wait-soft:#3a2f18; --ok-soft:#1b3326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161615; --bg2:#1f1f1d; --bg3:#272725; --bg4:#31312e;
  --fg:#ecebe6; --fg2:#c3c2bc; --fg3:#9a9993;
  --border:#33332f; --border2:#45453f;
  --accent:#6c9cf0; --accent2:#8bb0f4; --accent-fg:#0d1626; --accent-soft:#1f2b40;
  --ok:#5fc08a; --warn:#e0aa45; --danger:#ec7a68;
  --late-soft:#3a201c; --wait-soft:#3a2f18; --ok-soft:#1b3326;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--fg2);margin:0 0 24px}
.step{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px}
.step.off{opacity:.55;pointer-events:none}
.step h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.step h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;flex:none}
.step .hint{color:var(--fg3);font-size:13.5px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-size:14px;border:1px solid var(--border2);background:var(--bg2);color:var(--fg);
  border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--bg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
label.field{display:block;margin:0 0 12px}
label.field span{display:block;font-size:13px;color:var(--fg2);margin-bottom:4px}
input[type=text],select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);
  border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;max-width:100%}
input[type=text]{width:320px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:0 0 8px}
.check input{margin-top:4px}
.found{font-size:14px;color:var(--fg2);margin-top:10px}
.found b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;
  padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg2);width:60px}
td .ex{display:block;font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.tablewrap{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
.card{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.card b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.card span{font-size:12.5px;color:var(--fg2)}
.issues{list-style:none;margin:0 0 14px;padding:0}
.issues li{padding:8px 12px;border-radius:var(--radius-sm);margin:0 0 6px;font-size:14px;background:var(--wait-soft)}
.issues li.ok{background:var(--ok-soft)}
.issues li details{margin-top:4px}
.issues li summary{cursor:pointer;color:var(--fg2);font-size:13px}
.issues li pre{white-space:pre-wrap;font:12px/1.5 var(--mono);margin:6px 0 0;color:var(--fg2)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.compare{grid-template-columns:1fr}}
.compare pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  font:12px/1.5 var(--mono);padding:10px;margin:4px 0 0;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.compare h3{font-size:12px;color:var(--fg3);margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.msg{padding:10px 14px;border-radius:var(--radius-sm);font-size:14px;margin:10px 0 0}
.msg.err{background:var(--late-soft)}
.msg.ok{background:var(--ok-soft)}
.msg.warn{background:var(--wait-soft)}
.progress{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
code{font-family:var(--mono);font-size:.92em;background:var(--bg3);padding:1px 5px;border-radius:4px}
.theme{position:fixed;top:12px;right:12px}
.count{font-size:13px;font-weight:400;color:var(--fg3)}
.summary{font-size:15px;margin:0 0 12px}
dialog{width:min(960px,94vw);max-height:90vh;overflow:auto;background:var(--bg2);color:var(--fg);border:1px solid var(--border2);border-radius:var(--radius);padding:16px 18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<button class="btn theme" id="theme" title="Light or dark">◐</button>
<div class="wrap">
  <h1>GroupToDo Importer</h1>

  <section class="step" id="s1">
    <h2><span class="n">1</span>Source and owner</h2>
    <div class="row">
      <button class="btn primary" id="pickSource">Choose vault or export folder…</button>
      <span class="found" id="sourceInfo"></span>
    </div>
    <div id="who" hidden>
      <label class="field"><span>Your name</span>
        <input type="text" id="me" placeholder="Kari Nordmann" autocomplete="name"></label>
      <label class="field"><span>Area</span>
        <select id="area">
          <option value="?" disabled selected>Choose…</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Home">Home</option>
          <option value="Family">Family</option>
          <option value="">Root / None</option>
        </select></label>
    </div>
  </section>

  <section class="step off" id="s2">
    <h2><span class="n">2</span>Page types <span class="count" id="autoCount"></span></h2>
    <div id="rules"></div>
  </section>

  <section class="step off" id="s3">
    <h2><span class="n">3</span>Preview and export</h2>
    <p class="summary" id="summary" role="status"></p>
    <div class="row"><button class="btn" id="showDiff">Preview diffs</button></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="pickTarget">Choose empty target folder…</button>
      <span class="found" id="targetInfo"></span>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="write" disabled>Import to new folder</button>
      <button class="btn" id="report" hidden>Download log</button>
    </div>
    <div id="writeOut"></div>
  </section>
</div>

<dialog id="diff">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <b>Preview diffs</b><button class="btn" id="diffClose">Close</button>
  </div>
  <div id="preview"></div>
</dialog>
<script>
"use strict";
/* ============================================================
   GroupToDo Importer
   Reads a Logseq or Obsidian vault, or a Dynalist or Workflowy export, and writes the same notes in the
   GroupToDo vault format (docs/vault-format.md). Two halves:

   - CONVERT is pure: lists of {rel, text, mtime} in, a map of output paths
     to text out, plus a report. No DOM, no files, so it can be tested on
     its own (window.GTDImport).
   - The page around it reads the folders, asks the questions and writes.
   ============================================================ */

/* ---------- shared vocabulary ---------- */
const KINDS = [
  ["page",  "",  "Plain page"],
  ["z",     "z", "Note (zettelkasten)"],
  ["p",     "p", "Person"],
  ["o",     "o", "Organisation"],
  ["c",     "c", "Context"],
  ["1",     "1", "Project, active"],
  ["2",     "2", "Project, someday/maybe"],
  ["3",     "3", "Project, waiting"],
  ["0",     "0", "Project, completed"],
  ["-",     "-", "Project, cancelled"],
  ["a",     "a", "Responsibility (area of focus)"],
  ["g",     "g", "Goal"],
  ["h4",    "_", "Vision (horizon 4)"],
  ["h5",    "_", "Purpose and principles (horizon 5)"],
  ["8",     "8", "Checklist or template"],
  ["m",     "m", "E-mail"],
  ["r",     "r", "Review (book, film, video)"],
  ["skip",  null, "Leave it out"],
];
const KIND_PREFIX = Object.fromEntries(KINDS.map(([k, p]) => [k, p]));
const STATUS_TEXT = {"-": "- = cancelled", "0": "0 = completed", "1": "1 = active",
  "2": "2 = someday maybe", "3": "3 = waiting for 3rd party"};
const KIND_PROPS = {
  p: {type: "person"}, o: {type: "org"}, c: {type: "context"}, a: {type: "area"},
  g: {type: "goal", horizon: "3"}, "8": {type: "checklist"},
  h4: {type: "horizon"}, h5: {type: "horizon"},
};
// Purpose and vision are one page each, whatever they were made from.
const HORIZON_PAGE = {h4: "Vision", h5: "Purpose"};
const STATE_MAP = {TODO: "TODO", DOING: "DOING", DONE: "DONE", LATER: "TODO", NOW: "DOING",
  WAITING: "WAIT", WAIT: "WAIT", CANCELED: "CANCELLED", CANCELLED: "CANCELLED", "IN-PROGRESS": "DOING"};

/* Where every answer starts. A namespace or folder means what its owner
   says, so none is chosen for them: each waits for a pick. A tag stays a
   plain tag until it is given a meaning. */
function startRules(C) {
  const rules = {groups: {}, tags: {}};
  for (const g of C.groups) rules.groups[g.key] = g.key ? "" : "page";
  for (const x of C.tags) rules.tags[x.key] = "page";
  return rules;
}

/* The group a page name or folder path belongs to: its first part, or its
   first two when the second is a short code ("PR/A/Kitchen" -> "PR/A"), so
   each code is its own question. The last part is the page itself. */
const groupOf = segs => segs.length > 2 && /^[^s]{1,3}$/.test(segs[1]) ? segs[0] + "/" + segs[1]
  : segs.length > 1 ? segs[0] : "";

/* ---------- names ---------- */
// The format's own rule: / \ : * ? " < > | and control characters become "-".
const cleanName = s => String(s || "").replace(/[\/\\:*?"<>|\u0000-\u001f]/g, "-")
  .replace(/\s+/g, " ").trim().slice(0, 120) || "Untitled";
const lc = s => String(s || "").toLowerCase();
const pad2 = n => String(n).padStart(2, "0");
const unquote = s => String(s || "").trim().replace(/^"(.*)"$/, "$1").replace(/^'(.*)'$/, "$1");

/* ---------- dates ---------- */
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const MONTHS_NB = ["jan", "feb", "mar", "apr", "mai", "jun", "jul", "aug", "sep", "okt", "nov", "des"];
const validYMD = (y, m, d) => {
  const t = new Date(Date.UTC(+y, +m - 1, +d));
  return t.getUTCFullYear() === +y && t.getUTCMonth() === +m - 1 && t.getUTCDate() === +d;
};
const ymd = (y, m, d) => validYMD(y, m, d) ? y + "-" + pad2(m) + "-" + pad2(d) : null;
const monthIndex = w => {
  const k = lc(w).slice(0, 3);
  const i = MONTHS.indexOf(k);
  return i >= 0 ? i + 1 : MONTHS_NB.indexOf(k) >= 0 ? MONTHS_NB.indexOf(k) + 1 : 0;
};

/* A date written the way a journal names its day: 2026-10-05, 2026_10_05,
   Oct 5th, 2026, 5. okt 2026, 05.10.2026, Monday, 5 October 2026. Null for
   anything else. Day before month when only numbers are given, the European
   way, which is how Norwegian and most Obsidian setups write it. */
function dateOf(text) {
  let s = String(text || "").trim();
  s = s.replace(/^[A-Za-zæøåÆØÅ]+day,?\s+|^(mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag),?\s+/i, "");
  let m = /^(\d{4})[-_.\/](\d{1,2})[-_.\/](\d{1,2})(?:\s+\w+)?$/.exec(s);
  if (m) return ymd(m[1], m[2], m[3]);
  m = /^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/.exec(s);
  if (m) return ymd(m[3], m[2], m[1]);
  m = /^([A-Za-zæøå]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})$/i.exec(s);
  if (m && monthIndex(m[1])) return ymd(m[3], monthIndex(m[1]), m[2]);
  m = /^(\d{1,2})(?:st|nd|rd|th)?\.?\s+([A-Za-zæøå]{3,})\.?,?\s+(\d{4})$/i.exec(s);
  if (m && monthIndex(m[2])) return ymd(m[3], monthIndex(m[2]), m[1]);
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if (m) return ymd(m[1], m[2], m[3]);
  return null;
}

/* Logseq's <2026-10-08 Thu 10:00 .+1w>: the day, and a repeat if there is one. */
function logseqStamp(inner) {
  const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(inner || "").trim());
  if (!m) return null;
  const rep = /([.+]?\+)(\d+)([hdwmy])/.exec(inner);
  let repeat = null;
  if (rep) {
    const n = +rep[2], unit = {h: "hour", d: "day", w: "week", m: "month", y: "year"}[rep[3]];
    const one = {day: "daily", week: "weekly", month: "monthly", year: "yearly"}[unit];
    repeat = n === 1 && one ? one : "every " + n + " " + unit + "s";
  }
  return {date: m[1], repeat};
}

/* ---------- a tiny YAML reader, for front matter ----------
   Obsidian front matter is almost always flat: key: value, key: [a, b], and
   key: followed by "- item" lines. That is what this reads; anything deeper
   is kept as its text and said in the report. */
function readFrontMatter(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(text);
  if (!m) return {props: [], rest: text, odd: false};
  const props = [];
  let odd = false, list = null;
  for (const line of m[1].split(/\r?\n/)) {
    if (!line.trim() || /^\s*#/.test(line)) continue;
    const item = /^\s+-\s+(.*)$/.exec(line);
    if (item && list) { list.push(unquote(item[1])); continue; }
    const kv = /^([A-Za-z][\w-]*):\s*(.*)$/.exec(line);
    if (!kv) { odd = true; continue; }
    let v = kv[2].trim();
    if (v === "") { list = []; props.push([kv[1], list]); continue; }
    list = null;
    if (/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(",").map(unquote).filter(Boolean);
    else v = unquote(v);
    props.push([kv[1], v]);
  }
  return {props: props.map(([k, v]) => [k, Array.isArray(v) ? v : String(v)]), rest: text.slice(m[0].length), odd};
}

/* ---------- reading the source into page records ---------- */
/* A Logseq page's name: title:: if it says one, else the file name with
   %2F and ___ (both of Logseq's spellings of a namespace "/") read back. */
function logseqName(rel, text) {
  const t = /^title::\s*(.+)$/m.exec(preambleOf(text));
  if (t) return unquote(t[1]);
  let base = rel.replace(/^pages\//, "").replace(/\.md$/i, "");
  try { base = decodeURIComponent(base.replace(/%(?![0-9A-Fa-f]{2})/g, "%25")); } catch (_) {}
  return base.replace(/___/g, "/");
}
const preambleOf = text => {
  const out = [];
  for (const line of String(text || "").split(/\r?\n/)) {
    if (/^\s*[-*+]\s/.test(line) || /^\s*-$/.test(line)) break;
    out.push(line);
  }
  return out.join("\n");
};
/* Page properties: the key:: lines above the first bullet, and -- the way
   Logseq often writes them -- a first bullet made of nothing but key:: lines. */
function preambleProps(text) {
  const out = {};
  const PROP = /^([\p{L}][\p{L}\p{N}_-]*)::\s*(.*)$/u;
  for (const line of preambleOf(text).split(/\n/)) {
    const m = PROP.exec(line.trim());
    if (m) out[lc(m[1])] = m[2].trim();
  }
  const lines = String(text || "").split(/\r?\n/);
  const first = lines.findIndex(l => /^\s*[-*+]\s/.test(l));
  if (first >= 0) {
    const m = PROP.exec(lines[first].replace(/^\s*[-*+]\s+/, ""));
    if (m) {
      out[lc(m[1])] = m[2].trim();
      for (let i = first + 1; i < lines.length && /^\s+\S/.test(lines[i]) && !/^\s*[-*+]\s/.test(lines[i]); i++) {
        const p = PROP.exec(lines[i].trim());
        if (p) out[lc(p[1])] = p[2].trim();
      }
    }
  }
  return out;
}
// "[[Project]], person" -> ["project", "person"]
const tagValues = v => String(v || "").split(/,/).map(x => lc(x.replace(/[\[\]#"]/g, "").trim())).filter(Boolean);

/* What else a page says about itself: #tags on its first line, and a short
   word in any other page property, as "status: active". Each becomes a row
   the user can give a meaning; nothing is read into it here. */
const OWN_KEYS = /^(tags?|type|category|alias(es)?|title|id|collapsed|created|updated|date|cssclass(es)?|public|icon|settings|area|area_name|updated_by|author)$/i;
function pageMarks(props, firstLine) {
  const out = [];
  for (const m of String(firstLine || "").matchAll(/(?:^|\s)#(?:\[\[([^\]]+)\]\]|([\p{L}\p{N}][\p{L}\p{N}_\-\/]*))/gu))
    out.push(lc(m[1] || m[2]));
  for (const [k, v] of props) {
    const s = String(Array.isArray(v) ? v.join(", ") : v).trim();
    if (OWN_KEYS.test(k) || !s || s.length > 30 || /\[\[|\(\(|\d{4}-\d{2}|https?:/.test(s)) continue;
    out.push(lc(k) + ": " + lc(s.replace(/^["']|["']$/g, "")));
  }
  return out;
}
// The first line of words: a page's first bullet in Logseq, its first text in Obsidian.
const firstLineOf = text => (String(text || "").split(/\r?\n/)
  .find(l => l.trim() && !/^\s*[\p{L}][\p{L}\p{N}_-]*::/u.test(l.replace(/^\s*[-*+]\s+/, ""))) || "")
  .replace(/^\s*[-*+]\s+/, "");

/* Every source file sorted into journal days and pages, with what the
   classification screen needs: the group it is in, its tags and type. */
function analyze(kind, files) {
  const journals = new Map();          // date -> [file]
  const pages = [];
  const skipped = [];
  const assets = [];
  for (const f of files) {
    if (!/\.md$/i.test(f.rel)) {
      // The apps' own settings are not attachments.
      if (!/^(logseq|\.obsidian|\.trash|\.git|\.recycle|bak|version-files)\//.test(f.rel)) assets.push(f);
      continue;
    }
    const base = f.rel.split("/").pop().replace(/\.md$/i, "");
    // GroupToDo writes these folder guides itself and rewrites them; they are
    // never pages, so they are not carried over.
    if (/^_[^/ ]+_for /.test(base) || /^\s*<!-- Written by GroupToDo/.test(f.text || "")) continue;
    if (kind === "logseq") {
      if (/^(logseq|\.recycle|bak|version-files|draws)\//.test(f.rel)) { skipped.push(f.rel); continue; }
      if (f.rel.startsWith("journals/")) {
        // GroupToDo's own folder notes (_journals_for Day pages) are not days.
        if (/^_[^/ ]+_for /.test(base)) continue;
        const clean = base.replace(/\s*\(\d+\)$/, "");
        // A week page keeps its name: 2026-W44.
        const d = /^\d{4}-W\d{2}$/.test(clean) ? clean : dateOf(clean);
        if (d) { (journals.get(d) || journals.set(d, []).get(d)).push(f); continue; }
        skipped.push(f.rel + " (journal file without a date in its name)");
        continue;
      }
      if (!f.rel.includes("/") && /^_[^/ ]+_for /.test(base)) continue;
      if (!f.rel.startsWith("pages/")) { skipped.push(f.rel + " (outside journals/ and pages/)"); continue; }
      const name = logseqName(f.rel, f.text);
      const props = preambleProps(f.text);
      pages.push({file: f, name, group: groupOf(name.split("/")),
        tags: [...tagValues(props.tags), ...tagValues(props.type), ...tagValues(props.category),
          ...pageMarks(Object.entries(props), firstLineOf(f.text))],
        aliases: (props.alias || "").split(",").map(a => a.replace(/[\[\]]/g, "").trim()).filter(Boolean)});
    } else {
      if (/^(\.obsidian|\.trash|\.git)\//.test(f.rel) || f.rel.split("/").some(s => s.startsWith("."))) { skipped.push(f.rel); continue; }
      const d = dateOf(base);
      if (d) { (journals.get(d) || journals.set(d, []).get(d)).push(f); continue; }
      const fm = readFrontMatter(f.text);
      const fmv = k => {
        const p = fm.props.find(([key]) => lc(key) === k);
        return p ? (Array.isArray(p[1]) ? p[1] : [p[1]]) : [];
      };
      const inline = preambleProps(fm.rest);
      const parts = f.rel.split("/");
      pages.push({file: f, name: base, folder: parts.slice(0, -1).join("/"),
        group: groupOf(parts),
        tags: [...fmv("tags"), ...fmv("type"), ...fmv("category"), ...tagValues(inline.tags), ...tagValues(inline.type)]
          .flatMap(t => tagValues(t))
          .concat(pageMarks([...fm.props, ...Object.entries(inline)], firstLineOf(fm.rest))),
        aliases: fmv("aliases").concat(fmv("alias")).map(String)});
    }
  }
  for (const p of pages) classify(p);
  return {kind, journals, pages, skipped, assets};
}

/* The groups and tags the screen asks about, most used first. */
function ruleChoices(a) {
  const groups = new Map(), tags = new Map();
  for (const p of a.pages) {
    const g = p.group;
    if (!groups.has(g)) groups.set(g, {key: g, n: 0, ex: []});
    const G = groups.get(g); G.n++; if (G.ex.length < 3) G.ex.push(p.name);
    for (const t of new Set(p.tags)) {
      if (!tags.has(t)) tags.set(t, {key: t, n: 0, ex: []});
      const T = tags.get(t); T.n++; if (T.ex.length < 3) T.ex.push(p.name);
    }
  }
  const sort = m => [...m.values()].sort((x, y) => y.n - x.n || x.key.localeCompare(y.key));
  return {groups: sort(groups), tags: sort(tags)};
}

/* ---------- deciding where each page goes ---------- */
function placePages(a, rules) {
  const placed = [];
  for (const p of a.pages) {
    const byTag = rules.rows ? "" : p.tags.map(t => rules.tags[t]).find(k => k && k !== "page");
    const byGroup = rules.rows ? (p.via === "group" || p.groupCode ? rules.rows[p.row] : "") : rules.groups[p.group];
    const kind = rules.rows ? (rules.rows[p.row] || "page") : (byTag || byGroup || "page");
    if (kind === "skip") continue;
    // A namespace or folder that names the kind is not part of the name:
    // "&/Kari Nordmann" filed as a person is p/Kari Nordmann.
    let segs = a.kind === "logseq" ? p.name.split("/") : [p.name];
    if (a.kind === "logseq" && !byTag && byGroup && byGroup !== "page" && segs.length > 1) segs = segs.slice(p.group.split("/").length);
    const title = segs.map(s => s.trim()).filter(Boolean).join(" - ") || p.name;
    const prefix = KIND_PREFIX[kind];
    const fileName = HORIZON_PAGE[kind] || cleanName(title);
    const ref = prefix ? prefix + "/" + fileName : fileName;
    placed.push(Object.assign({}, p, {kind, title, ref, out: "pages/" + ref + ".md"}));
  }
  return placed;
}

/* ---------- the conversion itself ---------- */
function convert(a, opts) {
  const R = {pages: 0, journals: 0, journalCopies: 0, tasks: {}, dates: 0, repeats: 0,
    links: 0, blockRefs: 0, blockRefsMissing: [], embeds: 0, queries: [], collapsed: 0,
    logbooks: 0, merged: [], skipped: a.skipped.slice(), oddFrontMatter: [], archived: 0,
    contexts: new Set(), assets: 0, assetsMissing: new Set(), byKind: {}, plainRoots: []};
  const out = new Map();
  const assetsOut = [];
  const placed = placePages(a, opts.rules);

  // Old name (and alias) -> new link target, case-insensitively.
  const linkMap = new Map();
  for (const p of placed) {
    linkMap.set(lc(p.name), p.ref);
    for (const al of p.aliases || []) if (!linkMap.has(lc(al))) linkMap.set(lc(al), p.ref);
  }
  // A link to a namespace that never got a page of its own still follows its
  // group's rule, so [[&/Somebody new]] lands on p/ like the others.
  const mapTarget = raw => {
    const t = String(raw || "").trim();
    const d = dateOf(t);
    if (d) return d;
    const hit = linkMap.get(lc(t));
    if (hit) return hit;
    if (a.kind === "logseq" && t.includes("/")) {
      const segs = t.split("/");
      const g = groupOf(segs);
      const k = opts.rules.groups[g];
      if (k && k !== "page" && k !== "skip" && KIND_PREFIX[k]) return KIND_PREFIX[k] + "/" + cleanName(segs.slice(g.split("/").length).join(" - "));
      return cleanName(segs.join(" - "));
    }
    if (a.kind === "obsidian") return linkMap.get(lc(t.split("/").pop())) || cleanName(t.split("/").pop());
    return t;
  };

  // Logseq block ids -> their words. Which ids exist tells a ((uuid)) or an embed that points at nothing.
  const blockText = new Map();
  if (a.kind === "logseq") {
    for (const f of [...a.pages.map(p => p.file), ...[...a.journals.values()].flat()]) {
      const lines = f.text.split(/\r?\n/);
      let last = null;
      for (const line of lines) {
        const b = /^\s*[-*+]\s+(.*)$/.exec(line);
        if (b) { last = b[1]; continue; }
        const id = /^\s*id::\s*([0-9a-f-]{36})\s*$/i.exec(line);
        if (id && last != null) blockText.set(lc(id[1]), last.replace(/^(TODO|DOING|DONE|LATER|NOW|WAITING|CANCELED|CANCELLED)\s+/, ""));
      }
    }
  }

  // Attachments by file name, for Obsidian's ![[shot.png]] and plain links.
  const assetByName = new Map();
  for (const f of a.assets) {
    const base = f.rel.split("/").pop();
    if (/^(\.obsidian|\.trash|logseq|\.git)\//.test(f.rel)) continue;
    if (!assetByName.has(lc(base))) assetByName.set(lc(base), f);
  }
  const usedAssets = new Map();       // source rel -> assets/<name>
  const takenAssetNames = new Set();
  const assetRef = f => {
    if (usedAssets.has(f.rel)) return usedAssets.get(f.rel);
    let name = cleanName(f.rel.split("/").pop()), n = 1;
    while (takenAssetNames.has(lc(name))) name = name.replace(/(\.[^.]*)?$/, m => "-" + (++n) + m);
    takenAssetNames.add(lc(name));
    const p = "assets/" + name;
    usedAssets.set(f.rel, p);
    assetsOut.push({file: f, out: p});
    R.assets++;
    return p;
  };
  const assetFor = path => {
    const base = lc(decodeURIComponent(String(path).split(/[\\/]/).pop()));
    const f = assetByName.get(base);
    if (!f) { R.assetsMissing.add(path); return null; }
    return assetRef(f);
  };

  /* Words on one line: links, tags, references, attachments. Code spans are
     left exactly as they are. */
  const inline = text => String(text).split(/(`[^`]*`)/).map((seg, i) => i % 2 ? seg : inlineSeg(seg)).join("");
  function inlineSeg(s) {
    if (a.kind === "logseq") {
      /* GroupToDo shows embeds, queries and ((id)) references live, and the
         id:: they point at is carried over with its line, so they are kept as
         written. The [[link]] inside an embed or a query is rewritten below
         like any other. */
      s = s.replace(/\{\{embed\s+\(\(([0-9a-f-]{36})\)\)\s*\}\}/gi, (all, id) => {
        R.embeds++;
        if (!blockText.has(lc(id))) R.blockRefsMissing.push(id);
        return "\u0001" + id + "\u0002";            // set aside, so the ((id)) rule below does not count it twice
      });
      s = s.replace(/\{\{embed\s+\[\[([^\]]+)\]\]\s*\}\}/gi, all => { R.embeds++; return all; });
      s = s.replace(/\{\{query\s[^}]*\}\}/gi, all => { R.queries.push(all); return all; });
      s = s.replace(/\(\(([0-9a-f-]{36})\)\)/gi, (all, id) => {
        R.blockRefs++;
        if (!blockText.has(lc(id))) R.blockRefsMissing.push(id);
        return all;
      });
      s = s.replace(/\u0001([0-9a-f-]{36})\u0002/gi, "{{embed (($1))}}");
      // ../assets/x.png -> assets/x.png: the app reads attachments from the vault root.
      s = s.replace(/(\]\()(?:\.\.\/)+assets\//g, "$1assets/");
      s = s.replace(/(\]\()assets\/([^)\s]+)\)/g, (all, lead, name) => {
        const f = assetByName.get(lc(decodeURIComponent(name)));
        if (f) assetRef(f); else R.assetsMissing.add("assets/" + name);
        return all;
      });
    } else {
      // ![[shot.png]] is an attachment; ![[Note]] shows the note, as {{embed}} does in GroupToDo.
      s = s.replace(/!\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (all, t, label) => {
        if (/\.[A-Za-z0-9]{2,5}$/.test(t.trim()) && !/\.md$/i.test(t.trim())) {
          const p = assetFor(t.trim());
          const name = t.trim().split("/").pop();
          if (!p) return all;
          return (/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(name) ? "!" : "") + "[" + name + "](" + p + ")";
        }
        R.embeds++;
        return "{{embed [[" + t.trim() + "]]}}";
      });
      // ![](attachments/x.png) and [file](docs/x.pdf) pointing into the vault.
      s = s.replace(/(!?)\[([^\]]*)\]\((?!https?:|mailto:|file:|#)([^)\s]+)\)/g, (all, bang, label, href) => {
        if (/\.md$/i.test(href)) return "[[" + decodeURIComponent(href).replace(/\.md$/i, "").split("/").pop() + (label ? "|" + label : "") + "]]";
        const p = assetFor(href);
        return p ? bang + "[" + (label || p.split("/").pop()) + "](" + p + ")" : all;
      });
      s = s.replace(/\[\[([^\]|]+?)#\^[^\]|]+(\|[^\]]*)?\]\]/g, "[[$1$2]]");
    }
    // [[target]], [[target|label]], [[target#heading]]: the target moves, the rest stays.
    s = s.replace(/(#?)\[\[([^\]]+?)\]\]/g, (all, hash, inner) => {
      // "#/Acme" is a namespace, not a heading: a leading "#/" belongs to the name.
      const m = /^((?:#\/)?[^|#]+)((?:#[^|]*)?)((?:\|.*)?)$/.exec(inner);
      if (!m) return all;
      const target = mapTarget(m[1]);
      R.links++;
      if (target.startsWith("c/")) R.contexts.add(target.slice(2));
      return "[[" + target + m[2] + m[3] + "]]";
    });
    // #tag that names a page filed as something other than a plain page is a link to it.
    s = s.replace(/(^|\s)#([\p{L}\p{N}][\p{L}\p{N}_\-\/]*)/gu, (all, lead, t) => {
      const hit = linkMap.get(lc(t));
      if (!hit || !hit.includes("/")) return all;
      R.links++;
      if (hit.startsWith("c/")) R.contexts.add(hit.slice(2));
      return lead + "[[" + hit + "]]";
    });
    if (opts.atContext) {
      s = s.replace(/(^|\s)@([\p{L}][\p{L}\p{N}_-]{1,30})(?![\p{L}\p{N}@.])/gu, (all, lead, w) => {
        // A set names the only @words that are contexts; true means all of them.
        if (opts.atContext instanceof Set && !opts.atContext.has(lc(w))) return all;
        R.contexts.add(lc(w)); R.links++;
        return lead + "[[c/" + lc(w) + "]]";
      });
    }
    return s;
  }

  const countTask = st => { R.tasks[st] = (R.tasks[st] || 0) + 1; };

  /* ---- Logseq: already an outline, so line by line ---- */
  function logseqBody(text) {
    const pageProps = [], body = [];
    let seenBullet = false, drawer = false, fence = false;
    let firstBlockProps = null;          // "- tags:: project" as the first block: page properties in disguise
    const lines = String(text).replace(/\r\n?/g, "\n").split("\n")
      .map(l => l.replace(/^\t+/, t => "  ".repeat(t.length)));
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      const lead = /^\s*/.exec(line)[0];
      const t = line.trim();
      if (fence) { body.push(line); if (/^```/.test(t)) fence = false; continue; }
      if (drawer) { body.push(line); if (t === ":END:") drawer = false; continue; }
      if (!seenBullet) {
        const pm = /^([\p{L}][\p{L}\p{N}_-]*)::\s*(.*)$/u.exec(t);
        if (pm) { if (!(lc(pm[1]) === "collapsed")) pageProps.push([pm[1], inline(pm[2])]); continue; }
        if (t === "") continue;        // the blank line after the properties is written again by serialize
      }
      const b = /^(\s*)[-*+](?:\s+(.*))?$/.exec(line);
      if (b) {
        seenBullet = true;
        let content = b[2] || "";
        if (firstBlockProps === null && !body.length && /^[\p{L}][\p{L}\p{N}_-]*::\s/u.test(content)) {
          firstBlockProps = true;
          const pm = /^([\p{L}][\p{L}\p{N}_-]*)::\s*(.*)$/u.exec(content);
          pageProps.push([pm[1], inline(pm[2])]);
          continue;
        }
        if (firstBlockProps === true && !body.length && b[1].length === 0) firstBlockProps = false;
        const sm = /^([A-Z-]{3,11})(\s+|$)(.*)$/.exec(content);
        if (sm && STATE_MAP[sm[1]]) { content = STATE_MAP[sm[1]] + (sm[3] ? " " + sm[3] : ""); countTask(STATE_MAP[sm[1]]); }
        content = content.replace(/^((?:TODO|DOING|DONE|WAIT|CANCELLED)\s+)?\[#([ABC])\]\s*/, (all, st, p) =>
          (st || "") + "#" + {A: "high", B: "medium", C: "low"}[p] + " ");
        if (/^```/.test(content)) fence = true;
        body.push(b[1] + "- " + inline(content).replace(/\s+$/, ""));
        continue;
      }
      if (firstBlockProps === true && !body.length) {
        const pm = /^([\p{L}][\p{L}\p{N}_-]*)::\s*(.*)$/u.exec(t);
        if (pm) { if (lc(pm[1]) !== "collapsed") pageProps.push([pm[1], inline(pm[2])]); continue; }
      }
      if (t === "") { body.push(""); continue; }
      if (/^:[A-Z][A-Z_-]*:$/.test(t)) { drawer = true; R.logbooks++; body.push(line); continue; }
      if (/^collapsed::\s*true$/i.test(t)) { R.collapsed++; continue; }
      const sd = /^(SCHEDULED|DEADLINE):\s*<([^>]*)>\s*$/.exec(t);
      if (sd) {
        const st = logseqStamp(sd[2]);
        if (st) {
          R.dates++;
          body.push(lead + sd[1] + ":: [[" + st.date + "]]");
          if (st.repeat) { R.repeats++; body.push(lead + "repeat:: " + st.repeat); }
          continue;
        }
      }
      if (/^```/.test(t)) fence = true;
      const pm = /^([\p{L}][\p{L}\p{N}_-]*)::\s*(.*)$/u.exec(t);
      if (pm) { body.push(lead + pm[1] + ":: " + inline(pm[2])); continue; }
      body.push(lead + inline(t));
    }
    while (body.length && body[body.length - 1] === "") body.pop();
    return {pageProps, body};
  }

  /* ---- Obsidian: free-form markdown, turned into an outline ---- */
  const TASK_BOX = {" ": "TODO", "x": "DONE", "X": "DONE", "/": "DOING", "-": "CANCELLED", ">": "TODO", "<": "TODO", "?": "TODO", "!": "TODO"};
  const EMOJI_PROPS = [
    [/📅\s*(\d{4}-\d{2}-\d{2})/u, "DEADLINE"], [/(?:⏳|🛫)\s*(\d{4}-\d{2}-\d{2})/u, "SCHEDULED"],
    [/➕\s*(\d{4}-\d{2}-\d{2})/u, "Added"], [/✅\s*(\d{4}-\d{2}-\d{2})/u, "CLOSED"],
    [/❌\s*(\d{4}-\d{2}-\d{2})/u, "CLOSED"],
  ];
  function obsidianBody(text, file) {
    const fm = readFrontMatter(text);
    if (fm.odd) R.oddFrontMatter.push(file.rel);
    const pageProps = [];
    for (const [k, v] of fm.props) {
      const vals = Array.isArray(v) ? v : [v];
      if (/^(tags?|aliases|alias|cssclass(es)?|cssclasses)$/i.test(k)) {
        if (/^(tags?)$/i.test(k)) pageProps.push(["tags", vals.map(x => String(x).replace(/^#/, "")).join(", ")]);
        else if (/^alias(es)?$/i.test(k)) pageProps.push(["alias", vals.join(", ")]);
        continue;
      }
      // A list of names is a list of links, where they name pages.
      pageProps.push([k, vals.map(x => {
        const s = String(x);
        if (/^\[\[.*\]\]$/.test(s)) return inline(s);
        return linkMap.has(lc(s)) ? "[[" + linkMap.get(lc(s)) + "]]" : s;
      }).join(", ")]);
    }
    const body = [];
    const heads = [];                // heading levels currently open
    let listStack = [];              // indents of open list levels
    let last = null;                 // {depth} of the last bullet written
    let para = null;                 // lines of the paragraph being gathered
    let fence = null;                // the bullet a code fence is being written under
    let table = null;
    const base = () => heads.length;
    const ind = d => "  ".repeat(d);
    const emit = (depth, content, props = []) => {
      body.push(ind(depth) + "- " + content);
      for (const [k, v] of props) body.push(ind(depth) + "  " + k + ":: " + v);
      last = {depth};
    };
    const flushPara = () => {
      if (!para) return;
      emit(base(), inline(para.join(" ").trim()));
      para = null;
    };
    const lines = fm.rest.replace(/\r\n?/g, "\n").split("\n");
    for (const raw of lines) {
      const line = raw.replace(/\t/g, "    ");
      const t = line.trim();
      if (fence) {
        body.push(ind(fence.depth) + "  " + raw.replace(/^\s*/, ""));
        if (/^(```|~~~)/.test(t)) fence = null;
        continue;
      }
      if (/^(```|~~~)/.test(t)) {
        flushPara(); table = null;
        // Indented under a list item it is that item's; at the margin it is the section's.
        if (!/^\s/.test(line)) listStack = [];
        const d = listStack.length && last ? last.depth + 1 : base();
        emit(d, t); fence = {depth: d};
        continue;
      }
      if (t === "") { flushPara(); table = null; continue; }
      const h = /^(#{1,6})\s+(.*)$/.exec(t);
      if (h && !/^#{1,6}[\p{L}\p{N}]/u.test(t)) {
        flushPara(); table = null; listStack = [];
        while (heads.length && heads[heads.length - 1] >= h[1].length) heads.pop();
        emit(base(), inline(h[2].replace(/\s+#+\s*$/, "")));
        heads.push(h[1].length);
        continue;
      }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); table = null; continue; }
      const li = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line);
      if (li) {
        flushPara(); table = null;
        const indent = li[1].length;
        while (listStack.length && listStack[listStack.length - 1] > indent) listStack.pop();
        if (!listStack.length || listStack[listStack.length - 1] < indent) listStack.push(indent);
        const depth = base() + listStack.length - 1;
        let content = li[3];
        const props = [];
        const box = /^\[(.)\]\s*(.*)$/.exec(content);
        if (box && TASK_BOX[box[1]] !== undefined) {
          const st = TASK_BOX[box[1]];
          countTask(st);
          content = box[2];
          for (const [re, key] of EMOJI_PROPS) {
            const m = re.exec(content);
            if (m) { props.push([key, "[[" + m[1] + "]]"]); content = content.replace(re, ""); R.dates++; }
          }
          const rep = /🔁\s*([^📅⏳🛫➕✅❌⏫🔼🔽🔺⏬]+)/u.exec(content);
          if (rep) {
            const w = lc(rep[1].trim());
            props.push(["repeat", /^every (day)$/.test(w) ? "daily" : /^every week$/.test(w) ? "weekly"
              : /^every month$/.test(w) ? "monthly" : /^every year$/.test(w) ? "yearly" : w]);
            content = content.replace(rep[0], ""); R.repeats++;
          }
          content = content.replace(/⏫|🔺/gu, "#high").replace(/🔼/gu, "#medium").replace(/🔽|⏬/gu, "#low");
          content = st + " " + content.replace(/\s{2,}/g, " ").trim();
        }
        const bid = /\s\^([A-Za-z0-9-]+)\s*$/.exec(content);
        if (bid) { props.push(["id", bid[1]]); content = content.slice(0, bid.index); }
        emit(depth, inline(content.trim()), props);
        continue;
      }
      // Dataview's key:: value, under the line above it -- or of the page, before any.
      const dv = /^([\p{L}][\p{L}\p{N}_ -]*)::\s*(.*)$/u.exec(t);
      if (dv && !para) {
        const key = dv[1].trim().replace(/\s+/g, "_");
        if (last) body.push(ind(last.depth) + "  " + key + ":: " + inline(dv[2]));
        else pageProps.push([key, inline(dv[2])]);
        continue;
      }
      // An indented line under a list item is that item's own text.
      if (listStack.length && /^\s+/.test(line) && last && !para) {
        body.push(ind(last.depth) + "  " + inline(t));
        continue;
      }
      if (t.startsWith("|")) {
        flushPara();
        if (!table) { emit(base(), inline(t)); table = last; }
        else body.push(ind(table.depth) + "  " + inline(t));
        continue;
      }
      listStack = [];
      const bid = /\s\^([A-Za-z0-9-]+)\s*$/.exec(t);
      if (bid) {
        (para || (para = [])).push(t.slice(0, bid.index));
        flushPara();
        body.push(ind(last.depth) + "  id:: " + bid[1]);
        continue;
      }
      (para || (para = [])).push(t);
    }
    flushPara();
    return {pageProps, body};
  }

  const bodyOf = (text, file) => a.kind === "logseq" ? logseqBody(text) : obsidianBody(text, file);

  /* Properties, a blank line, the outline, a newline at the end. */
  function serialize(props, body) {
    const seen = new Set(), lines = [];
    for (const [k, v] of props) {
      if (seen.has(lc(k))) continue;
      seen.add(lc(k));
      lines.push(k + ":: " + v);
    }
    const out = [...lines];
    if (out.length && body.length) out.push("");
    out.push(...body);
    return out.join("\n").replace(/\n+$/, "") + "\n";
  }

  /* A task written on a day page was captured that day. Said as Added::, or
     GroupToDo stamps it with the day of the import and "oldest first" puts a
     three-year-old task among this week's. */
  function addedOn(body, date) {
    const out = [];
    for (let i = 0; i < body.length; i++) {
      out.push(body[i]);
      const b = /^(\s*)- (TODO|DOING|WAIT|DONE|CANCELLED)\b/.exec(body[i]);
      if (!b) continue;
      const pad = b[1] + "  ";
      let j = i + 1, has = false;
      while (j < body.length && body[j].startsWith(pad) && !/^\s*- /.test(body[j].slice(b[1].length))) {
        if (/^\s*added::/i.test(body[j])) has = true;
        j++;
      }
      if (!has) out.push(pad + "Added:: [[" + date + "]]");
    }
    return out;
  }

  /* ---- journals ---- */
  const me = cleanName(opts.me).slice(0, 40);
  for (const [date, files] of [...a.journals].sort((x, y) => x[0].localeCompare(y[0]))) {
    // The day itself first, then its sync-conflict copies "(1)", "(2)" after it.
    const copyNo = f => +((/\((\d+)\)\.md$/i.exec(f.rel) || [0, 0])[1]);
    const parts = files.slice().sort((x, y) => copyNo(x) - copyNo(y) || x.rel.localeCompare(y.rel)).map(f => bodyOf(f.text, f));
    if (files.length > 1) { R.journalCopies++; R.merged.push(date + ": " + files.map(f => f.rel).join(" + ")); }
    const props = [["title", date], ["created", "[[" + date + "]]"]];
    for (const p of parts) for (const kv of p.pageProps) if (!/^(title|created)$/i.test(kv[0])) props.push(kv);
    out.set("journals/" + me + "/" + date + ".md", serialize(props, addedOn(parts.flatMap(p => p.body), date)));
    R.journals++;
  }

  /* ---- pages ---- */
  const cutoff = opts.archiveYears ? Date.now() - opts.archiveYears * 365.25 * 864e5 : 0;
  const byOut = new Map();
  for (const p of placed) {
    const key = lc(p.out);
    if (byOut.has(key)) { byOut.get(key).push(p); continue; }
    byOut.set(key, [p]);
  }
  for (const group of byOut.values()) {
    // Two pages that land on one file -- "Kari" and "kari", or a namespace
    // flattened onto a name already taken -- are kept together, newest first.
    group.sort((x, y) => (y.file.mtime || 0) - (x.file.mtime || 0));
    const p = group[0];
    if (group.length > 1) R.merged.push(p.ref + ": " + group.map(g => g.file.rel).join(" + "));
    const parts = group.map(g => bodyOf(g.file.text, g.file));
    // On a horizon page each source keeps its old title, as a line over its words.
    if (HORIZON_PAGE[p.kind]) parts.forEach((part, i) =>
      part.body = ["- " + group[i].title, ...part.body.map(l => l ? "  " + l : l)]);
    const props = [];
    props.push(["title", HORIZON_PAGE[p.kind] || p.title]);
    for (const [k, v] of Object.entries(KIND_PROPS[p.kind] || {})) props.push([k, v]);
    if (STATUS_TEXT[p.kind]) props.push(["status", STATUS_TEXT[p.kind]]);
    if (cutoff && group.every(g => (g.file.mtime || Date.now()) < cutoff)) { props.push(["archived", "true"]); R.archived++; }
    for (const part of parts) for (const kv of part.pageProps) {
      if (/^(title|status)$/i.test(kv[0])) continue;
      if (/^type$/i.test(kv[0]) && KIND_PROPS[p.kind]) continue;
      props.push(kv);
    }
    out.set(p.out, serialize(props, parts.flatMap(x => x.body)));
    R.pages++;
    R.byKind[p.kind] = (R.byKind[p.kind] || 0) + 1;
    if (p.kind === "page" && /^(\d|[a-z_8-])$/i.test(p.title.split(" ")[0])) R.plainRoots.push(p.title);
  }

  /* ---- the pages every vault starts with ---- */
  for (const c of R.contexts) {
    const path = "pages/c/" + cleanName(c) + ".md";
    if (!out.has(path)) out.set(path, serialize([["title", c], ["type", "context"]], []));
  }
  const mePath = "pages/p/" + me + ".md";
  if (out.has(mePath)) {
    const text = out.get(mePath);
    if (!/^member::/m.test(text)) out.set(mePath, "member:: true\n" + text);
  } else out.set(mePath, serialize([["title", me], ["type", "person"], ["member", "true"]], []));

  // An area is one folder; everything above lives inside it.
  const root = opts.area ? cleanName(opts.area) + "/" : "";
  const files = root ? new Map([...out].map(([k, v]) => [root + k, v])) : out;
  if (root) for (const x of assetsOut) x.out = root + x.out;
  return {files, assets: assetsOut, report: R, placed: root ? placed.map(p => Object.assign({}, p, {out: root + p.out})) : placed, root};
}

/* ---------- the report, as text ---------- */
function reportText(a, res, opts) {
  const R = res.report;
  const kindName = k => (KINDS.find(x => x[0] === k) || [k, "", k])[2];
  const L = [];
  L.push("# GroupToDo import report", "");
  L.push("From " + (a.origin ? "a " + a.origin + " export" : a.kind === "logseq" ? "a Logseq vault" : "an Obsidian vault") + ", " + new Date().toLocaleString() + ".", "");
  L.push("## Counts", "");
  L.push("- Day pages: " + R.journals + (R.journalCopies ? " (" + R.journalCopies + " made from more than one file)" : ""));
  L.push("- Pages: " + R.pages);
  for (const [k, n] of Object.entries(R.byKind).sort((x, y) => y[1] - x[1])) L.push("  - " + kindName(k) + ": " + n);
  L.push("- Tasks: " + (Object.entries(R.tasks).map(([k, n]) => k + " " + n).join(", ") || "none"));
  L.push("- Dates turned into SCHEDULED::/DEADLINE::/CLOSED:: " + R.dates + (R.repeats ? ", repeats " + R.repeats : ""));
  L.push("- Links rewritten: " + R.links);
  L.push("- Contexts: " + (R.contexts.size ? [...R.contexts].sort().join(", ") : "none"));
  L.push("- Attachments copied: " + R.assets);
  if (R.archived) L.push("- Marked archived:: true: " + R.archived);
  if (R.logbooks) L.push("- Logseq LOGBOOK drawers kept: " + R.logbooks + " (GroupToDo keeps them out of sight)");
  if (R.collapsed) L.push("- collapsed:: true removed: " + R.collapsed);
  L.push("", "## Needs a look", "");
  const any = [];
  if (R.blockRefsMissing.length) any.push("- " + R.blockRefsMissing.length + " block reference(s) or embed(s) point at a block that was not found; left as ((id)).");
  if (R.queries.length) any.push("- " + R.queries.length + " query/queries carried over. GroupToDo runs Logseq's simple queries as live lists and ignores sort-by and the like; check they find what they did.\n" + R.queries.slice(0, 20).map(q => "  - `" + q + "`").join("\n"));
  if (R.assetsMissing.size) any.push("- " + R.assetsMissing.size + " attachment link(s) point at a file that is not in the vault:\n" + [...R.assetsMissing].slice(0, 30).map(x => "  - " + x).join("\n"));
  if (R.merged.length) any.push("- " + R.merged.length + " page(s) were made from more than one file:\n" + R.merged.slice(0, 50).map(x => "  - " + x).join("\n"));
  if (R.oddFrontMatter.length) any.push("- Front matter that was not plain key: value, partly kept:\n" + R.oddFrontMatter.slice(0, 30).map(x => "  - " + x).join("\n"));
  if (R.plainRoots.length) any.push("- Plain pages whose name starts like a GroupToDo folder letter; check their links:\n" + R.plainRoots.slice(0, 30).map(x => "  - " + x).join("\n"));
  if (R.skipped.length) any.push("- Files left out:\n" + R.skipped.slice(0, 50).map(x => "  - " + x).join("\n") + (R.skipped.length > 50 ? "\n  - … and " + (R.skipped.length - 50) + " more" : ""));
  L.push(...(any.length ? any : ["Nothing."]));
  L.push("");
  return L.join("\n");
}

/* ---------- outliners: Dynalist, Workflowy and other OPML ---------- */
const xmlText = s => String(s || "").replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, (m, e) => {
  const k = e.toLowerCase();
  if (k[0] === "#") return String.fromCodePoint(k[1] === "x" ? parseInt(k.slice(2), 16) : +k.slice(1));
  return {amp: "&", lt: "<", gt: ">", quot: '"', apos: "'"}[k];
});
// OPML into {title, flavor, nodes}; a node is {text, note, complete, checkbox, heading, kids}.
function parseOpml(xml) {
  const root = {kids: []}, stack = [root];
  for (const m of String(xml).matchAll(/<outline((?:\s+[\w:.-]+="[^"]*")*)\s*(\/?)>|<\/outline>/g)) {
    if (!m[0].startsWith("<outline")) { if (stack.length > 1) stack.pop(); continue; }
    const at = {};
    for (const x of m[1].matchAll(/([\w:.-]+)="([^"]*)"/g)) at[x[1]] = xmlText(x[2]);
    const n = {text: at.text || "", note: at._note || "", kids: [],
      complete: at.complete === "true" || at._complete === "true", checkbox: at.checkbox === "true",
      heading: +at.heading || 0};
    stack[stack.length - 1].kids.push(n);
    if (!m[2]) stack.push(n);
  }
  const tag = k => { const x = new RegExp("<" + k + ">([^<]*)</" + k + ">").exec(xml); return x ? xmlText(x[1]).trim() : ""; };
  return {title: tag("title"), flavor: lc(tag("flavor")), nodes: root.kids};
}
// A plain-text outline: one line per item, indented by tabs or spaces, "- " optional.
function parseTextOutline(text) {
  const rows = String(text).split(/\r?\n/).filter(l => l.trim()).map(l => {
    const ws = /^[ \t]*/.exec(l)[0];
    return {w: ws.replace(/\t/g, "    ").length, text: l.slice(ws.length).replace(/^[-*+]\s+/, "")};
  });
  const unit = Math.min(...rows.map(r => r.w).filter(w => w > 0), 4);
  const root = {kids: []}, stack = [[-1, root]];
  for (const r of rows) {
    const n = {text: r.text, note: "", kids: [], complete: false, checkbox: false, heading: 0};
    while (stack.length > 1 && stack[stack.length - 1][0] >= r.w) stack.pop();
    stack[stack.length - 1][1].kids.push(n);
    stack.push([r.w, n]);
  }
  return {title: "", flavor: "", nodes: root.kids};
}
// The outline as a Logseq page, so the rest of the importer reads it as it is.
function outlineMarkdown(nodes) {
  const out = [];
  const walk = (n, d) => {
    const ind = "  ".repeat(d), task = n.complete || n.checkbox;
    let text = n.text.trim(), due = "";
    // Dynalist's !(2026-12-01): the deadline of a task, a link to the day otherwise.
    text = text.replace(/\s*!\((\d{4}-\d{2}-\d{2})[^)]*\)/g, (m, day) => {
      if (task && !due) { due = day; return ""; }
      return " [[" + day + "]]";
    }).trim();
    const head = n.heading ? "#".repeat(Math.min(n.heading, 6)) + " " : "";
    out.push(ind + "- " + (n.complete ? "DONE " : n.checkbox ? "TODO " : "") + head + text);
    if (due) out.push(ind + "  DEADLINE:: [[" + due + "]]");
    for (const l of n.note.split(/\r?\n/)) if (l.trim()) out.push(ind + "  " + l.trim());
    for (const k of n.kids) walk(k, d + 1);
  };
  for (const n of nodes) walk(n, 0);
  return out.join("\n") + "\n";
}
/* Every .opml (and every .txt with no .opml beside it) becomes a page named
   by its folders and file: "Someday _ Maybe/Trip.opml" is the page
   "Someday _ Maybe/Trip". Returns {files, origin} for analyze("logseq", …). */
function outlineFiles(files) {
  const have = new Set(files.map(f => f.rel.toLowerCase()));
  const out = []; let origin = "";
  for (const f of files) {
    const m = /^(.*)\.(opml|txt)$/i.exec(f.rel);
    if (!m || typeof f.text !== "string") continue;
    const opml = m[2].toLowerCase() === "opml";
    if (!opml && have.has((m[1] + ".opml").toLowerCase())) continue;
    const doc = opml ? parseOpml(f.text) : parseTextOutline(f.text);
    if (opml && !origin) origin = doc.flavor === "dynalist" ? "Dynalist" : "Workflowy or other OPML";
    if (!opml && !origin) origin = "Text outline";
    out.push({rel: "pages/" + m[1].split("/").map(s => s.replace(/%/g, "%25")).join("%2F") + ".md", text: outlineMarkdown(doc.nodes), mtime: f.mtime || 0});
  }
  return {files: out, origin};
}

/* ---------- one page, one row ---------- */
const WORD_CODE = {active: "1", someday: "2", maybe: "2", hold: "1", waiting: "3", wait: "3", done: "0", completed: "0",
  complete: "0", cancelled: "-", canceled: "-", person: "p", people: "p", org: "o", organisation: "o",
  organization: "o", context: "c", responsibility: "a", goal: "g", checklist: "8", template: "8",
  email: "m", "e-mail": "m", review: "r", note: "z", verb: "verbs", horizon: "_"};
const GROUP_CODE = {"1": "1", "2": "2", "3": "3", "0": "0", "-": "-", p: "p", o: "o", c: "c", a: "a", g: "g",
  _: "_", "8": "8", m: "m", r: "r", z: "z", verbs: "verbs", "&": "p", ppl: "p", pc: "c", home: "c",
  "pr/m": "2", "pr/s": "2", "pr/xc": "0", "pr/a": "1", "pr/x": "0", "pr/c": "-"};
const CODE_KIND = {"1": "1", "2": "2", "3": "3", "0": "0", "-": "-", p: "p", o: "o", c: "c", a: "a", g: "g",
  _: "h5", "8": "8", m: "m", r: "r", z: "z", verbs: "skip"};
const CODE_STATUS = {"0": "completed", "1": "active", "2": "someday", "3": "waiting", "-": "cancelled"};
// Not page types: they describe a page, whatever it is.
const NOT_TYPES = /^(alias(es)?|title|settings|pri\d*|area|area_name|updated_by|author)$/;

/* The type signal of a tag or property, or null when it is none.
   Instance data (updated_by, email, wr, stakeholders …) is not a type. */
function codeOf(which, key) {
  const k = lc(key).trim();
  if (which === "groups") return GROUP_CODE[k] || null;
  if (/%/.test(k) || NOT_TYPES.test(k)) return null;
  const m = /^(status|type|category|template_source|template)\s*:\s*(.+)$/.exec(k);
  if (!m) return /: /.test(k) ? null : (WORD_CODE[k] || null);
  const v = m[2];
  if (m[1] === "template_source") {
    const t = /(?:^|\/)8\/([^/]+?)(?:\.md)?$/.exec(v);
    return t ? (t[1] === "page" ? "8" : GROUP_CODE[t[1]] || null) : null;
  }
  if (m[1] === "status") return /^[0-3-]/.test(v) ? v[0] : WORD_CODE[v.split(/\W+/)[0]] || null;
  return WORD_CODE[v.split(/\W+/)[0]] || null;
}

/* The one row a page belongs to. Strongest first: an unfilled template,
   status, a type tag, the template it was made from, the namespace or
   folder. What none of them names is a plain page. Sets p.row (the row's
   key), p.code, p.signal (its label in the row) and p.via. */
function classify(p) {
  const text = String(p.file && p.file.text || "");
  const tagCode = test => { for (const t of p.tags) if (test(t)) { const c = codeOf("tags", t); if (c) return [c, t]; } return null; };
  const groupCode = codeOf("groups", p.group);
  p.groupCode = groupCode;
  let code = null, signal = "", via = "tag", hit;
  if (p.group === "8") { code = "8"; signal = "8/"; via = "group"; }
  else if (/%(title|status)%/.test(text) || /(^|\/)_[^/ ]+_for /.test(p.name)) { code = "8"; }
  else if ((hit = tagCode(t => /^status:/.test(t)))) { code = hit[0]; signal = "status: " + CODE_STATUS[code]; }
  else if ((hit = tagCode(t => !/^(status|template_source):/.test(t)))) { code = hit[0]; signal = "#" + hit[1]; }
  else if ((hit = tagCode(t => /^template_source:/.test(t)))) { code = hit[0]; }
  else if (groupCode) { code = groupCode; signal = p.group + "/"; via = "group"; }
  if (code) { p.code = code; p.row = code; }
  else if (p.group) { p.code = null; p.row = "g:" + p.group; signal = p.group + "/"; via = "group"; }
  else { p.code = null; p.row = ""; via = ""; }
  p.signal = signal; p.via = via;
}

const isSampleName = n => !/%|^test$/i.test(n) && !/(^|\/)_[^/ ]+_for /.test(n);

/* One row per kind of page; every page is in exactly one. */
function buildRows(A) {
  const byKey = new Map();
  for (const p of A.pages) {
    if (!byKey.has(p.row)) byKey.set(p.row, {key: p.row, code: p.code, n: 0, pages: [], signals: new Map()});
    const r = byKey.get(p.row); r.n++; r.pages.push(p);
    if (p.signal) r.signals.set(p.signal, (r.signals.get(p.signal) || 0) + 1);
  }
  const rows = [...byKey.values()];
  for (const r of rows) {
    const good = r.pages.filter(p => isSampleName(p.name)), pool = good.length ? good : r.pages;
    r.ex = pool.slice(0, 3).map(p => p.name);
    r.label = r.key === "" ? "(No type signal)"
      : [...r.signals].sort((x, y) => y[1] - x[1]).map(x => x[0]).join(", ") || CODE_STATUS[r.code] || r.key;
  }
  return rows.sort((x, y) => (x.key === "") - (y.key === "") || y.n - x.n);
}

/* Each row starts as what its code means; a namespace nobody knows starts as a plain page. */
function startRowRules(rows) {
  const rules = {groups: {}, tags: {}, rows: {}};
  for (const r of rows) rules.rows[r.key] = r.code ? CODE_KIND[r.code] : "page";
  return rules;
}
// Links to a namespace follow the row its pages are in.
function syncGroups(A, rules) {
  rules.groups = {};
  for (const p of A.pages) if (p.group && (p.via === "group" || p.groupCode)) rules.groups[p.group] = rules.rows[p.row] || "page";
}

window.GTDImport = {outlineFiles, buildRows, startRowRules, syncGroups, analyze, ruleChoices, placePages, convert, reportText, dateOf, startRules, readFrontMatter};

/* ============================================================
   THE PAGE
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
};
const S = {source: null, files: [], analysis: null, rules: {groups: {}, tags: {}, rows: {}}, rows: [], result: null, opts: null, target: null};

const themeBtn = $("#theme");
themeBtn.onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

if (!window.showDirectoryPicker) {
  $("#s1").append(el("div", {class: "msg err"},
    "This browser cannot open folders. Open this file in Microsoft Edge or Google Chrome on a computer."));
  $("#pickSource").disabled = true;
  $("#pickTarget").disabled = true;
}

const unlock = (...ids) => ids.forEach(id => $(id).classList.remove("off"));

/* Every file under the folder, text read for markdown, a handle kept for the rest. */
async function readTree(dir) {
  const files = [];
  const walk = async (h, prefix) => {
    for await (const [name, child] of h.entries()) {
      const rel = prefix ? prefix + "/" + name : name;
      if (child.kind === "directory") {
        if (name === ".git" || name === "node_modules") continue;
        await walk(child, rel);
      } else if (/\.(md|opml|txt)$/i.test(name)) {
        const f = await child.getFile();
        files.push({rel, text: await f.text(), mtime: f.lastModified, handle: child});
      } else {
        files.push({rel, handle: child, mtime: 0});
      }
    }
  };
  await walk(dir, "");
  return files;
}

/* The filesystem already says which app made the vault. */
function detectKind(files) {
  if (files.some(f => f.rel.startsWith(".obsidian/"))) return "obsidian";
  if (files.some(f => f.rel.startsWith("logseq/")) ||
      (files.some(f => f.rel.startsWith("journals/")) && files.some(f => f.rel.startsWith("pages/")))) return "logseq";
  return "obsidian";
}

/* ---------- reading the obvious from the vault ---------- */
// The most common value of a page property, e.g. updated_by:: kenneth aar.
function commonProp(files, keys) {
  const count = new Map();
  const re = new RegExp("^\\s*(?:[-*+]\\s+)?(?:" + keys + ")\\s*::?\\s*(.+)$", "gim");
  for (const f of files) {
    if (!f.text) continue;
    for (const m of f.text.matchAll(re)) {
      const v = m[1].trim().replace(/^["'\[]+|["'\]]+$/g, "");
      if (v && v.length < 40 && !/[%@]/.test(v)) count.set(v, (count.get(v) || 0) + 1);
    }
  }
  return [...count].sort((a, b) => b[1] - a[1])[0]?.[0] || "";
}
const titleCase = s => s.replace(/\p{L}[\p{L}\p{N}'’-]*/gu, w => w[0].toUpperCase() + w.slice(1).toLowerCase());

$("#pickSource").onclick = async () => {
  let dir;
  try { dir = await window.showDirectoryPicker({mode: "read", id: "gtd-import-source"}); }
  catch (e) { if (e.name !== "AbortError") $("#sourceInfo").textContent = "Could not open it: " + e.message; return; }
  $("#sourceInfo").textContent = "Reading " + dir.name + "…";
  try { S.files = await readTree(dir); }
  catch (e) { $("#sourceInfo").textContent = "Could not read it: " + e.message; return; }
  S.source = dir;
  analyzeNow();
};

function analyzeNow() {
  // Dynalist and Workflowy folders hold outlines, not notes: read them as pages.
  const outline = S.files.some(f => /\.opml$/i.test(f.rel)) && !S.files.some(f => /\.md$/i.test(f.rel));
  let origin = "";
  if (outline) { const o = outlineFiles(S.files); S.files = o.files; origin = o.origin; }
  const A = S.analysis = analyze(outline ? "logseq" : detectKind(S.files), S.files);
  A.origin = origin;
  S.result = null;
  const md = S.files.filter(f => /\.md$/i.test(f.rel)).length;
  const left = md - A.pages.length - [...A.journals.values()].flat().length;
  $("#sourceInfo").replaceChildren("✓ ", el("b", {}, origin || (A.kind === "logseq" ? "Logseq" : "Obsidian")), outline ? " export: " : " vault: ",
    A.journals.size + " day pages, " + A.pages.length + " pages, " + A.assets.length + " other files" +
    (left > 0 ? " (" + left + " skipped)" : ""));

  const owner = commonProp(S.files, "updated_by|author");
  if (owner && !$("#me").value) $("#me").value = titleCase(owner);
  const area = lc(commonProp(S.files, "area|area_name"));
  let hit = [...$("#area").options].find(o => o.value && lc(o.value) === area);
  if (!hit && area) { hit = el("option", {value: titleCase(area)}, titleCase(area)); $("#area").append(hit); }
  $("#area").value = hit ? hit.value : "?";
  $("#who").hidden = false;

  S.rows = buildRows(A);
  S.rules = startRowRules(S.rows);
  syncGroups(A, S.rules);
  drawRules();
  unlock("#s2", "#s3");
  update();
}

function kindSelect(value, onchange) {
  const s = el("select", {onchange: e => onchange(e.target.value)},
    ...KINDS.map(([k, , label]) => el("option", {value: k}, label)));
  s.value = value;
  return s;
}

function drawRules() {
  const host = $("#rules");
  const auto = S.rows.filter(r => r.code).length;
  $("#autoCount").textContent = "(auto-matched " + auto + " of " + S.rows.length + ")";
  host.replaceChildren(el("div", {class: "tablewrap"}, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Detected signals"), el("th", {}, "Pages"), el("th", {}, "Becomes"))),
    el("tbody", {}, ...S.rows.map(r => el("tr", {},
      el("td", {}, el("b", {}, r.label), el("span", {class: "ex"}, r.ex.join(" · "))),
      el("td", {class: "num"}, String(r.n)),
      el("td", {}, kindSelect(S.rules.rows[r.key], v => {
        S.rules.rows[r.key] = v;
        syncGroups(S.analysis, S.rules);
        update();
      }))))))));
}

/* Contexts an @word may become: pages filed as contexts, plus the usual ones. */
const STANDARD_CONTEXTS = ["home", "office", "pc", "phone", "computer", "errands", "anywhere"];
function contextWords(placed) {
  const set = new Set(STANDARD_CONTEXTS);
  for (const p of placed) if (p.ref.startsWith("c/")) set.add(lc(p.title));
  return set;
}

const GROUP_LABEL = {projects: "Projects", p: "People", o: "Organisations", c: "Contexts", page: "Pages"};
function countsText(placed) {
  const n = {};
  for (const p of placed) {
    const g = ["1", "2", "3", "0", "-"].includes(p.kind) ? "projects" : (p.kind in GROUP_LABEL ? p.kind : "page");
    n[g] = (n[g] || 0) + 1;
  }
  return Object.entries(n).map(([k, v]) => v + " " + GROUP_LABEL[k]).join(", ");
}

/* Everything on the page that depends on the answers, recomputed on every change. */
function update() {
  S.result = null;
  const A = S.analysis;
  if (!A) return;
  const placed = placePages(A, S.rules);
  $("#summary").textContent = "Ready to write: " + (countsText(placed) || "nothing") +
    (A.journals.size ? ", and " + A.journals.size + " day pages." : ".");
  gate();
}
function gate() {
  const ok = S.analysis && $("#me").value.trim() && $("#area").value !== "?" && S.target;
  $("#write").disabled = !ok;
}
$("#me").oninput = gate;
$("#area").onchange = gate;

/* The full conversion runs only when it is needed: the diff dialog and the write. */
function convertNow() {
  const placed = placePages(S.analysis, S.rules);
  const opts = {me: $("#me").value.trim() || "Me", area: $("#area").value === "?" ? "" : $("#area").value,
    rules: S.rules, archiveYears: 0, atContext: contextWords(placed)};
  const res = convert(S.analysis, opts);
  S.result = res; S.opts = opts;
  return res;
}

$("#showDiff").onclick = () => {
  let res;
  try { res = convertNow(); }
  catch (e) { $("#preview").replaceChildren(el("div", {class: "msg err"}, "The conversion stopped: " + e.message)); $("#diff").showModal(); console.error(e); return; }
  drawPreview(res);
  $("#diff").showModal();
};
$("#diffClose").onclick = () => $("#diff").close();

function drawPreview(res) {
  const R = res.report;
  const issues = el("ul", {class: "issues"});
  const add = (text, list) => issues.append(el("li", {}, text,
    list && list.length ? el("details", {}, el("summary", {}, "Show " + list.length), el("pre", {}, list.slice(0, 200).join("\n"))) : null));
  if (R.skipped.length) add(R.skipped.length + " file(s) skipped.", R.skipped);
  if (R.blockRefsMissing.length) add(R.blockRefsMissing.length + " block reference(s) point at nothing.", R.blockRefsMissing);
  if (R.queries.length) add(R.queries.length + " query/queries carried over as live lists.", R.queries);
  if (R.assetsMissing.size) add(R.assetsMissing.size + " attachment link(s) point at a missing file.", [...R.assetsMissing]);
  if (R.merged.length) add(R.merged.length + " page(s) made from more than one file.", R.merged);
  if (R.oddFrontMatter.length) add(R.oddFrontMatter.length + " page(s) with front matter only partly read.", R.oddFrontMatter);
  if (R.plainRoots.length) add(R.plainRoots.length + " plain page(s) start like a GroupToDo folder letter.", R.plainRoots);
  if (!issues.children.length) issues.append(el("li", {class: "ok"}, "Nothing needs a look."));

  const pairs = [];
  for (const p of res.placed) pairs.push([p.out, p.file.text, p.file.rel]);
  const me = cleanName(S.opts.me).slice(0, 40);
  for (const [date, files] of S.analysis.journals) pairs.push([res.root + "journals/" + me + "/" + date + ".md", files.map(f => f.text).join("\n"), files.map(f => f.rel).join(" + ")]);
  pairs.sort((x, y) => x[0].localeCompare(y[0]));
  const before = el("pre"), after = el("pre"), from = el("div", {style: "font-size:12px;color:var(--fg3);margin-top:4px"});
  const pick = el("select", {onchange: e => show(e.target.value), style: "width:100%"},
    ...pairs.map(([o], i) => el("option", {value: String(i)}, o)));
  const show = i => {
    const [o, src, rel] = pairs[+i] || [];
    before.textContent = src || ""; after.textContent = res.files.get(o) || "";
    from.textContent = rel ? "From " + rel : "";
  };
  let best = 0, bestN = -1;
  pairs.forEach(([o], i) => { const n = ((res.files.get(o) || "").match(/^\s*- (TODO|DONE|DOING|WAIT)/gm) || []).length; if (n > bestN) { bestN = n; best = i; } });
  pick.value = String(best);
  show(best);

  $("#preview").replaceChildren(issues, pick, from,
    el("div", {class: "compare", style: "margin-top:8px"},
      el("div", {}, el("h3", {}, "Before"), before),
      el("div", {}, el("h3", {}, "After"), after)));
}

$("#report").onclick = () => {
  if (!S.result) return;
  const blob = new Blob([reportText(S.analysis, S.result, S.opts)], {type: "text/markdown"});
  const a = el("a", {href: URL.createObjectURL(blob), download: "GroupToDo import log.md"});
  document.body.append(a); a.click(); a.remove();
};

/* The target has to be empty: converting over something that is already
   there is how two vaults end up mixed into one. Checked when it is chosen. */
$("#pickTarget").onclick = async () => {
  const info = $("#targetInfo");
  S.target = null; gate();
  let dir;
  try { dir = await window.showDirectoryPicker({mode: "readwrite", id: "gtd-import-target"}); }
  catch (e) { if (e.name !== "AbortError") info.textContent = "Could not open it: " + e.message; return; }
  try { if (S.source && await S.source.isSameEntry(dir)) { info.textContent = "That is the old vault itself. Choose a new, empty folder."; return; } } catch (_) {}
  const there = [];
  for await (const [name] of dir.entries()) if (!/^(\.|desktop\.ini$|thumbs\.db$)/i.test(name)) there.push(name);
  if (there.length) { info.textContent = "Not empty (" + there.slice(0, 4).join(", ") + (there.length > 4 ? ", …" : "") + "). Choose a new folder."; return; }
  S.target = dir;
  info.textContent = "✓ " + dir.name;
  gate();
};

$("#write").onclick = async () => {
  const outBox = $("#writeOut"), dir = S.target;
  if (!dir) return;
  let res;
  try { res = convertNow(); }
  catch (e) { outBox.replaceChildren(el("div", {class: "msg err"}, "The conversion stopped: " + e.message)); console.error(e); return; }
  $("#write").disabled = true;
  const total = res.files.size + res.assets.length;
  const bar = el("i"), label = el("div", {style: "font-size:13px;color:var(--fg2)"});
  outBox.replaceChildren(el("div", {class: "progress"}, bar), label);
  const dirs = new Map();
  const dirFor = async path => {
    const parts = path.split("/").slice(0, -1);
    let h = dir, sofar = "";
    for (const p of parts) {
      sofar = sofar ? sofar + "/" + p : p;
      if (!dirs.has(sofar)) dirs.set(sofar, await h.getDirectoryHandle(p, {create: true}));
      h = dirs.get(sofar);
    }
    return h;
  };
  const put = async (path, data) => {
    const d = await dirFor(path);
    const fh = await d.getFileHandle(path.split("/").pop(), {create: true});
    const w = await fh.createWritable();
    await w.write(data); await w.close();
  };
  let done = 0;
  const failed = [];
  const step = what => { done++; bar.style.width = Math.round(done / total * 100) + "%"; label.textContent = done + " of " + total + " — " + what; };
  for (const [path, text] of res.files) {
    try { await put(path, text); } catch (e) { failed.push(path + ": " + e.message); }
    step(path);
  }
  for (const {file, out} of res.assets) {
    try { await put(out, await file.handle.getFile()); } catch (e) { failed.push(out + ": " + e.message); }
    step(out);
  }
  $("#report").hidden = false;
  outBox.append(failed.length
    ? el("div", {class: "msg warn"}, failed.length + " file(s) could not be written:", el("pre", {style: "white-space:pre-wrap;font:12px var(--mono)"}, failed.join("\n")))
    : el("div", {class: "msg ok"},
        "Done: " + res.files.size + " pages and " + res.assets.length + " attachments written to “" + dir.name + "”. ",
        "In GroupToDo choose ", el("b", {}, "Vault & sync → Connect folder"), " and point it at that folder."));
};
</script>
